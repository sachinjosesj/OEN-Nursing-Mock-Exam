nt this is a normal side effect of Rifampin and to keep taking the medications", "Administer a dose of Vitamin B6 (Pyridoxine) to counteract the jaundice", "Instruct the patient to drink more water to flush the medications out of the kidneys"], "a": 0, "r": "Rifampin, INH, and Pyrazinamide are all highly hepatotoxic. While Rifampin normally turns urine and tears orange, it does NOT turn the skin/sclera yellow. Yellow skin (jaundice) indicates severe, potentially fatal drug-induced liver failure. The drugs must be stopped immediately and liver enzymes drawn."}, {"d": 0, "q": "The nurse is preparing to administer an intravenous push (IVP) medication. The patient has a continuous IV infusion of Normal Saline running. The nurse determines that the IVP medication is physically INCOMPATIBLE with the continuous fluid. The patient only has one IV line. What is the correct sequence of actions?", "o": ["Stop the continuous fluid, flush the line with 10 mL of normal saline, administer the IVP medication, flush the line again with 10 mL of normal saline, and restart the continuous fluid", "Inject the IVP medication directly into the lowest port as fast as possible to minimize contact time with the incompatible fluid", "Start a completely new peripheral IV line; incompatible medications can never be given through the same catheter", "Mix the IVP medication with 50 mL of sterile water before injecting it into the line"], "a": 0, "r": "When a medication is incompatible with a running IV fluid, the nurse must 'sandwich' the medication between flushes. The pump is stopped, the line is flushed with a compatible fluid (usually saline) to clear the tubing, the medication is given, the line is flushed again to clear the medication, and then the pump is restarted."}, {"d": 0, "q": "A patient with severe dysphagia following a stroke is prescribed several oral medications. The nurse receives an order for extended-release (ER) Metoprolol. The patient has a nasogastric tube (NGT) in place. What is the nurse's priority action?", "o": ["Contact the pharmacy and the prescribing physician to request the medication be changed to an immediate-release or liquid formulation", "Crush the ER tablet finely, dissolve it in 30 mL of warm water, and administer it down the NGT", "Hold the medication entirely until the patient can swallow pills again", "Administer the pill whole down the NGT and flush vigorously with 50 mL of water"], "a": 0, "r": "Extended-release (ER/XR/SR) or sustained-release medications are specifically formulated to release the drug slowly over 12-24 hours. Crushing them destroys this mechanism, causing the entire dose to be released instantly (dose dumping), which can lead to a fatal overdose. The nurse MUST request an alternative formulation."}, {"d": 0, "q": "The nurse is preparing to administer an intramuscular (IM) injection of a highly irritating medication (e.g., Iron Dextran) using the Z-track method. After injecting the medication and leaving the needle in place for 10 seconds, what is the correct sequence for withdrawing the needle?", "o": ["Withdraw the needle smoothly and then immediately release the traction on the skin", "Release the traction on the skin first, and then withdraw the needle", "Withdraw the needle and aggressively massage the site for 30 seconds", "Withdraw the needle and leave the skin pulled tight for 5 minutes"], "a": 0, "r": "In the Z-track method, the skin is pulled laterally before injection. After injecting the drug and waiting 10 seconds (to allow the medication to disperse), the nurse MUST withdraw the needle FIRST, and then immediately release the skin. Releasing the skin creates the 'zigzag' path that traps the medication deep in the muscle, preventing it from tracking back up and burning the subcutaneous tissue."}, {"d": 0, "q": "A patient with a peripherally inserted central catheter (PICC) requires a routine dressing change. The nurse notes the patient is highly confused and unable to turn their head away from the insertion site. How should the nurse proceed to maintain maximum sterility?", "o": ["Place a surgical mask on the patient to prevent their respiratory droplets from contaminating the exposed site", "Ask a colleague to hold the patient's head facing forward", "Perform the dressing change as quickly as possible without masking the patient", "Apply a heavy blanket over the patient's face"], "a": 0, "r": "During a central line dressing change, the absolute priority is preventing CLABSI (Central Line-Associated Bloodstream Infection). The patient should ideally turn their head away. If they cannot (due to confusion, neck injury, or being on a ventilator), a surgical mask MUST be placed over the patient's nose and mouth to physically block their breath/droplets from contaminating the exposed catheter site."}, {"d": 0, "q": "The nurse is preparing to access an implanted venous port for a blood draw. The nurse palpates the port septum, cleans the skin with chlorhexidine, and prepares to insert the needle. What specific technique MUST the nurse use to stabilize the port during insertion?", "o": ["Stabilize the port by firmly holding the edges with the non-dominant thumb and index finger (a 'V' or 'U' shape) against the chest wall while inserting the needle perpendicular to the septum", "Pinch the skin directly over the center of the port to create a tent before inserting the needle", "Ask the patient to hold their breath and push their chest outward to stabilize the port naturally", "Use a sterile clamp to hold the port in place to prevent the nurse from accidentally sticking themselves"], "a": 0, "r": "Implanted ports can easily flip or roll under the skin if not stabilized. The nurse MUST use their non-dominant hand to firmly grasp the edges of the port reservoir (creating a 'U' or 'V' shape with their fingers), pushing it firmly against the chest wall fascial layer. The Huber needle is then inserted at a strict 90-degree angle perfectly perpendicular to the septum until it hits the metal backplate."}, {"d": 0, "q": "A patient with severe dysphagia requires the administration of a crushed enteric-coated aspirin and an extended-release potassium tablet down a percutaneous endoscopic gastrostomy (PEG) tube. What is the nurse's mandatory ethical and professional action?", "o": ["Hold the medications and immediately contact the prescribing provider or pharmacist to request alternative formulations (e.g., immediate-release, liquid, or chewable) that can be safely crushed", "Crush both tablets finely, dissolve them in 50 mL of warm water, and administer them very slowly over 10 minutes", "Administer the enteric-coated aspirin whole to prevent stomach ulcers, but crush the potassium", "Crush both medications and mix them with the patient's enteral tube feeding formula"], "a": 0, "r": "Enteric-coated (EC) and extended-release (ER/XR/SR) tablets must NEVER be crushed. Crushing an EC pill destroys its protective layer, exposing the stomach mucosa to severe caustic damage. Crushing an ER pill instantly destroys its slow-release matrix, causing the entire 24-hour dose to be absorbed immediately ('dose dumping'), resulting in a fatal overdose. The provider must change the order."}, {"d": 0, "q": "A nurse is preparing to clean up a chemotherapy spill on the oncology unit. Which personal protective equipment (PPE) combination is MANDATORY for handling hazardous drug spills?", "o": ["Double chemo-tested gloves, a fluid-resistant gown, a NIOSH-approved respirator, and eye protection/face shield", "Single pair of clean examination gloves and a standard surgical mask", "Sterile surgical gloves and a cloth gown", "Clean gloves, a cloth apron, and safety glasses"], "a": 0, "r": "Hazardous drugs (chemotherapy) pose severe occupational risks (carcinogenic, teratogenic). Cleaning a spill requires specialized hazardous drug PPE: two pairs of chemotherapy-tested gloves (outer over gown cuff), a disposable fluid-resistant gown, eye/face protection (goggles/face shield), and a NIOSH-approved respirator."}, {"d": 0, "q": "A patient with an indwelling urinary catheter is scheduled for catheter removal. How should the nurse perform this procedure safely to prevent urethral trauma?", "o": ["Attach a syringe to the balloon inflation port, allow the water to drain passively until the balloon is fully deflated, and gently pull the catheter out", "Cut the inflation port with scissors and rapidly pull the catheter out", "Pull the catheter out forcefully without deflating the balloon", "Inject 10 mL of air into the balloon before pulling the catheter"], "a": 0, "r": "To safely remove a Foley catheter without causing catastrophic urethral tearing, the nurse must attach a syringe to the balloon port and allow the fluid to drain completely by gravity/passive suction until the balloon is 100% empty. Never cut the port with scissors, and never pull against resistance."}, {"d": 0, "q": "A patient is undergoing a thoracentesis at the bedside to relieve a massive pleural effusion. How should the nurse position the patient during the procedure?", "o": ["Sitting on the edge of the bed, leaning forward over a bedside table supported by pillows", "Supine with the head of the bed elevated 90 degrees", "Prone with a pillow placed under the abdomen", "Side-lying on the affected side with arms extended"], "a": 0, "r": "The optimal position for a thoracentesis is sitting upright on the edge of the bed and leaning forward over an overbed table with arms resting on pillows. This position widens the intercostal spaces and allows gravity to pull the pleural fluid down to the base of the pleural cavity for safe drainage."}, {"d": 0, "q": "A nurse is preparing to administer ear drops to a 45-year-old adult patient. How should the nurse manipulate the pinna (auricle) to properly straighten the ear canal?", "o": ["Pull the pinna UP and BACK", "Pull the pinna DOWN and BACK", "Pull the pinna straight DOWN", "Push the tragus inward over the ear canal"], "a": 0, "r": "In adults and children older than 3 years of age, the auditory canal slopes downward and forward. To straighten the canal for proper ear drop instillation, the nurse must pull the pinna UP and BACK. (For infants and children under 3, the pinna is pulled DOWN and BACK)."}, {"d": 0, "q": "A nurse commits an error by administering a medication to the wrong patient. The patient suffers no adverse effects. What is the nurse's immediate ethical and institutional obligation?", "o": ["Assess the patient, notify the physician, inform the patient, and complete an institutional incident/occurrence report", "Document the correct dose in the medical record and say nothing to avoid unnecessary panic", "Notify the physician but do not fill out an incident report if the patient is unharmed", "Fill out an incident report and place a copy inside the patient's permanent medical chart"], "a": 0, "r": "Patient safety and honesty (veracity) require immediate patient assessment, physician notification, full disclosure to the patient, and completing an internal incident report. Incident reports are internal risk-management tools and must NEVER be placed in or mentioned in the medical record."}, {"d": 0, "q": "The nurse is administering an eye drop (ophthalmic solution) to a patient. After instilling the drop into the conjunctival sac, what specific technique must the nurse perform to prevent systemic absorption of the medication?", "o": ["Apply gentle pressure to the nasolacrimal duct (inner canthus) for 1 to 2 minutes", "Instruct the patient to squeeze their eyes shut tightly for 30 seconds", "Wipe the eye from outer canthus to inner canthus with a cotton ball", "Gently rub the eyelid in a circular motion for 1 minute"], "a": 0, "r": "Applying gentle pressure to the nasolacrimal duct (nasolacrimal occlusion/inner canthus pressure) for 1 to 2 minutes prevents the eye drop from draining into the nasal mucosa and being systemically absorbed into the bloodstream. This is especially vital for beta-blockers like Timolol to prevent bradycardia."}, {"d": 0, "q": "A nurse is preparing to administer a cleansing enema to an adult patient. How should the nurse position the patient, and how far should the enema tube be inserted into the rectum?", "o": ["Left Sim's position (left side-lying with right knee flexed); insert tube 3 to 4 inches (7.5 to 10 cm) toward the umbilicus", "Right side-lying position; insert tube 1 to 2 inches (2.5 to 5 cm)", "High-Fowler's position; insert tube 6 inches (15 cm)", "Prone position; insert tube 5 inches (12.5 cm)"], "a": 0, "r": "The left Sim's position allows enema solution to flow downward by gravity into the sigmoid colon and descending colon. The tube should be inserted 3 to 4 inches (7.5 to 10 cm) in an adult, angled toward the umbilicus to follow the natural contour of the rectum."}, {"d": 0, "q": "The nurse is preparing to instill eye ointment (ophthalmic medication) into an adult patient. How should the nurse apply the ointment?", "o": ["Apply a thin ribbon of ointment along the inner edge of the lower conjunctival sac, moving from the inner canthus to the outer canthus", "Apply a drop of ointment directly onto the sensitive cornea", "Rub the ointment gently over the closed upper eyelid", "Apply the ointment from the outer canthus toward the inner canthus"], "a": 0, "r": "Eye medications must be instilled into the lower conjunctival sac (never directly onto the sensitive cornea). Ointment is applied in a thin ribbon along the conjunctival sac from the inner canthus outward to the outer canthus to maintain sterility and prevent contamination."}, {"d": 0, "q": "A nurse is preparing to suction a patient's tracheostomy tube. What is the maximum recommended duration for a single suction pass to prevent severe hypoxemia?", "o": ["10 to 15 seconds", "30 to 45 seconds", "1 to 2 minutes", "5 seconds"], "a": 0, "r": "Suctioning removes oxygen as well as secretions. To prevent severe hypoxemia, cardiac arrhythmias, and tissue trauma, a single suction pass should NEVER exceed 10 to 15 seconds, and the patient must be pre-oxygenated (hyperoxygenated) with 100% oxygen before each pass."}, {"d": 0, "q": "A nurse is preparing to transfer a non-weight-bearing patient from the bed to a chair using a mechanical floor lift (Hoyer lift). What is the minimum number of trained staff members required to safely operate the mechanical lift?", "o": ["Two staff members", "One staff member", "Three staff members", "Four staff members"], "a": 0, "r": "Standard nursing safety protocols and OSHA ergonomics guidelines mandate that at least TWO trained staff members must be present to safely operate a mechanical patient lift (one to guide the lift/controls, one to support the patient)."}, {"d": 0, "q": "The nurse is administering a subcutaneous injection of Low-Molecular-Weight Heparin (Enoxaparin) to an obese patient. How should the nurse position the tissue and needle angle?", "o": ["Gently pinch a fold of abdominal tissue and insert the needle at a 90-degree angle", "Pull the skin completely taut using the Z-track method at a 15-degree angle", "Inject into the deltoid muscle at a 45-degree angle", "Massage the site vigorously after injecting at a 30-degree angle"], "a": 0, "r": "In an obese patient with abundant subcutaneous tissue, Enoxaparin is injected at a 90-degree angle into pinched abdominal tissue (at least 2 inches away from the umbilicus). The site must never be massaged after injection to prevent severe local hematoma formation."}, {"d": 1, "q": "A nurse manager wants to evaluate the highest level of evidence regarding the effectiveness of a nurse-led wound care protocol. Which study design provides the STRONGEST evidence?", "o": ["Systematic review and meta-analysis of randomized controlled trials (RCTs)", "Single randomized controlled trial", "Prospective cohort study", "Case-control study"], "a": 0, "r": "According to the hierarchy of evidence, systematic reviews and meta-analyses of multiple well-designed RCTs provide Level 1, the highest grade of evidence to guide clinical practice."}, {"d": 1, "q": "A researcher plans a study to compare a new diabetic education program against standard care. Participants are randomly assigned to either the intervention or control group. What is the primary purpose of randomization?", "o": ["To minimize selection bias and distribute confounding variables equally between groups", "To ensure that all participants receive the new intervention", "To eliminate the need for informed consent", "To guarantee statistical significance of the results"], "a": 0, "r": "Randomization ensures that every participant has an equal chance of being assigned to any group, thereby reducing selection bias and balancing both known and unknown confounding variables across groups."}, {"d": 1, "q": "A hospital epidemiologist investigates a group of healthcare workers exposed to a novel respiratory virus and follows them over 5 years to measure the development of chronic pulmonary complications. Which study design is being utilized?", "o": ["Prospective cohort study", "Retrospective case-control study", "Cross-sectional survey", "Randomized controlled trial"], "a": 0, "r": "A prospective cohort study identifies a group based on exposure status and follows them forward over time to measure the incidence of outcomes."}, {"d": 1, "q": "A nurse researcher investigates a rare neurological condition by identifying 50 affected patients and matching them with 100 healthy controls to compare past chemical exposures. Which study design is represented?", "o": ["Case-control study", "Randomized controlled trial", "Cross-sectional study", "Cohort study"], "a": 0, "r": "A case-control study starts with the outcome (cases vs controls) and looks backward in time (retrospectively) to assess exposure history. It is highly efficient for studying rare diseases."}, {"d": 1, "q": "A community health nurse conducts a survey measuring the proportion of adults in a municipality who currently have hypertension on a single day. Which epidemiological measure is being calculated?", "o": ["Prevalence", "Incidence", "Attack rate", "Relative risk"], "a": 0, "r": "Prevalence measures the total proportion of existing cases of a disease in a population at a specified point in time, whereas incidence measures the rate of NEW cases over time."}, {"d": 1, "q": "A new rapid diagnostic test for influenza correctly identifies 95 out of 100 patients WHO ACTUALLY HAVE the disease. What property of the diagnostic test does this 95% represent?", "o": ["Sensitivity", "Specificity", "Positive predictive value", "Reliability"], "a": 0, "r": "Sensitivity refers to the proportion of actual positive cases that are correctly identified by the test (true positive rate). A highly sensitive test reliably rules OUT a disease when negative (SNOUT)."}, {"d": 1, "q": "A screening test for cervical cancer correctly identifies 98 out of 100 women WHO DO NOT HAVE the disease as negative. What property does this 98% represent?", "o": ["Specificity", "Sensitivity", "Incidence", "Internal validity"], "a": 0, "r": "Specificity refers to the proportion of individuals without the disease who test negative (true negative rate). A highly specific test reliably rules IN a disease when positive (SPIN)."}, {"d": 1, "q": "During an outbreak of acute gastroenteritis following a hospital staff banquet, what is the FIRST epidemiological step the nurse should take?", "o": ["Confirm the clinical diagnosis and establish a clear case definition", "Close the hospital cafeteria immediately", "Administer prophylactic antibiotics to all banquet attendees", "Publish a press release regarding the outbreak"], "a": 0, "r": "The first step in an outbreak investigation is to verify the diagnosis through laboratory/clinical findings and establish a standardized operational case definition before counting cases."}, {"d": 1, "q": "A medical ward implements a Quality Improvement project using the Plan-Do-Study-Act (PDSA) cycle to reduce catheter-associated urinary tract infections. Which activity belongs to the 'Study' phase?", "o": ["Analyzing collected post-intervention infection data and comparing results against baseline", "Brainstorming new catheter care guidelines", "Implementing the new care protocol on one pilot unit", "Adopting the protocol hospital-wide as permanent policy"], "a": 0, "r": "In the PDSA cycle: Plan = plan the change; Do = test the change on a small scale; Study = analyze collected data and compare with predictions/baseline; Act = refine and implement policy based on findings."}, {"d": 1, "q": "A research tool designed to measure patient anxiety yields consistent scores when administered repeatedly to the same stable patient group under identical conditions. However, it actually measures general sadness rather than anxiety. How should this tool be described?", "o": ["Reliable but not valid", "Valid but not reliable", "Both reliable and valid", "Neither reliable nor valid"], "a": 0, "r": "Reliability refers to consistency and repeatability of measurements. Validity refers to accuracy in measuring what it purports to measure. Here, the tool is consistent (reliable) but inaccurate for anxiety (not valid)."}, {"d": 1, "q": "A nurse researcher is designing a study to test the effect of a new guided imagery protocol on pain levels in post-operative patients. In this study, what is the 'pain level'?", "o": ["The dependent variable", "The independent variable", "The confounding variable", "The control variable"], "a": 0, "r": "In research, the independent variable is the intervention being manipulated (guided imagery). The dependent variable is the outcome being measured (pain levels) that is expected to change as a result of the intervention."}, {"d": 1, "q": "Which core ethical principle of human subjects research requires that researchers ensure the benefits of the study outweigh the risks, and that no intentional harm comes to the participants?", "o": ["Beneficence and Nonmaleficence", "Justice", "Autonomy", "Fidelity"], "a": 0, "r": "Beneficence is the obligation to maximize possible benefits and minimize possible harms. Nonmaleficence is the obligation to do no intentional harm. These are core requirements assessed by Institutional Review Boards (IRBs)."}, {"d": 1, "q": "A nurse is reading a research article. The authors state that their results achieved a p-value of < 0.05. What does this indicate?", "o": ["The findings are statistically significant, meaning there is less than a 5% probability the results occurred by chance", "The findings are clinically insignificant and should be discarded", "The study has a 5% margin of error in its measurements", "The intervention was effective for 95% of the participants"], "a": 0, "r": "A p-value (probability value) of < 0.05 is the standard threshold for statistical significance. It means that there is less than a 5% likelihood that the observed results occurred purely by chance, suggesting the intervention likely caused the effect."}, {"d": 1, "q": "When evaluating qualitative research designs, which methodology focuses heavily on understanding the lived experiences of individuals who have gone through a specific phenomenon (e.g., losing a child)?", "o": ["Phenomenology", "Grounded Theory", "Ethnography", "Randomized Controlled Trial"], "a": 0, "r": "Phenomenology is a qualitative research approach that aims to describe, understand, and interpret the true 'lived experience' of individuals who have experienced a specific phenomenon."}, {"d": 1, "q": "A hospital nursing committee wants to implement a new evidence-based practice (EBP) protocol. According to the standard EBP steps, what is the VERY FIRST step they must take?", "o": ["Cultivate a spirit of inquiry and ask a clinical question in PICOT format", "Search the databases for relevant literature", "Appraise the evidence for validity", "Implement the protocol on a pilot unit"], "a": 0, "r": "The first step of the Evidence-Based Practice process is to identify the clinical problem, cultivate a spirit of inquiry, and formulate a clear, answerable clinical question, typically using the PICOT format (Patient/Population, Intervention, Comparison, Outcome, Time)."}, {"d": 1, "q": "A nurse is critically appraising a randomized controlled trial (RCT) assessing a new pressure ulcer prevention mattress. The researchers did not reveal to the patients OR the evaluating nurses which bed was the experimental mattress and which was the standard mattress. What methodology is this?", "o": ["Double-blind study", "Single-blind study", "Retrospective cohort", "Open-label trial"], "a": 0, "r": "A double-blind study means neither the participants (patients) nor the researchers/evaluators (nurses assessing the skin) know who is in the control group and who is in the experimental group. This prevents both subject bias and evaluator bias."}, {"d": 1, "q": "A group of nurses is conducting a systematic review of the literature to determine the best practice for preventing ventilator-associated pneumonia (VAP). They decide to include only studies that used a randomized controlled trial (RCT) design. Why are RCTs considered the 'gold standard' of primary research?", "o": ["They use random assignment to intervention and control groups, which minimizes bias and confounding variables, allowing for strong causal inferences", "They are the easiest and cheapest studies to conduct in a hospital setting", "They only utilize qualitative data, providing a deeper understanding of the patient experience", "They do not require ethical approval from an Institutional Review Board (IRB)"], "a": 0, "r": "Randomized Controlled Trials (RCTs) are the gold standard because the strict randomization process equally distributes both known and unknown confounding variables between the control and experimental groups. This isolation of the independent variable allows researchers to confidently state that the intervention *caused* the outcome."}, {"d": 1, "q": "A nurse researcher conducts a study and concludes that a new handwashing protocol significantly reduced infection rates. However, a later, massive national study proves the protocol actually had no effect at all. The nurse researcher's initial false conclusion is an example of what type of statistical error?", "o": ["Type I error (False Positive)", "Type II error (False Negative)", "Selection bias", "Hawthorne effect"], "a": 0, "r": "A Type I error (False Positive) occurs when a researcher incorrectly rejects the null hypothesis—meaning they claim their intervention worked when, in reality, it did not. (A Type II error is a false negative, failing to notice an intervention that actually worked)."}, {"d": 1, "q": "A nursing research committee is looking to update the hospital's protocol on central line care. They are evaluating a clinical practice guideline published by a major medical society. In the hierarchy of evidence, where do clinical practice guidelines fall?", "o": ["Near the top, as they are usually based on systematic reviews and meta-analyses of multiple rigorous studies", "At the very bottom, because they are merely the opinions of individual doctors", "In the middle, as they hold the same weight as a single qualitative study", "They are not considered evidence-based practice"], "a": 0, "r": "Clinical practice guidelines are highly respected because they are typically synthesized by expert panels who conduct exhaustive systematic reviews of all available high-level evidence (RCTs, meta-analyses) to formulate standardized, actionable recommendations for practice."}, {"d": 1, "q": "A nurse is preparing to conduct a research study on the psychological impacts of stillbirth on mothers. Before collecting any data, the nurse must submit the study proposal to the Institutional Review Board (IRB). What is the primary function of the IRB?", "o": ["To protect the rights, welfare, and safety of human subjects participating in the research", "To secure financial funding and grants for the research project", "To ensure the statistical methods used in the study are flawless", "To publish the final results of the study in a medical journal"], "a": 0, "r": "The Institutional Review Board (IRB) is an independent ethics committee. Its sole, primary mandate is to rigorously review research protocols to protect the rights, safety, dignity, and well-being of human subjects (e.g., ensuring informed consent, minimizing risk)."}, {"d": 1, "q": "A hospital committee is adopting a new clinical practice based on research. They are using the 'PICO' format to formulate their clinical question. What does the 'C' in PICO stand for?", "o": ["Comparison intervention", "Clinical outcome", "Control group", "Confidence interval"], "a": 0, "r": "In Evidence-Based Practice, PICO is used to format a searchable question: P (Patient, Population, or Problem), I (Intervention or exposure of interest), C (Comparison intervention or current standard of care), O (Outcome desired)."}, {"d": 1, "q": "A researcher is studying the effects of a new analgesic. Neither the patients nor the nurses administering the drug know whether the patient is receiving the real drug or a placebo. However, the lead researcher analyzing the data DOES know. What type of study design is this?", "o": ["Double-blind study", "Single-blind study", "Triple-blind study", "Open-label study"], "a": 0, "r": "In a double-blind study, two groups are 'blinded'—typically the participants (patients) and the direct clinicians (nurses/doctors administering the intervention). If the data analysts also didn't know, it would be triple-blind."}, {"d": 1, "q": "A nurse manager is evaluating a new screening tool for depression. The tool is found to correctly identify 98% of patients who truly have depression, but it also falsely identifies many healthy patients as depressed. How should the nurse describe this screening tool?", "o": ["High sensitivity, but low specificity", "High specificity, but low sensitivity", "High reliability, but low validity", "High positive predictive value"], "a": 0, "r": "Sensitivity is the ability of a test to correctly identify those WITH the disease (true positive rate). Specificity is the ability to correctly identify those WITHOUT the disease (true negative rate). Because this tool catches almost everyone with the disease (98%) but has many false positives, it is highly sensitive but poorly specific."}, {"d": 1, "q": "A nurse researcher is designing a study and wants to ensure that the findings can be applied to a larger population beyond just the people in the study. What research concept is the nurse trying to achieve?", "o": ["Generalizability (External Validity)", "Internal Validity", "Statistical Significance", "Reliability"], "a": 0, "r": "Generalizability (also known as External Validity) is the extent to which the results of a specific study can be accurately applied (generalized) to other people, settings, or times outside of the study sample. High external validity makes the research useful for widespread clinical practice."}, {"d": 1, "q": "A hospital uses the Plan-Do-Study-Act (PDSA) cycle to implement a new fall-prevention protocol. During which phase of the cycle will the staff actually collect the data on fall rates to see if the new protocol worked?", "o": ["The 'Study' phase", "The 'Plan' phase", "The 'Do' phase", "The 'Act' phase"], "a": 0, "r": "In the PDSA cycle, 'Plan' designs the change, 'Do' implements the change on a small scale, 'Study' strictly involves observing, measuring, and analyzing the collected data to see if the change worked, and 'Act' involves making the change permanent or tweaking it based on the data."}, {"d": 1, "q": "A hospital nursing committee wants to determine if turning patients every 2 hours actually prevents pressure ulcers better than turning them every 4 hours. They search the literature and find a massive study that combined the raw data from 50 different independent, randomized controlled trials on the subject and analyzed it statistically as one massive group. What is this type of study called?", "o": ["A Meta-Analysis", "A Qualitative Phenomenological Study", "A Retrospective Case-Control Study", "A Cross-Sectional Survey"], "a": 0, "r": "A Meta-Analysis sits at the absolute pinnacle of the evidence hierarchy. It is a systematic review that goes one step further by using advanced statistical methods to physically pool and combine the quantitative data from dozens of smaller, independent Randomized Controlled Trials (RCTs) to draw a massive, highly reliable conclusion."}, {"d": 1, "q": "A nurse researcher conducts a study testing a new blood pressure medication. The results show a p-value of 0.01. The nurse confidently rejects the null hypothesis. However, it is later discovered that the medication actually had NO effect, and the results were purely due to a flawed random sampling method. What type of statistical error did the researcher make?", "o": ["Type I Error (False Positive)", "Type II Error (False Negative)", "Type III Error", "Standard Error of the Mean"], "a": 0, "r": "A Type I error occurs when a researcher incorrectly rejects a true null hypothesis. In plain terms, it is a 'false positive'—claiming that an intervention worked or a difference exists, when in reality, it did not. (A Type II error is failing to detect a true difference, a 'false negative')."}, {"d": 1, "q": "A nurse researcher is conducting a study to understand the deep emotional trauma experienced by nurses working in COVID-19 intensive care units. The researcher conducts long, unstructured interviews with 15 nurses and analyzes their narratives for common themes. What type of research design is this?", "o": ["Qualitative Research", "Quantitative Research", "Randomized Controlled Trial", "Retrospective Cohort Study"], "a": 0, "r": "Qualitative research focuses on subjective, deeply personal human experiences, emotions, and meanings. It uses non-numerical data like open-ended interviews, narratives, and observations to find themes. Quantitative research focuses on hard numbers, statistics, and objective measurements."}, {"d": 1, "q": "A nurse researcher conducts a study observing the development of lung cancer over 20 years in two groups: one group of people who smoke and one group of people who do not smoke. What type of epidemiological study design is this?", "o": ["Prospective Cohort Study", "Retrospective Case-Control Study", "Randomized Controlled Trial", "Cross-Sectional Survey"], "a": 0, "r": "A Prospective Cohort Study identifies groups based on their exposure status (smokers vs. non-smokers) and follows them forward in time (prospectively) to see who develops the outcome (lung cancer)."}, {"d": 1, "q": "A nursing unit wants to implement a new evidence-based protocol. They find a high-quality Systematic Review that perfectly answers their clinical question. In the hierarchy of evidence, where does a Systematic Review rank compared to a single Randomized Controlled Trial (RCT)?", "o": ["A Systematic Review ranks HIGHER than a single RCT, because it rigorously synthesizes the results of multiple RCTs", "A Systematic Review ranks LOWER than a single RCT", "They rank exactly the same", "A Systematic Review is considered expert opinion and ranks at the bottom"], "a": 0, "r": "A single study (even an RCT) can have flaws or small sample sizes. A Systematic Review sits at the very top of the evidence hierarchy (alongside Meta-Analyses) because it exhaustively searches the literature, evaluates, and combines the results of DOZENS of rigorous independent RCTs to draw a highly reliable, definitive conclusion."}, {"d": 1, "q": "A nurse researcher is reading a peer-reviewed journal article. The abstract states that the study results yielded a 'p-value of < 0.05'. What does this statistical metric specifically indicate to the nurse?", "o": ["The results are statistically significant, meaning there is less than a 5% probability that the findings occurred purely by random chance", "The results are completely invalid and the study should be discarded", "The researchers made a 5% error in their mathematical calculations", "The intervention was highly effective for exactly 95% of the patients involved"], "a": 0, "r": "In inferential statistics, a p-value (probability value) of < 0.05 is the universal threshold for 'statistical significance.' It means that if the null hypothesis were true (that the intervention had no effect), there is less than a 5% chance of seeing these results purely by random variation. It strongly suggests the intervention actually caused the outcome."}, {"d": 1, "q": "A nurse researcher is designing a randomized controlled trial to test whether playing classical music in the neonatal intensive care unit (NICU) reduces the heart rates of premature infants. In this specific study, what is the 'classical music'?", "o": ["The independent variable", "The dependent variable", "The confounding variable", "The control variable"], "a": 0, "r": "In experimental research, the Independent Variable (IV) is the intervention, treatment, or condition that the researcher actively manipulates or introduces (the classical music). The Dependent Variable (DV) is the outcome that is measured to see if it changed as a result of the intervention (the infants' heart rates)."}, {"d": 1, "q": "A nursing committee is reviewing a study that utilized in-depth, unstructured interviews, focus groups, and personal diaries to deeply explore the complex emotional grief process of parents who lost a child to cancer. The data is presented as themes and narratives rather than numbers. What type of research methodology is this?", "o": ["Qualitative Research", "Quantitative Research", "A Meta-Analysis", "A Retrospective Cohort Study"], "a": 0, "r": "Qualitative research focuses exclusively on exploring and understanding human experiences, emotions, meanings, and social phenomena. It utilizes subjective data (words, interviews, narratives, focus groups) and analyzes them for overarching themes. Quantitative research relies on objective, numerical data and statistical analysis."}, {"d": 1, "q": "A hospital nursing committee is evaluating a new clinical practice guideline for preventing catheter-associated urinary tract infections (CAUTIs). The guideline states its recommendations are based on a 'Meta-Analysis.' In the hierarchy of evidence, what exactly is a Meta-Analysis?", "o": ["A massive statistical synthesis that pools the raw quantitative data from dozens of independent Randomized Controlled Trials (RCTs) to draw a highly reliable, definitive conclusion", "A deep, qualitative study exploring the lived experiences and emotions of patients who developed a CAUTI", "A retrospective review of a single hospital's chart data over the last 10 years", "An expert opinion paper written by the chief of urology at a major medical center"], "a": 0, "r": "A Meta-Analysis sits at the absolute pinnacle of the evidence hierarchy. It is a systematic review that goes one step further by using advanced statistical methods to physically pool and combine the quantitative data from dozens of smaller, independent Randomized Controlled Trials (RCTs) to draw a massive, highly reliable conclusion."}, {"d": 1, "q": "In Evidence-Based Practice (EBP), clinical questions are frequently structured using the PICO format. What does the 'P' in PICO represent?", "o": ["Patient, Population, or Problem", "Practice environment", "Protocol design", "Pharmacological agent"], "a": 0, "r": "PICO stands for: P = Patient, Population, or Problem of interest; I = Intervention or exposure; C = Comparison intervention; O = Outcome measured."}, {"d": 1, "q": "A nurse researcher is evaluating a study where neither the patients, the administering nurses, nor the data analysts knew which group received the active medication and which received the placebo. What is this research design called?", "o": ["Triple-blind study", "Double-blind study", "Single-blind study", "Open-label study"], "a": 0, "r": "A triple-blind study occurs when the participants, the clinicians administering the intervention, AND the data analysts/statisticians are all kept unaware of group assignments, completely eliminating observer, participant, and analytical bias."}, {"d": 1, "q": "A nurse researcher conducts a study where participants are randomly assigned to either a new wound care dressing group or a standard dressing group. What type of research design is this?", "o": ["Randomized Controlled Trial (RCT)", "Qualitative Study", "Case-Control Study", "Descriptive Survey"], "a": 0, "r": "A Randomized Controlled Trial (RCT) is an experimental design that uses random assignment of subjects to an intervention or control group to test cause-and-effect relationships."}, {"d": 1, "q": "A nurse researcher is comparing two groups in a study. One group is exposed to a risk factor (smoking) and the other is not. The researcher follows both groups forward in time for 10 years to measure the development of heart disease. What type of study design is this?", "o": ["Prospective Cohort Study", "Retrospective Case-Control Study", "Randomized Controlled Trial", "Cross-Sectional Study"], "a": 0, "r": "A Prospective Cohort Study tracks a group of exposed and unexposed individuals forward in time (prospectively) to compare the incidence of an outcome or disease."}, {"d": 1, "q": "A nurse researcher is setting the significance level (alpha level) for a quantitative clinical trial testing a new drug. What is the standard alpha level universally used in nursing and medical research to accept statistical significance?", "o": ["alpha = 0.05 (p < 0.05)", "alpha = 0.50 (p < 0.50)", "alpha = 0.10 (p < 0.10)", "alpha = 0.001 (p < 0.001)"], "a": 0, "r": "An alpha level of 0.05 (p < 0.05) is the standard threshold in biomedical research. It means there is a 5% or less probability that the study results occurred purely by random chance."}, {"d": 1, "q": "When appraising evidence for clinical practice guidelines, which study design provides higher-level evidence than a single cohort study?", "o": ["A Systematic Review of Randomized Controlled Trials (RCTs)", "A single expert opinion paper", "A qualitative case study", "A descriptive cross-sectional survey"], "a": 0, "r": "In the hierarchy of evidence, Systematic Reviews and Meta-Analyses of multiple Randomized Controlled Trials (RCTs) sit at Level I, the absolute highest level of evidence."}, {"d": 1, "q": "A human subjects research study requires informed consent. What core ethical principle ensures that participants voluntarily choose to enter or leave the study at any time without penalty?", "o": ["Autonomy", "Justice", "Nonmaleficence", "Beneficence"], "a": 0, "r": "Respect for Autonomy dictates that individuals have self-determination. In research, this means participation must be 100% voluntary, with the right to withdraw at any point."}, {"d": 1, "q": "A nurse researcher is studying the effect of early ambulation on post-operative ileus duration. The researcher uses a structured, numerical scale to measure hours to first bowel movement. What type of research data is this?", "o": ["Quantitative Data", "Qualitative Data", "Anecdotal Data", "Subjective Data"], "a": 0, "r": "Quantitative data involves objective, numerical measurements (e.g., hours, counts, scores) that can be analyzed statistically."}, {"d": 1, "q": "A nurse researcher conducts a study aiming to generate a new theoretical model explaining how family caregivers adapt to caring for a relative with end-stage dementia. The researcher collects and analyzes data simultaneously until theoretical saturation is reached. What specific qualitative methodology is this?", "o": ["Grounded Theory", "Phenomenology", "Ethnography", "Historical Research"], "a": 0, "r": "Grounded Theory is a qualitative methodology specifically designed to generate or derive a theory 'grounded' in data systematically gathered and analyzed through constant comparative analysis until category saturation occurs."}, {"d": 1, "q": "A nurse researcher is evaluating the consistency of a new clinical survey instrument. Which statistical metric measures internal consistency reliability, with a score of 0.70 or higher considered acceptable?", "o": ["Cronbach's alpha", "Pearson's r correlation coefficient", "Chi-square test statistic", "Analysis of Variance (ANOVA) p-value"], "a": 0, "r": "Cronbach's alpha is the standard statistical test used to evaluate the internal consistency reliability of a multi-item survey or assessment tool. An alpha coefficient of 0.70 to 0.80 or higher indicates good reliability."}, {"d": 1, "q": "During a research study observing hand hygiene compliance, healthcare workers significantly increased their hand washing frequency because they knew they were being directly watched by researchers. What methodological bias does this demonstrate?", "o": ["The Hawthorne Effect", "Selection bias", "Attritional bias", "Publication bias"], "a": 0, "r": "The Hawthorne Effect occurs when research subjects modify or improve their behavior simply because they are aware that they are being observed, rather than due to any experimental manipulation."}, {"d": 1, "q": "A nurse researcher conducts a study attempting to understand the deeply personal 'lived experience' of patients surviving sudden cardiac arrest. Which qualitative research methodology is specifically designed for this purpose?", "o": ["Phenomenology", "Ethnography", "Grounded Theory", "Historical research"], "a": 0, "r": "Phenomenology is a qualitative research approach aimed specifically at exploring, describing, and understanding the 'lived experience' and subjective meaning of a specific human phenomenon."}, {"d": 1, "q": "A nurse appraising a published Meta-Analysis reviews a graphical diagram displaying the individual effect sizes and confidence intervals of 12 included randomized trials, alongside a combined diamond representing the pooled effect size. What is this diagram called?", "o": ["A Forest Plot", "A Scatter Plot", "A Histogram", "A Funnel Plot"], "a": 0, "r": "A Forest Plot is the classic graphical representation used in Meta-Analyses to display the results of individual studies alongside the overall pooled effect estimate (represented by a diamond at the bottom)."}, {"d": 1, "q": "Which study design is considered a Level II non-randomized observational design in the hierarchy of evidence, where subjects with a specific condition are compared to subjects without the condition regarding past risk factor exposure?", "o": ["Retrospective Case-Control Study", "Randomized Controlled Trial", "Systematic Review", "Expert Consensus Opinion"], "a": 0, "r": "A Retrospective Case-Control Study compares individuals who already have an outcome/disease ('cases') to those who do not ('controls') to look back in time for differences in exposure to potential risk factors."}, {"d": 1, "q": "A hospital nursing council develops a new clinical practice guideline. What is the primary purpose of a Clinical Practice Guideline (CPG) in evidence-based practice?", "o": ["To provide systematically developed statements based on best current evidence to assist clinician and patient decisions about appropriate healthcare for specific clinical circumstances", "To legally mandate nursing actions without physician input", "To replace all clinical nursing judgment with automated algorithms", "To reduce hospital costs regardless of patient outcomes"], "a": 0, "r": "Clinical Practice Guidelines (CPGs) are systematically developed statements based on rigorous evidence reviews designed to help clinicians make informed, high-quality care decisions for specific conditions."}, {"d": 1, "q": "A nurse researcher compares two different pain scales in a study. The researcher demonstrates that Scale A accurately measures pain intensity rather than anxiety or sedation. What research property has been demonstrated?", "o": ["Construct Validity", "Test-retest Reliability", "Inter-rater Reliability", "Statistical Power"], "a": 0, "r": "Construct Validity refers to the degree to which an instrument or measurement tool actually measures the specific theoretical construct or trait it claims to measure (e.g., pain vs anxiety)."}, {"d": 2, "q": "A 58-year-old male presents to the ER with crushing retrosternal chest pain radiating to his left jaw and diaphoresis. Vital signs: BP 145/88 mmHg, HR 102 bpm, SpO2 96% on room air. After obtaining a 12-lead ECG, which medication should the nurse administer FIRST unless contraindicated?", "o": ["Chewed non-enteric coated Aspirin 162-325 mg", "Sublingual Nitroglycerin 0.4 mg", "IV Morphine Sulfate 2 mg", "Oral Metoprolol 25 mg"], "a": 0, "r": "In suspected Acute Coronary Syndrome (ACS), chewed Aspirin (162-325 mg) is the immediate priority intervention to rapidly inhibit platelet aggregation and reduce mortality, provided no allergy or active GI bleeding exists."}, {"d": 2, "q": "A patient presenting with acute chest pain has a 12-lead ECG showing ST-segment elevation in leads II, III, and aVF. Which wall of the heart and coronary artery are affected?", "o": ["Inferior wall / Right Coronary Artery (RCA)", "Anterior wall / Left Anterior Descending (LAD)", "Lateral wall / Left Circumflex (LCX)", "Posterior wall / Posterior Descending Artery"], "a": 0, "r": "ST elevation in leads II, III, and aVF indicates an Inferior Wall Myocardial Infarction, which is supplied by the Right Coronary Artery (RCA)."}, {"d": 2, "q": "A patient with severe left-sided heart failure presents with worsening dyspnea, orthopnea, bilateral lung crackles, and pink frothy sputum. SpO2 is 84%. What is the nurse's IMMEDIATE priority?", "o": ["Apply high-flow oxygen, position the patient upright in High Fowler's, and prepare IV Furosemide", "Place the patient flat in supine position and administer IV Normal Saline bolus", "Encourage the patient to perform incentive spirometry 10 times", "Administer oral digoxin and place the patient in Trendelenburg position"], "a": 0, "r": "Pink frothy sputum and crackles indicate acute pulmonary edema secondary to left heart failure. Priority actions: sitting upright (reduces venous return/preload), high-flow oxygen, and IV loop diuretics (Furosemide) to reduce fluid volume."}, {"d": 2, "q": "A patient receiving Furosemide 80 mg IV daily for heart failure exhibits muscle weakness and ECG changes. Which serum potassium level requires IMMEDIATE intervention?", "o": ["2.8 mEq/L", "4.2 mEq/L", "5.1 mEq/L", "3.8 mEq/L"], "a": 0, "r": "Furosemide is a potassium-wasting loop diuretic. Severe hypokalemia (<3.5 mEq/L, especially <3.0 mEq/L) increases the risk of fatal cardiac arrhythmias and digoxin toxicity."}, {"d": 2, "q": "A patient taking Digoxin 0.25 mg daily reports loss of appetite, nausea, and seeing yellow-green halos around lights. The apical pulse is 48 bpm. What is the nurse's FIRST action?", "o": ["Withhold the Digoxin dose and notify the healthcare provider immediately", "Administer the Digoxin dose with an antacid", "Encourage the patient to drink 500 mL of water", "Administer a potassium-sparing diuretic"], "a": 0, "r": "Nausea, anorexia, visual disturbances (yellow-green halos), and bradycardia (HR <60 bpm) are classic signs of Digoxin toxicity. The dose must be held and the provider notified to check serum digoxin and potassium levels."}, {"d": 2, "q": "A 65-year-old patient with chronic atrial fibrillation has a 12-lead ECG showing an irregularly irregular rhythm with absent P waves. The patient is prescribed Warfarin. What is the target International Normalized Ratio (INR)?", "o": ["2.0 to 3.0", "0.8 to 1.2", "4.0 to 5.0", "1.0 to 1.5"], "a": 0, "r": "The therapeutic target INR for stroke prevention in atrial fibrillation on Warfarin therapy is 2.0 to 3.0."}, {"d": 2, "q": "A patient in septic shock remains hypotensive with BP 80/45 mmHg and serum lactate 4.2 mmol/L despite receiving a 30 mL/kg IV crystalloid bolus. Which first-line vasopressor should the nurse anticipate?", "o": ["Norepinephrine infusion titrated to maintain MAP ≥ 65 mmHg", "Epinephrine sublingual tablet", "Dopamine IV push", "Atropine IV bolus"], "a": 0, "r": "Surviving Sepsis guidelines identify Norepinephrine as the first-line vasopressor of choice for septic shock unresponsive to initial fluid resuscitation, targeting a Mean Arterial Pressure (MAP) ≥ 65 mmHg."}, {"d": 2, "q": "A patient develops acute severe anaphylactic shock following IV penicillin administration, presenting with stridor, wheezing, and BP 70/40 mmHg. What is the FIRST-LINE life-saving drug?", "o": ["Intramuscular Epinephrine (1:1000) into the anterolateral thigh", "IV Hydrocortisone", "Oral Diphenhydramine", "Inhaled Salbutamol alone"], "a": 0, "r": "Intramuscular Epinephrine (0.3-0.5 mg of 1:1000) into the anterolateral thigh is the immediate first-line drug for anaphylaxis to reverse airway constriction and severe vasodilation."}, {"d": 2, "q": "A patient in cardiac arrest has an ECG showing Ventricular Fibrillation (VF). CPR is in progress. What is the immediate priority intervention?", "o": ["Deliver an immediate unsynchronized shock (defibrillation)", "Administer IV Atropine 1 mg", "Perform a 12-lead ECG", "Perform synchronized cardioversion"], "a": 0, "r": "Ventricular Fibrillation (VF) and Pulseless Ventricular Tachycardia (pVT) are shockable rhythms. The immediate priority is early defibrillation combined with continuous high-quality CPR."}, {"d": 2, "q": "A patient with severe COPD presents with drowsiness, lethargy, and shallow breathing after receiving oxygen via simple face mask at 10 L/min. SpO2 is 99%. What is the underlying cause?", "o": ["CO2 retention and narcosis secondary to suppression of the hypoxic drive", "Severe acute pulmonary embolism", "Acute metabolic acidosis", "Sudden development of pneumothorax"], "a": 0, "r": "In chronic hypercapnic COPD, high oxygen concentrations suppress the hypoxic drive (the main stimulus for breathing), leading to hypoventilation, severe CO2 retention, and CO2 narcosis."}, {"d": 2, "q": "A patient experiencing an acute severe asthma attack has severe intercostal retractions and audible wheezing. Five minutes later, the nurse notes that breath sounds are completely absent ('silent chest'). What does this signify?", "o": ["Imminent respiratory failure due to severe airflow obstruction requiring emergency intubation", "Spontaneous resolution of the bronchospasm", "Development of hyperventilation syndrome", "Normal clearing of bronchial secretions"], "a": 0, "r": "A 'silent chest' in a severe asthma attack indicates that airflow has become so critically restricted that no air is moving, signaling impending respiratory arrest and emergency airway intervention."}, {"d": 2, "q": "A patient with a deep vein thrombosis suddenly develops sharp pleuritic chest pain, dyspnea, and tachycardia (HR 124 bpm). SpO2 is 86%. What complication is suspected?", "o": ["Pulmonary Embolism (PE)", "Myocardial Infarction", "Atelectasis", "Pneumothorax"], "a": 0, "r": "Sudden onset dyspnea, pleuritic chest pain, tachycardia, and hypoxemia in a patient with DVT strongly suggest Pulmonary Embolism."}, {"d": 2, "q": "A trauma patient presents with severe dyspnea, absent breath sounds on the right side, hyperresonance to percussion, tracheal deviation to the left, and BP 78/48 mmHg. What is the immediate treatment?", "o": ["Immediate needle decompression in the 2nd intercostal space midclavicular line", "Endotracheal intubation and mechanical ventilation", "Administering IV fluid bolus 1000 mL", "Obtaining a STAT chest X-ray"], "a": 0, "r": "Tracheal deviation, absent breath sounds, and shock indicate a Tension Pneumothorax. This is a clinical emergency requiring immediate needle decompression prior to chest tube insertion."}, {"d": 2, "q": "The nurse notes continuous bubbling in the water-seal chamber of a patient's closed chest drainage system. What does this finding indicate?", "o": ["An air leak in the drainage system or pleural space", "Normal system functioning during exhalation", "Full lung re-expansion", "Blockage in the chest tube"], "a": 0, "r": "Continuous bubbling in the water-seal chamber indicates an air leak in the system or persistent leak from the lung. Intermittent bubbling during exhalation or coughing can be normal early on."}, {"d": 2, "q": "An arterial blood gas (ABG) result reveals: pH 7.28, PaCO2 58 mmHg, HCO3 25 mEq/L. How should the nurse interpret this result?", "o": ["Uncompensated Respiratory Acidosis", "Uncompensated Metabolic Acidosis", "Fully compensated Respiratory Alkalosis", "Partially compensated Metabolic Alkalosis"], "a": 0, "r": "pH <7.35 (acidosis) with PaCO2 >45 mmHg (respiratory component elevated) and normal HCO3 indicates Uncompensated Respiratory Acidosis (e.g., hypoventilation, COPD, opioid overdose)."}, {"d": 2, "q": "A patient suspected of having an acute ischemic stroke arrives at the emergency room. Which diagnostic test must be performed FIRST before thrombolytic therapy (tPA)?", "o": ["Non-contrast CT scan of the head", "Electroencephalogram (EEG)", "Lumbar puncture", "Carotid duplex ultrasound"], "a": 0, "r": "A STAT non-contrast head CT scan is mandatory to rule out intracranial hemorrhage before administering thrombolytic therapy (IV tPA)."}, {"d": 2, "q": "A patient with a traumatic head injury has a declining level of consciousness. Vital signs show SBP rising from 120 to 175 mmHg, pulse dropping from 78 to 48 bpm, and irregular breathing. What is this clinical triad called?", "o": ["Cushing's Triad (sign of increased ICP and impending brain herniation)", "Beck's Triad", "Charcot's Triad", "Virchow's Triad"], "a": 0, "r": "Cushing's Triad (systolic hypertension with widened pulse pressure, bradycardia, and irregular respirations) is a late sign of severely increased intracranial pressure and brainstem compression."}, {"d": 2, "q": "A patient with a spinal cord injury at the T4 level reports a severe pounding headache and nasal congestion. BP is 210/110 mmHg and HR is 52 bpm. The skin above T4 is flushed and sweaty. What is the nurse's FIRST action?", "o": ["Elevate the head of the bed to 90 degrees (High Fowler's)", "Administer IV Morphine Sulfate", "Check for a deep vein thrombosis in the lower extremities", "Place the patient flat in Trendelenburg position"], "a": 0, "r": "This is Autonomic Dysreflexia (a medical emergency in SCI at or above T6). The immediate FIRST action is to sit the patient upright at 90° to allow gravity to lower blood pressure, then search for the trigger (most commonly bladder distension or fecal impaction)."}, {"d": 2, "q": "A patient admitted with suspected bacterial meningitis exhibits severe neck stiffness. When the nurse flexes the patient's neck, involuntary flexion of the hips and knees occurs. What is this sign called?", "o": ["Brudzinski's sign", "Kernig's sign", "Chvostek's sign", "Trousseau's sign"], "a": 0, "r": "Positive Brudzinski's sign (involuntary flexion of hips and knees upon passive neck flexion) is a classic indicator of meningeal irritation."}, {"d": 2, "q": "A patient presenting with acute epigastric pain radiating to the back is suspected of having acute pancreatitis. Which laboratory test is MOST specific for acute pancreatitis?", "o": ["Serum Lipase", "Serum Amylase", "Total Bilirubin", "Serum Calcium"], "a": 0, "r": "Serum Lipase is more sensitive and specific than amylase for acute pancreatitis and remains elevated longer."}, {"d": 2, "q": "A patient with end-stage liver cirrhosis develops flapping tremors of the hands (asterixis) and confusion. Which serum lab value is expected to be elevated?", "o": ["Serum Ammonia", "Serum Creatinine", "Serum Sodium", "Serum Potassium"], "a": 0, "r": "Hepatic encephalopathy is caused by impaired liver clearance of nitrogenous toxins, leading to elevated blood ammonia levels, confusion, and asterixis (flapping tremor)."}, {"d": 2, "q": "A patient with Type 1 Diabetes presents with blood glucose 420 mg/dL, arterial pH 7.18, HCO3 12 mEq/L, and Kussmaul respirations. What is the PRIORITY initial treatment for Diabetic Ketoacidosis (DKA)?", "o": ["Rapid IV fluid resuscitation with 0.9% Normal Saline", "Immediate IV push bolus of NPH insulin", "Subcutaneous Glargine insulin injection", "IV sodium bicarbonate bolus"], "a": 0, "r": "The immediate priority in DKA is rehydration with isotonic fluid (0.9% Normal Saline) to restore intravascular volume and renal perfusion before starting IV regular insulin infusion."}, {"d": 2, "q": "A diabetic patient is found unconscious, diaphoretic, and cool to touch. Blood glucose is 34 mg/dL. The patient has no IV access. What is the immediate treatment?", "o": ["Administer Glucagon 1 mg IM/SC", "Give 150 mL orange juice orally", "Insert an NG tube and administer corn syrup", "Inject Regular insulin 10 units SC"], "a": 0, "r": "In severe hypoglycemia with loss of consciousness and no IV access, IM or SC Glucagon is the treatment of choice to rapidly mobilize liver glycogen."}, {"d": 2, "q": "Following a total thyroidectomy, a patient reports tingling around the lips and fingertips. Tapping the facial nerve elicits facial muscle twitching. What complication is present?", "o": ["Hypocalcemia due to accidental parathyroid removal (positive Chvostek's sign)", "Hypercalcemia due to thyroid hormone surge", "Thyroid storm", "Recurrent laryngeal nerve damage"], "a": 0, "r": "Accidental removal or injury to the parathyroid glands during thyroidectomy leads to hypocalcemia, characterized by neuromuscular irritability, positive Chvostek's sign, and positive Trousseau's sign. IV Calcium Gluconate must be available."}, {"d": 2, "q": "A patient who suffered a closed fracture of the right tibia 24 hours ago reports severe, agonizing pain unrelieved by IV morphine. The right foot is pale, paresthetic, and cold. What complication is developing?", "o": ["Compartment Syndrome", "Fat Embolism Syndrome", "Deep Vein Thrombosis", "Osteomyelitis"], "a": 0, "r": "Severe pain out of proportion to injury and unrelieved by opioids, accompanied by paresthesia, pallor, and coolness (5 Ps), indicates Compartment Syndrome—an emergency requiring immediate fasciotomy."}, {"d": 2, "q": "A patient who sustained a bilateral femur fracture 36 hours ago develops dyspnea, confusion, and a petechial rash across his neck and anterior chest. What condition should the nurse suspect?", "o": ["Fat Embolism Syndrome", "Pulmonary Embolism", "Disseminated Intravascular Coagulation", "Sepsis"], "a": 0, "r": "Fat Embolism Syndrome typically occurs 24-72 hours after long-bone fractures, presenting with the classic triad of respiratory distress, neurological impairment/confusion, and a petechial rash over the chest/neck."}, {"d": 2, "q": "The nurse assesses a patient in skeletal traction for a femur fracture. Which finding requires IMMEDIATE intervention?", "o": ["The traction weights are resting flat on the floor", "The patient's leg is maintained in alignment", "The skin around pin sites is clean and dry", "The patient uses a trapeze bar to adjust position"], "a": 0, "r": "Traction weights must hang freely at all times to maintain continuous traction force. Weights touching the floor defeat the purpose of traction."}, {"d": 2, "q": "A patient who underwent abdominal surgery 4 days ago feels a sudden 'popping' sensation while coughing. The nurse inspects the wound and sees loops of small intestine protruding. What is the FIRST action?", "o": ["Position the patient in low Fowler's with knees flexed and cover the organs with sterile saline-moistened dressings", "Gently push the intestinal loops back into the abdomen", "Apply a tight abdominal binder", "Instruct the patient to ambulate to the procedure room"], "a": 0, "r": "Wound evisceration is a surgical emergency. Place the patient in low Fowler's with knees flexed, cover exposed viscera with sterile drapes soaked in warm 0.9% Normal Saline, and call the surgeon immediately."}, {"d": 2, "q": "A adult patient with partial and full-thickness burns over 30% Total Body Surface Area (TBSA) weighs 70 kg. Using the Parkland Formula (4 mL x kg x %TBSA), how much Lactated Ringer's should be given in the FIRST 8 HOURS from injury?", "o": ["4,200 mL", "8,400 mL", "2,100 mL", "5,600 mL"], "a": 0, "r": "Total 24h Fluid = 4 mL x 70 kg x 30 = 8,400 mL. Half of this total (4,200 mL) must be infused in the FIRST 8 hours from the time of burn injury."}, {"d": 2, "q": "A patient receiving chemotherapy has an Absolute Neutrophil Count (ANC) of 350/mm³ and develops a temperature of 38.3°C. What is the nurse's PRIORITY action?", "o": ["Notify the oncologist immediately and prepare for STAT blood cultures and empiric IV antibiotics", "Administer oral Paracetamol and recheck temperature in 4 hours", "Encourage fresh fruit consumption to boost immunity", "Place a cooling blanket on the patient"], "a": 0, "r": "Febrile neutropenia (ANC <500/mm³ with fever ≥38.0°C) is a life-threatening medical emergency. Immediate blood cultures and prompt empiric broad-spectrum IV antibiotic administration within 1 hour are essential to prevent septic shock."}, {"d": 2, "q": "A patient is admitted to the emergency department with a heart rate of 210 bpm. The ECG shows Supraventricular Tachycardia (SVT). Vagal maneuvers are unsuccessful. Which medication should the nurse anticipate administering FIRST?", "o": ["Adenosine rapid IV push", "Amiodarone IV infusion", "Atropine IV push", "Epinephrine IV push"], "a": 0, "r": "Adenosine is the first-line drug for stable SVT. It must be given as a rapid IV push (over 1-2 seconds) followed immediately by a rapid saline flush due to its extremely short half-life (< 10 seconds)."}, {"d": 2, "q": "The nurse is caring for a patient in the ICU whose cardiac monitor suddenly shows Ventricular Fibrillation. The patient is unresponsive and has no pulse. What is the nurse's immediate priority?", "o": ["Defibrillation", "Synchronized cardioversion", "Administering IV Epinephrine", "Administering IV Amiodarone"], "a": 0, "r": "Ventricular Fibrillation (V-Fib) is a shockable arrest rhythm. The immediate, highest priority is high-quality CPR and early defibrillation to restore an organized rhythm."}, {"d": 2, "q": "During a cardiac arrest, the monitor displays Asystole. Which intervention is CONTRAINDICATED in the management of this rhythm?", "o": ["Defibrillation", "High-quality CPR", "Epinephrine 1 mg IV every 3-5 minutes", "Endotracheal intubation"], "a": 0, "r": "Asystole is a non-shockable rhythm. Defibrillation is strictly contraindicated as it will not restart the heart and interrupts CPR. Management consists of continuous CPR and Epinephrine."}, {"d": 2, "q": "A patient with a temporary transvenous pacemaker exhibits pacemaker spikes on the ECG that are not followed by a P wave or QRS complex. How should the nurse document this finding?", "o": ["Failure to capture", "Failure to sense", "Failure to pace", "Normal pacemaker function"], "a": 0, "r": "When a pacemaker spike is seen on the ECG but there is no subsequent myocardial depolarization (no P wave or QRS complex), it is termed 'failure to capture.' This requires increasing the mA (voltage) or repositioning the lead."}, {"d": 2, "q": "A 65-year-old male with a history of severe hypertension presents to the ER with sudden, tearing, severe pain in his chest that radiates to his back. Blood pressure is 210/110 mmHg. What condition does the nurse suspect?", "o": ["Aortic Dissection", "Acute Myocardial Infarction", "Pulmonary Embolism", "Acute Pericarditis"], "a": 0, "r": "A sudden, severe, 'tearing' or 'ripping' chest pain radiating to the back is the classic hallmark presentation of an acute aortic dissection, a life-threatening emergency requiring immediate BP control."}, {"d": 2, "q": "During routine assessment of an older adult patient, the nurse palpates a pulsating mass in the periumbilical area and hears a bruit. What is the nurse's PRIORITY action?", "o": ["Stop palpating and notify the healthcare provider immediately", "Deeply palpate the mass to determine its size", "Assess the patient's bowel sounds", "Prepare the patient for an immediate enema"], "a": 0, "r": "A pulsating abdominal mass with a bruit is highly suspicious for an Abdominal Aortic Aneurysm (AAA). Deep palpation is contraindicated as it may cause the aneurysm to rupture."}, {"d": 2, "q": "A patient recovering from a recent viral infection complains of sharp, stabbing chest pain that worsens with deep inspiration and when lying flat. The pain is relieved by sitting up and leaning forward. What is the likely diagnosis?", "o": ["Acute Pericarditis", "Myocardial Infarction", "Stable Angina", "Costochondritis"], "a": 0, "r": "Pleuritic chest pain that worsens when supine and is relieved by sitting up and leaning forward is the classic presentation of acute pericarditis. A pericardial friction rub may also be heard."}, {"d": 2, "q": "A patient admitted with infective endocarditis is found to have painful, red, raised nodules on the pads of their fingers and toes. What are these lesions called?", "o": ["Osler's nodes", "Janeway lesions", "Roth spots", "Splinter hemorrhages"], "a": 0, "r": "Osler's nodes are tender, raised subcutaneous nodules found on the pads of fingers and toes in infective endocarditis. Janeway lesions are non-tender macules on the palms and soles."}, {"d": 2, "q": "A nurse is assessing a patient's chest tube drainage system. The nurse observes continuous, vigorous bubbling in the water-seal chamber. What does this indicate?", "o": ["An air leak in the system or pleural space", "Normal resolution of a pneumothorax", "Suction pressure is set too low", "The chest tube is occluded by a clot"], "a": 0, "r": "Continuous bubbling in the water-seal chamber is abnormal and indicates a persistent air leak either from the patient's lung or within the drainage tubing itself."}, {"d": 2, "q": "The high-pressure alarm on a mechanically ventilated patient's ventilator is sounding. Which of the following is the LEAST likely cause of this alarm?", "o": ["Disconnection of the ventilator tubing", "Patient biting the endotracheal tube", "Accumulation of pulmonary secretions", "Decreased lung compliance (e.g., tension pneumothorax)"], "a": 0, "r": "Tubing disconnection causes a LOSS of pressure, triggering the LOW-pressure alarm. High-pressure alarms are triggered by increased resistance (secretions, biting the tube, coughing, kinked tubing, or pneumothorax)."}, {"d": 2, "q": "A patient develops Acute Respiratory Distress Syndrome (ARDS). Which clinical manifestation is the hallmark sign of ARDS?", "o": ["Refractory hypoxemia despite administration of high-flow oxygen", "Hypercapnia with a normal PaO2", "Sudden onset of unilateral pleuritic chest pain", "Pink, frothy sputum with a loud S3 heart gallop"], "a": 0, "r": "The hallmark of ARDS is refractory hypoxemia (low PaO2) that does not improve even with the administration of 100% supplemental oxygen, caused by severe non-cardiogenic pulmonary edema and alveolar collapse."}, {"d": 2, "q": "A post-operative patient suddenly develops severe dyspnea, pleuritic chest pain, and hemoptysis. Vital signs are HR 120, RR 28, SpO2 88%. Which diagnostic test is the gold standard for confirming the suspected diagnosis?", "o": ["CT Pulmonary Angiography (CTPA)", "Chest X-ray", "12-lead Electrocardiogram (ECG)", "D-dimer blood test"], "a": 0, "r": "The patient exhibits classic signs of a Pulmonary Embolism (PE). CT Pulmonary Angiography (CTPA) is the gold standard diagnostic imaging test to visualize a clot in the pulmonary vasculature."}, {"d": 2, "q": "A nurse is teaching a patient with chronic emphysema how to use pursed-lip breathing. What is the primary physiological purpose of this technique?", "o": ["To prevent alveolar collapse during exhalation by maintaining positive airway pressure", "To increase the strength of the diaphragm muscle", "To increase the amount of oxygen inspired with each breath", "To help clear thick bronchial secretions"], "a": 0, "r": "Pursed-lip breathing creates mild auto-PEEP (positive end-expiratory pressure), which keeps airways open longer during exhalation, preventing bronchiolar collapse and reducing air trapping in COPD."}, {"d": 2, "q": "An asthmatic patient uses a peak flow meter and the reading is in the 'Yellow Zone' (50-80% of personal best). What should the patient's action plan dictate?", "o": ["Take the prescribed short-acting rescue inhaler (Albuterol) and recheck", "Call for an ambulance immediately", "No action needed; this is a normal reading", "Double the dose of the inhaled corticosteroid permanently"], "a": 0, "r": "The Yellow Zone indicates caution/worsening asthma. The standard action plan dictates using a short-acting beta-agonist (SABA) rescue inhaler, resting, and re-evaluating peak flow."}, {"d": 2, "q": "A patient with active tuberculosis is prescribed Rifampin. Which teaching point MUST the nurse include regarding this medication?", "o": ["It will turn urine, sweat, and tears a harmless red-orange color", "It requires regular visual acuity exams due to optic neuritis risk", "It must be taken with a large meal to prevent severe ulcers", "It commonly causes permanent hearing loss (ototoxicity)"], "a": 0, "r": "Rifampin turns bodily fluids (urine, sweat, tears, saliva) a red-orange color. This is a normal, harmless side effect, but patients should be warned so they do not wear contact lenses."}, {"d": 2, "q": "A patient taking Isoniazid (INH) for tuberculosis complains of numbness and tingling in the hands and feet. The nurse should anticipate an order for which supplement?", "o": ["Pyridoxine (Vitamin B6)", "Cyanocobalamin (Vitamin B12)", "Thiamine (Vitamin B1)", "Folic Acid"], "a": 0, "r": "Isoniazid (INH) interferes with Vitamin B6 metabolism, leading to peripheral neuropathy. Pyridoxine (Vitamin B6) is routinely prescribed concurrently to prevent this side effect."}, {"d": 2, "q": "A patient with hypovolemic shock develops Acute Kidney Injury (AKI). Laboratory results show a BUN of 45 mg/dL and a Serum Creatinine of 1.2 mg/dL. What type of AKI does this >20:1 ratio suggest?", "o": ["Prerenal AKI", "Intrarenal (Intrinsic) AKI", "Postrenal AKI", "Chronic Kidney Disease"], "a": 0, "r": "A BUN/Creatinine ratio greater than 20:1 indicates a Prerenal cause of AKI (such as dehydration, hypovolemia, or heart failure). The kidneys are undamaged but are responding to decreased renal perfusion."}, {"d": 2, "q": "A patient with end-stage renal disease (ESRD) is prescribed Sevelamer. When should the nurse administer this medication?", "o": ["With meals", "First thing in the morning on an empty stomach", "At bedtime", "One hour after other medications"], "a": 0, "r": "Sevelamer is a phosphate binder used to treat hyperphosphatemia in CKD. It must be taken with meals to bind dietary phosphorus in the GI tract, preventing its absorption into the blood."}, {"d": 2, "q": "A patient undergoing their first hemodialysis treatment complains of a severe headache, nausea, and restlessness. The nurse notes mild confusion. What syndrome is the patient likely experiencing?", "o": ["Dialysis Disequilibrium Syndrome", "Uremic Encephalopathy", "Acute Hemolytic Reaction", "Air Embolism"], "a": 0, "r": "Dialysis Disequilibrium Syndrome (DDS) is a rare but life-threatening complication during early dialysis treatments caused by rapid removal of urea from the blood, leading to cerebral edema, headache, and altered mental status. The dialysis rate must be slowed or stopped."}, {"d": 2, "q": "A nurse is assessing a patient with a newly placed arteriovenous (AV) fistula in the left arm. Which finding indicates the fistula is patent and functioning normally?", "o": ["Presence of a palpable thrill and auscultated bruit over the fistula", "Absence of a pulse distal to the fistula", "The left arm is slightly cooler than the right arm", "The patient reports numbness in the left fingers"], "a": 0, "r": "A functional, patent AV fistula should have a palpable thrill (buzzing sensation) and an auscultated bruit (swishing sound) due to high-velocity turbulent blood flow."}, {"d": 2, "q": "A patient receiving continuous ambulatory peritoneal dialysis (CAPD) notes that the drained dialysate effluent is cloudy. The patient also has a low-grade fever. What complication is most likely?", "o": ["Peritonitis", "Bowel perforation", "Dialysate leakage", "Incisional hernia"], "a": 0, "r": "Cloudy dialysate effluent is the earliest and most common sign of Peritonitis, a serious infection of the peritoneal cavity. The fluid must be sent for culture and sensitivity immediately."}, {"d": 2, "q": "A patient with acute renal failure has a serum potassium level of 7.2 mEq/L. The ECG shows tall, peaked T waves and a widened QRS. To immediately stabilize the myocardium and prevent fatal arrhythmias, what drug should be administered FIRST?", "o": ["IV Calcium Gluconate", "IV Regular Insulin and 50% Dextrose", "Sodium Polystyrene Sulfonate (Kayexalate)", "IV Furosemide"], "a": 0, "r": "While insulin/dextrose shifts potassium into cells, IV Calcium Gluconate is the absolute FIRST priority in severe hyperkalemia with ECG changes because it immediately stabilizes the myocardial cell membrane, preventing fatal ventricular arrhythmias."}, {"d": 2, "q": "A patient on continuous nasogastric suction develops severe muscle cramping and weakness. The ECG reveals prominent U waves and flattened T waves. Which electrolyte imbalance is responsible?", "o": ["Hypokalemia", "Hyperkalemia", "Hyponatremia", "Hypercalcemia"], "a": 0, "r": "Hypokalemia (K+ < 3.5) causes muscle weakness, cramping, and classic ECG changes including flattened/inverted T waves, ST depression, and prominent U waves. NG suction causes massive potassium loss."}, {"d": 2, "q": "A patient is admitted with a serum sodium level of 115 mEq/L. Which nursing intervention is the HIGHEST priority?", "o": ["Initiate seizure precautions and frequent neurological assessments", "Administer a 1000 mL bolus of 0.45% Normal Saline", "Encourage the patient to drink 2 liters of water daily", "Place the patient in an isolation room"], "a": 0, "r": "Severe hyponatremia (<120 mEq/L) causes cerebral edema, leading to altered mental status, seizures, coma, and death. Immediate seizure precautions and strict neuro checks are the highest priority."}, {"d": 2, "q": "A patient is recovering from a right-hemisphere ischemic stroke. Which behavioral characteristic is the nurse MOST likely to observe?", "o": ["Impulsivity and lack of awareness regarding deficits", "Expressive aphasia (Broca's)", "Cautious, slow, and hesitant behavior", "Intact spatial-perceptual orientation"], "a": 0, "r": "Right-hemisphere strokes typically result in left-sided hemiplegia, spatial-perceptual deficits, extreme impulsivity, short attention span, and poor judgment/lack of awareness of deficits (anosognosia), increasing fall risk."}, {"d": 2, "q": "A patient is brought to the ER with right-sided facial droop and expressive aphasia. Symptoms started 2 hours ago. Blood pressure is 170/95 mmHg. Is this patient a candidate for IV tPA (Alteplase)?", "o": ["Yes, because symptoms started less than 4.5 hours ago and BP is within acceptable limits (<185/110)", "No, because expressive aphasia is a strict contraindication to tPA", "No, because the blood pressure is too high", "Yes, but only if an MRI confirms the exact location of the clot first"], "a": 0, "r": "The therapeutic window for IV tPA in ischemic stroke is within 3 to 4.5 hours of symptom onset. Blood pressure must be kept below 185/110 mmHg prior to administration. A non-contrast CT is needed, not an MRI."}, {"d": 2, "q": "A patient with a severe traumatic brain injury develops a systolic blood pressure of 190 mmHg, a pulse of 42 bpm, and an irregula
