tient over the next 48 hours?", "o": ["Monitoring closely for maternal fever, fetal tachycardia, and foul-smelling fluid, which indicate chorioamnionitis (infection)", "Preparing the patient for an immediate induction of labor with maximum-dose Oxytocin", "Discharging the patient home with instructions to return when contractions start", "Administering a massive dose of IV Magnesium Sulfate to stop labor"], "a": 0, "r": "Preterm Premature Rupture of Membranes (PPROM) at 34 weeks without labor is a delicate situation. The absolute greatest risk once the amniotic sac (the sterile barrier) is broken is a massive ascending bacterial infection into the uterus (chorioamnionitis). The nurse must strictly monitor for maternal fever, fetal tachycardia (an early sign of fetal infection), and foul fluid."}, {"d": 3, "q": "A postpartum patient who delivered 24 hours ago is experiencing a massive hemorrhage. The nurse palpates the fundus and finds it to be 'boggy' (soft) and deviated heavily to the right side of the umbilicus. What is the nurse's absolute FIRST action?", "o": ["Assist the patient to the bathroom or use a bedpan to empty her bladder, then perform fundal massage", "Administer a STAT IM dose of Methylergonovine (Methergine)", "Prepare the patient for an emergency hysterectomy", "Perform vigorous fundal massage for 15 minutes without stopping"], "a": 0, "r": "A fundus that is deviated to the right and above the umbilicus is the classic, hallmark sign of a massively distended bladder. A full bladder physically pushes the uterus out of place and absolutely prevents the uterine muscle from contracting (atony). The bladder MUST be emptied first, otherwise, no amount of massage or medication will stop the hemorrhage."}, {"d": 3, "q": "A pregnant woman who is Rh-negative delivers a healthy newborn who is Rh-positive. The mother received her first dose of Rho(D) Immune Globulin (RhoGAM) at 28 weeks gestation. What must occur postpartum?", "o": ["She must receive a second dose of RhoGAM within 72 hours of delivery to prevent isoimmunization", "No further RhoGAM is needed because the baby is healthy", "The newborn must receive the RhoGAM injection", "She must wait 6 months before receiving the second dose"], "a": 0, "r": "If an Rh-negative mother delivers an Rh-positive baby, fetal blood inevitably mixes with maternal blood during birth. The mother will produce permanent antibodies against Rh-positive blood, which will fatally attack her NEXT pregnancy (erythroblastosis fetalis). A second dose of RhoGAM must be given to the mother within 72 hours of delivery to destroy any fetal cells before her immune system reacts."}, {"d": 3, "q": "A patient at 8 weeks gestation asks the nurse to calculate her Estimated Date of Delivery (EDD). Her Last Menstrual Period (LMP) began on May 10th. Using Naegele's Rule, what is her EDD?", "o": ["February 17th of the next year", "February 10th of the next year", "March 17th of the next year", "April 17th of the next year"], "a": 0, "r": "Naegele's Rule is: Subtract 3 months from the LMP, then add 7 days (and adjust the year). May 10th minus 3 months = February 10th. Add 7 days = February 17th."}, {"d": 3, "q": "A patient in active labor is attached to an external fetal monitor. The nurse observes late decelerations. Using the 'LION' acronym, what are the sequence of interventions the nurse should perform?", "o": ["Left side positioning, IV fluid bolus, Oxygen administration, Notify provider/stop Oxytocin", "Lie flat, Increase Oxytocin, Observe monitor, Notify family", "Legs elevated, Initiate pushing, Oxygen off, NPO status", "Left side, IV push Ephedrine, Oxygen on, Nothing by mouth"], "a": 0, "r": "Late decelerations indicate severe uteroplacental insufficiency. The 'LION' intrauterine resuscitation bundle stands for: Left lateral position (to relieve vena cava compression), IV fluid bolus (to increase maternal blood volume/pressure), Oxygen via non-rebreather (to hyperoxygenate maternal blood), and Notify the provider (and immediately turn off any Oxytocin/Pitocin)."}, {"d": 3, "q": "A pregnant woman at 38 weeks gestation is receiving a continuous IV infusion of Magnesium Sulfate for severe preeclampsia. The nurse assesses the patient and notes: BP 150/90, HR 80, Respiratory Rate 16, and Deep Tendon Reflexes (DTRs) are 2+. What is the nurse's interpretation?", "o": ["The patient is receiving a safe, therapeutic dose of Magnesium Sulfate", "The patient is experiencing severe Magnesium toxicity; the infusion must be stopped", "The patient is about to have an eclamptic seizure; the dose must be doubled", "The patient requires an immediate emergency Cesarean section"], "a": 0, "r": "Magnesium Sulfate is a CNS depressant used to raise the seizure threshold. Normal DTRs are 2+, and a normal respiratory rate is 12-20. Because this patient's reflexes and breathing are completely normal, the magnesium level is therapeutic and safe. Toxicity is indicated by absent DTRs (0) and respiratory depression (<12)."}, {"d": 3, "q": "A patient in the active phase of labor suddenly complains of excruciating, tearing abdominal pain. The fetal monitor shows profound bradycardia. The nurse palpates the abdomen and notes the previously rigid uterus has lost its shape, and fetal parts are easily palpable just under the skin. What catastrophic event has occurred?", "o": ["Uterine Rupture", "Abruptio Placentae", "Placenta Previa", "Normal engagement of the fetal head into the pelvis"], "a": 0, "r": "Uterine rupture is a catastrophic tearing of the uterine wall. The classic signs are sudden 'tearing' pain, immediate cessation of contractions, profound fetal distress/bradycardia, and the massive red flag: the fetus has slipped OUT of the uterus into the peritoneal cavity, making fetal parts extremely easy to palpate."}, {"d": 3, "q": "A pregnant patient at 32 weeks gestation presents to the triage unit with painless, bright red vaginal bleeding. The physician suspects Placenta Previa. Which common obstetrical procedure is STRICTLY CONTRAINDICATED for this patient?", "o": ["A digital vaginal examination to check cervical dilation", "A transabdominal ultrasound", "Continuous external fetal heart rate monitoring", "Drawing blood for a complete blood count (CBC)"], "a": 0, "r": "In Placenta Previa, the placenta is implanted directly over or near the cervical os. If a nurse or physician inserts their fingers into the vagina and through the cervix to check dilation, they will push their fingers directly THROUGH the placenta, causing catastrophic, fatal maternal and fetal hemorrhage. Diagnosis must be made via ultrasound."}, {"d": 3, "q": "A patient in active labor is attached to a continuous fetal monitor. The nurse observes uniform, bowl-shaped decelerations that begin AFTER the peak of the maternal contraction and do not recover to baseline until after the contraction has completely ended. What is the priority nursing intervention?", "o": ["Turn the patient onto her left lateral side, administer oxygen via non-rebreather mask, and increase IV fluids", "Document the finding as an early deceleration caused by normal head compression", "Encourage the patient to begin pushing with every contraction", "Administer a massive IV bolus of Oxytocin (Pitocin)"], "a": 0, "r": "These are Late Decelerations, which are the hallmark sign of severe uteroplacental insufficiency and fetal hypoxia. The absolute priority is the 'LION' intrauterine resuscitation bundle: Left lateral positioning (to take weight off the vena cava), IV fluids, Oxygen, and Notify the provider (while stopping any Oxytocin)."}, {"d": 3, "q": "A pregnant patient at 12 weeks gestation comes to the clinic. She reports severe nausea, vomiting, and vaginal bleeding. The physician notes that her uterus is the size of a 20-week pregnancy, and her hCG levels are astronomically high. An ultrasound shows a 'snowstorm' pattern with no viable fetus. What is the diagnosis?", "o": ["Hydatidiform Mole (Molar Pregnancy)", "Ruptured Ectopic Pregnancy", "Placenta Previa", "Normal twin gestation"], "a": 0, "r": "A Hydatidiform Mole (Gestational Trophoblastic Disease) is an abnormal proliferation of the trophoblastic cells that normally form the placenta. Instead of a fetus, fluid-filled grapelike clusters grow rapidly. The classic signs are a uterus that is much too large for gestational age, incredibly high hCG levels (causing severe hyperemesis), dark bleeding, and a 'snowstorm' appearance on ultrasound."}, {"d": 3, "q": "A patient in active labor requests an epidural. The nurse knows that before the anesthesiologist places the epidural, the absolute most important prophylactic nursing intervention is to:", "o": ["Administer a rapid 500 to 1,000 mL bolus of IV Isotonic fluid (e.g., Lactated Ringer's)", "Administer a prophylactic dose of IV Ephedrine", "Place the patient completely flat on her back", "Administer a dose of IV prophylactic antibiotics"], "a": 0, "r": "The most common and dangerous side effect of epidural anesthesia is massive, sudden maternal hypotension due to sympathetic blockade (vasodilation). To prevent this, the nurse must proactively 'fill the tank' by administering a large, rapid IV fluid bolus of isotonic crystalloids immediately prior to the epidural placement."}, {"d": 3, "q": "A pregnant patient at 16 weeks gestation undergoes a maternal serum alpha-fetoprotein (MSAFP) screening. The results return as abnormally HIGH. What condition is this fetus at highest risk for?", "o": ["Neural Tube Defects (e.g., Spina Bifida, Anencephaly)", "Down Syndrome (Trisomy 21)", "Edward's Syndrome (Trisomy 18)", "Congenital Heart Defects"], "a": 0, "r": "Alpha-fetoprotein is a protein produced by the fetal liver. If the fetus has an open Neural Tube Defect (like spina bifida or anencephaly), massive amounts of this protein leak out of the open spinal cord into the amniotic fluid and cross into the mother's blood, causing abnormally HIGH MSAFP levels. (Low levels indicate a risk for Down Syndrome)."}, {"d": 3, "q": "A patient at 41 weeks gestation is receiving a continuous Oxytocin (Pitocin) infusion to induce labor. The nurse notes the uterine resting tone between contractions is 30 mmHg (normal is < 20 mmHg). What is the priority nursing action?", "o": ["Stop the Oxytocin infusion immediately", "Increase the Oxytocin infusion to overcome the high resting tone", "Administer an IV fluid bolus", "Document the finding as a normal, expected response to induction"], "a": 0, "r": "A high uterine resting tone (> 20 mmHg) means the uterus is never fully relaxing between contractions. This constant squeezing cuts off the blood supply to the placenta, leading to severe fetal hypoxia. The absolute first action is to STOP the medication (Oxytocin) that is heavily stimulating the uterus."}, {"d": 3, "q": "A pregnant woman at 39 weeks gestation is admitted to the labor unit. She is 8 cm dilated. She suddenly yells, 'I feel like I need to have a bowel movement right now!' What is the nurse's immediate priority?", "o": ["Perform a sterile vaginal exam to assess for crowning or complete cervical dilation", "Assist the patient to the bathroom so she can use the toilet", "Administer a fleet enema to clear the bowel for delivery", "Tell the patient this is a normal feeling and to ignore it"], "a": 0, "r": "When a laboring woman suddenly feels immense rectal pressure or an overwhelming urge to have a bowel movement, it almost always means the fetal head has descended deep into the pelvis and is pressing against the rectum. Delivery is imminent. The nurse must NEVER let her go to the bathroom; the absolute priority is to check the perineum and cervix for crowning."}, {"d": 3, "q": "A patient at 12 weeks gestation is diagnosed with a ruptured ectopic pregnancy. The patient is pale, diaphoretic, and has a blood pressure of 80/40 mmHg. Which type of shock is this patient experiencing, and what is the primary treatment?", "o": ["Hypovolemic shock; treated with rapid IV fluids, blood transfusions, and emergency surgery to stop the bleeding", "Cardiogenic shock; treated with inotropes like Dobutamine", "Septic shock; treated with broad-spectrum antibiotics", "Anaphylactic shock; treated with IM Epinephrine"], "a": 0, "r": "A ruptured ectopic pregnancy causes massive, rapid internal hemorrhage into the peritoneal cavity. The extreme loss of blood volume leads to profound Hypovolemic Shock. The only treatment is aggressive fluid/blood resuscitation and emergency surgery (laparotomy/salpingectomy) to physically clamp the bleeding vessel."}, {"d": 3, "q": "A pregnant woman at 38 weeks gestation reports that her 'water broke' an hour ago. The nurse performs a Nitrazine test on the vaginal fluid. The Nitrazine paper immediately turns a deep, dark blue. What does this specific result indicate?", "o": ["The fluid is alkaline, confirming the presence of amniotic fluid and membrane rupture", "The fluid is highly acidic, indicating normal vaginal secretions", "The fluid contains a severe bacterial infection", "The test is inconclusive and must be repeated"], "a": 0, "r": "Normal vaginal secretions are acidic (pH 4.5-5.5) and leave Nitrazine paper yellow/olive. Amniotic fluid is uniquely alkaline (pH 7.0-7.5). If amniotic fluid is present (ruptured membranes), its alkalinity turns the Nitrazine test strip a dark blue/blue-green."}, {"d": 3, "q": "A pregnant patient at 32 weeks gestation is diagnosed with severe preeclampsia and is started on a continuous IV infusion of Magnesium Sulfate. During hourly rounds, the nurse assesses the patient and notes: Blood Pressure 150/95, Heart Rate 85, Respiratory Rate 10 breaths/minute, and Deep Tendon Reflexes are absent (0). What is the nurse's ABSOLUTE FIRST action?", "o": ["Stop the Magnesium Sulfate infusion immediately", "Administer a STAT IV push of Calcium Gluconate", "Notify the physician and request an order for an immediate C-section", "Apply oxygen via nasal cannula and continue monitoring closely"], "a": 0, "r": "The patient is exhibiting classic signs of severe, life-threatening Magnesium toxicity: respiratory depression (RR < 12) and absent deep tendon reflexes. The absolute first mechanical action the nurse must take is to STOP the infusion of the toxic agent. Only after stopping the pump does the nurse administer the antidote (Calcium Gluconate) and notify the provider."}, {"d": 3, "q": "A pregnant patient at 28 weeks gestation is undergoing a 1-hour Oral Glucose Tolerance Test (OGTT). She consumes the 50-gram glucose drink. One hour later, her blood glucose is 165 mg/dL. What is the nurse's immediate interpretation and next step?", "o": ["The result is abnormal (screening failed); the patient must now undergo a diagnostic 3-hour OGTT", "The result is perfectly normal for pregnancy; no further testing is required", "The result confirms Gestational Diabetes; the patient must immediately start insulin injections", "The result indicates severe hypoglycemia; give the patient juice immediately"], "a": 0, "r": "The 1-hour OGTT is a SCREENING test, not a diagnostic test. A normal result is < 140 mg/dL. Because her result is 165, she failed the screen. She is not diagnosed yet; she must proceed to the definitive, diagnostic 3-hour Oral Glucose Tolerance Test (OGTT) using a 100-gram glucose load."}, {"d": 3, "q": "A patient is 12 hours postpartum following a normal vaginal delivery. The nurse assesses the fundus and notes it is firm, midline, and located exactly at the level of the umbilicus. What is the appropriate nursing action?", "o": ["Document the finding as perfectly normal and expected", "Perform vigorous fundal massage to push it down further", "Assist the patient to empty her bladder immediately", "Administer a PRN dose of Oxytocin (Pitocin)"], "a": 0, "r": "Within 12 hours after delivery, a normal, contracted uterus should be firm, midline, and resting at the exact level of the umbilicus (or 1 cm above/below). It will then descend approximately 1 cm (one fingerbreadth) per day. This is a completely normal, healthy assessment finding requiring only documentation."}, {"d": 3, "q": "A patient at 40 weeks gestation is actively pushing. The fetal head is delivered, but immediately retracts back tightly against the maternal perineum ('turtle sign'). The nurse recognizes Shoulder Dystocia. What is the nurse's ABSOLUTE FIRST physical intervention?", "o": ["Assist the mother into the McRoberts maneuver (sharply flexing her thighs back against her abdomen) and apply firm suprapubic pressure", "Apply massive, forceful fundal pressure to push the baby out", "Prepare the vacuum extractor or forceps for immediate use", "Administer a massive IV bolus of Oxytocin"], "a": 0, "r": "Shoulder dystocia is a massive obstetrical emergency where the fetal anterior shoulder gets stuck behind the mother's pubic bone. The 'turtle sign' is classic. The first-line, life-saving intervention is the McRoberts maneuver (which flattens the sacrum and opens the pelvis) combined with firm suprapubic pressure (pushing directly over the pubic bone to dislodge the shoulder). Fundal pressure is strictly contraindicated as it impacts the shoulder harder."}, {"d": 3, "q": "A pregnant patient at 36 weeks gestation presents with severe hypertension (170/110 mmHg), 4+ proteinuria, and severe hyperreflexia. Suddenly, the patient begins experiencing a generalized tonic-clonic seizure. How does this seizure change the patient's medical diagnosis?", "o": ["The patient's diagnosis immediately changes from Severe Preeclampsia to Eclampsia", "The patient is now diagnosed with Gestational Epilepsy", "The patient has progressed to HELLP Syndrome", "The diagnosis remains Severe Preeclampsia but with neurological involvement"], "a": 0, "r": "Preeclampsia is defined by hypertension and organ damage (like proteinuria). The absolute, defining distinction between preeclampsia and eclampsia is the onset of a generalized seizure. The moment the patient seizes, the diagnosis becomes Eclampsia, a massive, life-threatening emergency requiring immediate stabilization and delivery."}, {"d": 3, "q": "A nurse is teaching a postpartum patient about what to expect regarding vaginal discharge (lochia). Which sequence correctly describes the normal progression of lochia color in the days following delivery?", "o": ["Lochia rubra (dark red), followed by lochia serosa (pinkish-brown), followed by lochia alba (creamy white/yellow)", "Lochia alba (white), followed by lochia serosa (pink), followed by lochia rubra (red)", "Lochia serosa (brown), followed by lochia rubra (red), followed by lochia alba (white)", "Lochia rubra (red), followed directly by lochia alba (white)"], "a": 0, "r": "The normal, healthy progression of lochia is: Rubra (dark red, bloody, days 1-3), Serosa (pinkish-brown, days 4-10), and Alba (creamy white or light yellow, days 11 up to 6 weeks). A return to rubra after it has progressed indicates postpartum hemorrhage or retained placental fragments."}, {"d": 3, "q": "A patient in active labor is attached to a fetal monitor. The nurse observes uniform, shallow decelerations in the fetal heart rate that perfectly mirror the maternal contractions (the deceleration begins exactly when the contraction begins, and recovers exactly when the contraction ends). What is the nurse's interpretation and action?", "o": ["These are Early Decelerations caused by fetal head compression; they are a normal physiological response and require no intervention other than continued monitoring", "These are Late Decelerations caused by placental insufficiency; the nurse must turn the patient on her side and give oxygen immediately", "These are Variable Decelerations caused by cord compression; the nurse must prepare for an amnioinfusion", "These are Prolonged Decelerations indicating fetal death; prepare for a STAT C-section"], "a": 0, "r": "Early decelerations are visually characterized by a 'mirror image' to the contraction. They are caused by the fetal head being compressed against the birth canal as it descends, which triggers a vagal response, slowing the heart rate. They are a perfectly normal, benign finding in labor and require zero intervention."}, {"d": 3, "q": "A pregnant patient at 35 weeks gestation calls the clinic. She reports she has painless, bright red vaginal bleeding. She asks if she should drive herself to the clinic or call an ambulance. What is the nurse's directive?", "o": ["Call 911 for an ambulance immediately; she is likely experiencing Placenta Previa and requires emergency transport without sitting upright or exerting herself", "Drive to the clinic as soon as possible for a pelvic exam", "Drink a large glass of water, lie down, and see if the bleeding stops in an hour", "Go to the nearest pharmacy and buy heavy-duty sanitary pads"], "a": 0, "r": "Painless, bright red bleeding in the third trimester is the hallmark of Placenta Previa. This can rapidly progress to catastrophic, fatal exsanguination of both the mother and fetus in minutes. The patient must NOT drive, walk, or exert herself. She requires immediate EMS transport in a lateral position directly to labor and delivery."}, {"d": 3, "q": "A patient in the second stage of labor is pushing effectively. The fetal monitor suddenly displays a prolonged deceleration (heart rate drops to 60 bpm and does not recover for over 3 minutes). The nurse performs a sterile vaginal exam and feels a pulsating loop of umbilical cord entirely bypassing the fetal head. What is the nurse's ABSOLUTE FIRST physical action?", "o": ["Leave the fingers in the vagina and forcefully push the fetal head UP and OFF the umbilical cord, holding it there continuously", "Quickly push the umbilical cord back up into the uterus to keep it moist and warm", "Remove the fingers from the vagina and run to the hallway to yell for the surgeon", "Administer an immediate, massive IV bolus of Oxytocin to force the baby out"], "a": 0, "r": "A prolapsed umbilical cord is a profound, lethal emergency. The fetal head is completely crushing the cord against the pelvis, halting all oxygen delivery. The nurse MUST keep their hand inside the vagina, physically pushing the baby's head UP and OFF the cord to restore blood flow, and must NOT remove their hand until the baby is delivered via emergency C-section."}, {"d": 3, "q": "A pregnant patient at 36 weeks gestation is diagnosed with severe preeclampsia and is receiving a continuous IV infusion of Magnesium Sulfate. The nurse performs an assessment: Blood pressure 145/90 mmHg, Heart rate 80 bpm, Respiratory rate 14 breaths/minute, and Deep Tendon Reflexes (DTRs) are 2+. What is the nurse's interpretation of this assessment?", "o": ["The patient is receiving a safe, perfectly therapeutic level of Magnesium Sulfate", "The patient is experiencing severe Magnesium toxicity and the infusion must be stopped immediately", "The Magnesium dose is too low and the patient is imminently going to have a seizure", "The patient requires an immediate STAT dose of Calcium Gluconate"], "a": 0, "r": "Magnesium sulfate is a powerful CNS depressant used specifically to raise the seizure threshold in preeclampsia. A normal respiratory rate is 12-20, and normal DTRs are 2+. Because this patient's breathing and reflexes are completely normal and intact, the magnesium level is therapeutic and safe. Toxicity is indicated by absent DTRs (0) and respiratory depression (<12)."}, {"d": 3, "q": "A pregnant patient at 36 weeks gestation presents with severe hypertension, 4+ proteinuria, and severe hyperreflexia. Suddenly, the patient begins experiencing a generalized tonic-clonic seizure. The diagnosis is now Eclampsia. What is the nurse's ABSOLUTE FIRST priority action during the active seizure?", "o": ["Turn the patient onto her side to protect the airway and prevent aspiration", "Insert a padded tongue blade into her mouth to prevent tongue biting", "Administer a massive STAT dose of IV Magnesium Sulfate", "Prepare for an immediate, crash Cesarean section"], "a": 0, "r": "During an active eclamptic seizure, the absolute first priority is always maternal safety and airway protection. The nurse must immediately turn the patient on her lateral side (to allow secretions to drain and prevent fatal aspiration) and protect her head from injury. NEVER insert anything into the mouth. Medications follow airway stabilization."}, {"d": 3, "q": "A patient is in the active phase of labor. The fetal heart monitor shows a pattern of Variable Decelerations. The decelerations drop sharply and randomly, having no consistent relationship to the uterine contractions. What is the primary physiological cause of this pattern?", "o": ["Umbilical cord compression", "Fetal head compression", "Uteroplacental insufficiency", "Maternal fever"], "a": 0, "r": "Using the VEAL CHOP mnemonic: Variable decelerations = Cord compression. These decelerations are abrupt, V-shaped or W-shaped drops in the fetal heart rate caused by the fetus temporarily squishing the umbilical cord, cutting off its own blood supply. The first intervention is repositioning the mother to shift the fetus off the cord."}, {"d": 3, "q": "A pregnant patient at 38 weeks gestation is in active labor and receiving a continuous epidural infusion. The nurse assesses the maternal blood pressure and notes it has dropped precipitously from 120/80 to 80/40 mmHg. The fetal monitor shows late decelerations. The nurse turns the patient on her left side and increases the IV fluids, but the BP remains 80/40. What is the absolute FIRST pharmacological intervention?", "o": ["Administer an IV bolus of Ephedrine", "Administer a STAT dose of IV Calcium Gluconate", "Administer a massive IV bolus of Oxytocin", "Administer a STAT dose of IV Magnesium Sulfate"], "a": 0, "r": "Severe maternal hypotension is the most common complication of epidural anesthesia due to sympathetic blockade. If mechanical interventions (positioning and fluids) fail to correct the shock and restore blood flow to the placenta, the nurse must immediately administer a vasopressor. Ephedrine (or phenylephrine) is the drug of choice in obstetrics to rapidly correct epidural-induced hypotension."}, {"d": 3, "q": "A patient who is 24 hours postpartum following a vaginal delivery complains of severe, excruciating vaginal and rectal pain. The pain is not relieved by oral ibuprofen. The nurse assesses the perineum and notes a tense, bulging, bluish-purple mass on the right labia. The patient's blood pressure is dropping. What is the most likely diagnosis?", "o": ["A vaginal or vulvar hematoma", "Normal postpartum episiotomy swelling", "Uterine inversion", "Puerperal endometritis"], "a": 0, "r": "Excruciating, unremitting perineal, vaginal, or rectal pain out of proportion to the visible injury, accompanied by a tense, bulging, purplish mass and signs of hypovolemic shock, is the hallmark presentation of a postpartum hematoma. This is a massive concealed hemorrhage requiring immediate surgical evaluation and evacuation."}, {"d": 3, "q": "A patient at 35 weeks gestation presents to the emergency room with severe, unremitting abdominal pain. Her uterus is rigid and board-like. She has dark red vaginal bleeding, and the fetal heart monitor shows a prolonged deceleration. The physician diagnoses Abruptio Placentae. What is the most common maternal risk factor for developing this catastrophic complication?", "o": ["Severe maternal hypertension (chronic or preeclampsia) or cocaine use", "A history of multiple Cesarean sections", "Advanced maternal age over 40", "A diet deficient in folic acid"], "a": 0, "r": "Abruptio Placentae is the premature separation of the placenta from the uterine wall. The absolute most common causes are conditions that cause severe vasoconstriction and vascular damage in the placental bed, overwhelmingly led by severe maternal hypertension (preeclampsia) and the use of crack/cocaine."}, {"d": 3, "q": "A patient is in the active phase of labor. The nurse notes that the fetal heart rate drops from 140 bpm to 100 bpm starting well AFTER the peak of the contraction, and does not return to baseline until after the contraction is completely over. What specific physiological problem is causing this pattern?", "o": ["Uteroplacental insufficiency, indicating the fetus is experiencing severe hypoxia", "Fetal head compression, indicating normal descent through the birth canal", "Umbilical cord compression, indicating the cord is wrapped around the neck", "Maternal fever, indicating a massive intra-amniotic infection"], "a": 0, "r": "Late decelerations (drops that begin after the peak of the contraction and recover late) are the hallmark sign of uteroplacental insufficiency. The placenta is failing to deliver enough oxygen during the stress of the contraction, leading to fetal hypoxia. The nurse must execute the LION protocol (Left side, IV fluids, O2, Notify provider)."}, {"d": 3, "q": "A pregnant patient at 36 weeks gestation presents to the clinic with severe, unremitting hypertension (180/115 mmHg), 4+ proteinuria, and severe right upper quadrant (RUQ) abdominal pain. Laboratory results reveal elevated AST/ALT and a platelet count of 45,000/mm³. What catastrophic complication is occurring?", "o": ["HELLP Syndrome", "Eclampsia", "Gestational Trophoblastic Disease", "Normal progression of severe preeclampsia"], "a": 0, "r": "HELLP Syndrome stands for Hemolysis, Elevated Liver enzymes, and Low Platelets. It is an extreme, life-threatening variant of severe preeclampsia. The classic presentation includes massive hypertension, proteinuria, and severe right upper quadrant/epigastric pain (caused by liver distension/ischemia), along with the diagnostic triad of dropping platelets, spiking liver enzymes, and hemolysis. Immediate delivery is usually required."}, {"d": 3, "q": "A patient is admitted to labor and delivery at 40 weeks gestation. She is completely dilated (10 cm) and actively pushing. The fetal head crowns and delivers, but then firmly retracts back against the maternal perineum ('turtle sign'). The physician diagnoses Shoulder Dystocia. What is the nurse's ABSOLUTE FIRST physical intervention?", "o": ["Assist the mother into the McRoberts maneuver (sharply flexing her thighs back against her abdomen) and apply firm, direct suprapubic pressure", "Apply massive, forceful fundal pressure to the top of the uterus to push the baby out", "Prepare the vacuum extractor or forceps for immediate use by the physician", "Administer a massive IV bolus of Oxytocin to increase contraction strength"], "a": 0, "r": "Shoulder dystocia is a massive obstetrical emergency where the fetal anterior shoulder gets physically stuck behind the mother's pubic bone. The first-line, life-saving intervention is the McRoberts maneuver (which flattens the sacrum and opens the pelvic angle) combined with firm suprapubic pressure (pushing directly over the pubic bone to dislodge the shoulder). Fundal pressure is strictly, absolutely contraindicated as it wedges the shoulder tighter and can rupture the uterus."}, {"d": 3, "q": "A postpartum nurse is assessing lochia 5 days after a normal vaginal delivery. What normal, expected type of lochia should the nurse observe on the perineal pad?", "o": ["Lochia serosa (pinkish-brown discharge)", "Lochia rubra (bright red bloody discharge)", "Lochia alba (creamy white or yellow discharge)", "Lochia purulenta (foul-smelling green discharge)"], "a": 0, "r": "Lochia progression: Rubra (dark red, days 1-3), Serosa (pinkish-brown, days 4-10), and Alba (creamy white/yellow, days 11 up to 6 weeks). At day 5, lochia serosa is expected."}, {"d": 3, "q": "A pregnant patient at 30 weeks gestation is diagnosed with Gestational Diabetes. She undergoes a 3-hour Oral Glucose Tolerance Test (OGTT). What fasting blood glucose level threshold confirms Gestational Diabetes?", "o": ["Fasting blood glucose >= 95 mg/dL", "Fasting blood glucose >= 140 mg/dL", "Fasting blood glucose >= 200 mg/dL", "Fasting blood glucose >= 70 mg/dL"], "a": 0, "r": "In the 3-hour 100g OGTT, Gestational Diabetes is diagnosed if two or more thresholds are met: Fasting >= 95 mg/dL, 1-hour >= 180 mg/dL, 2-hour >= 155 mg/dL, 3-hour >= 140 mg/dL."}, {"d": 3, "q": "A patient who is 1 hour postpartum experiences heavy vaginal bleeding. The nurse palpates the fundus and finds it soft, boggy, and located 2 cm above the umbilicus. What is the nurse's IMMEDIATE first action?", "o": ["Perform firm fundal massage until the uterus becomes hard and contracted", "Administer IV Oxytocin immediately", "Assist the patient to the bathroom to void", "Call the physician for an emergency hysterectomy"], "a": 0, "r": "The primary cause of early postpartum hemorrhage is uterine atony (soft, boggy uterus). The immediate first action is to perform firm, continuous fundal massage to stimulate the uterine muscle fibers to contract and compress bleeding vessels."}, {"d": 4, "q": "A 4-year-old child presents with high fever, sore throat, severe drooling, dysphagia, and sits leaning forward in a tripod position with an open mouth. What action is strictly CONTRAINDICATED?", "o": ["Examining the throat using a tongue depressor", "Administering humidified oxygen", "Keeping the child as calm as possible", "Preparing emergency tracheostomy equipment"], "a": 0, "r": "These classic 4 Ds (Drooling, Dysphagia, Dysphonia, Distress) indicate Acute Epiglottitis. Any attempt to inspect the throat or insert a tongue depressor can trigger fatal reflex laryngospasm and complete airway occlusion. Emergency airway equipment must be ready."}, {"d": 4, "q": "A 2-year-old child is brought to the clinic with a barking seal-like cough, hoarseness, and inspiratory stridor at rest. What is the primary medical treatment for moderate-to-severe Croup?", "o": ["Single dose of oral/IM Dexamethasone and nebulized L-Epinephrine", "Continuous IV antibiotic infusion", "Oral cough suppressant syrup", "Immediate surgical tonsillectomy"], "a": 0, "r": "Croup (laryngotracheobronchitis) is managed with corticosteroids (Dexamethasone) to reduce airway edema and nebulized Epinephrine for rapid relief of inspiratory stridor at rest."}, {"d": 4, "q": "A 9-month-old infant presenting with gastroenteritis has a sunken anterior fontanelle, dry mucous membranes, absent tears when crying, and a skin pinch that unfolds slowly. The infant is alert with strong peripheral pulses and a normal capillary refill. How should this infant's dehydration be managed initially?", "o": ["Oral Rehydration Solution (ORS) 50-100 mL/kg over 4 hours", "Immediate IV bolus 50 mL/kg Dextrose 10%", "Offering plain tap water in unlimited quantities", "Withholding all fluids for 12 hours"], "a": 0, "r": "Mild-to-moderate dehydration in an alert infant with intact peripheral perfusion is treated with Oral Rehydration Solution (ORS) administered in small, frequent volumes (50-100 mL/kg over 4 hours). Plain water can cause hyponatremia. IV fluids are reserved for severe dehydration/hypovolemic shock (e.g., lethargy, weak pulses, delayed capillary refill)."}, {"d": 4, "q": "An 8-month-old infant experiences sudden paroxysms of severe abdominal pain where he screams and draws his knees up to his chest, followed by vomiting. Later, the infant passes a stool containing blood and mucus ('currant jelly stool'). What is the diagnosis?", "o": ["Intussusception", "Pyloric Stenosis", "Appendicitis", "Celiac Disease"], "a": 0, "r": "Intussusception (telescoping of bowel) presents with intermittent severe abdominal pain, legs flexed to chest, sausage-shaped abdominal mass, and classic 'currant jelly' stools containing blood and mucus. Air or contrast enema is diagnostic and curative."}, {"d": 4, "q": "A 5-year-old child diagnosed with Kawasaki Disease is admitted. What is the primary life-threatening complication the nurse must monitor for?", "o": ["Coronary artery aneurysms and myocardial infarction", "Acute renal failure", "Bacterial meningitis", "Pulmonary hemorrhage"], "a": 0, "r": "Kawasaki Disease causes systemic vasculitis. Without prompt treatment with High-Dose IV Immunoglobulin (IVIG) and Aspirin, up to 25% of children develop coronary artery aneurysms."}, {"d": 4, "q": "A child with Cystic Fibrosis is prescribed Pancrelipase (pancreatic enzymes). How should the nurse instruct the parents to administer this medication?", "o": ["Administer with every meal and snack", "Administer once daily at bedtime on an empty stomach", "Administer only when the child has abdominal pain", "Mix the capsule contents with warm milk"], "a": 0, "r": "Pancreatic enzymes must be taken immediately before or with all meals and snacks to enable digestion and absorption of fats and proteins in patients with pancreatic exocrine insufficiency."}, {"d": 4, "q": "A 10-year-old child with Sickle Cell Disease is admitted in a Vaso-Occlusive Crisis reporting severe joint and bone pain. What are the nurse's PRIORITY interventions?", "o": ["Aggressive IV hydration, opioid analgesia, and oxygen if hypoxic", "Fluid restriction, cold ice packs applied to joints, and bed rest", "High-dose aspirin therapy and ice baths", "Strict NPO status and fluid restriction"], "a": 0, "r": "Vaso-occlusive crisis management requires aggressive IV hydration (promotes microvascular flow), effective pain control (opioids), and oxygen administration if hypoxemic. Ice packs are contraindicated as cold causes vasospasm and increased sickling."}, {"d": 4, "q": "Which intramuscular (IM) injection site is preferred for administering vaccines to an infant under 12 months of age?", "o": ["Vastus lateralis muscle in the anterolateral thigh", "Deltoid muscle", "Dorsogluteal site", "Ventrogluteal site"], "a": 0, "r": "The vastus lateralis muscle in the anterolateral thigh is the largest and safest IM injection site in infants under 12 months."}, {"d": 4, "q": "A 3-year-old child is brought to the ER with multiple bruises in various stages of healing, patterned cigarette burn marks on the soles, and retinal hemorrhages. The caregiver's explanation is inconsistent with the injuries. What is the nurse's legal obligation?", "o": ["Report the suspected child abuse immediately to child protective services / hospital authorities", "Confront the caregiver aggressively in the waiting room", "Discharge the child with pain medication and schedule a 1-month follow-up", "Wait for the child to confess before taking action"], "a": 0, "r": "Healthcare professionals are mandatory reporters. Suspected child abuse (injuries inconsistent with history, patterned burns, retinal hemorrhages) requires immediate reporting to child protective authorities."}, {"d": 4, "q": "A 6-month-old infant is brought to the clinic for a well-baby checkup. Which developmental milestone should the nurse expect the infant to have achieved?", "o": ["Rolling from back to abdomen", "Walking independently", "Saying 3 to 5 clear words", "Building a tower of 6 blocks"], "a": 0, "r": "By 6 months of age, infants should be able to roll from their back to their abdomen. Walking is around 12-15 months, talking words is around 12 months, and block building is a toddler skill."}, {"d": 4, "q": "A toddler is diagnosed with Tetralogy of Fallot. During a blood draw, the child begins to cry vigorously, turns deep blue (cyanotic), and experiences respiratory distress. What is the nurse's immediate action?", "o": ["Place the child in a knee-chest position", "Administer a rapid fluid bolus of normal saline", "Initiate CPR immediately", "Place the child flat on their back and elevate their legs"], "a": 0, "r": "This is a 'Tet spell' (hypercyanotic spell) caused by increased right-to-left shunting of unoxygenated blood. Placing the child in a knee-chest position increases systemic vascular resistance, forces blood back into the pulmonary artery, and improves oxygenation."}, {"d": 4, "q": "A child is brought to the ER with a high fever, a 'strawberry tongue', cracked lips, and peeling skin on the hands and feet. Which medication is the standard of care to prevent coronary artery aneurysms in this child?", "o": ["Intravenous Immunoglobulin (IVIG) and high-dose Aspirin", "Oral antibiotics and Ibuprofen", "Intravenous corticosteroids and Heparin", "Acyclovir and oral Paracetamol"], "a": 0, "r": "These are the classic signs of Kawasaki disease. The standard treatment is IVIG and high-dose Aspirin to reduce systemic inflammation and prevent the life-threatening complication of coronary artery aneurysms. (This is the rare exception to the 'no aspirin in children' rule)."}, {"d": 4, "q": "A 4-year-old child with cystic fibrosis requires airway clearance therapy. What is the underlying pathophysiology causing respiratory issues in CF?", "o": ["A genetic defect causing exocrine glands to produce abnormally thick, sticky mucus", "An allergic reaction causing severe bronchospasm", "A bacterial infection that permanently destroys the alveolar sacs", "A congenital defect in the shape of the trachea"], "a": 0, "r": "Cystic Fibrosis is an autosomal recessive genetic disorder affecting the CFTR protein. It causes the exocrine glands to produce incredibly thick, tenacious mucus that obstructs the airways (leading to infections) and the pancreatic ducts (leading to malabsorption)."}, {"d": 4, "q": "A 12-month-old infant is severely allergic to eggs (anaphylaxis). Which vaccine is traditionally considered CONTRAINDICATED or requires extreme caution for this child?", "o": ["Influenza vaccine (Flu) and Yellow Fever", "Measles, Mumps, Rubella (MMR)", "Hepatitis B", "Diphtheria, Tetanus, Pertussis (DTaP)"], "a": 0, "r": "Certain vaccines (like Yellow Fever and traditional egg-based Influenza vaccines) are cultured in chick embryos. However, modern guidelines for flu vaccines have relaxed. Yellow fever remains strictly contraindicated. (Note: MMR is cultured in chick fibroblasts, not the egg white, and is generally safe for egg-allergic children)."}, {"d": 4, "q": "A child with Nephrotic Syndrome is admitted with severe generalized edema, proteinuria, and hypoalbuminemia. Which nursing intervention is a priority for this patient?", "o": ["Strict daily weight measurement and strict fluid/sodium restriction", "Encouraging a high-sodium diet to replace lost electrolytes", "Administering a continuous IV infusion of Normal Saline", "Encouraging strenuous physical activity to mobilize fluid"], "a": 0, "r": "Nephrotic syndrome is characterized by massive protein loss in the urine, leading to low serum albumin and massive edema. Management requires strict intake/output, daily weights to track fluid status, and a low-sodium diet."}, {"d": 4, "q": "A 7-year-old child presents with dark 'cola-colored' urine, facial edema, and hypertension. The mother states the child had a severe sore throat two weeks ago. What is the most likely diagnosis?", "o": ["Acute Post-Streptococcal Glomerulonephritis (APSGN)", "Nephrotic Syndrome", "Urinary Tract Infection (UTI)", "Hemolytic Uremic Syndrome (HUS)"], "a": 0, "r": "APSGN often occurs 10-14 days after a Group A Beta-Hemolytic Streptococcus infection (impetigo or strep throat). It presents with gross hematuria ('cola' urine), facial edema, and hypertension due to fluid retention."}, {"d": 4, "q": "A toddler is diagnosed with a ventricular septal defect (VSD). The nurse knows this congenital heart defect causes what type of blood shunting?", "o": ["Acyanotic: Left-to-Right shunt", "Cyanotic: Right-to-Left shunt", "Acyanotic: Right-to-Left shunt", "Cyanotic: Left-to-Right shunt"], "a": 0, "r": "VSD is an acyanotic defect. Because the pressure in the left ventricle is higher than the right, oxygenated blood shunts from the left side of the heart back to the right side, increasing pulmonary blood flow but not causing systemic cyanosis."}, {"d": 4, "q": "A nurse is assessing a child with suspected developmental dysplasia of the hip (DDH). Which physical finding supports this diagnosis in an infant?", "o": ["Asymmetry of gluteal and thigh folds", "Symmetrical lengthening of the affected leg", "Negative Ortolani maneuver", "Absent Babinski reflex"], "a": 0, "r": "Classic signs of DDH in an infant include asymmetric gluteal and thigh skin folds, apparent shortening of the femur on the affected side (Galeazzi sign), limited hip abduction, and positive Ortolani/Barlow maneuvers."}, {"d": 4, "q": "An adolescent is fitted for a Milwaukee brace for scoliosis. What is the most crucial teaching point for the nurse to emphasize?", "o": ["The brace must be worn for 23 hours a day, removing it only for showering", "The brace should only be worn while sleeping at night", "Wear the brace directly against the skin to ensure a tight fit", "The brace will completely cure the spinal curvature within 6 months"], "a": 0, "r": "To be effective in halting the progression of scoliosis, a spinal brace must be worn for 18-23 hours a day. It should be worn over a thin, tight cotton t-shirt to protect the skin from breakdown."}, {"d": 4, "q": "A newborn is diagnosed with Hirschsprung's disease. What is the classic initial sign of this condition in the neonatal period?", "o": ["Failure to pass meconium within the first 24-48 hours of life", "Projectile, non-bilious vomiting immediately after feeding", "Current jelly stools", "Hyperactive bowel sounds and continuous diarrhea"], "a": 0, "r": "Hirschsprung's disease (congenital aganglionic megacolon) involves a lack of nerve cells in a section of the colon, preventing peristalsis. The hallmark sign in neonates is the failure to pass the first meconium stool within 24 to 48 hours."}, {"d": 4, "q": "A 5-year-old child is receiving a blood transfusion. The child suddenly complains of chills, a headache, and has a temperature spike. What is the nurse's FIRST action?", "o": ["Stop the blood transfusion immediately", "Slow the rate of the transfusion and monitor", "Administer oral paracetamol and wait 15 minutes", "Call the physician while the blood continues to infuse"], "a": 0, "r": "Any sign of an adverse reaction during a blood transfusion requires the nurse to STOP the infusion immediately as the first action to prevent a potentially fatal hemolytic or anaphylactic crisis."}, {"d": 4, "q": "A parent asks the nurse when their child can safely be transitioned from a rear-facing car seat to a forward-facing car seat. Based on current safety guidelines, what is the best response?", "o": ["When the child reaches the highest weight or height allowed by the car seat manufacturer (typically around age 2 or older)", "Exactly on the child's 1st birthday", "When the child's legs touch the back seat of the car", "When the child reaches a weight of 10 kg (22 lbs)"], "a": 0, "r": "Current AAP guidelines recommend keeping toddlers in a rear-facing car seat for as long as possible, until they reach the maximum weight or height limit for their specific seat (which is often past 2 years of age). Rear-facing provides the best protection for a child's head, neck, and spine."}, {"d": 4, "q": "A child presents to the emergency department after ingesting an unknown quantity of a toxic household cleaner. What intervention is generally CONTRAINDICATED in modern pediatric toxicology?", "o": ["Administering Syrup of Ipecac to induce vomiting", "Administering Activated Charcoal", "Contacting Poison Control immediately", "Ensuring a patent airway"], "a": 0, "r": "Syrup of Ipecac is no longer recommended and is often contraindicated. Inducing vomiting can cause aspiration of the chemical into the lungs or cause secondary damage to the esophagus if the substance is caustic/corrosive."}, {"d": 4, "q": "A 3-year-old child is hospitalized with Respiratory Syncytial Virus (RSV) bronchiolitis. What type of isolation precautions should the nurse implement?", "o": ["Contact precautions", "Airborne precautions", "Droplet precautions", "Standard precautions only"], "a": 0, "r": "RSV is highly contagious and survives for hours on surfaces. It is primarily transmitted through direct contact with respiratory secretions and contaminated fomites. Contact precautions (gown and gloves) are mandatory, and droplet precautions may also be added per facility policy."}, {"d": 4, "q": "A 10-year-old child presents to the emergency room with a sudden onset of high fever, headache, vomiting, and a purpuric/petechial rash on the lower extremities. The child is extremely lethargic. What is the nurse's IMMEDIATE priority?", "o": ["Place the child in strict droplet isolation and prepare to administer IV antibiotics", "Administer an oral antipyretic and perform a tepid sponge bath", "Apply a topical corticosteroid cream to the rash", "Prepare the child for a STAT abdominal ultrasound"], "a": 0, "r": "High fever, headache, lethargy, and a rapidly spreading non-blanching petechial or purpuric rash are hallmark signs of Meningococcal Meningitis/Septicemia, a rapidly fatal emergency. Immediate droplet isolation and rapid administration of broad-spectrum IV antibiotics are the highest priorities."}, {"d": 4, "q": "A parent brings a 4-year-old child to the clinic, stating the child has been scratching their perianal area intensely, especially at night. The nurse suspects enterobiasis (pinworms). Which diagnostic method should the nurse anticipate?", "o": ["The transparent tape test applied to the perianal area early in the morning", "A comprehensive stool culture for ova and parasites", "A complete blood count to check for eosinophilia", "A rapid antigen swab of the rectum"], "a": 0, "r": "Pinworms (Enterobius vermicularis) migrate out of the anus at night to lay eggs on the perianal skin, causing intense pruritus. The gold standard diagnostic is the 'tape test'—applying clear tape to the perianal area immediately upon waking in the morning to catch the eggs."}, {"d": 4, "q": "A 7-year-old child is brought to the clinic with severe, unrelenting bone pain in the right femur, fever, and a history of a recent severe skin infection. Blood tests show an elevated WBC count and ESR. What severe condition should the nurse suspect?", "o": ["Acute Osteomyelitis", "Ewing Sarcoma", "Juvenile Idiopathic Arthritis", "A simple stress fracture"], "a": 0, "r": "Acute osteomyelitis is a severe bacterial infection of the bone (often Staphylococcus aureus), frequently resulting from hematogenous spread from a recent skin or respiratory infection. It presents with severe localized bone pain, swelling, fever, and elevated inflammatory markers (WBC, ESR, CRP)."}, {"d": 4, "q": "A 2-month-old infant is admitted with suspected Meningitis. The physician orders a lumbar puncture. In what position should the nurse securely hold the infant during the procedure?", "o": ["Side-lying with the knees flexed tightly to the abdomen and the head flexed to the chest (fetal position)", "Flat on the abdomen (prone) with the head turned to one side", "Upright sitting position with the legs dangling off the bed", "Flat on the back (supine) with the arms restrained above the head"], "a": 0, "r": "For a pediatric lumbar puncture, the nurse must securely hold the infant in a lateral decubitus (side-lying) 'C' or fetal position. Flexing the neck to the chest and drawing the knees up maximally widens the intervertebral spaces, allowing safe needle insertion."}, {"d": 4, "q": "A child is diagnosed with Hemophilia A. The child falls and sustains a severe hemarthrosis (bleeding into the joint) of the right knee. What is the FIRST and most critical intervention the nurse must prepare to administer?", "o": ["Intravenous Factor VIII concentrate", "Intramuscular Vitamin K", "A tight compression bandage and heat packs", "A rapid infusion of whole blood"], "a": 0, "r": "Hemophilia A is a genetic deficiency of clotting Factor VIII. Any significant bleeding, especially hemarthrosis, is a medical emergency that requires the immediate, direct IV replacement of the missing Factor VIII to arrest the bleeding and prevent permanent joint destruction."}, {"d": 4, "q": "A nurse is assessing a 4-year-old child with a suspected urinary tract infection (UTI). Which clinical manifestation is most commonly seen in young children with a UTI compared to adults?", "o": ["New-onset bedwetting (enuresis) in a previously toilet-trained child", "Severe, localized flank pain radiating to the groin", "Gross hematuria turning the toilet water bright red", "A massive output of highly dilute, odorless urine"], "a": 0, "r": "While adults present with classic dysuria and frequency, young children with UTIs often present with vague symptoms like unexplained fever, irritability, poor appetite, and very notably, secondary enuresis (new-onset daytime or nighttime incontinence in a child who was previously potty-trained)."}, {"d": 4, "q": "A 6-year-old child with a known peanut allergy accidentally consumes a cookie containing peanuts and begins to experience wheezing, facial swelling, and tachycardia. The nurse administers the child's prescribed Epinephrine auto-injector (EpiPen). What is the crucial next step?", "o": ["Call for an ambulance or take the child to the nearest emergency department immediately", "Allow the child to rest in a dark, quiet room for 2 hours", "Administer a second dose of epinephrine immediately in the other leg", "Give the child a large glass of water to flush the allergen out of the system"], "a": 0, "r": "An Epinephrine auto-injector is a temporary, life-saving measure. Its effects wear off in 10-20 minutes, and a fatal secondary (biphasic) anaphylactic reaction can occur. Anyone who receives Epinephrine MUST be transported to an emergency department for advanced observation and treatment."}, {"d": 4, "q": "A 4-month-old infant is brought to the clinic for routine immunizations. The nurse is preparing to administer the DTaP, RV, IPV, Hib, and PCV vaccines. Based on the infant's age, what is the best site for the intramuscular (IM) injections?", "o": ["Vastus lateralis muscle of the anterolateral thigh", "Deltoid muscle of the arm", "Dorsogluteal muscle of the buttocks", "Ventrogluteal muscle"], "a": 0, "r": "The vastus lateralis muscle (the thick muscle on the anterolateral aspect of the thigh) is the largest, best developed, and safest muscle in infants and toddlers (under 3 years) for intramuscular injections, free from major nerves and blood vessels."}, {"d": 4, "q": "A 2-year-old child presents to the emergency department with a sudden onset of a harsh, 'barking' cough, hoarseness, and inspiratory stridor. The child does not have a high fever and is not drooling. What respiratory condition is most likely?", "o": ["Laryngotracheobronchitis (Viral Croup)", "Acute Epiglottitis", "Pertussis (Whooping Cough)", "Foreign body aspiration"], "a": 0, "r": "Viral croup classically affects children aged 6 months to 3 years. It is characterized by inflammation of the larynx and trachea, producing the hallmark 'seal-like barking' cough, hoarseness, and inspiratory stridor, usually worse at night."}, {"d": 4, "q": "A 10-year-old child with sickle cell anemia is admitted with a vaso-occlusive pain crisis. The child is crying in severe pain. What are the two cornerstone medical interventions the nurse must initiate immediately?", "o": ["Aggressive intravenous hydration and administration of opioid analgesics", "Administration of high-dose Aspirin and application of cold packs to the joints", "Immediate initiation of prophylactic broad-spectrum antibiotics and isolation", "Strict fluid restriction and immediate blood transfusion"], "a": 0, "r": "During a vaso-occlusive crisis, sickled red blood cells clump and block microvasculature, causing extreme ischemic pain. The cornerstone of treatment is aggressive IV hydration (to hemodilute the blood and improve flow) and strong opioid analgesia (morphine/Dilaudid) for pain control. Oxygen is added if hypoxic."}, {"d": 4, "q": "An infant is born with a myelomeningocele (spina bifida). While awaiting surgical closure of the defect, what is the nurse's absolute priority in managing the sac on the infant's back?", "o": ["Cover the sac with a sterile, saline-moistened non-adherent dressing to prevent drying and infection", "Apply a dry, tight pressure dressing over the sac to prevent it from growing", "Leave the sac completely open to the air to allow it to harden", "Clean the sac vigorously with providone-iodine every 2 hours"], "a": 0, "r": "A myelomeningocele is an open neural tube defect where the spinal cord and meninges protrude in a sac. It is extremely fragile. The absolute priority is to prevent rupture, drying, and fatal CNS infection (meningitis) by covering it with a sterile, saline-soaked gauze and keeping the infant prone."}, {"d": 4, "q": "A 3-year-old child is admitted to the pediatric unit with a diagnosis of Nephrotic Syndrome. The child has massive ascites, severe periorbital edema, and 4+ proteinuria. The nurse receives an order to administer intravenous 25% Albumin followed by IV Furosemide. What is the physiological rationale for giving the Albumin FIRST?", "o": ["Albumin increases intravascular oncotic pressure, pulling the edema fluid from the tissues back into the blood vessels so the Furosemide can excrete it", "Albumin directly repairs the damaged glomeruli in the kidneys to stop the protein leak", "Albumin completely replaces the lost red blood cells to prevent severe anemia", "Albumin acts as a powerful broad-spectrum antibiotic to cure the underlying kidney infection"], "a": 0, "r": "In Nephrotic Syndrome, massive loss of protein in the urine leads to profound hypoalbuminemia. Without albumin in the blood, oncotic pressure drops, and fluid leaks into the tissues (massive edema). Administering highly concentrated (25%) IV Albumin acts as a 'sponge', rapidly pulling the fluid out of the tissues and back into the vascular space. Once the fluid is in the blood vessels, the loop diuretic (Furosemide) is given to force the kidneys to excrete it."}, {"d": 4, "q": "A pediatric nurse is preparing to administer an oral liquid medication to a 9-month-old infant. What is the safest and most effective technique for administration?", "o": ["Use an oral syringe and slowly instill the medication into the side of the infant's mouth (the buccal pouch)", "Mix the medication into the infant's full 8-ounce bottle of formula to mask the taste", "Pinch the infant's nose shut so they are forced to swallow the medication", "Squirt the medication rapidly into the very back of the infant's throat"], "a": 0, "r": "To prevent aspiration and ensure the full dose is swallowed, liquid medications should be administered using an oral syringe (never an IV syringe). The nurse should gently insert the syringe into the side of the mouth (the buccal pouch) alongside the tongue and instill the liquid slowly in small amounts. Medication should NEVER be mixed into a full bottle of milk, because if the infant does not finish the bottle, they do not get the full dose."}, {"d": 4, "q": "A 2-year-old child is hospitalized with a severe asthma exacerbation. The nurse is preparing to administer Albuterol via a nebulizer. Which assessment finding demonstrates that the Albuterol has been EFFECTIVE?", "o": ["The child's wheezing decreases, their SpO2 increases to 96%, and their work of breathing visibly decreases", "The child's heart rate increases from 110 to 145 bpm", "The child falls into a deep, unarousable sleep", "The child's respiratory rate drops from 40 to 8 breaths per minute"], "a": 0, "r": "Albuterol is a short-acting Beta-2 agonist (bronchodilator). The ultimate goal and sign of effectiveness is a reversal of the bronchospasm—manifested by decreased wheezing, improved oxygenation, and a reduction in accessory muscle use/retractions. While tachycardia is a common *side effect*, it is not the *indicator of effectiveness*. A severe drop in RR or unarousable sleep indicates impending fatal respiratory failure."}, {"d": 4, "q": "A 6-month-old infant is brought to the clinic. The mother states the infant has been exclusively breastfed and refuses any solid foods. The infant appears pale and lethargic. A CBC reveals a Hemoglobin of 8.5 g/dL. What nutritional deficiency is this infant most likely experiencing?", "o": ["Iron-Deficiency Anemia", "Vitamin C Deficiency (Scurvy)", "Vitamin D Deficiency (Rickets)", "Folate Deficiency"], "a": 0, "r": "Infants are born with a reserve of maternal iron that lasts approximately 4 to 6 months. Breast milk contains incredibly little iron. If an exclusively breastfed infant does not start receiving iron-fortified cereals or iron drops by 6 months of age, they rapidly deplete their stores and develop severe Iron-Deficiency Anemia."}, {"d": 4, "q": "A child is diagnosed with Celiac Disease. The nurse is providing dietary teaching to the parents. Which food choice by the parents indicates they understand the absolute dietary restrictions?", "o": ["A dinner consisting of grilled chicken, baked potatoes, and corn", "A breakfast of oatmeal with rye toast", "A lunch of whole wheat pasta and tomato sauce", "A snack of barley crackers and cheese"], "a": 0, "r": "Celiac disease is an autoimmune reaction to gluten, a protein found in Wheat, Barley, Rye, and Oats (the BROW acronym—though pure oats are technically safe, they are massively cross-contaminated in factories). The child must follow a strict, lifelong gluten-free diet. Potatoes, corn, and rice are safe alternatives."}, {"d": 4, "q": "A 4-year-old child is admitted with a diagnosis of Wilms' Tumor (Nephroblastoma). The nurse notes a sign hanging above the child's bed. What critical instruction MUST this sign convey to all healthcare staff?", "o": ["DO NOT PALPATE THE ABDOMEN", "PLACE CHILD IN STRICT AIRBORNE ISOLATION", "NO BLOOD DRAWS FROM THE RIGHT ARM", "KEEP THE HEAD OF BED FLAT AT ALL TIMES"], "a": 0, "r": "A Wilms' Tumor is a massive, highly friable, encapsulated kidney tumor found in young children. Deep palpation of the abdomen can easily rupture the delicate capsule surrounding the tumor, causing massive, fatal seeding of cancer cells throughout the entire peritoneal cavity. A sign stating 'DO NOT PALPATE ABDOMEN' is absolutely mandatory."}, {"d": 4, "q": "A 5-year-old child is brought to the emergency department after falling off a swing and fracturing their right radius. The arm is placed in a plaster cast. Two hours later, the child is crying inconsolably, stating the arm hurts worse than before the cast was put on. The fingers are swollen, cold, and pale. What must the nurse do?", "o": ["Notify the healthcare provider immediately; this indicates compartment syndrome", "Elevate the right arm on two pillows to reduce the swelling", "Apply an ice pack directly to the cast over the fracture site", "Administer the prescribed oral PRN acetaminophen and wait 30 minutes"], "a": 0, "r": "Severe, escalating pain that is out of proportion to the injury and unrelieved by analgesics, combined with pallor, coolness, and swelling, are the hallmark signs of Compartment Syndrome. The cast must be split (bivalved) immediately to save the limb. Elevating the limb decreases arterial flow and worsens ischemia."}, {"d": 4, "q": "A pediatric nurse is teaching the parents of a child newly diagnosed with Cystic Fibrosis (CF) about dietary requirements. Which diet is appropriate for this child?", "o": ["High-calorie, high-protein, and high-fat diet with pancreatic enzyme replacement", "Low-calorie, low-fat diet to prevent obesity", "Gluten-free, dairy-free diet", "Low-sodium, fluid-restricted diet"], "a": 0, "r": "Children with CF have thick mucus that blocks the pancreatic ducts, causing severe malabsorption of fats and proteins. To grow and thrive, they require a high-calorie, high-protein, and high-fat diet, supplemented with pancreatic enzymes given directly before every meal and snack."}, {"d": 4, "q": "A 4-year-old child with Hemophilia A falls and severely hits his knee, which is now rapidly swelling and extremely painful. What is the most critical intervention the nurse should prepare for?", "o": ["Administration of intravenous Factor VIII concentrate", "Administration of intramuscular Vitamin K", "Applying hot compresses and performing range-of-motion exercises", "Administering high-dose oral Ibuprofen"], "a": 0, "r": "Hemophilia A is a genetic deficiency of clotting Factor VIII. Acute bleeding into a joint (hemarthrosis) is a medical emergency that rapidly destroys the joint cartilage. The only definitive treatment to stop the bleeding is replacing the missing clotting factor (IV Factor VIII) immediately. NSAIDs (Ibuprofen) are contraindicated as they inhibit platelets."}, {"d": 4, "q": "A pediatric patient is admitted with suspected Acute Epiglottitis. The child is sitting in a tripod position, drooling heavily, and struggling to breathe. What equipment MUST the nurse ensure is immediately available at the bedside?", "o": ["An emergency tracheostomy and intubation kit", "A tongue depressor and a penlight", "A nebulizer mask with Albuterol", "A continuous positive airway pressure (CPAP) machine"], "a": 0, "r": "Acute epiglottitis is a massive bacterial swelling of the epiglottis that can completely occlude the airway in minutes. The nurse must NEVER look in the mouth or use a tongue depressor, as this triggers fatal laryngospasm. An emergency surgical airway kit (tracheostomy/intubation) must be at the bedside at all times."}, {"d": 4, "q": "A 6-year-old child is admitted with a diagnosis of Acute Post-Streptococcal Glomerulonephritis (APSGN). The child has facial edema and macroscopic hematuria (cola-colored urine). What is the most critical nursing assessment to perform frequently on this child?", "o": ["Blood pressure monitoring", "Assessment of deep tendon reflexes", "Hourly pupil checks", "Monitoring for signs of a new skin infection"], "a": 0, "r": "APSGN causes severe inflammation of the glomeruli, leading to massive fluid and sodium retention. This rapid fluid volume excess causes dangerous, life-threatening severe hypertension, which can quickly lead to hypertensive encephalopathy and seizures. Strict BP monitoring is paramount."}, {"d": 4, "q": "A 4-year-old child presents to the ER with a sudden high fever, severe sore throat, drooling, and is sitting in a 'tripod' position. The child's voice is muffled. What action by the nurse is STRICTLY PROHIBITED?", "o": ["Using a tongue depressor to inspect the back of the child's throat", "Administering humidified 100% oxygen via blow-by", "Keeping the child as calm and comfortable as possible", "Ensuring an emergency intubation/tracheostomy kit is at the bedside"], "a": 0, "r": "This is the classic presentation of Acute Epiglottitis. Any attempt to inspect the throat with a tongue depressor or agitate the child can trigger an immediate, fatal reflex laryngospasm, causing complete airway occlusion. An airway must be secured in the OR."}, {"d": 4, "q": "A 3-year-old child is admitted to the pediatric ICU with a diagnosis of Meningococcemia. The child has a rapidly spreading petechial rash. What is the absolute FIRST isolation precaution the nurse must implement?", "o": ["Place the child in a private room and implement strict Droplet Precautions", "Place the child in a negative-pressure room and implement strict Airborne Precautions", "Implement strict Contact Precautions only", "No isolation is needed once antibiotics are started"], "a": 0, "r": "Meningococcal meningitis/septicemia (caused by Neisseria meningitidis) is highly contagious and transmitted through large respiratory droplets. The child must immediately be placed in strict Droplet Precautions (private room, surgical mask for staff within 3 feet) until they have received 24 hours of effective IV antibiotics."}, {"d": 4, "q": "A 5-year-old child with a history of sickle cell anemia is brought to the ER with a temperature of 102.5°F (39.2°C). Why is a fever in a child with sickle cell disease considered an absolute, life-threatening emergency?", "o": ["Because their spleens are non-functional (autosplenectomy), placing them at immense risk for overwhelming, fatal bacterial sepsis", "Because the fever will directly melt the red blood cells, causing massive bleeding", "Because the fever will trigger an immediate sickle cell stroke", "Because they are allergic to most antipyretic medications"], "a": 0, "r": "By age 5, most children with sickle cell anemia have suffered micro-infarctions that destroy their spleen (autosplenectomy). The spleen is critical for fighting encapsulated bacteria (like pneumococcus). A fever indicates an infection that, without a spleen, can rapidly erupt into overwhelming, fatal bacterial sepsis within hours."}, {"d": 4, "q": "A 2-year-old child is admitted to the pediatric unit with a diagnosis of Respiratory Syncytial Virus (RSV) bronchiolitis. The child is tachypneic and has copious, thick nasal secretions. What is the nurse's priority intervention?", "o": ["Vigorously suction the nares with a bulb syringe or nasal aspirator, especially before feedings", "Administer a STAT dose of IV antibiotics", "Place the child in strict Airborne isolation", "Administer a heavy sedative to calm the child down"], "a": 0, "r": "Infants and toddlers are obligate nose-breathers. RSV causes massive amounts of thick, sticky nasal mucus that completely blocks their airway, causing severe respiratory distress and an inability to feed. Frequent, rigorous nasal suctioning (using saline drops and a bulb syringe/aspirator) is the absolute cornerstone of RSV management. RSV is viral, so antibiotics are useless."}, {"d": 4, "q": "A 5-year-old child diagnosed with Kawasaki Disease is receiving a continuous intravenous infusion of Intravenous Immunoglobulin (IVIG). What is the primary purpose of this treatment?", "o": ["To drastically reduce systemic inflammation and prevent the development of fatal coronary artery aneurysms", "To kill the specific bacteria causing the Kawasaki infection", "To replace lost blood volume and prevent hypovolemic shock", "To lower the child's dangerously high blood pressure"], "a": 0, "r": "Kawasaki disease is a massive, systemic vasculitis (inflammation of blood vessels) of unknown etiology. Without treatment, it heavily attacks the coronary arteries, causing massive aneurysms and pediatric myocardial infarction. High-dose IVIG combined with high-dose Aspirin is the only proven therapy to halt the inflammation and save the coronary arteries."}, {"d": 4, "q": "A 6-month-old infant is diagnosed with severe gastroenteritis and profound dehydration. The infant is lethargic, has a sunken anterior fontanelle, and no urine output in 8 hours. The physician orders an immediate, rapid IV fluid bolus. Which fluid is appropriate?", "o": ["0.9% Normal Saline at 20 mL/kg", "5% Dextrose in Water (D5W) at 10 mL/kg", "0.45% Half-Normal Saline at 50 mL/kg", "3% Hypertonic Saline at 20 mL/kg"], "a": 0, "r": "For rapid fluid resuscitation in severe pediatric hypovolemic shock or profound dehydration, the absolute standard of care is an immediate IV bolus of Isotonic Crystalloid (0.9% Normal Saline or Lactated Ringer's) dosed precisely at 20 mL/kg of body weight."}, {"d": 4, "q": "A child is admitted with a diagnosis of Acute Rheumatic Fever following an untreated strep throat infection. What major, life-threatening complication of this disease must the nurse heavily monitor for?", "o": ["Permanent damage to the cardiac valves (Rheumatic Heart Disease), leading to severe mitral or aortic stenosis/regurgitation", "Total failure of both kidneys requiring immediate dialysis", "Massive, fatal destruction of the liver parenchyma", "Complete paralysis of the lower extremities"], "a": 0, "r": "Acute Rheumatic Fever is an autoimmune inflammatory reaction following a Group A Strep infection. The antibodies accidentally attack the body's own tissues. The most feared and permanent complication is Rheumatic Heart Disease, where the inflammation scars and destroys the heart valves (most commonly the mitral valve)."}, {"d": 4, "q": "A 3-year-old child is admitted to the pediatric unit with suspected bacterial meningitis. The child is lying in bed with their neck rigidly extended backwards, and their back arched. What is this classic, extreme posture called?", "o": ["Opisthotonos", "Decerebrate posturing", "Decorticate posturing", "The Tripod position"], "a": 0, "r": "Opisthotonos is a state of severe hyperextension and spasticity in which an individual's head, neck, and spinal column enter into a complete 'bridging' or 'arching' posture. It is a profound neurological sign of massive meningeal irritation seen in severe bacterial meningitis or tetanus."}, {"d": 4, "q": "A 7-year-old child with cystic fibrosis is admitted with a severe respiratory infection. The physician orders chest physiotherapy (CPT). When is the most appropriate time for the nurse to perform CPT?", "o": ["Before meals or at least 1.5 to 2 hours after meals", "Immediately after a large, heavy meal to promote digestion", "During a continuous enteral tube feeding", "Right before bedtime, regardless of when they last ate"], "a": 0, "r": "Chest physiotherapy (CPT) involves aggressive percussion and postural drainage to physically shake thick, sticky mucus loose from the lungs so the child can cough it up. Performing CPT immediately after a meal will violently induce severe vomiting and massive aspiration. It must be done on an empty stomach (before meals or hours after)."}, {"d": 4, "q": "A 10-year-old child with sickle cell disease presents to the ER with extreme, excruciating pain in the arms, legs, and back. The child is crying hysterically. The physician diagnoses a vaso-occlusive crisis. What are the three primary nursing interventions for this condition?", "o": ["Aggressive IV hydration, scheduled opioid analgesics, and oxygen administration (if hypoxic)", "Applying ice packs to the joints, restricting fluids, and administering Aspirin", "Administering prophylactic antibiotics, applying tourniquets, and enforcing strict bed rest", "Administering IV Heparin, elevating the legs, and giving oral acetaminophen"], "a": 0, "r": "During a vaso-occlusive crisis, the sickled red blood cells clump and cause severe ischemia. The primary treatment ('HOP') involves Hydration (massive IV fluids to hemodilute the blood and unclog the vessels), Oxygenation (to prevent further sickling), and Pain management (aggressive, scheduled IV opioids; ice is strictly contraindicated as it causes further vasoconstriction)."}, {"d": 4, "q": "A 4-month-old infant is brought to the clinic. The mother states the infant has been exclusively breastfed. The infant appears pale and lethargic. A CBC reveals a Hemoglobin of 8.5 g/dL. The physician diagnoses Iron-Deficiency Anemia and prescribes oral iron drops. What vital instruction must the nurse give the mother regarding the administration of the iron drops?", "o": ["'Give the iron drops on an empty stomach, ideally with a small amount of Vitamin C (like orange juice) to maximize absorption.'", "'Mix the iron drops into a full 8-ounce bottle of formula to hide the taste.'", "'Give the iron drops at the exact same time you give the infant milk or calcium supplements.'", "'The iron drops will turn your baby's stool white, which is a normal finding.'"], "a": 0, "r": "Iron is best absorbed in an acidic environment (on an empty stomach, or with Vitamin C). Calcium (milk/formula) binds to iron and severely inhibits its absorption. Therefore, iron should be given between meals and never mixed with milk. Iron will turn the stool black or dark green, not white."}, {"d": 4, "q": "A 7-year-old child presents to the ER with dark, 'cola-colored' urine, severe facial edema (especially around the eyes), and a blood pressure of 140/90 mmHg. The mother reports the child had 'strep throat' that wasn't treated with antibiotics about two weeks ago. What is the most likely diagnosis?", "o": ["Acute Post-Streptococcal Glomerulonephritis (APSGN)", "Nephrotic Syndrome", "Acute Renal Failure secondary to dehydration", "Hemolytic Uremic Syndrome (HUS)"], "a": 0, "r": "APSGN is a classic immune-complex disease that occurs 1-2 weeks after an untreated Group A Beta-Hemolytic Strep infection. The antigen-antibody complexes clog the glomeruli, causing massive inflammation, hematuria (cola-colored urine), fluid retention (periorbital edema), and secondary hypertension."}, {"d": 4, "q": "A 2-month-old infant is brought to the clinic for their first set of major immunizations. The nurse is preparing to administer the Rotavirus (RV) vaccine. How is this specific vaccine administered?", "o": ["Orally (PO) via a liquid dropper into the infant's mouth", "Intramuscularly (IM) into the vastus lateralis muscle", "Subcutaneously (SC) into the fatty tissue of the thigh", "Intranasally (IN) via a nasal spray"], "a": 0, "r": "The Rotavirus vaccine (which prevents severe viral gastroenteritis/diarrhea in infants) is unique among the standard infant schedule because it is a live-attenuated vaccine administered EXCLUSIVELY via the oral route (liquid drops in the mouth), never via injection."}, {"d": 4, "q": "A 5-year-old child with a known peanut allergy accidentally consumes a peanut butter cookie. Within 5 minutes, the child develops diffuse hives, lip swelling, and severe expiratory wheezing. The school nurse administers an Epinephrine auto-injector (EpiPen) into the child's outer thigh. What is the crucial next step?", "o": ["Call 911 immediately; the child must be transported to the emergency department for continuous monitoring, as the epinephrine will wear off and a biphasic reaction can occur", "Have the child lie down in the nurse's office and apply ice to the injection site", "Administer an oral antihistamine and send the child back to class if the wheezing stops", "Administer a second dose of epinephrine in the other leg immediately just to be safe"], "a": 0, "r": "Epinephrine is a life-saving, fast-acting drug, but its effects wear off rapidly (in 10-20 minutes). Anaphylaxis can have a 'biphasic' (second wave) reaction that is often more severe and fatal than the first. Anyone who receives Epinephrine MUST be transported via ambulance to an ED for advanced airway management and observation."}, {"d": 4, "q": "A 6-month-old infant with heart failure is prescribed oral Digoxin. The nurse checks the infant's apical pulse before administration and counts 88 beats per minute. What is the nurse's correct action?", "o": ["Hold the dose and notify the physician immediately", "Administer the dose as this is a normal heart rate for a 6-month-old", "Administer the dose but check the pulse again in 30 minutes", "Give half the dose to be safe"], "a": 0, "r": "Digoxin slows the heart rate. In pediatric patients, the strict parameters for holding Digoxin are much higher than adults. For an infant or young child, Digoxin MUST be held if the apical pulse is below 90 to 100 bpm (depending on specific hospital policy, but 88 is definitively bradycardic for a 6-month-old). In adults, it is held for < 60 bpm."}, {"d": 4, "q": "A 3-month-old infant returns from surgery following a cleft lip repair (cheiloplasty). Which nursing intervention is essential to protect the surgical site?", "o": ["Apply bilateral elbow restraints (No-No's) to prevent the infant from touching their face", "Place the infant strictly in a prone position to allow secretions to drain", "Allow the infant to use a standard pacifier to soothe them", "Feed the infant using a standard firm nipple immediately"], "a": 0, "r": "Following a cleft lip repair, the delicate suture line must be strictly protected from trauma. Bilateral elbow restraints (often called 'No-No's') prevent the infant from bending their arms and scratching or rubbing their lip. The infant should be positioned supine (on their back), and pacifiers are strictly contraindicated."}, {"d": 4, "q": "A 4-year-old child presents with massive, generalize
