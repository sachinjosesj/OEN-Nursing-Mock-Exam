community health is systematic data collection (demographics, vital statistics, windshield survey, informant interviews) to identify priority health needs."}, {"d": 6, "q": "During a windshield survey of a neighborhood, the community health nurse observes multiple abandoned buildings, lack of grocery stores ('food desert'), standing water, and heavy industrial air emissions. What domain of health determinants is being assessed?", "o": ["Physical and Built Environment Determinants", "Genetic and Biological Determinants", "Individual Behavior Determinants", "Health System Access Determinants"], "a": 0, "r": "A windshield survey is an observational assessment of the community's physical and built environment (housing, sanitation, food access, environmental hazards, safety)."}, {"d": 6, "q": "A public health nurse is educating factory workers about preventing Occupational Noise-Induced Hearing Loss. At what continuous decibel (dB) exposure level over an 8-hour workday does OSHA mandate hearing conservation measures?", "o": ["85 decibels (dB)", "50 decibels (dB)", "110 decibels (dB)", "120 decibels (dB)"], "a": 0, "r": "OSHA standards mandate that employers implement a hearing conservation program when worker noise exposure equals or exceeds an 8-hour time-weighted average of 85 decibels (dB)."}, {"d": 6, "q": "A community health nurse visits a family whose well water tested positive for high levels of Nitrates. What specific pediatric health risk is associated with nitrate-contaminated drinking water in infants ('Blue Baby Syndrome')?", "o": ["Methemoglobinemia", "Lead encephalopathy", "Severe dental fluorosis", "Acute viral hepatitis"], "a": 0, "r": "High nitrate levels in well water convert to nitrite in an infant's stomach, binding hemoglobin to form methemoglobin, which cannot carry oxygen. This causes severe tissue hypoxia and cyanosis ('Blue Baby Syndrome' / Methemoglobinemia)."}, {"d": 6, "q": "A nurse is providing education to a community group on Carbon Monoxide (CO) poisoning prevention in the home. Which instruction is essential?", "o": ["Install battery-operated CO detectors near sleeping areas and never run gasoline-powered generators inside the home or garage", "CO gas has a strong sulfur smell, so open windows if you smell gas", "CO detectors should only be placed in the basement near the furnace", "Running a gas grill indoors is safe if a fan is turned on"], "a": 0, "r": "Carbon monoxide is a completely colorless, odorless, tasteless gas. Prevention requires installing working CO detectors on every level/near bedrooms and NEVER operating fuel-burning generators, grills, or engines indoors."}, {"d": 6, "q": "A home health nurse assesses an elderly client who uses a home oxygen concentrator at 2 L/min via nasal cannula. Which safety observation in the home requires IMMEDIATE nursing intervention?", "o": ["The client's spouse is smoking a cigarette in the same room, or petroleum jelly (Vaseline) is applied to the client's nares", "The oxygen concentrator is plugged directly into a grounded electrical outlet", "An extra oxygen tank is secured in an upright rack", "The client wears cotton clothing while using oxygen"], "a": 0, "r": "Oxygen heavily accelerates combustion. Smoking near oxygen is a severe fire hazard. Furthermore, oil-based products like petroleum jelly (Vaseline) can ignite spontaneously in the presence of concentrated oxygen. Only water-soluble lubricants should be used."}, {"d": 6, "q": "During a mass casualty chemical spill involving organophosphate nerve agents, emergency triage nurses establish decontamination zones. Where should decontamination take place?", "o": ["In the Warm Zone (Decontamination Zone) BEFORE entering the Clean/Cold Zone or treatment facility", "Inside the main emergency department trauma bay", "In the Cold Zone after medical treatment is completed", "In the Hot Zone without personal protective equipment"], "a": 0, "r": "Decontamination must occur in the designated Warm Zone outside the healthcare facility to prevent bringing chemical contaminants into the clean treatment area (Cold Zone) and exposing healthcare personnel."}, {"d": 6, "q": "In a mass casualty disaster, a nurse performs triage using the START algorithm. A victim has no spontaneous breathing. The nurse opens the airway, and the patient remains apneic. What color triage tag is assigned?", "o": ["Black Tag (Expectant/Deceased)", "Red Tag (Immediate)", "Yellow Tag (Delayed)", "Green Tag (Minor)"], "a": 0, "r": "In START disaster triage, if an adult victim is apneic, the nurse opens the airway once. If the patient remains apneic after opening the airway, they are tagged Black (Expectant/Deceased) so resources are focused on salvageable lives."}, {"d": 6, "q": "In the START disaster triage system, a disaster victim is conscious, breathing at 22 breaths/min, has a capillary refill of 1.5 seconds, but has a closed compound fracture of the tibia and cannot walk. What color triage tag is assigned?", "o": ["Yellow Tag (Delayed)", "Red Tag (Immediate)", "Green Tag (Minor)", "Black Tag (Expectant)"], "a": 0, "r": "Yellow Tag (Delayed) is assigned to victims who have serious injuries (e.g., systemic trauma, fractures) requiring medical care, but whose vital signs are currently stable (respirations < 30, perfusion < 2s, follows commands)."}, {"d": 6, "q": "A school nurse is managing an outbreak of Pediculosis Capitis (head lice) in an elementary school. What instruction should be provided to parents regarding household treatment?", "o": ["Wash all clothing, bed linens, and towels used by the child in hot water and dry on high heat for at least 20 minutes", "Spray the entire house with liquid DDT pesticide", "Shave the child's head completely", "Keep the child out of school for 30 consecutive days"], "a": 0, "r": "Pediculosis capitis treatment involves applying a pediculicide shampoo (permethrin), combing out nits with a fine-tooth comb, and washing bed linens/clothing in hot water (>130°F) and drying on high heat."}, {"d": 6, "q": "A public health nurse works with a population of non-English speaking migrant farmworkers. What is the most appropriate strategy when providing health education and obtaining medical history?", "o": ["Utilize a trained, certified professional medical interpreter", "Ask the patient's 10-year-old child to translate", "Use hand gestures and speak English very loudly", "Provide written English pamphlets only"], "a": 0, "r": "To ensure medical accuracy, patient safety, and legal compliance, nurses must always utilize certified professional medical interpreters rather than family members or children."}, {"d": 6, "q": "A community health nurse evaluates a family using a Genogram and an Ecomap. What specific information does an Ecomap provide that a Genogram does not?", "o": ["The family's relationships, energy flow, and connections with outside community systems and social networks", "Multi-generational medical history and genetic disease patterns across 3 generations", "Detailed financial bank records of the family", "Surgical history of the primary breadwinner"], "a": 0, "r": "A Genogram maps multi-generational family structure and genetic/health history. An Ecomap visualizes the family's interactions, social support systems, energy flows, and relationships with external community systems (schools, jobs, church)."}, {"d": 6, "q": "A nurse is conducting a tuberculosis screening clinic using the Mantoux Tuberculin Skin Test (TST / PPD). How is the test administered and when should it be read?", "o": ["Intradermal injection of 0.1 mL PPD creating a wheal; read 48 to 72 hours later measuring induration in millimeters", "Subcutaneous injection of 0.5 mL PPD; read 24 hours later measuring erythema", "Intramuscular injection into deltoid; read 7 days later", "Topical scratch test; read 15 minutes later"], "a": 0, "r": "The Mantoux test requires intradermal injection of 0.1 mL of PPD into the inner forearm to form a 6-10 mm wheal. It MUST be read 48 to 72 hours later by measuring the hard, raised area of induration (NOT the redness) in millimeters."}, {"d": 6, "q": "The nurse is assessing an 82-year-old patient. Which normal age-related cardiovascular change contributes significantly to isolated systolic hypertension in the elderly?", "o": ["Loss of arterial vascular elasticity and stiffening of the large systemic arteries", "Increased elasticity of cardiac muscle fibers", "Increased number of cardiac pacemaker cells in the SA node", "Decreased systemic vascular resistance"], "a": 0, "r": "Aging causes progressive loss of elastin and increased collagen deposition in major arterial walls, resulting in arterial stiffness. This increased vascular resistance leads to isolated systolic hypertension (elevated SBP with normal DBP)."}, {"d": 6, "q": "An 80-year-old patient is prescribed a renally excreted medication. The nurse notes the serum creatinine is 0.9 mg/dL (normal). Why is serum creatinine ALONE an unreliable indicator of renal function in frail elderly patients?", "o": ["Decreased muscle mass in older adults produces less serum creatinine, masking a significant decline in Glomerular Filtration Rate (GFR)", "Creatinine production skyrockets in older age", "Elderly patients excrete creatinine through the lungs", "Serum creatinine levels fluctuate wildly based on lung function"], "a": 0, "r": "Creatinine is a byproduct of muscle breakdown. Because older adults experience sarcopenia (loss of muscle mass), their baseline creatinine production is low. A 'normal' serum creatinine (e.g., 0.9) can mask a severely reduced GFR. Glomerular Filtration Rate / Creatinine Clearance must be evaluated."}, {"d": 6, "q": "An 85-year-old client in a long-term care facility is at high risk for constipation. Which normal age-related gastrointestinal change contributes to chronic constipation in older adults?", "o": ["Decreased intestinal peristalsis and slowed gastrointestinal transit time", "Hyperactive peristalsis and rapid gastric emptying", "Excessive secretion of gastric hydrochloric acid", "Increased tone of the internal anal sphincter"], "a": 0, "r": "Age-related GI changes include decreased gut motility, blunted rectal sensation, and reduced peristalsis, which, combined with low fluid/fiber intake and immobility, lead to chronic constipation."}, {"d": 6, "q": "A nurse is providing discharge teaching to an 78-year-old patient prescribed a new sedating medication. What pharmacokinetic change in older adults prolongs the half-life of lipid-soluble (lipophilic) drugs?", "o": ["Increased percentage of total body fat relative to lean muscle mass and total body water", "Decreased total body fat and increased total body water", "Increased serum albumin levels", "Increased hepatic enzyme metabolism"], "a": 0, "r": "Older adults experience increased body fat percentage and decreased total body water. Lipophilic (fat-soluble) drugs (like diazepam) distribute more widely into fat tissue, prolonging their elimination half-life and duration of action, increasing toxicity risk."}, {"d": 6, "q": "An 82-year-old patient experiences a sudden drop in blood pressure upon standing from a lying position, accompanied by lightheadedness. What age-related physiological impairment causes this orthostatic hypotension?", "o": ["Blunted baroreceptor sensitivity and delayed vascular compensatory vasoconstriction", "Hyperactive carotid sinus reflexes", "Increased blood volume", "Excessive aldosterone production"], "a": 0, "r": "Aging reduces the responsiveness of arterial baroreceptors to postural changes. When standing, the blood pressure drops because autonomic vasoconstriction and compensatory heart rate increases are delayed."}, {"d": 6, "q": "The nurse is reviewing skin changes in an 85-year-old patient. Which age-related integumentary change increases the elderly client's vulnerability to hypothermia and skin tears?", "o": ["Loss of subcutaneous fat and thinning of the dermal and epidermal layers", "Hypertrophy of sweat glands and increased sebum production", "Increased vascularity of the dermis", "Thickening of the stratum corneum"], "a": 0, "r": "Atrophy of subcutaneous adipose tissue reduces thermal insulation (hypothermia risk), while flattening of the dermal-epidermal junction and skin thinning make older skin fragile and prone to shear injury/skin tears."}, {"d": 6, "q": "An 80-year-old female patient is diagnosed with severe Osteoporosis. Which age-related hormonal decline is the primary driver of rapid bone mineral density loss in postmenopausal women?", "o": ["Marked decline in Estrogen levels", "Excessive production of Parathyroid Hormone", "Decline in Insulin production", "Increased Cortisol levels"], "a": 0, "r": "Estrogen normally inhibits osteoclast-mediated bone resorption. The dramatic postmenopausal decline in estrogen accelerates bone mineral loss, leading to osteoporosis and heightened fracture risk."}, {"d": 6, "q": "The nurse assesses an 76-year-old client with Open-Angle Glaucoma. What pathognomonic visual field loss characterizes glaucoma?", "o": ["Painless, gradual loss of peripheral vision ('tunnel vision')", "Loss of central vision with intact peripheral vision", "Sudden appearance of a dark 'curtain' dropping over the eye", "Inability to see in low light (night blindness) only"], "a": 0, "r": "Open-angle glaucoma involves increased intraocular pressure damaging the optic nerve, classically causing painless, insidious loss of peripheral vision ('tunnel vision'). (Macular degeneration causes loss of central vision)."}, {"d": 6, "q": "An 82-year-old client complains of blurred vision, glare sensitivity while driving at night, and fading color perception. Physical exam reveals a cloudy, opaque lens. What ocular condition is present?", "o": ["Cataracts", "Glaucoma", "Age-related Macular Degeneration", "Retinal Detachment"], "a": 0, "r": "Cataracts are opacities of the crystalline lens caused by oxidative protein degradation. Classic symptoms include painless blurred vision, double vision, decreased night vision, and glare around lights."}, {"d": 6, "q": "An 80-year-old patient with Age-Related Macular Degeneration (AMD) is evaluated by the home health nurse. What specific visual impairment does AMD cause?", "o": ["Loss of central vision, affecting reading and face recognition, while peripheral vision remains intact", "Total blindness in both eyes within 24 hours", "Loss of peripheral vision ('tunnel vision')", "Double vision (diplopia) when looking downward"], "a": 0, "r": "Age-related Macular Degeneration damages the macula (the central retina), causing loss of central, detailed vision needed for reading, driving, and recognizing faces, while peripheral vision remains preserved."}, {"d": 6, "q": "An 85-year-old client who is bedridden has a Braden Scale score of 10 (indicating high pressure injury risk). Which nursing intervention is most effective for preventing sacral pressure injuries?", "o": ["Repositioning the client at least every 2 hours and keeping the head of the bed elevated at 30 degrees or less", "Massaging reddened bony prominences vigorously every shift", "Donut cushions under the sacrum", "Keeping the patient flat on their back continuously"], "a": 0, "r": "Preventing pressure injuries requires turning q2h, pressure-redistribution mattresses, and keeping HOB <= 30 degrees to reduce shear forces on the sacrum. Reddened skin over bony prominences must NEVER be massaged."}, {"d": 6, "q": "A nurse is assessing an 82-year-old male client with Benign Prostatic Hyperplasia (BPH). What lower urinary tract symptoms (LUTS) are characteristic of BPH?", "o": ["Urinary hesitancy, weak stream, post-void dribbling, nocturia, and frequency", "Severe flank pain radiating to the groin with gross hematuria", "Profuse, uncontrollable, painless diarrhea", "Sudden onset of oliguria with tea-colored urine"], "a": 0, "r": "Prostatic enlargement compresses the prostatic urethra, causing obstructive LUTS: hesitancy, weak or interrupted stream, straining, post-void dribbling, nocturia, and urinary frequency."}, {"d": 6, "q": "An 80-year-old female client experiences involuntary loss of urine whenever she coughs, sneezes, or laughs. What type of urinary incontinence is this, and what is the first-line nursing intervention?", "o": ["Stress Urinary Incontinence; teach Pelvic Floor Muscle Exercises (Kegel exercises)", "Urge Incontinence; immediate surgical bladder neck suspension", "Overflow Incontinence; insertion of an indwelling Foley catheter", "Functional Incontinence; restricting fluid intake to 500 mL/day"], "a": 0, "r": "Stress incontinence is involuntary urine leakage caused by increased intra-abdominal pressure (coughing, laughing) due to weakened pelvic floor muscles. Pelvic floor muscle training (Kegels) is the first-line non-surgical treatment."}, {"d": 6, "q": "An 84-year-old client experiences sudden, powerful urges to urinate and cannot reach the bathroom in time, resulting in large volume urine loss. What type of incontinence is this?", "o": ["Urge Incontinence (Overactive Bladder)", "Stress Incontinence", "Reflex Incontinence", "Functional Incontinence"], "a": 0, "r": "Urge incontinence is involuntary urine loss accompanied by or immediately preceded by a sudden, intense urge to void, caused by detrusor muscle overactivity (instability)."}, {"d": 6, "q": "An elderly patient with severe osteoarthritis and immobility cannot reach the bathroom in time because of severe joint pain and slow gait, although bladder control is intact. What type of incontinence is this?", "o": ["Functional Incontinence", "Stress Incontinence", "Urge Incontinence", "Overflow Incontinence"], "a": 0, "r": "Functional incontinence occurs when a patient has normal bladder function but cannot reach the toilet in time due to physical, environmental, or cognitive barriers (e.g., severe arthritis, immobility, dementia)."}, {"d": 6, "q": "An 80-year-old diabetic male client has chronic urinary retention from neurogenic bladder. The nurse notes frequent involuntary dribbling of small amounts of urine, and a bladder scan shows 600 mL post-void residual. What type of incontinence is present?", "o": ["Overflow Incontinence", "Stress Incontinence", "Urge Incontinence", "Functional Incontinence"], "a": 0, "r": "Overflow incontinence occurs when the bladder becomes chronically overdistended due to bladder outlet obstruction (BPH) or detrusor underactivity, leading to involuntary dribbling when pressure exceeds sphincter resistance."}, {"d": 6, "q": "The nurse is reviewing 'Beer's Criteria' in geriatric pharmacology. What is the primary purpose of the Beer's Criteria list?", "o": ["To identify Potentially Inappropriate Medications (PIMs) that carry a high risk of adverse drug events in older adults", "To mandate generic drug substitution in long-term care", "To calculate pediatric antibiotic dosages", "To list drugs that cause immediate physical addiction"], "a": 0, "r": "The American Geriatrics Society (AGS) Beers Criteria lists Potentially Inappropriate Medications (PIMs) that should generally be avoided or used with extreme caution in older adults due to high risks of side effects, falls, and delirium."}, {"d": 6, "q": "An 82-year-old client is taking 12 different daily prescription medications prescribed by four different specialists. What clinical term describes this situation, and what is its primary danger?", "o": ["Polypharmacy; leading to increased risk of adverse drug reactions, drug interactions, cognitive impairment, and falls", "Rational prescribing; ensuring all diseases are cured", "Adherence therapy; reducing healthcare costs", "Multipharmacology; accelerating liver metabolism"], "a": 0, "r": "Polypharmacy (use of multiple medications, often 5 or more) is common in older adults with multimorbidity. It exponentially increases the risk of adverse drug events, prescribing cascades, drug-drug interactions, falls, and hospitalization."}, {"d": 6, "q": "An 80-year-old client is prescribed a new anticholinergic drug (e.g., Diphenhydramine or Oxybutynin). What specific anticholinergic side effects must the nurse monitor for in older adults?", "o": ["Confusion/delirium, urinary retention, severe constipation, dry mouth, and blurred vision", "Profuse diarrhea, salivation, bradycardia, and miosis", "Hypoglycemia and severe hypotension", "Productive cough and wheezing"], "a": 0, "r": "Anticholinergic drugs block acetylcholine. In older adults, central and peripheral anticholinergic effects are dangerous: acute confusion/delirium, urinary retention, constipation, dry mouth, blurred vision, and increased fall risk."}, {"d": 6, "q": "An 85-year-old hospitalized client becomes acutely agitated at dusk, wandering the halls and seeing shadows ('sundowning'). What nursing strategy helps manage sundowning behavior in dementia patients?", "o": ["Maintain a predictable routine, turn on adequate indoor lighting before dark, and provide calm reorientation", "Administer physical restraints immediately at 1700 hours", "Keep the room pitch black to encourage immediate sleep", "Leave the television on high volume all night"], "a": 0, "r": "Sundowning is a phenomenon in dementia where confusion and agitation worsen in late afternoon/evening. Effective strategies include adequate lighting to eliminate shadows, maintaining familiar routines, limiting noise/caffeine, and providing calm reassurance."}, {"d": 6, "q": "An 82-year-old client with moderate Alzheimer's Disease states, 'I need to go home right now, my mother is waiting for me to make lunch.' The nurse knows the client's mother died 30 years ago. What communication approach ('Validation Therapy') is most therapeutic?", "o": ["Validate the client's emotions: 'You must miss your mother very much. Tell me about what she used to cook for lunch.'", "Argue firmly: 'Your mother has been dead for 30 years, look at your birth certificate!'", "Confront the delusion: 'You are 82 years old, how could your mother be alive?'", "Lock the client in their room so they cannot leave"], "a": 0, "r": "Validation Therapy in moderate/severe dementia respects the feelings behind the client's statements rather than arguing or forcing harsh reality orientation that causes extreme distress. Validating emotions ('You miss your mother') builds trust and allows gentle redirection."}, {"d": 6, "q": "A nurse is caring for an 80-year-old client with severe Alzheimer's Disease who exhibits severe agnosia. What does 'agnosia' mean?", "o": ["The loss of the ability to recognize familiar objects, sounds, or people despite intact sensory organs", "The inability to speak or formulate words", "The inability to execute purposeful motor movements like buttoning a shirt", "The total loss of long-term memory only"], "a": 0, "r": "Agnosia is the inability to recognize or identify familiar objects, sounds, or persons through sensory input (e.g., holding a fork and not knowing what it is), common in advanced Alzheimer's disease. (Aphasia = speech loss; Apraxia = motor skill loss)."}, {"d": 6, "q": "An 82-year-old client with Alzheimer's Disease exhibits apraxia. What clinical behavior demonstrates apraxia?", "o": ["The client is physically unable to manipulate a toothbrush to brush their teeth, despite having intact motor strength", "The client does not remember their spouse's name", "The client cannot see objects in their left visual field", "The client hears voices speaking to them"], "a": 0, "r": "Apraxia is the loss of the ability to execute purposeful, complex motor tasks or use tools correctly (e.g., dressing, brushing teeth, using utensils) despite having normal motor strength and sensory function."}, {"d": 6, "q": "A home health nurse assesses an 84-year-old client living with their adult child caregiver. The nurse suspects financial exploitation. What finding supports this suspicion?", "o": ["The client's bank accounts are suddenly emptied, and the client lacks basic necessities, medication, or appropriate clothing despite adequate income", "The client's medication is neatly organized in a pillbox", "The client's house is clean and well-maintained", "The client attends all medical appointments regularly"], "a": 0, "r": "Financial exploitation of an older adult involves unauthorized or improper use of their funds or assets. Signs include sudden changes in legal documents/bank accounts, unpaid bills, and lack of basic care/food despite available funds."}, {"d": 6, "q": "A nurse assesses an 80-year-old client and notes multiple spiral fractures, cigarette burns on the soles of the feet, and severe malnutrition. What is the nurse's legal requirement?", "o": ["Immediately report the suspected elder abuse to Adult Protective Services (APS) or local law enforcement", "Conduct an independent investigation for 2 weeks before notifying anyone", "Confront the family members angrily in the lobby", "Wait until the client explicitly asks for legal help"], "a": 0, "r": "Nurses are legally mandated reporters of suspected elder abuse, neglect, or exploitation. Reporting must occur immediately to Adult Protective Services or law enforcement upon forming a reasonable suspicion."}, {"d": 6, "q": "An 85-year-old client is admitted to the hospital with acute delirium secondary to a urinary tract infection (UTI). What is the primary goal of nursing care for a client with delirium?", "o": ["Ensure physical safety, identify and treat the underlying medical cause, and maintain a quiet, reorienting environment", "Administer high-dose physical restraints continuously", "Place the patient in a dark, silent isolation room without staff visits", "Begin long-term cognitive rehabilitation for irreversible dementia"], "a": 0, "r": "Delirium is an acute, fluctuating, reversible state caused by an underlying medical issue (UTI, hypoxia, drug toxicity). Priorities are patient safety, prompt medical treatment of the underlying cause, and supportive orientation."}, {"d": 6, "q": "A nurse is evaluating an 80-year-old client's functional status using the Katz Index of Independence in Activities of Daily Living (ADLs). Which activity is classified as a Basic ADL (BADL)?", "o": ["Bathing, dressing, toileting, transferring, continence, and feeding", "Managing personal finances and balancing a checkbook", "Using the telephone and operating a computer", "Preparing complex meals and grocery shopping"], "a": 0, "r": "Basic ADLs (BADLs) encompass fundamental self-care tasks: Bathing, Dressing, Toileting, Transferring, Continence, and Feeding. (Finances, shopping, cooking, and phone use are Instrumental ADLs / IADLs)."}, {"d": 6, "q": "An 82-year-old client is evaluated for Instrumental Activities of Daily Living (IADLs) using the Lawton Scale. Which activity is an IADL?", "o": ["Managing medications, shopping for groceries, preparing meals, and handling finances", "Brushing teeth and washing face", "Transferring from bed to wheelchair", "Feeding oneself with a spoon"], "a": 0, "r": "Instrumental Activities of Daily Living (IADLs) are more complex tasks required for independent community living: managing finances, meal preparation, shopping, managing medications, housekeeping, and transportation."}, {"d": 6, "q": "The nurse is preparing to apply a wrist restraint to a confused, post-operative 82-year-old client who is repeatedly pulling out their central venous catheter. What safety protocol MUST be followed for physical restraints?", "o": ["Obtain a written healthcare provider order within the mandated timeframe, use a quick-release knot tied to the bed frame, and assess circulation/skin q15-30 minutes", "Tie the restraint securely to the side rail using a double tight square knot", "Keep the restraint on continuously for 48 hours without removal", "Apply restraints as a convenience for short-staffed night shifts"], "a": 0, "r": "Physical restraints require a provider order, quick-release knots attached to the immovable bed frame (NEVER side rails), frequent circulation checks (q15-30 mins), and periodic removal (q2h) for skin care and ROM exercises."}, {"d": 6, "q": "An 80-year-old client has a history of fall-related hip fracture. Which physiological age-related change in gait contributes significantly to falls in older men?", "o": ["A wider base of support, shorter step length, and flexed posture", "A narrow, rapid, bouncing high-steppage gait", "Excessive hip extension and tall posture", "An exaggerated, leaping stride"], "a": 0, "r": "Age-related gait changes include a wider base of support, decreased step height and length, slower walking speed, and forward-flexed posture, which impair dynamic balance and increase tripping risks."}, {"d": 6, "q": "An 82-year-old client presents with a severe, painful, vesicular rash in a unilateral dermatomal distribution along the thoracic chest wall. The physician diagnoses Shingles (Herpes Zoster). What is the underlying cause, and what vaccination prevents it?", "o": ["Reactivation of the latent Varicella-Zoster virus; prevented by the Recombinant Zoster Vaccine (Shingrix) for adults age 50+", "Primary bacterial infection with Streptococcus; prevented by the Pneumococcal vaccine", "An allergic reaction to medication; prevented by antihistamines", "Viral infection with Influenza A; prevented by the annual flu shot"], "a": 0, "r": "Shingles occurs when the latent Varicella-Zoster virus (chickenpox) reactivates in dorsal root ganglia due to declining cell-mediated immunity in older adults. Shingrix (recombinant zoster vaccine) is recommended for adults age 50+ (given in 2 doses) to prevent zoster and postherpetic neuralgia."}, {"d": 6, "q": "An 80-year-old patient in a long-term care facility is assessed for dysphagia. What normal age-related physiological change in swallowing ('Presbyphagia') increases the risk for silent aspiration in older adults?", "o": ["Delayed initiation of the swallowing reflex and decreased pharyngeal muscle tone/sensation", "Excessive hyperactive gag reflex", "Increased salivation and rapid tongue movements", "Hyper-elasticity of the epiglottis"], "a": 0, "r": "Presbyphagia refers to age-related changes in swallowing: delayed swallow reflex, reduced laryngeal elevation, and weakened pharyngeal contraction, which increase the risk of food entering the airway (aspiration)."}, {"d": 6, "q": "An 85-year-old client exhibits hyperkeratotic, rough, scaly, erythematous papules on the sun-exposed skin of the face and forearms. The dermatologist identifies these lesions as Actinic Keratosis. What is the significance of this skin finding?", "o": ["It is a premalignant skin lesion caused by chronic ultraviolet radiation that can progress to Squamous Cell Carcinoma", "It is a benign fungal infection treated with topical clotrimazole", "It is a normal, non-precancerous sign of aging called liver spots", "It is an immediate sign of internal liver failure"], "a": 0, "r": "Actinic Keratosis is a common premalignant skin lesion in older adults resulting from chronic cumulative UV sun damage. If left untreated, a small percentage can progress to invasive Squamous Cell Carcinoma."}, {"d": 6, "q": "A nurse is evaluating an 82-year-old client who experienced a environmental exposure during a winter power outage. The client is confused, shivering violently, has a core temperature of 93.5°F (34.1°C), and a heart rate of 52 bpm. What is the priority emergency intervention for accidental hypothermia?", "o": ["Initiate gradual core rewarming (warmed humidified oxygen, warmed IV fluids, warm blankets) and continuous cardiac monitoring", "Plunge the patient into a 110°F hot bath immediately", "Administer rapid IV boluses of cold saline", "Force the patient to walk vigorously around the room"], "a": 0, "r": "Hypothermia (<95°F / 35°C) requires gradual rewarming to avoid rapid vasodilation ('afterdrop' shock and fatal ventricular arrhythmias). Core rewarming (warmed humidified O2, warmed IV fluids, warm blankets) and cardiac monitoring are essential."}, {"d": 6, "q": "An 80-year-old patient experiencing extreme summer heat presents with a core body temperature of 104.8°F (40.4°C), hot, dry skin (anhidrosis), severe confusion, and tachycardia. What heat-related emergency is occurring, and what is the priority action?", "o": ["Heat Stroke; initiate immediate, aggressive physical cooling (ice packs to groin/axillae, evaporative cooling) and IV hydration", "Heat Exhaustion; give oral cold water and send home", "Heat Cramps; stretch the calf muscles", "Thyroid Storm; give oral thyroid medication"], "a": 0, "r": "Heat Stroke is a life-threatening medical emergency characterized by hyperthermia (>104°F/40°C), absence of sweating (anhidrosis), and CNS dysfunction. Immediate, aggressive cooling (ice packs to neck/axillae/groin, cool mist/fan) is mandatory to prevent organ failure."}, {"d": 6, "q": "A public health nurse reviews rabies post-exposure prophylaxis (PEP) protocols for a resident bitten by a bat. What two biological agents MUST be administered for effective rabies PEP in an unvaccinated person?", "o": ["Human Rabies Immune Globulin (HRIG) for passive immunity AND Rabies Vaccine for active immunity (4 doses on days 0, 3, 7, 14)", "Oral penicillin antibiotics for 10 days only", "Tetanus toxoid vaccine only", "Intravenous corticosteroids"], "a": 0, "r": "Rabies post-exposure prophylaxis requires immediate passive protection with Human Rabies Immune Globulin (HRIG) infiltrated around the wound site on Day 0, combined with active immunization via the 4-dose Rabies Vaccine series."}, {"d": 6, "q": "A public health nurse manages vaccine storage in a county health department. What is the mandatory temperature range for storing refrigerated vaccines (such as influenza, MMR, and Hep B) to prevent potency loss?", "o": ["2°C to 8°C (36°F to 46°F)", "-50°C to -15°C (-58°F to 5°F)", "15°C to 25°C (59°F to 77°F)", "0°C (32°F) freezing exactly"], "a": 0, "r": "Refrigerated vaccines must be strictly maintained within a cold-chain temperature range of 2°C to 8°C (36°F to 46°F). Freezing or overheating destroys protein antigens."}, {"d": 6, "q": "A public health official recommends that all adults aged 65 and older receive pneumococcal vaccination to prevent severe Streptococcus pneumoniae pneumonia, bacteremia, and meningitis. Which CDC pneumococcal vaccine regimen is current practice for vaccine-naïve older adults?", "o": ["A single dose of Pneumococcal Conjugate Vaccine (PCV20) OR one dose of PCV15 followed by PPSV23", "Annual pneumococcal shots every 6 months for life", "A single dose of oral typhoid vaccine", "Intravenous penicillin every 5 years"], "a": 0, "r": "CDC guidelines recommend that adults age 65+ (and adults 19-64 with risk conditions) receive either a single dose of PCV20 OR a dose of PCV15 followed by PPSV23 1 year later to provide broad protection against invasive pneumococcal disease."}, {"d": 6, "q": "An 80-year-old client undergoes a blood test checking Blood Lead Levels (BLL) due to living in an un-renovated 1920s historic home. What is the CDC reference level for elevated blood lead levels in children and adults where public health action is triggered?", "o": ["3.5 mcg/dL (or 5 mcg/dL)", "50 mcg/dL", "100 mcg/dL", "0.1 mcg/dL"], "a": 0, "r": "The CDC uses a blood lead reference value (BLRV) of 3.5 mcg/dL (previously 5.0 mcg/dL) to identify individuals with elevated lead levels requiring environmental intervention and medical monitoring."}, {"d": 6, "q": "A community health nurse conducts an environmental assessment of an industrial town with an old copper smelter. The soil is contaminated with Arsenic. What long-term health risk is associated with chronic environmental Arsenic exposure?", "o": ["Multiple cancers (skin, lung, bladder) and hyperpigmentation/hyperkeratosis of palms and soles", "Acute liver necrosis within 24 hours", "Severe dental caries", "Hyperthyroidism"], "a": 0, "r": "Chronic environmental arsenic exposure (via groundwater or industrial dust) is a known human carcinogen, causing skin, lung, and bladder cancers, along with characteristic skin changes (hyperkeratosis of palms/soles and 'raindrop' pigmentation)."}, {"d": 6, "q": "An occupational health nurse conducts screening for factory workers exposed to Asbestos insulation. What fatal pleural malignancy is specifically and almost exclusively caused by chronic Asbestos inhalation?", "o": ["Malignant Mesothelioma", "Bronchial Adenoma", "Squamous Cell Skin Carcinoma", "Small Cell Pancreatic Carcinoma"], "a": 0, "r": "Malignant Mesothelioma is an aggressive tumor of the pleura or peritoneum strongly and distinctly linked to occupational or environmental asbestos exposure, often with a long latency period (20-50 years)."}, {"d": 6, "q": "A public health nurse reviews the concept of 'Passive Natural Immunity.' Which scenario demonstrates Passive Natural Immunity?", "o": ["Maternal IgG antibodies crossing the placenta to the fetus, or IgA antibodies transmitted through breastmilk", "Antibodies produced by a person after recovering from a natural measles infection", "Antibodies received via an intravenous injection of Hepatitis B Immune Globulin (HBIG)", "Antibodies produced by B-cells after receiving the Tdap vaccine"], "a": 0, "r": "Passive Natural Immunity occurs when antibodies are transferred naturally from mother to infant (IgG across placenta, IgA in breastmilk) providing temporary protection without the infant's immune system actively creating them."}, {"d": 6, "q": "A nurse receives an intravenous dose of Tetanus Antitoxin (or Tetanus Immune Globulin) after a dirty nail puncture wound. What type of immunity does this provide?", "o": ["Passive Artificial Immunity", "Active Artificial Immunity", "Active Natural Immunity", "Passive Natural Immunity"], "a": 0, "r": "Passive Artificial Immunity involves injecting pre-formed antibodies (e.g., immune globulins, antitoxins) into a person to provide immediate, temporary protection against a toxin or pathogen."}, {"d": 6, "q": "A person contracts Hepatitis A, recovers completely, and develops long-term protective antibodies against future Hepatitis A infections. What type of immunity is this?", "o": ["Active Natural Immunity", "Active Artificial Immunity", "Passive Natural Immunity", "Passive Artificial Immunity"], "a": 0, "r": "Active Natural Immunity occurs when the body's own immune system responds to a natural infection by producing memory B-cells and long-lasting specific antibodies."}, {"d": 6, "q": "A child receives the routine Measles, Mumps, and Rubella (MMR) vaccine at 12 months of age. What type of immunity is induced by the vaccine?", "o": ["Active Artificial Immunity", "Passive Artificial Immunity", "Active Natural Immunity", "Passive Natural Immunity"], "a": 0, "r": "Active Artificial Immunity is induced by administering an antigen (vaccine or toxoid) that stimulates the person's own immune system to produce specific antibodies and memory cells."}, {"d": 6, "q": "An 82-year-old marathon spectator collapse in hot weather with profuse sweating, dizziness, nausea, and a normal mental status (temp 101°F). The nurse identifies Heat Exhaustion. What is the priority nursing intervention?", "o": ["Move the client to a cool environment, elevate lower extremities, and initiate oral electrolyte fluid replacement", "Submerge the client in an ice bath immediately", "Administer high-dose antipyretics like Aspirin", "Force the client to continue walking to prevent muscle cramps"], "a": 0, "r": "Heat exhaustion presents with heavy sweating, weakness, normal mental status, and mild core elevation (<104°F). Management requires moving to a cool environment, elevating legs, and replacing water and electrolytes orally."}, {"d": 6, "q": "During core rewarming of a severely hypothermic older adult (core temp 88°F / 31°C), why must the nurse apply internal core rewarming BEFORE active external peripheral rewarming?", "o": ["To prevent 'rewarming shock' and fatal ventricular fibrillation caused by cold, acidotic blood suddenly returning from the extremities to the heart", "To prevent rapid blistering of the skin on the legs", "To encourage immediate shivering", "To prevent hyperthermia from occurring too quickly"], "a": 0, "r": "Rewarming extremities first causes vasodilation in peripheral tissues, sending cold, lactated blood back to the core ('afterdrop'). This sudden drop in core temperature and cardiac blood supply triggers rewarming shock and fatal cardiac arrest."}, {"d": 6, "q": "A home health nurse conducts an environmental assessment of a suburban basement home. What natural, radioactive, odorless soil gas is the leading cause of lung cancer in non-smokers?", "o": ["Radon gas", "Carbon monoxide", "Methane gas", "Sulfur dioxide"], "a": 0, "r": "Radon is a naturally occurring radioactive gas released by decaying uranium in soil and rock. It seeps into home basements through foundation cracks and is the #1 cause of lung cancer in non-smokers."}, {"d": 6, "q": "An 82-year-old client experiences progressive loss of skeletal muscle mass, strength, and physical performance despite maintaining normal body weight. What clinical term describes age-related muscle wasting?", "o": ["Sarcopenia", "Cachexia", "Osteopenia", "Scleroderma"], "a": 0, "r": "Sarcopenia is the age-related, involuntary loss of skeletal muscle mass, quality, and functional strength, contributing to weakness, frailty, slow gait, and increased fall risk in older adults."}, {"d": 6, "q": "A 78-year-old client reports difficulty reading pill bottles up close. The optometrist explains that age-related sclerosis and loss of elasticity of the crystalline lens impair near vision accommodation. What is this universal visual change?", "o": ["Presbyopia", "Presbycusis", "Strabismus", "Astigmatism"], "a": 0, "r": "Presbyopia is the progressive, universal loss of ocular accommodation in older adults caused by lens hardening and ciliary muscle weakening, requiring reading glasses for close work."}, {"d": 6, "q": "An 80-year-old client complains that they can hear people speaking, but the words sound garbled, and high-pitched consonant sounds (like 's', 'z', 'f', 't') are impossible to understand. What inner ear physiological degeneration causes Presbycusis?", "o": ["Degeneration of sensory hair cells and nerve fibers in the organ of Corti in the inner ear", "Impacted cerumen in the external ear canal", "Perforation of the tympanic membrane", "Calcification of the stapes bone in the middle ear"], "a": 0, "r": "Presbycusis is age-related sensorineural hearing loss caused by progressive atrophy and loss of hair cells in the organ of Corti (basilar membrane) in the cochlea, affecting high-frequency sound perception first."}, {"d": 6, "q": "The nurse reviews age-related hepatic changes in an 85-year-old client. Decreased liver mass and hepatic blood flow slow the 'first-pass metabolism' of orally administered drugs. How does this affect drug bioavailability?", "o": ["It significantly increases the bioavailability and peak blood levels of oral drugs (like propranolol and morphine), requiring lower starting doses", "It completely destroys oral drugs before they reach the bloodstream", "It causes all oral drugs to be excreted in the stool without absorption", "It forces the kidney to stop filtering blood"], "a": 0, "r": "Reduced first-pass hepatic extraction in older adults means a higher percentage of orally administered drug reaches systemic circulation intact (increased bioavailability), increasing the risk of adverse drug reactions unless doses are reduced."}, {"d": 6, "q": "An 84-year-old malnourished client has a low serum albumin level (2.2 g/dL). The client is prescribed a highly protein-bound medication like Warfarin or Phenytoin. What pharmacodynamic risk does hypoalbuminemia create?", "o": ["An increased percentage of free (unbound, active) drug in the blood, leading to drug toxicity at standard doses", "Complete inactivation of the drug", "Rapid renal clearance of the drug within 5 minutes", "Failure of the drug to bind to any tissues"], "a": 0, "r": "Highly protein-bound drugs normally attach to serum albumin, leaving only a small percentage 'free' and active. In hypoalbuminemia, fewer binding sites exist, resulting in significantly higher levels of free, active drug and severe toxicity risk."}, {"d": 6, "q": "A home health nurse evaluates an 80-year-old client's fall risk using the 'Timed Up and Go' (TUG) test. The client takes 18 seconds to rise from a chair, walk 3 meters, turn, walk back, and sit down. How should the nurse interpret this result?", "o": ["A completion time > 12 seconds indicates a high risk for falls requiring home safety modifications and balance training", "A completion time > 12 seconds indicates superior athletic mobility", "The test is invalid for clients over 70 years old", "The client is at zero risk for falling"], "a": 0, "r": "The Timed Up and Go (TUG) test evaluates mobility and dynamic balance. A time of 12 seconds or longer indicates an increased risk of falls in community-dwelling older adults."}, {"d": 6, "q": "A nurse is teaching a community class on home burn prevention for older adults. To prevent severe scald burns while bathing, at what maximum temperature should home water heater thermostats be set?", "o": ["At or below 120°F (49°C)", "140°F (60°C)", "160°F (71°C)", "98.6°F (37°C)"], "a": 0, "r": "Setting residential water heaters at or below 120°F (49°C) prevents scald burns in older adults, whose thinner skin can suffer full-thickness burns in just 5 seconds at 140°F."}, {"d": 6, "q": "During START disaster triage following a building collapse, a nurse assesses a victim who has a minor scalp laceration, is fully alert, walking around, and asking for help. What triage tag color is assigned?", "o": ["Green Tag (Minor / Walking Wounded)", "Yellow Tag (Delayed)", "Red Tag (Immediate)", "Black Tag (Expectant)"], "a": 0, "r": "Green Tag (Minor / Walk const LS='omsb-nursing-v1';
const LS_ACTIVE = 'omsb-nursing-active-session';

function saveActiveSession() {
  if (S.view === 'exam' || S.view === 'intro') {
    try {
      const activeData = {
        view: S.view,
        stage: S.stage,
        i: S.i,
        left: S.left,
        total: S.total,
        t0: S.t0,
        mode: S.mode,
        title: S.title,
        qs: S.qs,
        ans: S.ans,
        flag: S.flag,
        notes: S.notes,
        cfg: S.cfg,
        lastSaved: Date.now()
      };
      localStorage.setItem(LS_ACTIVE, JSON.stringify(activeData));
    } catch(e) {}
  }
}

function clearActiveSession() {
  try { localStorage.removeItem(LS_ACTIVE); } catch(e) {}
}

function getActiveSession() {
  try {
    const data = localStorage.getItem(LS_ACTIVE);
    if (!data) return null;
    const session = JSON.parse(data);
    if (!session || !session.qs || !session.qs.length) return null;
    // Timer is paused at the exact remaining time when refreshed/closed
    return session;
  } catch(e) { return null; }
}

function resumeSession() {
  const active = getActiveSession();
  if (!active) return;

  S = {
    view: active.view || 'exam',
    stage: active.stage || 'q',
    i: active.i || 0,
    left: active.left,
    total: active.total,
    t0: active.t0 || Date.now(),
    mode: active.mode,
    title: active.title,
    qs: active.qs,
    ans: active.ans,
    flag: active.flag,
    notes: active.notes || Array(active.qs.length).fill(''),
    cfg: active.cfg || {pick:'set0', mode:'exam'},
    popup: false,
    notesOpen: false,
    showTime: true,
    rf: 'all'
  };

  clearInterval(timer);
  if (S.view === 'exam') {
    if (S.left <= 0) {
      finish();
      return;
    }
    timer = setInterval(tick, 1000);
  }
  render();
  window.scrollTo(0, 0);
}


window.goHome = function() {
  clearActiveSession();
  S = { view: 'home', cfg: (S && S.cfg) || { pick: 'set0', mode: 'exam' } };

};

function appDialog(o){
  const old=document.getElementById('app-dialog');if(old)old.remove();
  const d=document.createElement('div');d.id='app-dialog';d.className='modal';d.setAttribute('role','alertdialog');d.setAttribute('aria-modal','true');
  const e=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  d.innerHTML=`<div class="modalbox dlg"><h3 class="dlg-t">${e(o.title)}</h3><p class="dlg-m">${e(o.msg)}</p><div class="dlg-b">${o.cancel===false?'':'<button class="btn" id="dlg-no">Cancel</button>'}<button class="btn ${o.danger?'danger':'primary'}" id="dlg-ok">${e(o.ok||'OK')}</button></div></div>`;
  document.body.appendChild(d);
  const close=()=>{d.remove();document.removeEventListener('keydown',key)};
  const key=ev=>{if(ev.key==='Escape')close()};
  document.addEventListener('keydown',key);
  d.addEventListener('click',ev=>{if(ev.target===d)close()});
  const no=d.querySelector('#dlg-no');if(no)no.onclick=close;
  const ok=d.querySelector('#dlg-ok');ok.onclick=()=>{close();if(o.onOk)o.onOk()};ok.focus();
}

function hist(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function saveHist(r){
  try {
    const h = hist();
    h.unshift(r);
    localStorage.setItem(LS, JSON.stringify(h.slice(0, 25)));
  } catch(e) {
    try {
      let h = hist();
      h = h.map((item, idx) => idx < 3 ? item : {id:item.id,t:item.t,name:item.name,mode:item.mode,c:item.c,n:item.n,pct:item.pct,used:item.used,dm:item.dm});
      h.unshift(r);
      localStorage.setItem(LS, JSON.stringify(h.slice(0, 15)));
    } catch(e2) {}
  }
}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Sets: dynamic OMSB blueprint sets
const byDom=DOMAINS.map((_,d)=>BANK.map((q,i)=>({...q,id:i})).filter(q=>q.d===d));
const QUOTA=[20,5,30,10,10,10,15]; // OEN blueprint per 100 questions
const NUM_SETS=Math.min(...byDom.map((l,d)=>Math.floor(l.length/QUOTA[d])));
const SETS=Array.from({length:NUM_SETS},(_,s)=>byDom.flatMap((list,d)=>list.slice(s*QUOTA[d],(s+1)*QUOTA[d])));
function weighted(seed){const r=seed?rng(seed):Math.random;return byDom.flatMap((list,d)=>shuffle(list,r).slice(0,QUOTA[d]));}
const PICKS=[
  ...SETS.map((q,i)=>({id:'set'+i,name:'Set '+(i+1),sub:q.length+' questions, weighted blueprint'})),
  {id:'rand',name:'Random 100',sub:'New weighted mix each time'},
  {id:'full',name:'Full bank',sub:BANK.length+' questions, full bank session'},
  ...DOMAINS.map((n,d)=>({id:'dom'+d,name:n,sub:byDom[d].length+' questions, one domain'}))
];
function questionsFor(id){
  if(id.startsWith('set'))return SETS[+id.slice(3)];
  if(id==='rand')return weighted();
  if(id==='full')return BANK.map((q,i)=>({...q,id:i}));
  return byDom[+id.slice(3)];
}
function startExam(){
  clearActiveSession();
  const base=questionsFor(S.cfg.pick);
  const seed=Date.now();const r=rng(seed);
  const qs=shuffle(base,r).map(q=>{
    const noShuf=q.o.some(t=>/^(both|all of|none of)/i.test(t));
    const order=noShuf?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i),r);
    return{...q,opts:order.map(i=>q.o[i]),key:order.indexOf(q.a)};
  });
  const secs=Math.round(qs.length*MIN_PER_Q*60);
  S={view:'intro',cfg:S.cfg,qs,ans:Array(qs.length).fill(null),flag:Array(qs.length).fill(false),i:0,left:secs,total:secs,
     mode:S.cfg.mode,stage:'q',popup:false,notes:Array(qs.length).fill(''),notesOpen:false,showTime:true,rf:'all',t0:Date.now(),title:PICKS.find(p=>p.id===S.cfg.pick).name};
  clearInterval(timer);
  saveActiveSession();
  render();
}
function tick(){
  S.left--;
  if(S.left<=0){S.left=0;finish();return;}
  if(S.left % 5 === 0) saveActiveSession();
  const t=$('#timer');if(t){t.textContent=fmt(S.left);t.classList.toggle('low',S.left<300)}
}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}

function finish(){
  clearInterval(timer);
  clearActiveSession();
  const n=S.qs.length;let c=0;const dm=DOMAINS.map(()=>({c:0,n:0}));
  S.qs.forEach((q,i)=>{dm[q.d].n++;if(S.ans[i]===q.key){c++;dm[q.d].c++}});
  const pct=Math.round(c/n*1000)/10;
  const used=S.mode==='exam'?Math.max(0,S.total-S.left):Math.round((Date.now()-S.t0)/1000);
  const attId = 'att_' + Date.now();
  saveHist({id:attId,t:Date.now(),name:S.title,mode:S.mode,c,n,pct,used,dm,qs:S.qs,ans:S.ans,flag:S.flag});
  S={...S,view:'result',c,n,pct,dm,used,passMark:DEFAULT_PASS,filter:'all'};
  render();window.scrollTo(0,0);
}

function pick(i){
  if(S.mode==='practice'&&S.ans[S.i]!==null){return}
  S.ans[S.i]=i;saveActiveSession();render();
}


function viewResult(attId) {

    view: 'result',

    c: x.c,
    n: x.n,
    pct: x.pct,

    mode: x.mode,

    ans: x.ans || Array(x.qs.length).fill(null),
    flag: x.flag || Array(x.qs.length).fill(false),
    passMark: DEFAULT_PASS,
    filter: 'all',
    cfg: (S && S.cfg) || { pick: 'set0', mode: 'exam' }

  render();

}

      let c='opt';if(shown){if(i===q.key)c+=' ok';else if(i===a)c+=' no'}else if(i===a)c+=' sel';
      return`<button class="${c}" role="radio" aria-checked="${i===a}" data-i="${i}"><span class="k">${L[i]}</span><span class="ot">${esc(t)}</span></button>`}).join('')}</div>
    ${shown?`<div class="fb ${a===q.key?'':'no'}"><b>${a===q.key?'Correct.':'Incorrect. Answer: '+L[q.key]+'.'}</b> ${esc(q.r)}</div>`:''}
  </div>
  ${S.notesOpen?`<div class="notes"><label for="nt">Notes for question ${S.i+1} (cleared when the exam ends)</label><textarea id="nt" rows="4">${esc(S.notes[S.i]||'')}</textarea></div>`:''}
  ${S.popup?popup():''}
  <div class="nav2">
    <div class="tools">
      <button class="tool flagbtn" id="flag" aria-pressed="${S.flag[S.i]}"><svg viewBox="0 0 24 24" width="17" height="17" fill="${S.flag[S.i]?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4M4 4h13l-2 4 2 4H4"/></svg><span>${S.flag[S.i]?'Flagged':'Flag'}</span></button>
      <button class="tool" id="rv"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Review</span></button>
      <button class="tool" id="nb" aria-pressed="${S.notesOpen}"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span>Notes${S.notes[S.i]?' •':''}</span></button>
    </div>
    <div class="steps">
      <button class="step" id="prev" ${S.i===0?'disabled':''}>&#8592; Previous</button>
      <button class="step go" id="next">Next &#8594;</button>
    </div>
  </div>
  </div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('#prev').onclick=()=>go(S.i-1);
  $('#next').onclick=()=>{if(S.i<S.qs.length-1)go(S.i+1);else{S.stage='review';S.rf='all';render();window.scrollTo(0,0)}};
  $('#flag').onclick=()=>{S.flag[S.i]=!S.flag[S.i];render()};
  $('#rv').onclick=()=>{S.popup=!S.popup;render()};
  $('#nb').onclick=()=>{S.notesOpen=!S.notesOpen;render()};
  const nt=$('#nt');if(nt){nt.oninput=()=>{S.notes[S.i]=nt.value};}
  const tt=$('#tt');if(tt)tt.onclick=()=>{S.showTime=!S.showTime;$('#timer').hidden=!S.showTime};
  bindPopup();bindEnd();
}
function bindEnd(){const e=$('#endnow');if(e)e.onclick=()=>{S.from=S.stage;S.popup=false;S.stage='end';render();window.scrollTo(0,0)}}
function popup(){
  return`<div class="modal" role="dialog" aria-label="Review"><div class="modalbox"><div class="top"><h2>Review</h2><button class="btn" id="pc">Close</button></div>
  <div class="scroll"><table><thead><tr><th>Question</th><th>Status</th><th>Flagged</th><th>Notes</th></tr></thead><tbody>${S.qs.map((q,i)=>`<tr class="clk ${i===S.i?'cur':''}" data-g="${i}"><td><a href="#" data-g="${i}">${i+1}</a></td><td>${S.ans[i]!==null?'Answered':'<b>Incomplete</b>'}</td><td>${S.flag[i]?'&#9873;':''}</td><td>${S.notes[i]?'&#9998;':''}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}
function bindPopup(){
  const pc=$('#pc');if(pc)pc.onclick=()=>{S.popup=false;render()};
  document.querySelectorAll('[data-g]').forEach(e=>e.onclick=ev=>{ev.preventDefault();S.popup=false;go(+e.dataset.g)});
}
function reviewScreen(){
  const un=S.ans.filter(x=>x===null).length,fl=S.flag.filter(Boolean).length;
  const rows=S.qs.map((q,i)=>i).filter(i=>S.rf==='all'||(S.rf==='inc'&&S.ans[i]===null)||(S.rf==='flag'&&S.flag[i]));
  app.innerHTML=`<div class="vue">${head(false)}
  <div class="qpane stack"><h2>Review Screen</h2>
    <p class="muted">${S.qs.length-un} answered, ${un} incomplete, ${fl} flagged. Select a question number to return to it.</p>
    <div class="row"><div class="seg" role="group" aria-label="Review filter">${[['all','Review All'],['inc','Review Incomplete'],['flag','Review Flagged']].map(([k,t])=>`<button data-rf="${k}" aria-pressed="${S.rf===k}">${t}</button>`).join('')}</div></div>
    <div class="scroll" style="max-height:52vh;overflow-y:auto"><table><thead><tr><th>Question</th><th>Status</th><th>Flagged</th><th>Notes</th></tr></thead><tbody>${rows.length?rows.map(i=>`<tr class="clk" data-g="${i}"><td><a href="#" data-g="${i}">${i+1}</a></td><td>${S.ans[i]!==null?'Answered':'<b>Incomplete</b>'}</td><td>${S.flag[i]?'&#9873;':''}</td><td>${S.notes[i]?'&#9998;':''}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">No questions in this list.</td></tr>'}</tbody></table></div></div>
  <div class="nav"><button class="btn" id="back">Back to exam</button><button class="btn primary" id="endrev">End Review</button></div></div>`;
  document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{S.rf=b.dataset.rf;render()});
  bindPopup();
  const tt=$('#tt');if(tt)tt.onclick=()=>{S.showTime=!S.showTime;$('#timer').hidden=!S.showTime};
  bindEnd();$('#back').onclick=()=>go(S.i);$('#endrev').onclick=()=>{S.from='review';S.stage='end';render()};
}
function endScreen(){
  const un=S.ans.filter(x=>x===null).length;
  app.innerHTML=`<div class="vue">${head(false)}
  <div class="qpane stack"><h2>End Exam</h2>
   <div class="confirm"><span><b>Once you click End Exam you cannot go back and review or change your responses.</b>${un?` You have ${un} unanswered question${un>1?'s':''}, which will score zero.`:''}</span></div>
   <p class="muted">To keep working, choose Back.</p></div>
  <div class="nav"><button class="btn" id="br">${S.from==='q'?'Back to exam':'Back to review'}</button><button class="btn danger" id="fin">End Exam</button></div></div>`;
  $('#br').onclick=()=>{if(S.from==='q')go(S.i);else{S.stage='review';render()}};$('#fin').onclick=finish;
  const tt=$('#tt');if(tt)tt.onclick=()=>{S.showTime=!S.showTime;$('#timer').hidden=!S.showTime};
}
function go(i){S.i=Math.max(0,Math.min(S.qs.length-1,i));S.stage="q";S.popup=false;saveActiveSession();render();window.scrollTo(0,0)}

function result(){
  const pass=S.pct>=S.passMark,L='ABCD';
  const list=S.qs.map((q,i)=>({q,i,a:S.ans[i]})).filter(x=>S.filter==='all'||(S.filter==='wrong'&&x.a!==x.q.key)||(S.filter==='flag'&&S.flag[x.i]));
  app.innerHTML=`<div class="stack">
  <div class="panel stack">
    <h3>${esc(S.title)} · Results</h3>
    <div class="row" style="gap:20px; align-items:center;">
      <div class="score">${S.pct}%</div>
      <div class="stack" style="gap:6px">
        <span class="pill ${pass?'pass':'fail'}">${pass?'Above':'Below'} the ${S.passMark}% mark</span>
        <span class="muted">${S.c} of ${S.n} correct · time used ${fmt(S.used)}</span>
      </div>
    </div>
    <div class="row" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:8px; border-top:1px solid var(--line); padding-top:12px;">
      <div class="row" style="align-items:center; gap:8px;">
        <label for="pm" class="small muted">Pass mark %</label>
        <input id="pm" type="number" min="1" max="100" value="${S.passMark}" style="width:60px; padding:4px 8px;">
      </div>
      <button class="btn primary again-btn" id="again-top" style="font-weight:600; padding:8px 16px;" onclick="goHome()">Take another paper ➔</button>
    </div>
  </div>
  <div class="panel stack"><h3>By domain</h3>${S.dm.map((d,i)=>d.n?`<div class="dom"><span>${DOMAINS[i]}</span><div class="track"><div class="fill ${d.c/d.n<.6?'lo':''}" style="width:${d.c/d.n*100}%"></div></div><span class="v">${d.c}/${d.n}</span></div>`:'').join('')}
    <p class="small muted">Red bars are below 60%. Spend your next study block on those domains.</p></div>
  <div class="panel stack"><div class="top"><h2>Answer review</h2><div class="seg" role="group" aria-label="Filter">
    ${[['all','All'],['wrong','Wrong or blank'],['flag','Flagged']].map(([k,t])=>`<button data-f="${k}" aria-pressed="${S.filter===k}">${t}</button>`).join('')}</div></div>
    ${list.length?list.map(({q,i,a})=>`<div class="rev"><div class="small muted">Q${i+1} · ${DOMAINS[q.d]}</div><div>${esc(q.q)}</div>
      <div class="small">Your answer: ${a===null?'<b>not answered</b>':`<b style="color:var(${a===q.key?'--good':'--bad'})">${L[a]}. ${esc(q.opts[a])}</b>`}</div>
      ${a===q.key?'':`<div class="small">Correct: <b style="color:var(--good)">${L[q.key]}. ${esc(q.opts[q.key])}</b></div>`}
      <div class="fb ${a===q.key?'':'no'} small">${esc(q.r)}</div></div>`).join(''):'<p class="muted">Nothing to show for this filter.</p>'}</div>
  <div class="row"><button class="btn primary again-btn" id="again" style="font-weight:600; padding:10px 20px;" onclick="goHome()">Take another paper ➔</button></div></div>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;result()});
  $('#pm').onchange=e=>{S.passMark=Math.max(1,Math.min(100,+e.target.value||DEFAULT_PASS));result()};
  document.querySelectorAll('.again-btn, #again, #again-top').forEach(b=>{b.onclick=(e)=>{e.preventDefault();goHome();}});
}
function render(){if(S.view==='home')home();else if(S.view==='intro')intro();else if(S.view==='exam')exam();else result()}
document.addEventListener('keydown',e=>{
  if(S.view!=='exam'||S.stage!=='q'||S.popup||['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k)&&k.length===1){const i='abcd'.indexOf(k);if(i<S.qs[S.i].opts.length)pick(i)}
  else if(e.key==='ArrowRight'){if(S.i<S.qs.length-1)go(S.i+1);else{S.stage='review';S.rf='all';render()}}else if(e.key==='ArrowLeft')go(S.i-1);
  else if(k==='f'){S.flag[S.i]=!S.flag[S.i];render()}
});
render();
</script>
</body></html>
