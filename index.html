extremely elevated WBCs (neutrophil predominance), heavily elevated protein, and a drastically decreased glucose level (because the bacteria are actively consuming the glucose for energy). Viral meningitis typically has normal glucose and clear fluid."}, {"d": 2, "q": "A patient is prescribed a continuous IV infusion of Amiodarone for recurrent Ventricular Tachycardia. The nurse knows that Amiodarone is highly effective but carries a risk of massive systemic toxicity. Which organ system requires the most vigilant long-term monitoring?", "o": ["Pulmonary system (monitoring for pulmonary fibrosis and toxicity)", "Renal system (monitoring for acute kidney injury)", "Gastrointestinal system (monitoring for massive GI bleeding)", "Skeletal system (monitoring for severe osteoporosis)"], "a": 0, "r": "Amiodarone is heavily laden with iodine and accumulates in tissues. Its most feared and potentially fatal long-term side effect is pulmonary toxicity, which can lead to irreversible pulmonary fibrosis. Patients require baseline and regular pulmonary function tests (PFTs) and chest X-rays."}, {"d": 2, "q": "A patient with a mechanical heart valve is taking Warfarin. The patient presents to the clinic with a massive nosebleed that will not stop, and large, spontaneous bruises on their arms. The stat INR result is 8.5. What is the nurse's priority action?", "o": ["Prepare to administer Vitamin K and Fresh Frozen Plasma (FFP)", "Administer a stat dose of Protamine Sulfate", "Instruct the patient to eat a large salad rich in leafy greens", "Administer a bolus of IV Heparin"], "a": 0, "r": "An INR of 8.5 with active, severe bleeding is a life-threatening medical emergency indicating extreme Warfarin toxicity. The immediate treatment is to stop the Warfarin and administer its antidote, Vitamin K (phytonadione), along with Fresh Frozen Plasma (FFP) or prothrombin complex concentrate (PCC) to rapidly replace the depleted clotting factors."}, {"d": 2, "q": "A patient is admitted with Acute Pancreatitis. On assessment, the nurse taps the patient's facial nerve and observes a positive Chvostek's sign. The nurse also notes a prolonged QT interval on the ECG. What electrolyte imbalance is occurring as a classic complication of this disease?", "o": ["Severe Hypocalcemia", "Severe Hyperkalemia", "Severe Hypernatremia", "Severe Hypoglycemia"], "a": 0, "r": "In acute, severe pancreatitis, the massively inflamed pancreas releases lipases that break down fat in the abdomen. Calcium in the bloodstream rapidly binds with these free fatty acids (a process called saponification), violently dragging calcium out of the blood and causing severe, life-threatening hypocalcemia (tetany, prolonged QT, Chvostek's/Trousseau's signs)."}, {"d": 2, "q": "A patient is diagnosed with Addison's disease (primary adrenal insufficiency). Which classic skin manifestation should the nurse expect to find during the physical assessment?", "o": ["Bronze-like hyperpigmentation of the skin, especially on the knuckles, elbows, and oral mucosa", "Severe, widespread vitiligo leaving the skin completely white", "A classic 'butterfly' rash across the bridge of the nose and cheeks", "Thickened, doughy skin with extreme facial puffiness"], "a": 0, "r": "In Addison's disease, the adrenal glands fail to produce cortisol. The pituitary gland compensates by mass-producing Adrenocorticotropic Hormone (ACTH) and Melanocyte-Stimulating Hormone (MSH). The excess MSH causes a classic, distinct bronze-like hyperpigmentation of the skin, particularly in sun-exposed areas, creases, and mucous membranes."}, {"d": 2, "q": "A patient with a history of intravenous drug abuse is diagnosed with right-sided Infective Endocarditis. The nurse must monitor this patient extremely closely for which life-threatening complication specific to the RIGHT side of the heart?", "o": ["Pulmonary Embolism (PE)", "Ischemic Stroke", "Acute Kidney Injury", "Mesenteric Ischemia"], "a": 0, "r": "Infective endocarditis creates friable 'vegetations' (clumps of bacteria/fibrin) on the heart valves. In right-sided endocarditis (common in IV drug users due to contaminated injections hitting the tricuspid valve first), if a vegetation breaks off, it immediately travels directly into the lungs, causing a massive, potentially fatal Pulmonary Embolism."}, {"d": 2, "q": "A patient with Acute Respiratory Distress Syndrome (ARDS) is mechanically ventilated with PEEP. The patient suddenly becomes severely hypotensive with a BP of 75/40. What is the most likely physiological cause of this hypotension related to the ventilator settings?", "o": ["High PEEP increases intrathoracic pressure, which heavily compresses the vena cava and decreases venous return to the heart", "High PEEP causes massive vasodilation of the peripheral arteries", "The ventilator oxygen concentration (FiO2) is set too high, causing oxygen toxicity", "The patient is experiencing an allergic reaction to the endotracheal tube plastic"], "a": 0, "r": "Positive End-Expiratory Pressure (PEEP) is essential for ARDS to keep alveoli open. However, high levels of PEEP dramatically increase intrathoracic pressure. This pressure squeezes the superior and inferior vena cava, severely reducing venous return (preload) to the right atrium, which causes cardiac output and blood pressure to plummet."}, {"d": 2, "q": "A patient arrives in the ER with suspected Carbon Monoxide (CO) poisoning after being pulled from a house fire. The patient is confused and cherry-red in the face. The pulse oximeter reads an SpO2 of 99% on room air. What is the nurse's immediate action?", "o": ["Ignore the pulse oximeter reading and administer 100% oxygen via a non-rebreather mask immediately", "Document the 99% SpO2 and assess the patient's pupils for signs of drug overdose", "Administer IV Naloxone to reverse the confusion", "Prepare the patient for a STAT chest X-ray before giving any oxygen"], "a": 0, "r": "Standard pulse oximeters cannot distinguish between oxygen and carbon monoxide attached to hemoglobin. Because CO binds to hemoglobin with 200x the affinity of oxygen, the pulse oximeter will read falsely high (often 99-100%) even if the patient is suffering from fatal tissue hypoxia. 100% oxygen is the immediate antidote."}, {"d": 2, "q": "A patient with a massive pulmonary embolism is prescribed a continuous IV infusion of Alteplase (tPA). Before starting the infusion, which specific piece of equipment must the nurse ensure is firmly in place and functioning?", "o": ["At least two large-bore peripheral IV lines or a central line, as no new venipunctures can be done during the infusion", "A continuous continuous passive motion (CPM) machine", "A hard cervical spine collar", "An intra-aortic balloon pump (IABP)"], "a": 0, "r": "Alteplase (tPA) is a potent thrombolytic ('clot-buster') that dissolves ALL clots in the body. Once the infusion begins, any new puncture to the skin (IV starts, ABGs, IM injections, Foley insertions) will bleed profusely and uncontrollably. All necessary invasive lines must be secured before starting the drug."}, {"d": 2, "q": "A 55-year-old male with a history of heart failure presents with severe dyspnea, crackles up to the mid-scapulae bilaterally, and pink, frothy sputum. The physician orders IV Morphine Sulfate in addition to Furosemide. What is the primary hemodynamic purpose of the Morphine in acute pulmonary edema?", "o": ["To cause venous vasodilation (reducing preload) and relieve severe anxiety, decreasing the heart's workload", "To heavily sedate the patient so they can be intubated", "To increase the force of myocardial contraction (positive inotropy)", "To directly bronchodilate the major airways"], "a": 0, "r": "In acute pulmonary edema (Left Heart Failure), Morphine is used for two critical reasons: it acts as a venodilator, pooling blood in the periphery and reducing the volume returning to the failing heart (decreasing preload), and it significantly reduces the severe panic and anxiety associated with air hunger, lowering oxygen demand."}, {"d": 2, "q": "A patient with chronic liver failure and hepatic encephalopathy is highly confused and flapping their hands (asterixis). The patient is prescribed oral Neomycin in addition to Lactulose. What is the specific mechanism of Neomycin in this disease process?", "o": ["It destroys the normal flora bacteria in the gastrointestinal tract that produce ammonia", "It directly repairs the damaged hepatocytes in the liver", "It acts as a strong laxative to flush toxins from the colon", "It binds to bile salts in the stomach to prevent vomiting"], "a": 0, "r": "Hepatic encephalopathy is caused by high serum ammonia levels. Much of the ammonia in the body is produced by normal flora (bacteria) in the intestines breaking down protein. Neomycin (or Rifaximin) is an antibiotic that stays in the gut and kills these bacteria, stopping the production of ammonia at its source."}, {"d": 2, "q": "A patient is recovering from a subtotal gastrectomy for stomach cancer. During meals, the patient experiences sudden diaphoresis, severe abdominal cramping, tachycardia, and explosive diarrhea. What syndrome is the patient experiencing, and how is it managed?", "o": ["Dumping Syndrome; managed by eating small, frequent meals, lying down for 30 minutes after eating, and avoiding drinking liquids with meals", "Gastric Ulcer Rupture; managed by immediate emergency surgery", "Paralytic Ileus; managed by inserting a nasogastric tube to low wall suction", "Acute Pancreatitis; managed by making the patient strictly NPO"], "a": 0, "r": "Dumping Syndrome occurs when a large portion of the stomach is removed, and hyperosmolar food 'dumps' rapidly into the jejunum, pulling massive amounts of fluid into the gut. It is managed by slowing gastric emptying: lying down after meals, eating high-protein/high-fat/low-carb foods, and separating liquids from solid foods by 30-45 minutes."}, {"d": 2, "q": "A patient with a severe traumatic brain injury has an intracranial pressure (ICP) of 28 mmHg. The physician orders an IV infusion of Mannitol. What type of drug is Mannitol, and how does it lower ICP?", "o": ["It is an osmotic diuretic; it drastically increases blood osmolarity, pulling water out of the swollen brain tissue and into the vascular space to be excreted by the kidneys", "It is a potent loop diuretic; it removes fluid directly from the lungs, which lowers pressure in the brain", "It is a heavy corticosteroid; it reduces inflammation in the brain tissue directly", "It is a targeted vasodilator; it opens the jugular veins to allow blood to drain faster"], "a": 0, "r": "Mannitol (a sugar alcohol) is a powerful osmotic diuretic. Because it cannot cross the intact blood-brain barrier, it stays in the blood, creating a massive osmotic gradient. This pulls water rapidly out of the edematous brain cells, into the blood, and flushes it out through the kidneys, rapidly lowering ICP."}, {"d": 2, "q": "A patient is admitted to the neuro ICU with an aneurysmal Subarachnoid Hemorrhage (SAH). The patient is placed on strict 'aneurysm precautions.' Which intervention is a key component of these precautions?", "o": ["Maintaining a dark, extremely quiet environment, enforcing strict bed rest, and preventing straining (Valsalva maneuver)", "Encouraging the patient to cough and deep breathe vigorously every hour", "Keeping the head of the bed completely flat (supine) at all times", "Performing aggressive physical therapy and range of motion exercises twice a day"], "a": 0, "r": "Aneurysm precautions are designed to prevent massive spikes in blood pressure or intracranial pressure that could cause the fragile aneurysm to re-rupture (a catastrophic event). This involves absolute bed rest, a dark/quiet room to minimize stimulation, stool softeners to prevent straining (Valsalva), and avoiding any vigorous coughing or physical exertion."}, {"d": 2, "q": "A patient with a deep vein thrombosis (DVT) is prescribed a continuous IV Heparin infusion. After 3 days, the physician prescribes oral Warfarin to begin simultaneously. The patient asks, 'Why do I have to take two blood thinners at once?' What is the nurse's best physiological explanation?", "o": ["'Warfarin takes 3 to 5 days to reach its full therapeutic effect in the body. The Heparin protects you quickly until the Warfarin takes over.'", "'The two drugs combine in the blood to create a stronger, new chemical that dissolves the clot instantly.'", "'Heparin thins the red blood cells, while Warfarin prevents the platelets from sticking together.'", "'The doctor made a mistake; you should only ever be on one blood thinner at a time.'"], "a": 0, "r": "Warfarin works by inhibiting Vitamin K-dependent clotting factors in the liver. Because the clotting factors already circulating in the blood must naturally degrade, Warfarin takes 3-5 days (often longer) to become therapeutic (INR 2.0-3.0). Rapid-acting IV Heparin is used as a 'bridge' to protect the patient from further clotting during this dangerous lag time."}, {"d": 2, "q": "A patient with End-Stage Renal Disease (ESRD) comes to the clinic with severe, burning pain and tingling in their feet. The patient has heavily elevated serum phosphorus levels and a low serum calcium level. The nurse suspects the patient is experiencing which chronic complication of ESRD?", "o": ["Peripheral Neuropathy secondary to uremic toxins", "Acute Gouty Arthritis", "Deep Vein Thrombosis", "Compartment Syndrome"], "a": 0, "r": "Uremic neuropathy is a classic complication of severe, prolonged ESRD. The severe buildup of uremic toxins (urea, creatinine, and unexcreted metabolic waste) damages the peripheral nerves, leading to painful 'stocking-glove' paresthesia, burning, and restless leg syndrome. High phosphorus and low calcium (renal osteodystrophy) also contribute to systemic complications."}, {"d": 2, "q": "A patient with a confirmed massive pulmonary embolism (PE) is in severe right ventricular failure and cardiogenic shock (BP 70/40). Which treatment is indicated as the ultimate definitive, life-saving therapy if thrombolytics (tPA) fail or are contraindicated?", "o": ["Emergency surgical Pulmonary Embolectomy or catheter-directed clot extraction", "Administration of high-dose oral Warfarin", "Placement of a prophylactic Inferior Vena Cava (IVC) filter", "Increasing the continuous IV Heparin rate by 50%"], "a": 0, "r": "In a massive, hemodynamically unstable PE that is causing the right heart to fail (cor pulmonale) and shock, if 'clot busters' (tPA) fail or cannot be used due to bleeding risks, the only definitive life-saving option is physically removing the clot via a surgical pulmonary embolectomy or advanced catheter-based extraction techniques."}, {"d": 2, "q": "A patient with a history of myasthenia gravis is admitted to the ICU with severe, generalized muscle weakness and acute respiratory distress. The patient recently contracted a severe respiratory infection. Which type of crisis is this patient most likely experiencing?", "o": ["Myasthenic Crisis", "Cholinergic Crisis", "Thyroid Storm", "Addisonian Crisis"], "a": 0, "r": "A Myasthenic Crisis is a life-threatening exacerbation of myasthenia gravis, usually triggered by severe stress, surgery, or a major infection (like pneumonia). It is characterized by a massive deficit of acetylcholine at the neuromuscular junction, leading to profound muscle weakness and fatal failure of the respiratory muscles (diaphragm)."}, {"d": 2, "q": "A patient is admitted to the trauma bay after a severe motor vehicle accident. The patient's left leg is noticeably shortened, internally rotated, and severely painful. What type of orthopedic injury does this classic presentation indicate?", "o": ["A posterior dislocation of the hip", "A fractured femur shaft", "An anterior dislocation of the hip", "A completely ruptured Achilles tendon"], "a": 0, "r": "The classic, hallmark clinical presentation of a posterior hip dislocation (often caused by the knee striking the dashboard in a car crash) is a leg that is severely shortened, adducted, and INTERNALLY rotated. (Conversely, a fractured hip neck typically presents as shortened and EXTERNALLY rotated)."}, {"d": 2, "q": "A patient with a new colostomy is receiving discharge instructions. The nurse instructs the patient to empty the ostomy pouch when it is:", "o": ["One-third to one-half full of stool or gas", "Completely full and bulging", "Only after a bowel movement has completely stopped for 12 hours", "Once a day, right before bedtime, regardless of how full it is"], "a": 0, "r": "An ostomy pouch should be emptied when it is 1/3 to 1/2 full of effluent (stool) or flatus (gas). Allowing the bag to become completely full makes it excessively heavy, which will pull the adhesive wafer away from the skin, causing devastating leaks and severe peristomal skin excoriation."}, {"d": 2, "q": "A patient with a history of severe Rheumatoid Arthritis is prescribed a TNF-alpha inhibitor biologic drug, Adalimumab (Humira). What vital screening MUST be performed and documented before the patient receives their first dose of this medication?", "o": ["A Tuberculin skin test (PPD) or Interferon-Gamma Release Assay (IGRA) to screen for latent Tuberculosis", "A comprehensive audiology exam to check for hearing loss", "A bone density scan (DEXA) to check for osteoporosis", "An MRI of the brain to check for demyelination"], "a": 0, "r": "TNF-alpha is a key cytokine that the immune system uses to keep Tuberculosis bacteria walled off in granulomas in the lungs. Taking a TNF-inhibitor biologic destroys these walls, causing latent, dormant TB to explode into a massive, fatal active TB infection. Therefore, strict TB screening is an absolute requirement before initiating these drugs."}, {"d": 2, "q": "A patient is admitted to the ICU with severe Acute Respiratory Distress Syndrome (ARDS) secondary to sepsis. The patient is mechanically ventilated. The physician orders the patient to be placed in the prone position. What is the primary physiological rationale for proning this patient?", "o": ["To recruit collapsed alveoli in the posterior segments of the lungs and improve ventilation-perfusion (V/Q) matching", "To prevent the development of sacral pressure ulcers", "To facilitate the drainage of massive amounts of purulent respiratory secretions", "To decrease the pressure of the abdominal organs on the diaphragm"], "a": 0, "r": "In severe ARDS, the posterior, dependent areas of the lungs become heavily consolidated and atelectatic due to gravity and edema. Prone positioning (placing the patient on their stomach) takes the weight of the heart off the lungs and physically recruits these massive posterior alveolar units, dramatically improving oxygenation."}, {"d": 2, "q": "A patient with a history of heart failure presents to the ED with severe shortness of breath. The physician orders a STAT B-type Natriuretic Peptide (BNP). The result is 1,200 pg/mL. What does this highly elevated result indicate?", "o": ["Severe ventricular stretch and volume overload consistent with acute decompensated heart failure", "A massive, acute myocardial infarction causing cardiac muscle necrosis", "A severe pulmonary embolism causing right-sided heart strain", "Normal physiological compensation for an older adult"], "a": 0, "r": "BNP is a neurohormone specifically secreted by the ventricular myocardium in response to excessive stretching and volume/pressure overload. Normal is < 100 pg/mL. A level of 1,200 pg/mL strongly confirms an acute exacerbation of heart failure."}, {"d": 2, "q": "A patient with acute pancreatitis is admitted to the medical-surgical unit. The physician orders the patient to remain strictly NPO (Nothing by Mouth). What is the primary physiological purpose of this order?", "o": ["To prevent the release of secretin and cholecystokinin, thereby reducing pancreatic enzyme secretion and auto-digestion", "To prevent the patient from aspirating due to severe nausea and vomiting", "To prepare the patient's bowel for an emergency exploratory laparotomy", "To shrink the stomach so it does not compress the inflamed pancreas"], "a": 0, "r": "Eating stimulates the release of secretin and cholecystokinin (CCK) from the duodenum, which in turn heavily stimulates the pancreas to secrete digestive enzymes. In pancreatitis, these enzymes are autodigesting the organ. NPO status 'rests' the pancreas by halting this stimulation."}, {"d": 2, "q": "A patient is admitted with a massive pulmonary embolism and is in severe cardiogenic shock. The patient is unresponsive to IV fluid resuscitation. The physician orders a continuous infusion of Norepinephrine. Which receptor does this medication primarily target to increase blood pressure?", "o": ["Alpha-1 adrenergic receptors, causing profound peripheral vasoconstriction", "Beta-2 adrenergic receptors, causing profound bronchodilation", "Muscarinic receptors, causing severe vagal blockade", "Dopaminergic receptors, causing selective renal vasodilation"], "a": 0, "r": "Norepinephrine (Levophed) is a potent vasopressor. It primarily stimulates Alpha-1 adrenergic receptors in the smooth muscle of blood vessels, causing massive peripheral vasoconstriction, which dramatically increases systemic vascular resistance (SVR) and blood pressure."}, {"d": 2, "q": "The nurse is caring for a patient with a traumatic brain injury (TBI). The patient's intracranial pressure (ICP) is 25 mmHg (normal: 5-15 mmHg). Which nursing intervention is CONTRAINDICATED?", "o": ["Grouping all nursing care activities (bathing, turning, suctioning) into one long session to allow for longer rest periods afterward", "Elevating the head of the bed to 30 degrees in a neutral midline position", "Maintaining a quiet, dimly lit environment", "Administering stool softeners to prevent straining during bowel movements"], "a": 0, "r": "In patients with elevated ICP, clustering nursing care (doing everything at once) causes a massive, sustained spike in intracranial pressure that the injured brain cannot compensate for. Care must be spaced out to allow the ICP to return to baseline between interventions."}, {"d": 2, "q": "A patient with cirrhosis of the liver has a severely prolonged Prothrombin Time (PT) and an elevated INR. The patient is actively bleeding from a minor laceration. The nurse anticipates an immediate order for which blood product?", "o": ["Fresh Frozen Plasma (FFP)", "Packed Red Blood Cells (PRBCs)", "Platelets", "Albumin 25%"], "a": 0, "r": "The liver synthesizes the majority of the body's clotting factors (which are measured by PT/INR). In severe cirrhosis, these factors are depleted, leading to bleeding. Fresh Frozen Plasma (FFP) contains all coagulation factors and is given to rapidly reverse the coagulopathy."}, {"d": 2, "q": "A patient with a history of heart failure is prescribed carvedilol. The patient asks the nurse, 'Why am I taking a blood pressure pill for my heart failure?' What is the nurse's best response?", "o": ["'It blocks the constant surge of adrenaline that is overworking your failing heart, helping it rest and preventing it from enlarging.'", "'It is a strong water pill that flushes the fluid out of your lungs.'", "'It directly forces your heart to pump much harder and faster.'", "'It opens up the coronary arteries to prevent a heart attack.'"], "a": 0, "r": "Carvedilol is a beta-blocker. In heart failure, the sympathetic nervous system constantly bombards the heart with catecholamines (adrenaline) to compensate, which ultimately exhausts and remodels the heart. Beta-blockers shield the heart from this toxic stimulation, slowing progression and improving survival."}, {"d": 2, "q": "A patient with a traumatic chest injury is diagnosed with a pneumothorax and has a chest tube inserted. The nurse notes continuous, rapid bubbling in the water-seal chamber. What should the nurse suspect?", "o": ["There is an active air leak in the patient's pleural space or in the tubing connections", "The chest tube is effectively draining the air from the lung", "The wall suction is turned up too high", "The lung has completely re-expanded"], "a": 0, "r": "Intermittent bubbling in the water-seal chamber is normal when the patient exhales or coughs as air is pushed out. However, continuous, rapid bubbling in the water seal indicates a persistent, active air leak either from a massive lung tear or a loose connection in the tubing."}, {"d": 2, "q": "A patient is receiving total parenteral nutrition (TPN) via a central line. The patient suddenly develops a fever of 39.5°C, chills, and hypotension. What is the nurse's priority action?", "o": ["Stop the TPN infusion, notify the physician, and prepare to culture the central line tip and blood", "Administer an antipyretic and increase the TPN rate to provide more calories", "Hang a new bag of TPN and change the tubing", "Decrease the TPN rate and cover the patient with warm blankets"], "a": 0, "r": "TPN is an extremely rich glucose solution that serves as a perfect medium for bacterial and fungal growth. High fever and shock in a patient with a central line and TPN strongly suggest Central Line-Associated Bloodstream Infection (CLABSI) or sepsis. The line must be stopped, and cultures must be drawn."}, {"d": 2, "q": "A patient with suspected acute cholecystitis is being assessed by the physician. The physician asks the patient to take a deep breath while pressing deeply under the right costal margin. The patient suddenly stops breathing in due to sharp pain. What is this sign called?", "o": ["Murphy's sign", "McBurney's sign", "Cullen's sign", "Turner's sign"], "a": 0, "r": "Murphy's sign is classic for cholecystitis. When the examiner palpates deeply under the right rib cage (costal margin) and the patient takes a deep breath, the inflamed gallbladder descends and hits the examiner's fingers, causing the patient to suddenly halt inspiration due to sharp pain."}, {"d": 2, "q": "A patient with advanced liver cirrhosis is admitted with bleeding esophageal varices. The patient is prescribed intravenous Octreotide. What is the physiological mechanism of this drug in this specific emergency?", "o": ["It causes selective splanchnic vasoconstriction, drastically reducing blood flow and pressure in the portal vein", "It directly seals the bleeding varices by causing blood to clot rapidly", "It completely paralyzes the stomach to prevent vomiting of blood", "It neutralizes stomach acid to prevent the varices from ulcerating"], "a": 0, "r": "Octreotide (a synthetic somatostatin analog) causes massive, selective vasoconstriction of the splanchnic (abdominal) arterial bed. This drastically cuts off the blood flow entering the portal vein, rapidly lowering portal hypertension and slowing the bleeding from the varices."}, {"d": 2, "q": "A patient is admitted in a severe Addisonian crisis. Vital signs: BP 75/40 mmHg, HR 125 bpm. Laboratory values show a serum sodium of 122 mEq/L and a serum potassium of 6.5 mEq/L. What is the absolute priority medical intervention?", "o": ["Rapid administration of IV Hydrocortisone and a massive bolus of 0.9% Normal Saline", "Administration of IV Kayexalate to lower the potassium", "Fluid restriction to correct the hyponatremia", "Administration of IV Amiodarone for the tachycardia"], "a": 0, "r": "An Addisonian crisis is a catastrophic lack of cortisol and aldosterone, leading to massive sodium and water loss (profound hypovolemic shock) and potassium retention. The only way to reverse the shock is to immediately replace the missing hormone (IV Hydrocortisone) and aggressively replace the lost volume with isotonic saline."}, {"d": 2, "q": "A patient with type 2 diabetes is scheduled for a cardiac catheterization utilizing IV iodine-based contrast dye. The patient takes Metformin 1000 mg twice daily. What critical instruction must the nurse provide?", "o": ["'You must stop taking your Metformin today and for 48 hours after the procedure to prevent severe kidney damage and lactic acidosis.'", "'Take your Metformin with a full glass of water right before the procedure.'", "'Double your dose of Metformin tomorrow because the dye contains sugar.'", "'You will never be able to take Metformin again after this procedure.'"], "a": 0, "r": "IV contrast dye is highly nephrotoxic. Metformin is exclusively cleared by the kidneys. If the dye causes acute kidney injury, the Metformin cannot be excreted and builds up to toxic levels, causing fatal lactic acidosis. It must be held before and for 48 hours after the scan until renal function is confirmed normal."}, {"d": 2, "q": "A patient arrives in the ER with a suspected acute ischemic stroke. The family states the patient's symptoms began 90 minutes ago. The patient weighs 80 kg. The physician orders IV Alteplase (tPA). The standard dose is 0.9 mg/kg. Ten percent (10%) of the total dose is given as a bolus over 1 minute. How many milligrams will be administered as the IV bolus?", "o": ["7.2 mg", "72 mg", "9.0 mg", "8.0 mg"], "a": 0, "r": "Total dose = 0.9 mg/kg * 80 kg = 72 mg. The bolus is 10% of the total dose. 72 mg * 0.10 = 7.2 mg. (The remaining 64.8 mg is infused over 1 hour)."}, {"d": 2, "q": "A patient with a traumatic spinal cord injury at the C5 level is entering the rehabilitation phase. The nurse knows this patient will be at lifelong risk for which autonomic complication triggered by a full bladder or bowel impaction?", "o": ["Autonomic Dysreflexia", "Neurogenic Shock", "Spinal Shock", "Brown-Séquard Syndrome"], "a": 0, "r": "Autonomic Dysreflexia is a massive, uncompensated cardiovascular reaction mediated by the sympathetic nervous system. It occurs exclusively in patients with spinal cord injuries at or above the T6 level and is typically triggered by a distended bladder or impacted bowel."}, {"d": 2, "q": "A patient is admitted with severe acute pancreatitis. The physician orders a clear liquid diet to be initiated once the patient's pain resolves. Why is a high-fat diet strictly contraindicated for this patient during recovery?", "o": ["Fat intake massively stimulates the release of cholecystokinin (CCK), which violently forces the pancreas to secrete enzymes, restarting auto-digestion", "Fats cannot be absorbed at all and will cause explosive diarrhea", "High-fat foods will cause immediate gallstone formation in the liver", "Fats will directly ulcerate the inflamed stomach lining"], "a": 0, "r": "The digestion of fats heavily relies on pancreatic lipase. When fat enters the duodenum, it triggers the massive release of CCK, which commands the pancreas to secrete enzymes. In a recovering pancreatitis patient, this will immediately restart the auto-digestion process and cause a severe relapse."}, {"d": 2, "q": "A patient with advanced cirrhosis and massive ascites undergoes a therapeutic paracentesis. The physician removes 6 liters of ascitic fluid. What medication should the nurse anticipate administering immediately during or after this procedure to prevent severe hypovolemic shock?", "o": ["Intravenous 25% Albumin", "Intravenous Furosemide", "Oral Spironolactone", "Intravenous 0.9% Normal Saline"], "a": 0, "r": "Large-volume paracentesis (> 5 liters) massively drops intra-abdominal pressure, causing blood to rapidly pool in the splanchnic vessels and fluid to shift out of the vascular space. This causes severe, sudden post-paracentesis circulatory dysfunction (hypotension/shock). IV Albumin acts as a volume expander to hold fluid in the blood vessels."}, {"d": 2, "q": "A patient with suspected acute appendicitis is lying in bed. The nurse asks the patient to lift their right leg against resistance. The patient complains of severe pain in the right lower quadrant. What is this clinical sign called?", "o": ["Psoas sign", "Obturator sign", "Rovsing's sign", "Cullen's sign"], "a": 0, "r": "The Psoas sign is elicited by having the patient flex their right thigh against the examiner's hand. This action contracts the iliopsoas muscle, which rubs directly against an inflamed appendix lying retrocecally, causing sharp RLQ pain."}, {"d": 2, "q": "A patient with a mechanical aortic valve replacement is on long-term Warfarin therapy. The patient's latest INR is 1.1. What is the nurse's interpretation of this result?", "o": ["The patient's blood is heavily prone to clotting; the dose must be increased immediately to prevent a fatal stroke or valve thrombosis", "The patient's blood is dangerously thin; the dose must be decreased to prevent a fatal hemorrhage", "The INR is perfectly therapeutic for a mechanical heart valve", "The INR indicates the patient is experiencing active bleeding"], "a": 0, "r": "For a patient with a highly thrombogenic mechanical heart valve, the target therapeutic INR is usually 2.5 to 3.5. An INR of 1.1 is essentially a normal, unmedicated level. The patient is at extreme, immediate risk for the valve clotting off or throwing a massive embolic stroke."}, {"d": 2, "q": "A patient with a severe traumatic brain injury (TBI) has an intracranial pressure (ICP) of 26 mmHg. The physician orders hyperventilation via the mechanical ventilator to bring the PaCO2 down to 30-35 mmHg. What is the physiological purpose of this intervention?", "o": ["Lowering PaCO2 causes cerebral vasoconstriction, which decreases the volume of blood in the brain and lowers ICP", "Lowering PaCO2 causes massive cerebral vasodilation, improving oxygen delivery to the damaged tissue", "Lowering PaCO2 paralyzes the patient so they cannot fight the ventilator", "Lowering PaCO2 acts as an osmotic diuretic, pulling water out of the brain cells"], "a": 0, "r": "Carbon dioxide is a potent cerebral vasodilator. By deliberately hyperventilating the patient to blow off excess CO2 (lowering PaCO2), the cerebral blood vessels constrict. This reduces the total volume of blood inside the rigid skull, temporarily and rapidly lowering life-threatening intracranial pressure."}, {"d": 2, "q": "A patient with a history of heart failure complains of waking up suddenly in the middle of the night, gasping for air, and feeling like they are suffocating. What is this specific clinical manifestation called?", "o": ["Paroxysmal Nocturnal Dyspnea (PND)", "Orthopnea", "Cheyne-Stokes Respiration", "Sleep Apnea"], "a": 0, "r": "Paroxysmal Nocturnal Dyspnea (PND) is a classic sign of severe left-sided heart failure. When the patient lies flat at night, massive amounts of fluid from the legs return to the heart. The failing left ventricle cannot pump it, causing it to back up into the lungs, waking the patient with a terrifying feeling of suffocation."}, {"d": 2, "q": "A patient with a deep vein thrombosis (DVT) is prescribed a continuous Heparin infusion. The baseline aPTT is 30 seconds. Six hours after starting the drip, the aPTT is 135 seconds. What is the nurse's immediate action?", "o": ["Stop the Heparin infusion immediately, notify the physician, and assess for any signs of bleeding", "Continue the infusion as this is the desired therapeutic effect", "Administer a STAT dose of Vitamin K", "Increase the infusion rate slightly to reach 150 seconds"], "a": 0, "r": "The therapeutic goal for aPTT on Heparin is typically 1.5 to 2.5 times the baseline (roughly 50-80 seconds). An aPTT of 135 is critically high ('supratherapeutic'), placing the patient at imminent risk for massive, fatal hemorrhage. The drip must be stopped."}, {"d": 2, "q": "A patient is admitted with Acute Pancreatitis. The nurse is monitoring the patient's laboratory values. Which electrolyte imbalance is a classic, severe complication of acute pancreatitis that can lead to fatal tetany and arrhythmias?", "o": ["Hypocalcemia", "Hyperkalemia", "Hypernatremia", "Hypomagnesemia"], "a": 0, "r": "In severe acute pancreatitis, massive fat necrosis occurs in the abdomen. Free fatty acids bind with calcium in the bloodstream (saponification), precipitously lowering serum calcium levels. The nurse must monitor for severe hypocalcemia (Chvostek's sign, Trousseau's sign, prolonged QT)."}, {"d": 2, "q": "A patient with Type 1 Diabetes is found unresponsive. The skin is pale, cool, and diaphoretic. The patient has a heart rate of 115 bpm. What is the most likely cause of this presentation?", "o": ["Severe Hypoglycemia", "Diabetic Ketoacidosis (DKA)", "Hyperglycemic Hyperosmolar State (HHS)", "Thyroid Storm"], "a": 0, "r": "Pale, cool, clammy skin ('cold and clammy, need some candy'), combined with extreme tachycardia, tremors, and altered mental status, are the hallmark signs of sympathetic nervous system activation in response to profound hypoglycemia. DKA presents with warm, dry skin, deep Kussmaul respirations, and a fruity breath odor."}, {"d": 2, "q": "A patient with severe right-sided heart failure (Cor Pulmonale) is admitted to the medical unit. Which clinical assessment finding is a DIRECT result of the right ventricle failing to pump blood effectively into the lungs?", "o": ["Massive peripheral edema, severe jugular vein distension (JVD), and hepatomegaly", "Severe orthopnea, bilateral pulmonary crackles, and pink frothy sputum", "Sudden onset of left-sided facial droop and expressive aphasia", "A loud, blowing diastolic murmur at the apex of the heart"], "a": 0, "r": "In right-sided heart failure, the right ventricle fails to pump blood forward into the lungs. As a result, venous blood backs up into the systemic circulation, causing profound systemic venous congestion: massive peripheral pitting edema, JVD, ascites, and liver engorgement (hepatomegaly)."}, {"d": 2, "q": "A patient with Myasthenia Gravis is prescribed Pyridostigmine. To maximize the effectiveness of this medication and ensure patient safety, when MUST the nurse administer it?", "o": ["Exactly 30 to 60 minutes before every meal", "Immediately at bedtime", "First thing in the morning on an empty stomach", "Only when the patient complains of severe muscle weakness"], "a": 0, "r": "Pyridostigmine is an acetylcholinesterase inhibitor that improves muscle strength. The most life-threatening complication of MG is profound weakness of the swallowing muscles (dysphagia/aspiration). The drug MUST be given 30-60 minutes prior to meals so that the drug peaks exactly when the patient needs to swallow food safely."}, {"d": 2, "q": "A patient is admitted to the cardiac intensive care unit following a massive anterior wall myocardial infarction. The patient develops profound hypotension, tachycardia, oliguria, and a cold, clammy periphery. The patient's cardiac index is severely reduced. What type of shock is this?", "o": ["Cardiogenic Shock", "Hypovolemic Shock", "Neurogenic Shock", "Anaphylactic Shock"], "a": 0, "r": "Cardiogenic shock occurs when the heart's pumping ability is severely impaired, most commonly due to massive muscle necrosis from a myocardial infarction. The hallmark is 'pump failure,' leading to drastically low cardiac output, hypotension, and poor tissue perfusion despite adequate blood volume."}, {"d": 2, "q": "A patient with severe Asthma is being mechanically ventilated. The high-pressure alarm suddenly sounds. The nurse suctions the patient, but the alarm continues. The patient's blood pressure drops, the trachea is deviated to the right, and breath sounds are absent on the left. What is the nurse's immediate action?", "o": ["Disconnect the patient from the ventilator, manually ventilate with a bag-valve-mask, and notify the provider immediately for needle decompression", "Increase the FiO2 on the ventilator to 100% and wait 5 minutes", "Administer a rapid IV fluid bolus to treat the hypotension", "Push the endotracheal tube in further, as it has likely slipped out"], "a": 0, "r": "The sudden loss of breath sounds, tracheal deviation, hypotension, and a high-pressure alarm indicate a tension pneumothorax (a common complication of ventilating severe asthmatics due to barotrauma). The immediate action is to take them off the positive pressure (which is worsening the tension), manually bag them, and prepare for emergency needle decompression."}, {"d": 2, "q": "A patient receives a new prescription for Lisinopril for heart failure. The nurse teaches the patient to report which classic, potentially dangerous side effect of ACE inhibitors immediately?", "o": ["Swelling of the lips, tongue, or face (Angioedema)", "A dry, persistent, hacking cough", "A slow heart rate below 60 bpm", "Yellow-tinged vision or halos"], "a": 0, "r": "While a dry, hacking cough is a common and annoying side effect of ACE inhibitors (like Lisinopril), Angioedema (swelling of the face, lips, tongue, and airway) is a rare, life-threatening allergic emergency that requires immediate discontinuation of the drug and medical intervention."}, {"d": 2, "q": "A patient with deep vein thrombosis is discharged on oral Warfarin. The patient asks if they can take over-the-counter pain medication for a headache. What is the nurse's best instruction?", "o": ["'You may take Acetaminophen (Tylenol), but completely avoid Aspirin or Ibuprofen (NSAIDs).'", "'You may take Aspirin, but avoid Acetaminophen.'", "'You cannot take any over-the-counter pain medications while on Warfarin.'", "'You may take Ibuprofen as long as you take it with food.'"], "a": 0, "r": "Warfarin prevents blood clotting. NSAIDs (Ibuprofen, Naproxen) and Aspirin heavily inhibit platelets and irritate the stomach lining. Combining them with Warfarin creates a massive, life-threatening risk for gastrointestinal hemorrhage. Acetaminophen is the safest OTC analgesic for these patients."}, {"d": 2, "q": "A patient is admitted with Diabetic Ketoacidosis (DKA). The initial potassium level is 3.3 mEq/L. The physician orders an IV insulin drip. What must the nurse do BEFORE starting the insulin drip?", "o": ["Administer IV potassium replacement as ordered to bring the level above 3.3 mEq/L", "Start the insulin drip immediately because the blood sugar is lethally high", "Administer a bolus of 50% Dextrose", "Administer IV Sodium Bicarbonate to correct the acidosis"], "a": 0, "r": "Insulin directly drives potassium from the blood into the cells. If a patient starts DKA treatment with hypokalemia (<3.3 mEq/L), starting an insulin drip will drop the potassium even further, causing immediate, fatal cardiac arrhythmias. Potassium MUST be replaced before insulin is initiated."}, {"d": 2, "q": "A patient with advanced liver cirrhosis is exhibiting confusion and lethargy (hepatic encephalopathy). The patient's serum ammonia level is highly elevated. Which diet modification is historically prescribed to reduce ammonia production in these severe cases?", "o": ["Moderate to low protein diet", "High protein diet", "High sodium diet", "Low carbohydrate diet"], "a": 0, "r": "Ammonia is a toxic byproduct of protein metabolism in the gut. While modern guidelines emphasize not overly restricting protein (to prevent malnutrition), in acute, severe episodes of hepatic encephalopathy, protein intake is temporarily moderated or restricted to reduce the raw material available for ammonia production."}, {"d": 2, "q": "A patient is scheduled for an MRI of the brain. Which of the following items in the patient's medical history is an ABSOLUTE contraindication for an MRI?", "o": ["A traditional cardiac pacemaker or implanted defibrillator", "A titanium joint replacement", "An allergy to iodine-based contrast dye", "A history of severe claustrophobia"], "a": 0, "r": "An MRI uses an incredibly powerful magnet. Traditional (non-MRI conditional) pacemakers and ICDs contain ferromagnetic components. The magnet will physically rip the device out of the chest, instantly destroy its programming, or heat the leads, causing fatal arrhythmias. This is an absolute contraindication."}, {"d": 2, "q": "A patient is admitted with a severe exacerbation of ulcerative colitis. The patient is having 20 bloody stools a day and is profoundly dehydrated. The physician orders bowel rest and Total Parenteral Nutrition (TPN). Why is TPN chosen over enteral (tube) feeding for this patient?", "o": ["TPN bypasses the gastrointestinal tract entirely, allowing the severely inflamed colon to rest and heal", "Enteral feeding is too thick to pass through a nasogastric tube", "TPN contains more calories than enteral feeding", "Enteral feeding would cause the patient to vomit immediately"], "a": 0, "r": "In severe inflammatory bowel disease exacerbations (ulcerative colitis, Crohn's), feeding the gut stimulates peristalsis and digestion, preventing the colon from healing and exacerbating the bloody diarrhea. TPN is delivered directly into a central vein, completely bypassing the gut and providing total 'bowel rest.'"}, {"d": 2, "q": "A patient with a traumatic brain injury is placed on mechanical ventilation. The nurse notes the patient is 'bucking' or 'fighting' the ventilator, causing intracranial pressure (ICP) to spike to 35 mmHg. The physician orders a neuromuscular blocking agent (Vecuronium). What other class of medication MUST the nurse administer concurrently?", "o": ["A sedative/analgesic (e.g., Propofol or Fentanyl)", "A beta-blocker to lower the heart rate", "An osmotic diuretic to pull fluid from the brain", "A broad-spectrum antibiotic"], "a": 0, "r": "Neuromuscular blocking agents (paralytics) paralyze every skeletal muscle in the body, including the diaphragm, but they have ZERO effect on consciousness, pain, or anxiety. Paralyzing a patient without heavy, continuous sedation and analgesia is absolute torture; they would be fully awake but completely trapped."}, {"d": 2, "q": "A patient is admitted to the ICU with severe Sepsis and a blood pressure of 75/40. The physician orders a rapid 30 mL/kg fluid bolus. Which type of intravenous fluid is the absolute standard of care for rapid volume resuscitation in septic shock?", "o": ["Isotonic crystalloids (e.g., 0.9% Normal Saline or Lactated Ringer's)", "Hypertonic crystalloids (e.g., 3% Sodium Chloride)", "Hypotonic crystalloids (e.g., 0.45% Normal Saline)", "Colloids (e.g., 25% Albumin)"], "a": 0, "r": "The Surviving Sepsis Campaign guidelines explicitly mandate the rapid administration of 30 mL/kg of Isotonic Crystalloids (Normal Saline or Lactated Ringer's) within the first 3 hours to restore intravascular volume and organ perfusion in septic shock."}, {"d": 2, "q": "A patient recovering from a massive myocardial infarction develops an audible S3 heart sound, bilateral crackles in the lung bases, and pink frothy sputum. What severe complication has occurred?", "o": ["Acute Left-Sided Heart Failure (Pulmonary Edema)", "Acute Right-Sided Heart Failure (Cor Pulmonale)", "Acute Pericarditis", "Aortic Aneurysm Rupture"], "a": 0, "r": "An S3 gallop, bilateral pulmonary crackles, and pink frothy sputum are the classic, hallmark triad of acute pulmonary edema, which is caused by profound left-sided heart failure (often following massive left ventricular damage from an MI)."}, {"d": 2, "q": "A patient is admitted with a suspected Acute Ischemic Stroke. The onset of symptoms was exactly 2 hours ago. The patient has a history of gastrointestinal bleeding 2 weeks ago. The physician is considering tPA (Alteplase). What is the nurse's absolute priority action?", "o": ["Notify the physician immediately of the recent GI bleed, as it is a strict contraindication for tPA", "Prepare the tPA infusion, as the patient is within the 3-hour window", "Administer a massive dose of oral Aspirin immediately", "Prepare the patient for an emergency craniotomy"], "a": 0, "r": "While the patient is within the 3 to 4.5-hour time window for tPA, thrombolytics dissolve EVERY clot in the body. A history of recent active internal bleeding (like a GI bleed within the last 21 days), recent major surgery, or severe trauma is an absolute contraindication, as tPA will cause massive, fatal re-bleeding."}, {"d": 2, "q": "The nurse is evaluating an arterial blood gas (ABG) for a patient with severe panic and hyperventilation. The results are: pH 7.55, PaCO2 25 mmHg, HCO3 24 mEq/L. Which acid-base imbalance is present?", "o": ["Uncompensated Respiratory Alkalosis", "Partially Compensated Metabolic Alkalosis", "Fully Compensated Respiratory Acidosis", "Uncompensated Metabolic Acidosis"], "a": 0, "r": "The pH is high (alkalosis). The PaCO2 is very low (respiratory). The HCO3 is normal (22-26), meaning the kidneys have not yet compensated. Hyperventilation rapidly 'blows off' acidic CO2, leading to Uncompensated Respiratory Alkalosis."}, {"d": 2, "q": "A patient is admitted to the ICU with a diagnosis of Syndrome of Inappropriate Antidiuretic Hormone (SIADH) secondary to lung cancer. Which profound electrolyte imbalance is the absolute hallmark of this disease?", "o": ["Dilutional Hyponatremia", "Severe Hyperkalemia", "Profound Hypercalcemia", "Massive Hypernatremia"], "a": 0, "r": "In SIADH, the body produces an excessive, inappropriate amount of ADH, causing the kidneys to desperately retain free water. This massive water retention violently dilutes the sodium in the blood, leading to severe, life-threatening Dilutional Hyponatremia (which can cause fatal cerebral edema and seizures)."}, {"d": 2, "q": "A patient is admitted with severe burns covering 50% of their total body surface area (TBSA). During the first 24 hours (the emergent phase), which massive fluid shift occurs, leading to shock?", "o": ["Fluid shifts massively from the intravascular space into the interstitial space due to increased capillary permeability", "Fluid shifts massively from the intracellular space into the intravascular space", "Fluid shifts massively from the interstitial space into the intracellular space", "Fluid shifts massively from the intravascular space into the lungs, causing immediate pulmonary edema"], "a": 0, "r": "Burns cause massive systemic inflammation, totally destroying capillary integrity. This increased capillary permeability allows massive amounts of plasma, proteins (albumin), and electrolytes to leak OUT of the blood vessels (intravascular space) and INTO the surrounding tissues (interstitial space). This 'third-spacing' leads to profound hypovolemic shock."}, {"d": 2, "q": "A patient with a history of Addison's disease (Primary Adrenal Insufficiency) is admitted with a severe gastrointestinal infection, vomiting, and diarrhea. The patient is hypotensive, profoundly weak, and confused. What life-threatening event is occurring?", "o": ["Addisonian Crisis (Acute Adrenal Insufficiency)", "Thyroid Storm", "Myxedema Coma", "Diabetic Ketoacidosis"], "a": 0, "r": "Patients with Addison's disease lack cortisol and aldosterone. During times of severe physical stress (infection, trauma, surgery), their bodies cannot produce the surge of stress hormones required to survive. This triggers an Addisonian Crisis, characterized by massive sodium/water loss (hypovolemic shock), hyperkalemia, and hypoglycemia. It requires immediate IV hydrocortisone."}, {"d": 2, "q": "A patient is admitted with acute severe pancreatitis. The nurse understands that this disease is caused by the autodigestion of the pancreas. Which pancreatic enzyme is primarily responsible for the massive, painful fat necrosis seen in the abdomen?", "o": ["Lipase", "Amylase", "Trypsin", "Pepsin"], "a": 0, "r": "While Trypsin is the enzyme that triggers the cascade of auto-digestion, it is Lipase that specifically breaks down fat. In pancreatitis, the escaped lipase massively destroys the surrounding abdominal fat (fat necrosis), which binds with calcium (saponification), leading to severe hypocalcemia."}, {"d": 2, "q": "A patient with chronic liver failure and portal hypertension undergoes an esophagogastroduodenoscopy (EGD) which reveals large, bulging esophageal varices. The physician prescribes a non-selective beta-blocker (Propranolol) for the patient to take daily at home. What is the primary purpose of this medication in this specific scenario?", "o": ["To chronically decrease portal venous pressure and prevent a massive variceal hemorrhage", "To treat the patient's underlying severe chronic heart failure", "To prevent the development of hepatic encephalopathy", "To directly shrink the size of the failing liver"], "a": 0, "r": "Non-selective beta-blockers (like Propranolol or Nadolol) are the gold standard for the primary prophylaxis of esophageal variceal bleeding. They decrease cardiac output and cause splanchnic vasoconstriction, which significantly lowers the pressure inside the portal vein, preventing the fragile varices from rupturing."}, {"d": 2, "q": "A patient with a history of heart failure complains of sudden, severe shortness of breath. The nurse auscultates the lungs and hears fine crackles extending up to the mid-axillary line bilaterally. The patient is coughing up pink, frothy sputum. The physician orders a STAT dose of IV Furosemide. Over what time frame should the nurse push 40 mg of IV Furosemide?", "o": ["Slowly over 1 to 2 minutes (approx. 20 mg per minute)", "As a rapid, immediate IV push over 5 seconds", "Diluted in 50 mL of saline and infused over 1 hour", "Slowly over 10 minutes to prevent a sudden drop in blood pressure"], "a": 0, "r": "IV Furosemide (Lasix) is highly ototoxic if administered too rapidly. The strict, standard administration guideline to prevent permanent hearing loss/tinnitus is to push the medication slowly at a rate not exceeding 20 mg per minute. Therefore, 40 mg is pushed over 1 to 2 minutes."}, {"d": 2, "q": "A patient with liver cirrhosis has been taking Lactulose for three days. The patient is currently alert, oriented to person, place, and time, and has no asterixis. However, the patient complains of having 3 loose bowel movements today and asks for an antidiarrheal medication. What is the nurse's best action?", "o": ["Explain that the loose stools are the desired effect of the medication to remove toxins, and withhold the antidiarrheal", "Administer Loperamide (Imodium) as requested to prevent dehydration", "Hold the next dose of Lactulose because the patient's mental status has returned to normal", "Notify the physician that the patient is experiencing a severe adverse reaction to the Lactulose"], "a": 0, "r": "Lactulose works by drawing water and ammonia into the colon, causing a laxative effect (2-3 soft/loose stools a day) to expel the ammonia. This is the intended therapeutic mechanism. Giving an antidiarrheal will trap the ammonia inside the gut, precipitating a fatal return of hepatic encephalopathy and coma."}, {"d": 2, "q": "A patient is admitted to the emergency department after a high-speed motor vehicle collision. The patient is diagnosed with a massive right-sided hemothorax. A chest tube is inserted. Upon initial insertion, the chest tube drains 1,200 mL of bright red blood. What is the nurse's priority action?", "o": ["Notify the trauma surgeon immediately; prepare for massive transfusion and emergency thoracotomy", "Document the output as an expected initial finding and continue monitoring", "Clamp the chest tube to prevent the patient from exsanguinating through the tube", "Autotransfuse the blood directly back into the patient using a standard IV pump"], "a": 0, "r": "An initial chest tube output greater than 1,000 mL to 1,500 mL of bright red blood, or continuous bleeding of >200 mL/hr for 2-4 hours, indicates massive, uncontrolled intrathoracic hemorrhage. This is a profound surgical emergency requiring immediate blood transfusions and an emergency thoracotomy (open chest surgery) to physically clamp the bleeding vessels."}, {"d": 2, "q": "The nurse is analyzing a rhythm strip. The rhythm is completely irregular with absolutely no visible P waves. Instead, the baseline consists of fine, chaotic, undulating fibrillatory waves. The ventricular rate is 130 bpm. What rhythm is this?", "o": ["Atrial Fibrillation with Rapid Ventricular Response (RVR)", "Ventricular Fibrillation (V-Fib)", "Atrial Flutter", "Supraventricular Tachycardia (SVT)"], "a": 0, "r": "The classic hallmarks of Atrial Fibrillation (A-Fib) are an 'irregularly irregular' R-R interval, complete absence of true P waves, and a chaotic fibrillatory baseline. When the heart rate is >100 bpm, it is termed A-Fib with RVR, which severely compromises cardiac output."}, {"d": 2, "q": "A patient is experiencing an acute ischemic stroke. The physician orders a continuous infusion of Labetalol to manage the patient's severely elevated blood pressure (220/120 mmHg). What is the strict goal of blood pressure management in the acute phase of an ischemic stroke if the patient is NOT receiving tPA?", "o": ["Permissive hypertension: lower the BP by no more than 15% in the first 24 hours (unless it exceeds 220/120) to maintain cerebral perfusion to the ischemic penumbra", "Rapidly lower the BP to a normal range of 120/80 mmHg within 1 hour to stop the stroke from expanding", "Maintain the BP above 250/140 mmHg at all times", "Drop the systolic BP below 100 mmHg to stop all microvascular bleeding"], "a": 0, "r": "In acute ischemic stroke, the brain automatically drives blood pressure up to force blood into the dying tissue surrounding the stroke (the penumbra). If nurses drop the BP too fast or too low, the penumbra loses perfusion and dies, massively worsening the stroke. 'Permissive hypertension' allows the BP to stay high (up to 220/120) to save brain tissue."}, {"d": 2, "q": "A patient with Acute Respiratory Distress Syndrome (ARDS) is mechanically ventilated. The patient's latest ABG reveals profound hypoxemia despite an FiO2 of 100% and PEEP of 15 cm H2O. The critical care team decides to place the patient in the prone position. How does proning dramatically improve oxygenation in ARDS?", "o": ["It removes the heavy weight of the heart and abdominal organs off the posterior lungs, physically recruiting massive amounts of collapsed posterior alveoli", "It directly drains the thick, protein-rich pulmonary edema fluid out through the mouth", "It increases the heart rate, pushing blood faster through the lungs", "It stops the immune system from destroying the alveolar-capillary membrane"], "a": 0, "r": "Because patients lie flat on their backs (supine), gravity and the heavy weight of the heart/abdomen crush the posterior regions of the lungs, causing massive atelectasis (collapse). Turning the patient completely onto their stomach (proning) instantly un-crushes these areas, recruiting millions of alveoli and drastically improving ventilation-perfusion (V/Q) matching."}, {"d": 2, "q": "A patient is admitted with a massive subarachnoid hemorrhage (SAH). The patient complains of the 'worst headache of my life.' To prevent the devastating complication of cerebral vasospasm, the nurse anticipates the physician will order which specific medication?", "o": ["Nimodipine (a calcium channel blocker)", "Alteplase (a thrombolytic)", "Heparin (an anticoagulant)", "Mannitol (an osmotic diuretic)"], "a": 0, "r": "Following a subarachnoid hemorrhage, blood breakdown products massively irritate the blood vessels on the surface of the brain, causing severe, fatal cerebral vasospasms (leading to severe secondary ischemic strokes) between days 3-14. Nimodipine is a highly highly specific calcium channel blocker that crosses the blood-brain barrier to prevent these spasms."}, {"d": 2, "q": "A patient with a history of Addison's disease (Primary Adrenal Insufficiency) arrives at the clinic complaining of profound weakness, dizziness, and weight loss. The patient's skin appears distinctly bronze-colored, especially on the knuckles and gums. Laboratory tests reveal severe hyponatremia and hyperkalemia. What is the standard daily maintenance therapy for this condition?", "o": ["Lifelong daily oral replacement of glucocorticoids (Hydrocortisone) and mineralocorticoids (Fludrocortisone)", "A 14-day course of high-dose intravenous antibiotics", "Lifelong daily oral administration of Levothyroxine", "Surgical removal of the pituitary gland"], "a": 0, "r": "Addison's disease is the complete autoimmune destruction of the adrenal cortex. The body produces zero cortisol (glucocorticoid) and zero aldosterone (mineralocorticoid). The patient requires lifelong, daily oral replacement of both hormones to survive, and the doses must be doubled or tripled during times of physical stress or illness."}, {"d": 2, "q": "A patient presents to the ER with excruciating, 'tearing' pain radiating straight through to their back. The physician suspects an Acute Aortic Dissection. The patient's blood pressure is 220/120 mmHg. What is the absolute, immediate medical priority for this patient?", "o": ["Administer rapid, continuous IV antihypertensives (e.g., Esmolol or Nitroprusside) to immediately drop the blood pressure and heart rate, reducing shearing forces on the aorta", "Administer a massive rapid bolus of IV Normal Saline to prepare for surgery", "Administer a continuous IV infusion of Heparin to prevent the tear from clotting incorrectly", "Perform vigorous, deep abdominal palpation to locate the exact size of the tear"], "a": 0, "r": "An aortic dissection is a tear in the inner lining of the massive aorta. Every heartbeat at a high pressure acts like a knife, ripping the tear further down the aorta until it ruptures fatally. The absolute immediate priority is aggressive, rapid reduction of blood pressure and heart rate (using IV beta-blockers) to drastically reduce the sheer stress/force on the aortic wall."}, {"d": 2, "q": "A patient is admitted to the neurosurgical ICU with a severe traumatic brain injury. The physician orders the insertion of an external ventricular drain (EVD) to continuously monitor intracranial pressure (ICP) and drain cerebrospinal fluid. At what exact anatomical landmark MUST the zero point of the EVD transducer be leveled?", "o": ["The Foramen of Monro (approximated at the tragus of the ear)", "The Phlebostatic Axis (4th intercostal space, midaxillary line)", "The level of the sternal notch", "The tip of the patient's nose"], "a": 0, "r": "For accurate intracranial pressure readings and safe CSF drainage, the transducer of the EVD must be perfectly leveled with the Foramen of Monro inside the brain. Externally, this is approximated by leveling the laser/transducer exactly at the tragus (the small cartilaginous flap) of the patient's ear."}, {"d": 2, "q": "A patient is admitted with a massive acute myocardial infarction (AMI). The patient is cold, clammy, and has a blood pressure of 70/40 mmHg. The physician orders a continuous infusion of Norepinephrine (Levophed). What specific receptor does this drug heavily stimulate to save the patient's life?", "o": ["Alpha-1 receptors in the blood vessels, causing massive vasoconstriction", "Beta-2 receptors in the lungs, causing massive bronchodilation", "Dopaminergic receptors in the kidneys, increasing urine output", "GABA receptors in the brain, causing deep sedation"], "a": 0, "r": "Norepinephrine is the gold-standard vasopressor for profound shock. It is a powerful Alpha-1 agonist. By stimulating the alpha-1 receptors in the smooth muscle of the peripheral vasculature, it causes massive, intense vasoconstriction, which dramatically raises Systemic Vascular Resistance (SVR) and blood pressure, forcing blood back to the vital organs."}, {"d": 2, "q": "A patient with liver cirrhosis has heavily elevated serum ammonia levels. The physician prescribes oral Lactulose. Which clinical assessment finding indicates the treatment is achieving its primary physiological goal?", "o": ["The patient becomes more alert, oriented, and asterixis resolves", "The patient has 3 to 4 soft bowel movements per day", "The patient's abdominal girth decreases significantly", "The patient's scleral icterus (jaundice) disappears"], "a": 0, "r": "While producing 2-3 soft stools a day is the *mechanism* by which Lactulose works (trapping ammonia in the gut and expelling it), the primary *therapeutic goal* is the reduction of hepatic encephalopathy. Improvement in mental status and resolution of asterixis indicate the treatment is successful."}, {"d": 2, "q": "A patient with chronic kidney disease (CKD) is prescribed Aluminum Hydroxide gel. What is the specific pharmacological purpose of administering this medication to a CKD patient?", "o": ["To bind excess dietary phosphorus in the intestines and excrete it in the feces", "To neutralize excess stomach acid to prevent uremic ulcers", "To directly lower severely elevated serum potassium levels", "To stimulate the bone marrow to produce red blood cells"], "a": 0, "r": "In CKD, the kidneys lose the ability to excrete phosphorus, leading to severe hyperphosphatemia (which severely depletes calcium). Aluminum Hydroxide (and Sevelamer) act as phosphate binders. They must be taken with meals to bind the phosphorus in the food, preventing it from entering the bloodstream."}, {"d": 2, "q": "A patient is admitted to the emergency department with a massive stroke. The physician diagnoses a hemorrhagic stroke (subarachnoid hemorrhage). The patient's blood pressure is 210/115 mmHg. The nurse anticipates an immediate order for which intervention to prevent catastrophic re-bleeding?", "o": ["A continuous IV infusion of Labetalol or Nicardipine to rapidly lower the blood pressure", "A continuous IV infusion of Alteplase (tPA)", "A massive bolus of IV Heparin", "A rapid IV bolus of 0.9% Normal Saline to increase cerebral perfusion"], "a": 0, "r": "In a hemorrhagic stroke (a ruptured vessel bleeding into the brain), extreme hypertension acts like a firehose, driving massive amounts of blood into the brain tissue and increasing ICP. Unlike an ischemic stroke (where BP is kept high), in a hemorrhagic stroke, the absolute priority is to lower the BP rapidly using IV antihypertensives to stop the active bleeding."}, {"d": 2, "q": "A patient with a history of COPD is admitted with severe respiratory distress. The patient's baseline oxygen saturation is 89-91%. The physician orders oxygen via nasal cannula. Why is it dangerous to administer high-flow oxygen (e.g., 6 Liters) to this specific patient?", "o": ["It removes their hypoxic drive to breathe, potentially causing massive hypoventilation and fatal CO2 narcosis", "It causes immediate, severe bronchospasms, worsening their asthma", "It directly paralyzes the diaphragm muscle", "It causes massive pulmonary hypertension and right-sided heart failure"], "a": 0, "r": "In healthy individuals, the primary drive to breathe is a high CO2 level. In chronic COPD, the patient's body has adapted to chronically high CO2. Their new, secondary drive to breathe becomes a LOW oxygen level (hypoxic drive). If the nurse floods them with high-flow oxygen, the brain senses plenty of oxygen, shuts down the drive to breathe, and the patient stops breathing (CO2 narcosis)."}, {"d": 2, "q": "A patient is recovering from a thyroidectomy. The nurse assesses the patient and notes a positive Trousseau's sign (carpopedal spasm when the blood pressure cuff is inflated). The patient's ECG shows a prolonged QT interval. What life-threatening complication is occurring?", "o": ["Severe Hypocalcemia due to accidental parathyroid gland removal", "Severe Hyperkalemia due to acute kidney injury", "Thyroid Storm due to excessive hormone release during surgery", "Severe Hypoglycemia due to fasting before surgery"], "a": 0, "r": "The parathyroid glands sit directly behind the thyroid. They are frequently damaged or accidentally removed during a thyroidectomy. Without parathyroid hormone, blood calcium levels plummet rapidly. Severe hypocalcemia manifests as tetany (Trousseau's and Chvostek's signs), numbness around the mouth, and a prolonged QT interval that can cause fatal arrhythmias. IV Calcium Gluconate is the antidote."}, {"d": 2, "q": "A patient with acute pancreatitis has a Salem Sump nasogastric (NG) tube inserted and connected to low continuous wall suction. What is the specific purpose of the blue 'pigtail' port on this NG tube?", "o": ["It acts as an air vent to prevent the main suction tube from painfully adhering to and tearing the stomach lining", "It is used exclusively to administer liquid medications and flush the tube", "It is used to attach a 60 mL syringe to vigorously aspirate stomach contents", "It is used to inflate the balloon that anchors the tube in the stomach"], "a": 0, "r": "A Salem Sump tube is a double-lumen NG tube. The main lumen is for suctioning. The smaller blue 'pigtail' lumen is an air vent that allows atmospheric air to enter the stomach. This equalizes the pressure and prevents the powerful suction from grabbing onto the fragile stomach mucosa and causing ischemic ulcers or tears. The blue pigtail must NEVER be clamped, tied off, or used for medications."}, {"d": 2, "q": "The nurse is analyzing a 12-lead ECG. The rhythm shows a totally disorganized, chaotic baseline with absolutely no discernible QRS complexes, P waves, or T waves. The patient is unresponsive and has no pulse. What rhythm is this, and what is the immediate priority?", "o": ["Ventricular Fibrillation (V-Fib); priority is immediate defibrillation", "Ventricular Tachycardia (V-Tach); priority is synchronized cardioversion", "Asystole; priority is immediate defibrillation", "Atrial Fibrillation; priority is a Heparin bolus"], "a": 0, "r": "Ventricular Fibrillation is a lethal arrhythmia where the ventricles merely quiver chaotically, producing zero cardiac output. It appears as a totally chaotic, wavy baseline with no QRS complexes. It is a shockable rhythm. The absolute highest priority is high-quality CPR and immediate defibrillation to reset the heart's electrical system."}, {"d": 2, "q": "A patient with a suspected Deep Vein Thrombosis (DVT) in the right calf is admitted to the medical floor. Which nursing intervention is strictly CONTRAINDICATED for this patient?", "o": ["Vigorously massaging the right calf to relieve muscle cramping and pain", "Elevating the right leg on a pillow while the patient is in bed", "Administering a continuous IV infusion of Heparin as prescribed", "Applying warm, moist compresses to the affected leg"], "a": 0, "r": "Vigorously massaging or rubbing a leg with a DVT is absolutely, strictly contraindicated. The mechanical force will easily dislodge the fragile blood clot, turning it into a massive, fatal Pulmonary Embolism that will shoot directly into the lungs."}, {"d": 2, "q": "A patient with a massive pulmonary embolism is in severe cardiogenic shock. The physician orders a continuous IV infusion of Alteplase (tPA). During the infusion, the patient complains of a sudden, severe, blinding headache and their pupils become unequal. What is the nurse's ABSOLUTE FIRST action?", "o": ["Stop the Alteplase (tPA) infusion immediately", "Administer a PRN dose of Acetaminophen for the headache", "Call the physician to request an order for a STAT head CT", "Elevate the head of the bed to 90 degrees"], "a": 0, "r": "Alteplase (tPA) is a powerful thrombolytic. Its most deadly complication is massive intracranial hemorrhage. A sudden, severe headache, unequal pupils, or any acute neurological change during a tPA infusion strongly indicates the patient's brain is bleeding. The absolute FIRST action is to STOP the drug causing the bleeding."}, {"d": 2, "q": "A patient is admitted with Diabetic Ketoacidosis (DKA). The patient is breathing rapidly and deeply at 32 breaths per minute. The patient's breath smells sweet and fruity. What is this specific respiratory pattern called, and what is its physiological purpose?", "o": ["Kussmaul respirations; the body is attempting to blow off massive amounts of carbon dioxide to compensate for the severe metabolic acidosis", "Cheyne-Stokes respirations; the patient is entering the final stages of a diabetic coma", "Biot's respirations; the patient has suffered a massive brainstem stroke", "Agonal gasps; the patient's respiratory muscles have completely paralyzed"], "a": 0, "r": "Kussmaul respirations are deep, rapid, and unlabored breaths. They are the body's primary compensatory mechanism for severe metabolic acidosis (DKA). By blowing off massive amounts of Carbon Dioxide (an acid), the lungs attempt to raise the blood's pH back toward normal. The fruity odor comes from acetone, a ketone body."}, {"d": 2, "q": "A patient with advanced heart failure has an Implantable Cardioverter-Defibrillator (ICD) placed. The nurse is providing discharge teaching. Which patient statement indicates a critical misunderstanding of the device?", "o": ["'If the device shocks me, I should wait to see if it happens a second time before calling the doctor.'", "'I cannot have an MRI scan because the magnet will destroy the device.'", "'I should carry my medical ID card for this device in my wallet at all times.'", "'I need to avoid standing directly next to strong anti-theft security gates at the mall.'"], "a": 0, "r": "An ICD is designed to deliver a massive electrical shock directly to the heart ONLY if the patient goes into a lethal, fatal arrhythmia (V-Tach or V-Fib). If the device fires even once, it means the patient essentially experienced a sudden cardiac arrest and was revived. They must immediately call EMS or their physician; they should never wait."}, {"d": 2, "q": "A patient is admitted to the emergency department after a severe crush injury to both legs. The patient is producing dark, 'tea-colored' urine. The serum Creatine Kinase (CK) level is 45,000 U/L. What is the most critical intervention to prevent permanent acute kidney injury in this patient?", "o": ["Administering massive, aggressive IV fluid resuscitation (crystalloids) to flush the myoglobin through the kidneys", "Administering high-dose IV corticosteroids to reduce muscle inflammation", "Placing the patient on strict fluid restriction to prevent pulmonary edema", "Administering a continuous IV Heparin infusion to prevent microvascular clotting"], "a": 0, "r": "Crush injuries cause massive muscle breakdown (Rhabdomyolysis), releasing myoglobin into the blood. Myoglobin physically clogs the renal tubules, causing acute tubular necrosis and kidney failure (tea-colored urine). Aggressive, massive IV fluid hydration (often with sodium bicarbonate) is the only way to flush the myoglobin out and save the kidneys."}, {"d": 2, "q": "A patient with a mechanical mitral valve replacement is being discharged on oral Warfarin. The patient loves salads. What specific dietary instruction regarding Vitamin K must the nurse provide?", "o": ["'Maintain a consistent, steady intake of Vitamin K-rich foods (like spinach and broccoli) from day to day.'", "'Completely eliminate all Vitamin K-rich foods from your diet forever.'", "'Eat as much Vitamin K as you want, as long as you take your Warfarin with it.'", "'Double your Warfarin dose on the days you eat large salads.'"], "a": 0, "r": "Warfarin works by blocking Vitamin K. If a patient suddenly eats a massive amount of Vitamin K, the Warfarin will stop working, and their mechanical valve will clot. If they suddenly stop eating it entirely, their blood will become dangerously thin. Consistency in Vitamin K intake is the absolute key to maintaining a stable INR."}, {"d": 2, "q": "A patient is admitted to the ICU in severe septic shock. The patient is intubated, receiving massive IV fluids, and is on high doses of Norepinephrine. The patient's fingertips and toes are becoming dark blue and cold. What is the physiological cause of this finding?", "o": ["Profound peripheral vasoconstriction caused by the high-dose vasopressor (Norepinephrine)", "An allergic reaction to the IV fluid bags", "Massive deep vein thromboses forming in all four extremities", "The body naturally shunting blood to the skin to cool a severe fever"], "a": 0, "r": "Norepinephrine is a potent Alpha-1 agonist that causes massive peripheral vasoconstriction to force blood to the vital organs (heart, brain) to sustain life during shock. The trade-off is that it cuts off blood supply to the non-vital extremities, causing severe ischemia and potential necrosis of the fingers, toes, and nose."}, {"d": 2, "q": "A patient with a history of COPD presents to the ED with worsening dyspnea. The ABG shows pH 7.28, PaCO2 65 mmHg, and HCO3 28 mEq/L. The patient is becoming lethargic and confused. What is the priority medical intervention?", "o": ["Initiate Non-Invasive Positive Pressure Ventilation (BiPAP) or prepare for intubation to increase ventilation", "Administer a massive rapid IV bolus of Sodium Bicarbonate", "Place the patient on 15 Liters of oxygen via a non-rebreather mask", "Administer a STAT dose of IV Lorazepam to calm the patient down"], "a": 0, "r": "The ABG shows uncompensated respiratory acidosis. The patient is retaining massive amounts of CO2, leading to CO2 narcosis (lethargy/confusion) and impending respiratory failure. The only way to fix respiratory acidosis is to increase alveolar ventilation. BiPAP or intubation is required to physically blow the CO2 out of the lungs. High-flow O2 will worsen the narcosis, and sedatives are absolutely contraindicated."}, {"d": 2, "q": "A patient with severe acute pancreatitis is admitted. The physician orders a continuous IV infusion of regular insulin despite the patient's blood glucose being normal. The patient has a serum triglyceride level of 2,500 mg/dL. Why is the insulin being given?", "o": ["To activate lipoprotein lipase, which rapidly breaks down the massively elevated triglycerides causing the pancreatitis", "To directly neutralize the pancreatic enzymes in the bloodstream", "To prevent the stress of the illness from causing diabetes later in life", "To force the remaining functional pancreas to rest completely"], "a": 0, "r": "Severe hypertriglyceridemia (levels > 1000 mg/dL) is a major cause of acute pancreatitis. An IV insulin infusion (along with Dextrose to prevent hypoglycemia) is a standard, highly effective therapy because insulin strongly activates lipoprotein lipase, an enzyme that rapidly clears the toxic triglycerides from the blood, resolving the pancreatitis."}, {"d": 2, "q": "A patient with advanced heart failure and atrial fibrillation is taking Amiodarone and Warfarin simultaneously. What critical pharmacological interaction must the nurse monitor for between these two medications?", "o": ["Amiodarone massively inhibits the metabolism of Warfarin in the liver, leading to dangerously high INR levels and severe bleeding risk", "Warfarin binds to Amiodarone in the gut, completely neutralizing the antiarrhythmic effect", "The combination causes an immediate, massive spike in blood pressure", "Amiodarone increases the excretion of Warfarin, leading to subtherapeutic INR and stroke risk"], "a": 0, "r": "Amiodarone is a potent inhibitor of the cytochrome P450 system in the liver. It dramatically slows the metabolism and clearance of Warfarin. If the Warfarin dose is not preemptively decreased (often by 30-50%) when Amiodarone is started, the patient's INR will skyrocket, causing fatal hemorrhage."}, {"d": 2, "q": "A patient is admitted to the emergency room with a suspected spinal cord injury at the C4 level. The patient is currently breathing independently but appears anxious. Suddenly, the patient's respiratory rate drops to 8 breaths per minute, and they become lethargic. What physiological mechanism is likely causing this respiratory failure?", "o": ["Edema from the C4 injury is ascending the spinal cord and compressing the phrenic nerve (C3-C5), which paralyzes the diaphragm", "The patient is experiencing a massive pulmonary embolism", "Spinal shock is causing massive vasodilation in the lungs", "The patient is having a severe panic attack leading to hypoventilation"], "a": 0, "r": "The phrenic nerve, which controls the diaphragm (the primary muscle of respiration), arises from cervical nerve roots C3, C4, and C5 ('C3, 4, and 5 keep the diaphragm alive'). An injury at C4 may initially leave some
