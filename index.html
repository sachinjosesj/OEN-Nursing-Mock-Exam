erior only"], "a": 0, "r": "II, III, aVF reflect the inferior wall (right coronary artery)."}, {"d": 2, "q": "A patient with an acute MI is given morphine for pain. The nurse should monitor FIRST for:", "o": ["Respiratory rate and blood pressure", "Skin colour only", "Bowel sounds", "Temperature"], "a": 0, "r": "Opioids can cause respiratory depression and hypotension."}, {"d": 2, "q": "Post-cardiac catheterisation via the femoral artery, the patient reports warmth and swelling at the groin. The nurse suspects:", "o": ["Haematoma or bleeding", "Normal healing", "Infection day 1", "Allergy"], "a": 0, "r": "Apply pressure and notify the doctor immediately."}, {"d": 2, "q": "A patient with atrial fibrillation is started on warfarin. Which instruction is MOST important?", "o": ["Keep a consistent intake of green leafy vegetables and attend INR checks", "Take aspirin for pain", "Skip doses if bruising", "Avoid all vegetables"], "a": 0, "r": "Vitamin K intake alters INR; consistency matters."}, {"d": 2, "q": "A patient with pneumonia has SpO2 88% on room air, RR 28. Which position is BEST?", "o": ["Semi-Fowler's or upright", "Supine", "Prone", "Trendelenburg"], "a": 0, "r": "Upright position improves ventilation."}, {"d": 2, "q": "A patient on a ventilator has an alarm for high pressure. The nurse should FIRST:", "o": ["Assess the patient for secretions, kinked tubing, coughing or biting", "Silence and walk away", "Turn off ventilator", "Increase sedation only"], "a": 0, "r": "High-pressure alarms often indicate obstruction or patient-ventilator problem; assess the patient first."}, {"d": 2, "q": "Which assessment finding is expected in left-sided heart failure?", "o": ["Crackles and dyspnoea", "Peripheral oedema only", "Hepatomegaly only", "Ascites only"], "a": 0, "r": "Pulmonary congestion causes crackles and breathlessness."}, {"d": 2, "q": "A patient with an ischaemic stroke is not eligible for thrombolysis. Which priority applies?", "o": ["Maintain airway, monitor neurologic status and prevent aspiration", "Encourage oral fluids immediately", "Lower BP aggressively", "Bed rest with no monitoring"], "a": 0, "r": "Swallow screening before oral intake."}, {"d": 2, "q": "The nurse is caring for a patient with a head injury. Which finding is the EARLIEST sign of deteriorating neurological status?", "o": ["Change in level of consciousness", "Fixed dilated pupil", "Bradycardia", "Posturing"], "a": 0, "r": "LOC changes first, other signs are later."}, {"d": 2, "q": "A patient is having a tonic-clonic seizure. What is the nurse's PRIORITY?", "o": ["Protect from injury, note the time and keep the airway clear after the seizure", "Restrain the limbs", "Place an object between the teeth", "Give oral fluids"], "a": 0, "r": "Never put objects in the mouth; protect and time."}, {"d": 2, "q": "A patient with Parkinson's disease has difficulty initiating walking. Which approach helps?", "o": ["Cue to lift feet, use a rhythmic count and wide base", "Hurry the patient", "Use a wheelchair always", "Restrict mobility"], "a": 0, "r": "Rhythmic cueing and a wide base assist gait."}, {"d": 2, "q": "The nurse is caring for a patient with myasthenia gravis. Which finding suggests a myasthenic crisis?", "o": ["Severe muscle weakness with respiratory difficulty", "Hyperactive reflexes", "Fever only", "Rash"], "a": 0, "r": "Crisis causes respiratory failure; emergency."}, {"d": 2, "q": "A patient with Guillain-Barré syndrome has ascending weakness. The priority assessment is:", "o": ["Respiratory function (vital capacity)", "Skin colour", "Appetite", "Mood"], "a": 0, "r": "Weakness can reach respiratory muscles."}, {"d": 2, "q": "A patient on dialysis has an arteriovenous fistula in the left arm. Which action is CORRECT?", "o": ["Check for thrill and bruit and avoid BP in the left arm", "Take BP in left arm", "Draw blood from left arm", "Apply a tight bandage"], "a": 0, "r": "Protect the fistula."}, {"d": 2, "q": "Which dietary advice is appropriate for a patient with chronic kidney disease on haemodialysis?", "o": ["Restrict fluids, potassium and phosphorus as advised", "Unlimited fluids", "High-potassium fruit daily", "Free salt use"], "a": 0, "r": "Dietary restriction prevents complications."}, {"d": 2, "q": "A patient with acute kidney injury produces 200 mL of urine in 24 hours. This is called:", "o": ["Oliguria", "Polyuria", "Normal output", "Anuria"], "a": 0, "r": "Oliguria <400 mL/day; anuria <100 mL/day."}, {"d": 2, "q": "A patient has an indwelling catheter and suprapubic pain with no urine output for 3 hours. The nurse should FIRST:", "o": ["Check for kinks or blockage and assess bladder distension", "Remove catheter", "Give diuretic", "Ignore"], "a": 0, "r": "Check patency before escalation."}, {"d": 2, "q": "Which finding indicates a UTI in an older adult?", "o": ["New confusion, with or without fever", "Increased appetite", "Clear urine", "Increased mobility"], "a": 0, "r": "Older adults often present atypically."}, {"d": 2, "q": "The nurse is teaching a patient with newly diagnosed type 2 diabetes about foot care. Which statement indicates understanding?", "o": ["'I will inspect my feet daily and wear well-fitting shoes.'", "'I will walk barefoot to toughen skin.'", "'I will cut corns myself.'", "'I will soak my feet in hot water.'"], "a": 0, "r": "Daily inspection and proper footwear prevent ulcers."}, {"d": 2, "q": "A patient with type 1 diabetes is vomiting and cannot eat. The nurse should advise:", "o": ["Continue insulin as advised, monitor glucose and ketones, and seek medical help", "Stop insulin", "Fast", "Take double insulin"], "a": 0, "r": "Sick-day rules: never omit basal insulin; monitor ketones."}, {"d": 2, "q": "A patient on prednisolone for long-term therapy should be taught to:", "o": ["Not stop suddenly and report infection signs", "Stop when better", "Take with alcohol", "Avoid all fluids"], "a": 0, "r": "Abrupt cessation can cause adrenal crisis."}, {"d": 2, "q": "A patient with rheumatoid arthritis has morning stiffness. Which advice is BEST?", "o": ["Warm bath or shower and gentle exercises on waking", "Complete bed rest", "Cold packs only", "Avoid movement"], "a": 0, "r": "Heat and movement ease stiffness."}, {"d": 2, "q": "A patient with osteoporosis should be advised to:", "o": ["Do weight-bearing exercise and ensure calcium and vitamin D intake", "Avoid all exercise", "Reduce calcium", "Smoke less only"], "a": 0, "r": "Bone loading and nutrition help."}, {"d": 2, "q": "Which finding after a hip fracture suggests fat embolism?", "o": ["Sudden dyspnoea, confusion and petechiae", "Bruising", "Mild pain", "Swelling only"], "a": 0, "r": "Fat embolism presents with respiratory distress, neuro change and rash."}, {"d": 2, "q": "A patient with a fractured femur in traction should be checked for:", "o": ["Neurovascular status of the limb and skin integrity", "Appetite only", "Hair colour", "Sleep only"], "a": 0, "r": "Check circulation, sensation and movement."}, {"d": 2, "q": "A patient with cirrhosis has ascites and is gaining weight rapidly. A priority nursing intervention is:", "o": ["Measure abdominal girth and daily weight", "Increase fluids", "Give extra sodium", "Bed flat"], "a": 0, "r": "Monitor fluid status."}, {"d": 2, "q": "Which is a priority assessment in a patient admitted with upper GI bleed and haematemesis?", "o": ["Vital signs and signs of shock", "Taste preference", "Weight only", "Hair"], "a": 0, "r": "Hypovolaemic shock is the immediate risk."}, {"d": 2, "q": "A patient with hypertension asks why they must take medication when they feel well. The best response is:", "o": ["'High blood pressure often has no symptoms but silently damages organs such as the heart, brain and kidneys.'", "'It is just a rule.'", "'You can stop when you feel fine.'", "'Your doctor knows best.'"], "a": 0, "r": "Explain asymptomatic risk and rationale."}, {"d": 2, "q": "A patient on amlodipine develops ankle swelling. The nurse should:", "o": ["Report it; peripheral oedema is a known side effect", "Stop the medication", "Increase the dose", "Ignore it"], "a": 0, "r": "Calcium channel blockers cause peripheral oedema."}, {"d": 2, "q": "Which finding is a priority in a patient with suspected pulmonary oedema?", "o": ["Frothy pink sputum and severe dyspnoea", "Mild cough", "Dry skin", "Normal SpO2"], "a": 0, "r": "Acute pulmonary oedema is an emergency; sit upright, oxygen, diuretic as ordered."}, {"d": 2, "q": "A patient with a deep vein thrombosis is started on a heparin infusion. Which lab test guides the dose?", "o": ["aPTT", "INR", "Sodium", "Haemoglobin A1c"], "a": 0, "r": "UFH is titrated by aPTT."}, {"d": 2, "q": "Which sign indicates a developing pressure on the nerve after casting of the forearm?", "o": ["Numbness and tingling in the fingers", "Warm fingers", "Pink nail beds", "Normal movement"], "a": 0, "r": "Report paraesthesia immediately."}, {"d": 2, "q": "A client after abdominal surgery has absent bowel sounds, distension and vomiting on day 2. The nurse suspects:", "o": ["Paralytic ileus", "Normal recovery", "Diarrhoea", "Hunger"], "a": 0, "r": "Keep NPO, notify surgeon; NG decompression may be needed."}, {"d": 2, "q": "A patient with newly diagnosed type 2 diabetes is started on metformin. Which instruction is correct?", "o": ["Take with meals to reduce stomach upset", "Take on an empty stomach always", "Double dose if glucose high", "Stop with fever"], "a": 0, "r": "Taking with food reduces GI effects."}, {"d": 2, "q": "A diabetic patient's blood glucose is 450 mg/dL with confusion and deep rapid breathing. The nurse anticipates:", "o": ["IV fluids and insulin infusion as prescribed", "Oral glucose", "Subcutaneous insulin only", "Restricted fluids"], "a": 0, "r": "DKA/HHS management: fluids first, then insulin with potassium monitoring."}, {"d": 2, "q": "A patient has a serum calcium of 6.8 mg/dL. Which sign is expected?", "o": ["Muscle twitching and positive Chvostek sign", "Muscle weakness and constipation", "Polyuria", "Bradycardia only"], "a": 0, "r": "Hypocalcaemia causes neuromuscular irritability."}, {"d": 2, "q": "A patient with chronic liver disease has asterixis. This indicates:", "o": ["Hepatic encephalopathy", "Heart failure", "Renal colic", "Hyperthyroidism"], "a": 0, "r": "Flapping tremor reflects raised ammonia."}, {"d": 2, "q": "A patient with active TB asks when they can stop isolation. The nurse explains that isolation ends when:", "o": ["Three consecutive sputum smears are negative and symptoms improve per policy", "The cough stops", "The diagnosis is made", "After 1 day of treatment"], "a": 0, "r": "Follow local infection control policy for release."}, {"d": 2, "q": "A patient taking rifampicin should be told to expect:", "o": ["Orange-red discolouration of urine and secretions", "Blue urine", "Black stool", "Yellow tears only"], "a": 0, "r": "Harmless but should be explained; also monitor liver function."}, {"d": 2, "q": "A client with asthma is prescribed an inhaled corticosteroid and a reliever. Which teaching is right?", "o": ["Rinse the mouth after using the corticosteroid inhaler", "Use the steroid as a rescue", "Avoid spacer", "Stop when well"], "a": 0, "r": "Rinsing reduces oral candidiasis."}, {"d": 2, "q": "A patient with an acute asthma attack has a silent chest. This indicates:", "o": ["Severe, life-threatening airflow obstruction", "Improvement", "Normal breathing", "Mild attack"], "a": 0, "r": "A silent chest is an ominous sign needing emergency care."}, {"d": 2, "q": "A patient is receiving IV potassium. Which action is essential?", "o": ["Dilute it and infuse via a pump, never as a bolus", "Give IV push quickly", "Give undiluted", "Mix without checking"], "a": 0, "r": "Rapid IV potassium can cause cardiac arrest."}, {"d": 2, "q": "A nurse is caring for a patient with a pressure injury on the heel. Which intervention is best?", "o": ["Float the heel with a pillow under the calf", "Place donut ring under heel", "Massage heel", "Apply tight bandage"], "a": 0, "r": "Offload heels so they are free of the surface."}, {"d": 2, "q": "A patient with burns on 30% of the body has a urine output of 20 mL/hour (adult). The nurse should:", "o": ["Report it as it suggests inadequate fluid resuscitation", "Document normal", "Reduce fluids", "Wait 4 hours"], "a": 0, "r": "Target urine output about 0.5 mL/kg/h (30–50 mL/h) in adults."}, {"d": 2, "q": "A patient has a cuff-less brachial pulse that is very weak and a blood pressure of 70/40 after major trauma. Priority is:", "o": ["Control bleeding and give IV fluids/blood as per protocol", "Give oral fluids", "Elevate head", "Wait"], "a": 0, "r": "Haemorrhagic shock requires rapid control and resuscitation."}, {"d": 2, "q": "The nurse is preparing a patient for a colonoscopy. Which instruction is correct?", "o": ["Complete the bowel preparation as directed and maintain hydration", "Eat a heavy meal", "Skip prep", "Take extra laxatives without advice"], "a": 0, "r": "Adequate bowel preparation is essential for the exam."}, {"d": 2, "q": "A patient post-thyroidectomy has hoarseness and noisy breathing. The nurse should:", "o": ["Assess airway and notify the surgeon immediately", "Reassure only", "Offer sips of water", "Document"], "a": 0, "r": "Possible haematoma or laryngeal nerve injury threatens the airway."}, {"d": 2, "q": "Which symptom suggests hyperkalaemia on an ECG?", "o": ["Tall peaked T waves", "U waves", "Prolonged QT only", "ST elevation only"], "a": 0, "r": "Hyperkalaemia: peaked T, widened QRS."}, {"d": 2, "q": "A patient with ulcerative colitis is advised to avoid which food during flares?", "o": ["High-fibre raw vegetables and spicy foods", "White rice", "Bananas", "Boiled potatoes"], "a": 0, "r": "Low-residue diet in flares."}, {"d": 2, "q": "A patient has a peripheral arterial disease. Which advice is BEST?", "o": ["Stop smoking, keep feet protected and walk to tolerance", "Cross legs", "Elevate legs above heart always", "Use heating pads"], "a": 0, "r": "Smoking cessation and exercise improve symptoms; avoid heat on insensate feet."}, {"d": 2, "q": "Which is an early sign of sepsis in an older adult?", "o": ["Confusion and tachycardia", "Rash only", "High appetite", "Bradycardia"], "a": 0, "r": "Altered mental state may be the first sign."}, {"d": 2, "q": "A patient with a chest drain: the drainage bottle is accidentally knocked over and the tube disconnects. The nurse should:", "o": ["Reconnect aseptically or place the tube end in sterile water and call for help", "Clamp it permanently", "Pull the tube", "Ignore"], "a": 0, "r": "Do not clamp; maintain water seal."}, {"d": 2, "q": "The nurse should expect which finding in cardiogenic shock?", "o": ["Hypotension, cold clammy skin and pulmonary oedema", "Warm flushed skin", "Hypertension", "High urine output"], "a": 0, "r": "Pump failure with poor perfusion."}, {"d": 2, "q": "A patient being discharged on insulin asks how to dispose of used pens' needles at home. The BEST advice is:", "o": ["Put in a rigid, puncture-resistant container", "Throw loosely in the bin", "Recap and keep", "Flush"], "a": 0, "r": "Safe sharps disposal."}, {"d": 2, "q": "A patient with chronic pain asks for opioid medication more frequently. The nurse should:", "o": ["Assess pain thoroughly and communicate with the prescriber for review", "Refuse", "Label as drug-seeking", "Ignore"], "a": 0, "r": "Reassess pain; adjust plan; avoid assumptions."}, {"d": 2, "q": "A patient has bilateral lower-limb oedema, JVD and an enlarged liver. Which condition is most likely?", "o": ["Right-sided heart failure", "Left-sided heart failure alone", "Pneumonia", "Asthma"], "a": 0, "r": "Systemic venous congestion."}, {"d": 2, "q": "Which finding is MOST consistent with acute pancreatitis?", "o": ["Severe epigastric pain radiating to the back", "Painless jaundice", "Right iliac fossa pain", "Diarrhoea only"], "a": 0, "r": "Pain relieved by leaning forward; high lipase."}, {"d": 2, "q": "A patient is admitted with unstable angina. Which instruction is MOST important?", "o": ["Report chest pain immediately and rest", "Exercise to tolerance", "Ignore mild pain", "Take sildenafil"], "a": 0, "r": "Unstable angina can progress to MI."}, {"d": 2, "q": "A patient takes sublingual glyceryl trinitrate for chest pain. After one dose, the pain persists. What should the patient do?", "o": ["Call emergency services if pain continues after 5 minutes per instructions", "Take 10 tablets", "Wait an hour", "Drive to hospital alone"], "a": 0, "r": "Persisting pain suggests MI; call emergency help."}, {"d": 2, "q": "A patient is receiving nitroglycerin infusion and complains of severe headache. The nurse should:", "o": ["Assess BP and notify the prescriber; headache is a common effect", "Stop all infusions", "Give a double dose", "Ignore"], "a": 0, "r": "Vasodilation headaches are common; check hypotension."}, {"d": 2, "q": "A patient with a permanent pacemaker is discharged. Which teaching is correct?", "o": ["Avoid strong magnetic fields and carry the device card", "Avoid all electronics", "Stop pulse checks", "Lift heavy items immediately"], "a": 0, "r": "Carry ID, avoid MRI unless compatible, report dizziness."}, {"d": 2, "q": "A patient with pericarditis has chest pain relieved by leaning forward. This is characteristic of:", "o": ["Pericardial pain", "Angina", "Pulmonary embolism", "Pneumothorax"], "a": 0, "r": "Pain eases when sitting forward."}, {"d": 2, "q": "A nurse is caring for a patient on a cardiac monitor. The alarm shows ventricular fibrillation and the patient is unresponsive. The FIRST action is:", "o": ["Begin CPR and call for the defibrillator", "Check electrodes only", "Silence alarm", "Give oral drug"], "a": 0, "r": "Immediate CPR and defibrillation."}, {"d": 2, "q": "A patient with asthma says wheeze worsened after starting a new medication. Which is MOST likely responsible?", "o": ["Beta-blocker", "Antihistamine", "Inhaled steroid", "Salbutamol"], "a": 0, "r": "Non-selective beta blockers can cause bronchospasm."}, {"d": 2, "q": "A patient with lung cancer has a new onset of facial swelling and neck vein distension. The nurse suspects:", "o": ["Superior vena cava syndrome", "Pneumonia", "Allergy only", "Tamponade"], "a": 0, "r": "SVC obstruction is an oncologic emergency."}, {"d": 2, "q": "A patient with a chest injury has paradoxical chest movement. This is:", "o": ["Flail chest", "Pneumonia", "Asthma", "Pleural effusion"], "a": 0, "r": "A segment moves inward on inspiration."}, {"d": 2, "q": "A patient on oxygen is smoking. The priority is:", "o": ["Remove ignition sources and ensure safety, then educate", "Allow it", "Increase oxygen", "Turn off all lights"], "a": 0, "r": "Oxygen supports combustion."}, {"d": 2, "q": "A patient with glaucoma should avoid:", "o": ["Medications with anticholinergic effects such as atropine", "Reading", "Walking", "Hydration"], "a": 0, "r": "Anticholinergics can raise intraocular pressure in angle-closure glaucoma."}, {"d": 2, "q": "A patient after cataract surgery should be advised to:", "o": ["Avoid rubbing the eye and heavy lifting", "Rub the eye gently", "Bend head down often", "Swim"], "a": 0, "r": "Protect the eye; avoid straining."}, {"d": 2, "q": "A patient with sudden painless vision loss like a 'curtain' coming down may have:", "o": ["Retinal detachment", "Cataract", "Conjunctivitis", "Dry eye"], "a": 0, "r": "Retinal detachment is an emergency."}, {"d": 2, "q": "A patient with otitis externa should be taught to:", "o": ["Keep the ear dry and use prescribed drops", "Use cotton buds deep", "Swim daily", "Insert oil"], "a": 0, "r": "Keep dry; avoid trauma."}, {"d": 2, "q": "A patient is receiving IV gentamicin and reports ringing in the ears. The nurse should:", "o": ["Report to prescriber immediately as it may be ototoxicity", "Give next dose", "Ignore", "Increase dose"], "a": 0, "r": "Tinnitus is an early sign of ototoxicity."}, {"d": 2, "q": "A patient with a spinal cord injury at T4 suddenly develops severe headache, hypertension and slow heart rate. The nurse suspects:", "o": ["Autonomic dysreflexia", "Meningitis", "Stroke only", "Hypoglycaemia"], "a": 0, "r": "Sit upright, remove the trigger (full bladder or bowel), notify."}, {"d": 2, "q": "The first step for autonomic dysreflexia is to:", "o": ["Sit the patient upright and loosen tight clothing", "Lay flat", "Give sedative", "Do nothing"], "a": 0, "r": "Lowers BP, then check bladder and bowel."}, {"d": 2, "q": "A patient with multiple sclerosis reports fatigue worsening in hot weather. The nurse advises:", "o": ["Keep cool and plan rest periods", "Take hot baths", "Exercise in midday heat", "Avoid fluids"], "a": 0, "r": "Heat worsens MS symptoms."}, {"d": 2, "q": "The nurse is caring for a patient with a laryngectomy. Which is the priority?", "o": ["Maintain the airway through the stoma", "Oral feeding at once", "Lying flat", "Speech therapy first"], "a": 0, "r": "Airway first."}, {"d": 2, "q": "A patient is receiving radiotherapy to the neck. Which skin care is correct?", "o": ["Gentle washing with lukewarm water and no creams unless prescribed", "Scrubbing", "Applying heat", "Applying adhesive tape"], "a": 0, "r": "Protect irradiated skin."}, {"d": 2, "q": "A patient after mastectomy: which arm care is correct?", "o": ["Avoid BP or injections in the affected arm to reduce lymphoedema risk", "Use the arm for blood draws", "Carry heavy bags", "Wear tight sleeves"], "a": 0, "r": "Protect the arm."}, {"d": 2, "q": "A patient with HIV is prescribed antiretroviral therapy. Which is MOST important?", "o": ["Take doses on time every day and do not stop without advice", "Take only when ill", "Share tablets", "Stop if rash"], "a": 0, "r": "Adherence prevents resistance."}, {"d": 2, "q": "A patient with sickle cell disease has chest pain, fever and dyspnoea. This may be:", "o": ["Acute chest syndrome", "Muscle strain", "Anxiety", "Reflux"], "a": 0, "r": "A medical emergency in sickle cell disease."}, {"d": 2, "q": "A patient with iron-deficiency anaemia is given oral iron. Which advice is correct?", "o": ["Take with vitamin C and expect dark stools", "Take with tea", "Take with antacids", "Stop if stool dark"], "a": 0, "r": "Vitamin C helps absorption; dark stools are expected."}, {"d": 2, "q": "A patient with pernicious anaemia requires:", "o": ["Lifelong vitamin B12 injections", "Iron only", "Folic acid only", "Vitamin C"], "a": 0, "r": "Lack of intrinsic factor impairs B12 absorption."}, {"d": 2, "q": "A neutropenic patient has a temperature of 38.3 °C. The priority is:", "o": ["Notify the doctor immediately for urgent assessment and antibiotics", "Give paracetamol and wait", "Tepid sponge", "Ignore"], "a": 0, "r": "Febrile neutropenia is an emergency."}, {"d": 2, "q": "A patient with chronic kidney disease has anaemia. Which therapy is commonly prescribed?", "o": ["Erythropoietin", "Heparin", "Furosemide", "Digoxin"], "a": 0, "r": "Kidneys produce less erythropoietin."}, {"d": 2, "q": "A patient with gout is advised to:", "o": ["Limit alcohol and purine-rich foods and increase fluids", "Eat more red meat", "Avoid fluids", "Take aspirin"], "a": 0, "r": "Diet and hydration reduce uric acid."}, {"d": 2, "q": "A patient with systemic lupus erythematosus should be advised to:", "o": ["Use sun protection", "Sunbathe", "Avoid medication", "Stop exercise"], "a": 0, "r": "UV exposure can trigger flares."}, {"d": 2, "q": "A patient in hospital develops a sudden, severe unilateral headache with neck stiffness and photophobia. The nurse suspects:", "o": ["Meningitis or subarachnoid haemorrhage", "Tension headache", "Migraine only", "Sinusitis"], "a": 0, "r": "Urgent medical review."}, {"d": 3, "q": "What is the normal fetal heart rate range?", "o": ["80–100 bpm", "110–160 bpm", "170–200 bpm", "60–80 bpm"], "a": 1, "r": "Normal FHR baseline is 110–160 bpm."}, {"d": 3, "q": "Which finding is a sign of preeclampsia?", "o": ["BP ≥140/90 with proteinuria after 20 weeks", "Low blood pressure", "Hyperglycemia only", "Vaginal spotting at 8 weeks"], "a": 0, "r": "Hypertension plus proteinuria (or end-organ signs) after 20 weeks gestation."}, {"d": 3, "q": "The drug of choice to prevent seizures in severe preeclampsia is:", "o": ["Magnesium sulfate", "Diazepam", "Phenytoin", "Labetalol"], "a": 0, "r": "Magnesium sulfate is the anticonvulsant of choice."}, {"d": 3, "q": "Which finding indicates magnesium sulfate toxicity?", "o": ["Absent deep tendon reflexes", "Brisk reflexes", "Tachypnea", "Increased urine output"], "a": 0, "r": "Loss of patellar reflex, RR <12, oliguria; antidote is calcium gluconate."}, {"d": 3, "q": "The antidote for magnesium sulfate toxicity is:", "o": ["Calcium gluconate", "Protamine sulfate", "Naloxone", "Vitamin K"], "a": 0, "r": "Calcium gluconate 10% IV reverses magnesium toxicity."}, {"d": 3, "q": "Late decelerations on the fetal monitor indicate:", "o": ["Uteroplacental insufficiency", "Head compression", "Cord compression", "Normal labor"], "a": 0, "r": "Late decels (after contraction peak) reflect uteroplacental insufficiency; turn left lateral, O2, stop oxytocin."}, {"d": 3, "q": "Variable decelerations are usually caused by:", "o": ["Umbilical cord compression", "Head compression", "Uteroplacental insufficiency", "Maternal fever"], "a": 0, "r": "Abrupt V- or U-shaped drops: cord compression; reposition the mother."}, {"d": 3, "q": "A woman at 34 weeks reports painless bright red vaginal bleeding. The nurse suspects:", "o": ["Placenta previa", "Abruptio placentae", "Preterm labor", "Ectopic pregnancy"], "a": 0, "r": "Painless bright red bleeding in the third trimester suggests placenta previa; no vaginal exam."}, {"d": 3, "q": "Which finding suggests abruptio placentae?", "o": ["Painful dark red bleeding with a rigid board-like uterus", "Painless bright red bleeding", "Mucus show", "Clear fluid leakage"], "a": 0, "r": "Premature separation: abdominal pain, tender rigid uterus, dark bleeding."}, {"d": 3, "q": "The nurse should NOT perform which action for suspected placenta previa?", "o": ["Digital vaginal examination", "Monitor vital signs", "Assess fetal heart tones", "Start IV access"], "a": 0, "r": "Digital exam can provoke catastrophic hemorrhage."}, {"d": 3, "q": "Which hormone is responsible for milk ejection (let-down)?", "o": ["Oxytocin", "Prolactin", "Estrogen", "Progesterone"], "a": 0, "r": "Oxytocin causes ejection; prolactin produces milk."}, {"d": 3, "q": "The first stage of labor ends when:", "o": ["Cervix is fully dilated (10 cm)", "The baby is born", "Placenta is delivered", "Contractions begin"], "a": 0, "r": "Stage 1: onset of labor to full dilation; stage 2: full dilation to birth; stage 3: placenta; stage 4: recovery."}, {"d": 3, "q": "Normal fundal height at 20 weeks of gestation is approximately at the:", "o": ["Umbilicus", "Symphysis pubis", "Xiphoid process", "Midway to the xiphoid"], "a": 0, "r": "At 20 weeks the fundus is at the umbilicus; after 24 weeks, cm ≈ weeks."}, {"d": 3, "q": "A postpartum client has a boggy uterus and heavy bleeding. The FIRST action is:", "o": ["Massage the fundus", "Apply cold pack to perineum", "Check blood glucose", "Encourage ambulation"], "a": 0, "r": "Uterine atony is the leading cause of PPH; fundal massage first."}, {"d": 3, "q": "Which medication is used first-line to treat postpartum hemorrhage due to atony?", "o": ["Oxytocin", "Magnesium sulfate", "Terbutaline", "Warfarin"], "a": 0, "r": "Oxytocin (with other uterotonics like methylergometrine, misoprostol) contracts the uterus."}, {"d": 3, "q": "Which of the following is contraindicated for a client with postpartum hypertension?", "o": ["Methylergonovine", "Oxytocin", "Labetalol", "Nifedipine"], "a": 0, "r": "Methylergonovine causes vasoconstriction and may raise BP."}, {"d": 3, "q": "Rh-negative mother with an Rh-positive newborn should receive Rh immunoglobulin within:", "o": ["72 hours", "7 days", "1 month", "6 months"], "a": 0, "r": "RhoGAM within 72 hours postpartum (and at 28 weeks)."}, {"d": 3, "q": "The APGAR score is assessed at:", "o": ["1 and 5 minutes after birth", "10 and 20 minutes", "30 minutes", "Once at 1 hour"], "a": 0, "r": "Scores at 1 and 5 minutes assess respiratory effort, HR, tone, reflex irritability, colour."}, {"d": 3, "q": "Which APGAR sign is scored from 0–2?", "o": ["Heart rate", "Weight", "Length", "Temperature"], "a": 0, "r": "Appearance, Pulse, Grimace, Activity, Respiration."}, {"d": 3, "q": "A newborn's normal heart rate is:", "o": ["120–160 bpm", "60–80 bpm", "180–220 bpm", "40–60 bpm"], "a": 0, "r": "Newborn HR 110–160 (about 120–160 awake)."}, {"d": 3, "q": "Which intervention helps prevent heat loss in a newborn?", "o": ["Dry immediately and place skin to skin / under warmer", "Bathe immediately", "Leave uncovered", "Place near a window"], "a": 0, "r": "Prevent hypothermia: dry, warm, skin-to-skin, hat."}, {"d": 3, "q": "The recommended exclusive breastfeeding duration is:", "o": ["6 months", "2 months", "3 months", "12 months"], "a": 0, "r": "WHO recommends exclusive breastfeeding for the first 6 months."}, {"d": 3, "q": "Which sign indicates effective breastfeeding latch?", "o": ["Audible swallowing and chin touching breast", "Cheek dimpling and clicking", "Nipple pain", "Baby falls asleep after 2 sucks"], "a": 0, "r": "Effective latch: wide-open mouth, rhythmic sucking, audible swallowing."}, {"d": 3, "q": "A mother at 8 weeks gestation has severe unilateral lower abdominal pain, spotting, and shoulder tip pain. The nurse suspects:", "o": ["Ruptured ectopic pregnancy", "Appendicitis only", "Cystitis", "Threatened abortion"], "a": 0, "r": "Ectopic: pain, bleeding, referred shoulder pain from diaphragmatic irritation—emergency."}, {"d": 3, "q": "Which vitamin supplement is recommended pre-conception to prevent neural tube defects?", "o": ["Folic acid", "Vitamin C", "Vitamin K", "Vitamin B12"], "a": 0, "r": "Folic acid 400 mcg daily (higher dose if high risk)."}, {"d": 3, "q": "Gestational diabetes is typically screened between:", "o": ["24–28 weeks", "6–8 weeks", "10–12 weeks", "36–40 weeks"], "a": 0, "r": "OGTT between 24 and 28 weeks (earlier if high risk)."}, {"d": 3, "q": "Which is a sign of true labor?", "o": ["Regular contractions with progressive cervical dilation", "Irregular contractions that stop with rest", "Pain only in the groin", "No cervical change"], "a": 0, "r": "True labor contractions are regular, increasing and cause cervical change."}, {"d": 3, "q": "Which maneuver is first when shoulder dystocia occurs?", "o": ["McRoberts maneuver", "Fundal pressure", "Episiotomy only", "Cesarean immediately without trying"], "a": 0, "r": "McRoberts (hyperflexion of thighs) with suprapubic pressure; avoid fundal pressure."}, {"d": 3, "q": "Umbilical cord prolapse is an emergency. The nurse should:", "o": ["Place the mother in knee–chest or Trendelenburg, relieve pressure manually, call for help", "Push the cord back and wait", "Encourage pushing", "Give oral fluids"], "a": 0, "r": "Relieve presenting part pressure on the cord and prepare for emergency delivery."}, {"d": 3, "q": "Which of the following is a normal postpartum finding on day 3?", "o": ["Lochia serosa pinkish-brown", "Bright red heavy lochia with clots", "Foul-smelling discharge", "Fever above 38.5 °C"], "a": 0, "r": "Lochia rubra (1–3 days), serosa (4–10), alba (10+). Foul smell/fever suggests infection."}, {"d": 3, "q": "A primigravida at 38 weeks arrives with regular contractions every 3 minutes and 4 cm cervical dilation. Which phase of labour is this?", "o": ["Active phase of first stage", "Latent phase", "Second stage", "Third stage"], "a": 0, "r": "4 cm or more with regular contractions marks active labour."}, {"d": 3, "q": "During labour the fetal heart rate baseline is 170 bpm for more than 10 minutes. The nurse should FIRST:", "o": ["Reposition the mother, check maternal temperature and notify the midwife or doctor", "Ignore", "Increase oxytocin", "Remove the monitor"], "a": 0, "r": "Fetal tachycardia can reflect maternal fever or fetal hypoxia."}, {"d": 3, "q": "A woman receiving oxytocin has contractions lasting 100 seconds with minimal rest and the fetal heart rate shows late decelerations. The nurse's FIRST action is to:", "o": ["Stop the oxytocin infusion", "Increase the infusion", "Wait", "Give analgesia"], "a": 0, "r": "Uterine hyperstimulation: stop oxytocin, turn left, give oxygen, notify."}, {"d": 3, "q": "Which finding indicates the placenta has separated in third stage of labour?", "o": ["Lengthening of the cord with a gush of blood and a rising firm uterus", "Severe pain", "Cord retraction", "Fever"], "a": 0, "r": "Signs of separation: gush of blood, cord lengthening, fundal rise."}, {"d": 3, "q": "A postpartum woman has a temperature of 38.6 °C, foul lochia and uterine tenderness on day 3. The nurse suspects:", "o": ["Endometritis", "Normal involution", "Mastitis", "Haemorrhoids"], "a": 0, "r": "Postpartum uterine infection; notify and obtain cultures."}, {"d": 3, "q": "A breastfeeding woman has a red, hot, painful wedge-shaped area on her breast with flu-like symptoms. The nurse advises:", "o": ["Continue feeding or expressing, apply warmth before and cold after, and seek medical care", "Stop breastfeeding", "Bind breasts", "Apply heat constantly"], "a": 0, "r": "Mastitis: keep milk flowing and treat as prescribed."}, {"d": 3, "q": "Which advice is correct for a pregnant woman with nausea in the first trimester?", "o": ["Eat small frequent meals and avoid triggers", "Fast", "Drink alcohol", "Stay in bed all day"], "a": 0, "r": "Small meals and dry carbohydrates reduce nausea."}, {"d": 3, "q": "A pregnant woman reports decreased fetal movements at 34 weeks. The nurse should advise:", "o": ["Attend for assessment promptly", "Wait until next appointment", "Eat chocolate and wait", "Ignore"], "a": 0, "r": "Reduced movements need same-day assessment."}, {"d": 3, "q": "Which is the MOST important danger sign in pregnancy requiring immediate attention?", "o": ["Heavy vaginal bleeding", "Heartburn", "Mild backache", "Frequent urination"], "a": 0, "r": "Bleeding can indicate placental or other emergency."}, {"d": 3, "q": "A woman at 30 weeks has BP 150/100 and severe headache and visual disturbance. The nurse expects:", "o": ["Urgent medical evaluation and likely magnesium sulfate and antihypertensive", "Paracetamol only", "Discharge", "Diet advice"], "a": 0, "r": "Severe preeclampsia features."}, {"d": 3, "q": "Which is a normal physiological change in pregnancy?", "o": ["Increased blood volume by about 40–50%", "Decreased heart rate", "Decreased renal blood flow", "Decreased cardiac output"], "a": 0, "r": "Blood volume expands, causing physiological anaemia of pregnancy."}, {"d": 3, "q": "A woman with gestational diabetes is taught to monitor:", "o": ["Blood glucose levels and diet", "Pulse only", "Weight only", "Urine colour"], "a": 0, "r": "Glycaemic control reduces fetal risks."}, {"d": 3, "q": "A newborn is born with a cord around the neck and is limp, not breathing, with heart rate of 50. The next step is:", "o": ["Start ventilation with a bag and mask", "Stimulate for 5 minutes", "Give oxygen blow-by", "Wait for APGAR"], "a": 0, "r": "HR below 60 or apnoea needs ventilation support."}, {"d": 3, "q": "Which is a normal newborn reflex finding?", "o": ["Moro reflex present", "Absent rooting", "No grasp reflex", "Absent suck"], "a": 0, "r": "Primitive reflexes are expected in newborns."}, {"d": 3, "q": "Jaundice appearing in the first 24 hours of life is:", "o": ["Pathological and needs urgent evaluation", "Always normal", "Harmless", "Needs no action"], "a": 0, "r": "Early jaundice suggests haemolysis; check bilirubin."}, {"d": 3, "q": "A newborn has a respiratory rate of 70/min with grunting and retractions. This indicates:", "o": ["Respiratory distress", "Normal breathing", "Sleep apnoea", "Hunger"], "a": 0, "r": "Normal RR is 30–60."}, {"d": 3, "q": "Which method of cord care is recommended for most newborns?", "o": ["Keep clean and dry and fold nappy below the cord", "Apply powders", "Cover tightly", "Apply alcohol routinely"], "a": 0, "r": "Dry cord care."}, {"d": 3, "q": "Kangaroo mother care is BEST described as:", "o": ["Skin-to-skin contact between mother and baby", "Swaddling", "Incubator care", "Bottle feeding"], "a": 0, "r": "Supports thermoregulation, bonding and breastfeeding."}, {"d": 3, "q": "A mother who is HIV positive in a country with safe formula options should be counselled according to:", "o": ["National guidelines on infant feeding and ART", "Never feeding", "Mixed feeding", "Random choices"], "a": 0, "r": "Follow national policy, ensuring ART and safe feeding."}, {"d": 3, "q": "Which contraceptive method is MOST effective for long-term reversible contraception?", "o": ["Intrauterine device or implant", "Condom", "Withdrawal", "Calendar method"], "a": 0, "r": "LARC has the lowest failure rate."}, {"d": 3, "q": "A woman using an intrauterine device reports severe lower abdominal pain, fever and foul discharge. The nurse should:", "o": ["Refer urgently for assessment of pelvic infection", "Reassure", "Remove her own device", "Wait a month"], "a": 0, "r": "Possible pelvic inflammatory disease."}, {"d": 3, "q": "Rubella vaccination is contraindicated:", "o": ["During pregnancy", "After birth", "In childhood", "In adolescents"], "a": 0, "r": "Live vaccine; avoid pregnancy for 1 month after."}, {"d": 3, "q": "A woman has a postpartum haemorrhage with a firm uterus. The likely cause is:", "o": ["Genital tract trauma", "Uterine atony", "Retained fluid", "Normal lochia"], "a": 0, "r": "Bleeding with firm contracted uterus suggests laceration."}, {"d": 3, "q": "Which is the BEST position for a woman during second stage if she has no preference and good progress?", "o": ["Upright or lateral position of her choice", "Supine flat only", "Lithotomy compulsory", "Prone"], "a": 0, "r": "Upright positions can aid progress."}, {"d": 3, "q": "A mother asks when to start solid foods. The nurse should say:", "o": ["Around 6 months while continuing breastfeeding", "At 1 month", "At 2 months", "At 12 months"], "a": 0, "r": "WHO recommends complementary feeding from 6 months."}, {"d": 3, "q": "A pregnant woman asks about alcohol use. The nurse states:", "o": ["No safe amount is known; avoid alcohol", "One glass is fine", "Wine is fine", "Only beer is fine"], "a": 0, "r": "Alcohol can cause fetal alcohol spectrum disorder."}, {"d": 3, "q": "Which test is used to screen for Down syndrome in the first trimester?", "o": ["Nuchal translucency scan with blood markers", "Glucose test", "Urine culture", "Hb test"], "a": 0, "r": "Combined first-trimester screening."}, {"d": 3, "q": "A woman with a previous caesarean section asks about vaginal birth. The nurse explains:", "o": ["Many women can attempt vaginal birth after caesarean after counselling and assessment", "It is never possible", "It is always required", "It is unsafe for all"], "a": 0, "r": "VBAC depends on risk assessment."}, {"d": 3, "q": "Which sign suggests ruptured membranes?", "o": ["Continuous clear fluid leaking from the vagina", "Mucus plug only", "Bloody show only", "Urine leak only"], "a": 0, "r": "Check colour, odour and fetal status."}, {"d": 3, "q": "A woman post-caesarean has not voided in 8 hours and has a palpable bladder. The nurse should:", "o": ["Encourage voiding and notify if unable, as catheterisation may be needed", "Ignore", "Restrict fluids", "Apply heat to abdomen only"], "a": 0, "r": "Bladder distension can cause atony and bleeding."}, {"d": 3, "q": "Postnatal depression screening is most appropriate:", "o": ["At postnatal visits using a validated tool", "Only once in pregnancy", "Never", "Only for first-time mothers"], "a": 0, "r": "Screen and support."}, {"d": 4, "q": "At what age can most infants sit without support?", "o": ["6 months", "2 months", "10 months", "12 months"], "a": 0, "r": "Sits alone about 6–8 months."}, {"d": 4, "q": "At what age do most children begin to walk independently?", "o": ["12–15 months", "6 months", "9 months", "24 months"], "a": 0, "r": "Independent walking around 12 months (range up to 15–18)."}, {"d": 4, "q": "Which is the correct site for IM injection in an infant under 12 months?", "o": ["Vastus lateralis", "Deltoid", "Dorsogluteal", "Ventrogluteal only"], "a": 0, "r": "The vastus lateralis is the preferred site in infants."}, {"d": 4, "q": "A child with epiglottitis should NOT have which action performed?", "o": ["Throat examination with a tongue depressor", "Humidified oxygen", "Keeping the child calm", "Preparing for airway intervention"], "a": 0, "r": "Examining the throat can trigger complete airway obstruction."}, {"d": 4, "q": "Classic signs of epiglottitis include:", "o": ["Drooling, tripod position, muffled voice", "Barking cough", "Wheezing only", "Gradual cough"], "a": 0, "r": "The 4 Ds: drooling, dysphagia, dysphonia, distress."}, {"d": 4, "q": "A child with croup typically has:", "o": ["Barking cough and inspiratory stridor", "Drooling", "High fever 40 °C and toxic look", "Expiratory wheeze only"], "a": 0, "r": "Croup (laryngotracheobronchitis): barking cough, stridor; treat with dexamethasone, humidified air."}, {"d": 4, "q": "Which immunization is given at birth in many national schedules?", "o": ["BCG and hepatitis B", "MMR", "Varicella", "HPV"], "a": 0, "r": "BCG and Hep B (birth dose); OPV in many programs."}, {"d": 4, "q": "MMR vaccine is generally first given at:", "o": ["12–15 months", "2 months", "Birth", "5 years"], "a": 0, "r": "First MMR dose typically at 12–15 months (earlier in outbreak settings)."}, {"d": 4, "q": "Which is a classic sign of dehydration in an infant?", "o": ["Sunken anterior fontanelle", "Bulging fontanelle", "Wet diapers increased", "Moist mucosa"], "a": 0, "r": "Sunken fontanelle, dry mucosa, decreased tears/urine."}, {"d": 4, "q": "A bulging anterior fontanelle in an infant suggests:", "o": ["Increased intracranial pressure", "Dehydration", "Normal finding in sleep", "Malnutrition"], "a": 0, "r": "Bulging indicates raised ICP (e.g., meningitis); may also be normal when crying."}, {"d": 4, "q": "Oral rehydration solution is the first-line therapy for:", "o": ["Mild-to-moderate dehydration from gastroenteritis", "Severe shock", "Head injury", "Fractures"], "a": 0, "r": "ORS is preferred when the child can drink."}, {"d": 4, "q": "Which finding suggests pyloric stenosis?", "o": ["Projectile non-bilious vomiting and olive-shaped mass", "Bilious vomiting", "Currant jelly stool", "Barking cough"], "a": 0, "r": "Hypertrophic pyloric stenosis presents with projectile vomiting at 3–6 weeks."}, {"d": 4, "q": "Currant-jelly stool with colicky abdominal pain in an infant suggests:", "o": ["Intussusception", "Pyloric stenosis", "Appendicitis", "Hirschsprung disease"], "a": 0, "r": "Intussusception: intermittent severe pain, sausage-shaped mass, currant jelly stool."}, {"d": 4, "q": "Which is the most common cause of bronchiolitis in infants?", "o": ["Respiratory syncytial virus (RSV)", "Staphylococcus aureus", "Streptococcus pneumoniae", "Influenza B only"], "a": 0, "r": "RSV is the leading cause; management is supportive (oxygen, hydration)."}, {"d": 4, "q": "A child with Kawasaki disease is at risk of:", "o": ["Coronary artery aneurysm", "Renal failure", "Hearing loss", "Seizures only"], "a": 0, "r": "Treat with IV immunoglobulin and aspirin."}, {"d": 4, "q": "A child with suspected sickle cell crisis should receive:", "o": ["Hydration, oxygen, and analgesia", "Fluid restriction", "Cold compresses", "Strenuous exercise"], "a": 0, "r": "Hydration, pain control, oxygen if hypoxic; avoid cold and dehydration."}, {"d": 4, "q": "Which finding is most concerning in an infant with fever?", "o": ["Temperature 38.5 °C in a 6-week-old infant", "Temperature 38.0 °C in a 5-year-old, playful", "Mild runny nose", "Slight cough"], "a": 0, "r": "Fever in infants under 3 months is an emergency needing a full sepsis workup."}, {"d": 4, "q": "Safe sleeping position for infants to reduce SIDS is:", "o": ["Supine (on the back)", "Prone", "Side", "Sitting"], "a": 0, "r": "Back to sleep on a firm mattress with no loose bedding."}, {"d": 4, "q": "The correct method to measure a child's weight for drug dose calculation is:", "o": ["Weigh in kilograms and calculate mg/kg", "Estimate by age only", "Use adult dosing", "Use height only"], "a": 0, "r": "Pediatric doses are weight-based."}, {"d": 4, "q": "A 10 kg child is ordered paracetamol 15 mg/kg. How many mg per dose?", "o": ["150 mg", "15 mg", "100 mg", "250 mg"], "a": 0, "r": "10 × 15 = 150 mg."}, {"d": 4, "q": "Which of the following is a sign of child abuse that requires reporting?", "o": ["Injuries inconsistent with the history provided", "Bruised shins from playing", "Scraped knee from a fall", "Teething"], "a": 0, "r": "Inconsistent history, multiple healing injuries or patterned bruises should prompt child-protection referral."}, {"d": 4, "q": "What is the priority for a child with suspected foreign body airway obstruction who cannot cough or speak?", "o": ["Perform age-appropriate back blows/abdominal thrusts", "Offer water", "Perform blind finger sweep", "Place the child supine and wait"], "a": 0, "r": "Severe obstruction: back blows & chest thrusts (infant), abdominal thrusts (child >1 year)."}, {"d": 4, "q": "Which is the BEST toy for a hospitalized toddler?", "o": ["Large, soft, safe toys without small parts", "Marbles", "Small beads", "Balloons"], "a": 0, "r": "Avoid small parts and balloons to prevent aspiration."}, {"d": 4, "q": "According to Erikson, the developmental task of a school-age child is:", "o": ["Industry vs inferiority", "Trust vs mistrust", "Autonomy vs shame", "Identity vs role confusion"], "a": 0, "r": "School age: industry vs inferiority."}, {"d": 4, "q": "Separation anxiety is most prominent in:", "o": ["Infants and toddlers (6 months–3 years)", "School-age children", "Adolescents", "Adults"], "a": 0, "r": "Peak around 8–18 months, can continue in toddlerhood."}, {"d": 4, "q": "Which sign indicates respiratory distress in an infant?", "o": ["Nasal flaring and chest retractions", "Normal pink skin", "Regular breathing 30/min", "Quiet sleeping"], "a": 0, "r": "Flaring, grunting, retractions, tachypnea."}, {"d": 4, "q": "A child with cystic fibrosis should receive pancreatic enzymes:", "o": ["With meals and snacks", "At bedtime only", "Once weekly", "Only when sick"], "a": 0, "r": "Enzymes are taken with food to aid digestion."}, {"d": 4, "q": "Which condition is characterized by a positive Ortolani/Barlow test?", "o": ["Developmental dysplasia of the hip", "Clubfoot", "Scoliosis", "Torticollis"], "a": 0, "r": "Tests evaluate hip instability in newborns."}, {"d": 4, "q": "The recommended first complementary foods are introduced at about:", "o": ["6 months", "2 months", "3 months", "10 months"], "a": 0, "r": "Complementary feeding starts around 6 months while continuing breastfeeding."}, {"d": 4, "q": "A child with nephrotic syndrome typically presents with:", "o": ["Periorbital edema and heavy proteinuria", "Gross hematuria and hypertension only", "Dysuria only", "Dehydration"], "a": 0, "r": "Nephrotic: proteinuria, hypoalbuminemia, edema, hyperlipidemia."}, {"d": 4, "q": "A mother brings her 8-month-old with 2 days of watery diarrhoea. The infant has sunken eyes, drinks eagerly and has skin pinch returning slowly. This is:", "o": ["Some dehydration", "No dehydration", "Severe dehydration with shock", "Normal"], "a": 0, "r": "Sunken eyes, thirst and slow pinch indicate some dehydration; give ORS."}, {"d": 4, "q": "Which sign indicates SEVERE dehydration in a child?", "o": ["Lethargy, unable to drink and very slow skin pinch", "Thirst and restlessness", "Slightly dry mouth", "Normal urine output"], "a": 0, "r": "Severe dehydration needs urgent IV fluids."}, {"d": 4, "q": "A 3-year-old has stridor at rest after a barking cough. The nurse's best initial action is:", "o": ["Keep the child calm and upright and call for senior help", "Examine the throat", "Lay flat", "Separate from parent"], "a": 0, "r": "Agitation worsens stridor; avoid distress."}, {"d": 4, "q": "Which finding is MOST concerning in a child with asthma?", "o": ["Unable to speak full sentences and drowsy", "Mild cough", "Occasional wheeze", "Playing"], "a": 0, "r": "Drowsiness and inability to speak show severe/life-threatening asthma."}, {"d": 4, "q": "A child with measles is admitted. Which precaution is needed?", "o": ["Airborne", "Contact", "Standard only", "Droplet"], "a": 0, "r": "Measles spreads by aerosol."}, {"d": 4, "q": "Which vitamin should be given to children with measles as per WHO guidance?", "o": ["Vitamin A", "Vitamin K", "Vitamin D", "Vitamin B6"], "a": 0, "r": "Vitamin A reduces complications and mortality."}, {"d": 4, "q": "A child with chickenpox should avoid which medicine?", "o": ["Aspirin", "Paracetamol", "Calamine", "Oral fluids"], "a": 0, "r": "Aspirin risk of Reye syndrome."}, {"d": 4, "q": "A 2-year-old with fever 39.5 °C has a febrile seizure lasting 1 minute and now is alert. Which advice is correct for parents?", "o": ["Febrile seizures are usually benign; seek medical review and keep child safe during seizures", "Place a spoon in the mouth", "Cold bath always", "Ignore fever"], "a": 0, "r": "Safe positioning, time seizure, call for help if >5 minutes."}, {"d": 4, "q": "A child with nephrotic syndrome has severe oedema. The best diet is:", "o": ["Low salt with adequate protein", "High salt", "Fluid overload", "High fat"], "a": 0, "r": "Restrict salt; fluids as ordered."}, {"d": 4, "q": "A child with type 1 diabetes goes to a birthday party. The best advice is:", "o": ["Match insulin to meals and carry fast-acting glucose", "Skip insulin", "Avoid parties", "Stop monitoring"], "a": 0, "r": "Plan and carry rapid glucose."}, {"d": 4, "q": "A school nurse sees a child with a peanut allergy collapsing with wheeze and swelling after lunch. The FIRST action is:", "o": ["Give intramuscular adrenaline (epinephrine) auto-injector and call emergency services", "Give antihistamine only", "Give water", "Wait"], "a": 0, "r": "Anaphylaxis requires immediate adrenaline."}, {"d": 4, "q": "Which immunisation is given at 2, 4 and 6 months in many programmes?", "o": ["DTP-HepB-Hib (pentavalent)", "MMR", "BCG", "Varicella"], "a": 0, "r": "Primary series for infants."}, {"d": 4, "q": "Which sign suggests a congenital heart defect in a newborn?", "o": ["Cyanosis and poor feeding with sweating", "Hiccups", "Sneezing", "Smiling"], "a": 0, "r": "Needs urgent evaluation."}, {"d": 4, "q": "A child with cerebral palsy has difficulty swallowing. The nurse should:", "o": ["Position upright for feeding and refer to a speech therapist", "Feed lying down", "Force feed", "Restrict fluids"], "a": 0, "r": "Aspiration risk."}, {"d": 4, "q": "A 14-year-old shows signs of depression and says she feels hopeless. The nurse should:", "o": ["Assess suicide risk directly and involve family and mental health services", "Ignore", "Tell her to cheer up", "Wait"], "a": 0, "r": "Adolescent mental health needs prompt assessment."}, {"d": 4, "q": "A toddler is brought with a sudden onset of drooling, refusal to swallow after playing with small objects. The nurse suspects:", "o": ["Foreign body ingestion", "Teething", "Flu", "Hunger"], "a": 0, "r": "Button batteries and magnets are emergencies."}, {"d": 4, "q": "Which action is correct for a nurse administering oral medication to a toddler?", "o": ["Give small amounts at a time, praise, and never call it candy", "Force into mouth lying down", "Mix in full bottle", "Say it is sweets"], "a": 0, "r": "Never mislead children about medicine."}, {"d": 4, "q": "Which finding is a danger sign in a young child under IMCI?", "o": ["Unable to drink or breastfeed", "Mild runny nose", "Occasional cough", "Playing"], "a": 0, "r": "General danger signs: unable to drink, vomits everything, convulsions, lethargy."}, {"d": 4, "q": "A child's weight is below the third centile and falling. This is:", "o": ["Faltering growth needing evaluation", "Normal", "Obesity", "Rapid growth"], "a": 0, "r": "Assess nutrition and underlying illness."}, {"d": 4, "q": "Which is the MOST appropriate play for a 10-year-old hospitalised child?", "o": ["Board games and group activity", "Rattles", "Mobile", "Teething toys"], "a": 0, "r": "School-age children enjoy rule-based games."}, {"d": 4, "q": "A teenager with scoliosis will wear a brace. Which advice is correct?", "o": ["Wear as prescribed and do skin checks", "Wear only at night when comfortable", "Avoid exercise", "Remove brace always"], "a": 0, "r": "Adherence and skin care."}, {"d": 4, "q": "A child is prescribed antibiotics for ear infection and is better after 3 days. The nurse tells parents to:", "o": ["Complete the full course", "Stop now", "Save leftovers", "Share"], "a": 0, "r": "Completing the course prevents resistance and relapse."}, {"d": 4, "q": "Which finding is expected in a child with iron-deficiency anaemia?", "o": ["Pallor and fatigue", "Jaundice", "Bounding pulses", "Cyanosis"], "a": 0, "r": "Pallor, tiredness, irritability."}, {"d": 4, "q": "A baby shows signs of shaken baby syndrome. Which finding is typical?", "o": ["Retinal haemorrhages and altered consciousness", "Normal exam", "Cough", "Nappy rash"], "a": 0, "r": "Suspect abuse; ensure safety and report."}, {"d": 4, "q": "Which action is correct when a parent refuses a necessary blood transfusion for a child on religious grounds?", "o": ["Follow hospital policy and legal pathways, and inform senior staff", "Give anyway without consulting", "Ignore", "Discharge"], "a": 0, "r": "Seek ethical/legal guidance."}, {"d": 4, "q": "A nurse is teaching parents how to prevent drowning. The best advice is:", "o": ["Never leave children alone near water", "Teach swim at 5", "Use armbands as sole safety", "Allow older sibling supervision alone"], "a": 0, "r": "Constant adult supervision."}, {"d": 4, "q": "A child with otitis media has a bulging, red tympanic membrane. The most common symptom is:", "o": ["Ear pain and fever", "Sore knees", "Rash", "Cough only"], "a": 0, "r": "Pain, irritability, fever."}, {"d": 4, "q": "A 6-year-old has a UTI. Which advice is BEST to prevent recurrence?", "o": ["Encourage fluids and good perineal hygiene front to back", "Bubble baths", "Restrict fluids", "Holding urine"], "a": 0, "r": "Hygiene and hydration."}, {"d": 4, "q": "A child with sickle cell disease should receive which immunisation priority?", "o": ["Pneumococcal and other recommended vaccines", "None", "Only measles", "Only BCG"], "a": 0, "r": "Higher risk of encapsulated organisms."}, {"d": 4, "q": "A school asks how to manage head lice. The nurse advises:", "o": ["Treat with a recommended lotion, comb out nits and check contacts", "Shave all children", "Exclude for a month", "Use petrol"], "a": 0, "r": "Appropriate treatment and contact checking."}, {"d": 5, "q": "A client expressing suicidal thoughts should be asked:", "o": ["Directly about whether they have a plan", "To promise not to hurt themselves before anything else", "About the weather", "Nothing; avoid the topic"], "a": 0, "r": "Direct questions do not increase risk; assess plan, means and intent, and ensure safety."}, {"d": 5, "q": "Which is the priority intervention for a client with active suicidal ideation and a plan?", "o": ["Ensure safety with close observation (e.g., 1:1)", "Discharge with family", "Give a pamphlet", "Encourage journaling only"], "a": 0, "r": "Safety first."}, {"d": 5, "q": "Which communication technique is therapeutic?", "o": ["Open-ended questions and active listening", "Giving advice", "Why questions", "Changing the subject"], "a": 0, "r": "Open-ended questions and reflection encourage expression; 'why' can seem accusatory."}, {"d": 5, "q": "A client says 'I hear voices telling me to hurt myself.' The nurse's best response is:", "o": ["'Tell me more about what the voices are saying.'", "'That is not real.'", "'You are fine.'", "'Ignore them.'"], "a": 0, "r": "Assess command hallucinations for risk; do not argue or reinforce."}, {"d": 5, "q": "Which medication class is first-line for schizophrenia?", "o": ["Antipsychotics", "Benzodiazepines", "SSRIs", "Stimulants"], "a": 0, "r": "Second-generation antipsychotics are first-line."}, {"d": 5, "q": "A client taking haloperidol develops rigidity, fever 40 °C and confusion. The nurse suspects:", "o": ["Neuroleptic malignant syndrome", "Tardive dyskinesia", "Serotonin syndrome", "Lithium toxicity"], "a": 0, "r": "NMS is a medical emergency: stop the drug, supportive care, cool the patient."}, {"d": 5, "q": "Which finding is expected in serotonin syndrome?", "o": ["Hyperthermia, agitation, clonus", "Hypothermia", "Bradycardia", "Sedation only"], "a": 0, "r": "Serotonin excess: autonomic instability, neuromuscular hyperactivity, mental status changes."}, {"d": 5, "q": "Typical SSRIs such as fluoxetine take how long for full effect?", "o": ["2–4 weeks or more", "1 hour", "1 day", "Immediately"], "a": 0, "r": "Antidepressants need 2–6 weeks for full effect."}, {"d": 5, "q": "A client taking an MAOI should avoid:", "o": ["Tyramine-rich foods (aged cheese, cured meats)", "Fruits", "Water", "Rice"], "a": 0, "r": "Tyramine can cause hypertensive crisis."}, {"d": 5, "q": "Which is a priority assessment for a client withdrawing from alcohol?", "o": ["Vital signs and CIWA scoring", "Diet preferences", "Hobbies", "Family history only"], "a": 0, "r": "Monitor for delirium tremens; use CIWA-Ar; benzodiazepines are treatment."}, {"d": 5, "q": "Delirium tremens typically occurs:", "o": ["48–96 hours after the last drink", "Within 1 hour", "After 2 weeks", "Never"], "a": 0, "r": "DTs onset 2–4 days after cessation; life-threatening."}, {"d": 5, "q": "Which vitamin is given to alcohol-dependent clients to prevent Wernicke's encephalopathy?", "o": ["Thiamine (B1)", "Vitamin C", "Vitamin D", "Vitamin A"], "a": 0, "r": "Give thiamine before glucose."}, {"d": 5, "q": "A client in a manic episode requires:", "o": ["Low stimulation environment and finger foods", "Group activities", "Competitive games", "Bright, loud room"], "a": 0, "r": "Reduce stimulation; high-calorie portable foods since they cannot sit."}, {"d": 5, "q": "Which defense mechanism is shown by a person who blames others for their own mistakes?", "o": ["Projection", "Denial", "Sublimation", "Regression"], "a": 0, "r": "Projection attributes own unacceptable feelings to others."}, {"d": 5, "q": "A patient unable to acknowledge a terminal diagnosis is using:", "o": ["Denial", "Rationalization", "Reaction formation", "Identification"], "a": 0, "r": "First stage in Kübler-Ross: denial."}, {"d": 5, "q": "Kübler-Ross stages of grief in order:", "o": ["Denial, anger, bargaining, depression, acceptance", "Acceptance, denial, anger, depression", "Anger, denial, acceptance, bargaining", "Bargaining, denial, acceptance, anger"], "a": 0, "r": "DABDA."}, {"d": 5, "q": "Which is a priority for a client in a panic attack?", "o": ["Stay with the client, use a calm voice and short sentences", "Leave the client alone", "Teach complex relaxation", "Ask about childhood"], "a": 0, "r": "Remain present, reduce stimuli, guide breathing."}, {"d": 5, "q": "The nurse should use restraint for an agitated patient only:", "o": ["When less restrictive measures fail and per policy with orders", "Routinely at night", "For staff convenience", "As punishment"], "a": 0, "r": "Restraint is a last resort requiring order, monitoring and documentation."}, {"d": 5, "q": "Which behavior is typical for anorexia nervosa?", "o": ["Intense fear of weight gain and distorted body image", "Binge eating with no compensation", "Normal BMI with overeating", "Obesity"], "a": 0, "r": "Restriction, BMI low, body image distortion; monitor electrolytes and refeeding syndrome."}, {"d": 5, "q": "A client with dementia becomes agitated in the late afternoon. This is known as:", "o": ["Sundowning", "Delirium", "Catatonia", "Psychosis"], "a": 0, "r": "Sundowning: increased confusion at dusk."}, {"d": 5, "q": "The best approach to a client with dementia who is disoriented is:", "o": ["Gentle reorientation with simple statements", "Arguing the facts", "Ignoring", "Rapid questions"], "a": 0, "r": "Use short, calm cues; avoid confrontation."}, {"d": 5, "q": "Which finding differentiates delirium from dementia?", "o": ["Acute onset with fluctuating course", "Gradual onset over years", "Stable alertness", "Preserved memory"], "a": 0, "r": "Delirium: acute, reversible, inattention; dementia: gradual and progressive."}, {"d": 5, "q": "The nurse's role after a violent patient attack on staff is to:", "o": ["Ensure safety, report per policy, and obtain support", "Ignore it", "Confront the patient angrily", "Resign"], "a": 0, "r": "Safety and incident reporting."}, {"d": 5, "q": "Boundary violation in the nurse–patient relationship includes:", "o": ["Accepting expensive gifts or socializing personally", "Setting limits", "Using the patient's name", "Explaining the role"], "a": 0, "r": "Maintain professional boundaries."}, {"d": 5, "q": "Which of the following is an example of a therapeutic response to a client who says 'Nobody cares about me'?", "o": ["'It sounds like you are feeling alone. Tell me more.'", "'Of course people care.'", "'Don't think that way.'", "'You are overreacting.'"], "a": 0, "r": "Reflection and exploration."}, {"d": 5, "q": "Which of the following is true regarding involuntary admission?", "o": ["It is based on danger to self/others or inability to care for self under legal criteria", "It can be done for any disagreement", "Nurses decide alone", "It never needs review"], "a": 0, "r": "Legal criteria and review are required."}, {"d": 5, "q": "The 'confidentiality' principle can be broken when:", "o": ["There is a risk of harm to the patient or others, or legal obligation", "A friend asks", "Curiosity", "Media request"], "a": 0, "r": "Duty to protect/report overrides confidentiality."}, {"d": 5, "q": "A client with obsessive-compulsive disorder performs hand washing for hours. The best nurse approach is:", "o": ["Allow limited time for rituals while gradually reducing and offering alternatives", "Forbid abruptly", "Join in", "Ignore the client"], "a": 0, "r": "Gradual exposure and response prevention under treatment plan."}, {"d": 5, "q": "Which is a sign of opioid withdrawal?", "o": ["Yawning, lacrimation, diarrhea, piloerection", "Constipation", "Pinpoint pupils", "Sedation"], "a": 0, "r": "Withdrawal: dilated pupils, GI upset, sweating; overdose: pinpoint pupils."}, {"d": 5, "q": "A client taking clozapine should have which laboratory test monitored regularly?", "o": ["Absolute neutrophil count (white cell count)", "HbA1c only", "Serum calcium", "Urine ketones"], "a": 0, "r": "Clozapine can cause agranulocytosis, so regular neutrophil monitoring is mandatory."}, {"d": 5, "q": "A patient says 'Everyone is trying to poison my food.' He refuses to eat. The BEST response is:", "o": ["'I understand you are frightened. I'll stay with you while you eat from a sealed tray.'", "'That's ridiculous.'", "'Nobody would poison you.'", "'You must eat now.'"], "a": 0, "r": "Acknowledge feelings, do not argue delusions, find practical solutions."}, {"d": 5, "q": "A nurse is caring for a patient with schizophrenia who has flat affect and poverty of speech. These are:", "o": ["Negative symptoms", "Positive symptoms", "Side effects only", "Signs of mania"], "a": 0, "r": "Negative symptoms reflect loss of normal function."}, {"d": 5, "q": "A patient on risperidone reports breast enlargement and amenorrhoea. The nurse recognises:", "o": ["Hyperprolactinaemia as a side effect", "Allergy", "Infection", "Pregnancy only"], "a": 0, "r": "Antipsychotics can raise prolactin."}, {"d": 5, "q": "Which sign is MOST suggestive of tardive dyskinesia?", "o": ["Involuntary lip smacking and tongue movements", "Acute stiffness", "Fever", "Sedation"], "a": 0, "r": "Late-onset involuntary movements from long-term antipsychotics."}, {"d": 5, "q": "A patient with acute dystonia after haloperidol has a rigid, twisted neck. The nurse expects the doctor to order:", "o": ["Anticholinergic such as benztropine", "More haloperidol", "Lithium", "Insulin"], "a": 0, "r": "Acute dystonia is treated with anticholinergics."}, {"d": 5, "q": "A patient with bipolar disorder takes lithium. Which instruction is important?", "o": ["Maintain consistent salt and fluid intake", "Restrict salt", "Skip blood tests", "Stop if thirsty"], "a": 0, "r": "Sodium depletion raises lithium levels."}, {"d": 5, "q": "A patient says, 'I can't go on; I want to end it tonight.' The nurse should FIRST:", "o": ["Stay with the patient, ensure safety and ask about the plan and means", "Leave to find a doctor alone", "Promise confidentiality", "Change topic"], "a": 0, "r": "Never leave the patient alone; assess risk."}, {"d": 5, "q": "Which is a protective factor against suicide?", "o": ["Strong social support", "Access to means", "Recent loss", "Substance use"], "a": 0, "r": "Connectedness is protective."}, {"d": 5, "q": "A client after a traumatic car accident has flashbacks, nightmares and avoidance for 3 months. This suggests:", "o": ["Post-traumatic stress disorder", "Generalised anxiety", "Mania", "Panic only"], "a": 0, "r": "Intrusion, avoidance, hyperarousal."}, {"d": 5, "q": "Which is a first-line pharmacological treatment for depression?", "o": ["SSRI", "Benzodiazepine alone", "Antipsychotic alone", "Stimulant"], "a": 0, "r": "SSRIs are first-line."}, {"d": 5, "q": "A client starting an SSRI is told to report:", "o": ["Worsening mood or suicidal thoughts early in treatment", "Increased appetite only", "Better sleep", "Dry eyes"], "a": 0, "r": "Risk of increased suicidality early in younger patients."}, {"d": 5, "q": "A patient with generalised anxiety disorder asks about long-term treatment. The nurse notes that benzodiazepines are usually:", "o": ["Used short term due to dependence", "Preferred for years", "Never effective", "Used to treat psychosis"], "a": 0, "r": "Risk of tolerance and dependence."}, {"d": 5, "q": "A patient experiencing a panic attack is hyperventilating. The best intervention is:", "o": ["Guide slow breathing in a calm environment", "Give paper bag always", "Leave alone", "Scold"], "a": 0, "r": "Calm, supportive coaching."}, {"d": 5, "q": "A patient with borderline personality disorder splits staff into 'good' and 'bad'. The best nursing approach is:", "o": ["Consistent team communication and clear boundaries", "Take sides", "Avoid the patient", "Give extra favours"], "a": 0, "r": "Consistency reduces splitting."}, {"d": 5, "q": "A patient with antisocial behaviour tries to manipulate the nurse into an exception. The nurse should:", "o": ["Apply limits consistently and professionally", "Give in", "Argue", "Share personal details"], "a": 0, "r": "Limit-setting."}, {"d": 5, "q": "A client with anorexia nervosa is being refed. Which complication is the nurse monitoring for?", "o": ["Refeeding syndrome with hypophosphataemia", "Hypertension", "Obesity", "Gout"], "a": 0, "r": "Monitor phosphate, potassium, magnesium."}, {"d": 5, "q": "A client with bulimia nervosa is likely to have which finding?", "o": ["Dental erosion and electrolyte imbalance", "Severe underweight always", "Absent appetite", "High bone density"], "a": 0, "r": "Purging causes erosion and hypokalaemia."}, {"d": 5, "q": "A patient with alcohol dependence has tremor, sweating and anxiety 12 hours after the last drink. The nurse should:", "o": ["Assess using withdrawal scale and notify the doctor", "Give alcohol", "Discharge", "Ignore"], "a": 0, "r": "Early withdrawal can progress to seizures and DTs."}, {"d": 5, "q": "A patient is brought in after heroin overdose with respiratory rate of 6/min and pinpoint pupils. The priority is:", "o": ["Support breathing and give naloxone", "Give flumazenil", "Give oral water", "Observe only"], "a": 0, "r": "Airway, breathing, naloxone."}, {"d": 5, "q": "Motivational interviewing is used to:", "o": ["Help patients resolve ambivalence about change", "Give orders", "Punish", "Diagnose"], "a": 0, "r": "Non-confrontational, collaborative approach."}, {"d": 5, "q": "A patient with dementia accuses the nurse of stealing. The best response is:", "o": ["'I can see you are worried. Let's look for it together.'", "'I did not take it.'", "'You are confused.'", "'Stop accusing me.'"], "a": 0, "r": "Respond to feelings and redirect."}, {"d": 5, "q": "A patient with delirium is likely to improve when the nurse:", "o": ["Treats the underlying cause and provides reorientation with glasses, clocks and familiar objects", "Restrains", "Gives sedatives routinely", "Moves the patient often"], "a": 0, "r": "Treat cause and support orientation."}, {"d": 5, "q": "A client with severe depression has not eaten or drunk for 2 days. Which treatment may be considered urgent?", "o": ["Electroconvulsive therapy", "Yoga", "Diet advice", "Discharge"], "a": 0, "r": "ECT is effective in severe, life-threatening depression."}, {"d": 5, "q": "After ECT the client is confused. The nurse should:", "o": ["Reorient, monitor vital signs and stay with the client", "Leave alone", "Encourage driving", "Give heavy meal"], "a": 0, "r": "Temporary confusion is common."}, {"d": 5, "q": "A patient is admitted involuntarily. Which right is maintained?", "o": ["Right to be informed of rights and treatment plan, and to appeal", "None", "Visitors banned", "Unlimited restraint"], "a": 0, "r": "Rights apply even when admitted involuntarily."}, {"d": 5, "q": "A nurse should document a patient's aggressive behaviour:", "o": ["Objectively with details of events, interventions and responses", "With opinions", "Without time", "Verbally only"], "a": 0, "r": "Objective, specific documentation."}, {"d": 5, "q": "De-escalation of an agitated patient begins with:", "o": ["Maintaining a calm voice, personal space and offering choices", "Standing very close", "Shouting", "Touching"], "a": 0, "r": "Use verbal de-escalation first."}, {"d": 5, "q": "A client is hearing voices telling her to harm others. The nurse should:", "o": ["Assess content and risk, ensure safety of all and inform the team", "Ignore", "Discuss only hobbies", "Isolate in dark room"], "a": 0, "r": "Command hallucinations require risk management."}, {"d": 5, "q": "A patient who is manic keeps interrupting groups. The best strategy is:", "o": ["Provide a quiet space with limited stimulation and short structured tasks", "Insist on groups", "Give extra stimulation", "Ignore"], "a": 0, "r": "Reduce stimulation."}, {"d": 5, "q": "A client with ADHD who takes methylphenidate should be monitored for:", "o": ["Appetite, growth, sleep and cardiovascular effects", "Hair colour", "Hearing", "Temperature only"], "a": 0, "r": "Stimulants suppress appetite and raise HR/BP."}, {"d": 6, "q": "Primary prevention includes:", "o": ["Immunization and health education", "Screening for early disease", "Rehabilitation", "Treatment of complications"], "a": 0, "r": "Primary: prevent disease; secondary: early detection; tertiary: reduce disability."}, {"d": 6, "q": "A mammography screening program is an example of:", "o": ["Secondary prevention", "Primary prevention", "Tertiary prevention", "Health promotion only"], "a": 0, "r": "Early detection."}, {"d": 6, "q": "Cardiac rehabilitation after MI is:", "o": ["Tertiary prevention", "Primary prevention", "Secondary prevention", "None"], "a": 0, "r": "Limits disability and prevents recurrence."}, {"d": 6, "q": "The 'cold chain' for vaccines refers to:", "o": ["Maintaining vaccines at the recommended temperature from manufacture to use", "Keeping vaccines frozen", "Using ice only", "Storing at room temperature"], "a": 0, "r": "Typically 2–8 °C for most vaccines."}, {"d": 6, "q": "Which is the best indicator of a community's health status?", "o": ["Infant mortality rate", "Number of hospitals", "Number of doctors", "Population density"], "a": 0, "r": "IMR reflects health, sanitation and care access."}, {"d": 6, "q": "Herd immunity occurs when:", "o": ["A high proportion of the population is immune, protecting the unvaccinated", "Everyone is infected", "Only children are vaccinated", "Only adults are vaccinated"], "a": 0, "r": "Reduces transmission."}, {"d": 6, "q": "The incubation period is the time between:", "o": ["Exposure and onset of symptoms", "Symptoms and recovery", "Diagnosis and treatment", "Infection and death"], "a": 0, "r": "Exposure to symptom onset."}, {"d": 6, "q": "Which disease is transmitted by the Aedes mosquito?", "o": ["Dengue", "Malaria", "Cholera", "Typhoid"], "a": 0, "r": "Aedes: dengue, Zika, chikungunya, yellow fever; Anopheles: malaria."}, {"d": 6, "q": "Which is the main route for transmission of hepatitis A?", "o": ["Fecal–oral", "Blood", "Airborne", "Sexual only"], "a": 0, "r": "Contaminated food or water."}, {"d": 6, "q": "Hepatitis B is mainly transmitted via:", "o": ["Blood and body fluids", "Food", "Mosquito", "Cough droplets"], "a": 0, "r": "Percutaneous, perinatal, sexual."}, {"d": 6, "q": "Safe drinking water treatment at household level includes:", "o": ["Boiling or chlorination", "Letting stand overnight", "Adding salt", "Cooling"], "a": 0, "r": "Boiling kills most pathogens."}, {"d": 6, "q": "Which is the best method for health education to a large community?", "o": ["Group sessions with visual aids and demonstration", "Single handout", "Whisper in corridor", "No education"], "a": 0, "r": "Use interactive, culturally appropriate methods."}, {"d": 6, "q": "The Ottawa Charter relates to:", "o": ["Health promotion", "Nursing ethics", "Immunization", "Drug regulation"], "a": 0, "r": "WHO 1986 health promotion framework."}, {"d": 6, "q": "Which BMI range is considered overweight (WHO)?", "o": ["25–29.9", "18.5–24.9", "30–34.9", "Below 18.5"], "a": 0, "r": "Normal 18.5–24.9; obese ≥30."}, {"d": 6, "q": "The recommended minimum physical activity for adults is about:", "o": ["150 minutes of moderate activity per week", "30 minutes per month", "5 minutes daily", "None"], "a": 0, "r": "WHO: 150–300 min moderate per week."}, {"d": 6, "q": "Which of these is a modifiable risk factor for cardiovascular disease?", "o": ["Smoking", "Age", "Gender", "Family history"], "a": 0, "r": "Lifestyle factors can be changed."}, {"d": 6, "q": "Which is the best method of contraception for dual protection against pregnancy and STIs?", "o": ["Condom", "Oral pill", "IUD", "Injectable"], "a": 0, "r": "Condoms protect against STIs; other methods do not."}, {"d": 6, "q": "A woman on combined oral contraceptives should be told to report:", "o": ["Severe leg pain/swelling or chest pain", "Mild nausea first month", "Regular periods", "Light spotting initially"], "a": 0, "r": "Warning signs of thromboembolism (ACHES)."}, {"d": 6, "q": "The correct step if a client misses one oral contraceptive pill is to:", "o": ["Take it as soon as remembered and continue the rest as scheduled", "Stop the pack", "Double the next dose for a week", "Wait for next cycle"], "a": 0, "r": "Follow manufacturer guidance; use backup if more than one is missed."}, {"d": 6, "q": "Which vaccine schedule applies to pregnant women?", "o": ["Tetanus toxoid (Tdap) and inactivated influenza", "MMR", "Varicella", "Live oral polio"], "a": 0, "r": "Live vaccines are contraindicated in pregnancy."}, {"d": 6, "q": "The most common cause of preventable blindness in children in developing countries is:", "o": ["Vitamin A deficiency", "Glaucoma", "Cataract congenital", "Retinopathy of prematurity"], "a": 0, "r": "Vitamin A deficiency; supplementation is a public-health program."}, {"d": 6, "q": "Which nutrient deficiency causes goiter?", "o": ["Iodine", "Iron", "Zinc", "Vitamin C"], "a": 0, "r": "Iodine deficiency."}, {"d": 6, "q": "The most common cause of anemia worldwide is:", "o": ["Iron deficiency", "Vitamin B12 deficiency", "Folate deficiency", "Sickle cell disease"], "a": 0, "r": "Iron deficiency."}, {"d": 6, "q": "Which is a sign of vitamin C deficiency?", "o": ["Bleeding gums, poor wound healing", "Night blindness", "Rickets", "Neuropathy only"], "a": 0, "r": "Scurvy."}, {"d": 6, "q": "Rickets is caused by deficiency of:", "o": ["Vitamin D", "Vitamin A", "Vitamin E", "Vitamin K"], "a": 0, "r": "Vitamin D/calcium deficiency affects bone mineralization."}, {"d": 6, "q": "Surveillance in epidemiology means:", "o": ["Continuous systematic collection and analysis of health data", "One-time survey", "Treatment only", "Drug trial"], "a": 0, "r": "Ongoing data for action."}, {"d": 6, "q": "Which is a key principle of primary health care?", "o": ["Community participation and equity", "Hospital-centered care only", "Private sector only", "Curative only"], "a": 0, "r": "Alma-Ata Declaration principles."}, {"d": 6, "q": "During a home visit, which is the priority?", "o": ["Ensure safety of the nurse and assess the patient's environment", "Check the mailbox", "Take photos", "Sell products"], "a": 0, "r": "Safety and holistic assessment."}, {"d": 6, "q": "A healthy elderly client asks about falls prevention at home. Best advice includes:", "o": ["Remove loose rugs, improve lighting, use grab bars", "Stay in bed", "Avoid exercise", "Wear loose slippers"], "a": 0, "r": "Environmental modification and strength/balance training."}, {"d": 6, "q": "Which is the correct description of a 'cluster' in epidemiology?", "o": ["Unusual aggregation of health events in time and place", "Single case", "Normal rate", "A vaccine batch"], "a": 0, "r": "Cluster investigation can reveal outbreaks."}, {"d": 6, "q": "An 82-year-old patient is admitted with pneumonia and has had a recent fall. Which is the MOST important aspect of care?", "o": ["Falls prevention, hydration and early mobilisation with supervision", "Strict bed rest", "Sedation at night", "Restraints"], "a": 0, "r": "Prevent complications of immobility while reducing fall risk."}, {"d": 6, "q": "Which change is expected in normal ageing of the cardiovascular system?", "o": ["Increased arterial stiffness and higher systolic BP", "Lower systolic BP", "Increased cardiac output", "Faster recovery of HR"], "a": 0, "r": "Arteries stiffen with age."}, {"d": 6, "q": "An older adult reports feeling dizzy on standing. The nurse suspects:", "o": ["Orthostatic hypotension", "Hypertension", "Fever", "Anaemia only"], "a": 0, "r": "Check lying and standing BP; review medicines."}, {"d": 6, "q": "Polypharmacy in older adults increases the risk of:", "o": ["Adverse drug reactions and falls", "Better outcomes", "Lower cost", "Fewer visits"], "a": 0, "r": "Regular medication reviews are important."}, {"d": 6, "q": "Which medicine class is most associated with falls in older adults?", "o": ["Benzodiazepines and sedatives", "Vitamins", "Paracetamol", "Calcium"], "a": 0, "r": "Sedatives impair balance."}, {"d": 6, "q": "The Beers Criteria are used to identify:", "o": ["Potentially inappropriate medications in older adults", "Sterile technique", "Nutrition scores", "Infection rates"], "a": 0, "r": "Used for safer prescribing."}, {"d": 6, "q": "A nurse suspects elder abuse after seeing unexplained bruises and a fearful patient. The nurse should:", "o": ["Report according to policy and ensure safety", "Ignore", "Confront family publicly", "Wait"], "a": 0, "r": "Duty to protect vulnerable adults."}, {"d": 6, "q": "Which is a sign of dehydration in an older adult?", "o": ["Confusion and dry tongue", "Increased skin elasticity", "High urine output", "Weight gain"], "a": 0, "r": "Skin turgor is unreliable; look at mucosa and mental state."}, {"d": 6, "q": "Which of the following is a normal finding of ageing?", "o": ["Reduced skin elasticity and thinning", "Sudden confusion", "Incontinence always", "Hallucinations"], "a": 0, "r": "Acute confusion is never normal."},
