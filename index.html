<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>OEN Nursing Mock Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single-column exam terminal. Top status bar, question pane, bottom nav bar; setup and results are plain panels. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --fg:#17202e; --muted:#5b6678; --line:#d3d9e2;
  --accent:#0b4f8a; --accent-fg:#ffffff; --bar:#0b3a63; --bar-fg:#ffffff;
  --good:#17803d; --good-bg:#e3f4ea; --bad:#b3261e; --bad-bg:#fbe6e4; --flag:#b86a00; --flag-bg:#fdf0d9; --sel:#e2eefa;
  --font:Arial,'Segoe UI',system-ui,-apple-system,Helvetica,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --panel:#171e29; --fg:#e6ebf2; --muted:#9aa6b8; --line:#2b3544; --accent:#6db0f0; --accent-fg:#08131f; --bar:#0a2742; --bar-fg:#e6ebf2;
  --good:#5fd08a; --good-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1916; --flag:#f0b34f; --flag-bg:#3a2b0f; --sel:#1b2c42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#171e29; --fg:#e6ebf2; --muted:#9aa6b8; --line:#2b3544; --accent:#6db0f0; --accent-fg:#08131f; --bar:#0a2742; --bar-fg:#e6ebf2;
  --good:#5fd08a; --good-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1916; --flag:#f0b34f; --flag-bg:#3a2b0f; --sel:#1b2c42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:920px;margin:0 auto;padding-block:20px 40px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.6rem;font-weight:600} h2{font-size:1.15rem;font-weight:600} h3{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:.85rem}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card:hover{border-color:var(--accent)} .card[aria-pressed="true"]{border-color:var(--accent);background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent)}
.card b{font-weight:600} .card span{font-size:.82rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:8px 14px}
.seg button:last-child{border-right:0} .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
/* exam */
.bar{background:var(--bar);color:var(--bar-fg);padding:10px 14px;border-radius:6px 6px 0 0;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.bar .t{font:500 1.05rem var(--mono);font-variant-numeric:tabular-nums}
.bar .t.low{color:#ffb4ab}
.bar .meta{font-size:.85rem;opacity:.9}
.qpane{background:var(--panel);border:1px solid var(--line);border-top:0;padding:22px 22px 18px;display:flex;flex-direction:column;gap:18px}
.qtext{font-size:1.1rem;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.opt:hover{border-color:var(--accent)}
.opt .k{font:500 .85rem var(--mono);min-width:1.6rem;height:1.6rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;flex:none;margin-top:1px}
.opt.sel{background:var(--sel);border-color:var(--accent)} .opt.sel .k{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.opt.ok{background:var(--good-bg);border-color:var(--good)} .opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt>span:last-child{min-width:0}
.fb{border-left:4px solid var(--good);background:var(--good-bg);padding:10px 14px;border-radius:0 4px 4px 0}
.fb.no{border-color:var(--bad);background:var(--bad-bg)}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:12px 16px}
.flagbtn[aria-pressed="true"]{background:var(--flag-bg);border-color:var(--flag);color:var(--flag)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.n{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:8px 0;font:500 .9rem var(--mono);position:relative;text-align:center}
.n.ans{background:var(--sel);border-color:var(--accent)} .n.flg::after{content:"";position:absolute;top:3px;right:3px;border:5px solid transparent;border-top-color:var(--flag);border-right-color:var(--flag)}
.n.cur{outline:3px solid var(--accent);outline-offset:1px}
.n.ok{background:var(--good-bg);border-color:var(--good)} .n.no{background:var(--bad-bg);border-color:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.score{font:600 3rem/1 var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:3px;font-weight:600;font-size:.85rem}
.pill.pass{background:var(--good-bg);color:var(--good)} .pill.fail{background:var(--bad-bg);color:var(--bad)}
.dom{display:grid;grid-template-columns:minmax(120px,220px) 1fr 56px;gap:10px;align-items:center;font-size:.9rem}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden} .fill{height:100%;background:var(--accent)} .fill.lo{background:var(--bad)}
.dom .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:560px){.dom{grid-template-columns:1fr 56px}.dom .track{grid-column:1/-1;order:3}.qpane{padding:16px}}
.rev{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem} th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left} th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
label{font-size:.85rem;color:var(--muted)}
input[type=number]{font:inherit;width:80px;padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.confirm{background:var(--flag-bg);border:1px solid var(--flag);border-radius:4px;padding:12px 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* Pearson VUE-style exam terminal */
.vue{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.vue .bar{border-radius:0;background:var(--bar)}
.vue .qpane{border:0}
.vue .nav{border:0;border-top:1px solid var(--line);border-radius:0;background:var(--bg)}
.subbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.clock{display:inline-flex;align-items:center;gap:8px}
.ico{background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--bar-fg);border-radius:3px;width:28px;height:26px;line-height:1}
.qn{background:rgba(255,255,255,.15);padding:3px 10px;border-radius:3px;font-weight:600;font-variant-numeric:tabular-nums}
.opt .k{width:1.15rem;height:1.15rem;min-width:1.15rem;border:2px solid var(--muted);border-radius:50%;display:block;margin-top:3px;background:transparent}
.opt.sel .k{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 45%,transparent 50%)}
.opt.ok .k{border-color:var(--good)} .opt.no .k{border-color:var(--bad)}
.opt{border-color:transparent;background:transparent;padding:8px 10px}
.opt:hover{background:var(--sel);border-color:transparent}
.opt.sel{background:var(--sel);border-color:transparent}
.notes{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.notes textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);resize:vertical}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;max-width:560px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.modalbox .scroll{overflow:auto}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--sel)} tr.cur td{font-weight:600}
td a{color:var(--accent);font-weight:600}
.endbtn{width:auto;padding:0 12px;font:600 .85rem var(--font);background:#b3261e;border-color:#b3261e;color:#fff}
.inst{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.btn[aria-pressed="true"]{border-color:var(--accent)}

/* Mobile */
@media(max-width:640px){
  body{font-size:16px}
  .wrap{padding-block:12px 28px}
  h1{font-size:1.35rem}
  .panel{padding:14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card{padding:12px}
  .card span{font-size:.78rem}
  .btn{min-height:44px;padding:10px 14px}
  .seg{display:flex;width:100%} .seg button{flex:1;min-height:44px;padding:8px 6px}
  #go{width:100%} .startrow{position:sticky;bottom:0;background:var(--panel);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-bottom:-4px;border-top:1px solid var(--line);z-index:5;flex-direction:column;align-items:stretch;text-align:center}
  .bar{padding:10px 12px;gap:6px}
  .bar .meta:first-child{flex-basis:100%;font-weight:600}
  .qpane{padding:14px 12px}
  .qtext{font-size:1.02rem}
  .opt{padding:12px 8px}
  .subbar{padding:8px 12px}
  .nav{position:sticky;bottom:0;z-index:6;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .nav>.row{display:contents}
  .nav .btn{padding:10px 4px;font-size:.88rem;white-space:nowrap;text-align:center}
  .nav>.btn{grid-column:span 2}
  .bar .row{width:100%;justify-content:space-between;flex-wrap:nowrap;gap:8px}
  .clock .meta{display:none}
  .endbtn{margin-left:auto;height:30px;white-space:nowrap}
  .modalbox{max-height:90vh}
  .score{font-size:2.4rem}
  .top{flex-direction:column}
}
</style>
<div class="wrap" id="app"></div>
<script>
const DOMAINS=["Principles of Care", "Evidence-Based Practice, Research and Epidemiology", "Adult Health", "Maternal Health", "Child Health", "Mental Health", "Community Health and Gerontology"];
const BANK=[{"d": 0, "q": "Which action should the nurse perform FIRST before administering any medication?", "o": ["Check the patient's wristband and verify identity using two identifiers", "Document the dose in the chart", "Ask the patient about allergies only", "Crush the tablet if it is large"], "a": 0, "r": "Patient identification with two identifiers is the first safety step; verifying allergies follows as part of the rights of administration."}, {"d": 0, "q": "A nurse is performing hand hygiene with an alcohol-based rub. How long should the rub be applied until hands are dry?", "o": ["5 seconds", "10 seconds", "20–30 seconds", "2 minutes"], "a": 2, "r": "WHO recommends 20–30 seconds of rubbing with alcohol-based hand rub until hands are dry."}, {"d": 0, "q": "Which of the following is an objective data finding?", "o": ["Patient states 'I feel dizzy'", "Patient reports nausea", "Blood pressure 90/60 mmHg", "Patient says pain is 8/10"], "a": 2, "r": "Objective data are observable/measurable (vital signs). Symptoms reported by the patient are subjective."}, {"d": 0, "q": "The correct order of the nursing process is:", "o": ["Assessment, diagnosis, planning, implementation, evaluation", "Diagnosis, assessment, implementation, planning, evaluation", "Planning, assessment, evaluation, diagnosis, implementation", "Assessment, implementation, diagnosis, planning, evaluation"], "a": 0, "r": "ADPIE: Assessment, Diagnosis, Planning, Implementation, Evaluation."}, {"d": 0, "q": "Which site is preferred for an intramuscular injection in an adult receiving 2 mL of medication?", "o": ["Deltoid", "Ventrogluteal", "Biceps", "Rectus femoris in the thigh of an infant"], "a": 1, "r": "The ventrogluteal site is the safest for adults, with thick muscle and few nerves/vessels; the deltoid is limited to about 1 mL."}, {"d": 0, "q": "A patient is on bed rest and at risk for pressure injury. Which intervention is MOST effective?", "o": ["Massage reddened bony prominences", "Reposition at least every 2 hours", "Use a donut-shaped cushion", "Keep the head of bed at 90° at all times"], "a": 1, "r": "Regular repositioning relieves pressure. Massage over reddened areas and donut devices are not recommended."}, {"d": 0, "q": "The normal adult respiratory rate at rest is:", "o": ["8–10 breaths/min", "12–20 breaths/min", "24–30 breaths/min", "30–40 breaths/min"], "a": 1, "r": "Normal adult RR is 12–20 breaths per minute."}, {"d": 0, "q": "Which finding indicates that a nasogastric tube is correctly positioned before feeding?", "o": ["Air heard on auscultation over the stomach", "Gastric aspirate with pH of 5.5 or less", "Patient able to speak", "No coughing during insertion"], "a": 1, "r": "Aspirate pH ≤5.5 (or X-ray confirmation) is the accepted method; the 'whoosh' test is unreliable."}, {"d": 0, "q": "A nurse is teaching a patient about proper body mechanics. Which statement shows understanding?", "o": ["'I will keep my feet close together when lifting.'", "'I will bend at the waist to lift heavy objects.'", "'I will keep the load close to my body and bend my knees.'", "'I will twist my back while turning with a load.'"], "a": 2, "r": "Use a wide base of support, bend the knees, keep the load close, avoid twisting."}, {"d": 0, "q": "Which type of precaution is required for a patient with active pulmonary tuberculosis?", "o": ["Contact", "Droplet", "Airborne", "Standard only"], "a": 2, "r": "TB is spread by airborne nuclei: negative-pressure room and N95/FFP2 respirator."}, {"d": 0, "q": "A patient has a Braden Scale score of 9. What does this indicate?", "o": ["Very high risk for pressure injury", "No risk", "Mild risk", "Moderate risk"], "a": 0, "r": "Braden ≤9 is very high risk (10–12 high, 13–14 moderate, 15–18 mild)."}, {"d": 0, "q": "When measuring blood pressure, a cuff that is too small will result in:", "o": ["A falsely low reading", "A falsely high reading", "An accurate reading", "An irregular reading"], "a": 1, "r": "A narrow cuff gives a falsely elevated BP reading."}, {"d": 0, "q": "The nurse observes a colleague preparing medication without checking the order. The BEST action is to:", "o": ["Ignore it as it is not your patient", "Speak to the colleague immediately and report if the practice continues or an error is likely", "Complete the task for them", "Document it in the patient's chart"], "a": 1, "r": "Patient safety requires intervening and escalating per policy."}, {"d": 0, "q": "Which of the following is the best indicator of adequate hydration in an adult?", "o": ["Dry mucous membranes", "Urine output of at least 0.5 mL/kg/hr", "Skin tenting", "Specific gravity 1.040"], "a": 1, "r": "Urine output ≥0.5 mL/kg/hr (≈30 mL/h) indicates adequate renal perfusion/hydration."}, {"d": 0, "q": "A nurse needs to give a patient 750 mL of IV fluid over 6 hours using tubing with a drop factor of 15 gtt/mL. What is the drip rate (gtt/min)?", "o": ["21", "31", "41", "52"], "a": 1, "r": "750 × 15 ÷ 360 min = 31.25 ≈ 31 gtt/min."}, {"d": 0, "q": "Which statement about informed consent is correct?", "o": ["The nurse obtains consent for a surgical procedure", "The physician explaining the procedure is responsible for obtaining consent; the nurse may witness the signature", "Consent is not needed for competent adults in elective surgery", "Consent can be signed after sedation"], "a": 1, "r": "The provider performing the procedure explains risks/benefits; the nurse witnesses and advocates."}, {"d": 0, "q": "Which position is BEST for a patient with dyspnea?", "o": ["Supine", "Trendelenburg", "High Fowler's", "Prone"], "a": 2, "r": "High Fowler's (60–90°) maximizes lung expansion."}, {"d": 0, "q": "A client has a stage 2 pressure injury. Which description is correct?", "o": ["Intact skin with non-blanchable erythema", "Partial-thickness skin loss with exposed dermis, shallow open ulcer", "Full-thickness loss with visible fat", "Full-thickness loss exposing muscle/bone"], "a": 1, "r": "Stage 1: non-blanchable redness; Stage 2: partial thickness; Stage 3: full thickness with fat; Stage 4: muscle/bone."}, {"d": 0, "q": "The nurse is documenting. Which entry is the MOST appropriate?", "o": ["'Patient seemed upset.'", "'Patient tearful, states \"I am scared of the surgery.\"'", "'Patient was uncooperative.'", "'Doing fine.'"], "a": 1, "r": "Documentation should be factual, objective, and include direct quotes where appropriate."}, {"d": 0, "q": "Which is the correct way to dispose of a used needle?", "o": ["Recap it using two hands", "Place it directly in a puncture-resistant sharps container without recapping", "Break it off before disposal", "Place it in a clinical waste bag"], "a": 1, "r": "Do not recap, bend or break needles; use a sharps container at the point of use."}, {"d": 0, "q": "A patient is receiving oxygen via nasal cannula at 2 L/min. The approximate FiO2 delivered is:", "o": ["24–28%", "50%", "60–70%", "90–100%"], "a": 0, "r": "Nasal cannula 1–6 L/min delivers roughly 24–44% FiO2 (about 4% per L)."}, {"d": 0, "q": "What is the first nursing action when a patient falls in the hallway?", "o": ["Help the patient stand up immediately", "Assess the patient for injuries before moving", "Complete the incident report", "Call the patient's family"], "a": 1, "r": "Assess first (airway, neurologic status, injuries) before moving; reporting follows."}, {"d": 0, "q": "Normal serum potassium range for adults is:", "o": ["2.5–3.5 mEq/L", "3.5–5.0 mEq/L", "5.5–6.5 mEq/L", "135–145 mEq/L"], "a": 1, "r": "K+ 3.5–5.0 mEq/L; 135–145 is sodium."}, {"d": 0, "q": "Which nursing diagnosis is a PRIORITY for an unconscious patient?", "o": ["Self-care deficit", "Ineffective airway clearance", "Social isolation", "Knowledge deficit"], "a": 1, "r": "Airway comes first (ABC)."}, {"d": 0, "q": "Which technique is used to assess the abdomen in the correct sequence?", "o": ["Inspection, palpation, percussion, auscultation", "Inspection, auscultation, percussion, palpation", "Auscultation, palpation, inspection, percussion", "Palpation, inspection, auscultation, percussion"], "a": 1, "r": "Auscultate before percussion and palpation so as not to alter bowel sounds."}, {"d": 0, "q": "A nurse is caring for a patient with a urinary catheter. Which action helps prevent CAUTI?", "o": ["Disconnect the system for routine irrigation", "Keep the drainage bag below the level of the bladder and off the floor", "Change the catheter daily", "Clamp the catheter regularly"], "a": 1, "r": "Keep a closed system and bag below bladder level to prevent backflow."}, {"d": 0, "q": "Which is the BEST method to verify a patient's understanding after teaching?", "o": ["Ask 'Do you understand?'", "Ask the patient to teach back the information", "Give written material", "Repeat the instructions louder"], "a": 1, "r": "Teach-back is the most reliable method for confirming understanding."}, {"d": 0, "q": "The 'rights' of medication administration include all EXCEPT:", "o": ["Right drug", "Right route", "Right insurance", "Right time"], "a": 2, "r": "The core rights: patient, drug, dose, route, time, documentation (plus reason, response, refusal)."}, {"d": 0, "q": "A patient asks to see their medical record. The nurse should:", "o": ["Refuse because records belong to the physician", "Follow facility policy and refer the request through the appropriate process", "Hand over the chart immediately", "Tell the patient it is confidential from them"], "a": 1, "r": "Patients have a right to access their records through the proper channel."}, {"d": 0, "q": "Which of the following is a sign of fluid volume deficit?", "o": ["Bounding pulse and edema", "Weight gain and crackles", "Tachycardia and decreased urine output", "Jugular vein distension"], "a": 2, "r": "Hypovolemia: tachycardia, hypotension, low urine output, poor skin turgor."}, {"d": 0, "q": "A nurse prepares to give digoxin. The apical pulse is 54 bpm. What should the nurse do?", "o": ["Give the dose as scheduled", "Hold the dose and notify the prescriber", "Double the dose", "Give half the dose"], "a": 1, "r": "Hold digoxin if the adult HR is below 60 and notify the prescriber."}, {"d": 0, "q": "The therapeutic range for digoxin is approximately:", "o": ["0.5–2.0 ng/mL", "3–5 ng/mL", "10–20 ng/mL", "0.01–0.1 ng/mL"], "a": 0, "r": "Typical therapeutic range 0.5–2.0 ng/mL (toxicity risk with hypokalemia)."}, {"d": 0, "q": "Which medication is the antidote for opioid overdose?", "o": ["Naloxone", "Flumazenil", "Atropine", "Acetylcysteine"], "a": 0, "r": "Naloxone is an opioid antagonist."}, {"d": 0, "q": "The antidote for paracetamol (acetaminophen) overdose is:", "o": ["Acetylcysteine", "Naloxone", "Vitamin K", "Protamine"], "a": 0, "r": "N-acetylcysteine replenishes glutathione to protect the liver."}, {"d": 0, "q": "Which instruction should be given to a patient taking an ACE inhibitor such as enalapril?", "o": ["Report persistent dry cough or facial swelling", "Take with potassium supplements", "Stop suddenly if dizzy", "Eat grapefruit regularly"], "a": 0, "r": "ACE inhibitors cause dry cough and, rarely, angioedema; avoid K supplements."}, {"d": 0, "q": "Which drug class is the first-line treatment for anaphylactic shock?", "o": ["Adrenergic agonist (epinephrine)", "Beta-blocker", "Calcium channel blocker", "Diuretic"], "a": 0, "r": "Epinephrine reverses bronchospasm and vasodilation."}, {"d": 0, "q": "A patient is taking metformin. Which should the nurse teach?", "o": ["Hold the drug before contrast studies and report lactic acidosis symptoms", "Take only when glucose is high", "Avoid all carbohydrates", "Increase alcohol intake"], "a": 0, "r": "Metformin carries a risk of lactic acidosis, especially with renal impairment/contrast."}, {"d": 0, "q": "Which of the following is a common side effect of statins that should be reported?", "o": ["Muscle pain or weakness", "Constipation only", "Hair loss", "Dry eyes"], "a": 0, "r": "Myopathy/rhabdomyolysis is a serious side effect; also monitor liver enzymes."}, {"d": 0, "q": "A patient receiving gentamicin should be monitored for:", "o": ["Ototoxicity and nephrotoxicity", "Hepatotoxicity only", "Photosensitivity", "Tooth discoloration"], "a": 0, "r": "Aminoglycosides cause kidney and eighth cranial nerve damage; monitor levels."}, {"d": 0, "q": "Which instruction is correct for a patient prescribed levothyroxine?", "o": ["Take on an empty stomach in the morning", "Take with antacids", "Take at bedtime with milk", "Stop when feeling better"], "a": 0, "r": "Levothyroxine absorbs best on an empty stomach, 30–60 min before breakfast."}, {"d": 0, "q": "Which sign would suggest lithium toxicity?", "o": ["Coarse tremors, vomiting, diarrhea, confusion", "Mild thirst only", "Increased appetite", "Normal serum level"], "a": 0, "r": "Toxicity signs: coarse tremor, GI upset, ataxia, confusion; therapeutic 0.6–1.2 mEq/L."}, {"d": 0, "q": "Which medication should NOT be given with grapefruit juice?", "o": ["Atorvastatin", "Paracetamol", "Vitamin C", "Furosemide"], "a": 0, "r": "Grapefruit inhibits CYP3A4, increasing statin levels."}, {"d": 0, "q": "A nurse is administering IV vancomycin. Which reaction can occur with a rapid infusion?", "o": ["Red man syndrome", "Stevens–Johnson syndrome", "Pseudomembranous colitis only", "Gray baby syndrome"], "a": 0, "r": "Rapid vancomycin infusion causes histamine release (flushing, hypotension)."}, {"d": 0, "q": "Which is the correct way to administer an enteric-coated tablet?", "o": ["Swallow whole without crushing", "Crush and mix with food", "Chew", "Dissolve in water"], "a": 0, "r": "Crushing destroys the enteric coating."}, {"d": 0, "q": "The nurse prepares insulin. Which statement is correct about mixing regular and NPH insulin in one syringe?", "o": ["Draw up regular (clear) first, then NPH (cloudy)", "Draw up NPH first", "Never mix", "Mix with saline first"], "a": 0, "r": "'Clear before cloudy' prevents contaminating the regular insulin vial."}, {"d": 0, "q": "Which of the following is the only insulin that may be given intravenously?", "o": ["Regular insulin", "NPH", "Glargine", "Isophane suspension"], "a": 0, "r": "Only regular (short-acting) insulin is administered by IV."}, {"d": 0, "q": "Which drug is used to reverse benzodiazepine overdose?", "o": ["Flumazenil", "Naloxone", "Protamine", "Atropine"], "a": 0, "r": "Flumazenil is a benzodiazepine antagonist (can precipitate seizures)."}, {"d": 0, "q": "A patient on spironolactone should avoid:", "o": ["Potassium supplements and salt substitutes", "Water", "Protein", "Calcium"], "a": 0, "r": "Spironolactone is potassium-sparing; risk of hyperkalemia."}, {"d": 0, "q": "Which is an expected adverse effect of morphine?", "o": ["Respiratory depression and constipation", "Diarrhea", "Tachypnea", "Hypertension"], "a": 0, "r": "Opioids depress respiration and slow GI motility."}, {"d": 0, "q": "Which respiratory rate is a nurse's cue to hold an opioid dose in an adult?", "o": ["Below 12 breaths/min", "18 breaths/min", "20 breaths/min", "22 breaths/min"], "a": 0, "r": "RR below 12 suggests respiratory depression; hold and notify."}, {"d": 0, "q": "The nurse is giving amoxicillin to a child allergic to penicillin. The nurse should:", "o": ["Withhold and contact the prescriber", "Give it with an antihistamine", "Give half dose", "Give it IV"], "a": 0, "r": "Cross-reactivity risk; clarify before giving."}, {"d": 0, "q": "The 'Z-track' injection technique is used to:", "o": ["Prevent medication leakage into subcutaneous tissue", "Speed absorption", "Reduce injection volume", "Give insulin"], "a": 0, "r": "Z-track seals irritating medication (e.g., iron dextran) into the muscle."}, {"d": 0, "q": "Which route has the fastest onset of action?", "o": ["Intravenous", "Oral", "Subcutaneous", "Transdermal"], "a": 0, "r": "IV bypasses absorption, giving immediate effect."}, {"d": 0, "q": "A patient is prescribed ondansetron. The drug is used for:", "o": ["Nausea and vomiting", "Hypertension", "Pain", "Constipation"], "a": 0, "r": "Ondansetron is a 5-HT3 antagonist antiemetic."}, {"d": 0, "q": "Which medication is classified as a beta-blocker?", "o": ["Metoprolol", "Amlodipine", "Losartan", "Furosemide"], "a": 0, "r": "The '-olol' suffix indicates beta-blockers."}, {"d": 0, "q": "A patient taking a beta-blocker should be taught to:", "o": ["Check pulse and BP and not stop abruptly", "Double the dose when stressed", "Avoid all fluids", "Take with alcohol"], "a": 0, "r": "Abrupt withdrawal can cause rebound tachycardia/hypertension."}, {"d": 0, "q": "Which action is appropriate when a patient refuses a prescribed medication?", "o": ["Respect the refusal, explain risks, document and notify the prescriber", "Hide it in food", "Force administration", "Ignore and not document"], "a": 0, "r": "Competent patients may refuse; document and report."}, {"d": 0, "q": "A medication order reads 'Digoxin 0.25 mg PO daily'. Tablets are 0.125 mg. How many tablets?", "o": ["1", "2", "3", "0.5"], "a": 1, "r": "0.25 ÷ 0.125 = 2 tablets."}, {"d": 0, "q": "The order is 'Heparin 5000 units SC'. Available is 10,000 units/mL. How many mL?", "o": ["0.25 mL", "0.5 mL", "1 mL", "2 mL"], "a": 1, "r": "5000 ÷ 10,000 = 0.5 mL."}, {"d": 0, "q": "A medication error has occurred. The nurse's FIRST action is to:", "o": ["Assess the patient and notify the prescriber", "Hide the error", "Wait to see if there are effects", "Blame the pharmacy"], "a": 0, "r": "Ensure patient safety first, then report and complete an incident report."}, {"d": 0, "q": "Which personal protective equipment sequence is correct for DONNING?", "o": ["Gown, mask/respirator, goggles, gloves", "Gloves, gown, mask, goggles", "Goggles, gloves, gown, mask", "Mask, gloves, gown, goggles"], "a": 0, "r": "Donning: gown, mask, eye protection, gloves. Doffing: gloves, goggles, gown, mask."}, {"d": 0, "q": "Which is removed FIRST when doffing PPE?", "o": ["Gloves", "Mask", "Gown", "Goggles"], "a": 0, "r": "Gloves are the most contaminated; remove first, then hand hygiene."}, {"d": 0, "q": "Which isolation precaution is needed for Clostridioides difficile?", "o": ["Contact precautions with soap-and-water hand washing", "Airborne", "Droplet", "Alcohol rub only"], "a": 0, "r": "Spores are not killed by alcohol; use soap and water."}, {"d": 0, "q": "Which disease requires airborne precautions?", "o": ["Measles, varicella, tuberculosis", "Influenza", "Pertussis", "MRSA"], "a": 0, "r": "Airborne pathogens: measles, chickenpox (disseminated zoster), TB, COVID aerosol procedures."}, {"d": 0, "q": "The five moments for hand hygiene (WHO) include:", "o": ["Before touching a patient, before aseptic procedures, after body fluid exposure, after touching a patient, after touching surroundings", "Only after toilet", "Only before meals", "Only at shift start"], "a": 0, "r": "WHO 5 Moments."}, {"d": 0, "q": "After a needlestick injury, the FIRST action is to:", "o": ["Wash the site with soap and water and let it bleed freely, then report", "Squeeze hard and suck", "Apply a tight bandage", "Ignore it"], "a": 0, "r": "Wash, do not scrub or suck, report, and obtain post-exposure prophylaxis assessment."}, {"d": 0, "q": "Standard precautions apply to:", "o": ["All patients regardless of diagnosis", "Only infected patients", "Only surgical patients", "Only isolation rooms"], "a": 0, "r": "Treat all blood and body fluids as potentially infectious."}, {"d": 0, "q": "Sterile technique requires that a sterile field be:", "o": ["Kept above the waist and in view", "Left unattended", "Prepared hours earlier", "Touched with clean gloves"], "a": 0, "r": "1-inch border is considered contaminated; do not turn your back."}, {"d": 0, "q": "Which is the most effective way to prevent hospital-acquired infections?", "o": ["Hand hygiene", "Antibiotic prophylaxis for all", "Isolation for everyone", "Wearing double masks"], "a": 0, "r": "Hand hygiene remains the single most effective measure."}, {"d": 0, "q": "Which item is single-use only and must be discarded after use?", "o": ["Syringe and needle", "Stethoscope", "BP cuff", "Thermometer (electronic, with cover)"], "a": 0, "r": "Needles and syringes are single-use."}, {"d": 0, "q": "How should spills of blood be cleaned?", "o": ["Wear PPE, absorb with towels, then disinfect with a hypochlorite solution", "Wipe with a dry cloth", "Ignore", "Use plain water"], "a": 0, "r": "Disinfect with 1:10 (0.5%) bleach as per policy."}, {"d": 0, "q": "A fire occurs in a patient room. Following RACE, the first step is:", "o": ["Rescue patients in immediate danger", "Alarm", "Contain", "Extinguish"], "a": 0, "r": "RACE: Rescue, Alarm, Contain, Extinguish."}, {"d": 0, "q": "PASS stands for (fire extinguisher):", "o": ["Pull, Aim, Squeeze, Sweep", "Push, Aim, Spray, Stop", "Pull, Alert, Spray, Shut", "Pick, Aim, Squeeze, Stop"], "a": 0, "r": "Pull the pin, Aim at the base, Squeeze, Sweep."}, {"d": 0, "q": "Which patient is at highest fall risk?", "o": ["An elderly patient on sedatives with unsteady gait", "A young adult post-op day 3", "A child watching TV", "A patient walking with a steady gait"], "a": 0, "r": "Age, sedatives, impaired mobility and confusion increase risk."}, {"d": 0, "q": "Which is the best way to prevent patient falls?", "o": ["Keep call bell within reach, bed low, non-slip footwear", "Use restraints routinely", "Keep lights off", "Raise the bed to the highest"], "a": 0, "r": "Environmental modification and regular rounding."}, {"d": 0, "q": "Which error-reporting practice is best for patient safety?", "o": ["Non-punitive reporting and root-cause analysis", "Blame individuals", "Hide errors", "Report only serious errors"], "a": 0, "r": "A just culture promotes reporting and learning."}, {"d": 0, "q": "Safe patient identification before blood transfusion requires:", "o": ["Two nurses verifying patient and blood product at the bedside", "One nurse checking by memory", "Verifying by room number", "Doing it in the lab"], "a": 0, "r": "Independent double check at the bedside."}, {"d": 0, "q": "The first nursing action when a transfusion reaction is suspected is to:", "o": ["Stop the transfusion and keep the IV open with saline", "Slow the rate", "Give oral antihistamine", "Continue and monitor"], "a": 0, "r": "Stop blood, maintain IV with normal saline (new tubing), notify prescriber, blood bank."}, {"d": 0, "q": "Which is a sign of a hemolytic transfusion reaction?", "o": ["Fever, chills, flank pain, hypotension", "Mild itching only", "Increased appetite", "Bradypnea only"], "a": 0, "r": "Acute hemolytic reaction is life-threatening."}, {"d": 0, "q": "Medication stored in a refrigerator should be kept between:", "o": ["2–8 °C", "10–15 °C", "15–25 °C", "Below 0 °C"], "a": 0, "r": "Standard refrigerated storage is 2–8 °C."}, {"d": 0, "q": "Controlled drugs must be:", "o": ["Stored in a locked cabinet with counts and double sign-off", "Left on the nurse's desk", "Shared informally", "Stored with general stock"], "a": 0, "r": "Strict storage and accountability."}, {"d": 0, "q": "An unlabeled syringe is found at the bedside. The nurse should:", "o": ["Not use it, discard per policy and report", "Administer it", "Label it from memory", "Ask the patient"], "a": 0, "r": "Never use unlabeled medication."}, {"d": 0, "q": "Restraints should be used in patient care:", "o": ["As a last resort with order, monitoring and regular release", "Routinely for confused patients", "At nurse's discretion", "Without documentation"], "a": 0, "r": "Least restrictive principle."}, {"d": 0, "q": "Which patient right is protected by the principle of autonomy?", "o": ["Right to make decisions about own care", "Right to free meals", "Right to choose the nurse", "Right to avoid all pain"], "a": 0, "r": "Autonomy: self-determination."}, {"d": 0, "q": "Beneficence means:", "o": ["Acting for the patient's good", "Avoiding harm", "Being fair", "Telling the truth"], "a": 0, "r": "Nonmaleficence: do no harm; justice: fairness; veracity: truth-telling."}, {"d": 0, "q": "A nurse accidentally breaches patient confidentiality. The best action is to:", "o": ["Report to the supervisor per policy and take corrective steps", "Hide it", "Delete records", "Blame IT"], "a": 0, "r": "Honesty and reporting."}, {"d": 0, "q": "Which action shows appropriate delegation?", "o": ["Assign vital signs of stable patients to a nursing assistant", "Assign initial assessment of unstable patient to a nursing assistant", "Delegate teaching of new insulin", "Delegate IV push medication to unlicensed staff"], "a": 0, "r": "Assessment, teaching, and evaluation remain with the RN."}, {"d": 0, "q": "Which task can the RN delegate to an unlicensed assistive personnel?", "o": ["Bathing a stable patient", "Assessing a post-op patient", "Developing a care plan", "Administering blood"], "a": 0, "r": "Routine ADLs for stable patients."}, {"d": 0, "q": "During a disaster triage (START), which category is treated FIRST?", "o": ["Immediate (red)", "Delayed (yellow)", "Minor (green)", "Expectant (black)"], "a": 0, "r": "Red: life-threatening but salvageable."}, {"d": 0, "q": "Which is a priority when receiving shift handover?", "o": ["Use a structured tool such as SBAR", "Skip critical details", "Rely on memory", "Handover by text only"], "a": 0, "r": "SBAR: Situation, Background, Assessment, Recommendation."}, {"d": 0, "q": "Which describes a 'sentinel event'?", "o": ["An unexpected event causing death or serious harm", "A minor near miss", "A routine task", "A scheduled audit"], "a": 0, "r": "Sentinel events require root-cause analysis."}, {"d": 0, "q": "A nurse finds a patient's IV site red, swollen and cool to touch with the infusion running slowly. What is the BEST first action?", "o": ["Stop the infusion and remove the cannula", "Apply a warm compress and continue", "Increase the flow rate", "Flush the line with more saline"], "a": 0, "r": "Signs of infiltration: stop the infusion, remove the cannula, elevate and assess, then resite."}, {"d": 0, "q": "A patient says, 'I don't want the blood test today.' The patient is alert and understands the reason for the test. What should the nurse do?", "o": ["Explain the purpose and risks of refusing, respect the decision and document", "Take the sample anyway", "Ask the family to persuade the patient", "Tell the patient the test is compulsory"], "a": 0, "r": "Competent adults may refuse; provide information, document and inform the team."}, {"d": 0, "q": "A nurse is about to give a medication that the patient says 'looks different from my usual tablet'. What should the nurse do FIRST?", "o": ["Withhold and verify the drug against the order and pharmacy", "Give it because the order is correct", "Tell the patient to take it anyway", "Ask a visitor"], "a": 0, "r": "A change in appearance is a safety cue; re-check order, drug and dose before giving."}, {"d": 0, "q": "A client is prescribed 500 mg of a drug. The stock is 125 mg per 5 mL. How many mL should the nurse give?", "o": ["20 mL", "10 mL", "15 mL", "25 mL"], "a": 0, "r": "500 ÷ 125 × 5 = 20 mL."}, {"d": 0, "q": "A nurse calculates an IV rate: 1000 mL over 8 hours by pump. What rate should be set?", "o": ["125 mL/hour", "100 mL/hour", "150 mL/hour", "80 mL/hour"], "a": 0, "r": "1000 ÷ 8 = 125 mL/h."}, {"d": 0, "q": "A bed-bound patient has a sacral area with intact, non-blanchable redness. Which action is MOST appropriate?", "o": ["Offload pressure by repositioning and use a pressure-redistributing mattress", "Massage the area firmly", "Apply a hot pack", "Apply powder"], "a": 0, "r": "Stage 1 injury: relieve pressure, protect skin; do not massage."}, {"d": 0, "q": "Which patient statement shows the teaching about low-sodium diet was understood?", "o": ["'I will check labels and avoid processed foods.'", "'I will use salt substitutes freely.'", "'I only need to avoid salt at the table.'", "'Soup is fine if it is canned.'"], "a": 0, "r": "Hidden sodium in processed foods is a major source; salt substitutes may contain potassium."}, {"d": 0, "q": "The nurse measures a patient's temperature as 38.9 °C two hours after paracetamol. Which action is a PRIORITY?", "o": ["Assess for infection source and notify the prescriber", "Document only", "Add more blankets", "Withhold fluids"], "a": 0, "r": "Persistent fever needs further assessment and reporting."}, {"d": 0, "q": "A patient is receiving oxygen by simple face mask. Which finding should the nurse report FIRST?", "o": ["SpO2 85% and increasing breathlessness", "SpO2 96%", "Dry lips", "Patient eating lunch"], "a": 0, "r": "Worsening hypoxia on supplemental oxygen is an emergency."}, {"d": 0, "q": "A nurse is teaching a patient to use an incentive spirometer. Which instruction is correct?", "o": ["Inhale slowly and deeply, hold for 3–5 seconds, then exhale", "Blow out as hard as possible", "Breathe quickly and shallowly", "Use once daily"], "a": 0, "r": "Slow sustained maximal inspiration expands alveoli; repeat about 10 times per hour while awake."}, {"d": 0, "q": "Which stool characteristic is MOST suggestive of upper gastrointestinal bleeding?", "o": ["Black, tarry, foul-smelling stool", "Bright red streaks on the surface", "Pale yellow stool", "Loose brown stool"], "a": 0, "r": "Melena indicates digested blood from the upper GI tract."}, {"d": 0, "q": "Before taking a patient's blood pressure, which preparation is correct?", "o": ["Patient seated and rested 5 minutes with arm supported at heart level", "Patient talking and arm hanging", "Patient just finished climbing stairs", "Cuff placed over clothing"], "a": 0, "r": "Rest, arm supported at heart level, bare arm, correct cuff size."}, {"d": 0, "q": "A patient is NPO and has dry mouth. The BEST intervention is:", "o": ["Provide frequent oral hygiene and lip care", "Give sips of water", "Give hard candy", "Restrict mouth care"], "a": 0, "r": "Mouth care comforts without breaking NPO."}, {"d": 0, "q": "A nurse suspects a colleague is impaired by alcohol at work. What is the nurse's responsibility?", "o": ["Report to the supervisor following policy to protect patients", "Cover for the colleague", "Confront in front of patients", "Do nothing"], "a": 0, "r": "Patient safety requires reporting through the proper channel."}, {"d": 0, "q": "Which statement by a nurse indicates the correct understanding of advance directives?", "o": ["'The patient's documented wishes guide care if they lose capacity.'", "'Families can override them anytime.'", "'They apply only to surgery.'", "'They are not legally relevant.'"], "a": 0, "r": "Advance directives communicate patient preferences when capacity is lost."}, {"d": 0, "q": "Which order should the nurse question?", "o": ["Morphine 10 mg IV push over 30 seconds for a frail 80-year-old", "Paracetamol 1 g orally every 6 hours", "Saline 0.9% 500 mL over 4 hours", "Ondansetron 4 mg IV"], "a": 0, "r": "Rapid high-dose opioid in a frail older patient risks respiratory depression; clarify with prescriber."}, {"d": 0, "q": "Which measure BEST prevents contamination of a sterile field when a sterile item falls onto its edge?", "o": ["Treat the 2.5 cm outer border as contaminated and avoid placing items there", "Use it anyway", "Wipe with alcohol", "Cover with a clean towel"], "a": 0, "r": "The outer 1 inch (2.5 cm) edge is considered non-sterile."}, {"d": 0, "q": "A patient with a nasogastric tube feeding develops coughing and breathlessness during feeding. What is the FIRST action?", "o": ["Stop the feed and assess airway and breathing", "Increase the rate", "Offer water", "Lay the patient flat"], "a": 0, "r": "Suspected aspiration: stop feed, sit upright, assess and suction as needed."}, {"d": 0, "q": "Which finding BEST shows that a patient's pain medication is effective?", "o": ["The patient reports pain reduced from 8/10 to 3/10 and is able to move", "The patient is asleep", "The patient does not complain", "The dose was given on time"], "a": 0, "r": "Evaluation compares patient-reported pain and function before and after."}, {"d": 0, "q": "A nurse should use which method to identify an unconscious patient without a wristband?", "o": ["Follow policy: obtain a new ID band verified by two staff", "Ask the patient's name", "Use bed number", "Guess from the chart"], "a": 0, "r": "Never rely on bed or room number; follow ID verification policy."}, {"d": 0, "q": "A confused patient repeatedly pulls out the IV. Which action is MOST appropriate first?", "o": ["Assess for causes (pain, hypoxia, full bladder), reorient and consider concealing or securing the site", "Apply wrist restraints immediately", "Sedate", "Ignore"], "a": 0, "r": "Use the least restrictive measures after assessing reversible causes."}, {"d": 0, "q": "Which task may be delegated to a nursing assistant?", "o": ["Measuring and recording oral intake and output", "Assessing wound infection", "Administering IV antibiotics", "Creating the care plan"], "a": 0, "r": "Intake/output measurement is a routine task; assessment and medications stay with the nurse."}, {"d": 0, "q": "A patient asks the nurse to share their diagnosis with a coworker who is a friend. The nurse should:", "o": ["Decline and explain confidentiality", "Share because they are friends", "Share the diagnosis but not the name", "Tell the physician only"], "a": 0, "r": "Confidential information is shared only with those involved in care."}, {"d": 0, "q": "On hourly rounding, which is the BEST example of person-centred care?", "o": ["Asking the patient about their preferences for timing of care and respecting them", "Following a rigid schedule", "Giving care without explanation", "Deciding for the patient"], "a": 0, "r": "Person-centred care involves shared decisions and preferences."}, {"d": 0, "q": "The nurse is giving a bed bath to a patient who has an IV in the right arm. Which technique is correct?", "o": ["Remove clothing from the unaffected arm first and put on the affected arm first", "Remove from the IV arm first and dress the unaffected arm first", "Disconnect the IV", "Avoid bathing"], "a": 0, "r": "Undress the unaffected side first, dress the affected side first."}, {"d": 0, "q": "Which serum sodium value would the nurse report immediately?", "o": ["118 mEq/L", "138 mEq/L", "142 mEq/L", "145 mEq/L"], "a": 0, "r": "Severe hyponatremia risks seizures and cerebral oedema."}, {"d": 0, "q": "A patient receiving a blood transfusion develops hives only, with stable vital signs. The nurse first:", "o": ["Stops the transfusion, keeps the line open with saline and notifies the prescriber", "Continues at a faster rate", "Gives more blood", "Removes the IV"], "a": 0, "r": "Any suspected reaction: stop, keep IV patent, assess, notify."}, {"d": 0, "q": "Which urine finding suggests dehydration?", "o": ["Dark amber, concentrated urine with high specific gravity", "Pale straw colour", "Clear urine", "Large volumes"], "a": 0, "r": "Concentrated urine reflects fluid deficit."}, {"d": 0, "q": "When positioning an unconscious patient who is NOT suspected of spinal injury, the nurse should use:", "o": ["Lateral (recovery) position to keep the airway clear", "Prone with head up", "Flat supine", "Sitting upright"], "a": 0, "r": "Recovery position protects the airway from secretions."}, {"d": 0, "q": "A patient with a fever of 39 °C is shivering. Which action is BEST?", "o": ["Give antipyretic as prescribed and provide light covering", "Pile on blankets", "Give an ice bath", "Withhold fluids"], "a": 0, "r": "Treat fever per order and keep comfortable; ice baths cause shivering and heat production."}, {"d": 0, "q": "The nurse accidentally administers a dose at the wrong time (two hours late) because of a delay. The BEST response is:", "o": ["Assess the patient, inform the prescriber and report per policy", "Say nothing", "Skip next dose", "Alter the chart"], "a": 0, "r": "Report variance; honest documentation supports safety learning."}, {"d": 1, "q": "A nurse wants to know if a new wound dressing heals ulcers faster than the current one. Which study design provides the STRONGEST evidence?", "o": ["Randomised controlled trial", "Case report", "Expert opinion", "Cross-sectional survey"], "a": 0, "r": "RCTs minimise bias in comparing interventions."}, {"d": 1, "q": "A systematic review with meta-analysis is best described as:", "o": ["A structured synthesis of multiple studies with statistical pooling of results", "A single interview study", "An opinion piece", "A case series"], "a": 0, "r": "It combines results from comparable studies for a stronger estimate."}, {"d": 1, "q": "Which is the correct sequence of evidence-based practice?", "o": ["Ask a question, search for evidence, appraise it, apply it, evaluate the outcome", "Apply, ask, search, evaluate", "Search, apply, ask, appraise", "Appraise, ask, evaluate, apply"], "a": 0, "r": "Ask, acquire, appraise, apply, assess."}, {"d": 1, "q": "In a PICO question, 'C' stands for:", "o": ["Comparison", "Cost", "Cohort", "Confidence"], "a": 0, "r": "Population, Intervention, Comparison, Outcome."}, {"d": 1, "q": "A researcher selects every 5th patient from the admission register. This is:", "o": ["Systematic sampling", "Simple random sampling", "Convenience sampling", "Quota sampling"], "a": 0, "r": "Selecting every kth unit is systematic sampling."}, {"d": 1, "q": "A study explores the lived experience of nurses working night shifts using interviews. This is:", "o": ["Qualitative research", "Quantitative research", "Randomised trial", "Meta-analysis"], "a": 0, "r": "Qualitative studies explore meanings and experiences."}, {"d": 1, "q": "Which statement describes validity of a measurement tool?", "o": ["It measures what it is intended to measure", "It gives the same results each time", "It is cheap", "It is quick"], "a": 0, "r": "Reliability is consistency; validity is accuracy of what is measured."}, {"d": 1, "q": "A blood-pressure device gives the same reading repeatedly but is consistently 10 mmHg too high. The device is:", "o": ["Reliable but not valid", "Valid but not reliable", "Neither", "Both"], "a": 0, "r": "Consistent but inaccurate."}, {"d": 1, "q": "Which research ethics principle requires participants to know the purpose and risks before joining?", "o": ["Informed consent", "Justice", "Fidelity", "Veracity only"], "a": 0, "r": "Voluntary informed consent is essential."}, {"d": 1, "q": "Which is a feature of a cohort study?", "o": ["Follows groups over time to see who develops an outcome", "Compares cases and controls retrospectively only", "Single time-point survey", "Randomly assigns treatments"], "a": 0, "r": "Cohort studies follow exposed and unexposed groups."}, {"d": 1, "q": "A case–control study is best suited to investigate:", "o": ["A rare disease", "Common outcomes in a large cohort only", "Drug dosing", "Cost effectiveness only"], "a": 0, "r": "Case-control starts with the outcome, efficient for rare diseases."}, {"d": 1, "q": "The incidence of a disease is:", "o": ["The number of NEW cases in a population over a period of time", "All existing cases at one time", "Deaths from disease", "Cases in hospital"], "a": 0, "r": "Prevalence = existing cases; incidence = new cases."}, {"d": 1, "q": "A town has 20,000 people. 200 have diabetes on survey day. The prevalence is:", "o": ["1%", "0.1%", "10%", "2%"], "a": 0, "r": "200 ÷ 20,000 = 1%."}, {"d": 1, "q": "A test correctly identifying people WITH disease is measuring its:", "o": ["Sensitivity", "Specificity", "Prevalence", "Incidence"], "a": 0, "r": "Sensitivity = true positive rate; specificity = true negative rate."}, {"d": 1, "q": "A relative risk of 1.0 means:", "o": ["No difference in risk between groups", "Risk doubles", "Risk halves", "Study is invalid"], "a": 0, "r": "RR = 1 indicates no association."}, {"d": 1, "q": "A p-value of 0.03 in a study (alpha 0.05) suggests:", "o": ["The result is statistically significant", "No difference", "The study is invalid", "The result is clinically important by definition"], "a": 0, "r": "p < 0.05 is conventionally significant, but clinical importance is a separate judgement."}, {"d": 1, "q": "Which measure of central tendency is least affected by extreme values?", "o": ["Median", "Mean", "Range", "Variance"], "a": 0, "r": "The median is resistant to outliers."}, {"d": 1, "q": "The most appropriate graph to show change in a patient's temperature over days is:", "o": ["Line graph", "Pie chart", "Scatter of names", "Pictogram only"], "a": 0, "r": "Line graphs show trends over time."}, {"d": 1, "q": "Which is a threat to a study's internal validity caused by participants dropping out?", "o": ["Attrition bias", "Recall bias", "Selection by randomisation", "Blinding"], "a": 0, "r": "Loss to follow-up can bias results."}, {"d": 1, "q": "Blinding in a clinical trial aims to reduce:", "o": ["Bias from expectations of participants and assessors", "Cost", "Sample size", "Ethics review"], "a": 0, "r": "Blinding limits observer and participant bias."}, {"d": 1, "q": "Which source is MOST appropriate for a clinical practice guideline?", "o": ["Recognised professional body or national health authority", "A social-media post", "An advertisement", "A colleague's memory"], "a": 0, "r": "Use reputable, peer-reviewed or authoritative guidelines."}, {"d": 1, "q": "A nurse finds that a unit's catheter infection rate rose after a change in practice. Which approach is best?", "o": ["Audit data, review practice against evidence and implement a quality improvement cycle", "Ignore", "Blame one nurse", "Stop catheter use entirely"], "a": 0, "r": "Use audits and PDSA cycles."}, {"d": 1, "q": "The 'Plan–Do–Study–Act' cycle is used for:", "o": ["Quality improvement", "Drug dosing", "Triage", "Sampling"], "a": 0, "r": "PDSA tests small changes."}, {"d": 1, "q": "Which describes 'epidemiology'?", "o": ["Study of distribution and determinants of health conditions in populations", "Study of drug action", "Study of anatomy", "Study of nursing history"], "a": 0, "r": "Epidemiology investigates patterns and causes."}, {"d": 1, "q": "An outbreak of gastroenteritis occurs after a staff party. The FIRST epidemiological step is to:", "o": ["Confirm the diagnosis and define cases", "Close the hospital", "Treat everyone", "Publish findings"], "a": 0, "r": "Verify the outbreak and set case definition before further steps."}, {"d": 1, "q": "Mortality rate in children under 5 years is a measure of:", "o": ["Population health and healthcare access", "Hospital bed numbers", "Staff satisfaction", "Pharmacy stock"], "a": 0, "r": "U5MR is a key health indicator."}, {"d": 1, "q": "Confidentiality in research is protected by:", "o": ["Anonymising data and secure storage", "Posting names", "Sharing with employers", "Leaving files open"], "a": 0, "r": "Data protection protects participants."}, {"d": 1, "q": "A nurse reads that a drug reduces mortality by 25% relative to placebo. This statement describes:", "o": ["Relative risk reduction", "Absolute risk", "Incidence", "Specificity"], "a": 0, "r": "Relative risk reduction expresses proportional change."}, {"d": 1, "q": "Which is the main purpose of a literature review at the start of a project?", "o": ["To understand what is already known and identify gaps", "To collect patient data", "To choose the sample size", "To analyse results"], "a": 0, "r": "A literature review informs the research question."}, {"d": 1, "q": "A nurse implementing a new hand-hygiene protocol encounters resistance. The BEST strategy is:", "o": ["Engage staff, explain the evidence, provide training and feedback", "Mandate without discussion", "Cancel the project", "Punish non-compliance"], "a": 0, "r": "Change management works through engagement and support."}, {"d": 2, "q": "A patient with a myocardial infarction reports chest pain. After checking vital signs, which medication is MOST appropriate unless contraindicated?", "o": ["Oral aspirin (chewed)", "Oral paracetamol", "Oral omeprazole", "Oral metformin"], "a": 0, "r": "Chewed aspirin 162–325 mg inhibits platelet aggregation in suspected MI."}, {"d": 2, "q": "Which laboratory finding is most specific for myocardial injury?", "o": ["Troponin", "CK total", "Myoglobin", "LDH"], "a": 0, "r": "Cardiac troponin is the most sensitive and specific marker."}, {"d": 2, "q": "A patient with heart failure is prescribed furosemide. Which finding should the nurse monitor?", "o": ["Hyperkalemia", "Hypokalemia", "Hypercalcemia", "Hypernatremia"], "a": 1, "r": "Loop diuretics are potassium-wasting; monitor for hypokalemia."}, {"d": 2, "q": "Which diet is appropriate for a patient with heart failure?", "o": ["High sodium", "Low sodium", "High potassium only", "High fat"], "a": 1, "r": "Sodium restriction limits fluid retention."}, {"d": 2, "q": "A patient with COPD is receiving oxygen. Which target SpO2 is generally appropriate?", "o": ["98–100%", "88–92%", "75–80%", "Above 100%"], "a": 1, "r": "In COPD, high O2 may suppress hypoxic drive; target 88–92%."}, {"d": 2, "q": "Which assessment finding suggests a pulmonary embolism?", "o": ["Sudden dyspnea, pleuritic chest pain, tachycardia", "Gradual onset of productive cough", "Pain on swallowing", "Bradycardia and hypertension"], "a": 0, "r": "PE presents with sudden dyspnea, pleuritic pain, tachycardia and hypoxemia."}, {"d": 2, "q": "A patient has diabetic ketoacidosis (DKA). Which finding is expected?", "o": ["Kussmaul respirations and fruity breath odor", "Slow shallow breathing", "Cool clammy skin and tremors", "Hypotension with bradycardia only"], "a": 0, "r": "DKA: hyperglycemia, metabolic acidosis, Kussmaul breathing, acetone breath."}, {"d": 2, "q": "The nurse finds a diabetic patient diaphoretic, shaky and confused. Blood glucose is 52 mg/dL. The patient is awake and can swallow. What is the FIRST action?", "o": ["Administer 15 g of fast-acting oral carbohydrate", "Give insulin", "Call the physician and wait", "Provide a full meal"], "a": 0, "r": "Rule of 15: give 15 g fast-acting carbohydrate and recheck in 15 minutes."}, {"d": 2, "q": "Which is the most common early sign of hypoglycemia?", "o": ["Shakiness, sweating and hunger", "Polyuria", "Kussmaul respiration", "Flushed dry skin"], "a": 0, "r": "Adrenergic symptoms: tremor, sweating, tachycardia, hunger."}, {"d": 2, "q": "A patient is receiving heparin infusion. Which laboratory test is monitored?", "o": ["PT/INR", "aPTT", "Hemoglobin A1C", "ESR"], "a": 1, "r": "Heparin is monitored with aPTT; warfarin with PT/INR."}, {"d": 2, "q": "The antidote for heparin overdose is:", "o": ["Vitamin K", "Protamine sulfate", "Naloxone", "Flumazenil"], "a": 1, "r": "Protamine sulfate reverses heparin; vitamin K reverses warfarin."}, {"d": 2, "q": "A patient post-thyroidectomy complains of tingling around the mouth and carpopedal spasm. The nurse suspects:", "o": ["Hypocalcemia", "Hypercalcemia", "Hyperkalemia", "Hyponatremia"], "a": 0, "r": "Accidental parathyroid removal causes hypocalcemia; Chvostek/Trousseau signs positive."}, {"d": 2, "q": "Which finding is a classic sign of increased intracranial pressure?", "o": ["Decreasing level of consciousness", "Increasing pulse and falling BP", "Widened pulse pressure with bradycardia (Cushing's triad)", "Both A and C"], "a": 3, "r": "Late ICP signs: Cushing's triad (hypertension/widened pulse pressure, bradycardia, irregular respirations); LOC decline is the earliest sign."}, {"d": 2, "q": "A patient with suspected stroke arrives within the window. Which is the priority?", "o": ["Obtain a non-contrast CT scan of the head", "Give oral fluids", "Apply ice to the head", "Perform lumbar puncture"], "a": 0, "r": "CT differentiates ischemic from hemorrhagic stroke before thrombolysis."}, {"d": 2, "q": "Which sign is expected with right-sided heart failure?", "o": ["Pulmonary crackles", "Peripheral edema and jugular vein distension", "Pink frothy sputum", "Orthopnea only"], "a": 1, "r": "Right-sided failure causes systemic venous congestion."}, {"d": 2, "q": "The nurse is caring for a patient after a total hip replacement. Which position should be AVOIDED?", "o": ["Abduction with pillow between legs", "Hip flexion greater than 90° and adduction", "Elevating the head slightly", "Walking with assistance"], "a": 1, "r": "Avoid flexion >90°, adduction and internal rotation to prevent dislocation (posterior approach)."}, {"d": 2, "q": "A patient with cirrhosis has elevated ammonia and confusion. Which dietary change is expected?", "o": ["Restrict protein as ordered and give lactulose", "Increase protein intake", "High-sodium diet", "Provide alcohol"], "a": 0, "r": "Hepatic encephalopathy: lactulose lowers ammonia; protein is moderated as ordered."}, {"d": 2, "q": "Which finding indicates acute appendicitis?", "o": ["Pain at McBurney's point with rebound tenderness", "Pain relieved by eating", "Painless jaundice", "Bloody diarrhea only"], "a": 0, "r": "RLQ pain at McBurney's point, rebound tenderness, nausea, fever."}, {"d": 2, "q": "A patient is scheduled for a CT scan with contrast. Which allergy is the nurse MOST concerned about?", "o": ["Iodine/contrast dye", "Penicillin", "Latex only", "Peanuts"], "a": 0, "r": "Iodinated contrast reactions; also check renal function and metformin use."}, {"d": 2, "q": "A patient on warfarin has an INR of 5.5 with no bleeding. The nurse anticipates:", "o": ["Holding the next dose and possibly vitamin K as ordered", "Increasing the dose", "Giving protamine", "Giving more aspirin"], "a": 0, "r": "INR above therapeutic range (2–3 typically): hold warfarin, consider vitamin K."}, {"d": 2, "q": "Which is the BEST position after a lumbar puncture?", "o": ["Flat in bed as ordered", "Semi-Fowler's", "Prone with head down", "Sitting upright"], "a": 0, "r": "Lying flat reduces post-dural puncture headache."}, {"d": 2, "q": "A patient with chronic kidney disease should have which dietary adjustment?", "o": ["Restrict potassium, phosphorus, and sodium as ordered", "Unlimited high-potassium foods", "High protein regardless of GFR", "Increased fluid intake always"], "a": 0, "r": "CKD requires restriction of K, phosphate and sodium and careful fluids."}, {"d": 2, "q": "Which lab value is a priority to report in a patient with acute kidney injury?", "o": ["Potassium 6.4 mEq/L", "Sodium 140 mEq/L", "Calcium 9.0 mg/dL", "Chloride 100 mEq/L"], "a": 0, "r": "Hyperkalemia can cause fatal arrhythmias."}, {"d": 2, "q": "The nurse notes a patient has an ECG with peaked T waves. This suggests:", "o": ["Hyperkalemia", "Hypokalemia", "Hypocalcemia", "Hypomagnesemia"], "a": 0, "r": "Peaked T waves are an early ECG sign of hyperkalemia."}, {"d": 2, "q": "A patient is admitted with suspected meningitis. Which precaution is needed?", "o": ["Droplet precautions", "Contact only", "No precautions", "Airborne with negative pressure"], "a": 0, "r": "Bacterial meningitis (meningococcal) requires droplet precautions until 24 h of antibiotics."}, {"d": 2, "q": "Which symptom is typical in a patient with pneumonia?", "o": ["Productive cough, fever, crackles", "Barking cough with stridor only", "Bradycardia", "Hypotension only"], "a": 0, "r": "Pneumonia: fever, productive cough, crackles, pleuritic pain."}, {"d": 2, "q": "A patient with asthma is wheezing and using accessory muscles. What is the priority nursing action?", "o": ["Administer prescribed short-acting bronchodilator and oxygen", "Give a sedative", "Lay the patient flat", "Restrict fluids"], "a": 0, "r": "Rapid-acting beta-2 agonist (e.g., salbutamol) is the first-line rescue."}, {"d": 2, "q": "Which test best monitors long-term glycemic control?", "o": ["Fasting blood glucose", "HbA1c", "Random glucose", "Urine ketones"], "a": 1, "r": "HbA1c reflects the average glucose over about 2–3 months."}, {"d": 2, "q": "A patient with a chest tube has continuous bubbling in the water-seal chamber. This most likely indicates:", "o": ["An air leak", "Normal function", "Lung re-expansion", "Fluid overload"], "a": 0, "r": "Continuous bubbling in the water seal indicates a leak in the system or lung; intermittent bubbling with respiration can be normal early."}, {"d": 2, "q": "Which is the best nursing action for a patient who is vomiting and at risk of aspiration?", "o": ["Position on the side with head slightly lowered", "Place supine flat", "Offer oral fluids immediately", "Place prone"], "a": 0, "r": "Lateral positioning protects the airway."}, {"d": 2, "q": "A patient develops anaphylaxis after an injection. What is the FIRST drug to give?", "o": ["Intramuscular epinephrine", "Oral antihistamine", "IV hydrocortisone only", "Salbutamol only"], "a": 0, "r": "IM adrenaline (epinephrine) 0.5 mg (1:1000) into the anterolateral thigh is first-line."}, {"d": 2, "q": "Which patient should the nurse see FIRST?", "o": ["Patient with chest pain and diaphoresis", "Patient with a sprained ankle", "Patient with mild headache", "Patient requesting discharge papers"], "a": 0, "r": "Possible ACS is life-threatening and takes priority."}, {"d": 2, "q": "The correct compression-to-ventilation ratio for adult CPR with one rescuer is:", "o": ["30:2", "15:2", "5:1", "10:2"], "a": 0, "r": "30 compressions to 2 breaths for adults (lone or two rescuers without advanced airway)."}, {"d": 2, "q": "The recommended compression depth for adult CPR is:", "o": ["At least 5 cm (but not more than 6 cm)", "2 cm", "3 cm", "8 cm"], "a": 0, "r": "5–6 cm at 100–120 per minute."}, {"d": 2, "q": "The recommended compression rate for adults is:", "o": ["100–120 per minute", "60–80 per minute", "140–160 per minute", "80–100 per minute"], "a": 0, "r": "100–120/min."}, {"d": 2, "q": "The first step on finding an unresponsive adult is:", "o": ["Check for danger, then responsiveness, and call for help", "Start compressions immediately without checking", "Give breaths", "Leave"], "a": 0, "r": "DRSABCD: Danger, Response, Send for help, Airway, Breathing, CPR, Defibrillation."}, {"d": 2, "q": "Which rhythm is shockable?", "o": ["Ventricular fibrillation", "Asystole", "Pulseless electrical activity", "Sinus bradycardia"], "a": 0, "r": "VF and pulseless VT are shockable."}, {"d": 2, "q": "Which drug is given in cardiac arrest every 3–5 minutes?", "o": ["Epinephrine 1 mg", "Atropine", "Digoxin", "Furosemide"], "a": 0, "r": "Epinephrine 1 mg IV/IO every 3–5 min."}, {"d": 2, "q": "A patient is in asystole. Which action is appropriate?", "o": ["Continue high-quality CPR and give epinephrine", "Defibrillate immediately", "Cardiovert", "Stop resuscitation"], "a": 0, "r": "Asystole is not shockable."}, {"d": 2, "q": "The Glasgow Coma Scale maximum score is:", "o": ["15", "10", "12", "20"], "a": 0, "r": "E4 V5 M6 = 15; minimum is 3."}, {"d": 2, "q": "A GCS score of 8 or less usually indicates:", "o": ["Need for airway protection/intubation", "Normal consciousness", "Mild injury", "No intervention"], "a": 0, "r": "'8 or less, intubate'."}, {"d": 2, "q": "Which is a sign of tension pneumothorax?", "o": ["Tracheal deviation, absent breath sounds, hypotension, JVD", "Productive cough", "Bradypnea", "Normal chest"], "a": 0, "r": "Needle decompression is the emergency treatment."}, {"d": 2, "q": "In hypovolemic shock, the earliest compensatory sign is:", "o": ["Tachycardia", "Hypotension", "Bradycardia", "Anuria"], "a": 0, "r": "Compensation first: tachycardia, cool skin, narrow pulse pressure."}, {"d": 2, "q": "Which is a sign of septic shock?", "o": ["Fever, tachycardia, hypotension, altered mental state", "Bradycardia with hypertension", "Hypothermia only in all", "Normal lactate"], "a": 0, "r": "Sepsis bundle: lactate, cultures, antibiotics, fluids within one hour."}, {"d": 2, "q": "The initial fluid resuscitation for septic shock is:", "o": ["30 mL/kg crystalloid bolus", "Colloid only", "No fluids", "Blood immediately for everyone"], "a": 0, "r": "Surviving Sepsis: 30 mL/kg crystalloid for hypotension or lactate ≥4."}, {"d": 2, "q": "Which patient is highest priority in triage?", "o": ["Airway obstruction", "Closed ankle fracture", "Minor laceration", "Sore throat"], "a": 0, "r": "ABC priority."}, {"d": 2, "q": "First aid for a burn is:", "o": ["Cool with running water for 20 minutes", "Apply ice directly", "Apply butter", "Pop blisters"], "a": 0, "r": "Cool running water (not ice) for 20 minutes, cover loosely."}, {"d": 2, "q": "The 'rule of nines' estimates:", "o": ["Percentage of body surface burned", "Drug dosage", "Blood loss", "GCS"], "a": 0, "r": "Adult head 9%, each arm 9%, each leg 18%, anterior trunk 18%, posterior trunk 18%, perineum 1%."}, {"d": 2, "q": "Which fluid is first-line for burn resuscitation?", "o": ["Ringer's lactate", "Dextrose 5% alone", "Plain water", "Sodium bicarbonate"], "a": 0, "r": "Parkland formula: 4 mL × kg × %TBSA, half in the first 8 hours."}, {"d": 2, "q": "For a patient with a suspected spinal injury, the nurse should:", "o": ["Immobilize the spine and use log roll", "Sit the patient up", "Flex the neck", "Walk the patient"], "a": 0, "r": "Maintain neutral alignment."}, {"d": 2, "q": "The antidote for organophosphate poisoning is:", "o": ["Atropine", "Naloxone", "Flumazenil", "Vitamin K"], "a": 0, "r": "Atropine with pralidoxime."}, {"d": 2, "q": "Which finding indicates carbon monoxide poisoning?", "o": ["Cherry-red skin, headache, normal SpO2 reading on pulse oximetry", "Cyanosis only", "Bradypnea", "Fever"], "a": 0, "r": "Pulse oximetry is falsely normal; give 100% oxygen."}, {"d": 2, "q": "Which ECG rhythm shows irregularly irregular rhythm with no P waves?", "o": ["Atrial fibrillation", "Sinus tachycardia", "First-degree block", "Normal sinus"], "a": 0, "r": "AF: chaotic atrial activity, stroke risk (anticoagulation)."}, {"d": 2, "q": "Which is the drug of choice for stable supraventricular tachycardia after vagal maneuvers?", "o": ["Adenosine", "Atropine", "Amiodarone as first line", "Digoxin IV push"], "a": 0, "r": "Adenosine rapid IV push followed by flush."}, {"d": 2, "q": "The treatment for symptomatic bradycardia is:", "o": ["Atropine", "Adenosine", "Lidocaine", "Calcium chloride"], "a": 0, "r": "Atropine 0.5–1 mg IV (per protocol); pacing if no response."}, {"d": 2, "q": "In a mechanically ventilated patient, which intervention helps prevent VAP?", "o": ["Elevate head of bed 30–45° and oral care", "Lay flat", "Routine saline instillation", "Avoid suctioning"], "a": 0, "r": "VAP bundle."}, {"d": 2, "q": "Normal arterial blood pH is:", "o": ["7.35–7.45", "7.0–7.1", "7.5–7.6", "6.8–7.0"], "a": 0, "r": "Normal pH 7.35–7.45."}, {"d": 2, "q": "ABG: pH 7.30, PaCO2 55, HCO3 24. The interpretation is:", "o": ["Respiratory acidosis", "Respiratory alkalosis", "Metabolic acidosis", "Metabolic alkalosis"], "a": 0, "r": "Low pH with high CO2 = respiratory acidosis."}, {"d": 2, "q": "ABG: pH 7.28, HCO3 14, PaCO2 30. The interpretation is:", "o": ["Metabolic acidosis with respiratory compensation", "Respiratory acidosis", "Metabolic alkalosis", "Normal"], "a": 0, "r": "Low pH with low HCO3."}, {"d": 2, "q": "Which sign is the earliest indicator of hypoxia in an adult?", "o": ["Restlessness", "Cyanosis", "Bradycardia", "Coma"], "a": 0, "r": "Restlessness and anxiety precede cyanosis."}, {"d": 2, "q": "The antidote for hypermagnesemia/hyperkalemia ECG changes is:", "o": ["Calcium gluconate", "Insulin alone with no glucose", "Furosemide alone", "Potassium chloride"], "a": 0, "r": "IV calcium stabilizes the myocardium; insulin + glucose shifts K+."}, {"d": 2, "q": "A patient with a tracheostomy has copious secretions. The nurse should:", "o": ["Suction using sterile technique for no more than 10–15 seconds", "Suction for 1 minute", "Avoid suction", "Use clean gloves only"], "a": 0, "r": "Limit each suction pass to 10–15 s and pre-oxygenate."}, {"d": 2, "q": "A patient returns from surgery with a blood pressure of 80/50, HR 125, and cool clammy skin. The nurse suspects:", "o": ["Hemorrhage/hypovolemic shock", "Pain", "Anxiety", "Normal post-op"], "a": 0, "r": "Post-op shock signs; notify provider, start fluids, check dressing."}, {"d": 2, "q": "Which is a priority post-operative nursing action in the PACU?", "o": ["Maintain airway and monitor vital signs", "Teach discharge", "Order lunch", "Ambulate immediately"], "a": 0, "r": "Airway, breathing, circulation first."}, {"d": 2, "q": "The best way to prevent post-operative atelectasis is:", "o": ["Deep breathing, coughing and incentive spirometry", "Bed rest", "Limit fluids", "Sedation"], "a": 0, "r": "Encourage lung expansion every 1–2 hours."}, {"d": 2, "q": "Signs of wound dehiscence include:", "o": ["Sudden serosanguineous drainage and a feeling of 'giving way'", "Mild pink edges", "Dry dressing", "No pain"], "a": 0, "r": "Cover with saline-moistened sterile dressing, keep patient calm, notify surgeon."}, {"d": 2, "q": "Evisceration requires which first action?", "o": ["Cover with sterile moist saline dressing and notify the surgeon", "Push the organs back", "Apply dry dressing", "Encourage ambulation"], "a": 0, "r": "Place in low Fowler's with knees bent; emergency."}, {"d": 2, "q": "Which sign suggests a surgical site infection?", "o": ["Redness, warmth, purulent drainage, fever", "Clear healing ridge", "Mild bruising day 1", "Normal itch"], "a": 0, "r": "Local and systemic infection signs."}, {"d": 2, "q": "Before surgery, the nurse must verify:", "o": ["Informed consent, NPO status, and site marking", "Favorite colour", "Visitor list", "Meal choices"], "a": 0, "r": "Pre-op checklist."}, {"d": 2, "q": "The correct preoperative fasting for solid food before elective general anesthesia is about:", "o": ["6 hours", "30 minutes", "1 hour", "24 hours"], "a": 0, "r": "6 hours for solids; 2 hours for clear fluids (per ASA)."}, {"d": 2, "q": "Which is a risk factor for deep vein thrombosis post-operatively?", "o": ["Immobility and surgery", "Early ambulation", "Hydration", "Compression stockings"], "a": 0, "r": "Prevent with mobility, SCDs, anticoagulants."}, {"d": 2, "q": "Which sign is characteristic of DVT?", "o": ["Unilateral calf swelling, warmth, pain", "Bilateral coolness", "Pallor and pulselessness", "Normal limb"], "a": 0, "r": "Do not massage the limb."}, {"d": 2, "q": "Which is the correct way to use crutches on stairs when going UP?", "o": ["Good leg first, then crutches and bad leg", "Crutches first", "Bad leg first", "Hop"], "a": 0, "r": "'Up with the good, down with the bad.'"}, {"d": 2, "q": "For a patient with a cast, which finding should be reported immediately?", "o": ["Pain unrelieved by analgesia, numbness, cool pale toes", "Cast is dry", "Mild itching", "Slight warmth after application"], "a": 0, "r": "Signs of compartment syndrome / neurovascular compromise."}, {"d": 2, "q": "Compartment syndrome is characterized by the '5 Ps' EXCEPT:", "o": ["Pleasure", "Pain", "Pallor", "Paresthesia"], "a": 0, "r": "Pain, pallor, pulselessness, paresthesia, paralysis."}, {"d": 2, "q": "A patient with a new colostomy: the stoma should appear:", "o": ["Pink to red and moist", "Dark purple or black", "Pale white", "Dry and cracked"], "a": 0, "r": "Dark stoma suggests ischemia—report."}, {"d": 2, "q": "Which diet is recommended for a patient with GERD?", "o": ["Avoid spicy, fatty foods and late meals; elevate head of bed", "Large meals before sleep", "Coffee and chocolate", "Lie flat after meals"], "a": 0, "r": "Lifestyle modification."}, {"d": 2, "q": "A patient with acute pancreatitis should be managed with:", "o": ["NPO, IV fluids and analgesia", "High-fat diet", "Alcohol", "Oral feeds immediately"], "a": 0, "r": "Rest the pancreas."}, {"d": 2, "q": "Elevated serum amylase and lipase suggest:", "o": ["Pancreatitis", "Hepatitis", "Appendicitis", "Cholecystitis only"], "a": 0, "r": "Lipase is more specific."}, {"d": 2, "q": "Which is a priority for a patient with a bowel obstruction?", "o": ["NPO, nasogastric decompression, IV fluids", "Laxatives", "High-fiber diet", "Enemas"], "a": 0, "r": "Relieve pressure and replace fluids."}, {"d": 2, "q": "A patient with ulcerative colitis experiences:", "o": ["Bloody diarrhea with abdominal cramps", "Constipation only", "Weight gain", "Normal stools"], "a": 0, "r": "Inflammatory bowel disease; monitor fluids and electrolytes."}, {"d": 2, "q": "Which of the following is a sign of hyperthyroidism?", "o": ["Weight loss, heat intolerance, tachycardia", "Weight gain, cold intolerance", "Bradycardia, lethargy", "Dry skin"], "a": 0, "r": "Graves' disease etc."}, {"d": 2, "q": "Myxedema (hypothyroidism) is characterized by:", "o": ["Fatigue, cold intolerance, weight gain, bradycardia", "Tremors", "Exophthalmos only", "Diarrhea"], "a": 0, "r": "Slow metabolism."}, {"d": 2, "q": "Addisonian crisis requires immediate administration of:", "o": ["IV hydrocortisone and fluids", "Insulin", "Levothyroxine", "Beta blockers"], "a": 0, "r": "Adrenal insufficiency emergency."}, {"d": 2, "q": "Cushing's syndrome presents with:", "o": ["Moon face, buffalo hump, hyperglycemia, hypertension", "Weight loss and hypotension", "Hypoglycemia", "Bronze skin"], "a": 0, "r": "Excess cortisol."}, {"d": 2, "q": "Which is a sign of increased blood glucose (hyperglycemia)?", "o": ["Polyuria, polydipsia, polyphagia", "Tremor and sweating", "Hypotension", "Cool clammy skin"], "a": 0, "r": "The 3 Ps."}, {"d": 2, "q": "Which patient teaching is correct for insulin storage?", "o": ["Unopened insulin should be refrigerated; the in-use vial can be kept at room temperature for up to 28 days", "Freeze insulin", "Shake the vial vigorously", "Keep in direct sunlight"], "a": 0, "r": "Check manufacturer's instructions."}, {"d": 2, "q": "Which is the best site rotation practice for insulin injection?", "o": ["Rotate within the same body region to ensure consistent absorption", "Inject in the same spot always", "Inject through clothing", "Choose random regions daily"], "a": 0, "r": "Abdomen absorbs fastest; rotate within region."}, {"d": 2, "q": "A patient on chemotherapy has a neutrophil count of 400/mm³. Which action is a priority?", "o": ["Protective (neutropenic) precautions", "Encourage visitors", "Fresh flowers", "Raw vegetables"], "a": 0, "r": "Neutropenia raises infection risk."}, {"d": 2, "q": "The priority nursing action for suspected extravasation of a chemotherapy drug is to:", "o": ["Stop the infusion, leave the cannula in place, and notify the provider", "Flush rapidly", "Remove cannula and apply heat", "Continue"], "a": 0, "r": "Aspirate the drug if possible and follow the policy."}, {"d": 2, "q": "Which is the most appropriate comfort measure for a dying patient?", "o": ["Provide pain control, mouth care, and presence", "Withhold analgesia", "Restrict visitors", "Avoid conversation"], "a": 0, "r": "Palliative care focuses on comfort and dignity."}, {"d": 2, "q": "A patient is receiving a continuous insulin infusion. Which monitoring is MOST important?", "o": ["Hourly blood glucose and serum potassium", "Daily weight only", "Urine colour", "Blood pressure once per shift"], "a": 0, "r": "Insulin infusions require frequent glucose checks, and insulin drives potassium into cells so potassium must be monitored."}, {"d": 2, "q": "A 65-year-old with COPD becomes drowsy and confused after receiving oxygen at 6 L/min by mask. SpO2 is 99%. What is the likely cause and best action?", "o": ["CO2 retention from excess oxygen; reduce oxygen to target 88–92% and notify the doctor", "Hypoglycaemia; give insulin", "Anxiety; sedate", "Normal; continue"], "a": 0, "r": "High oxygen can worsen CO2 retention in chronic hypercapnia."}, {"d": 2, "q": "A patient with heart failure gains 2 kg in 24 hours and has ankles swollen. Which is the MOST appropriate action?", "o": ["Report to the prescriber, as diuretic adjustment may be needed", "Encourage extra fluids", "Reduce activity only", "Document only"], "a": 0, "r": "Rapid weight gain suggests fluid retention."}, {"d": 2, "q": "A patient admitted with chest pain has ST elevation in leads II, III and aVF. Which coronary territory is most likely affected?", "o": ["Inferior wall", "Anterior wall", "Lateral wall", "Post
