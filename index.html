ion (promotes microvascular flow), effective pain control (opioids), and oxygen administration if hypoxemic. Ice packs are contraindicated as cold causes vasospasm and increased sickling."}, {"d": 4, "q": "[Pediatric Case 99] Which intramuscular (IM) injection site is preferred for administering vaccines to an infant under 12 months of age?", "o": ["Vastus lateralis muscle in the anterolateral thigh", "Deltoid muscle", "Dorsogluteal site", "Ventrogluteal site"], "a": 0, "r": "The vastus lateralis muscle in the anterolateral thigh is the largest and safest IM injection site in infants under 12 months."}, {"d": 4, "q": "[Pediatric Case 100] A 3-year-old child is brought to the ER with multiple bruises in various stages of healing, patterned cigarette burn marks on the soles, and retinal hemorrhages. The caregiver's explanation is inconsistent with the injuries. What is the nurse's legal obligation?", "o": ["Report the suspected child abuse immediately to child protective services / hospital authorities", "Confront the caregiver aggressively in the waiting room", "Discharge the child with pain medication and schedule a 1-month follow-up", "Wait for the child to confess before taking action"], "a": 0, "r": "Healthcare professionals are mandatory reporters. Suspected child abuse (injuries inconsistent with history, patterned burns, retinal hemorrhages) requires immediate reporting to child protective authorities."}, {"d": 5, "q": "A patient admitted with major depressive disorder states: 'I feel hopeless and everyone would be better off if I were dead.' What is the nurse's FIRST action?", "o": ["Ask directly: 'Are you thinking of killing yourself, and do you have a specific plan?'", "Reassure the patient by saying 'Things will look brighter tomorrow'", "Leave the patient alone to rest quietly in a private room", "Administer a PRN dose of Lorazepam"], "a": 0, "r": "Direct inquiry regarding suicidal ideation ('Do you have a plan? What means do you intend to use?') is essential. Assessing lethality and establishing safety precautions (1:1 observation) is the immediate priority."}, {"d": 5, "q": "A patient diagnosed with paranoid schizophrenia tells the nurse: 'The voices are telling me to poison my roommate's food tonight.' How should the nurse classify and respond to this statement?", "o": ["Command hallucinations requiring immediate risk assessment and strict safety precautions", "Delusion of grandeur requiring gentle reality orientation", "Flight of ideas requiring reduced stimulation", "Negative symptom requiring encouragement"], "a": 0, "r": "Command hallucinations ordering harm to self or others present a high risk for violence. The nurse must assess the hallucination, protect the safety of all patients, and initiate safety protocols."}, {"d": 5, "q": "A patient receiving Clozapine for treatment-resistant schizophrenia undergoes routine lab testing. Which lab result requires WITHHOLDING the medication and urgent notification?", "o": ["Absolute Neutrophil Count (ANC) of 800/mm\u00b3", "Serum Sodium of 138 mEq/L", "Hemoglobin of 13.5 g/dL", "Blood Glucose of 110 mg/dL"], "a": 0, "r": "Clozapine carries a severe risk of agranulocytosis. Regular ANC monitoring is mandatory. An ANC <1000/mm\u00b3 (neutropenia) mandates immediate cessation of Clozapine to prevent life-threatening infection."}, {"d": 5, "q": "A patient taking Haloperidol develops severe 'lead-pipe' muscle rigidity, a temperature of 39.8\u00b0C, diaphoresis, labile blood pressure, and confusion. What life-threatening condition is suspected?", "o": ["Neuroleptic Malignant Syndrome (NMS)", "Serotonin Syndrome", "Tardive Dyskinesia", "Acute Dystonia"], "a": 0, "r": "NMS is a medical emergency caused by antipsychotic dopamine blockade, characterized by severe muscle rigidity, hyperthermia, autonomic instability, and altered consciousness. Immediate action: stop antipsychotic, cool patient, notify provider."}, {"d": 5, "q": "A patient receiving Haloperidol for 3 days develops an acute involuntary spasm of the neck muscles (torticollis) and eye deviation upward (oculogyric crisis). What medication should the nurse anticipate?", "o": ["Benztropine 2 mg IM", "Haloperidol 5 mg IV", "Lithium Carbonate 300 mg PO", "Propanolol 40 mg PO"], "a": 0, "r": "Acute dystonia is an extrapyramidal side effect of antipsychotics involving involuntary muscle contractions. It is treated promptly with an anticholinergic agent (Benztropine or Diphenhydramine)."}, {"d": 5, "q": "A patient in the manic phase of Bipolar I Disorder is hyperactive, pacing the unit continuously, shouting grandiosely, and has not eaten for 24 hours. What is the MOST appropriate nursing intervention?", "o": ["Provide portable, high-calorie, high-protein finger foods and maintain a low-stimulation environment", "Insist that the patient sit at the dining table for 30 minutes during meals", "Place the patient in seclusion until behavior improves", "Encourage participation in competitive group sports"], "a": 0, "r": "Manic patients cannot sit still to eat full meals. Providing high-calorie portable finger foods (sandwiches, cheese, fruit) allows nutrition while mobile, and a low-stimulation environment reduces hyperactivity."}, {"d": 5, "q": "A patient taking Lithium Carbonate for bipolar disorder presents with coarse hand tremors, severe ataxia, persistent diarrhea, and confusion. Serum Lithium level is 2.1 mEq/L. How should the nurse interpret this?", "o": ["Lithium toxicity requiring immediate withholding of the drug and medical evaluation", "Normal therapeutic lithium blood level", "Mild expected side effect requiring no action", "Subtherapeutic level requiring dose increase"], "a": 0, "r": "Therapeutic Lithium level is 0.6 to 1.2 mEq/L. Levels >1.5 mEq/L cause toxicity (coarse tremors, GI distress, ataxia, confusion, seizures). Low sodium intake or dehydration increases lithium levels."}, {"d": 5, "q": "A patient with severe alcohol dependence is admitted to the medical unit. Forty-eight hours after his last drink, he develops gross tremors, profuse sweating, visual hallucinations, BP 180/110 mmHg, and confusion. What condition is present?", "o": ["Delirium Tremens (DTs)", "Wernicke Encephalopathy", "Opioid Withdrawal Syndrome", "Hepatic Encephalopathy"], "a": 0, "r": "Delirium Tremens (DTs) is a severe, life-threatening alcohol withdrawal reaction occurring 48-96 hours after cessation, characterized by autonomic hyperactivity, confusion, and hallucinations. Treated with IV Benzodiazepines."}, {"d": 5, "q": "Prior to administering an IV glucose solution to an malnourished patient with chronic alcohol use disorder, what vitamin MUST be administered FIRST to prevent Wernicke's Encephalopathy?", "o": ["Thiamine (Vitamin B1) IV", "Vitamin C IV", "Vitamin K IM", "Folic Acid PO"], "a": 0, "r": "In alcohol dependence, administering carbohydrate/glucose without prior Thiamine (Vitamin B1) supplementation precipitates acute Wernicke's Encephalopathy (ataxia, ophthalmoplegia, confusion)."}, {"d": 5, "q": "A patient presenting with acute heroin overdose has a respiratory rate of 6 breaths/min, stupor, and pinpoint pupils. What is the immediate life-saving antagonist?", "o": ["Naloxone IV", "Flumazenil IV", "Atropine IV", "Protamine Sulfate IV"], "a": 0, "r": "Naloxone is an opioid antagonist that rapidly reverses opioid-induced respiratory depression and coma."}, {"d": 5, "q": "[Psych Scenario 11] A patient admitted with major depressive disorder states: 'I feel hopeless and everyone would be better off if I were dead.' What is the nurse's FIRST action?", "o": ["Ask directly: 'Are you thinking of killing yourself, and do you have a specific plan?'", "Reassure the patient by saying 'Things will look brighter tomorrow'", "Leave the patient alone to rest quietly in a private room", "Administer a PRN dose of Lorazepam"], "a": 0, "r": "Direct inquiry regarding suicidal ideation ('Do you have a plan? What means do you intend to use?') is essential. Assessing ion", "Primary Prevention", "Secondary Prevention", "Disease Surveillance"], "a": 0, "r": "Tertiary prevention aims to manage established chronic disease, minimize disability, and restore maximum function through rehabilitation."}, {"d": 6, "q": "During a Dengue fever outbreak in a municipality, what community vector control measure should the public health nurse advocate FIRST?", "o": ["Eliminating open standing water containers where Aedes mosquitoes breed", "Distributing oral prophylactic antibiotics to all residents", "Closing all public schools and markets", "Spraying indoor air with disinfectant foam"], "a": 0, "r": "Dengue is transmitted by Aedes mosquitoes. The primary environmental control strategy is eliminating standing water in containers, tires, and pots where larvae develop."}, {"d": 6, "q": "An 82-year-old resident in a long-term care facility develops sudden new onset confusion, agitation, and disorientation over 4 hours. She has no fever or cough. What condition should the nurse suspect FIRST?", "o": ["Acute Urinary Tract Infection (UTI) or systemic infection manifesting as Delirium", "Normal age-related cognitive decline", "Alzheimer's Dementia progression", "Major Depressive Disorder"], "a": 0, "r": "In older adults, acute confusion/delirium is frequently the primary or ONLY presenting symptom of an underlying infection (such as a UTI or pneumonia) or drug toxicity."}, {"d": 6, "q": "To reduce fall risk at home for an 80-year-old client with osteoarthritic knees, which home modification should the nurse recommend?", "o": ["Removing all loose throw/scatter rugs, installing bathroom grab bars, and ensuring adequate lighting", "Polishing wooden floors to a smooth shine", "Keeping room lighting dim at all times to conserve energy", "Placing small low furniture obstacles in walkways"], "a": 0, "r": "Environmental risk reduction (removing loose rugs, installing grab bars in tub/toilet, providing non-skid footwear, and maintaining good lighting) significantly reduces elderly fall injuries."}, {"d": 6, "q": "An elderly patient on 7 different daily medications reports dizziness upon standing up from bed. Vital signs show BP 138/80 mmHg lying and 112/66 mmHg standing. What is the nurse's BEST guidance?", "o": ["Dangle legs on the edge of the bed for 1-2 minutes before standing up slowly", "Remain in bed continuously to avoid standing", "Increase daily salt intake significantly", "Stop taking all blood pressure medications immediately"], "a": 0, "r": "Orthostatic hypotension (SBP drop \u226520 mmHg) causes postural dizziness. Teaching patients to sit on the bed edge ('dangle') prior to standing allows vascular autoregulation."}, {"d": 6, "q": "A patient with advanced vascular dementia becomes increasingly agitated, restless, and confused every day around 5:00 PM as darkness falls. What phenomenon is occurring?", "o": ["Sundowning Syndrome", "Acute Delirium", "Wernicke Encephalopathy", "Catatonia"], "a": 0, "r": "Sundowning Syndrome refers to increased confusion and agitation occurring in late afternoon/evening in patients with dementia. Managed with predictable routines and adequate ambient lighting."}, {"d": 6, "q": "A terminal cancer patient receiving hospice care reports severe breakthrough pain rated 9/10. What is the appropriate palliative pain management approach?", "o": ["Administer scheduled around-the-clock opioids with additional short-acting breakthrough doses as ordered", "Withhold opioids until the patient is completely unable to tolerate pain", "Administer analgesics only when the patient explicitly begs for medication", "Replace opioids with mild oral antacids"], "a": 0, "r": "Palliative pain management emphasizes scheduled around-the-clock analgesia to maintain therapeutic blood levels, supplemented by short-acting breakthrough PRN doses. Addiction concerns do not apply in end-of-life care."}, {"d": 6, "q": "A nurse in Oman is providing end-of-life care for a Muslim patient. Which culturally sensitive p requested", "Mandating embalming immediately after death", "Prohibiting family members from touching the deceased", "Requiring a male doctor to bathe female patients post-mortem"], "a": 0, "r": "Cultural competence in Gulf/Omani healthcare involves respecting Islamic end-of-life traditions: facilitating family presence for prayer/Quran, respecting modesty, providing same-gender post-mortem care, and supporting prompt burial."}];
const PER_SET=100, MIN_PER_Q=1.5, DEFAULT_PASS=60;
const LS='omsb-nursing-v1';
const $=s=>document.querySelector(s);
const app=$('#app');
let S={view:'home',cfg:{pick:'set0',mode:'exam'}};
let timer=null;

function hist(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function saveHist(r){try{const h=hist();h.unshift(r);localStorage.setItem(LS,JSON.stringify(h.slice(0,30)))}catch(e){}}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Sets: dynamic OMSB blueprint sets
const byDom=DOMAINS.map((_,d)=>BANK.map((q,i)=>({...q,id:i})).filter(q=>q.d===d));
const QUOTA=[20,5,30,10,10,10,15]; // OEN blueprint per 100 questions
const NUM_SETS=Math.min(...byDom.map((l,d)=>Math.floor(l.length/QUOTA[d])));
const SETS=Array.from({length:NUM_SETS},(_,s)=>byDom.flatMap((list,d)=>list.slice(s*QUOTA[d],(s+1)*QUOTA[d])));
function weighted(seed){const r=seed?rng(seed):Math.random;return byDom.flatMap((list,d)=>shuffle(list,r).slice(0,QUOTA[d]));}
const PICKS=[
  ...SETS.map((q,i)=>({id:'set'+i,name:'Set '+(i+1),sub:q.length+' questions, weighted blueprint'})),
  {id:'rand',name:'Random 100',sub:'New weighted mix each time'},
  {id:'full',name:'Full bank',sub:BANK.length+' questions, long session'},
  ...DOMAINS.map((n,d)=>({id:'dom'+d,name:n,sub:byDom[d].length+' questions, one domain'}))
];
function questionsFor(id){
  if(id.startsWith('set'))return SETS[+id.slice(3)];
  if(id==='rand')return weighted();
  if(id==='full')return BANK.map((q,i)=>({...q,id:i}));
  return byDom[+id.slice(3)];
}
function startExam(){
  const base=questionsFor(S.cfg.pick);
  const seed=Date.now();const r=rng(seed);
  const qs=shuffle(base,r).map(q=>{
    const noShuf=q.o.some(t=>/^(both|all of|none of)/i.test(t));
    const order=noShuf?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i),r);
    return{...q,opts:order.map(i=>q.o[i]),key:order.indexOf(q.a)};
  });
  const secs=Math.round(qs.length*MIN_PER_Q*60);
  S={view:'intro',cfg:S.cfg,qs,ans:Array(qs.length).fill(null),flag:Array(qs.length).fill(false),i:0,left:secs,total:secs,
     mode:S.cfg.mode,stage:'q',popup:false,notes:Array(qs.length).fill(''),notesOpen:false,showTime:true,rf:'all',t0:Date.now(),title:PICKS.find(p=>p.id===S.cfg.pick).name};
  clearInterval(timer);
  render();
}
function tick(){S.left--;if(S.left<=0){S.left=0;finish();return}const t=$('#timer');if(t){t.textContent=fmt(S.left);t.classList.toggle('low',S.left<300)}}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}

function finish(){
  clearInterval(timer);
  const n=S.qs.length;let c=0;const dm=DOMAINS.map(()=>({c:0,n:0}));
  S.qs.forEach((q,i)=>{dm[q.d].n++;if(S.ans[i]===q.key){c++;dm[q.d].c++}});
  const pct=Math.round(c/n*1000)/10;
  const used=Math.round((Date.now()-S.t0)/1000);
  saveHist({t:Date.now(),name:S.title,mode:S.mode,c,n,pct,used});
  S={...S,view:'result',c,n,pct,dm,used,passMark:DEFAULT_PASS,filter:'all'};
  render();window.scrollTo(0,0);
}

function pick(i){
  if(S.mode==='practice'&&S.ans[S.i]!==null){return}
  S.ans[S.i]=i;render();
}

function home(){
  const h=hist();

      <button id="m-exam" aria-pressed="${S.cfg.mode==='exam'}">Exam mode</button><button id="m-prac" aria-pressed="${S.cfg.mode==='practice'}">Practice mode</button></div></div>
    <p class="small muted">${S.cfg.mode==='exam'?'Timed like the real test: 100 questions in 2 hours 30 minutes. No answers shown until you finish.':'Untimed. The correct answer and rationale appear as soon as you choose. Use this for learning.'}</p>

  ${h.length?`<div class="panel stack"><h3>Your recent attempts</h3><div class="scroll"><table><thead><tr><th>Date</th><th>Paper</th><th>Mode</th><th>Score</th></tr></thead><tbody>${h.slice(0,8).map(x=>`<tr><td>${new Date(x.t).toLocaleDateString()}</td><td>${x.name}</td><td>${x.mode}</td><td>${x.c}/${x.n} (${x.pct}%)</td></tr>`).join('')}</tbody></table></div></div>`:''}
  </div>`;
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.cfg.pick=b.dataset.pick;home()});

function pcard(p){return`<button class="card" data-pick="${p.id}" aria-pressed="${S.cfg.pick===p.id}"><b>${p.name}</b><span>${p.sub}</span></button>`}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function beginExam(){
  S.view='exam';S.stage='q';S.t0=Date.now();clearInterval(timer);

}

function head(q){

function exam(){
  if(S.stage==='review')return reviewScreen();

  const q=S.qs[S.i],a=S.ans[S.i],prac=S.mode==='practice',shown=prac&&a!==null,L='ABCD';
  app.innerHTML=`<div class="vue">${head(true)}
  <div class="subbar"><span class="muted small">${prac?DOMAINS[q.d]:'Select the best answer.'}</span>
    <button class="btn flagbtn" id="flag" aria-pressed="${S.flag[S.i]}">${S.flag[S.i]?'&#9873; Flagged for review':'&#9873; Flag for Review'}</button></div>

    <div class="opts" role="radiogroup">${q.opts.map((t,i)=>{
      let c='opt';if(shown){if(i===q.key)c+=' ok';else if(i===a)c+=' no'}else if(i===a)c+=' sel';
      return`<button class="${c}" role="radio" aria-checked="${i===a}" data-i="${i}"><span class="k"></span><span><b>${L[i]}.</b> ${esc(t)}</span></button>`}).join('')}</div>
    ${shown?`<div class="fb ${a===q.key?'':'no'}"><b>${a===q.key?'Correct.':'Incorrect. Answer: '+L[q.key]+'.'}</b> ${esc(q.r)}</div>`:''}

      <div class="small">Your answer: ${a===null?'<b>not answered</b>':`<b style="color:var(${a===q.key?'--good':'--bad'})">${L[a]}. ${esc(q.opts[a])}</b>`}</div>

  <div class="row"><button class="btn primary" id="again">Take another paper</button></div></div>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;result()});
  $('#pm').onchange=e=>{S.passMark=Math.max(1,Math.min(100,+e.target.value||DEFAULT_PASS));result()};
  $('#again').onclick=()=>{S={view:'home',cfg:S.cfg};render()};
}
function render(){if(S.view==='home')home();else if(S.view==='intro')intro();else if(S.view==='exam')exam();else result()}
document.addEventListener('keydown',e=>{
  if(S.view!=='exam'||S.stage!=='q'||S.popup||['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k)&&k.length===1){const i='abcd'.indexOf(k);if(i<S.qs[S.i].opts.length)pick(i)}
  else if(e.key==='ArrowRight'){if(S.i<S.qs.length-1)go(S.i+1);else{S.stage='review';S.rf='all';render()}}else if(e.key==='ArrowLeft')go(S.i-1);
  else if(k==='f'){S.flag[S.i]=!S.flag[S.i];render()}
});
render();
</script>
</body></html>
