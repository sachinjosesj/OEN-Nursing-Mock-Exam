d edema, severe hypoalbuminemia, and massive proteinuria (4+ on dipstick). The child's blood pressure is normal. What is the most likely diagnosis?", "o": ["Nephrotic Syndrome", "Acute Post-Streptococcal Glomerulonephritis (APSGN)", "Hemolytic Uremic Syndrome (HUS)", "Urinary Tract Infection (UTI)"], "a": 0, "r": "The hallmark of Nephrotic Syndrome is massive, severe proteinuria causing profound hypoalbuminemia and massive generalized edema. Unlike APSGN, the blood pressure is usually normal, and there is no gross hematuria (cola-colored urine)."}, {"d": 4, "q": "A 2-year-old child presents to the emergency department with a sudden onset of a harsh, 'barking' seal-like cough, hoarseness, and inspiratory stridor. The child does not have a high fever. What respiratory condition is most likely?", "o": ["Laryngotracheobronchitis (Viral Croup)", "Acute Epiglottitis", "Pertussis (Whooping Cough)", "Foreign body aspiration"], "a": 0, "r": "Viral croup classically affects children aged 6 months to 3 years. It is characterized by severe inflammation of the larynx and trachea, producing the hallmark 'seal-like barking' cough, hoarseness, and inspiratory stridor, which is usually worse at night."}, {"d": 4, "q": "A 12-month-old infant is diagnosed with an acute otitis media (ear infection). The nurse is teaching the parents how to administer the prescribed antibiotic ear drops. What is the correct anatomical technique for an infant?", "o": ["Pull the pinna (auricle) of the ear DOWN and BACK to straighten the ear canal", "Pull the pinna (auricle) of the ear UP and BACK to straighten the ear canal", "Push the tragus firmly into the ear canal before dropping the medication", "Insert the dropper deeply into the ear canal to bypass the eardrum"], "a": 0, "r": "In infants and children under the age of 3, the Eustachian tube and ear canal are short and straight. To properly straighten the canal for medication administration, the nurse must pull the pinna DOWN and BACK. (For adults and children over 3, it is UP and BACK)."}, {"d": 4, "q": "A 1-month-old infant is admitted with suspected developmental dysplasia of the hip (DDH). The physician performs the Ortolani maneuver. What specifically is the examiner feeling for to confirm a positive Ortolani sign?", "o": ["A palpable 'clunk' as the dislocated femoral head slips back into the acetabulum during hip abduction", "A loud 'click' sound coming from the knee joint", "The absolute inability to bend the infant's knee past 90 degrees", "Symmetrical lengthening of both legs"], "a": 0, "r": "The Ortolani maneuver physically REDUCES a dislocated hip. The examiner abducts the infant's thighs while applying upward pressure over the greater trochanter. A positive sign is a distinct, palpable (and sometimes audible) 'clunk' as the femoral head pops back into the socket."}, {"d": 4, "q": "A 5-year-old child presents to the ER with a sudden onset of a high fever, 'strawberry tongue', bright red cracked lips, and severe peeling (desquamation) of the skin on the hands and feet. What is the most feared, life-threatening complication of this disease?", "o": ["Coronary artery aneurysms leading to myocardial infarction", "Complete, irreversible renal failure", "Massive, fatal pulmonary hemorrhage", "Permanent sensorineural hearing loss"], "a": 0, "r": "This is the classic presentation of Kawasaki Disease, a massive systemic vasculitis. If not treated rapidly with IVIG and high-dose aspirin, the severe inflammation destroys the walls of the coronary arteries, causing massive aneurysms that can easily rupture or clot, leading to a fatal pediatric heart attack."}, {"d": 4, "q": "A 2-year-old child presents to the emergency room with a sudden, harsh 'barking' cough, hoarseness, and inspiratory stridor. The child has a low-grade fever. What is the most appropriate initial treatment the nurse should anticipate?", "o": ["Administration of cool mist humidification and oral/IV Corticosteroids (e.g., Dexamethasone)", "Immediate endotracheal intubation in the operating room", "Administration of a broad-spectrum IV antibiotic", "Vigorous deep suctioning of the pharynx"], "a": 0, "r": "This is the classic presentation of Viral Croup (Laryngotracheobronchitis). It is caused by a virus (so antibiotics are useless), and it causes massive subglottic swelling. The standard initial treatment is exposing the child to cool, humidified air (which physically shrinks the swollen mucosa) and administering a strong corticosteroid (Dexamethasone) to massively reduce the airway inflammation."}, {"d": 4, "q": "A 6-month-old infant is diagnosed with an intussusception. The infant is experiencing colicky abdominal pain and vomiting. What classic, hallmark sign will the nurse likely observe when assessing the infant's diaper?", "o": ["'Currant jelly' stools (a mixture of blood and mucus)", "White, clay-colored stools", "Ribbon-like, foul-smelling stools", "Frothy, fatty, floating stools (steatorrhea)"], "a": 0, "r": "Intussusception occurs when the bowel telescopes into itself. The pressure causes the walls of the bowel to rub together, leading to severe ischemia, inflammation, and bleeding. The sloughing mucosa mixes with the blood, producing the pathognomonic 'currant jelly' stool. (Ribbon-like stool is Hirschsprung's; fatty stool is CF/Celiac)."}, {"d": 4, "q": "A 3-year-old child is brought to the ER with a sudden onset of high fever, severe sore throat, drooling, and extreme difficulty swallowing (dysphagia). The child is sitting upright, leaning forward with their chin thrust out. What is this position called, and what does it indicate?", "o": ["The Tripod position; indicates severe airway obstruction likely due to Acute Epiglottitis", "The Decerebrate position; indicates severe brainstem damage", "The Knee-Chest position; indicates a Tetralogy of Fallot hypercyanotic spell", "The Sniffing position; indicates normal recovery from croup"], "a": 0, "r": "The 'Tripod' position (sitting upright, leaning forward, chin thrust out, mouth open) is a classic compensatory posture used by a child to maximize airway opening when they are suffering from severe, life-threatening upper airway obstruction, most commonly seen in Acute Epiglottitis."}, {"d": 4, "q": "A 5-year-old child is admitted with Kawasaki Disease. The child has been receiving high-dose Aspirin therapy. The nurse knows that giving Aspirin to a child with a viral illness normally carries a massive risk for which fatal condition?", "o": ["Reye's Syndrome (acute encephalopathy and massive fatty liver degeneration)", "Guillain-Barré Syndrome (ascending paralysis)", "Stevens-Johnson Syndrome (severe skin sloughing)", "Hemolytic Uremic Syndrome (acute kidney failure)"], "a": 0, "r": "Aspirin is almost universally contraindicated in children, especially those with viral illnesses (like flu or chickenpox), because it can trigger Reye's Syndrome—a rapidly fatal condition causing massive cerebral edema (encephalopathy) and acute liver failure. Kawasaki Disease is the rare exception where the risk of fatal coronary aneurysms outweighs the risk of Reye's."}, {"d": 4, "q": "A 3-month-old infant presents to the pediatric clinic with an incredibly large, rapidly growing head. The nurse assesses the infant and notes bulging anterior fontanelles, widely separated cranial sutures, and eyes that appear to be looking downward with the sclera visible above the iris. What is this distinct eye sign called, and what condition does it indicate?", "o": ["'Setting Sun' sign; indicates severe Hydrocephalus (increased ICP)", "Strabismus; indicates normal newborn eye muscle weakness", "Nystagmus; indicates a severe brainstem tumor", "Ptosis; indicates Myasthenia Gravis"], "a": 0, "r": "The 'Setting Sun' sign (downward deviation of the eyes with white sclera visible above the iris) is a classic, late sign of severely increased intracranial pressure in infants, almost always due to massive Hydrocephalus (accumulation of CSF in the brain ventricles causing the head to swell)."}, {"d": 4, "q": "A pediatric nurse is providing discharge teaching to the parents of a newborn diagnosed with Hirschsprung's Disease who is awaiting corrective surgery. Which classic description of the infant's stool should the nurse ask the parents to monitor for?", "o": ["Ribbon-like, incredibly foul-smelling stools", "'Currant jelly' stools mixed with blood and mucus", "Profuse, watery, green diarrhea", "White, chalky, clay-colored stools"], "a": 0, "r": "Hirschsprung's disease is a congenital absence of ganglion (nerve) cells in the lower colon, preventing normal peristalsis. Stool backs up, causing massive megacolon. When stool is forced through the narrow, paralyzed section of the bowel, it comes out looking thin and ribbon-like, and it is distinctively foul-smelling."}, {"d": 4, "q": "A 4-month-old infant is admitted to the pediatric unit with suspected increased Intracranial Pressure (ICP) from hydrocephalus. Which specific, classic assessment finding would the nurse expect to observe in an infant with rising ICP?", "o": ["A bulging, tense anterior fontanelle, separated cranial sutures, and a high-pitched, 'cat-like' cry", "A severely sunken anterior fontanelle and profound lethargy", "A heart rate over 180 bpm and rapid, shallow breathing", "A stiff neck (nuchal rigidity) and a positive Kernig's sign"], "a": 0, "r": "In infants, the cranial sutures have not yet fused. As fluid and pressure build up inside the skull (hydrocephalus), the head physically expands. Hallmark early signs include a tense, bulging anterior fontanelle, increasing head circumference, prominent scalp veins, and an irritable, shrill, high-pitched cry."}, {"d": 4, "q": "A 9-month-old infant presents to the emergency department with sudden, severe, colicky abdominal pain. The infant draws their knees up to their chest and screams. The mother reports the infant recently passed a stool that looked exactly like 'currant jelly.' The physician suspects Intussusception. What is the standard, first-line diagnostic AND therapeutic intervention for this condition?", "o": ["A pneumatic (air) or hydrostatic (barium/saline) enema", "Immediate, open exploratory laparotomy surgery", "Administration of a powerful laxative (GoLytely)", "Insertion of a nasogastric tube to high wall suction"], "a": 0, "r": "Intussusception is the telescoping of the bowel into itself. The pressure causes bleeding and mucosal sloughing, creating the classic 'currant jelly' stool. In many cases, administering an air or contrast enema under fluoroscopy creates enough backward pressure in the colon to literally 'pop' the telescoped bowel back into its normal place, serving as both the diagnosis and the cure."}, {"d": 4, "q": "A pediatric nurse is reviewing the chart of a newborn. The newborn underwent a specific, definitive diagnostic test to confirm Cystic Fibrosis. The test results showed a chloride concentration of 75 mEq/L (normal is < 40 mEq/L). What is the name of this gold-standard diagnostic test?", "o": ["The Quantitative Sweat Chloride Test (Pilocarpine Iontophoresis)", "A comprehensive stool culture for fat", "An arterial blood gas (ABG)", "A genetic karyotype blood test"], "a": 0, "r": "Cystic fibrosis is caused by a defect in the CFTR protein, which severely impairs the transport of chloride across cell membranes. This causes the sweat glands to produce massive amounts of salt. The Sweat Chloride Test is the gold-standard diagnostic tool; a chloride level > 60 mEq/L in the sweat strongly confirms the diagnosis of CF."}, {"d": 4, "q": "A newborn is diagnosed with Transposition of the Great Arteries (TGA). The aorta and pulmonary artery are completely switched, meaning no oxygenated blood is reaching the systemic circulation. To keep the infant alive until corrective surgery can be performed, the physician orders a continuous IV infusion of which medication?", "o": ["Prostaglandin E1 (Alprostadil)", "Indomethacin", "Digoxin", "Ibuprofen"], "a": 0, "r": "In TGA, the pulmonary and systemic circulations run in parallel, entirely separate circuits. Oxygenated blood never reaches the body unless there is a hole connecting the two sides. A continuous infusion of Prostaglandin E1 forces the Ductus Arteriosus to remain open (patent), allowing the blood to mix and sustaining the infant's life until open-heart surgery can switch the arteries."}, {"d": 4, "q": "A 3-year-old child presents to the emergency room with a sudden, extremely high fever, severe sore throat, drooling, and extreme difficulty swallowing. The child is sitting completely upright, leaning forward, with their chin thrust out. What action by the nurse is STRICTLY PROHIBITED?", "o": ["Using a tongue depressor or penlight to aggressively inspect the back of the child's throat", "Administering humidified 100% oxygen via blow-by", "Keeping the child in the arms of the parent to reduce terror and crying", "Ensuring an emergency intubation and tracheostomy kit is immediately outside the door"], "a": 0, "r": "This is the classic presentation of Acute Epiglottitis, a massive, life-threatening bacterial swelling of the airway. The 'tripod' position is a desperate attempt to keep the airway open. Any physical intrusion into the mouth (tongue depressor) or causing the child to panic/cry can trigger an immediate, fatal reflex laryngospasm, slamming the airway completely and irreversibly shut."}, {"d": 4, "q": "A pediatric nurse is providing discharge teaching to the parents of a child diagnosed with Celiac Disease. Which classic dietary acronym should the nurse teach the parents to help them remember which specific grains are strictly prohibited?", "o": ["'BROW' - Barley, Rye, Oats, and Wheat", "'BRAT' - Bananas, Rice, Applesauce, and Toast", "'DASH' - Dietary Approaches to Stop Hypertension", "'FODMAP' - Fermentable Oligo-, Di-, Mono-saccharides And Polyols"], "a": 0, "r": "Celiac disease is a severe autoimmune reaction to gluten. The acronym BROW stands for the primary gluten-containing grains: Barley, Rye, Oats (which are frequently massively cross-contaminated with wheat in processing plants), and Wheat. These must be strictly avoided for the child's entire life."}, {"d": 4, "q": "A pediatric nurse is assessing a newborn diagnosed with Hirschsprung's Disease. The nurse is teaching the parents what symptoms to expect before the corrective surgery. Which classic description of the infant's stool is the hallmark of this disease?", "o": ["Ribbon-like, incredibly foul-smelling stools", "'Currant jelly' stools mixed with blood and mucus", "Profuse, watery, green diarrhea", "White, chalky, clay-colored stools"], "a": 0, "r": "Hirschsprung's disease is a congenital absence of ganglion (nerve) cells in the lower colon, preventing normal peristalsis. Stool backs up, causing massive megacolon. When stool is finally forced through the narrow, paralyzed, aganglionic section of the bowel, it comes out looking thin and ribbon-like, and is distinctively foul-smelling."}, {"d": 4, "q": "A 1-month-old infant is brought to the clinic. The mother states the infant feeds vigorously but then vomits the entire feeding across the room. The nurse palpates a firm, olive-shaped mass in the infant's right upper quadrant. The infant is crying and appears severely dehydrated. What is the most likely diagnosis?", "o": ["Hypertrophic Pyloric Stenosis", "Intussusception", "Hirschsprung's Disease", "Meckel's Diverticulum"], "a": 0, "r": "Projectile, non-bilious vomiting immediately after feeding in a hungry, 3- to 6-week-old infant, combined with a palpable 'olive-shaped' mass in the epigastrium or right upper quadrant, is the classic, pathognomonic presentation of Hypertrophic Pyloric Stenosis."}, {"d": 4, "q": "A 12-month-old infant is brought to the pediatric clinic. The mother states the infant has had a high fever for 5 days, and she noticed a bright red 'strawberry' tongue, severely cracked lips, and swollen, red hands and feet. The physician diagnoses Kawasaki Disease. What is the absolute most critical medical treatment the nurse must anticipate administering to prevent fatal coronary artery aneurysms?", "o": ["High-dose Intravenous Immunoglobulin (IVIG) and high-dose Aspirin", "A 14-day course of broad-spectrum IV antibiotics (e.g., Ceftriaxone)", "High-dose intravenous Corticosteroids (e.g., Methylprednisolone)", "A continuous infusion of Heparin to prevent blood clots"], "a": 0, "r": "Kawasaki Disease is a severe, acute systemic vasculitis. It heavily attacks the coronary arteries. The only definitive treatment proven to halt the massive inflammation and prevent the formation of life-threatening coronary artery aneurysms is the rapid administration of high-dose IVIG combined with high-dose Aspirin (the rare exception to the 'no aspirin in children' rule)."}, {"d": 4, "q": "A pediatric nurse is assessing a newborn. The newborn has failed to pass meconium within the first 48 hours of life. The infant has a distended abdomen and is vomiting bile. A rectal biopsy reveals an absolute absence of ganglion cells in the distal colon. What is this congenital disease?", "o": ["Hirschsprung's Disease (Congenital Aganglionic Megacolon)", "Intussusception", "Hypertrophic Pyloric Stenosis", "Necrotizing Enterocolitis"], "a": 0, "r": "Hirschsprung's Disease is a congenital defect where the nerve cells (ganglion cells) fail to develop in a section of the colon. Without nerves, that section of the bowel cannot perform peristalsis. It acts as a physical roadblock. Stool backs up massively (megacolon), and the hallmark sign in neonates is the failure to pass the first meconium stool."}, {"d": 4, "q": "A pediatric nurse is providing discharge teaching to the parents of a newborn diagnosed with Cystic Fibrosis. Which classic dietary therapy should the nurse teach the parents is absolutely required for the child to absorb nutrients and grow?", "o": ["Administering pancreatic enzyme supplements immediately prior to or directly with every single meal and snack", "Providing a strict low-fat, low-calorie diet to prevent severe obesity", "Administering high-dose insulin before every meal", "Providing a completely gluten-free and dairy-free diet for life"], "a": 0, "r": "Children with Cystic Fibrosis produce incredibly thick, sticky mucus that completely blocks the pancreatic ducts, preventing natural digestive enzymes from reaching the intestines. This causes severe malabsorption of fats and proteins. To grow and thrive, they require a high-calorie, high-protein, high-fat diet, supplemented with artificial pancreatic enzymes (pancrelipase) given directly before or with every meal and snack to break down the food."}, {"d": 4, "q": "A 2-year-old child presents with sudden onset of projectile, non-bilious vomiting after feeds, constant hunger, and weight loss. On palpation, the nurse detects an olive-shaped mass in the epigastrium. What condition does this describe?", "o": ["Hypertrophic Pyloric Stenosis", "Intussusception", "Hirschsprung's Disease", "Gastroesophageal Reflux"], "a": 0, "r": "Hypertrophic Pyloric Stenosis classically presents in early infancy/toddlerhood with non-bilious projectile vomiting, persistent hunger, dehydration, and a palpable olive-shaped mass in the epigastric area."}, {"d": 4, "q": "A 6-month-old infant is brought to the ER with intermittent, colicky abdominal pain causing the child to pull their knees to their chest. The parent notes a 'currant jelly' stool. What non-surgical intervention is both diagnostic and therapeutic?", "o": ["Pneumatic (air) or hydrostatic (barium/saline) enema", "Nasogastric tube decompression", "High-dose oral laxatives", "Abdominal heating pad application"], "a": 0, "r": "Intussusception (telescoping bowel) causes 'currant jelly' stool (blood/mucus). An air or contrast enema is the first-line diagnostic AND therapeutic intervention because the pressure often pops the telescoped bowel back into place."}, {"d": 4, "q": "A newborn is born with a myelomeningocele. While awaiting surgery, in what position should the nurse place the infant, and how should the sac be protected?", "o": ["Prone position with a sterile, saline-soaked non-adherent dressing over the sac", "Supine position with a dry sterile bandage over the sac", "Side-lying position with a tight pressure dressing over the sac", "High-Fowler's position exposed to room air"], "a": 0, "r": "To prevent sac rupture, drying, and fatal CNS infection (meningitis), the infant must be placed in a PRONE position with a sterile, saline-moistened non-adherent dressing covering the sac."}, {"d": 4, "q": "A 3-year-old child with a severe croup exacerbation (laryngotracheobronchitis) exhibits inspiratory stridor at rest, intercostal retractions, and nasal flaring. The physician orders a nebulized medication. What fast-acting bronchodilator is indicated to rapidly decrease subglottic airway edema?", "o": ["Racemic Epinephrine", "Albuterol", "Salmeterol", "Ipratropium bromide"], "a": 0, "r": "Nebulized Racemic Epinephrine stimulates alpha-1 adrenergic receptors in the airway mucosa, causing local vasoconstriction that rapidly shrinks the swollen subglottic tissue, relieving stridor and upper airway obstruction in severe croup."}, {"d": 4, "q": "An 18-month-old child is brought to the ER after inhaling a small plastic toy. Chest X-ray reveals a foreign body aspiration. Which anatomical location is the most common site for foreign body obstruction in young children?", "o": ["Right mainstem bronchus", "Left mainstem bronchus", "Esophagus", "Pharynx"], "a": 0, "r": "The right mainstem bronchus is wider, shorter, and descends more vertically than the left mainstem bronchus, making it the most common site for aspirated foreign bodies."}, {"d": 4, "q": "A 5-year-old child is diagnosed with Coarctation of the Aorta. Which physical assessment finding is pathognomonic for this congenital acyanotic heart defect?", "o": ["High blood pressure and bounding pulses in upper extremities with weak or absent femoral/lower extremity pulses", "Profound generalized cyanosis and clubbing of fingers", "A continuous machine-like murmur heard over the back", "Cyanosis that worsens during crying spells"], "a": 0, "r": "Coarctation of the Aorta is a localized narrowing of the aorta. Blood flow is obstructed to the lower body, causing high BP/bounding pulses in upper extremities and low BP/weak or absent pulses in lower extremities."}, {"d": 4, "q": "A 4-week-old infant with hypertrophic pyloric stenosis has experienced persistent, severe projectile vomiting. Which acid-base imbalance is the infant at highest risk for developing?", "o": ["Metabolic Alkalosis", "Metabolic Acidosis", "Respiratory Acidosis", "Respiratory Alkalosis"], "a": 0, "r": "Persistent, severe vomiting of gastric juice causes massive loss of hydrochloric acid (HCl), hydrogen, and chloride, leading to Hypochloremic Hypokalemic Metabolic Alkalosis."}, {"d": 4, "q": "A 2-year-old child experiences a simple febrile seizure at home. The child is currently postictal but stable. What key education should the nurse provide to the parents regarding febrile seizures?", "o": ["Febrile seizures are generally benign, do not cause brain damage, and rarely require long-term anti-seizure medication", "Febrile seizures always indicate underlying epilepsy requiring lifelong medication", "The child will definitely develop severe learning disabilities", "Placing the child in an ice bath during a fever is recommended"], "a": 0, "r": "Simple febrile seizures occur during rapid fever spikes in young children (6 mos - 5 yrs). They are generally benign, short (< 15 mins), do not cause structural brain damage, and do not require long-term antiepileptic therapy."}, {"d": 4, "q": "A 4-year-old child presents with fatigue, pallor, low-grade fever, petechiae, and bone pain. A bone marrow biopsy confirms Acute Lymphoblastic Leukemia (ALL). What is ALL in pediatric oncology?", "o": ["The most common type of pediatric cancer, characterized by overproduction of immature lymphocytes", "A rare solid tumor of the adrenal gland", "A malignant tumor of the kidney", "A benign bone marrow growth"], "a": 0, "r": "Acute Lymphoblastic Leukemia (ALL) is the most common childhood cancer, accounting for ~75% of pediatric leukemias. It involves rapid proliferation of immature lymphoblasts in the bone marrow."}, {"d": 4, "q": "A 10-year-old child with asthma uses a peak expiratory flow meter. The reading falls into the 'Yellow Zone' (50% to 80% of personal best). What instruction should the child's asthma action plan specify?", "o": ["Administer the prescribed short-acting beta-agonist (SABA) rescue inhaler (e.g., Albuterol) and recheck", "Call 911 or go to the nearest emergency room immediately", "No action is needed as this represents normal lung function", "Stop taking all daily controller medications immediately"], "a": 0, "r": "The Yellow Zone (50-80% of personal best) indicates caution and worsening asthma/airway narrowing. The action plan directs taking a short-acting bronchodilator (Albuterol) rescue dose, resting, and re-evaluating peak flow."}, {"d": 4, "q": "An 8-month-old infant is admitted to the pediatric unit with acute Bronchiolitis caused by Respiratory Syncytial Virus (RSV). What isolation precautions and supportive care are indicated?", "o": ["Contact and Droplet Precautions; frequent nasal bulb suctioning, cool humidified oxygen, and hydration", "Strict Airborne Isolation in a negative pressure room; oral steroids", "Standard Precautions only; immediate broad-spectrum IV antibiotics", "Reverse Protective Isolation; strict bed rest without suctioning"], "a": 0, "r": "RSV/Bronchiolitis is spread via direct contact with secretions and large droplets. Contact and Droplet precautions are required. Treatment is supportive: maintaining airway patency via nasal suctioning, humidified O2, and adequate hydration."}, {"d": 4, "q": "A newborn is diagnosed with a Patent Ductus Arteriosus (PDA). Auscultation reveals a characteristic continuous 'machine-like' murmur at the upper left sternal border. What non-surgical pharmacological agent is administered to promote closure of the PDA?", "o": ["Indomethacin (an IV NSAID)", "Prostaglandin E1", "Digoxin", "Furosemide"], "a": 0, "r": "Indomethacin (a prostaglandin inhibitor) is administered intravenously to stimulate closure of a Patent Ductus Arteriosus in preterm infants. (Prostaglandin E1 does the opposite—it keeps the ductus open)."}, {"d": 4, "q": "A 2-year-old child with a Ventriculoperitoneal (VP) shunt placed for hydrocephalus presents with a fever of 102.5°F, vomiting, lethargy, and a bulging fontanelle. What complication must the nurse suspect?", "o": ["VP Shunt infection and malfunction resulting in increased intracranial pressure", "Normal viral gastroenteritis", "Allergic reaction to the shunt material", "Acute otitis media"], "a": 0, "r": "Fever, vomiting, severe lethargy, and signs of increased ICP (bulging fontanelle, high-pitched cry) in a child with a VP shunt strongly indicate shunt infection or occlusion requiring urgent neurosurgical evaluation."}, {"d": 4, "q": "A mother brings her 3-month-old infant to the clinic complaining of severe spitting up and arching of the back during feeds. The infant is diagnosed with Gastroesophageal Reflux (GERD). What conservative feeding modification should the nurse teach?", "o": ["Hold the infant upright for 20 to 30 minutes after feedings and provide smaller, thickened feedings more frequently", "Place the infant flat on their stomach immediately after feeding", "Switch the infant entirely to plain water feedings for 48 hours", "Administer high-dose antacids before every bottle"], "a": 0, "r": "Conservative GERD management in infants includes keeping the infant strictly upright for 20-30 minutes post-feed, offering smaller and more frequent feedings, and thickening formula/breastmilk with rice cereal as recommended."}, {"d": 4, "q": "A 12-year-old child with Type 1 Diabetes is planning to participate in a 1-hour soccer match at school. What instruction should the school nurse provide regarding exercise and insulin management?", "o": ["Consume a 15-gram carbohydrate snack (such as fruit or crackers) before playing and monitor blood glucose closely", "Administer an extra bolus dose of rapid-acting insulin immediately before playing", "Avoid eating any food for 4 hours prior to exercise", "Cancel participation in sports completely to prevent diabetic ketoacidosis"], "a": 0, "r": "Exercise increases muscle glucose uptake and insulin sensitivity, raising the risk of severe hypoglycemia. Children with Type 1 Diabetes should eat an extra 15-30g carbohydrate snack prior to exercise and check blood sugar before, during, and after."}, {"d": 4, "q": "A 11-year-old child is screened for Scoliosis during a routine physical examination. The nurse asks the child to bend forward at the waist with arms hanging freely (Adams Forward Bend Test). What physical finding indicates a positive screen for scoliosis?", "o": ["An asymmetry or rib hump visible along the thoracic spinal ridge", "Severe pain upon bending at the waist", "An inability to touch the toes due to tight hamstrings", "Exaggerated lumbar lordosis without lateral curvature"], "a": 0, "r": "The Adams Forward Bend Test evaluates lateral spinal curvature and rib rotation. A visible rib hump, asymmetry of the rib cage, or uneven scapulae upon bending forward indicates scoliosis."}, {"d": 5, "q": "A patient admitted with major depressive disorder states: 'I feel hopeless and everyone would be better off if I were dead.' What is the nurse's FIRST action?", "o": ["Ask directly: 'Are you thinking of killing yourself, and do you have a specific plan?'", "Reassure the patient by saying 'Things will look brighter tomorrow'", "Leave the patient alone to rest quietly in a private room", "Administer a PRN dose of Lorazepam"], "a": 0, "r": "Direct inquiry regarding suicidal ideation ('Do you have a plan? What means do you intend to use?') is essential. Assessing lethality and establishing safety precautions (1:1 observation) is the immediate priority."}, {"d": 5, "q": "A patient diagnosed with paranoid schizophrenia tells the nurse: 'The voices are telling me to poison my roommate's food tonight.' How should the nurse classify and respond to this statement?", "o": ["Command hallucinations requiring immediate risk assessment and strict safety precautions", "Delusion of grandeur requiring gentle reality orientation", "Flight of ideas requiring reduced stimulation", "Negative symptom requiring encouragement"], "a": 0, "r": "Command hallucinations ordering harm to self or others present a high risk for violence. The nurse must assess the hallucination, protect the safety of all patients, and initiate safety protocols."}, {"d": 5, "q": "A patient receiving Clozapine for treatment-resistant schizophrenia undergoes routine lab testing. Which lab result requires WITHHOLDING the medication and urgent notification?", "o": ["Absolute Neutrophil Count (ANC) of 800/mm³", "Serum Sodium of 138 mEq/L", "Hemoglobin of 13.5 g/dL", "Blood Glucose of 110 mg/dL"], "a": 0, "r": "Clozapine carries a severe risk of agranulocytosis. Regular ANC monitoring is mandatory. An ANC <1000/mm³ (neutropenia) mandates immediate cessation of Clozapine to prevent life-threatening infection."}, {"d": 5, "q": "A patient taking Haloperidol develops severe 'lead-pipe' muscle rigidity, a temperature of 39.8°C, diaphoresis, labile blood pressure, and confusion. What life-threatening condition is suspected?", "o": ["Neuroleptic Malignant Syndrome (NMS)", "Serotonin Syndrome", "Tardive Dyskinesia", "Acute Dystonia"], "a": 0, "r": "NMS is a medical emergency caused by antipsychotic dopamine blockade, characterized by severe muscle rigidity, hyperthermia, autonomic instability, and altered consciousness. Immediate action: stop antipsychotic, cool patient, notify provider."}, {"d": 5, "q": "A patient receiving Haloperidol for 3 days develops an acute involuntary spasm of the neck muscles (torticollis) and eye deviation upward (oculogyric crisis). What medication should the nurse anticipate?", "o": ["Benztropine 2 mg IM", "Haloperidol 5 mg IV", "Lithium Carbonate 300 mg PO", "Propanolol 40 mg PO"], "a": 0, "r": "Acute dystonia is an extrapyramidal side effect of antipsychotics involving involuntary muscle contractions. It is treated promptly with an anticholinergic agent (Benztropine or Diphenhydramine)."}, {"d": 5, "q": "A patient in the manic phase of Bipolar I Disorder is hyperactive, pacing the unit continuously, shouting grandiosely, and has not eaten for 24 hours. What is the MOST appropriate nursing intervention?", "o": ["Provide portable, high-calorie, high-protein finger foods and maintain a low-stimulation environment", "Insist that the patient sit at the dining table for 30 minutes during meals", "Place the patient in seclusion until behavior improves", "Encourage participation in competitive group sports"], "a": 0, "r": "Manic patients cannot sit still to eat full meals. Providing high-calorie portable finger foods (sandwiches, cheese, fruit) allows nutrition while mobile, and a low-stimulation environment reduces hyperactivity."}, {"d": 5, "q": "A patient taking Lithium Carbonate for bipolar disorder presents with coarse hand tremors, severe ataxia, persistent diarrhea, and confusion. Serum Lithium level is 2.1 mEq/L. How should the nurse interpret this?", "o": ["Lithium toxicity requiring immediate withholding of the drug and medical evaluation", "Normal therapeutic lithium blood level", "Mild expected side effect requiring no action", "Subtherapeutic level requiring dose increase"], "a": 0, "r": "Therapeutic Lithium level is 0.6 to 1.2 mEq/L. Levels >1.5 mEq/L cause toxicity (coarse tremors, GI distress, ataxia, confusion, seizures). Low sodium intake or dehydration increases lithium levels."}, {"d": 5, "q": "A patient with severe alcohol dependence is admitted to the medical unit. Forty-eight hours after his last drink, he develops gross tremors, profuse sweating, visual hallucinations, BP 180/110 mmHg, and confusion. What condition is present?", "o": ["Delirium Tremens (DTs)", "Wernicke Encephalopathy", "Opioid Withdrawal Syndrome", "Hepatic Encephalopathy"], "a": 0, "r": "Delirium Tremens (DTs) is a severe, life-threatening alcohol withdrawal reaction occurring 48-96 hours after cessation, characterized by autonomic hyperactivity, confusion, and hallucinations. Treated with IV Benzodiazepines."}, {"d": 5, "q": "Prior to administering an IV glucose solution to an malnourished patient with chronic alcohol use disorder, what vitamin MUST be administered FIRST to prevent Wernicke's Encephalopathy?", "o": ["Thiamine (Vitamin B1) IV", "Vitamin C IV", "Vitamin K IM", "Folic Acid PO"], "a": 0, "r": "In alcohol dependence, administering carbohydrate/glucose without prior Thiamine (Vitamin B1) supplementation precipitates acute Wernicke's Encephalopathy (ataxia, ophthalmoplegia, confusion)."}, {"d": 5, "q": "A patient presenting with acute heroin overdose has a respiratory rate of 6 breaths/min, stupor, and pinpoint pupils. What is the immediate life-saving antagonist?", "o": ["Naloxone IV", "Flumazenil IV", "Atropine IV", "Protamine Sulfate IV"], "a": 0, "r": "Naloxone is an opioid antagonist that rapidly reverses opioid-induced respiratory depression and coma."}, {"d": 5, "q": "A patient diagnosed with Major Depressive Disorder is prescribed Fluoxetine, an SSRI. Two days later, the patient tells the nurse, 'I don't feel any better. This pill isn't working.' What is the best nursing response?", "o": ["'It usually takes 2 to 4 weeks for this medication to reach its full therapeutic effect.'", "'I will ask the doctor to double your dose today.'", "'You should stop taking it if it isn't working for you.'", "'Antidepressants work immediately, you must be resistant to this one.'"], "a": 0, "r": "SSRIs (like Fluoxetine, Sertraline, Citalopram) take several weeks (typically 2-4, up to 6 weeks) to reach therapeutic levels and alter brain neurochemistry enough to alleviate depressive symptoms. Patient education is vital to prevent premature discontinuation."}, {"d": 5, "q": "A patient on a psychiatric unit approaches the nurse and says, 'The FBI has planted microchips in the walls to steal my thoughts.' What is the most therapeutic response?", "o": ["'I know you believe that is true, but I do not see any microchips and you are safe here.'", "'That is impossible, the walls are made of concrete.'", "'Why do you think the FBI would care about your thoughts?'", "'Let's take a screwdriver and look for the microchips together.'"], "a": 0, "r": "This response demonstrates 'voicing doubt' while presenting reality. The nurse acknowledges the patient's feelings/beliefs without arguing, challenging, or validating the delusion, and pivots to providing a sense of safety."}, {"d": 5, "q": "A patient with Borderline Personality Disorder has superficial self-inflicted cuts on her arms. When the nurse cleans the wounds, the patient smiles and says, 'I like it when you pay attention to me.' What is the nurse's best approach?", "o": ["Provide wound care in a neutral, matter-of-fact manner without showing excess emotion", "Scold the patient for engaging in attention-seeking behavior", "Refuse to clean the wounds until the patient apologizes", "Spend an extra hour with the patient to discuss why she cut herself"], "a": 0, "r": "For patients with borderline personality disorder engaging in non-suicidal self-injury, the nurse should treat the wounds in a neutral, matter-of-fact manner to avoid providing secondary gain (excessive attention or emotional reaction) which reinforces the self-harm behavior."}, {"d": 5, "q": "A patient taking an MAOI (Monoamine Oxidase Inhibitor) like Phenelzine for depression attends a holiday party. Which food must the patient strictly AVOID to prevent a fatal hypertensive crisis?", "o": ["Aged cheese and cured meats (salami/pepperoni)", "Fresh apples and bananas", "White bread and butter", "Grilled chicken breast"], "a": 0, "r": "MAOIs interact fatally with tyramine, a naturally occurring amine. Consuming high-tyramine foods (aged cheeses, cured/smoked meats, fermented foods, draft beer, red wine) causes a massive release of norepinephrine, leading to a lethal hypertensive crisis."}, {"d": 5, "q": "A patient with anorexia nervosa is admitted to the medical unit with a BMI of 13. Which physiological assessment finding is a direct result of severe malnutrition and requires immediate monitoring?", "o": ["Hypokalemia and profound bradycardia", "Hypertension and bounding pulses", "Hyperthermia and extreme sweating", "Hyperglycemia and polyuria"], "a": 0, "r": "Severe anorexia nervosa causes starvation, leading to fatal arrhythmias due to hypokalemia, profound bradycardia, hypotension, and hypothermia as the body shuts down non-essential functions to conserve energy."}, {"d": 5, "q": "A severely depressed patient who was previously mute and lethargic suddenly becomes very energetic, gives away his favorite possessions, and appears peaceful. What is the nurse's priority concern?", "o": ["The patient is at an increased, immediate risk for suicide", "The antidepressant medication has successfully cured his depression", "The patient is experiencing a manic episode", "The patient is ready for hospital discharge"], "a": 0, "r": "A sudden lift in mood, increased energy, and giving away possessions in a severely depressed patient is a massive red flag for suicide. The patient now has the physical energy to carry out a suicide plan, and the 'peacefulness' stems from having made the decision to die."}, {"d": 5, "q": "A patient diagnosed with Obsessive-Compulsive Disorder (OCD) washes his hands precisely 20 times before every meal. What is the primary purpose of this compulsive behavior?", "o": ["To temporarily reduce severe underlying anxiety associated with obsessive thoughts", "To maintain strict physical hygiene", "To gain attention from the nursing staff", "To punish himself for having bad thoughts"], "a": 0, "r": "In OCD, obsessions are intrusive, anxiety-provoking thoughts. Compulsions are the repetitive behaviors the patient feels driven to perform to temporarily alleviate the overwhelming anxiety caused by the obsession."}, {"d": 5, "q": "A patient experiencing a severe panic attack presents to the ER with palpitations, trembling, diaphoresis, and a feeling of impending doom. What is the nurse's priority intervention?", "o": ["Stay with the patient, remain calm, and use short, simple directives", "Teach the patient deep cognitive-behavioral coping strategies", "Leave the patient alone in a quiet room to reduce stimulation", "Encourage the patient to talk at length about what triggered the panic"], "a": 0, "r": "During a severe panic attack, a patient cannot process complex information or engage in deep therapy. The nurse must stay with the patient (to ensure safety), remain calm, and use short, clear, simple sentences to help them regain control."}, {"d": 5, "q": "A veteran diagnosed with Post-Traumatic Stress Disorder (PTSD) has frequent nightmares and flashbacks. Which class of medication is considered the first-line pharmacological treatment for the long-term management of PTSD?", "o": ["Selective Serotonin Reuptake Inhibitors (SSRIs)", "Typical Antipsychotics", "Benzodiazepines", "Mood Stabilizers (Lithium)"], "a": 0, "r": "SSRIs (like Sertraline and Paroxetine) are the first-line FDA-approved pharmacological treatment for the long-term management of PTSD symptoms, as they help reduce anxiety, depression, and intrusive thoughts. Benzodiazepines are generally avoided due to substance abuse risks."}, {"d": 5, "q": "A patient is undergoing Electroconvulsive Therapy (ECT) for severe treatment-resistant depression. What is an expected, temporary side effect immediately following the procedure?", "o": ["Short-term memory loss and confusion", "Permanent retrograde amnesia", "Severe bone fractures", "Tardive dyskinesia"], "a": 0, "r": "The most common expected side effects immediately following ECT are mild confusion, headache, and short-term memory loss (retrograde amnesia) for events surrounding the treatment. Bone fractures are prevented by the use of muscle relaxants (succinylcholine) during the procedure."}, {"d": 5, "q": "A patient taking a first-generation typical antipsychotic (Chlorpromazine) for several years presents with uncontrollable lip-smacking, tongue protrusion, and grimacing. What irreversible condition is the patient displaying?", "o": ["Tardive Dyskinesia", "Neuroleptic Malignant Syndrome", "Acute Dystonia", "Pseudoparkinsonism"], "a": 0, "r": "Tardive Dyskinesia (TD) is a late-onset, often irreversible extrapyramidal side effect (EPS) of typical antipsychotics characterized by abnormal, involuntary choreoathetoid movements of the face, mouth (lip-smacking, tongue darting), and limbs."}, {"d": 5, "q": "A patient with anorexia nervosa is beginning a refeeding program. After 3 days of increased caloric intake, the patient develops severe edema, shortness of breath, and a drastically low serum phosphorus level (1.1 mg/dL). What life-threatening complication is occurring?", "o": ["Refeeding Syndrome", "Hyperglycemic Hyperosmolar State", "Acute Kidney Injury", "Heart Failure due to cor pulmonale"], "a": 0, "r": "Refeeding syndrome is a fatal complication of nutritional rehabilitation in severely malnourished patients. The sudden influx of carbohydrates triggers massive insulin release, driving phosphate, potassium, and magnesium rapidly into the cells. Severe hypophosphatemia leads to respiratory failure, cardiac arrest, and massive fluid retention."}, {"d": 5, "q": "A patient with Schizophrenia is standing in the corner of the room, completely motionless, rigid, and unresponsive to verbal commands for the past 3 hours. The patient's arm remains suspended in the air after the nurse moves it to check a blood pressure. What specific state is the patient exhibiting?", "o": ["Catatonia with waxy flexibility", "Tardive Dyskinesia", "Severe depressive stupor", "Neuroleptic Malignant Syndrome"], "a": 0, "r": "Catatonia is a severe psychomotor disturbance. 'Waxy flexibility' is a classic symptom where the patient's limbs remain in the exact bizarre or uncomfortable posture in which another person places them, often for hours, without active resistance."}, {"d": 5, "q": "A patient is admitted to the psychiatric unit with a diagnosis of Severe Anorexia Nervosa. The patient's BMI is 14. Which nursing intervention takes the highest priority in the first 24 hours of admission?", "o": ["Initiate strict cardiac monitoring and assess serum electrolytes (potassium, phosphorus)", "Begin intensive, 2-hour daily cognitive behavioral therapy sessions", "Force the patient to eat 3,000 calories a day to gain weight quickly", "Allow the patient to exercise in their room to reduce anxiety"], "a": 0, "r": "A BMI of 14 indicates severe starvation. The highest priority is physiological stability. Starvation causes severe electrolyte imbalances (hypokalemia) which lead to fatal cardiac arrhythmias. Furthermore, initiating feeding places the patient at massive risk for fatal Refeeding Syndrome, requiring strict electrolyte monitoring."}, {"d": 5, "q": "A patient taking Tranylcypromine (an MAOI) for depression comes to the clinic complaining of a sudden, explosive headache, a stiff neck, and a heart rate of 120 bpm. The nurse takes a blood pressure reading and it is 220/130 mmHg. What is the most likely cause?", "o": ["The patient consumed a meal high in tyramine, triggering a hypertensive crisis", "The patient suddenly stopped taking the medication, causing withdrawal", "The patient mixed the medication with a highly acidic juice", "The patient developed a severe allergic reaction to the drug base"], "a": 0, "r": "MAOIs block the breakdown of tyramine. Consuming foods high in tyramine (aged cheeses, cured meats, wine, soy sauce) causes a massive release of norepinephrine, leading to a fatal hypertensive crisis characterized by severe headache, neck stiffness, and stroke-level blood pressures."}, {"d": 5, "q": "A patient with Bipolar I Disorder is admitted in a state of acute mania. The patient is loud, intrusive, and constantly provoking other patients in the common area. What is the BEST immediate action by the nurse?", "o": ["Gently and firmly redirect the patient to a quiet, low-stimulation area of the unit", "Publicly confront the patient and demand they stop bothering others", "Place the patient in four-point physical restraints immediately", "Allow the patient to continue, as it is a natural phase of their illness"], "a": 0, "r": "Patients in acute mania lack impulse control and are highly reactive to environmental stimuli. The best approach is to use a calm, firm, non-threatening tone to redirect them away from the highly stimulating common area to a quiet room to de-escalate the behavior."}, {"d": 5, "q": "A patient is brought to the emergency department experiencing a severe panic attack. The physician orders a stat dose of Alprazolam. To which pharmacological class does this medication belong, and what is its primary mechanism of action?", "o": ["Benzodiazepine; enhances the inhibitory effects of GABA to rapidly reduce anxiety", "SSRI; blocks the reuptake of serotonin to elevate mood", "Beta-blocker; blocks adrenaline to lower heart rate", "Antipsychotic; blocks dopamine receptors to stop hallucinations"], "a": 0, "r": "Alprazolam (Xanax) is a Benzodiazepine. It acts rapidly by enhancing the activity of Gamma-Aminobutyric Acid (GABA), the primary inhibitory neurotransmitter in the brain, causing massive CNS depression and immediate relief of acute panic."}, {"d": 5, "q": "A patient with bipolar disorder is started on Lithium therapy. The nurse provides discharge teaching regarding dietary modifications. Which statement by the patient indicates a need for further teaching?", "o": ["'I need to strictly limit my salt and water intake while on this medication.'", "'I should maintain a consistent, normal intake of dietary sodium.'", "'I need to drink 2 to 3 liters of fluid every day.'", "'I should contact my doctor if I get a stomach bug with severe diarrhea.'"], "a": 0, "r": "Lithium is a salt. The kidneys cannot differentiate between lithium and sodium. If a patient restricts sodium (or gets dehydrated from vomiting/sweating), the kidneys will desperately hold onto lithium instead, leading to rapid, fatal Lithium Toxicity. A consistent, normal sodium and fluid intake is absolutely required."}, {"d": 5, "q": "A patient on a psychiatric unit is taking a typical antipsychotic medication (Haloperidol). The nurse observes the patient restlessly pacing the halls, constantly shifting their weight from foot to foot, and unable to sit still for more than a few seconds. What extrapyramidal side effect is this?", "o": ["Akathisia", "Tardive Dyskinesia", "Acute Dystonia", "Pseudoparkinsonism"], "a": 0, "r": "Akathisia is an intense, agonizing internal feeling of restlessness that manifests physically as an absolute inability to sit still, constant pacing, and shifting. It is a common, distressing EPS of antipsychotics and is treated with beta-blockers (propranolol) or anticholinergics."}, {"d": 5, "q": "A patient admitted for alcohol detoxification experiences a severe withdrawal seizure. The physician orders an immediate IV dose of Diazepam. How does Diazepam work to stop the seizure?", "o": ["It enhances the inhibitory effects of GABA, rapidly depressing the central nervous system", "It blocks dopamine receptors in the basal ganglia", "It inhibits the reuptake of serotonin in the synaptic cleft", "It directly paralyzes the skeletal muscles to stop the convulsions"], "a": 0, "r": "Diazepam (a benzodiazepine) is the gold-standard first-line treatment for alcohol withdrawal and status epilepticus. It works by heavily potentiating the effects of Gamma-Aminobutyric Acid (GABA), the brain's primary inhibitory neurotransmitter, effectively shutting down the hyperactive electrical storm."}, {"d": 5, "q": "A patient with a long history of severe alcohol abuse is admitted to the psychiatric unit. The patient displays profound short-term memory loss, confabulation (making up stories to fill memory gaps), and peripheral neuropathy. The nurse suspects the patient has developed which irreversible neurological complication?", "o": ["Korsakoff's Psychosis (Korsakoff's Amnesic Syndrome)", "Acute Wernicke's Encephalopathy", "Delirium Tremens", "Schizophrenia"], "a": 0, "r": "While Wernicke's Encephalopathy is the acute, reversible phase of thiamine deficiency (presenting with ataxia and confusion), if left untreated, it progresses into Korsakoff's Psychosis. Korsakoff's is a chronic, highly irreversible neurological disorder characterized by severe amnesia, inability to form new memories, and confabulation (fabricating memories to cover the gaps) due to permanent brain damage."}, {"d": 5, "q": "A patient diagnosed with Antisocial Personality Disorder is admitted to the psychiatric unit by court order. The patient attempts to manipulate the nurse into giving them extra privileges by complimenting the nurse and then threatening to file a complaint if refused. What is the most effective nursing intervention?", "o": ["Set clear, consistent, and firm limits on behavior and immediately enforce established consequences for rule-breaking", "Attempt to reason with the patient and explain why they cannot have the privileges", "Ignore the patient entirely until they apologize", "Grant the privileges to avoid escalating the patient into violence"], "a": 0, "r": "Individuals with antisocial personality disorder lack empathy, disregard rules, and are highly manipulative, often pitting staff against each other. The absolute cornerstone of managing this behavior is setting firm, unyielding limits, communicating these limits clearly across the entire healthcare team, and strictly enforcing consequences without argument."}, {"d": 5, "q": "A patient with severe Major Depressive Disorder has been taking a Selective Serotonin Reuptake Inhibitor (SSRI), Sertraline, for 4 days. The patient's spouse calls the clinic and says, 'My husband is suddenly incredibly agitated, sweating profusely, has a fever of 102°F, and his muscles are twitching violently.' What life-threatening condition does the nurse suspect?", "o": ["Serotonin Syndrome", "Neuroleptic Malignant Syndrome", "Tardive Dyskinesia", "A normal adjustment phase to the new medication"], "a": 0, "r": "Serotonin Syndrome is a fatal emergency caused by an excessive accumulation of serotonin in the brain, often occurring within hours or days of starting or increasing an SSRI/SNRI. The classic triad includes altered mental status (agitation/confusion), autonomic instability (severe hyperthermia, diaphoresis, tachycardia), and massive neuromuscular hyperactivity (clonus, violent muscle twitching, hyperreflexia)."}, {"d": 5, "q": "A patient is admitted to the psychiatric unit with a diagnosis of Somatic Symptom Disorder. The patient constantly complains of severe abdominal pain, though exhaustive medical workups reveal absolutely no physiological cause. How should the nurse address the patient's complaints?", "o": ["Acknowledge the patient's pain is real to them, briefly assess it, and then quickly redirect the conversation to their emotional feelings and coping skills", "Tell the patient bluntly that the pain is 'all in their head' and they need to stop complaining", "Provide high-dose opioid pain medication whenever the patient asks", "Completely ignore the patient whenever they bring up physical symptoms"], "a": 0, "r": "In Somatic Symptom Disorder, the patient is not faking; the psychological distress is unconsciously manifesting as severe, genuine physical pain. The nurse must validate that the patient is suffering and briefly assess the symptom (to rule out a new true medical issue), but must then strictly limit the time spent discussing physical symptoms and redirect the focus onto emotional coping strategies to prevent secondary gain."}, {"d": 5, "q": "A patient with major depressive disorder is prescribed a monoamine oxidase inhibitor (MAOI), Phenelzine. The nurse is conducting dietary teaching. The patient successfully understands the teaching when they state they will completely avoid which of the following meals?", "o": ["A pepperoni pizza with aged parmesan cheese and a glass of red wine", "A grilled chicken breast with steamed broccoli and a glass of milk", "A bowl of oatmeal with fresh blueberries and black coffee", "A baked potato with butter and a side of green beans"], "a": 0, "r": "MAOIs interact lethally with foods containing high amounts of Tyramine. Consuming tyramine-rich foods (aged cheeses, cured/smoked meats like pepperoni/salami, fermented foods, and red wine/draft beer) causes a massive release of norepinephrine, triggering a fatal hypertensive crisis."}, {"d": 5, "q": "A patient admitted for acute alcohol withdrawal begins experiencing severe visual and tactile hallucinations, profound confusion, severe tachycardia (HR 140), and a temperature of 102°F (38.9°C). The patient is sweating profusely. What life-threatening condition is this?", "o": ["Delirium Tremens (DTs)", "Wernicke's Encephalopathy", "Korsakoff's Syndrome", "Hepatic Encephalopathy"], "a": 0, "r": "Delirium Tremens (DTs) is the most severe and potentially fatal stage of alcohol withdrawal, typically peaking 48 to 96 hours after the last drink. It is characterized by severe autonomic hyperactivity (fever, tachycardia, diaphoresis, hypertension), global confusion, and vivid hallucinations."}, {"d": 5, "q": "A patient with Bipolar I Disorder has been taking Lithium for two years. The patient presents to the clinic with severe vomiting and diarrhea from a stomach bug. The patient exhibits a coarse hand tremor, confusion, and slurred speech. What does the nurse suspect?", "o": ["Severe Lithium Toxicity triggered by dehydration and sodium loss", "A normal side effect of long-term Lithium use", "An acute manic episode breaking through the medication", "Onset of early Alzheimer's disease"], "a": 0, "r": "Lithium is a salt that is excreted by the kidneys. If a patient becomes dehydrated or loses massive amounts of sodium (via vomiting, diarrhea, or heavy sweating), the kidneys will reabsorb Lithium instead of sodium, leading to rapid, fatal Lithium toxicity (coarse tremors, ataxia, confusion, seizures)."}, {"d": 5, "q": "A patient with major depressive disorder is prescribed Tranylcypromine, a Monoamine Oxidase Inhibitor (MAOI). The nurse is conducting dietary teaching. Which breakfast choice indicates the patient profoundly misunderstands the dietary restrictions?", "o": ["A toasted bagel with cream cheese and a large slice of smoked, cured salami", "A bowl of oatmeal with fresh blueberries and black coffee", "Two scrambled eggs with fresh tomatoes", "A bowl of cornflakes with skim milk"], "a": 0, "r": "Patients on MAOIs must strictly avoid foods containing tyramine to prevent a fatal hypertensive crisis. Tyramine is found in massive quantities in aged, fermented, smoked, or cured meats (salami, pepperoni), aged cheeses, and draft beers."}, {"d": 5, "q": "A patient admitted to the psychiatric unit with severe depression tells the nurse, 'I have decided to end it all tonight when the lights go out.' What is the nurse's IMMEDIATE priority action?", "o": ["Place the patient on strict 1:1 continuous visual observation", "Administer a PRN dose of an anti-anxiety medication and check on them in 15 minutes", "Lock the patient in their room to keep them safe from sharp objects", "Call the patient's family to inform them of the threat"], "a": 0, "r": "When a patient verbalizes a clear, imminent plan for suicide, the absolute highest priority is ensuring immediate physical safety. The standard of care is placing the patient on continuous, 1:1, arms-length visual observation by a staff member at all times, including in the bathroom."}, {"d": 5, "q": "A patient with schizophrenia is pacing the hall, looking terrified, and shouting, 'The snakes are crawling all over the walls and they are going to bite me!' The nurse looks at the blank wall. How should the nurse respond therapeutically?", "o": ["'I do not see any snakes on the wall, but I understand that this is very terrifying for you. I am here to keep you safe.'", "'There are no snakes here. You are just hallucinating again.'", "'Let me go get a broom and I will sweep the snakes away for you.'", "'Why do you think there are snakes in a hospital?'"], "a": 0, "r": "This is the classic, therapeutic approach to visual/auditory hallucinations. The nurse must 'present reality' ('I do not see snakes') to ground the patient, but must immediately validate the patient's emotional response ('I understand this is terrifying') and offer security ('I will keep you safe'), rather than arguing with or feeding into the delusion."}, {"d": 5, "q": "A patient with profound, severe depression is scheduled for Electroconvulsive Therapy (ECT). The patient has not eaten or spoken in 4 days. The family asks how ECT works. What is the most accurate explanation by the nurse?", "o": ["'It applies a brief electrical current to the brain to induce a short, controlled seizure, which rapidly alters brain chemistry and neurotransmitters to lift severe depression.'", "'It uses high-voltage electricity to permanently erase the painful memories causing the depression.'", "'It sends gentle electrical waves to relax the brain muscles and promote deep sleep.'", "'It shocks the heart into beating faster, which increases blood flow to the brain.'"], "a": 0, "r": "ECT works by intentionally inducing a brief, controlled generalized seizure (while the patient is under general anesthesia and muscle relaxants). This seizure causes a massive, rapid 'reset' and release of neurotransmitters (serotonin, dopamine, norepinephrine) in the brain, making it the fastest, most effective treatment for severe, life-threatening depression."}, {"d": 5, "q": "A patient diagnosed with severe Obsessive-Compulsive Disorder (OCD) has a compulsion to wash their hands 50 times a day, to the point where the skin is bleeding. The nurse is developing a care plan. During the initial, highly anxious phase of admission, what is the most appropriate nursing action regarding the compulsive behavior?", "o": ["Allow the patient time to perform the compulsive behavior to manage their severe anxiety, while slowly introducing limits and alternative coping skills", "Physically block the patient from the sink to completely stop the handwashing immediately", "Scold the patient every time they wash their hands to provide negative reinforcement", "Ignore the behavior completely and refuse to discuss it"], "a": 0, "r": "Compulsions are the ONLY way an OCD patient knows how to reduce their massive, paralyzing anxiety. Stopping a compulsion abruptly and physically during early treatment will cause a catastrophic panic attack. The standard of care is to initially *allow* time for the ritual, then gradually work with the patient to limit the time/frequency while teaching new coping mechanisms."}, {"d": 5, "q": "A patient with severe schizophrenia is exhibiting extreme negative symptoms. Which of the following observations by the nurse represents a 'negative' symptom of schizophrenia?", "o": ["Alogia (poverty of speech) and anhedonia (total inability to experience pleasure)", "Auditory command hallucinations telling the patient to harm themselves", "Bizarre, paranoid delusions that the government is tracking them", "Disorganized, rapid, and nonsensical speech (word salad)"], "a": 0, "r": "In schizophrenia, 'Positive' symptoms are abnormal things that are ADDED to the patient's reality (hallucinations, delusions, bizarre speech). 'Negative' symptoms are normal human functions that have been SUBTRACTED or lost (flat affect, alogia/lack of speech, anhedonia/lack of pleasure, avolition/lack of motivation)."}, {"d": 5, "q": "A patient is taking a typical antipsychotic (Fluphenazine). The nurse observes the patient's eyes suddenly roll back into their head, locked in an upward gaze, and the patient's neck twists painfully to the side. What is the immediate pharmacological antidote for this acute dystonic reaction?", "o": ["IM Benztropine (Cogentin) or IM Diphenhydramine (Benadryl)", "IV Haloperidol (Haldol)", "PO Lithium Carbonate", "IV Flumazenil (Romazicon)"], "a": 0, "r": "An acute dystonic reaction (oculogyric crisis and torticollis) is a terrifying, painful, and potentially airway-compromising extrapyramidal side effect of antipsychotics. Because it is caused by a massive dopamine blockade, the immediate antidote is a rapid-acting anticholinergic medication (Benztropine) or antihistamine (Diphenhydramine) given IM or IV."}, {"d": 5, "q": "A patient with borderline personality disorder has multiple, superficial, self-inflicted cuts on their left forearm. The patient brings the bleeding cuts to the nurse's station and smiles. What is the most therapeutic nursing intervention?", "o": ["Provide necessary first aid and wound care in a neutral, matter-of-fact manner, avoiding excessive emotional reaction or prolonged discussion about the cuts", "Immediately reprimand the patient for seeking attention and refuse to clean the wounds", "Spend an hour exploring the deep emotional reasons why the patient decided to cut themselves today", "Call a code and place the patient in immediate 4-point physical restraints"], "a": 0, "r": "For patients with borderline personality disorder who engage in non-suicidal self-injury (NSSI), the cutting is often an extreme maladaptive coping mechanism or an attempt to gain attention/soothing from staff. The nurse must clean the wounds safely, but must do so in a strictly neutral, boring, matter-of-fact way. Providing massive emotional attention (secondary gain) actively reinforces the self-harm behavior."}, {"d": 5, "q": "A patient is taking Lithium for Bipolar I Disorder. The patient's latest serum Lithium level is 2.2 mEq/L. The patient is confused, slurring their words, and has a coarse hand tremor. What is the nurse's interpretation of this lab value?", "o": ["The patient is experiencing severe, life-threatening Lithium Toxicity", "The patient's Lithium level is perfectly therapeutic", "The patient is experiencing a sub-therapeutic level and needs a higher dose", "The patient is experiencing a normal, temporary side effect of the medication"], "a": 0, "r": "The therapeutic range for Lithium is extremely narrow: 0.6 to 1.2 mEq/L. A level of 2.2 mEq/L is critically high and represents severe, life-threatening Lithium toxicity. The classic signs are coarse tremors, severe confusion, ataxia, slurred speech, and progression to seizures or coma. The drug must be stopped immediately."}, {"d": 5, "q": "A patient on the psychiatric unit is taking Haloperidol, a typical antipsychotic. The nurse observes the patient suddenly develop a high fever of 104°F (40°C), severe 'lead-pipe' muscle rigidity, profuse sweating, and a dramatically fluctuating blood pressure. What life-threatening emergency is occurring?", "o": ["Neuroleptic Malignant Syndrome (NMS)", "Serotonin Syndrome", "Tardive Dyskinesia", "Malignant Hyperthermia"], "a": 0, "r": "Neuroleptic Malignant Syndrome (NMS) is a rare, fatal, idiosyncratic reaction to antipsychotic drugs (caused by massive dopamine blockade). The classic tetrad of symptoms includes severe hyperthermia (>104F), extreme 'lead-pipe' muscle rigidity, autonomic instability (fluctuating BP, tachycardia, diaphoresis), and altered mental status. The drug must be stopped immediately."}, {"d": 5, "q": "A patient with borderline personality disorder is exhibiting intense 'splitting' behavior on the unit. The patient tells the day shift nurse, 'You are the only nurse who actually cares about me. The night shift nurses are all horrible and ignore me.' What is the most therapeutic response?", "o": ["'All of the nurses on this unit are highly trained and we all work together as a team to ensure you receive the best care.'", "'I agree, the night shift nurses have been very lazy lately. I will talk to the manager for you.'", "'You need to stop complaining about the other staff members immediately.'", "'Why do you think the night shift nurses hate you?'"], "a": 0, "r": "Splitting is an ego defense mechanism where the patient views people as entirely 'all good' or entirely 'all bad,' often attempting to pit staff members against one another. The most effective intervention is to calmly present reality, validate the entire team, and maintain strict, consistent boundaries to prevent staff manipulation."}, {"d": 5, "q": "A patient is admitted to the psychiatric unit with Anorexia Nervosa. The patient's BMI is 13.5. The physician orders the initiation of enteral tube feedings. On day 2 of feeding, the patient develops profound weakness, shallow respirations, and a serum phosphorus level of 1.0 mg/dL. What fatal complication is occurring?", "o": ["Refeeding Syndrome", "Wernicke's Encephalopathy", "Thyroid Storm", "Diabetic Ketoacidosis"], "a": 0, "r": "Refeeding syndrome is a massive, fatal shift in fluids and electrolytes that occurs when a severely starved patient is fed too quickly. The sudden influx of carbohydrates causes a massive release of insulin, which violently pulls potassium, magnesium, and crucially, PHOSPHORUS into the cells. Profound hypophosphatemia leads to respiratory failure, cardiac arrest, and death."}, {"d": 5, "q": "A patient with chronic, severe schizophrenia is prescribed Clozapine (Clozaril). The nurse knows this 'medication of last resort' requires mandatory weekly blood draws for the first 6 months. What specific, fatal complication is the blood test monitoring for?", "o": ["Agranulocytosis (a catastrophic, life-threatening drop in the absolute neutrophil count)", "Severe lithium toxicity and renal failure", "Massive, fatal destruction of the liver (fulminant hepatic failure)", "Sudden, irreversible blindness from retinal detachment"], "a": 0, "r": "Clozapine is an incredibly effective atypical antipsychotic for treatment-resistant schizophrenia, but it carries a severe 'black box' warning for Agranulocytosis. This condition destroys the bone marrow's ability to produce neutrophils (WBCs), leaving the patient completely defenseless against fatal bacterial infections. Strict ANC monitoring is a legal requirement to dispense the drug."}, {"d": 5, "q": "A patient is admitted to the medical unit in severe alcohol withdrawal. The patient is experiencing vivid visual hallucinations, profound confusion, and severe autonomic hyperactivity (HR 145, BP 190/110, Temp 102.5°F). What is the standard pharmacological treatment to save this patient's life and stop the neurological storm?", "o": ["Intravenous Benzodiazepines (e.g., Diazepam, Lorazepam, or Chlordiazepoxide) pushed on a strict symptom-triggered protocol (CIWA)", "Intravenous Typical Antipsychotics (e.g., Haloperidol) to stop the hallucinations", "A continuous IV infusion of pure ethanol", "Oral Disulfiram (Antabuse) to cause severe vomiting"], "a": 0, "r": "The patient is in Delirium Tremens (DTs), a fatal medical emergency. Alcohol is a massive CNS depressant; withdrawing it causes the brain to 'hyper-excite' uncontrollably. Benzodiazepines are the gold standard because they act on the exact same GABA receptors as alcohol, artificially suppressing the hyper-excitable brain, stopping the seizures, and correcting the massive autonomic instability."}, {"d": 5, "q": "A patient with Bipolar I Disorder is admitted in a state of acute mania. The patient is constantly moving, pacing, and refuses to sit down for meals. Which dietary intervention is most appropriate for this patient?", "o": ["Provide high-calorie, high-protein finger foods (e.g., chicken nuggets, protein bars, sandwiches) that the patient can eat while walking", "Force the patient to sit at the table until they finish a full hot meal", "Provide only clear liquids until the manic episode passes", "Withhold food until the patient agrees to sit calmly"], "a": 0, "r": "Patients in acute mania are hyperactive, easily distractible, and burn massive amounts of calories. They physically cannot sit still long enough to eat a traditional meal, placing them at severe risk for malnutrition and exhaustion. High-calorie, nutrient-dense finger foods allow them to eat 'on the go.'"}, {"d": 5, "q": "A patient with schizophrenia is speaking to the nurse and says, 'I went to the park, dark, bark, shark. The sun is fun, run, gun.' What specific type of disorganized speech pattern is the patient exhibiting?", "o": ["Clang associations", "Word salad", "Echolalia", "Neologisms"], "a": 0, "r": "Clang associations are a severe thought disorder characterized by grouping words together based on how they sound (rhyming or alliteration), rather than what they mean. Word salad is a completely random jumble of words. Echolalia is repeating another person's words."}, {"d": 5, "q": "A pediatric nurse notices distinct, circular burn marks on the back and legs of a 5-year-old child. The parents' explanation of the injury is highly inconsistent. What is the nurse's legally mandated FIRST action?", "o": ["Report the suspected abuse immediately to the designated child protective services agency or local authorities", "Confront the parents directly and accuse them of burning the child", "Document the findings and monitor the child for another week", "Ask the child in front of the parents who burned them"], "a": 0, "r": "Nurses are strict mandatory reporters. If there is a reasonable suspicion of child abuse (e.g., injuries inconsistent with the history, distinct shapes like cigarette burns), the nurse is legally obligated to report it immediately to child protective authorities. The nurse must NEVER investigate or confront the parents, as this jeopardizes the child's safety and the investigation."}, {"d": 5, "q": "A patient with schizophrenia is prescribed Clozapine (Clozaril). The patient comes to the clinic for a routine check-up and complains of a sore throat, fever, and extreme fatigue. The nurse reviews the patient's CBC and notes the Absolute Neutrophil Count (ANC) is 400/mm³. What life-threatening complication has occurred?", "o": ["Agranulocytosis", "Neuroleptic Malignant Syndrome (NMS)", "Tardive Dyskinesia", "Serotonin Syndrome"], "a": 0, "r": "Clozapine is an incredibly effective atypical antipsychotic, but it carries a severe 'black box' warning for Agranulocytosis. This condition destroys the bone marrow's ability to produce neutrophils (an ANC < 500 is severe neutropenia), leaving the patient completely defenseless against fatal bacterial infections. The drug must be stopped immediately."}, {"d": 5, "q": "A patient diagnosed with severe panic disorder is having an acute, overwhelming panic attack in the clinic. The patient is hyperventilating, crying, and states, 'I am having a heart attack, I'm going to die!' What is the nurse's priority intervention?", "o": ["Remain with the patient at all times, maintain a calm demeanor, and use short, simple, directive sentences", "Leave the patient alone in a quiet room so they can calm themselves down without embarrassment", "Begin immediate, deep cognitive behavioral therapy to explore the root cause of the panic", "Tell the patient firmly to stop crying because their heart is fine"], "a": 0, "r": "During an acute panic attack, a patient's 'fight or flight' system is completely overloaded; they cannot process complex information or logic. The nurse MUST stay with the patient (abandoning them massively increases terror), project a calm presence, and use very short, simple directives (e.g., 'Breathe with me') until the panic subsides."}, {"d": 5, "q": "A patient with schizophrenia is prescribed Haloperidol. A few days later, the patient develops severe restlessness, constant pacing, and an inability to sit still for even a few seconds. The patient states, 'I feel like I'm jumping out of my skin.' What is this specific Extrapyramidal Side Effect (EPS) called?", "o": ["Akathisia", "Tardive Dyskinesia", "Acute Dystonia", "Pseudoparkinsonism"], "a": 0, "r": "Akathisia is an agonizing, severe internal restlessness and an absolute physical inability to sit still. Patients will constantly pace, shift their weight, and tap their feet. It is a highly distressing EPS that frequently leads to suicide attempts if left untreated. It is treated with beta-blockers (Propranolol) or anticholinergics."}, {"d": 5, "q": "A patient with Major Depressive Disorder has been taking an SSRI (Sertraline) for 6 months. The patient comes to the clinic stating, 'I feel so much better, I threw all my pills away 3 days ago.' What complication is the patient at immediate risk for?", "o": ["SSRI Discontinuation Syndrome (severe flu-like symptoms, brain zaps, agitation)", "Serotonin Syndrome", "Neuroleptic Malignant Syndrome", "A massive hypertensive crisis"], "a": 0, "r": "Antidepressants significantly alter brain neurochemistry. If an SSRI or SNRI is stopped abruptly 'cold turkey,' the brain crashes, resulting in SSRI Discontinuation Syndrome. Symptoms are brutal and include severe flu-like symptoms, dizziness, lethargy, anxiety, and electrical shock sensations in the head ('brain zaps'). The medication must ALWAYS be slowly tapered."}, {"d": 5, "q": "A patient is admitted to the psychiatric unit with a diagnosis of Antisocial Personality Disorder. The patient approaches the nurse and says, 'You are the only smart nurse here. Let me use the phone past curfew, I won't tell anyone.' What is the nurse's most therapeutic response?", "o": ["'The phone rules apply to everyone. You cannot use the phone past curfew.'", "'Since you promised not to tell, you can use it for 5 minutes.'", "'Why do you think the other nurses are not smart?'", "'I will ask the doctor if we can make an exception for you tonight.'"], "a": 0, "r": "Patients with Antisocial Personality Disorder are highly manipulative, charming, and lack regard for rules or boundaries. They frequently attempt to 'split' staff. The absolute cornerstone of treating this disorder is maintaining rigid, consistent boundaries and enforcing unit rules firmly, without negotiation or argument."}, {"d": 5, "q": "A patient with major depressive disorder is prescribed Tranylcypromine, a Monoamine Oxidase Inhibitor (MAOI). The patient eats a large meal of aged cheddar cheese, smoked salami, and a glass of red wine. Two hours later, the patient develops a severe, pounding headache, a stiff neck, and a blood pressure of 230/130 mmHg. What medication should the nurse anticipate administering?", "o": ["Phentolamine (an alpha-adrenergic blocker) to rapidly lower the blood pressure", "Naloxone (an opioid antagonist) to reverse the food effects", "Flumazenil (a benzodiazepine antagonist) to calm the patient", "Protamine Sulfate to reverse the tyramine"], "a": 0, "r": "The patient is experiencing a massive, fatal Hypertensive Crisis caused by mixing an MAOI with high-tyramine foods. Tyramine causes a massive release of norepinephrine, violently spiking the blood pressure. Phentolamine (an alpha-blocker) or Nitroprusside is administered intravenously to immediately vasodilate and drop the blood pressure to prevent a hemorrhagic stroke."}, {"d": 5, "q": "A patient is admitted to the psychiatric unit with a diagnosis of Bulimia Nervosa. The nurse is performing a physical assessment. Which specific physical finding is a classic hallmark of chronic self-induced vomiting?", "o": ["Calluses or scars on the knuckles or back of the hand (Russell's sign) and severe dental enamel erosion", "Lanugo (fine, downy hair) covering the face and back", "Profound, life-threatening bradycardia and hypothermia", "Bronze hyperpigmentation of the skin"], "a": 0, "r": "Patients with Bulimia Nervosa frequently use their hands to stimulate the gag reflex to induce vomiting. The repeated friction of the teeth against the hand causes thick calluses or scars on the knuckles, known classically as 'Russell's sign.' The chronic exposure to stomach acid also severely erodes the dental enamel."}, {"d": 5, "q": "A patient with Bipolar disorder is prescribed Valproic Acid (Depakote) as a mood stabilizer. The nurse is preparing the patient for their routine 3-month follow-up lab work. Which specific laboratory panel MUST the nurse intensely monitor due to this drug's most dangerous adverse effect?", "o": ["Liver Function Tests (AST, ALT, Bilirubin) to monitor for fatal hepatotoxicity", "Comprehensive Metabolic Panel (CMP) to monitor for acute renal failure", "A fasting lipid panel to monitor for severe hypercholesterolemia", "An arterial blood gas to monitor for respiratory acidosis"], "a": 0, "r": "Valproic acid is a highly effective anti-seizure and mood-stabilizing drug. However, it carries a severe 'black box' warning for fatal, massive hepatotoxicity (liver failure) and pancreatitis. Liver enzymes (AST, ALT) and signs of liver damage (jaundice, right upper quadrant pain) must be monitored continuously throughout therapy."}, {"d": 5, "q": "A patient with schizophrenia is speaking to the nurse. The patient says, 'I need to go to the flim-flam to get my snicker-snack because the florb is too bright.' The nurse recognizes that the patient is making up entirely new words that have no meaning to anyone else. What is the clinical term for this psychiatric symptom?", "o": ["Neologisms", "Echolalia", "Word salad", "Clang associations"], "a": 0, "r": "Neologisms are a severe thought disorder characterized by the creation of brand new, made-up words that have meaning only to the patient. Ech
