dition should the nurse suspect?", "o": ["Fat Embolism Syndrome", "Pulmonary Embolism", "Disseminated Intravascular Coagulation", "Sepsis"], "a": 0, "r": "Fat Embolism Syndrome typically occurs 24-72 hours after long-bone fractures, presenting with the classic triad of respiratory distress, neurological impairment/confusion, and a petechial rash over the chest/neck."}, {"d": 2, "q": "[Med-Surg Case 87] The nurse assesses a patient in skeletal traction for a femur fracture. Which finding requires IMMEDIATE intervention?", "o": ["The traction weights are resting flat on the floor", "The patient's leg is maintained in alignment", "The skin around pin sites is clean and dry", "The patient uses a trapeze bar to adjust position"], "a": 0, "r": "Traction weights must hang freely at all times to maintain continuous traction force. Weights touching the floor defeat the purpose of traction."}, {"d": 2, "q": "[Med-Surg Case 88] A patient who underwent abdominal surgery 4 days ago feels a sudden 'popping' sensation while coughing. The nurse inspects the wound and sees loops of small intestine protruding. What is the FIRST action?", "o": ["Position the patient in low Fowler's with knees flexed and cover the organs with sterile saline-moistened dressings", "Gently push the intestinal loops back into the abdomen", "Apply a tight abdominal binder", "Instruct the patient to ambulate to the procedure room"], "a": 0, "r": "Wound evisceration is a surgical emergency. Place the patient in low Fowler's with knees flexed, cover exposed viscera with sterile drapes soaked in warm 0.9% Normal Saline, and call the surgeon immediately."}, {"d": 2, "q": "[Med-Surg Case 89] A adult patient with partial and full-thickness burns over 30% Total Body Surface Area (TBSA) weighs 70 kg. Using the Parkland Formula (4 mL x kg x %TBSA), how much Lactated Ringer's should be given in the FIRST 8 HOURS from injury?", "o": ["4,200 mL", "8,400 mL", "2,100 mL", "5,600 mL"], "a": 0, "r": "Total 24h Fluid = 4 mL x 70 kg x 30 = 8,400 mL. Half of this total (4,200 mL) must be infused in the FIRST 8 hours from the time of burn injury."}, {"d": 2, "q": "[Med-Surg Case 90] A patient receiving chemotherapy has an Absolute Neutrophil Count (ANC) of 350/mm\u00b3 and develops a temperature of 38.3\u00b0C. What is the nurse's PRIORITY action?", "o": ["Notify the oncologist immediately and prepare for STAT blood cultures and empiric IV antibiotics", "Administer oral Paracetamol and recheck temperature in 4 hours", "Encourage fresh fruit consumption to boost immunity", "Place a cooling blanket on the patient"], "a": 0, "r": "Febrile neutropenia (ANC <500/mm\u00b3 with fever \u226538.0\u00b0C) is a life-threatening medical emergency. Immediate blood cultures and prompt empiric broad-spectrum IV antibiotic administration within 1 hour are essential to prevent septic shock."}, {"d": 2, "q": "[Med-Surg Case 91] A 58-year-old male presents to the ER with crushing retrosternal chest pain radiating to his left jaw and diaphoresis. Vital signs: BP 145/88 mmHg, HR 102 bpm, SpO2 96% on room air. After obtaining a 12-lead ECG, which medication should the nurse administer FIRST unless contraindicated?", "o": ["Chewed non-enteric coated Aspirin 162-325 mg", "Sublingual Nitroglycerin 0.4 mg", "IV Morphine Sulfate 2 mg", "Oral Metoprolol 25 mg"], "a": 0, "r": "In suspected Acute Coronary Syndrome (ACS), chewed Aspirin (162-325 mg) is the immediate priority intervention to rapidly inhibit platelet aggregation and reduce mortality, provided no allergy or active GI bleeding exists."}, {"d": 2, "q": "[Med-Surg Case 92] A patient presenting with acute chest pain has a 12-lead ECG showing ST-segment elevation in leads II, III, and aVF. Which wall of the heart and coronary artery are affected?", "o": ["Inferior wall / Right Coronary Artery (RCA)", "Anterior wall / Left Anterior Descending (LAD)", "Lateral wall / Left Circumflex (LCX)", "Posterior wall / Posterior Descending Artery"], "a": 0, "r": "ST elevation in leads II, III, and aVF indicates an Inferior Wall Myocardial Infarction, which is supplied by the Right Coronary Artery (RCA)."}, {"d": 2, "q": "[Med-Surg Case 93] A patient with severe left-sided heart failure presents with worsening dyspnea, orthopnea, bilateral lung crackles, and pink frothy sputum. SpO2 is 84%. What is the nurse's IMMEDIATE priority?", "o": ["Apply high-flow oxygen, position the patient upright in High Fowler's, and prepare IV Furosemide", "Place the patient flat in supine position and administer IV Normal Saline bolus", "Encourage the patient to perform incentive spirometry 10 times", "Administer oral digoxin and place the patient in Trendelenburg position"], "a": 0, "r": "Pink frothy sputum and crackles indicate acute pulmonary edema secondary to left heart failure. Priority actions: sitting upright (reduces venous return/preload), high-flow oxygen, and IV loop diuretics (Furosemide) to reduce fluid volume."}, {"d": 2, "q": "[Med-Surg Case 94] A patient receiving Furosemide 80 mg IV daily for heart failure exhibits muscle weakness and ECG changes. Which serum potassium level requires IMMEDIATE intervention?", "o": ["2.8 mEq/L", "4.2 mEq/L", "5.1 mEq/L", "3.8 mEq/L"], "a": 0, "r": "Furosemide is a potassium-wasting loop diuretic. Severe hypokalemia (<3.5 mEq/L, especially <3.0 mEq/L) increases the risk of fatal cardiac arrhythmias and digoxin toxicity."}, {"d": 2, "q": "[Med-Surg Case 95] A patient taking Digoxin 0.25 mg daily reports loss of appetite, nausea, and seeing yellow-green halos around lights. The apical pulse is 48 bpm. What is the nurse's FIRST action?", "o": ["Withhold the Digoxin dose and notify the healthcare provider immediately", "Administer the Digoxin dose with an antacid", "Encourage the patient to drink 500 mL of water", "Administer a potassium-sparing diuretic"], "a": 0, "r": "Nausea, anorexia, visual disturbances (yellow-green halos), and bradycardia (HR <60 bpm) are classic signs of Digoxin toxicity. The dose must be held and the provider notified to check serum digoxin and potassium levels."}, {"d": 2, "q": "[Med-Surg Case 96] A 65-year-old patient with chronic atrial fibrillation has a 12-lead ECG showing an irregularly irregular rhythm with absent P waves. The patient is prescribed Warfarin. What is the target International Normalized Ratio (INR)?", "o": ["2.0 to 3.0", "0.8 to 1.2", "4.0 to 5.0", "1.0 to 1.5"], "a": 0, "r": "The therapeutic target INR for stroke prevention in atrial fibrillation on Warfarin therapy is 2.0 to 3.0."}, {"d": 2, "q": "[Med-Surg Case 97] A patient in septic shock remains hypotensive with BP 80/45 mmHg and serum lactate 4.2 mmol/L despite receiving a 30 mL/kg IV crystalloid bolus. Which first-line vasopressor should the nurse anticipate?", "o": ["Norepinephrine infusion titrated to maintain MAP \u2265 65 mmHg", "Epinephrine sublingual tablet", "Dopamine IV push", "Atropine IV bolus"], "a": 0, "r": "Surviving Sepsis guidelines identify Norepinephrine as the first-line vasopressor of choice for septic shock unresponsive to initial fluid resuscitation, targeting a Mean Arterial Pressure (MAP) \u2265 65 mmHg."}, {"d": 2, "q": "[Med-Surg Case 98] A patient develops acute severe anaphylactic shock following IV penicillin administration, presenting with stridor, wheezing, and BP 70/40 mmHg. What is the FIRST-LINE life-saving drug?", "o": ["Intramuscular Epinephrine (1:1000) into the anterolateral thigh", "IV Hydrocortisone", "Oral Diphenhydramine", "Inhaled Salbutamol alone"], "a": 0, "r": "Intramuscular Epinephrine (0.3-0.5 mg of 1:1000) into the anterolateral thigh is the immediate first-line drug for anaphylaxis to reverse airway constriction and severe vasodilation."}, {"d": 2, "q": "[Med-Surg Case 99] A patient in cardiac arrest has an ECG showing Ventricular Fibrillation (VF). CPR is in progress. What is the immediate priority intervention?", "o": ["Deliver an immediate unsynchronized shock (defibrillation)", "Administer IV Atropine 1 mg", "Perform a 12-lead ECG", "Perform synchronized cardioversion"], "a": 0, "r": "Ventricular Fibrillation (VF) and Pulseless Ventricular Tachycardia (pVT) are shockable rhythms. The immediate priority is early defibrillation combined with continuous high-quality CPR."}, {"d": 2, "q": "[Med-Surg Case 100] A patient with severe COPD presents with drowsiness, lethargy, and shallow breathing after receiving oxygen via simple face mask at 10 L/min. SpO2 is 99%. What is the underlying cause?", "o": ["CO2 retention and narcosis secondary to suppression of the hypoxic drive", "Severe acute pulmonary embolism", "Acute metabolic acidosis", "Sudden development of pneumothorax"], "a": 0, "r": "In chronic hypercapnic COPD, high oxygen concentrations suppress the hypoxic drive (the main stimulus for breathing), leading to hypoventilation, severe CO2 retention, and CO2 narcosis."}, {"d": 2, "q": "[Med-Surg Case 101] A patient experiencing an acute severe asthma attack has severe intercostal retractions and audible wheezing. Five minutes later, the nurse notes that breath sounds are completely absent ('silent chest'). What does this signify?", "o": ["Imminent respiratory failure due to severe airflow obstruction requiring emergency intubation", "Spontaneous resolution of the bronchospasm", "Development of hyperventilation syndrome", "Normal clearing of bronchial secretions"], "a": 0, "r": "A 'silent chest' in a severe asthma attack indicates that airflow has become so critically restricted that no air is moving, signaling impending respiratory arrest and emergency airway intervention."}, {"d": 2, "q": "[Med-Surg Case 102] A patient with a deep vein thrombosis suddenly develops sharp pleuritic chest pain, dyspnea, and tachycardia (HR 124 bpm). SpO2 is 86%. What complication is suspected?", "o": ["Pulmonary Embolism (PE)", "Myocardial Infarction", "Atelectasis", "Pneumothorax"], "a": 0, "r": "Sudden onset dyspnea, pleuritic chest pain, tachycardia, and hypoxemia in a patient with DVT strongly suggest Pulmonary Embolism."}, {"d": 2, "q": "[Med-Surg Case 103] A trauma patient presents with severe dyspnea, absent breath sounds on the right side, hyperresonance to percussion, tracheal deviation to the left, and BP 78/48 mmHg. What is the immediate treatment?", "o": ["Immediate needle decompression in the 2nd intercostal space midclavicular line", "Endotracheal intubation and mechanical ventilation", "Administering IV fluid bolus 1000 mL", "Obtaining a STAT chest X-ray"], "a": 0, "r": "Tracheal deviation, absent breath sounds, and shock indicate a Tension Pneumothorax. This is a clinical emergency requiring immediate needle decompression prior to chest tube insertion."}, {"d": 2, "q": "[Med-Surg Case 104] The nurse notes continuous bubbling in the water-seal chamber of a patient's closed chest drainage system. What does this finding indicate?", "o": ["An air leak in the drainage system or pleural space", "Normal system functioning during exhalation", "Full lung re-expansion", "Blockage in the chest tube"], "a": 0, "r": "Continuous bubbling in the water-seal chamber indicates an air leak in the system or persistent leak from the lung. Intermittent bubbling during exhalation or coughing can be normal early on."}, {"d": 2, "q": "[Med-Surg Case 105] An arterial blood gas (ABG) result reveals: pH 7.28, PaCO2 58 mmHg, HCO3 25 mEq/L. How should the nurse interpret this result?", "o": ["Uncompensated Respiratory Acidosis", "Uncompensated Metabolic Acidosis", "Fully compensated Respiratory Alkalosis", "Partially compensated Metabolic Alkalosis"], "a": 0, "r": "pH <7.35 (acidosis) with PaCO2 >45 mmHg (respiratory component elevated) and normal HCO3 indicates Uncompensated Respiratory Acidosis (e.g., hypoventilation, COPD, opioid overdose)."}, {"d": 2, "q": "[Med-Surg Case 106] A patient suspected of having an acute ischemic stroke arrives at the emergency room. Which diagnostic test must be performed FIRST before thrombolytic therapy (tPA)?", "o": ["Non-contrast CT ion of hips and knees upon passive neck flexion) is a classic indicator of meningeal irritation."}, {"d": 2, "q": "[Med-Surg Case 110] A patient presenting with acute epigastric pain radiating to the back is suspected of having acute pancreatitis. Which laboratory test is MOST specific for acute pancreatitis?", "o": ["Serum Lipase", "Serum Amylase", "Total Bilirubin", "Serum Calcium"], "a": 0, "r": "Serum Lipase is more sensitive and specific than amylase for acute pancreatitis and remains elevated longer."}, {"d": 2, "q": "[Med-Surg Case 111] A patient with end-stage liver cirrhosis develops flapping tremors of the hands (asterixis) and confusion. Which serum lab value is expected to be elevated?", "o": ["Serum Ammonia", "Serum Creatinine", "Serum Sodium", "Serum Potassium"], "a": 0, "r": "Hepatic encephalopathy is caused by impaired liver clearance of nitrogenous toxins, leading to elevated blood ammonia levels, confusion, and asterixis (flapping tremor)."}, {"d": 2, "q": "[Med-Surg Case 112] A patient with Type 1 Diabetes presents with blood glucose 420 mg/dL, arterial pH 7.18, HCO3 12 mEq/L, and Kussmaul respirations. What is the PRIORITY initial treatment for Diabetic Ketoacidosis (DKA)?", "o": ["Rapid IV fluid resuscitation with 0.9% Normal Saline", "Immediate IV push bolus of NPH insulin", "Subcutaneous Glargine insulin injection", "IV sodium bicarbonate bolus"], "a": 0, "r": "The immediate priority in DKA is rehydration with isotonic fluid (0.9% Normal Saline) to restore intravascular volume and renal perfusion before starting IV regular insulin infusion."}, {"d": 2, "q": "[Med-Surg Case 113] A diabetic patient is found unconscious, diaphoretic, and cool to touch. Blood glucose is 34 mg/dL. The patient has no IV access. What is the immediate treatment?", "o": ["Administer Glucagon 1 mg IM/SC", "Give 150 mL orange juice orally", "Insert an NG tube and administer corn syrup", "Inject Regular insulin 10 units SC"], "a": 0, "r": "In severe hypoglycemia with loss NR for stroke prevention in atrial fibrillation on Warfarin therapy is 2.0 to 3.0."}, {"d": 2, "q": "[Med-Surg Case 127] A patient in septic shock remains hypotensive with BP 80/45 mmHg and serum lactate 4.2 mmol/L despite receiving a 30 mL/kg IV crystalloid bolus. Which first-line vasopressor should the nurse anticipate?", "o": ["Norepinephrine infusion titrated to maintain MAP \u2265 65 mmHg", "Epinephrine sublingual tablet", "Dopamine IV push", "Atropine IV bolus"], "a": 0, "r": "Surviving Sepsis guidelines identify Norepinephrine as the first-line vasopressor of choice for septic shock unresponsive to initial fluid resuscitation, targeting a Mean Arterial Pressure (MAP) \u2265 65 mmHg."}, {"d": 2, "q": "[Med-Surg Case 128] A patient develops acute severe anaphylactic shock following IV penicillin administration, presenting with stridor, wheezing, and BP 70/40 mmHg. What is the FIRST-LINE life-saving drug?", "o": ["Intramuscular Epinephrine (1:1000) into the anterolateral thigh", "IV Hydrocortisone", "Oral Diphenhydramine", "Inhaled Salbutamol alone"], "a": 0, "r": "Intramuscular Epinephrine (0.3-0.5 mg of 1:1000) into the anterolateral thigh is the immediate first-line drug for anaphylaxis to reverse airway constriction and severe vasodilation."}, {"d": 2, "q": "[Med-Surg Case 129] A patient in cardiac arrest has an ECG showing Ventricular Fibrillation (VF). CPR is in progress. What is the immediate priority intervention?", "o": ["Deliver an immediate unsynchronized shock (defibrillation)", "Administer IV Atropine 1 mg", "Perform a 12-lead ECG", "Perform synchronized cardioversion"], "a": 0, "r": "Ventricular Fibrillation (VF) and Pulseless Ventricular Tachycardia (pVT) are shockable rhythms. The immediate priority is early defibrillation combined with continuous high-quality CPR."}, {"d": 2, "q": "[Med-Surg Case 130] A patient with severe COPD presents with drowsiness, lethargy, and shallow breathing after receiving oxygen via simple face mask at 10 L/min. SpO2 000 mL", "Obtaining a STAT chest X-ray"], "a": 0, "r": "Tracheal deviation, absent breath sounds, and shock indicate a Tension Pneumothorax. This is a clinical emergency requiring immediate needle decompression prior to chest tube insertion."}, {"d": 2, "q": "[Med-Surg Case 134] The nurse notes continuous bubbling in the water-seal chamber of a patient's closed chest drainage system. What does this finding indicate?", "o": ["An air leak in the drainage system or pleural space", "Normal system functioning during exhalation", "Full lung re-expansion", "Blockage in the chest tube"], "a": 0, "r": "Continuous bubbling in the water-seal chamber indicates an air leak in the system or persistent leak from the lung. Intermittent bubbling during exhalation or coughing can be normal early on."}, {"d": 2, "q": "[Med-Surg Case 135] An arterial blood gas (ABG) result reveals: pH 7.28, PaCO2 58 mmHg, HCO3 25 mEq/L. How should the nurse interpret this result?", "o": ["Uncompensated Respiratory Acidosis", "Uncompensated Metabolic Acidosis", "Fully compensated Respiratory Alkalosis", "Partially compensated Metabolic Alkalosis"], "a": 0, "r": "pH <7.35 (acidosis) with PaCO2 >45 mmHg (respiratory component elevated) and normal HCO3 indicates Uncompensated Respiratory Acidosis (e.g., hypoventilation, COPD, opioid overdose)."}, {"d": 2, "q": "[Med-Surg Case 136] A patient suspected of having an acute ischemic stroke arrives at the emergency room. Which diagnostic test must be performed FIRST before thrombolytic therapy (tPA)?", "o": ["Non-contrast CT scan of the head", "Electroencephalogram (EEG)", "Lumbar puncture", "Carotid duplex ultrasound"], "a": 0, "r": "A STAT non-contrast head CT scan is mandatory to rule out intracranial hemorrhage before administering thrombolytic therapy (IV tPA)."}, {"d": 2, "q": "[Med-Surg Case 137] A patient with a traumatic head injury has a declining level of consciousness. Vital signs show SBP rising from 120 to 175 mmHg, pulse dropping from 78 to 48 bpm, and irregular breathing. What is this clinical triad called?", "o": ["Cushing's Triad (sign of increased ICP and impending brain herniation)", "Beck's Triad", "Charcot's Triad", "Virchow's Triad"], "a": 0, "r": "Cushing's Triad (systolic hypertension with widened pulse pressure, bradycardia, and irregular respirations) is a late sign of severely increased intracranial pressure and brainstem compression."}, {"d": 2, "q": "[Med-Surg Case 138] A patient with a spinal cord injury at the T4 level reports a severe pounding headache and nasal congestion. BP is 210/110 mmHg and HR is 52 bpm. The skin above T4 is flushed and sweaty. What is the nurse's FIRST action?", "o": ["Elevate the head of the bed to 90 degrees (High Fowler's)", "Administer IV Morphine Sulfate", "Check for a deep vein thrombosis in the lower extremities", "Place the patient flat in Trendelenburg position"], "a": 0, "r": "This is Autonomic Dysreflexia (a medical emergency in SCI at or above T6). The immediate FIRST action is to sit the patient upright at 90\u00b0 to allow gravity to lower blood pressure, then search for the trigger (most commonly bladder distension or fecal impaction)."}, {"d": 2, "q": "[Med-Surg Case 139] A patient admitted with suspected bacterial meningitis exhibits severe neck stiffness. When the nurse flexes the patient's neck, involuntary flexion of the hips and knees occurs. What is this sign called?", "o": ["Brudzinski's sign", "Kernig's sign", "Chvostek's sign", "Trousseau's sign"], "a": 0, "r": "Positive Brudzinski's sign (involuntary flexion of hips and knees upon passive neck flexion) is a classic indicator of meningeal irritation."}, {"d": 2, "q": "[Med-Surg Case 140] A patient presenting with acute epigastric pain radiating to the back is suspected of having acute pancreatitis. Which laboratory test is MOST specific for acute pancreatitis?", "o": ["Serum Lipase", "Serum Amylase", "Total Bilirubin", "Serum Calcium"], "a": 0, "r": "Serum Lipase is more sensitive and specific than amylase for acute pancreatitis and remains elevated longer."}, {"d": 2, "q": "[Med-Surg Case 141] A patient with end-stage liver cirrhosis develops flapping tremors of the hands (asterixis) and confusion. Which serum lab value is expected to be elevated?", "o": ["Serum Ammonia", "Serum Creatinine", "Serum Sodium", "Serum Potassium"], "a": 0, "r": "Hepatic encephalopathy is caused by impaired liver clearance of nitrogenous toxins, leading to elevated blood ammonia levels, confusion, and asterixis (flapping tremor)."}, {"d": 2, "q": "[Med-Surg Case 142] A patient with Type 1 Diabetes presents with blood glucose 420 mg/dL, arterial pH 7.18, HCO3 12 mEq/L, and Kussmaul respirations. What is the PRIORITY initial treatment for Diabetic Ketoacidosis (DKA)?", "o": ["Rapid IV fluid resuscitation with 0.9% Normal Saline", "Immediate IV push bolus of NPH insulin", "Subcutaneous Glargine insulin injection", "IV sodium bicarbonate bolus"], "a": 0, "r": "The immediate priority in DKA is rehydration with isotonic fluid (0.9% Normal Saline) to restore intravascular volume and renal perfusion before starting IV regular insulin infusion."}, {"d": 2, "q": "[Med-Surg Case 143] A diabetic patient is found unconscious, diaphoretic, and cool to touch. Blood glucose is 34 mg/dL. The patient has no IV access. What is the immediate treatment?", "o": ["Administer Glucagon 1 mg IM/SC", "Give 150 mL orange juice orally", "Insert an NG tube and administer corn syrup", "Inject Regular insulin 10 units SC"], "a": 0, "r": "In severe hypoglycemia with loss of consciousness and no IV access, IM or SC Glucagon is the treatment of choice to rapidly mobilize liver glycogen."}, {"d": 2, "q": "[Med-Surg Case 144] Following a total thyroidectomy, a patient reports tingling around the lips and fingertips. Tapping the facial nerve elicits facial muscle twitching. What complication is present?", "o": ["Hypocalcemia due to accidental parathyroid removal (positive Chvostek's sign)", "Hypercalcemia due to thyroid hormone surge", "Thyroid storm", "Recurrent laryngeal nerve damage"], "a": 0, "r": "Accidental removal or injury to the parathyroid glands during thyroidectomy leads to hypocalcemia, characterized by neuromuscular irritability, positive Chvostek's sign, and positive Trousseau's sign. IV Calcium Gluconate must be available."}, {"d": 2, "q": "[Med-Surg Case 145] A patient who suffered a closed fracture of the right tibia 24 hours ago reports severe, agonizing pain unrelieved by IV morphine. The right foot is pale, paresthetic, and cold. What complication is developing?", "o": ["Compartment Syndrome", "Fat Embolism Syndrome", "Deep Vein Thrombosis", "Osteomyelitis"], "a": 0, "r": "Severe pain out of proportion to injury and unrelieved by opioids, accompanied by paresthesia, pallor, and coolness (5 Ps), indicates Compartment Syndrome\u2014an emergency requiring immediate fasciotomy."}, {"d": 2, "q": "[Med-Surg Case 146] A patient who sustained a bilateral femur fracture 36 hours ago develops dyspnea, confusion, and a petechial rash across his neck and anterior chest. What condition should the nurse suspect?", "o": ["Fat Embolism Syndrome", "Pulmonary Embolism", "Disseminated Intravascular Coagulation", "Sepsis"], "a": 0, "r": "Fat Embolism Syndrome typically occurs 24-72 hours after long-bone fractures, presenting with the classic triad of respiratory distress, neurological impairment/confusion, and a petechial rash over the chest/neck."}, {"d": 2, "q": "[Med-Surg Case 147] The nurse assesses a patient in skeletal traction for a femur fracture. Which finding requires IMMEDIATE intervention?", "o": ["The traction weights are resting flat on the floor", "The patient's leg is maintained in alignment", "The skin around pin sites is clean and dry", "The patient uses a trapeze bar to adjust position"], "a": 0, "r": "Traction weights must hang freely at all times to maintain continuous traction force. Weights touching the floor defeat the purpose of traction."}, {"d": 2, "q": "[Med-Surg Case 148] A patient who underwent abdominal surgery 4 days ago feels a sudden 'popping' sensation while coughing. The nurse inspects the wound and sees loops of small intestine protruding. What is the FIRST action?", "o": ["Position the patient in low Fowler's with knees flexed and cover the organs with sterile saline-moistened dressings", "Gently push the intestinal loops back into the abdomen", "Apply a tight abdominal binder", "Instruct the patient to ambulate to the procedure room"], "a": 0, "r": "Wound evisceration is a surgical emergency. Place the patient in low Fowler's with knees flexed, cover exposed viscera with sterile drapes soaked in warm 0.9% Normal Saline, and call the surgeon immediately."}, {"d": 2, "q": "[Med-Surg Case 149] A adult patient with partial and full-thickness burns over 30% Total Body Surface Area (TBSA) weighs 70 kg. Using the Parkland Formula (4 mL x kg x %TBSA), how much Lactated Ringer's should be given in the FIRST 8 HOURS from injury?", "o": ["4,200 mL", "8,400 mL", "2,100 mL", "5,600 mL"], "a": 0, "r": "Total 24h Fluid = 4 mL x 70 kg x 30 = 8,400 mL. Half of this total (4,200 mL) must be infused in the FIRST 8 hours from the time of burn injury."}, {"d": 2, "q": "[Med-Surg Case 150] A patient receiving chemotherapy has an Absolute Neutrophil Count (ANC) of 350/mm\u00b3 and develops a temperature of 38.3\u00b0C. What is the nurse's PRIORITY action?", "o": ["Notify the oncologist immediately and prepare for STAT blood cultures and empiric IV antibiotics", "Administer oral Paracetamol and recheck temperature in 4 hours", "Encourage fresh fruit consumption to boost immunity", "Place a cooling blanket on the patient"], "a": 0, "r": "Febrile neutropenia (ANC <500/mm\u00b3 with fever \u226538.0\u00b0C) is a life-threatening medical emergency. Immediate blood cultures and prompt empiric broad-spectrum IV antibiotic administration within 1 hour are essential to prevent septic shock."}, {"d": 2, "q": "[Med-Surg Case 151] A 58-year-old male presents to the ER with crushing retrosternal chest pain radiating to his left jaw and diaphoresis. Vital signs: BP 145/88 mmHg, HR 102 bpm, SpO2 96% on room air. After obtaining a 12-lead ECG, which medication should the nurse administer FIRST unless contraindicated?", "o": ["Chewed non-enteric coated Aspirin 162-325 mg", "Sublingual Nitroglycerin 0.4 mg", "IV Morphine Sulfate 2 mg", "Oral Metoprolol 25 mg"], "a": 0, "r": "In suspected Acute Coronary Syndrome (ACS), chewed Aspirin (162-325 mg) is the immediate priority intervention to rapidly inhibit platelet aggregation and reduce mortality, provided no allergy or active GI bleeding exists."}, {"d": 2, "q": "[Med-Surg Case 152] A patient presenting with acute chest pain has a 12-lead ECG showing ST-segment elevation in leads II, III, and aVF. Which wall of the heart and coronary artery are affected?", "o": ["Inferior wall / Right Coronary Artery (RCA)", "Anterior wall / Left Anterior Descending (LAD)", "Lateral wall / Left Circumflex (LCX)", "Posterior wall / Posterior Descending Artery"], "a": 0, "r": "ST elevation in leads II, III, and aVF indicates an Inferior Wall Myocardial Infarction, which is supplied by the Right Coronary Artery (RCA)."}, {"d": 2, "q": "[Med-Surg Case 153] A patient with severe left-sided heart failure presents with worsening dyspnea, orthopnea, bilateral lung crackles, and pink frothy sputum. SpO2 is 84%. What is the nurse's IMMEDIATE priority?", "o": ["Apply high-flow oxygen, position the patient upright in High Fowler's, and prepare IV Furosemide", "Place the patient flat in supine position and administer IV Normal Saline bolus", "Encourage the patient to perform incentive spirometry 10 times", "Administer oral digoxin and place the patient in Trendelenburg position"], "a": 0, "r": "Pink frothy sputum and crackles indicate acute pulmonary edema secondary to left heart failure. Priority actions: sitting upright (reduces venous return/preload), high-flow oxygen, and IV loop diuretics (Furosemide) to reduce fluid volume."}, {"d": 2, "q": "[Med-Surg Case 154] A patient receiving Furosemide 80 mg IV daily for heart failure exhibits muscle weakness and ECG changes. Which serum potassium level requires IMMEDIATE intervention?", "o": ["2.8 mEq/L", "4.2 mEq/L", "5.1 mEq/L", "3.8 mEq/L"], "a": 0, "r": "Furosemide is a potassium-wasting loop diuretic. Severe hypokalemia (<3.5 mEq/L, especially <3.0 mEq/L) increases the risk of fatal cardiac arrhythmias and digoxin toxicity."}, {"d": 2, "q": "[Med-Surg Case 155] A patient taking Digoxin 0.25 mg daily reports loss of appetite, nausea, and seeing yellow-green halos around lights. The apical pulse is 48 bpm. What is the nurse's FIRST action?", "o": ["Withhold the Digoxin dose and notify the healthcare provider immediately", "Administer the Digoxin dose with an antacid", "Encourage the patient to drink 500 mL of water", "Administer a potassium-sparing diuretic"], "a": 0, "r": "Nausea, anorexia, visual disturbances (yellow-green halos), and bradycardia (HR <60 bpm) are classic signs of Digoxin toxicity. The dose must be held and the provider notified to check serum digoxin and potassium levels."}, {"d": 2, "q": "[Med-Surg Case 156] A 65-year-old patient with chronic atrial fibrillation has a 12-lead ECG showing an irregularly irregular rhythm with absent P waves. The patient is prescribed Warfarin. What is the target International Normalized Ratio (INR)?", "o": ["2.0 to 3.0", "0.8 to 1.2", "4.0 to 5.0", "1.0 to 1.5"], "a": 0, "r": "The therapeutic target INR for stroke prevention in atrial fibrillation on Warfarin therapy is 2.0 to 3.0."}, {"d": 2, "q": "[Med-Surg Case 157] A patient in septic shock remains hypotensive with BP 80/45 mmHg and serum lactate 4.2 mmol/L despite receiving a 30 mL/kg IV crystalloid bolus. Which first-line vasopressor should the nurse anticipate?", "o": ["Norepinephrine infusion titrated to maintain MAP \u2265 65 mmHg", "Epinephrine sublingual tablet", "Dopamine IV binder", "Instruct the patient to ambulate to the procedure room"], "a": 0, "r": "Wound evisceration is a surgical emergency. Place the patient in low Fowler's with knees flexed, cover exposed viscera with sterile drapes soaked in warm 0.9% Normal Saline, and call the surgeon immediately."}, {"d": 2, "q": "[Med-Surg Case 179] A adult patient with partial and full-thickness burns over 30% Total Body Surface Area (TBSA) weighs 70 kg. Using the Parkland Formula (4 mL x kg x %TBSA), how much Lactated Ringer's should be given in the FIRST 8 HOURS from injury?", "o": ["4,200 mL", "8,400 mL", "2,100 mL", "5,600 mL"], "a": 0, "r": "Total 24h Fluid = 4 mL x 70 kg x 30 = 8,400 mL. Half of this total (4,200 mL) must be infused in the FIRST 8 hours from the time of burn injury."}, {"d": 2, "q": "[Med-Surg Case 180] A patient receiving chemotherapy has an Absolute Neutrophil Count (ANC) of 350/mm\u00b3 and develops a temperature of 38.3\u00b0C. What is the nurse's PRIORITY action?", "o": ["Notify the oncologist immediately and prepare for STAT blood cultures and empiric IV antibiotics", "Administer oral Paracetamol and recheck temperature in 4 hours", "Encourage fresh fruit consumption to boost immunity", "Place a cooling blanket on the patient"], "a": 0, "r": "Febrile neutropenia (ANC <500/mm\u00b3 with fever \u226538.0\u00b0C) is a life-threatening medical emergency. Immediate blood cultures and prompt empiric broad-spectrum IV antibiotic administration within 1 hour are essential to prevent septic shock."}, {"d": 2, "q": "[Med-Surg Case 181] A 58-year-old male presents to the ER with crushing retrosternal chest pain radiating to his left jaw and diaphoresis. Vital signs: BP 145/88 mmHg, HR 102 bpm, SpO2 96% on room air. After obtaining a 12-lead ECG, which medication should the nurse administer FIRST unless contraindicated?", "o": ["Chewed non-enteric coated Aspirin 162-325 mg", "Sublingual Nitroglycerin 0.4 mg", "IV Morphine Sulfate 2 mg", "Oral Metoprolol 25 mg"], "a": 0, "r": "In suspected Acute Coronary Syndrome (ACS), chewed Aspirin (162-325 mg) is the immediate priority intervention to rapidly inhibit platelet aggregation and reduce mortality, provided no allergy or active GI bleeding exists."}, {"d": 2, "q": "[Med-Surg Case 182] A patient presenting with acute chest pain has a 12-lead ECG showing ST-segment elevation in leads II, III, and aVF. Which wall of the heart and coronary artery are affected?", "o": ["Inferior wall / Right Coronary Artery (RCA)", "Anterior wall / Left Anterior Descending (LAD)", "Lateral wall / Left Circumflex (LCX)", "Posterior wall / Posterior Descending Artery"], "a": 0, "r": "ST elevation in leads II, III, and aVF indicates an Inferior Wall Myocardial Infarction, which is supplied by the Right Coronary Artery (RCA)."}, {"d": 2, "q": "[Med-Surg Case 183] A patient with severe left-sided heart failure presents with worsening dyspnea, orthopnea, bilateral lung crackles, and pink frothy sputum. SpO2 is 84%. What is the nurse's IMMEDIATE priority?", "o": ["Apply high-flow oxygen, position the patient upright in High Fowler's, and prepare IV Furosemide", "Place the patient flat in supine position and administer IV Normal Saline bolus", "Encourage the patient to perform incentive spirometry 10 times", "Administer oral digoxin and place the patient in Trendelenburg position"], "a": 0, "r": "Pink frothy sputum and crackles indicate acute pulmonary edema secondary to left heart failure. Priority actions: sitting upright (reduces venous return/preload), high-flow oxygen, and IV loop diuretics (Furosemide) to reduce fluid volume."}, {"d": 2, "q": "[Med-Surg Case 184] A patient receiving Furosemide 80 mg IV daily for heart failure exhibits muscle weakness and ECG changes. Which serum potassium level requires IMMEDIATE intervention?", "o": ["2.8 mEq/L", "4.2 mEq/L", "5.1 mEq/L", "3.8 mEq/L"], "a": 0, "r": "Furosemide is a potassium-wasting loop diuretic. Severe hypokalemia (<3.5 mEq/L, especially <3.0 mEq/L) increases the risk of fatal cardiac arrhythmias and digoxin toxicity."}, {"d": 2, "q": "[Med-Surg Case 185] A patient taking Digoxin 0.25 mg daily reports loss of appetite, nausea, and seeing yellow-green halos around lights. The apical pulse is 48 bpm. What is the nurse's FIRST action?", "o": ["Withhold the Digoxin dose and notify the healthcare provider immediately", "Administer the Digoxin dose with an antacid", "Encourage the patient to drink 500 mL of water", "Administer a potassium-sparing diuretic"], "a": 0, "r": "Nausea, anorexia, visual disturbances (yellow-green halos), and bradycardia (HR <60 bpm) are classic signs of Digoxin toxicity. The dose must be held and the provider notified to check serum digoxin and potassium levels."}, {"d": 2, "q": "[Med-Surg Case 186] A 65-year-old patient with chronic atrial fibrillation has a 12-lead ECG showing an irregularly irregular rhythm with absent P waves. The patient is prescribed Warfarin. What is the target International Normalized Ratio (INR)?", "o": ["2.0 to 3.0", "0.8 to 1.2", "4.0 to 5.0", "1.0 to 1.5"], "a": 0, "r": "The therapeutic target INR for stroke prevention in atrial fibrillation on Warfarin therapy is 2.0 to 3.0."}, {"d": 2, "q": "[Med-Surg Case 187] A patient in septic shock remains hypotensive with BP 80/45 mmHg and serum lactate 4.2 mmol/L despite receiving a 30 mL/kg IV crystalloid bolus. Which first-line vasopressor should the nurse anticipate?", "o": ["Norepinephrine infusion titrated to maintain MAP \u2265 65 mmHg", "Epinephrine sublingual tablet", "Dopamine IV push", "Atropine IV bolus"], "a": 0, "r": "Surviving Sepsis guidelines identify Norepinephrine as the first-line vasopressor of choice for septic shock unresponsive to initial fluid resuscitation, targeting a Mean Arterial Pressure (MAP) \u2265 65 mmHg."}, {"d": 2, "q": "[Med-Surg Case 188] A patient develops acute severe anaphylactic shock following IV penicillin administration, presenting with stridor, wheezing, and BP 70/40 mmHg. What is the FIRST-LINE life-saving drug?", "o": ["Intramuscular Epinephrine (1:1000) into the anterolateral thigh", "IV Hydrocortisone", "Oral Diphenhydramine", "Inhaled Salbutamol alone"], "a": 0, "r": "Intramuscular Epinephrine (0.3-0.5 mg of 1:1000) into the anterolateral thigh is the immediate first-line drug for anaphylaxis to reverse airway constriction and severe vasodilation."}, {"d": 2, "q": "[Med-Surg Case 189] A patient in cardiac arrest has an ECG showing Ventricular Fibrillation (VF). CPR is in progress. What is the immediate priority intervention?", "o": ["Deliver an immediate unsynchronized shock (defibrillation)", "Administer IV Atropine 1 mg", "Perform a 12-lead ECG", "Perform synchronized cardioversion"], "a": 0, "r": "Ventricular Fibrillation (VF) and Pulseless Ventricular Tachycardia (pVT) are shockable rhythms. The immediate priority is early defibrillation combined with continuous high-quality CPR."}, {"d": 2, "q": "[Med-Surg Case 190] A patient with severe COPD presents with drowsiness, lethargy, and shallow breathing after receiving oxygen via simple face mask at 10 L/min. SpO2 is 99%. What is the underlying cause?", "o": ["CO2 retention and narcosis secondary to suppression of the hypoxic drive", "Severe acute pulmonary embolism", "Acute metabolic acidosis", "Sudden development of pneumothorax"], "a": 0, "r": "In chronic hypercapnic COPD, high oxygen concentrations suppress the hypoxic drive (the main stimulus for breathing), leading to hypoventilation, severe CO2 retention, and CO2 narcosis."}, {"d": 2, "q": "[Med-Surg Case 191] A patient experiencing an acute severe asthma attack has severe intercostal retractions and audible wheezing. Five minutes later, the nurse notes that breath sounds are completely absent ('silent chest'). What does this signify?", "o": ["Imminent respiratory failure due to severe airflow obstruction requiring emergency intubation", "Spontaneous resolution of the bronchospasm", "Development of hyperventilation syndrome", "Normal clearing of bronchial secretions"], "a": 0, "r": "A 'silent chest' in a severe asthma attack indicates that airflow has become so critically restricted that no air is moving, signaling impending respiratory arrest and emergency airway intervention."}, {"d": 2, "q": "[Med-Surg Case 192] A patient with a deep vein thrombosis suddenly develops sharp pleuritic chest pain, dyspnea, and tachycardia (HR 124 bpm). SpO2 is 86%. What complication is suspected?", "o": ["Pulmonary Embolism (PE)", "Myocardial Infarction", "Atelectasis", "Pneumothorax"], "a": 0, "r": "Sudden onset dyspnea, pleuritic chest pain, tachycardia, and hypoxemia in a patient with DVT strongly suggest Pulmonary Embolism."}, {"d": 2, "q": "[Med-Surg Case 193] A trauma patient presents with severe dyspnea, absent breath sounds on the right side, hyperresonance to percussion, tracheal deviation to the left, and BP 78/48 mmHg. What is the immediate treatment?", "o": ["Immediate needle decompression in the 2nd intercostal space midclavicular line", "Endotracheal intubation and mechanical ventilation", "Administering IV fluid bolus 1000 mL", "Obtaining a STAT chest X-ray"], "a": 0, "r": "Tracheal deviation, absent breath sounds, and shock indicate a Tension Pneumothorax. This is a clinical emergency requiring immediate needle decompression prior to chest tube insertion."}, {"d": 2, "q": "[Med-Surg Case 194] The nurse notes continuous bubbling in the water-seal chamber of a patient's closed chest drainage system. What does this finding indicate?", "o": ["An air leak in the drainage system or pleural space", "Normal system functioning during exhalation", "Full lung re-expansion", "Blockage in the chest tube"], "a": 0, "r": "Continuous bubbling in the water-seal chamber indicates an air leak in the system or persistent leak from the lung. Intermittent bubbling during exhalation or coughing can be normal early on."}, {"d": 2, "q": "[Med-Surg Case 195] An arterial blood gas (ABG) result reveals: pH 7.28, PaCO2  is suspected?", "o": ["Pulmonary Embolism (PE)", "Myocardial Infarction", "Atelectasis", "Pneumothorax"], "a": 0, "r": "Sudden onset dyspnea, pleuritic chest pain, tachycardia, and hypoxemia in a patient with DVT strongly suggest Pulmonary Embolism."}, {"d": 2, "q": "[Med-Surg Case 223] A trauma patient presents with severe dyspnea, absent breath sounds on the right side, hyperresonance to percussion, tracheal deviation to the left, and BP 78/48 mmHg. What is the immediate treatment?", "o": ["Immediate needle decompression in the 2nd intercostal space midclavicular line", "Endotracheal intubation and mechanical ventilation", "Administering IV fluid bolus 1000 mL", "Obtaining a STAT chest X-ray"], "a": 0, "r": "Tracheal deviation, absent breath sounds, and shock indicate a Tension Pneumothorax. This is a clinical emergency requiring immediate needle decompression prior to chest tube insertion."}, {"d": 2, "q": "[Med-Surg Case 224] The nurse notes continuous bubbling in the water-seal chamber of a patient's closed chest drainage system. What does this finding indicate?", "o": ["An air leak in the drainage system or pleural space", "Normal system functioning during exhalation", "Full lung re-expansion", "Blockage in the chest tube"], "a": 0, "r": "Continuous bubbling in the water-seal chamber indicates an air leak in the system or persistent leak from the lung. Intermittent bubbling during exhalation or coughing can be normal early on."}, {"d": 2, "q": "[Med-Surg Case 225] An arterial blood gas (ABG) result reveals: pH 7.28, PaCO2 58 mmHg, HCO3 25 mEq/L. How should the nurse interpret this result?", "o": ["Uncompensated Respiratory Acidosis", "Uncompensated Metabolic Acidosis", "Fully compensated Respiratory Alkalosis", "Partially compensated Metabolic Alkalosis"], "a": 0, "r": "pH <7.35 (acidosis) with PaCO2 >45 mmHg (respiratory component elevated) and normal HCO3 indicates Uncompensated Respiratory Acidosis (e.g., hypoventilation, COPD, opioid overdose)."}, {"d": 2, "q": "[Med-Surg Case 226] A patient suspected of having an acute ischemic stroke arrives at the emergency room. Which diagnostic test must be performed FIRST before thrombolytic therapy (tPA)?", "o": ["Non-contrast CT scan of the head", "Electroencephalogram (EEG)", "Lumbar puncture", "Carotid duplex ultrasound"], "a": 0, "r": "A STAT non-contrast head CT scan is mandatory to rule out intracranial hemorrhage before administering thrombolytic therapy (IV tPA)."}, {"d": 2, "q": "[Med-Surg Case 227] A patient with a traumatic head injury has a declining level of consciousness. Vital signs show SBP rising from 120 to 175 mmHg, pulse dropping from 78 to 48 bpm, and irregular breathing. What is this clinical triad called?", "o": ["Cushing's Triad (sign of increased ICP and impending brain herniation)", "Beck's Triad", "Charcot's Triad", "Virchow's Triad"], "a": 0, "r": "Cushing's Triad (systolic hypertension with widened pulse pressure, bradycardia, and irregular respirations) is a late sign of severely increased intracranial pressure and brainstem compression."}, {"d": 2, "q": "[Med-Surg Case 228] A patient with a spinal cord injury at the T4 level reports a severe pounding headache and nasal congestion. BP is 210/110 mmHg and HR is 52 bpm. The skin above T4 is flushed and sweaty. What is the nurse's FIRST action?", "o": ["Elevate the head of the bed to 90 degrees (High Fowler's)", "Administer IV Morphine Sulfate", "Check for a deep vein thrombosis in the lower extremities", "Place the patient flat in Trendelenburg position"], "a": 0, "r": "This is Autonomic Dysreflexia (a medical emergency in SCI at or above T6). The immediate FIRST action is to sit the patient upright at 90\u00b0 to allow gravity to lower blood pressure, then search for the trigger (most commonly bladder distension or fecal impaction)."}, {"d": 2, "q": "[Med-Surg Case 229] A patient admitted with suspected bacterial meningitis exhibits severe neck stiffness. When the nurse flexes the patient's neck, involuntary flexion of the hips and knees occurs. What is this sign called?", "o": ["Brudzinski's sign", "Kernig's sign", "Chvostek's sign", "Trousseau's sign"], "a": 0, "r": "Positive Brudzinski's sign (involuntary flexion of hips and knees upon passive neck flexion) is a classic indicator of meningeal irritation."}, {"d": 2, "q": "[Med-Surg Case 230] A patient presenting with acute epigastric pain radiating to the back is suspected of having acute pancreatitis. Which laboratory test is MOST specific for acute pancreatitis?", "o": ["Serum Lipase", "Serum Amylase", "Total Bilirubin", "Serum Calcium"], "a": 0, "r": "Serum Lipase is more sensitive and specific than amylase for acute pancreatitis and remains elevated longer."}, {"d": 2, "q": "[Med-Surg Case 231] A patient with end-stage liver cirrhosis develops flapping tremors of the hands (asterixis) and confusion. Which serum lab value is expected to be elevated?", "o": ["Serum Ammonia", "Serum Creatinine", "Serum Sodium", "Serum Potassium"], "a": 0, "r": "Hepatic encephalopathy is caused by impaired liver clearance of nitrogenous toxins, leading to elevated blood ammonia levels, confusion, and asterixis (flapping tremor)."}, {"d": 2, "q": "[Med-Surg Case 232] A patient with Type 1 Diabetes presents with blood glucose 420 mg/dL, arterial pH 7.18, HCO3 12 mEq/L, and Kussmaul respirations. What is the PRIORITY initial treatment for Diabetic Ketoacidosis (DKA)?", "o": ["Rapid IV fluid resuscitation with 0.9% Normal Saline", "Immediate IV push bolus of NPH insulin", "Subcutaneous Glargine insulin injection", "IV sodium bicarbonate bolus"], "a": 0, "r": "The immediate priority in DKA is rehydration with isotonic fluid (0.9% Normal Saline) to restore intravascular volume and renal perfusion before starting IV regular insulin infusion."}, {"d": 2, "q": "[Med-Surg Case 233] A diabetic patient is found unconscious, diaphoretic, and cool to touch. Blood glucose is 34 mg/dL. The patient has no IV access. What is the immediate treatment?", "o": ["Administer Glucagon 1 mg IM/SC", "Give 150 mL orange juice orally", "Insert an NG tube and administer corn syrup", "Inject Regular insulin 10 units SC"], "a": 0, "r": "In severe hypoglycemia with loss of consciousness and no IV access, IM or SC Glucagon is the treatment of choice to rapidly mobilize liver glycogen."}, {"d": 2, "q": "[Med-Surg Case 234] Following a total thyroidectomy, a patient reports tingling around the lips and fingertips. Tapping the facial nerve elicits facial muscle twitching. What complication is present?", "o": ["Hypocalcemia due to accidental parathyroid removal (positive Chvostek's sign)", "Hypercalcemia due to thyroid hormone surge", "Thyroid storm", "Recurrent laryngeal nerve damage"], "a": 0, "r": "Accidental removal or injury to the parathyroid glands during thyroidectomy leads to hypocalcemia, characterized by neuromuscular irritability, positive Chvostek's sign, and positive Trousseau's sign. IV Calcium Gluconate must be available."}, {"d": 2, "q": "[Med-Surg Case 235] A patient who suffered a closed fracture of the right tibia 24 hours ago reports severe, agonizing pain unrelieved by IV morphine. The right foot is pale, paresthetic, and cold. What complication is developing?", "o": ["Compartment Syndrome", "Fat Embolism Syndrome", "Deep Vein Thrombosis", "Osteomyelitis"], "a": 0, "r": "Severe pain out of proportion to injury and unrelieved by opioids, accompanied by paresthesia, pallor, and coolness (5 Ps), indicates Compartment Syndrome\u2014an emergency requiring immediate fasciotomy."}, {"d": 2, "q": "[Med-Surg Case 236] A patient who sustained a bilateral femur fracture 36 hours ago develops dyspnea, confusion, and a petechial rash across his neck and anterior chest. What condition should the nurse suspect?", "o": ["Fat Embolism Syndrome", "Pulmonary Embolism", "Disseminated Intravascular Coagulation", "Sepsis"], "a": 0, "r": "Fat Embolism Syndrome typically occurs 24-72 hours after long-bone fractures, presenting with the classic triad of respiratory distress, neurological impairment/confusion, and a petechial rash over the chest/neck."}, {"d": 2, "q": "[Med-Surg Case 237] The nurse assesses a patient in skeletal traction for a femur fracture. Which finding requires IMMEDIATE intervention?", "o": ["The traction weights are resting flat on the floor", "The patient's leg is maintained in alignment", "The skin around pin sites is clean and dry", "The patient uses a trapeze bar to adjust position"], "a": 0, "r": "Traction weights must hang freely at all times to maintain continuous traction force. Weights touching the floor defeat the purpose of traction."}, {"d": 2, "q": "[Med-Surg Case 238] A patient who underwent abdominal surgery 4 days ago feels a sudden 'popping' sensation while coughing. The nurse inspects the wound and sees loops of small intestine protruding. What is the FIRST action?", "o": ["Position the patient in low Fowler's with knees flexed and cover the organs with sterile saline-moistened dressings", "Gently push the intestinal loops back into the abdomen", "Apply a tight abdominal binder", "Instruct the patient to ambulate to the procedure room"], "a": 0, "r": "Wound evisceration is a surgical emergency. Place the patient in low Fowler's with knees flexed, cover exposed viscera with sterile drapes soaked in warm 0.9% Normal Saline, and call the surgeon immediately."}, {"d": 2, "q": "[Med-Surg Case 239] A adult patient with partial and full-thickness burns over 30% Total Body Surface Area (TBSA) weighs 70 kg. Using the Parkland Formula (4 mL x kg x %TBSA), how much Lactated Ringer's should be given in the FIRST 8 HOURS from injury?", "o": ["4,200 mL", "8,400 mL", "2,100 mL", "5,600 mL"], "a": 0, "r": "Total 24h Fluid = 4 mL x 70 kg x 30 = 8,400 mL. Half of this total (4,200 mL) must be infused in the FIRST 8 hours from the time of burn injury."}, {"d": 2, "q": "[Med-Surg Case 240] A patient receiving chemotherapy has an Absolute Neutrophil Count (ANC) of 350/mm\u00b3 and develops a temperature of 38.3\u00b0C. What is the nurse's PRIORITY action?", "o": ["Notify the oncologist immediately and prepare for STAT blood cultures and empiric IV antibiotics", "Administer oral Paracetamol and recheck temperature in 4 hours", "Encourage fresh fruit consumption to boost immunity", "Place a cooling blanket on the patient"], "a": 0, "r": "Febrile neutropenia (ANC <500/mm\u00b3 with fever \u226538.0\u00b0C) is a life-threatening medical emergency. Immediate blood cultures and prompt empiric broad-spectrum IV antibiotic administration within 1 hour are essential to prevent septic shock."}, {"d": 2, "q": "[Med-Surg Case 241] A 58-year-old male presents to the ER with crushing retrosternal chest pain radiating to his left jaw and diaphoresis. Vital signs: BP 145/88 mmHg, HR 102 bpm, SpO2 96% on room air. After obtaining a 12-lead ECG, which medication should the nurse administer FIRST unless contraindicated?", "o": ["Chewed non-enteric coated Aspirin 162-325 mg", "Sublingual Nitroglycerin 0.4 mg", "IV Morphine Sulfate 2 mg", "Oral Metoprolol 25 mg"], "a": 0, "r": "In suspected Acute Coronary Syndrome (ACS), chewed Aspirin (162-325 mg) is the immediate priority intervention to rapidly inhibit platelet aggregation and reduce mortality, provided no allergy or active GI bleeding exists."}, {"d": 2, "q": "[Med-Surg Case 242] A patient presenting with acute chest pain has a 12-lead ECG showing ST-segment elevation in leads II, III, and aVF. Which wall of the heart and coronary artery are affected?", "o": ["Inferior wall / Right Coronary Artery (RCA)", "Anterior wall / Left Anterior Descending (LAD)", "Lateral wall / Left Circumflex (LCX)", "Posterior wall / Posterior Descending Artery"], "a": 0, "r": "ST elevation in leads II, III, and aVF indicates an Inferior Wall Myocardial Infarction, which is supplied by the Right Coronary Artery (RCA)."}, {"d": 2, "q": "[Med-Surg Case 243] A patient with severe left-sided heart failure presents with worsening dyspnea, orthopnea, bilateral lung crackles, and pink frothy sputum. SpO2 is 84%. What is the nurse's IMMEDIATE priority?", "o": ["Apply high-flow oxygen, position the patient upright in High Fowler's, and prepare IV Furosemide", "Place the patient flat in supine position and administer IV Normal Saline bolus", "Encourage the patient to perform incentive spirometry 10 times", "Administer oral digoxin and place the patient in Trendelenburg position"], "a": 0, "r": "Pink frothy sputum and crackles indicate acute pulmonary edema secondary to left heart failure. Priority actions: sitting upright (reduces venous return/preload), high-flow oxygen, and IV loop diuretics (Furosemide) to reduce fluid volume."}, {"d": 2, "q": "[Med-Surg Case 244] A patient receiving Furosemide 80 mg IV daily for heart failure exhibits muscle weakness and ECG changes. Which serum potassium level requires IMMEDIATE intervention?", "o": ["2.8 mEq/L", "4.2 mEq/L", "5.1 mEq/L", "3.8 mEq/L"], "a": 0, "r": "Furosemide is a potassium-wasting loop diuretic. Severe hypokalemia (<3.5 mEq/L, especially <3.0 mEq/L) increases the risk of fatal cardiac arrhythmias and digoxin toxicity."}, {"d": 2, "q": "[Med-Surg Case 245] A patient taking Digoxin 0.25 mg daily reports loss of appetite, nausea, and seeing yellow-green halos around lights. The apical pulse is 48 bpm. What is the nurse's FIRST action?", "o": ["Withhold the Digoxin dose and notify the healthcare provider immediately", "Administer the Digoxin dose with an antacid", "Encourage the patient to drink 500 mL of water", "Administer a potassium-sparing diuretic"], "a": 0, "r": "Nausea, anorexia, visual disturbances (yellow-green halos), and bradycardia (HR <60 bpm) are classic signs of Digoxin toxicity. The dose must be held and the provider notified to check serum digoxin and potassium levels."}, {"d": 2, "q": "[Med-Surg Case 246] A 65-year-old patient with chronic atrial fibrillation has a 12-lead ECG showing an irregularly irregular rhyt ng acute pancreatitis. Which laboratory test is MOST specific for acute pancreatitis?", "o": ["Serum Lipase", "Serum Amylase", "Total Bilirubin", "Serum Calcium"], "a": 0, "r": "Serum Lipase is more sensitive and specific than amylase for acute pancreatitis and remains elevated longer."}, {"d": 2, "q": "[Med-Surg Case 261] A patient with end-stage liver cirrhosis develops flapping tremors of the hands (asterixis) and confusion. Which serum lab value is expected to be elevated?", "o": ["Serum Ammonia", "Serum Creatinine", "Serum Sodium", "Serum Potassium"], "a": 0, "r": "Hepatic encephalopathy is caused by impaired liver clearance of nitrogenous toxins, leading to elevated blood ammonia levels, confusion, and asterixis (flapping tremor)."}, {"d": 2, "q": "[Med-Surg Case 262] A patient with Type 1 Diabetes presents with blood glucose 420 mg/dL, arterial pH 7.18, HCO3 12 mEq/L, and Kussmaul respirations. What is the PRIORITY initial treatment for Diabetic Ketoacidosis (DKA)?", "o": ["Rapid IV fluid resuscitation with 0.9% Normal Saline", "Immediate IV push bolus of NPH insulin", "Subcutaneous Glargine insulin injection", "IV sodium bicarbonate bolus"], "a": 0, "r": "The immediate priority in DKA is rehydration with isotonic fluid (0.9% Normal Saline) to restore intravascular volume and renal perfusion before starting IV regular insulin infusion."}, {"d": 2, "q": "[Med-Surg Case 263] A diabetic patient is found unconscious, diaphoretic, and cool to touch. Blood glucose is 34 mg/dL. The patient has no IV access. What is the immediate treatment?", "o": ["Administer Glucagon 1 mg IM/SC", "Give 150 mL orange juice orally", "Insert an NG tube and administer corn syrup", "Inject Regular insulin 10 units SC"], "a": 0, "r": "In severe hypoglycemia with loss of consciousness and no IV access, IM or SC Glucagon is the treatment of choice to rapidly mobilize liver glycogen."}, {"d": 2, "q": "[Med-Surg Case 264] Following a total thyroidectomy, a patient reports tingling around the The patient uses a trapeze bar to adjust position"], "a": 0, "r": "Traction weights must hang freely at all times to maintain continuous traction force. Weights touching the floor defeat the purpose of traction."}, {"d": 2, "q": "[Med-Surg Case 268] A patient who underwent abdominal surgery 4 days ago feels a sudden 'popping' sensation while coughing. The nurse inspects the wound and sees loops of small intestine protruding. What is the FIRST action?", "o": ["Position the patient in low Fowler's with knees flexed and cover the organs with sterile saline-moistened dressings", "Gently push the intestinal loops back into the abdomen", "Apply a tight abdominal binder", "Instruct the patient to ambulate to the procedure room"], "a": 0, "r": "Wound evisceration is a surgical emergency. Place the patient in low Fowler's with knees flexed, cover exposed viscera with sterile drapes soaked in warm 0.9% Normal Saline, and call the surgeon immediately."}, {"d": 2, "q": "[Med-Surg Case 269] A adult patient with partial and full-thickness burns over 30% Total Body Surface Area (TBSA) weighs 70 kg. Using the Parkland Formula (4 mL x kg x %TBSA), how much Lactated Ringer's should be given in the FIRST 8 HOURS from injury?", "o": ["4,200 mL", "8,400 mL", "2,100 mL", "5,600 mL"], "a": 0, "r": "Total 24h Fluid = 4 mL x 70 kg x 30 = 8,400 mL. Half of this total (4,200 mL) must be infused in the FIRST 8 hours from the time of burn injury."}, {"d": 2, "q": "[Med-Surg Case 270] A patient receiving chemotherapy has an Absolute Neutrophil Count (ANC) of 350/mm\u00b3 and develops a temperature of 38.3\u00b0C. What is the nurse's PRIORITY action?", "o": ["Notify the oncologist immediately and prepare for STAT blood cultures and empiric IV antibiotics", "Administer oral Paracetamol and recheck temperature in 4 hours", "Encourage fresh fruit consumption to boost immunity", "Place a cooling blanket on the patient"], "a": 0, "r": "Febrile neutropenia (ANC <500/mm\u00b3 with fever \u226538.0\u00b0C) is a life-threatening medical emergency. Immediate blood cultures and prompt empiric broad-spectrum IV antibiotic administration within 1 hour are essential to prevent septic shock."}, {"d": 2, "q": "[Med-Surg Case 271] A 58-year-old male presents to the ER with crushing retrosternal chest pain radiating to his left jaw and diaphoresis. Vital signs: BP 145/88 mmHg, HR 102 bpm, SpO2 96% on room air. After obtaining a 12-lead ECG, which medication should the nurse administer FIRST unless contraindicated?", "o": ["Chewed non-enteric coated Aspirin 162-325 mg", "Sublingual Nitroglycerin 0.4 mg", "IV Morphine Sulfate 2 mg", "Oral Metoprolol 25 mg"], "a": 0, "r": "In suspected Acute Coronary Syndrome (ACS), chewed Aspirin (162-325 mg) is the immediate priority intervention to rapidly inhibit platelet aggregation and reduce mortality, provided no allergy or active GI bleeding exists."}, {"d": 2, "q": "[Med-Surg Case 272] A patient presenting with acute chest pain has a 12-lead ECG showing ST-segment elevation in leads II, III, and aVF. Which wall of the heart and coronary artery are affected?", "o": ["Inferior wall / Right Coronary Artery (RCA)", "Anterior wall / Left Anterior Descending (LAD)", "Lateral wall / Left Circumflex (LCX)", "Posterior wall / Posterior Descending Artery"], "a": 0, "r": "ST elevation in leads II, III, and aVF indicates an Inferior Wall Myocardial Infarction, which is supplied by the Right Coronary Artery (RCA)."}, {"d": 2, "q": "[Med-Surg Case 273] A patient with severe left-sided heart failure presents with worsening dyspnea, orthopnea, bilateral lung crackles, and pink frothy sputum. SpO2 is 84%. What is the nurse's IMMEDIATE priority?", "o": ["Apply high-flow oxygen, position the patient upright in High Fowler's, and prepare IV Furosemide", "Place the patient flat in supine position and administer IV Normal Saline bolus", "Encourage the patient to perform incentive spirometry 10 times", "Administer oral digoxin and place the patient in Trendelenburg position"], "a": 0, "r": "Pink frothy sputum and crackles indicate acute pulmonary edema secondary to left heart failure. Priority actions: sitting upright (reduces venous return/preload), high-flow oxygen, and IV loop diuretics (Furosemide) to reduce fluid volume."}, {"d": 2, "q": "[Med-Surg Case 274] A patient receiving Furosemide 80 mg IV daily for heart failure exhibits muscle weakness and ECG changes. Which serum potassium level requires IMMEDIATE intervention?", "o": ["2.8 mEq/L", "4.2 mEq/L", "5.1 mEq/L", "3.8 mEq/L"], "a": 0, "r": "Furosemide is a potassium-wasting loop diuretic. Severe hypokalemia (<3.5 mEq/L, especially <3.0 mEq/L) increases the risk of fatal cardiac arrhythmias and digoxin toxicity."}, {"d": 2, "q": "[Med-Surg Case 275] A patient taking Digoxin 0.25 mg daily reports loss of appetite, nausea, and seeing yellow-green halos around lights. The apical pulse is 48 bpm. What is the nurse's FIRST action?", "o": ["Withhold the Digoxin dose and notify the healthcare provider immediately", "Administer the Digoxin dose with an antacid", "Encourage the patient to drink 500 mL of water", "Administer a potassium-sparing diuretic"], "a": 0, "r": "Nausea, anorexia, visual disturbances (yellow-green halos), and bradycardia (HR <60 bpm) are classic signs of Digoxin toxicity. The dose must be held and the provider notified to check serum digoxin and potassium levels."}, {"d": 2, "q": "[Med-Surg Case 276] A 65-year-old patient with chronic atrial fibrillation has a 12-lead ECG showing an irregularly irregular rhythm with absent P waves. The patient is prescribed Warfarin. What is the target International Normalized Ratio (INR)?", "o": ["2.0 to 3.0", "0.8 to 1.2", "4.0 to 5.0", "1.0 to 1.5"], "a": 0, "r": "The therapeutic target INR for stroke prevention in atrial fibrillation on Warfarin therapy is 2.0 to 3.0."}, {"d": 2, "q": "[Med-Surg Case 277] A patient in septic shock remains hypotensive with BP 80/45 mmHg and serum lactate 4.2 mmol/L despite receiving a 30 mL/kg IV crystalloid bolus. Which first-line vasopressor should the nurse anticipate?", "o": ["Norepinephrine infusion titrated to maintain MAP \u2265 65 mmHg", "Epinephrine sublingual tablet", "Dopamine IV push", "Atropine IV bolus"], "a": 0, "r": "Surviving Sepsis guidelines identify Norepinephrine as the first-line vasopressor of choice for septic shock unresponsive to initial fluid resuscitation, targeting a Mean Arterial Pressure (MAP) \u2265 65 mmHg."}, {"d": 2, "q": "[Med-Surg Case 278] A patient develops acute severe anaphylactic shock following IV penicillin administration, presenting with stridor, wheezing, and BP 70/40 mmHg. What is the FIRST-LINE life-saving drug?", "o": ["Intramuscular Epinephrine (1:1000) into the anterolateral thigh", "IV Hydrocortisone", "Oral Diphenhydramine", "Inhaled Salbutamol alone"], "a": 0, "r": "Intramuscular Epinephrine (0.3-0.5 mg of 1:1000) into the anterolateral thigh is the immediate first-line drug for anaphylaxis to reverse airway constriction and severe vasodilation."}, {"d": 2, "q": "[Med-Surg Case 279] A patient in cardiac arrest has an ECG showing Ventricular Fibrillation (VF). CPR is in progress. What is the immediate priority intervention?", "o": ["Deliver an immediate unsynchronized shock (defibrillation)", "Administer IV Atropine 1 mg", "Perform a 12-lead ECG", "Perform synchronized cardioversion"], "a": 0, "r": "Ventricular Fibrillation (VF) and Pulseless Ventricular Tachycardia (pVT) are shockable rhythms. The immediate priority is early defibrillation combined with continuous high-quality CPR."}, {"d": 2, "q": "[Med-Surg Case 280] A patient with severe COPD presents with drowsiness, lethargy, and shallow breathing after receiving oxygen via simple face mask at 10 L/min. SpO2 is 99%. What is the underlying cause?", "o": ["CO2 retention and narcosis secondary to suppression of the hypoxic drive", "Severe acute pulmonary embolism", "Acute metabolic acidosis", "Sudden development of pneumothorax"], "a": 0, "r": "In chronic hypercapnic COPD, high oxygen concentrations suppress the hypoxic drive (the main stimulus for breathing), leading to hypoventilation, severe CO2 retention, and CO2 narcosis."}, {"d": 2, "q": "[Med-Surg Case 281] A patient experiencing an acute severe asthma attack has severe intercostal retractions and audible wheezing. Five minutes later, the nurse notes that breath sounds are completely absent ('silent chest'). What does this signify?", "o": ["Imminent respiratory failure due to severe airflow obstruction requiring emergency intubation", "Spontaneous resolution of the bronchospasm", "Development of hyperventilation syndrome", "Normal clearing of bronchial secretions"], "a": 0, "r": "A 'silent chest' in a severe asthma attack indicates that airflow has become so critically restricted that no air is moving, signaling impending respiratory arrest and emergency airway intervention."}, {"d": 2, "q": "[Med-Surg Case 282] A patient with a deep vein thrombosis suddenly develops sharp pleuritic chest pain, dyspnea, and tachycardia (HR 124 bpm). SpO2 is 86%. What complication is suspected?", "o": ["Pulmonary Embolism (PE)", "Myocardial Infarction", "Atelectasis", "Pneumothorax"], "a": 0, "r": "Sudden onset dyspnea, pleuritic chest pain, tachycardia, and hypoxemia in a patient with DVT strongly suggest Pulmonary Embolism."}, {"d": 2, "q": "[Med-Surg Case 283] A trauma patient presents with severe dyspnea, absent breath sounds on the right side, hyperresonance to percussion, tracheal deviation to the left, and BP 78/48 mmHg. What is the immediate treatment?", "o": ["Immediate needle decompression in the 2nd intercostal space midclavicular line", "Endotracheal intubation and mechanical ventilation", "Administering IV fluid bolus 1000 mL", "Obtaining a STAT chest X-ray"], "a": 0, "r": "Tracheal deviation, absent breath sounds, and shock indicate a Tension Pneumothorax. This is a clinical emergency requiring immediate needle decompression prior to chest tube insertion."}, {"d": 2, "q": "[Med-Surg Case 284] The nurse notes continuous bubbling in the water-seal chamber of a patient's closed chest drainage system. What does this finding indicate?", "o": ["An air leak in the drainage system or pleural space", "Normal system functioning during exhalation", "Full lung re-expansion", "Blockage in the chest tube"], "a": 0, "r": "Continuous bubbling in the water-seal chamber indicates an air leak in the system or persistent leak from the lung. Intermittent bubbling during exhalation or coughing can be normal early on."}, {"d": 2, "q": "[Med-Surg Case 285] An arterial blood gas (ABG) result reveals: pH 7.28, PaCO2 58 mmHg, HCO3 25 mEq/L. How should the nurse interpret this result?", "o": ["Uncompensated Respiratory Acidosis", "Uncompensated Metabolic Acidosis", "Fully compensated Respiratory Alkalosis", "Partially compensated Metabolic Alkalosis"], "a": 0, "r": "pH <7.35 (acidosis) with PaCO2 >45 mmHg (respiratory component elevated) and normal HCO3 indicates Uncompensated Respiratory Acidosis (e.g., hypoventilation, COPD, opioid overdose)."}, {"d": 2, "q": "[Med-Surg Case 286] A patient suspected of having an acute ischemic stroke arrives at the emergency room. Which diagnostic test must be performed FIRST before thrombolytic therapy (tPA)?", "o": ["Non-contrast CT scan of the head", "Electroencephalogram (EEG)", "Lumbar puncture", "Carotid duplex ultrasound"], "a": 0, "r": "A STAT non-contrast head CT scan is mandatory to rule out intracranial hemorrhage before administering thrombolytic therapy (IV tPA)."}, {"d": 2, "q": "[Med-Surg Case 287] A patient with a traumatic head injury has a declining level of consciousness. Vital signs show SBP rising from 120 to 175 mmHg, pulse dropping from 78 to 48 bpm, and irregular breathing. What is this clinical triad called?", "o": ["Cushing's Triad (sign of increased ICP and impending brain herniation)", "Beck's Triad", "Charcot's Triad", "Virchow's Triad"], "a": 0, "r": "Cushing's Triad (systolic hypertension with widened pulse pressure, bradycardia, and irregular respirations) is a late sign of severely increased intracranial pressure and brainstem compression."}, {"d": 2, "q": "[Med-Surg Case 288] A patient with a spinal cord injury at the T4 level reports a severe pounding headache and nasal congestion. BP is 210/110 mmHg and HR is 52 bpm. The skin above T4 is flushed and sweaty. What is the nurse's FIRST action?", "o": ["Elevate the head of the bed to 90 degrees (High Fowler's)", "Administer IV Morphine Sulfate", "Check for a deep vein thrombosis in the lower extremities", "Place the patient flat in Trendelenburg position"], "a": 0, "r": "This is Autonomic Dysreflexia (a medical emergency in SCI at or above T6). The immediate FIRST action is to sit the patient upright at 90\u00b0 to allow gravity to lower blood pressure, then search for the trigger (most commonly bladder distension or fecal impaction)."}, {"d": 2, "q": "[Med-Surg Case 289] A patient admitted with suspected bacterial meningitis exhibits severe neck stiffness. When the nurse flexes the patient's neck, involuntary flexion of the hips and knees occurs. What is this sign called?", "o": ["Brudzinski's sign", "Kernig's sign", "Chvostek's sign", "Trousseau's sign"], "a": 0, "r": "Positive Brudzinski's sign (involuntary flexion of hips and knees upon passive neck flexion) is a classic indicator of meningeal irritation."}, {"d": 2, "q": "[Med-Surg Case 290] A patient presenting with acute epigastric pain radiating to the back is suspected of having acute pancreatitis. Which laboratory test is MOST specific for acute pancreatitis?", "o": ["Serum Lipase", "Serum Amylase", "Total Bilirubin", "Serum Calcium"], "a": 0, "r": "Serum Lipase is more sensitive and specific than amylase for acute pancreatitis and remains elevated longer."}, {"d": 2, "q": "[Med-Surg Case 291] A patient with end-stage liver cirrhosis develops flapping tremors of the hands (asterixis) and confusion. Which serum lab value is expected to be elevated?", "o": ["Serum Ammonia", "Serum Creatinine", "Serum Sodium", "Serum Potassium"], "a": 0, "r": "Hepatic encephalopathy is caused by impaired liver clearance of nitrogenous toxins, leading to elevated blood ammonia levels, confusion, and asterixis (flapping tremor)."}, {"d": 2, "q": "[Med-Surg Case 292] A patient with Type 1 Diabetes presents with blood glucose 420 mg/dL, arterial pH 7.18, HCO3 12 mEq/L, and Kussmaul respirations. What is the PRIORITY initial treatment for Diabetic Ketoacidosis (DKA)?", "o": ["Rapid IV fluid resuscitation with 0.9% Normal Saline", "Immediate IV push bolus of NPH insulin", "Subcutaneous Glargine insulin injection", "IV sodium bicarbonate bolus"], "a": 0, "r": "The immediate priority in DKA is rehydration with isotonic fluid (0.9% Normal Saline) to restore intravascular volume and renal perfusion before starting IV regular insulin infusion."}, {"d": 2, "q": "[Med-Surg Case 293] A diabetic patient is found unconscious, diaphoretic, and cool to touch. Blood glucose is 34 mg/dL. The patient has no IV access. What is the immediate treatment?", "o": ["Administer Glucagon 1 mg IM/SC", "Give 150 mL orange juice orally", "Insert an NG tube and administer corn syrup", "Inject Regular insulin 10 units SC"], "a": 0, "r": "In severe hypoglycemia with loss of consciousness and no IV access, IM or SC Glucagon is the treatment of choice to rapidly mobilize liver glycogen."}, {"d": 2, "q": "[Med-Surg Case 294] Following a total thyroidectomy, a patient reports tingling around the lips and fingertips. Tapping the facial nerve elicits facial muscle twitching. What complication is present?", "o": ["Hypocalcemia due to accidental parathyroid removal (positive Chvostek's sign)", "Hypercalcemia due to thyroid hormone surge", "Thyroid storm", "Recurrent laryngeal nerve damage"], "a": 0, "r": "Accidental removal or injury to the parathyroid glands during thyroidectomy leads to hypocalcemia, characterized by neuromuscular irritability, positive Chvostek's sign, and positive Trousseau's sign. IV Calcium Gluconate must be available."}, {"d": 2, "q": "[Med-Surg Case 295] A patient who suffered a closed fracture of the right tibia 24 hours ago reports severe, agonizing pain unrelieved by IV morphine. The right foot is pale, paresthetic, and cold. What complication is developing?", "o": ["Compartment Syndrome", "Fat Embolism Syndrome", "Deep Vein Thrombosis", "Osteomyelitis"], "a": 0, "r": "Severe pain out of proportion to injury and unrelieved by opioids, accompanied by paresthesia, pallor, and coolness (5 Ps), indicates Compartment Syndrome\u2014an emergency requiring immediate fasciotomy."}, {"d": 2, "q": "[Med-Surg Case 296] A patient who sustained a bilateral femur fracture 36 hours ago develops dyspnea, confusion, and a petechial rash across his neck and anterior chest. What condition should the nurse suspect?", "o": ["Fat Embolism Syndrome", "Pulmonary Embolism", "Disseminated Intravascular Coagulation", "Sepsis"], "a": 0, "r": "Fat Embolism Syndrome typically occurs 24-72 hours after long-bone fractures, presenting with the classic triad of respiratory distress, neurological impairment/confusion, and a petechial rash over the chest/neck."}, {"d": 2, "q": "[Med-Surg Case 297] The nurse assesses a patient in skeletal traction for a femur fracture. Which finding requires IMMEDIATE intervention?", "o": ["The traction weights are resting flat on the floor", "The patient's leg is maintained in alignment", "The skin around pin sites is clean and dry", "The patient uses a trapeze bar to adjust position"], "a": 0, "r": "Traction weights must hang freely at all times to maintain continuous traction force. Weights touching the floor defeat the purpose of traction."}, {"d": 2, "q": "[Med-Surg Case 298] A patient who underwent abdominal surgery 4 days ago feels a sudden 'popping' sensation while coughing. The nurse inspects the wound and sees loops of small intestine protruding. What is the FIRST action?", "o": ["Position the patient in low Fowler's with knees flexed and cover the organs with sterile saline-moistened dressings", "Gently push the intestinal loops back into the abdomen", "Apply a tight abdominal binder", "Instruct the patient to ambulate to the procedure room"], "a": 0, "r": "Wound evisceration is a surgical emergency. Place the patient in low Fowler's with knees flexed, cover exposed viscera with sterile drapes soaked in warm 0.9% Normal Saline, and call the surgeon immediately."}, {"d": 2, "q": "[Med-Surg Case 299] A adult patient with partial and full-thickness burns over 30% Total Body Surface Area (TBSA) weighs 70 kg. Using the Parkland Formula (4 mL x kg x %TBSA), how much Lactated Ringer's should be given in the FIRST 8 HOURS from injury?", "o": ["4,200 mL", "8,400 mL", "2,100 mL", "5,600 mL"], "a": 0, "r": "Total 24h Fluid = 4 mL x 70 kg x 30 = 8,400 mL. Half of this total (4,200 mL) must be infused in the FIRST 8 hours from the time of burn injury."}, {"d": 2, "q": "[Med-Surg Case 300] A patient receiving chemotherapy has an Absolute Neutrophil Count (ANC) of 350/mm\u00b3 and develops a temperature of 38.3\u00b0C. What is the nurse's PRIORITY action?", "o": ["Notify the oncologist immediately and prepare for STAT blood cultures and empiric IV antibiotics", "Administer oral Paracetamol and recheck temperature in 4 hours", "Encourage fresh fruit consumption to boost immunity", "Place a cooling blanket on the patient"], "a": 0, "r": "Febrile neutropenia (ANC <500/mm\u00b3 with fever \u226538.0\u00b0C) is a life-threatening medical emergency. Immediate blood cultures and prompt empiric broad-spectrum IV antibiotic administration within 1 hour are essential to prevent septic shock."}, {"d": 3, "q": "A pregnant woman's Last Menstrual Period (LMP) began on April 10, 2026. Using Naegele's Rule, what is her Estimated Date of Delivery (EDD)?", "o": ["January 17, 2027", "January 10, 2027", "July 17, 2026", "December 17, 2026"], "a": 0, "r": "Naegele's Rule formula: EDD = LMP - 3 months + 7 days + 1 year. April 10 - 3 months = January 10 + 7 days = January 17, 2027."}, {"d": 3, "q": "A pregnant client at 20 weeks gestation undergoes routine antenatal assessment. Where should the nurse expect to palpate the fundal height?", "o": ["At the level of the umbilicus", "At the symphysis pubis", "Midway between symphysis pubis and umbilicus", "At the xiphoid process"], "a": 0, "r": "At 20 weeks gestation, the uterine fundus is palpated at the level of the umbilicus. From 24 to 36 weeks, fundal height in cm corresponds closely to weeks of gestation."}, {"d": 3, "q": "A pregnant woman at 32 weeks gestation is diagnosed with severe preeclampsia. She is started on an IV Magnesium Sulfate infusion. Which finding indicates Magnesium Sulfate TOXICITY?", "o": ["Absence of deep tendon reflexes (patellar reflex)", "Brisk deep tendon reflexes 3+", "Respiratory rate of 18 breaths/min", "Urine output of 50 mL/hour"], "a": 0, "r": "Loss of deep tendon reflexes (patellar reflex) is the earliest clinical sign of Magnesium Sulfate toxicity, followed by respiratory depression (<12/min) and cardiac arrest. Antidote is Calcium Gluconate."}, {"d": 3, "q": "What is the antidote for Magnesium Sulfate toxicity in an eclamptic patient?", "o": ["Calcium Gluconate 10% IV", "Protamine Sulfate", "Naloxone", "Vitamin K"], "a": 0, "r": "Calcium Gluconate 10% IV is the specific reversal agent for magnesium toxicity and must be readily available at the bedside during magnesium infusions."}, {"d": 3, "q": "A pregnant client at 34 weeks gestation presents with painless, bright red vaginal bleeding. What action is strictly CONTRAINDICATED?", "o": ["Digital vaginal examination", "External fetal heart rate monitoring", "Abdominal ultrasound examination", "Starting a large-bore IV line"], "a": 0, "r": "Painless bright red bleeding in the third trimester suggests Placenta Previa. Digital vaginal examination is strictly contraindicated because it can cause catastrophic placental separation and fatal hemorrhage."}, {"d": 3, "q": "A pregnant client at 36 weeks gestation presents with severe, continuous abdominal pain, dark vaginal bleeding, a hypertonic board-like uterus, and fetal bradycardia. What condition is present?", "o": ["Abruptio Placentae", "Placenta Previa", "Uterine Rupture", "Preterm Labor"], "a": 0, "r": "Premature separation of the placenta (Abruptio Placentae) presents with severe abdominal pain, dark vaginal bleeding, uterine tenderness/board-like rigidity, and fetal distress."}, {"d": 3, "q": "A primigravida at 38 weeks gestation has spontaneous rupture of membranes. The nurse observes the umbilical cord protruding from the vagina. What is the nurse's IMMEDIATE life-saving action?", "o": ["Insert a gloved hand into the vagina to lift the fetal presenting part off the cord", "Gently push the protruding cord back into the uterus", "Cover the cord with dry gauze and instruct the patient to walk", "Administer IV Oxytocin to speed delivery"], "a": 0, "r": "Cord prolapse cuts off fetal oxygenation. The nurse must immediately insert two gloved fingers into the vagina to exert upward pressure on the presenting part, relieving compression on the cord, and place the mother in Trendelenburg or Knee-Chest position while preparing for emergency C-section."}, {"d": 3, "q": "Following a spontaneous vaginal delivery, a patient experiences severe postpartum hemorrhage. The uterus is soft and boggy on palpation. What is the nurse's FIRST action?", "o": ["Perform firm continuous massage of the uterine fundus", "Administer IM Methylergonovine immediately", "Elevate the legs and apply cold packs to the abdomen", "Prepare the patient for emergency hysterectomy"], "a": 0, "r": "Uterine atony is the leading cause of postpartum hemorrhage. The immediate first action is firm fundal massage to stimulate uterine contraction and stop bleeding."}, {"d": 3, "q": "A postpartum nurse evaluates an Rh-negative mother who delivered a
