r respiratory pattern. What physiological event does this triad signify?", "o": ["Brainstem compression and impending herniation due to increased Intracranial Pressure (ICP)", "Spinal shock syndrome", "Hypovolemic shock due to internal bleeding", "Autonomic Dysreflexia"], "a": 0, "r": "Cushing's Triad (hypertension with a widened pulse pressure, bradycardia, and irregular respirations) is a late, ominous sign of severe increased ICP indicating brainstem compression and impending herniation."}, {"d": 2, "q": "A patient with a history of epilepsy experiences a generalized tonic-clonic seizure that has lasted for 7 continuous minutes. What is the priority pharmacological intervention?", "o": ["Administer IV Lorazepam or Diazepam", "Administer oral Phenytoin", "Administer IV Propofol", "Administer IM Haloperidol"], "a": 0, "r": "A continuous seizure lasting >5 minutes is Status Epilepticus, a medical emergency. The first-line treatment to break the seizure is a rapid-acting IV benzodiazepine (Lorazepam or Diazepam)."}, {"d": 2, "q": "A patient with Parkinson's disease is prescribed Carbidopa-Levodopa. What is the primary purpose of adding Carbidopa to the Levodopa?", "o": ["Carbidopa prevents the peripheral breakdown of levodopa, allowing more levodopa to reach the brain", "Carbidopa directly stimulates dopamine receptors in the basal ganglia", "Carbidopa prevents the severe hypertensive crisis associated with levodopa", "Carbidopa crosses the blood-brain barrier faster than levodopa"], "a": 0, "r": "Levodopa converts to dopamine in the brain. However, much of it is broken down in the peripheral body, causing severe nausea. Carbidopa inhibits this peripheral breakdown, allowing more Levodopa to cross the blood-brain barrier."}, {"d": 2, "q": "A patient with Myasthenia Gravis presents with severe muscle weakness and respiratory difficulty. The physician performs a Tensilon (Edrophonium) test. If the patient's symptoms WORSEN after the injection, what condition is occurring?", "o": ["Cholinergic Crisis", "Myasthenic Crisis", "Status Asthmaticus", "Guillain-Barré Syndrome"], "a": 0, "r": "Myasthenia Gravis exacerbations can be a Myasthenic Crisis (under-medication) or a Cholinergic Crisis (over-medication). If Edrophonium (an anticholinesterase) worsens the weakness, it confirms a Cholinergic Crisis. The antidote is Atropine."}, {"d": 2, "q": "A patient is diagnosed with Guillain-Barré Syndrome. The weakness started in the feet and is progressing upward. What is the most critical nursing assessment for this patient?", "o": ["Serial measurement of vital capacity and respiratory rate", "Frequent monitoring of deep tendon reflexes", "Hourly Glasgow Coma Scale assessments", "Strict monitoring of daily weights"], "a": 0, "r": "Guillain-Barré Syndrome causes ascending, symmetrical paralysis. The greatest risk to life is when the paralysis reaches the diaphragm and intercostal muscles, causing acute respiratory failure. Serial vital capacity monitoring is critical."}, {"d": 2, "q": "A patient with a spinal cord injury at T4 complains of a severe, pounding headache. The nurse notes profuse diaphoresis above the level of injury and a BP of 220/115 mmHg. What is the nurse's first physical intervention?", "o": ["Sit the patient upright at a 90-degree angle", "Check the patient's indwelling catheter for kinks or blockages", "Administer an anti-hypertensive medication", "Lay the patient flat and elevate the legs"], "a": 0, "r": "This is Autonomic Dysreflexia. The absolute FIRST physical intervention is to sit the patient upright (High Fowler's) to induce orthostatic pooling and naturally lower the blood pressure, followed immediately by finding the trigger (e.g., checking the Foley)."}, {"d": 2, "q": "A patient with advanced liver cirrhosis has hepatic encephalopathy and is prescribed Lactulose. How will the nurse evaluate that the medication is effective?", "o": ["The patient experiences an improvement in mental status and alertness", "The patient's abdominal ascites decreases", "The patient stops experiencing esophageal variceal bleeding", "The patient produces formed, solid stools"], "a": 0, "r": "Lactulose traps ammonia in the gut and expels it via feces. The primary therapeutic goal is to reduce serum ammonia levels, which reverses the confusion, lethargy, and asterixis associated with hepatic encephalopathy."}, {"d": 2, "q": "A patient with severe acute pancreatitis exhibits a bluish discoloration around the umbilicus. What is this sign called, and what does it indicate?", "o": ["Cullen's sign; indicates retroperitoneal or intra-abdominal hemorrhage", "Grey Turner's sign; indicates retroperitoneal hemorrhage", "Kehr's sign; indicates splenic rupture", "Murphy's sign; indicates cholecystitis"], "a": 0, "r": "Cullen's sign is a bluish peri-umbilical discoloration caused by blood tracking through fascial planes from retroperitoneal/intra-abdominal hemorrhage associated with severe necrotizing pancreatitis. Grey Turner's sign is on the flanks."}, {"d": 2, "q": "A patient with suspected acute appendicitis complains of severe Right Lower Quadrant (RLQ) pain. Suddenly, the patient states, 'The pain is completely gone, I feel much better.' What should the nurse suspect?", "o": ["The appendix has ruptured", "The inflammation has spontaneously resolved", "The pain medication has taken full effect", "The patient has developed an ileus"], "a": 0, "r": "A sudden relief of pain in a patient with acute appendicitis is a classic clinical sign that the appendix has ruptured, dumping infected contents into the peritoneal cavity and setting the stage for life-threatening peritonitis."}, {"d": 2, "q": "A patient is admitted with a small bowel obstruction. Which clinical manifestation is most characteristic of an obstruction high in the small intestine?", "o": ["Profuse, frequent vomiting that may contain bile or fecal matter", "Absolute constipation with no passing of flatus", "Severe, constant lower abdominal pain", "A hard, board-like, silent abdomen"], "a": 0, "r": "Proximal (high) small bowel obstructions present rapidly with frequent, profuse vomiting (which relieves pain temporarily), colicky upper abdominal pain, and minimal initial abdominal distension compared to large bowel obstructions."}, {"d": 2, "q": "A patient is diagnosed with a duodenal ulcer. Which pattern of pain is most characteristic of this condition?", "o": ["Pain that occurs 2-3 hours after a meal and is relieved by eating food", "Pain that occurs immediately after eating a meal", "Constant, gnawing left-upper quadrant pain radiating to the shoulder", "Severe colicky pain occurring mostly at night, unrelated to food"], "a": 0, "r": "Duodenal ulcer pain typically occurs when the stomach is empty (2-3 hours postprandial) or in the middle of the night. Eating food or taking antacids relieves the pain because food buffers the acid entering the duodenum."}, {"d": 2, "q": "A patient is admitted with Hyperosmolar Hyperglycemic State (HHS). Blood glucose is 850 mg/dL, and serum osmolarity is 340 mOsm/kg. Which finding distinguishes HHS from Diabetic Ketoacidosis (DKA)?", "o": ["Absence of significant serum and urine ketones", "Presence of Kussmaul respirations", "Arterial pH of 7.15", "Rapid onset within 24 hours"], "a": 0, "r": "HHS typically occurs in Type 2 diabetics who produce just enough insulin to prevent fat breakdown and ketogenesis, so there are no significant ketones and no acidosis. It has a slower onset but causes much higher glucose and deeper dehydration than DKA."}, {"d": 2, "q": "A patient recovering from a thyroidectomy develops a sudden temperature of 40°C, heart rate of 160 bpm, extreme agitation, and delirium. What life-threatening condition is occurring?", "o": ["Thyroid Storm (Thyrotoxic Crisis)", "Myxedema Coma", "Malignant Hyperthermia", "Pheochromocytoma Crisis"], "a": 0, "r": "Thyroid storm is an extreme, life-threatening hypermetabolic state resulting from a massive release of thyroid hormones, often triggered by stress, infection, or thyroid surgery. Symptoms include severe hyperthermia, tachycardia, and altered mental status."}, {"d": 2, "q": "A patient with primary adrenal insufficiency (Addison's disease) presents to the ED with severe hypotension, vomiting, and profound weakness. Lab results show hyponatremia and hyperkalemia. What is the priority medical treatment?", "o": ["Rapid IV administration of Hydrocortisone and isotonic fluids", "IV administration of Potassium Chloride", "Administration of IV Regular Insulin", "Fluid restriction and loop diuretics"], "a": 0, "r": "An Addisonian Crisis is a life-threatening lack of cortisol and aldosterone, causing massive sodium/water loss (hypovolemic shock) and potassium retention. Immediate treatment is IV glucocorticoids (Hydrocortisone) and rapid fluid resuscitation."}, {"d": 2, "q": "A patient has been taking high doses of oral prednisone for 6 months for a severe autoimmune disorder. The nurse expects to see which phenotypic manifestations of iatrogenic Cushing's syndrome?", "o": ["Moon face, truncal obesity, purple striae, and a 'buffalo hump'", "Severe weight loss, bronze skin hyperpigmentation, and hypotension", "Exophthalmos, goiter, and fine tremors", "Thickened skin, macroglossia, and cold intolerance"], "a": 0, "r": "Excess glucocorticoids (Cushing's syndrome) alter fat distribution (moon face, buffalo hump, truncal obesity), cause skin thinning (purple striae, easy bruising), and lead to hyperglycemia and osteoporosis."}, {"d": 2, "q": "A patient with a traumatic brain injury develops Diabetes Insipidus (DI). Which set of clinical findings confirms this diagnosis?", "o": ["Massive polyuria, highly dilute urine (specific gravity < 1.005), and hypernatremia", "Oliguria, highly concentrated urine, and dilutional hyponatremia", "Polyuria, glycosuria, and hyperglycemia", "Anuria, edema, and hyperkalemia"], "a": 0, "r": "Diabetes Insipidus is caused by a lack of Antidiuretic Hormone (ADH). The kidneys cannot reabsorb water, leading to massive output of very dilute urine (low specific gravity), causing systemic dehydration and hypernatremia."}, {"d": 2, "q": "A patient with oat cell carcinoma of the lung develops Syndrome of Inappropriate Antidiuretic Hormone (SIADH). What is the cornerstone of nursing management for this patient?", "o": ["Strict fluid restriction and monitoring for hyponatremia", "Aggressive IV fluid hydration with D5W", "Administering Vasopressin (Desmopressin) IV", "Encouraging a low-sodium diet"], "a": 0, "r": "In SIADH, excessive ADH causes severe water retention and dilutional hyponatremia. The primary treatment is strict fluid restriction (often < 1000 mL/day), hypertonic saline for severe cases, and closely monitoring sodium levels to prevent seizures."}, {"d": 2, "q": "A patient has a cast applied for a fractured radius. Two hours later, the patient complains of unremitting, severe pain that is worse with passive stretching of the fingers. The fingers are cool and pale. What must the nurse do FIRST?", "o": ["Notify the healthcare provider immediately; this is Compartment Syndrome", "Elevate the arm above the level of the heart to reduce swelling", "Apply an ice pack directly to the cast", "Administer a PRN dose of IV morphine"], "a": 0, "r": "Severe pain out of proportion, worsened by passive stretch, along with pallor and coolness, are signs of Compartment Syndrome. The provider must be notified immediately to bivalve the cast. The arm should NOT be elevated above the heart (decreases arterial flow)."}, {"d": 2, "q": "A patient with a total hip replacement (posterior approach) must adhere to which positional precaution to prevent dislocation?", "o": ["Do not flex the hip beyond 90 degrees and use an abduction pillow between the legs", "Keep the legs crossed at the ankles while in bed", "Sleep on the operative side without any pillows", "Perform deep knee bends to strengthen the joint"], "a": 0, "r": "Posterior hip precautions require preventing hip flexion > 90 degrees (no bending to tie shoes, use high-seated chairs), preventing adduction (crossing legs), and avoiding internal rotation. An abduction pillow is often used."}, {"d": 2, "q": "A patient has a newly formed colostomy. The nurse assesses the stoma on postoperative day 2. Which finding requires IMMEDIATE intervention by the surgeon?", "o": ["The stoma is dark purple and dry", "The stoma is beefy red and moist", "The stoma is slightly edematous", "A small amount of blood oozes when the stoma is gently cleaned"], "a": 0, "r": "A healthy stoma is beefy red, moist, and slightly swollen post-op. A dark purple, black, or dry stoma indicates ischemia and necrosis, which is a surgical emergency."}, {"d": 2, "q": "A patient is admitted with a lower gastrointestinal bleed. The nurse expects the patient's stool to have which appearance?", "o": ["Hematochezia (bright red bloody stools)", "Melena (black, tarry stools)", "Steatorrhea (pale, bulky, foul-smelling stools)", "Clay-colored (acholic) stools"], "a": 0, "r": "Lower GI bleeds (e.g., from hemorrhoids, diverticulosis, colonic polyps) typically present as hematochezia (bright red blood). Upper GI bleeds (peptic ulcers) present as melena (black, tarry stools) due to blood digestion."}, {"d": 2, "q": "A patient is recovering from a radical mastectomy with axillary lymph node dissection. Which intervention is crucial to prevent lymphedema in the affected arm?", "o": ["Avoid taking blood pressure readings, IVs, or blood draws on the affected arm", "Keep the affected arm dependent below the heart at all times", "Apply warm compresses to the arm every 2 hours", "Restrict all movement and exercise of the affected arm for 6 months"], "a": 0, "r": "Axillary node dissection impairs lymphatic drainage. To prevent irreversible lymphedema, the affected arm must be strictly protected from trauma, venipuncture, IV lines, and blood pressure cuffs. The arm should be elevated, and progressive exercise is encouraged."}, {"d": 2, "q": "A patient is prescribed sublingual Nitroglycerin for stable angina. What specific instruction MUST the nurse include in the discharge teaching?", "o": ["Take 1 tablet every 5 minutes for chest pain, up to a maximum of 3 tablets, and call emergency services if pain persists", "Swallow the tablet whole with a full glass of water", "Keep the medication in a clear plastic bag in your pocket for easy access", "Stop taking the medication if it causes a headache"], "a": 0, "r": "Standard angina protocol: Take 1 SL tablet. If pain is not relieved in 5 minutes, call EMS and take a 2nd tablet. Take a maximum of 3 tablets 5 minutes apart. It must be kept in its original dark glass bottle to prevent degradation by light."}, {"d": 2, "q": "The nurse is evaluating a 12-lead ECG and notes a prolonged PR interval of 0.28 seconds, but every P wave is followed by a QRS complex. How is this interpreted?", "o": ["First-degree Atrioventricular (AV) block", "Second-degree AV block, Mobitz Type I (Wenckebach)", "Second-degree AV block, Mobitz Type II", "Third-degree (Complete) AV block"], "a": 0, "r": "A First-degree AV block is characterized by a constant, prolonged PR interval (> 0.20 seconds), with a 1:1 ratio of P waves to QRS complexes. It is usually benign and asymptomatic."}, {"d": 2, "q": "A patient with cirrhosis of the liver is admitted with massive ascites and severe dyspnea. The physician performs a therapeutic paracentesis, removing 5 liters of fluid. What is the most critical post-procedure nursing assessment?", "o": ["Monitor blood pressure closely for signs of hypovolemic shock", "Monitor for signs of hypertensive crisis", "Assess for absent bowel sounds", "Monitor for an immediate increase in serum albumin"], "a": 0, "r": "Rapid removal of large volumes of ascitic fluid (usually > 4-5 liters) can cause a massive fluid shift from the intravascular space into the peritoneal cavity, leading to severe hypotension and hypovolemic shock. IV Albumin is often given to prevent this."}, {"d": 2, "q": "A patient is admitted with a bleeding peptic ulcer. The nurse inserts a nasogastric (NG) tube and connects it to low intermittent suction. The nurse notes bright red blood in the suction canister. What is the priority nursing intervention?", "o": ["Perform gastric lavage with room temperature normal saline as ordered", "Remove the NG tube immediately to prevent further trauma", "Clamp the NG tube and notify the physician", "Administer oral antacids through the NG tube"], "a": 0, "r": "In an active upper GI bleed, an NG tube may be used for gastric lavage with room temperature normal saline to clear the stomach of blood/clots before endoscopy and to assess the rate of bleeding. Removing the tube eliminates this access."}, {"d": 2, "q": "A patient with chronic kidney disease (CKD) is prescribed a diet low in potassium. Which food choice by the patient indicates a need for further teaching?", "o": ["A baked potato with spinach", "Apples and blueberries", "White bread and pasta", "Cabbage and green beans"], "a": 0, "r": "Potatoes, spinach, tomatoes, bananas, oranges, and avocados are very high in potassium and must be avoided by patients with severe CKD. Apples, berries, cabbage, and refined grains are lower in potassium."}, {"d": 2, "q": "A patient is recovering from an open cholecystectomy and has a T-tube in place. On the second postoperative day, the nurse notes 400 mL of dark green drainage in the T-tube bag. What is the appropriate nursing action?", "o": ["Document the finding as normal; it is expected drainage", "Clamp the T-tube immediately", "Notify the surgeon of hemorrhage", "Irrigate the T-tube forcefully with sterile water"], "a": 0, "r": "A T-tube drains bile directly from the common bile duct. Output of 300-500 mL of dark green/brown bile is a normal, expected finding in the first few days post-op. T-tubes should never be irrigated forcefully without a specific order."}, {"d": 2, "q": "A patient is admitted with suspected acute cholecystitis. The nurse assesses the patient and expects to find pain in which abdominal quadrant, potentially radiating to which area?", "o": ["Right Upper Quadrant (RUQ) radiating to the right shoulder or scapula", "Left Lower Quadrant (LLQ) radiating to the groin", "Epigastric region radiating straight through to the back", "Right Lower Quadrant (RLQ) radiating to the umbilicus"], "a": 0, "r": "Acute cholecystitis (gallbladder inflammation) classically presents with severe Right Upper Quadrant (RUQ) pain that often radiates to the right scapula or right shoulder (referred pain)."}, {"d": 2, "q": "A patient with a history of intravenous drug use is diagnosed with Hepatitis C. The patient asks how the virus is transmitted. What is the most accurate response?", "o": ["Hepatitis C is transmitted primarily through contact with infected blood, such as sharing needles.", "Hepatitis C is transmitted through the fecal-oral route, like contaminated food or water.", "Hepatitis C is transmitted through airborne respiratory droplets.", "Hepatitis C is only transmitted through unprotected sexual intercourse."], "a": 0, "r": "Hepatitis C (and Hepatitis B) is a bloodborne pathogen transmitted primarily through exposure to infected blood (e.g., IV drug use, needle sticks, contaminated blood products). Hepatitis A and E are fecal-oral."}, {"d": 2, "q": "A patient with Rheumatoid Arthritis (RA) is experiencing a severe joint flare-up. Which characteristic of joint pain is typical for RA but NOT typically seen in Osteoarthritis (OA)?", "o": ["Morning stiffness that lasts for more than 1 hour and improves with movement", "Pain that gets progressively worse throughout the day with activity", "Unilateral joint involvement, typically in weight-bearing joints like the knee", "Heberden's nodes on the distal interphalangeal joints"], "a": 0, "r": "Rheumatoid Arthritis is a systemic autoimmune disease characterized by symmetrical joint involvement and prolonged morning stiffness (lasting > 1 hour) that actually improves with use/activity. OA pain worsens with activity."}, {"d": 2, "q": "A patient taking Methotrexate for Rheumatoid Arthritis is receiving routine discharge teaching. Which patient statement indicates a critical understanding of the medication's risks?", "o": ["'I must use strict birth control because this medication causes severe birth defects.'", "'I can take this medication safely with over-the-counter ibuprofen.'", "'I will stop taking this medication if I feel stiff in the mornings.'", "'I should expect my urine to turn a dark orange color.'"], "a": 0, "r": "Methotrexate is an immunosuppressant and a known highly teratogenic drug. Female patients of childbearing age must use strict, effective contraception due to the severe risk of fetal malformation or death."}, {"d": 2, "q": "A patient is admitted with an acute gout attack. The nurse knows that gout is caused by the accumulation of which substance in the joints?", "o": ["Uric acid crystals", "Calcium pyrophosphate", "Cholesterol plaques", "Lactic acid"], "a": 0, "r": "Gout is a type of inflammatory arthritis caused by hyperuricemia, leading to the deposition of sharp uric acid crystals (monosodium urate) in the joints, most commonly the big toe (podagra)."}, {"d": 2, "q": "A patient with systemic lupus erythematosus (SLE) is admitted with proteinuria, hematuria, and facial edema. What severe complication of SLE does the nurse suspect?", "o": ["Lupus Nephritis", "Rheumatoid heart disease", "Hepatic failure", "Pulmonary fibrosis"], "a": 0, "r": "Lupus Nephritis is a severe, life-threatening complication of SLE where autoantibodies attack the kidneys, leading to glomerulonephritis, characterized by proteinuria, hematuria, edema, and hypertension."}, {"d": 2, "q": "The nurse is caring for a patient who is 1 day post-operative from a thyroidectomy. The patient exhibits a harsh, high-pitched respiratory sound during inspiration. What is the nurse's immediate priority?", "o": ["Notify the Rapid Response Team and prepare for emergency intubation or tracheostomy", "Administer a PRN dose of IV calcium gluconate", "Document the finding; stridor is normal after throat surgery", "Encourage the patient to cough and deep breathe forcefully"], "a": 0, "r": "A harsh, high-pitched inspiratory sound is stridor, which indicates severe laryngeal edema or vocal cord paralysis leading to critical airway obstruction. This is a life-threatening emergency requiring immediate airway securement."}, {"d": 2, "q": "A patient is admitted in a Myxedema Coma. The nurse anticipates administering which emergency medication?", "o": ["Intravenous Levothyroxine", "Intravenous Propylthiouracil (PTU)", "Intramuscular Epinephrine", "Subcutaneous Regular Insulin"], "a": 0, "r": "Myxedema coma is a life-threatening complication of severe, untreated hypothyroidism resulting in hypothermia, hypoventilation, and cardiovascular collapse. It requires immediate replacement with IV Levothyroxine."}, {"d": 2, "q": "A patient with a history of hyperthyroidism is scheduled for a radioactive iodine uptake test. What crucial assessment must the nurse perform before this procedure?", "o": ["Determine if the patient is pregnant, as radioactive iodine is strictly contraindicated in pregnancy", "Ensure the patient has a full bladder before the scan", "Assess for an allergy to penicillin", "Administer a dose of levothyroxine to prepare the thyroid"], "a": 0, "r": "Radioactive iodine (I-131) crosses the placenta and can permanently destroy the fetal thyroid gland. A pregnancy test is mandatory before administration, and it is strictly contraindicated in pregnant or breastfeeding women."}, {"d": 2, "q": "A patient with Diabetes Mellitus Type 2 is scheduled for a CT scan with IV contrast dye. The patient is currently taking Metformin. What is the nurse's priority action?", "o": ["Withhold the Metformin on the day of the procedure and for 48 hours after", "Administer the Metformin with a sip of water before the scan", "Double the dose of Metformin to counteract the glucose in the contrast", "Switch the patient to intermediate-acting insulin permanently"], "a": 0, "r": "Metformin must be withheld on the day of the procedure and for 48 hours after receiving IV iodinated contrast dye. The contrast dye can cause acute kidney injury, which prevents the excretion of Metformin, leading to fatal lactic acidosis."}, {"d": 2, "q": "A nurse is caring for a patient who sustained a 40% total body surface area (TBSA) severe burn injury 48 hours ago. The patient is now entering the acute (diuretic) phase. Which electrolyte imbalance is the nurse most likely to observe?", "o": ["Hyponatremia and Hypokalemia", "Hypernatremia and Hyperkalemia", "Hypercalcemia", "Hypermagnesemia"], "a": 0, "r": "During the initial emergent/resuscitative phase (first 24-48 hours), hyperkalemia (due to cell destruction) and hyponatremia occur. In the acute (diuretic) phase, fluid shifts back into the vasculature, causing diuresis which leads to BOTH hyponatremia and hypokalemia."}, {"d": 2, "q": "A patient with a suspected basal skull fracture has clear fluid draining from the nose (rhinorrhea). How can the nurse confirm if the fluid is cerebrospinal fluid (CSF)?", "o": ["Test the fluid for glucose; CSF is positive for glucose", "Check the fluid for red blood cells under a microscope", "Smell the fluid; CSF has a distinct ammonia odor", "Assess the fluid's pH; CSF is highly acidic"], "a": 0, "r": "Clear fluid draining from the nose or ears after a head injury may be CSF. Testing the clear fluid with a dipstick for glucose (which is present in CSF but not in normal nasal mucus) can help confirm a CSF leak. If blood is present, the 'halo test' on filter paper is used instead."}, {"d": 2, "q": "A patient is admitted with a cervical spine injury at C3. What is the most critical physiological impairment the nurse must monitor for?", "o": ["Loss of respiratory muscle function requiring mechanical ventilation", "Loss of bowel and bladder control", "Paraplegia of the lower extremities with intact upper body strength", "Autonomic dysreflexia triggered by a full bladder"], "a": 0, "r": "The phrenic nerve, which innervates the diaphragm, originates at C3-C5. An injury at C3 results in total loss of respiratory muscle function, making immediate mechanical ventilation absolutely critical for survival."}, {"d": 2, "q": "A patient with an acute ischemic stroke is receiving continuous continuous IV Heparin. The patient's latest aPTT is 120 seconds. What is the nurse's priority action?", "o": ["Stop the Heparin infusion and notify the provider; the patient is at high risk for hemorrhage", "Continue the infusion as ordered; this is a therapeutic aPTT level", "Increase the Heparin infusion rate slightly", "Administer a bolus dose of Heparin"], "a": 0, "r": "The normal aPTT is roughly 25-35 seconds. The therapeutic goal for a patient on IV Heparin is usually 1.5 to 2.5 times the normal (approx. 50-70 seconds). An aPTT of 120 seconds is critically high, indicating a severe risk of spontaneous bleeding."}, {"d": 2, "q": "A patient is recovering from a craniotomy and is positioned with the head of the bed elevated 30 degrees. The nurse understands this specific positioning is strictly intended to:", "o": ["Promote venous drainage from the brain and decrease Intracranial Pressure (ICP)", "Prevent the development of deep vein thrombosis in the legs", "Improve the patient's ability to swallow clear liquids", "Prevent tension on the surgical incision line"], "a": 0, "r": "In patients with increased ICP or following a craniotomy, elevating the head of the bed to 30 degrees and keeping the neck in a neutral midline position promotes jugular venous return, which significantly lowers intracranial pressure."}, {"d": 2, "q": "A patient presents with sudden, severe, unilateral facial pain triggered by brushing their teeth. The pain feels like an 'electric shock.' What cranial nerve is most likely affected?", "o": ["Cranial Nerve V (Trigeminal)", "Cranial Nerve VII (Facial)", "Cranial Nerve IX (Glossopharyngeal)", "Cranial Nerve X (Vagus)"], "a": 0, "r": "Trigeminal Neuralgia (Tic Douloureux) affects Cranial Nerve V, causing sudden, excruciating, shock-like facial pain triggered by light touch, chewing, or brushing teeth."}, {"d": 2, "q": "A patient has a chest tube connected to a dry-suction water-seal drainage system. The nurse notes the water level in the water-seal chamber fluctuates up and down with each breath. What is the nurse's interpretation of this?", "o": ["This is 'tidaling', a normal finding indicating the tube is patent and the lung is not fully re-expanded", "This indicates an air leak requiring immediate clamping of the tube", "This indicates the suction pressure is set too high", "This means the lung has completely re-expanded and the tube can be removed"], "a": 0, "r": "Tidaling (fluctuation of the water level in the water-seal chamber with inspiration and expiration) reflects the normal changes in intrapleural pressure during breathing. It indicates the chest tube is patent. When the lung fully re-expands, tidaling stops."}, {"d": 2, "q": "A patient in the intensive care unit is intubated and requires frequent oral care. Why is comprehensive oral care with chlorhexidine crucial for this patient?", "o": ["To prevent Ventilator-Associated Pneumonia (VAP)", "To prevent oral thrush caused by the endotracheal tube", "To keep the lips moist and prevent cracking", "To stimulate the swallow reflex"], "a": 0, "r": "A key component of the VAP (Ventilator-Associated Pneumonia) prevention bundle is routine oral care with chlorhexidine, which drastically reduces the bacterial colonization in the mouth that can be aspirated into the lungs."}, {"d": 2, "q": "A patient is admitted with Acute Coronary Syndrome. The physician orders a troponin level. Why is troponin considered the preferred biomarker for myocardial infarction?", "o": ["It is highly specific to myocardial muscle damage and stays elevated for up to two weeks", "It is the fastest enzyme to rise within 30 minutes of chest pain", "It is exclusively released during angina episodes without cell death", "It indicates total body muscle breakdown, not just the heart"], "a": 0, "r": "Troponin T and I are proteins found exclusively in myocardial cells. They are highly sensitive and specific for cardiac muscle necrosis. They rise within 4-6 hours, peak at 10-24 hours, and crucially, remain elevated for 10-14 days."}, {"d": 2, "q": "A patient is prescribed continuous BiPAP (Bilevel Positive Airway Pressure) for severe COPD exacerbation. Which assessment finding requires immediate discontinuation of the BiPAP mask?", "o": ["The patient experiences severe nausea and begins vomiting", "The patient's SpO2 improves from 88% to 94%", "The patient complains the mask feels tight on the bridge of the nose", "The patient's respiratory rate drops from 32 to 24 breaths/min"], "a": 0, "r": "BiPAP masks are tightly strapped to the face. If a patient begins vomiting, there is a massive risk of aspirating the emesis straight into the lungs due to the positive pressure. The mask must be removed immediately."}, {"d": 2, "q": "A patient with a central line is receiving an IV infusion of a vesicant chemotherapy drug. The patient complains of burning at the IV site, and the nurse notes swelling and lack of blood return. What is the FIRST action?", "o": ["Stop the infusion immediately", "Apply a warm compress and elevate the arm", "Push 10 mL of normal saline to flush the line", "Slow the infusion rate and monitor for 15 minutes"], "a": 0, "r": "A vesicant drug can cause severe tissue necrosis if it extravasates. The absolute first action is to stop the infusion immediately to prevent further tissue damage. The cannula should be left in place temporarily in case an antidote needs to be aspirated or administered."}, {"d": 2, "q": "The nurse is analyzing an ABG: pH 7.48, PaCO2 30 mmHg, HCO3 24 mEq/L. Which clinical condition is most likely to cause this acid-base imbalance?", "o": ["A severe panic attack causing hyperventilation", "An acute exacerbation of COPD with hypoventilation", "Diabetic Ketoacidosis (DKA)", "Prolonged nasogastric suctioning"], "a": 0, "r": "This ABG shows Respiratory Alkalosis (high pH, low PaCO2, normal HCO3). Hyperventilation (from panic attacks, anxiety, severe pain, or early hypoxia) blows off excessive CO2, leading to respiratory alkalosis."}, {"d": 2, "q": "A patient with advanced heart failure has an implantable cardioverter-defibrillator (ICD). The patient suddenly feels a shock from the device and becomes lightheaded. What should the patient be instructed to do?", "o": ["Lie down and call emergency medical services (EMS) immediately", "Perform strenuous exercise to raise the heart rate", "Ignore it unless it happens three times in a row", "Place a strong magnet over the ICD to deactivate it"], "a": 0, "r": "If an ICD delivers a shock, it means the patient experienced a lethal arrhythmia (V-Tach or V-Fib). The patient must rest immediately and call EMS, as the underlying condition requires urgent evaluation and the arrhythmia may recur."}, {"d": 2, "q": "A patient receiving a blood transfusion complains of severe shortness of breath, a bounding pulse, and a severe headache. The nurse auscultates crackles in the lung bases. What complication is occurring?", "o": ["Transfusion-Associated Circulatory Overload (TACO)", "Acute Hemolytic Reaction", "Transfusion-Related Acute Lung Injury (TRALI)", "Allergic Reaction"], "a": 0, "r": "TACO occurs when blood is infused too rapidly, overwhelming the patient's cardiovascular system (especially in older adults or HF patients). Symptoms include dyspnea, bounding pulse, hypertension, and pulmonary edema (crackles). TRALI causes sudden non-cardiogenic pulmonary edema without volume overload signs."}, {"d": 2, "q": "The nurse is caring for a patient with deep partial-thickness burns on the chest and arms. The physician orders mafenide acetate (Sulfamylon) cream. What is the most important nursing consideration when applying this medication?", "o": ["Pre-medicate the patient with analgesics, as it causes severe burning pain upon application", "Keep the burns exposed to air without any dressings after application", "Monitor for the development of metabolic alkalosis", "Apply only to intact skin to prevent systemic absorption"], "a": 0, "r": "Mafenide acetate is a potent topical antimicrobial that penetrates burn eschar well. However, it is notorious for causing intense, severe burning pain for 20-40 minutes after application, requiring pre-medication. It can also cause metabolic acidosis (not alkalosis)."}, {"d": 2, "q": "A patient recovering from a massive myocardial infarction develops a new, loud, blowing holosystolic murmur at the apex and signs of acute cardiogenic shock. What lethal mechanical complication should the nurse suspect?", "o": ["Papillary muscle rupture leading to acute mitral regurgitation", "Ventricular aneurysm", "Acute pericarditis", "Aortic valve stenosis"], "a": 0, "r": "A new, loud systolic murmur at the apex following an MI, accompanied by sudden pulmonary edema and shock, strongly indicates rupture of the papillary muscle (which holds the mitral valve leaflets), leading to acute, massive mitral regurgitation."}, {"d": 2, "q": "A patient arrives in the ED 24 hours after suffering a severe burn covering 45% of their total body surface area (TBSA). The patient's urine output has dropped to 15 mL/hr over the last two hours. Blood pressure is 88/50 mmHg. What is the priority nursing intervention?", "o": ["Increase the rate of the intravenous Lactated Ringer's infusion per the titration protocol", "Administer a prescribed IV bolus of furosemide (Lasix)", "Administer a prescribed vasopressor (e.g., norepinephrine) to increase blood pressure", "Prepare the patient for immediate emergency hemodialysis"], "a": 0, "r": "In the emergent phase of severe burns, massive fluid shifts cause profound hypovolemic shock. Oliguria (< 30 mL/hr) indicates inadequate fluid resuscitation. The priority is to INCREASE the IV fluid rate (crystalloids like Lactated Ringer's) to restore organ perfusion. Diuretics are strictly contraindicated as they worsen hypovolemia."}, {"d": 2, "q": "A patient who is 2 days post-thyroidectomy complains of numbness and tingling around the mouth and fingertips. The nurse taps the patient's facial nerve just anterior to the earlobe, and the facial muscles twitch. What is the nurse's priority action?", "o": ["Prepare to administer intravenous Calcium Gluconate", "Prepare to administer intravenous Potassium Chloride", "Notify the surgeon to prepare for emergency intubation", "Document the positive Chvostek's sign as a normal postoperative finding"], "a": 0, "r": "A positive Chvostek's sign (facial twitching upon tapping the facial nerve) combined with circumoral paresthesia strongly indicates acute hypocalcemia, a common complication of thyroid surgery due to inadvertent parathyroid gland damage. The immediate treatment is IV Calcium Gluconate."}, {"d": 2, "q": "The nurse is analyzing an Arterial Blood Gas (ABG) for a patient with chronic kidney disease. Results: pH 7.28, PaCO2 35 mmHg, HCO3 16 mEq/L. How should the nurse interpret this ABG?", "o": ["Uncompensated Metabolic Acidosis", "Fully Compensated Metabolic Acidosis", "Partially Compensated Respiratory Acidosis", "Uncompensated Respiratory Acidosis"], "a": 0, "r": "pH is low (acidosis). HCO3 is low (metabolic). PaCO2 is normal (35-45 mmHg), meaning the lungs have not yet compensated. Therefore, it is Uncompensated Metabolic Acidosis, which is highly expected in advanced CKD due to the failure to excrete hydrogen ions."}, {"d": 2, "q": "A patient is admitted to the ICU with severe Sepsis. According to the Surviving Sepsis Campaign 1-Hour Bundle, which action MUST be completed before administering the first dose of broad-spectrum IV antibiotics?", "o": ["Obtain two sets of blood cultures from different anatomical sites", "Administer a 30 mL/kg rapid crystalloid fluid bolus", "Obtain a serum lactate level", "Administer an IV vasopressor to stabilize blood pressure"], "a": 0, "r": "Blood cultures must ALWAYS be drawn BEFORE the administration of broad-spectrum antibiotics to accurately identify the causative pathogen. Giving antibiotics first can sterilize the blood sample and prevent targeted therapy."}, {"d": 2, "q": "A patient is admitted with an acute exacerbation of Heart Failure. The physician orders a B-type Natriuretic Peptide (BNP) test. The result is 950 pg/mL. What does this result indicate to the nurse?", "o": ["Severe exacerbation of heart failure with significant ventricular stretch", "A normal finding for an older adult patient", "The patient is experiencing a massive acute myocardial infarction", "The patient has developed severe acute kidney injury"], "a": 0, "r": "BNP is a hormone secreted by the ventricles in response to excessive stretching and volume overload. A normal BNP is < 100 pg/mL. A level > 400-500 pg/mL strongly correlates with acute heart failure exacerbation."}, {"d": 2, "q": "A patient with a history of cirrhosis is admitted with vomiting of bright red blood. The patient is tachycardic and hypotensive. What is the nurse's MOST immediate life-saving priority?", "o": ["Establish two large-bore IV lines and prepare for rapid fluid and blood resuscitation", "Insert a nasogastric tube to clear the stomach of blood", "Administer oral Lactulose to prevent hepatic encephalopathy", "Prepare the patient for an emergency abdominal paracentesis"], "a": 0, "r": "Ruptured esophageal varices are a life-threatening complication of cirrhosis portal hypertension, leading to massive, rapid exsanguination. The immediate priority is stabilizing hemodynamics by establishing large-bore IV access for rapid volume expansion and blood products."}, {"d": 2, "q": "The nurse is assessing a patient 24 hours after the application of a long-leg cast. The patient complains of severe, throbbing pain that is not relieved by the prescribed IV opioid. The toes are pale, cold, and have delayed capillary refill. What is the priority nursing action?", "o": ["Notify the healthcare provider immediately to prepare for cast bivalving or fasciotomy", "Elevate the leg on three pillows to reduce severe edema", "Apply an ice pack over the area of most severe pain", "Administer an additional dose of breakthrough pain medication"], "a": 0, "r": "These are the classic signs of Compartment Syndrome (pain out of proportion, pallor, pulselessness, paresthesia, paralysis, poikilothermia). It is a limb-threatening emergency requiring immediate reduction of pressure (cutting the cast or surgical fasciotomy). Elevation decreases arterial flow and is contraindicated."}, {"d": 2, "q": "A patient with newly diagnosed Open-Angle Glaucoma is prescribed Timolol ophthalmic drops. Which systemic side effect should the nurse monitor for, particularly in a patient with a history of asthma?", "o": ["Bronchospasm and wheezing", "Tachycardia and palpitations", "Severe hypertension", "Sudden irreversible hearing loss"], "a": 0, "r": "Timolol is a non-selective beta-blocker. If it is systemically absorbed through the lacrimal duct, it can cause beta-2 blockade in the lungs, leading to severe bronchospasm in patients with asthma or COPD."}, {"d": 2, "q": "A patient undergoing chemotherapy develops an absolute neutrophil count (ANC) of 300/mm³. Which of the following is STRICTLY contraindicated for this patient?", "o": ["Receiving a vase of fresh-cut flowers from a visitor", "Eating thoroughly cooked meat and canned vegetables", "Taking oral acetaminophen for a mild headache", "Using a soft-bristled toothbrush for oral hygiene"], "a": 0, "r": "An ANC < 500/mm³ indicates severe neutropenia, placing the patient at massive risk for fatal infections. Fresh flowers, potted plants, and unwashed raw fruits/vegetables harbor dangerous soil-borne bacteria and fungi (like Aspergillus) and are strictly prohibited."}, {"d": 2, "q": "A patient is admitted with suspected Acute Meningitis. Before a lumbar puncture is performed, the nurse notes the patient is becoming increasingly lethargic and the pupils are sluggish. The physician orders a STAT head CT. Why is the CT scan necessary BEFORE the lumbar puncture?", "o": ["To rule out increased intracranial pressure (ICP) which could lead to brain herniation during the lumbar puncture", "To determine the exact type of bacteria causing the meningitis", "To visualize the precise intervertebral space for the lumbar puncture needle", "To confirm the presence of a subarachnoid hemorrhage"], "a": 0, "r": "If a patient has significantly elevated ICP (indicated by altered LOC, sluggish pupils, papilledema), performing a lumbar puncture can cause a rapid drop in spinal pressure below the brain, leading to fatal downward brainstem herniation. A CT rules out mass lesions or severe swelling first."}, {"d": 2, "q": "A 72-year-old patient with Parkinson's disease is experiencing severe dysphagia and is at high risk for aspiration. Which nursing intervention is most appropriate when assisting this patient with meals?", "o": ["Position the patient upright at 90 degrees and instruct them to tuck their chin to their chest when swallowing", "Provide thin, clear liquids to ensure adequate hydration", "Position the patient in a semi-Fowler's position and use a straw for all liquids", "Encourage the patient to talk and socialize between bites to improve mood"], "a": 0, "r": "The 'chin-tuck' maneuver narrows the airway opening and widens the vallecular space, significantly reducing the risk of aspiration in patients with dysphagia. Thin liquids are highly dangerous and require thickening. Straws increase aspiration risk."}, {"d": 2, "q": "A patient with suspected acute appendicitis complains of severe pain when the nurse deeply palpates the left lower quadrant (LLQ) and quickly releases it, which causes intense pain in the right lower quadrant (RLQ). What is this clinical sign called?", "o": ["Rovsing's sign", "Psoas sign", "Obturator sign", "Murphy's sign"], "a": 0, "r": "Rovsing's sign is positive when deep palpation of the left lower quadrant (LLQ) produces referred pain in the right lower quadrant (RLQ), highly suggestive of acute appendicitis."}, {"d": 2, "q": "The nurse is preparing to administer packed red blood cells (PRBCs) to a patient with severe anemia. The patient has a 22-gauge IV catheter in place. What is the nurse's BEST action?", "o": ["Attempt to start a new IV line with an 18-gauge or 20-gauge catheter if possible, but proceed slowly with the 22-gauge if absolutely necessary", "Administer the blood rapidly through the 22-gauge catheter", "Mix the blood with 5% Dextrose to dilute it so it flows through the 22-gauge catheter", "Refuse to administer the blood until a central line is placed"], "a": 0, "r": "While an 18- or 20-gauge IV is preferred for rapid blood administration to prevent hemolysis, a 22-gauge CAN be used if it is patent, though the infusion will be slower. Dextrose must NEVER be mixed with blood as it causes cellular clumping and hemolysis."}, {"d": 2, "q": "A patient with a history of COPD is prescribed an oral dose of a non-selective beta-blocker, Propranolol, for hypertension. Why should the nurse question this specific order?", "o": ["Propranolol blocks beta-2 receptors in the lungs, which can cause severe bronchospasm in COPD patients", "Propranolol causes profound tachycardia, worsening oxygen demand", "Propranolol interacts with bronchodilators, neutralizing their effects completely", "Propranolol causes sudden respiratory depression at the medullary level"], "a": 0, "r": "Non-selective beta-blockers (like Propranolol) block both Beta-1 (heart) and Beta-2 (lungs) receptors. Blocking Beta-2 receptors prevents bronchodilation, leading to dangerous bronchospasms in asthmatics and COPD patients. Cardioselective beta-blockers (Metoprolol) are preferred."}, {"d": 2, "q": "A patient receives a high dose of IV Furosemide. The nurse must push the medication slowly over 1 to 2 minutes. Pushing high-dose IV loop diuretics too rapidly places the patient at risk for which severe complication?", "o": ["Permanent sensorineural hearing loss (Ototoxicity)", "Rapid massive pulmonary edema", "Acute hypertensive crisis", "Sudden irreversible blindness"], "a": 0, "r": "High doses of loop diuretics (Furosemide, Bumetanide) administered too rapidly intravenously are notoriously ototoxic and can cause permanent tinnitus or hearing loss."}, {"d": 2, "q": "A patient with suspected hyperthyroidism has laboratory tests drawn. Which hormone profile definitively confirms primary hyperthyroidism?", "o": ["Low TSH, High T3, High T4", "High TSH, Low T3, Low T4", "High TSH, High T3, High T4", "Normal TSH, Low T3, High T4"], "a": 0, "r": "In primary hyperthyroidism (like Graves' disease), the thyroid gland overproduces T3 and T4. This high level of circulating hormones creates a negative feedback loop to the pituitary gland, which drastically lowers (suppresses) the production of TSH."}, {"d": 2, "q": "A patient is admitted with Acute Kidney Injury (AKI) and has a serum potassium level of 6.8 mEq/L. The physician orders a continuous infusion of regular insulin and 50% Dextrose. What is the physiological purpose of this specific intervention?", "o": ["To temporarily force potassium out of the bloodstream and back into the intracellular space", "To permanently excrete potassium through the gastrointestinal tract", "To stabilize the myocardial cell membrane to prevent fatal arrhythmias", "To bind with potassium in the blood and neutralize its electrical charge"], "a": 0, "r": "Insulin drastically increases the cellular uptake of glucose, and potassium follows glucose into the cell. This temporarily shifts potassium out of the blood serum, lowering the dangerous serum levels. Dextrose is given simultaneously to prevent fatal hypoglycemia."}, {"d": 2, "q": "A patient with a spinal cord injury at C6 is at risk for Autonomic Dysreflexia. Which of the following is the MOST common triggering stimulus for this life-threatening emergency?", "o": ["A distended bladder or impacted bowel", "Sudden changes in room temperature", "Rapid administration of IV fluids", "Deep suctioning of the airway"], "a": 0, "r": "Autonomic dysreflexia is an uncoordinated, massive sympathetic nervous system response in patients with spinal cord injuries at or above T6. It is almost always triggered by a sustained, noxious stimulus below the level of injury, most commonly a full/distended bladder, kinked Foley, or fecal impaction."}, {"d": 2, "q": "A patient receiving a continuous epidural infusion of Bupivacaine and Fentanyl complains of sudden, intense ringing in the ears (tinnitus), a metallic taste in the mouth, and numbness around the lips. What rare but fatal complication does the nurse suspect?", "o": ["Local Anesthetic Systemic Toxicity (LAST)", "Anaphylactic shock from Fentanyl", "Epidural hematoma", "Spinal headache"], "a": 0, "r": "Tinnitus, metallic taste, circumoral numbness, and extreme anxiety/agitation are the hallmark early signs of Local Anesthetic Systemic Toxicity (LAST). This occurs when the anesthetic inadvertently enters the bloodstream, rapidly progressing to seizures, coma, and cardiovascular collapse. Intralipid 20% emulsion is the antidote."}, {"d": 2, "q": "A patient has a chest tube placed for a right-sided pneumothorax. Upon assessment, the nurse finds the chest tube has completely accidentally disconnected from the drainage system, and the tubing is lying on the bed. What is the IMMEDIATE action?", "o": ["Submerge the end of the chest tube 1 to 2 inches into a bottle of sterile water or sterile normal saline", "Clamp the chest tube close to the patient's chest wall immediately", "Push the tube back into the chest wall", "Apply a dry sterile dressing over the end of the tube"], "a": 0, "r": "If the drainage system breaks or disconnects, the immediate priority is to re-establish a water seal to prevent atmospheric air from rushing into the pleural space and causing a tension pneumothorax. Submerging the distal end of the tube 1-2 inches in sterile water creates a temporary emergency water seal."}, {"d": 2, "q": "A patient presents to the ED with a traumatic amputation of the index finger. How should the nurse properly care for the amputated digit to maximize the chance of successful surgical replantation?", "o": ["Wrap the finger in saline-moistened sterile gauze, place it in a sealed plastic bag, and place the bag in a container of ice water", "Place the finger directly on a bed of dry ice to freeze the tissue instantly", "Submerge the finger directly into a cup of sterile normal saline", "Wrap the finger in dry gauze and keep it warm in a blanket"], "a": 0, "r": "The amputated part must be kept cool but NEVER frozen or allowed to come into direct contact with ice or water. It should be wrapped in gauze moistened with sterile saline, sealed in a watertight plastic bag, and then that bag should be placed into a secondary container of ice mixed with water."}, {"d": 2, "q": "A patient is admitted with a suspected deep vein thrombosis (DVT) in the left calf. The physician orders a D-dimer blood test. What does a negative (normal) D-dimer test indicate?", "o": ["It effectively rules out the presence of a DVT or pulmonary embolism", "It confirms the patient has a massive, stable DVT", "It indicates the patient requires an immediate Greenfield filter placement", "It shows the patient has a high risk for arterial bleeding"], "a": 0, "r": "D-dimer is a protein fragment produced when a blood clot dissolves in the body. While a highly elevated D-dimer is not specific (it can rise with infection, surgery, pregnancy), a totally negative (normal) D-dimer has a high negative predictive value and effectively rules out the presence of an acute DVT or PE."}, {"d": 2, "q": "A patient with a history of systemic lupus erythematosus (SLE) is prescribed Hydroxychloroquine. What routine screening MUST this patient undergo every 6-12 months while on this medication?", "o": ["Comprehensive ophthalmologic (eye) exams to check for retinal toxicity", "Audiograms to check for sensorineural hearing loss", "Echocardiograms to monitor for heart failure", "Bone marrow biopsies to check for aplastic anemia"], "a": 0, "r": "Hydroxychloroquine (Plaquenil) is an antimalarial drug widely used for SLE and Rheumatoid Arthritis. Its most severe adverse effect is irreversible retinal toxicity (maculopathy), leading to vision loss. Baseline and regular 6-12 month eye exams are absolutely mandatory."}, {"d": 2, "q": "A patient is recovering from a total knee arthroplasty (TKA). The surgeon prescribes a Continuous Passive Motion (CPM) machine. What is the primary clinical benefit of this device?", "o": ["It prevents the formation of dense scar tissue (adhesions) and maintains joint mobility", "It acts as a primary form of deep vein thrombosis (DVT) prophylaxis", "It strengthens the quadriceps muscle without active effort", "It applies continuous ice therapy directly to the surgical incision"], "a": 0, "r": "A CPM machine slowly and continuously moves the joint through a prescribed range of motion. Its primary purpose is to prevent joint stiffness, reduce the formation of dense scar tissue (adhesions), and improve early mobility."}, {"d": 2, "q": "A patient with advanced cirrhosis presents with severe ascites and a serum albumin level of 2.1 g/dL. What physiological mechanism primarily explains the development of the ascites?", "o": ["Decreased intravascular oncotic pressure due to severe hypoalbuminemia combined with portal hypertension", "Increased osmotic pressure inside the peritoneal cavity pulling water from the gut", "Direct leakage of stomach acid into the abdominal cavity", "Complete failure of the lymphatic system to drain the legs"], "a": 0, "r": "Albumin acts like a 'sponge,' creating colloid oncotic pressure that holds water inside the blood vessels. When the failing liver cannot synthesize albumin, oncotic pressure plummets. Combined with the high hydrostatic pressure of portal hypertension, fluid is pushed out of the vessels and into the peritoneal space (ascites)."}, {"d": 2, "q": "The nurse is monitoring a mechanically ventilated patient who is receiving total parenteral nutrition (TPN) at a high rate. The latest ABG shows an arterial PaCO2 of 55 mmHg. Why might the high-rate TPN be contributing to this hypercapnia?", "o": ["Metabolism of the high carbohydrate (dextrose) load in TPN produces large amounts of carbon dioxide", "TPN causes massive fluid shifts that flood the alveoli", "The lipids in TPN directly suppress the respiratory center in the brainstem", "TPN binds directly with hemoglobin, displacing oxygen and retaining CO2"], "a": 0, "r": "Carbohydrate metabolism has a high respiratory quotient, meaning it produces significantly more carbon dioxide as a byproduct than fat or protein metabolism. In critically ill patients on ventilators, a very high carbohydrate load from TPN can cause excessive CO2 production (hypercapnia), making weaning from the ventilator difficult."}, {"d": 2, "q": "A patient with suspected acute myocardial infarction is ordered a continuous IV infusion of Nitroglycerin. What specific hemodynamic parameter must the nurse assess most frequently while this drug is infusing?", "o": ["Blood pressure, due to the risk of severe hypotension", "Heart rate, due to the risk of severe bradycardia", "Respiratory rate, due to the risk of respiratory depression", "Urine output, due to the risk of acute kidney injury"], "a": 0, "r": "Nitroglycerin is a potent venous (and arterial) vasodilator. It significantly reduces preload and afterload, which decreases cardiac workload. However, this massive vasodilation places the patient at high risk for profound, life-threatening hypotension."}, {"d": 2, "q": "A patient has a 12-lead ECG that reveals Atrial Flutter. How would the nurse describe the classic appearance of this rhythm?", "o": ["Sawtooth-shaped flutter waves with a regular or variable ventricular response", "A completely chaotic, irregular baseline with no discernible P waves", "A progressively lengthening PR interval until a QRS complex is dropped", "Wide, bizarre QRS complexes occurring at a rate of 160 bpm"], "a": 0, "r": "Atrial flutter is characterized by rapid, regular atrial depolarizations at a rate of 250-350 bpm, creating a distinct 'sawtooth' or 'picket fence' pattern (F waves) on the ECG baseline between QRS complexes."}, {"d": 2, "q": "A patient presents to the ER with a severe, throbbing headache, blurred vision, and a blood pressure of 230/130 mmHg. The physician diagnoses a Hypertensive Emergency. Why must the blood pressure be lowered GRADUALLY rather than immediately to normal levels?", "o": ["To prevent cerebral, coronary, or renal ischemia caused by a sudden drop in perfusion pressure", "To allow the kidneys time to excrete the excess sodium causing the hypertension", "To prevent a sudden, massive rupture of the aorta", "To give the IV antihypertensive medication time to dissolve in the blood"], "a": 0, "r": "In a hypertensive emergency, the body's vascular beds have autoregulated to the high pressure. Dropping the pressure too rapidly (e.g., to 120/80 in minutes) causes severe hypoperfusion, leading to ischemic stroke, MI, or acute kidney injury. The goal is a gradual 20-25% reduction over the first hour."}, {"d": 2, "q": "A patient arrives in the ER following a blunt chest trauma from a motor vehicle collision. The nurse assesses the patient and observes Beck's Triad: distant, muffled heart sounds, severe jugular vein distension (JVD), and a blood pressure of 82/50 mmHg. What life-threatening complication is occurring?", "o": ["Cardiac Tamponade", "Tension Pneumothorax", "Massive Hemothorax", "Flail Chest"], "a": 0, "r": "Beck's Triad—muffled heart sounds, JVD, and hypotension—is the pathognomonic presentation of acute Cardiac Tamponade. Blood or fluid rapidly accumulates in the pericardial sac, compressing the heart chambers and preventing them from filling during diastole, causing cardiac output to plummet."}, {"d": 2, "q": "A patient with Acute Respiratory Failure is placed on a mechanical ventilator. The physician orders Positive End-Expiratory Pressure (PEEP) at 10 cm H2O. What is the primary physiological benefit of PEEP?", "o": ["It keeps the alveoli open at the end of expiration, improving gas exchange and preventing atelectasis", "It delivers a set tidal volume regardless of the patient's airway resistance", "It triggers the ventilator to deliver a breath if the patient becomes apneic", "It directly paralyzes the respiratory muscles to prevent fighting the ventilator"], "a": 0, "r": "PEEP maintains a small amount of positive pressure in the lungs at the end of exhalation. This splints the alveoli open, prevents them from collapsing (atelectasis), and recruits closed alveoli, significantly improving oxygenation."}, {"d": 2, "q": "A patient with a history of deep vein thrombosis is receiving a continuous IV Heparin infusion. The physician orders the line to be discontinued and the patient to be discharged on oral Warfarin. When should the nurse stop the IV Heparin?", "o": ["When the patient's INR reaches the therapeutic range of 2.0 to 3.0", "Immediately upon giving the first dose of Warfarin", "When the aPTT drops to a normal level of 30 seconds", "48 hours after the patient is completely pain-free"], "a": 0, "r": "Warfarin has a slow onset of action (3-5 days). Therefore, 'bridge therapy' is used: the rapid-acting IV Heparin is continued simultaneously with the oral Warfarin until the Warfarin takes full effect, which is confirmed when the INR reaches the therapeutic range of 2.0 to 3.0."}, {"d": 2, "q": "A patient with severe Crohn's Disease is experiencing a massive exacerbation with 15 bloody, liquid stools a day. The patient is placed on bowel rest and Total Parenteral Nutrition (TPN). Which central venous access device is most appropriate for long-term TPN administration?", "o": ["A Peripherally Inserted Central Catheter (PICC) or a Tunneled Central Catheter", "A standard 18-gauge peripheral IV in the forearm", "A midline catheter in the antecubital fossa", "A temporary, non-tunneled internal jugular central line"], "a": 0, "r": "TPN is highly hypertonic and must be administered into a large central vein with high blood flow to prevent severe phlebitis. Because the patient has Crohn's and will likely need TPN for weeks/months, a PICC line or tunneled catheter (e.g., Hickman) provides the safest long-term central access."}, {"d": 2, "q": "A patient presents with severe right upper quadrant (RUQ) abdominal pain, fever, and jaundice. What is this clinical triad called, and what biliary emergency does it indicate?", "o": ["Charcot's Triad; indicates Acute Cholangitis", "Murphy's Triad; indicates Acute Cholecystitis", "Beck's Triad; indicates Pancreatitis", "Cushing's Triad; indicates Biliary Rupture"], "a": 0, "r": "Charcot's Triad (RUQ pain, fever, and jaundice) is the classic presentation of Acute Cholangitis, a life-threatening bacterial infection of the biliary tract usually caused by an obstructing gallstone in the common bile duct."}, {"d": 2, "q": "A patient with liver cirrhosis develops massive esophageal varices. The physician orders a Sengstaken-Blakemore tube to be kept at the bedside. What is the purpose of this specific tube?", "o": ["To apply direct balloon tamponade (pressure) to bleeding esophageal varices to stop hemorrhage", "To suction excess gastric acid from the stomach to prevent ulceration", "To administer highly concentrated enteral nutrition directly into the duodenum", "To measure portal vein pressure continuously"], "a": 0, "r": "A Sengstaken-Blakemore (or Minnesota) tube has inflatable gastric and esophageal balloons. It is used in life-threatening emergencies to exert direct mechanical pressure (tamponade) against actively bleeding esophageal varices when endoscopy is not immediately available or fails."}, {"d": 2, "q": "A patient with a traumatic spinal cord injury at C7 is being discharged to an inpatient rehabilitation facility. The nurse is assessing the patient's functional potential. Which movement will this patient most likely retain?", "o": ["Gross arm movements, shoulder elevation, and some weak hand grasp", "Complete independent ambulation with a walker", "Full, normal fine motor control of the fingers", "No movement below the neck (complete tetraplegia)"], "a": 0, "r": "A patient with a C7 spinal cord injury retains innervation of the shoulders, biceps, and crucially, the triceps, allowing for elbow extension. They typically have some gross hand function but lack fine motor control. They can often independently transfer and push a manual wheelchair."}, {"d": 2, "q": "A patient with multiple sclerosis (MS) asks the nurse why their symptoms flare up in the summer or after a hot bath. What is the nurse's most accurate physiological explanation?", "o": ["Heat decreases the conduction of nerve impulses across demyelinated axons (Uhthoff's phenomenon)", "Heat causes systemic vasodilation, stealing blood away from the brain", "Heat directly triggers an autoimmune attack on the myelin sheath", "Heat causes the muscles to permanently atrophy and spasm"], "a": 0, "r": "Uhthoff's phenomenon is a classic characteristic of Multiple Sclerosis. Elevated body temperature (from fever, hot weather, exercise, or hot baths) further impairs the already compromised conduction of action potentials along demyelinated nerves, causing a temporary, pseudo-exacerbation of symptoms."}, {"d": 2, "q": "A patient with a suspected stroke is undergoing a neurological assessment. The patient can perfectly comprehend what the nurse is asking but can only respond with frustrated, slow, disjointed, one-word answers. What type of aphasia does this represent?", "o": ["Broca's Aphasia (Expressive)", "Wernicke's Aphasia (Receptive)", "Global Aphasia", "Amnesic Aphasia"], "a": 0, "r": "Broca's (Expressive) aphasia results from damage to the frontal lobe. The patient's comprehension is intact, but they have severe difficulty producing speech mechanically, resulting in slow, frustrating, non-fluent speech."}, {"d": 2, "q": "A patient is scheduled for an Electroencephalogram (EEG) to diagnose a seizure disorder. Which instruction should the nurse give the patient to prepare for the test?", "o": ["Wash your hair the night before but do not apply any oils, gels, or hairspray", "You must fast completely for 12 hours before the procedure", "You will be placed under deep general anesthesia for the test", "Take an extra dose of your anti-seizure medication on the morning of the test"], "a": 0, "r": "An EEG measures electrical brain activity via electrodes attached to the scalp. The scalp must be clean and free of oils, gels, or sprays for the electrodes to stick and conduct properly. Fasting is avoided (hypoglycemia can alter brain waves), and anti-seizure meds are usually held to allow the abnormal waves to be seen."}, {"d": 2, "q": "A patient with a severe exacerbation of ulcerative colitis is prescribed high-dose IV corticosteroids. Which common, immediate side effect should the nurse heavily monitor for while the patient is on this medication?", "o": ["Severe hyperglycemia and increased susceptibility to infection", "Profound hypoglycemia and extreme weight loss", "Bradycardia and hypotension", "Permanent darkening of the skin"], "a": 0, "r": "High-dose corticosteroids strongly promote gluconeogenesis and insulin resistance, leading to rapid, significant hyperglycemia (even in non-diabetics). They also heavily suppress the immune system, masking signs of infection."}, {"d": 2, "q": "A patient with chronic kidney disease (CKD) complains of severe, relentless itching across their entire body. The skin is intact but excoriated from scratching. What is the primary cause of this uremic pruritus?", "o": ["The accumulation of urea and calcium-phosphate crystals in the skin", "A severe allergic reaction to their blood pressure medication", "A sudden decrease in red blood cell production (anemia)", "Excessive production of bile salts by the failing kidneys"], "a": 0, "r": "In severe CKD/ESRD, the failing kidneys cannot excrete waste. Urea accumulates in the blood and is excreted through the sweat glands ('uremic frost'). Furthermore, hyperphosphatemia leads to calcium-phosphate crystal deposition in the skin. Both cause intense, intractable pruritus."}, {"d": 2, "q": "A patient is admitted with Acute Pancreatitis. The physician orders the patient to be strictly Nil Per Os (NPO). What is the primary therapeutic rationale for this order?", "o": ["To completely suppress pancreatic enzyme secretion and allow the pancreas to rest", "To prevent the patient from vomiting and tearing the esophagus", "To prepare the patient for immediate emergency surgery", "To allow the stomach to shrink and reduce pressure on the diaphragm"], "a": 0, "r": "The presence of food or fluid in the stomach and duodenum triggers the release of secretin and cholecystokinin, which heavily stimulate the pancreas to secrete digestive enzymes. In pancreatitis, these enzymes are autodigesting the organ. Keeping the patient strictly NPO 'turns off' the pancreas to halt the autodigestion."}, {"d": 2, "q": "A patient is admitted with a severe exacerbation of asthma. The arterial blood gas (ABG) initially showed Respiratory Alkalosis. Two hours later, a repeat ABG shows a normal pH and a normal PaCO2. The patient appears exhausted and wheezing has diminished. How should the nurse interpret these findings?", "o": ["This is an ominous sign of impending respiratory failure; the patient can no longer maintain the work of breathing", "The patient is improving and the asthma attack is resolving", "The patient has developed a compensatory metabolic acidosis", "The bronchodilator therapy has been completely effective"], "a": 0, "r": "During an asthma attack, the patient hyperventilates, causing low CO2 (Respiratory Alkalosis). If the PaCO2 normalizes or rises (pseudonormalization) while the patient is still in distress, it is an ominous sign that the respiratory muscles are exhausted and the patient is moving into fatal respiratory failure."}, {"d": 2, "q": "A patient with a traumatic chest injury is diagnosed with a Flail Chest. What is the hallmark clinical manifestation the nurse will observe during respiration?", "o": ["Paradoxical chest wall movement (inward on inspiration, outward on expiration)", "Tracheal deviation toward the unaffected side", "Bilateral, symmetrical hyperinflation of the chest", "A loud, continuous friction rub over the sternum"], "a": 0, "r": "Flail chest occurs when multiple ribs are fractured in two or more places, creating a free-floating segment of the chest wall. This segment moves paradoxically—it gets sucked inward during inspiration (negative pressure) and bulges outward during expiration (positive pressure)."}, {"d": 2, "q": "A patient with suspected Pulmonary Embolism is prescribed continuous IV Heparin. The patient asks the nurse, 'Will this medication dissolve the blood clot in my lung?' What is the most accurate response?", "o": ["'No, Heparin prevents the clot from getting bigger and stops new clots from forming while your body dissolves the current clot over time.'", "'Yes, Heparin is a strong 'clot buster' that will immediately break apart the clot.'", "'No, Heparin only manages your pain and dilates your blood vessels.'", "'Yes, but it will take several weeks of continuous infusion to fully dissolve it.'"], "a": 0, "r": "Anticoagulants like Heparin and Warfarin do NOT dissolve existing clots (only thrombolytics like tPA do that). They prevent the extension of the current clot and the formation of new clots, allowing the body's natural fibrinolytic system to slowly break down the existing clot over time."}, {"d": 2, "q": "A patient with end-stage renal disease misses two consecutive hemodialysis appointments. The patient arrives at the ED with severe shortness of breath, a heart rate of 115 bpm, and generalized edema. Which finding would the nurse prioritize identifying on the ECG?", "o": ["Tall, peaked T waves and widened QRS complexes indicating severe hyperkalemia", "ST-segment elevation in leads V1-V4 indicating a myocardial infarction", "A prolonged QT interval indicating severe hypocalcemia", "Atrial fibrillation indicating fluid overload in the atria"], "a": 0, "r": "Missing hemodialysis leads to a rapid, fatal accumulation of potassium (hyperkalemia). The hallmark, life-threatening ECG changes of severe hyperkalemia are tall, 'tent-like' peaked T waves, loss of P waves, and a widened QRS complex, which quickly degenerates into ventricular fibrillation."}, {"d": 2, "q": "A patient receiving a blood transfusion complains of a severe, sudden headache, and the nurse notes the patient's face is flushed. Blood pressure is 190/110 mmHg, and neck veins are distended. Which complication does this most likely represent?", "o": ["Transfusion-Associated Circulatory Overload (TACO)", "Febrile Non-Hemolytic Transfusion Reaction", "Acute Hemolytic Transfusion Reaction", "Transfusion-Related Acute Lung Injury (TRALI)"], "a": 0, "r": "Severe headache, facial flushing, severe hypertension, and JVD are signs of massive volume overload (TACO) due to the rapid infusion of blood products, particularly in patients with compromised cardiovascular reserve (e.g., elderly, heart failure patients)."}, {"d": 2, "q": "A patient with acute decompensated heart failure is prescribed a continuous IV infusion of Dobutamine. By what primary mechanism does Dobutamine improve the patient's hemodynamic status?", "o": ["It strongly stimulates beta-1 receptors, causing a powerful positive inotropic effect (increased myocardial contractility)", "It blocks alpha-1 receptors, causing massive systemic vasodilation to reduce afterload", "It acts as a potent loop diuretic, rapidly clearing fluid from the lungs", "It slows the heart rate significantly to increase ventricular filling time"], "a": 0, "r": "Dobutamine is a synthetic catecholamine and a strong, selective Beta-1 agonist. Its primary action is positive inotropy—it dramatically increases the force of myocardial contraction (stroke volume and cardiac output) without significantly increasing heart rate, making it ideal for cardiogenic shock or severe HF."}, {"d": 2, "q": "A patient is admitted to the ICU with Diabetic Ketoacidosis (DKA). The initial serum potassium level is 4.5 mEq/L. The physician orders a continuous IV infusion of regular insulin. Two hours later, the patient's potassium level is 3.1 mEq/L. What physiological mechanism explains this drop?", "o": ["Intravenous insulin drives potassium from the extracellular fluid (blood) directly into the intracellular space", "The insulin directly bound the potassium and excreted it through the kidneys", "The massive diuresis from DKA washed all the potassium out of the body", "The acidosis was corrected, which destroys potassium molecules"], "a": 0, "r": "Insulin therapy lowers blood glucose by facilitating its entry into cells. However, insulin also directly stimulates the Na+/K+ ATPase pump, actively driving potassium OUT of the blood serum and INTO the cells. This can rapidly cause life-threatening hypokalemia during DKA treatment, requiring careful K+ replacement."}, {"d": 2, "q": "A patient with a traumatic spinal cord injury at T2 develops Autonomic Dysreflexia. The nurse quickly sits the patient upright and checks the Foley catheter, finding no kinks. The patient's blood pressure remains 210/120 mmHg. What is the nurse's next PRIORITY action?", "o": ["Assess the patient for a fecal impaction (perform a digital rectal exam with anesthetic ointment)", "Lay the patient flat immediately to prevent fainting", "Administer a massive IV fluid bolus to dilute the blood pressure", "Apply physical restraints to keep the patient from thrashing"], "a": 0, "r": "If the bladder (the most common trigger for Autonomic Dysreflexia) is ruled out as the noxious stimulus, the nurse must immediately check the second most common trigger: the bowel. Fecal impaction triggers the massive sympathetic reflex. Anesthetic ointment is used before the exam to prevent worsening the stimulus."}, {"d": 2, "q": "A patient is admitted with a massive gastrointestinal hemorrhage. The patient is pale, diaphoretic, and confused. Vital signs: BP 70/40 mmHg, HR 135 bpm, RR 28. Which type of shock is this patient experiencing?", "o": ["Hypovolemic Shock", "Cardiogenic Shock", "Distributive (Septic) Shock", "Obstructive Shock"], "a": 0, "r": "Hypovolemic shock results from a massive loss of absolute circulating volume (blood or fluids). The classic signs are severe hypotension, profound tachycardia (compensatory), tachypnea, pale/cool/clammy skin, and altered mental status due to poor brain perfusion."}, {"d": 2, "q": "A patient with a central venous catheter (CVC) suddenly gasps for air, clutches their chest, and becomes deeply cyanotic. The nurse suspects an air embolism. In addition to calling for immediate help and administering 100% oxygen, what specific position must the nurse place the patient in?", "o": ["Left lateral decubitus in the Trendelenburg position (head down)", "Right lateral decubitus in the Reverse Trendelenburg position (head up)", "Supine with the head of the bed elevated 90 degrees", "Prone position with the arms extended"], "a": 0, "r": "For a suspected air embolism (e.g., from an open CVC), placing the patient on their LEFT side with their head DOWN (Trendelenburg) traps the buoyant air bubble in the apex of the right ventricle, preventing it from being pumped forward into the pulmonary artery and causing a fatal pulmonary air embolism."}, {"d": 2, "q": "A patient undergoes a subtotal thyroidectomy. 24 hours later, the nurse assesses the patient and hears a harsh, high-pitched, 'crowing' sound during inspiration. The patient appears extremely anxious. What is the nurse's immediate priority?", "o": ["Call the rapid response team; prepare for immediate emergency intubation or tracheostomy", "Administer a PRN dose of IV Calcium Gluconate", "Suction the patient's mouth and throat vigorously", "Have the patient drink a glass of ice water to reduce swelling"], "a": 0, "r": "The harsh, high-pitched sound is stridor, indicating acute, critical upper airway obstruction (from severe glottic edema, hematoma, or bilateral vocal cord paralysis post-thyroidectomy). This is a massive life-threatening emergency requiring immediate securing of the airway."}, {"d": 2, "q": "A patient is admitted with severe liver cirrhosis and portal hypertension. The physician prescribes Spironolactone. What is the specific pharmacological rationale for using this particular diuretic in cirrhosis?", "o": ["It blocks aldosterone, combating the severe secondary hyperaldosteronism that drives ascites, while sparing potassium", "It directly increases the synthesis of albumin by the failing liver", "It completely paralyzes the bowel to prevent ammonia absorption", "It rapidly dilates the portal vein to relieve hypertension"], "a": 0, "r": "Cirrhosis leads to severe ascites driven heavily by secondary hyperaldosteronism (the failing liver cannot degrade aldosterone, leading to massive sodium/water retention). Spironolactone is an aldosterone antagonist and potassium-sparing diuretic, making it the first-line, specific medical treatment for cirrhotic ascites."}, {"d": 2, "q": "A patient with Chronic Obstructive Pulmonary Disease (COPD) has an Arterial Blood Gas (ABG) drawn. The results are: pH 7.31, PaCO2 58 mmHg, HCO3 29 mEq/L. How should the nurse interpret this ABG?", "o": ["Partially Compensated Respiratory Acidosis", "Fully Compensated Respiratory Acidosis", "Uncompensated Metabolic Alkalosis", "Partially Compensated Metabolic Acidosis"], "a": 0, "r": "The pH is acidic (< 7.35). The PaCO2 is high (> 45), identifying it as Respiratory Acidosis (expected in COPD due to CO2 trapping). The HCO3 is high (> 26), indicating the kidneys are trying to compensate by retaining base, but because the pH is still abnormal, the compensation is only partial."}, {"d": 2, "q": "A patient is receiving packed red blood cells (PRBCs). Forty-five minutes into the infusion, the patient complains of a severe headache, bounding pulse, and shortness of breath. The nurse auscultates crackles in the bilateral lung bases. Blood pressure is 180/100. What complication is occurring?", "o": ["Transfusion-Associated Circulatory Overload (TACO)", "Acute Hemolytic Transfusion Reaction", "Transfusion-Related Acute Lung Injury (TRALI)", "Severe Allergic (Anaphylactic) Reaction"], "a": 0, "r": "TACO is a hydrostatic fluid overload caused by infusing blood too rapidly, especially in older patients or those with heart failure. It presents with signs of acute pulmonary edema (crackles, dyspnea) and volume overload (bounding pulse, severe hypertension, JVD). Treatment involves stopping the infusion, oxygen, and diuretics."}, {"d": 2, "q": "A patient with suspected bacterial meningitis has a lumbar puncture performed. The cerebrospinal fluid (CSF) analysis reveals: cloudy appearance, drastically decreased glucose, drastically elevated protein, and a high WBC count (neutrophils). How should the nurse interpret these findings?", "o": ["These findings strongly confirm bacterial meningitis", "These findings strongly confirm viral (aseptic) meningitis", "These findings are entirely normal for adult CSF", "These findings confirm a massive subarachnoid hemorrhage"], "a": 0, "r": "Classic bacterial meningitis CSF profile: Cloudy/purulent fluid,
