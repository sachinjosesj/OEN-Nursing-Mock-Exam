 {"d": 6, "q": "A resident with dementia becomes distressed when moved to a new room. The best approach is:", "o": ["Provide familiar items and consistent staff and a calm routine", "Move often", "Restrain", "Ignore"], "a": 0, "r": "Familiarity reduces distress."}, {"d": 6, "q": "Which nursing action BEST promotes continence in older adults?", "o": ["Regular toileting schedule and easy access to toilet", "Catheter for all", "Restrict fluids", "Diapers only"], "a": 0, "r": "Prompted voiding and accessibility."}, {"d": 6, "q": "A palliative patient has severe pain. The most appropriate analgesic approach is:", "o": ["Regular scheduled opioid with breakthrough doses as prescribed", "As needed only", "Avoid opioids", "Only paracetamol"], "a": 0, "r": "Regular dosing controls pain."}, {"d": 6, "q": "The nurse caring for a dying patient should:", "o": ["Provide comfort, involve family, respect cultural and religious wishes", "Avoid family", "Withdraw care", "Restrict visits"], "a": 0, "r": "End-of-life care focuses on dignity."}, {"d": 6, "q": "Which sign suggests that death is approaching?", "o": ["Mottled skin and irregular breathing (Cheyne–Stokes)", "Increased appetite", "Bright alertness", "Higher BP"], "a": 0, "r": "Terminal changes include altered breathing and mottling."}, {"d": 6, "q": "Cultural care for a Muslim patient at end of life generally includes:", "o": ["Respecting prayers, privacy and gender-sensitive care and facing Qibla if desired", "Ignoring religion", "Removing family", "Refusing prayer"], "a": 0, "r": "Ask the patient and family about their needs."}, {"d": 6, "q": "A patient fasting during Ramadan has diabetes. The nurse should advise:", "o": ["Consult the healthcare team for medication adjustment and monitor for hypoglycaemia", "Stop all medicines", "Take double doses", "Ignore symptoms"], "a": 0, "r": "Safe fasting requires individualised planning."}, {"d": 6, "q": "A community nurse visits a family with a child with scabies. The family asks about spread. The nurse explains:", "o": ["Treat all household contacts at the same time and wash bedding at high temperature", "Treat the child only", "No need to wash", "Use only creams on the face"], "a": 0, "r": "Simultaneous treatment prevents re-infestation."}, {"d": 6, "q": "Which action BEST prevents spread of dengue in a community?", "o": ["Remove standing water and use mosquito protection", "Antibiotics", "Isolation only", "Vaccination only"], "a": 0, "r": "Vector control."}, {"d": 6, "q": "Which is a method of preventing diarrhoeal disease in communities?", "o": ["Safe water, sanitation and hand washing", "Antibiotics for all", "Fasting", "Tablet only"], "a": 0, "r": "WASH interventions."}, {"d": 6, "q": "A community health nurse screens for hypertension. A reading of 160/100 mmHg should result in:", "o": ["Referral for evaluation and follow-up", "No action", "Re-check next year", "Increase salt"], "a": 0, "r": "Confirm on repeated readings and refer."}, {"d": 6, "q": "Health literacy means:", "o": ["Ability to find, understand and use health information", "Reading speed", "Hospital knowledge", "Drug names"], "a": 0, "r": "Adapt teaching to literacy."}, {"d": 6, "q": "When teaching a group with low literacy, the nurse should:", "o": ["Use simple words, pictures and demonstration", "Use technical terms", "Give long leaflets", "Avoid questions"], "a": 0, "r": "Use teach-back."}, {"d": 6, "q": "Which strategy is MOST effective for smoking cessation?", "o": ["Behavioural support plus pharmacotherapy", "Warnings only", "Cutting down only", "Hypnosis only"], "a": 0, "r": "Combined approach improves quit rates."}, {"d": 6, "q": "Which is a primary prevention activity?", "o": ["School-based vaccination", "Cancer screening", "Rehabilitation", "Palliative care"], "a": 0, "r": "Prevents disease onset."}, {"d": 6, "q": "Which is a feature of a good screening test?", "o": ["High sensitivity and acceptable to population", "Expensive", "Very slow", "Painful"], "a": 0, "r": "Screening should be effective, safe and acceptable."}, {"d": 6, "q": "A school nurse notices several children with sore throat, fever and rash after one case. This suggests:", "o": ["Possible outbreak needing notification to public health", "Normal flu", "Allergy", "Stress"], "a": 0, "r": "Report notifiable disease per policy."}, {"d": 6, "q": "Notifiable diseases must be:", "o": ["Reported to health authorities", "Kept private", "Ignored", "Treated at home only"], "a": 0, "r": "Mandatory reporting supports control."}, {"d": 6, "q": "Which is a social determinant of health?", "o": ["Income and education", "Blood type", "Hair colour", "Height"], "a": 0, "r": "Social conditions shape health."}, {"d": 6, "q": "A migrant worker has limited access to care. The nurse should:", "o": ["Advocate for access, use interpreters and provide culturally sensitive care", "Refuse care", "Wait", "Ignore"], "a": 0, "r": "Equity in care."}, {"d": 6, "q": "Occupational health nurses reduce injury risk by:", "o": ["Hazard assessment, education and PPE use", "Blaming workers", "Ignoring ergonomics", "Avoiding reports"], "a": 0, "r": "Prevention is key."}, {"d": 6, "q": "The national immunisation programme measures coverage. Coverage of 95% for measles is important because:", "o": ["It is needed to achieve herd immunity", "It is arbitrary", "It reduces cost only", "It is mandatory for schools only"], "a": 0, "r": "Highly infectious diseases need about 95% coverage."}, {"d": 6, "q": "A vaccine vial multi-dose has been opened, and the clinic uses it the next day. The nurse should:", "o": ["Follow manufacturer and national policy on open-vial use and discard if beyond limits", "Use anyway", "Freeze", "Add water"], "a": 0, "r": "Observe open vial policies."}, {"d": 6, "q": "Which is a contraindication to a live vaccine?", "o": ["Severe immunosuppression", "Mild cold", "Low-grade fever", "Previous mild reaction to nothing"], "a": 0, "r": "Live vaccines may cause disease in immunocompromised." in hot climates."}, {"d": 6, "q": "Which is the first aid for heat exhaustion?", "o": ["Move to a cool place, loosen clothing and give fluids", "Ice injection", "Ignore", "Give hot tea"], "a": 0, "r": "Cool and rehydrate."}, {"d": 6, "q": "Road traffic injuries are a leading cause of death in young people. The most effective prevention is:", "o": ["Seat belts, helmets and speed control", "Antibiotics", "Vitamin A", "Nutrition"], "a": 0, "r": "Public health injury prevention."}, {"d": 6, "q": "A nurse running antenatal classes should include:", "o": ["Birth preparation, danger signs, breastfeeding and newborn care", "Only exercise", "Only diet", "Only legal topics"], "a": 0, "r": "Comprehensive education."}, {"d": 6, "q": "Which of the following is an example of health promotion?", "o": ["Community campaign to reduce salt intake", "Dialysis", "Surgery", "Chemotherapy"], "a": 0, "r": "Promotes healthy behaviours."}, {"d": 6, "q": "School vision screening is an example of:", "o": ["Secondary prevention", "Primary prevention", "Tertiary prevention", "Palliation"], "a": 0, "r": "Early detection of problems."}, {"d": 6, "q": "A nurse making a home visit finds a patient with a large infected leg ulcer and diabetes. The best action is:", "o": ["Assess, dress the wound and arrange urgent medical review", "Ignore", "Delay", "Apply home remedy"], "a": 0, "r": "Diabetic foot infection is serious."}, {"d": 6, "q": "A family caring for a bed-bound relative shows signs of exhaustion. The nurse should:", "o": ["Assess caregiver strain and arrange support and respite", "Blame", "Ignore", "Admit patient permanently without discussion"], "a": 0, "r": "Support caregivers."}, {"d": 6, "q": "Which is a core principle of infection prevention at home care?", "o": ["Hand hygiene and safe waste disposal", "Using bleach on skin", "Reusing syringes", "Sharing towels"], "a": 0, "r": "Basic IPC is essential."}, {"d": 6, "q": "Which is the BEST evidence that a health education session was effective?", "o": ["Observed change in behaviour or knowledge via teach-back", "Attendance only", "Pamphlets given", "Nurse satisfaction"], "a": 0, "r": "Evaluate outcomes."}, {"d": 6, "q": "The 'Health for All' concept is based on:", "o": ["Primary health care and equity", "Hospital care only", "Private care", "Specialist care only"], "a": 0, "r": "Alma-Ata."}];
const PER_SET=100, MIN_PER_Q=1.5, DEFAULT_PASS=60;
const LS='omsb-nursing-v1';
const $=s=>document.querySelector(s);
const app=$('#app');
let S={view:'home',cfg:{pick:'set0',mode:'exam'}};
let timer=null;

function hist(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function saveHist(r){try{const h=hist();h.unshift(r);localStorage.setItem(LS,JSON.stringify(h.slice(0,30)))}catch(e){}}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Sets: 6 fixed sets, 5 questions from each of the 10 domains.
const byDom=DOMAINS.map((_,d)=>BANK.map((q,i)=>({...q,id:i})).filter(q=>q.d===d));
const QUOTA=[20,5,30,10,10,10,15]; // OEN blueprint per 100 questions
const SETS=[0,1,2,3,4,5].map(s=>byDom.flatMap((list,d)=>list.slice(s*QUOTA[d],s*QUOTA[d]+QUOTA[d])));
function weighted(seed){const r=seed?rng(seed):Math.random;return byDom.flatMap((list,d)=>shuffle(list,r).slice(0,QUOTA[d]));}
const PICKS=[
  ...SETS.map((q,i)=>({id:'set'+i,name:'Set '+(i+1),sub:q.length+' questions, weighted'})),
  {id:'rand',name:'Random 100',sub:'New weighted mix each time'},
  {id:'full',name:'Full bank',sub:BANK.length+' questions, long session'},
  ...DOMAINS.map((n,d)=>({id:'dom'+d,name:n,sub:byDom[d].length+' questions, one domain'}))
];
function questionsFor(id){
  if(id.startsWith('set'))return SETS[+id.slice(3)];
  if(id==='rand')return weighted();
  if(id==='full')return BANK.map((q,i)=>({...q,id:i}));
  return byDom[+id.slice(3)];
}

function startExam(){
  const base=questionsFor(S.cfg.pick);
  const seed=Date.now();const r=rng(seed);
  const qs=shuffle(base,r).map(q=>{
    const noShuf=q.o.some(t=>/^(both|all of|none of)/i.test(t));
    const order=noShuf?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i),r);
    return{...q,opts:order.map(i=>q.o[i]),key:order.indexOf(q.a)};
  });
  const secs=Math.round(qs.length*MIN_PER_Q*60);
  S={view:'intro',cfg:S.cfg,qs,ans:Array(qs.length).fill(null),flag:Array(qs.length).fill(false),i:0,left:secs,total:secs,
     mode:S.cfg.mode,stage:'q',popup:false,notes:Array(qs.length).fill(''),notesOpen:false,showTime:true,rf:'all',t0:Date.now(),title:PICKS.find(p=>p.id===S.cfg.pick).name};
  clearInterval(timer);
  render();
}
function tick(){S.left--;if(S.left<=0){S.left=0;finish();return}const t=$('#timer');if(t){t.textContent=fmt(S.left);t.classList.toggle('low',S.left<300)}}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}

function finish(){
  clearInterval(timer);
  const n=S.qs.length;let c=0;const dm=DOMAINS.map(()=>({c:0,n:0}));
  S.qs.forEach((q,i)=>{dm[q.d].n++;if(S.ans[i]===q.key){c++;dm[q.d].c++}});
  const pct=Math.round(c/n*1000)/10;
  const used=Math.round((Date.now()-S.t0)/1000);
  saveHist({t:Date.now(),name:S.title,mode:S.mode,c,n,pct,used});
  S={...S,view:'result',c,n,pct,dm,used,passMark:DEFAULT_PASS,filter:'all'};
  render();window.scrollTo(0,0);
}

function pick(i){
  if(S.mode==='practice'&&S.ans[S.i]!==null){return}
  S.ans[S.i]=i;render();
}

function home(){
  const h=hist();
  app.innerHTML=`<div class="stack">
  <div class="top"><div class="stack" style="gap:4px"><h1>OEN Nursing Mock Exam</h1>
  <p class="muted">Practice for the Omani Examination for Nurses (OEN): 100 single-best-answer scenario questions in 2 hours 30 minutes, weighted by the published blueprint.</p></div></div>

      <button id="m-exam" aria-pressed="${S.cfg.mode==='exam'}">Exam mode</button><button id="m-prac" aria-pressed="${S.cfg.mode==='practice'}">Practice mode</button></div></div>
    <p class="small muted">${S.cfg.mode==='exam'?'Timed like the real test: 100 questions in 2 hours 30 minutes. No answers shown until you finish.':'Untimed. The correct answer and rationale appear as soon as you choose. Use this for learning.'}</p>
    <div class="row startrow"><button class="btn primary" id="go">Begin exam</button><span class="muted small" id="sum"></span></div></div>

  ${h.length?`<div class="panel stack"><h3>Your recent attempts</h3><div class="scroll"><table><thead><tr><th>Date</th><th>Paper</th><th>Mode</th><th>Score</th></tr></thead><tbody>${h.slice(0,8).map(x=>`<tr><td>${new Date(x.t).toLocaleDateString()}</td><td>${x.name}</td><td>${x.mode}</td><td>${x.c}/${x.n} (${x.pct}%)</td></tr>`).join('')}</tbody></table></div></div>`:''}
  </div>`;
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.cfg.pick=b.dataset.pick;home()});
  $('#m-exam').onclick=()=>{S.cfg.mode='exam';home()};$('#m-prac').onclick=()=>{S.cfg.mode='practice';home()};

}
function pcard(p){return`<button class="card" data-pick="${p.id}" aria-pressed="${S.cfg.pick===p.id}"><b>${p.name}</b><span>${p.sub}</span></button>`}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function beginExam(){
  S.view='exam';S.stage='q';S.t0=Date.now();clearInterval(timer);
  if(S.mode==='exam')timer=setInterval(tick,1000);
  render();window.scrollTo(0,0);
}
function intro(){
  const n=S.qs.length,exam=S.mode==='exam';

function head(q){
  const exam=S.mode==='exam';
  return`<div class="bar"><div class="meta">${esc(S.title)}</div>
    <div class="row" style="gap:14px">${exam?`<span class="clock"><button class="ico" id="tt" aria-label="Show or hide time remaining" title="Show or hide time">&#9719;</button><span class="meta">Time remaining</span> <span class="t" id="timer" ${S.showTime?'':'hidden'}>${fmt(S.left)}</span></span>`:'<span class="meta">Practice mode</span>'}

    ${S.stage!=='end'?'<button class="ico endbtn" id="endnow">End Exam</button>':''}</div></div>`;
}
function exam(){
  if(S.stage==='review')return reviewScreen();
  if(S.stage==='end')return endScreen();
  const q=S.qs[S.i],a=S.ans[S.i],prac=S.mode==='practice',shown=prac&&a!==null,L='ABCD';
  app.innerHTML=`<div class="vue">${head(true)}
  <div class="subbar"><span class="muted small">${prac?DOMAINS[q.d]:'Select the best answer.'}</span>
    <button class="btn flagbtn" id="flag" aria-pressed="${S.flag[S.i]}">${S.flag[S.i]?'&#9873; Flagged for review':'&#9873; Flag for Review'}</button></div>
  <div class="qpane"><div class="qtext">${esc(q.q)}</div>
    <div class="opts" role="radiogroup">${q.opts.map((t,i)=>{
      let c='opt';if(shown){if(i===q.key)c+=' ok';else if(i===a)c+=' no'}else if(i===a)c+=' sel';
      return`<button class="${c}" role="radio" aria-checked="${i===a}" data-i="${i}"><span class="k"></span><span><b>${L[i]}.</b> ${esc(t)}</span></button>`}).join('')}</div>
    ${shown?`<div class="fb ${a===q.key?'':'no'}"><b>${a===q.key?'Correct.':'Incorrect. Answer: '+L[q.key]+'.'}</b> ${esc(q.r)}</div>`:''}
  </div>
  ${S.notesOpen?`<div class="notes"><label for="nt">Notes for question ${S.i+1} (cleared when the exam ends)</label><textarea id="nt" rows="4">${esc(S.notes[S.i]||'')}</textarea></div>`:''}
  ${S.popup?popup():''}
  <div class="nav"><div class="row"><button class="btn" id="rv">&#9776; Review</button><button class="btn" id="nb" aria-pressed="${S.notesOpen}">&#9998; Notes${S.notes[S.i]?' •':''}</button></div>
    <div class="row"><button class="btn" id="prev" ${S.i===0?'disabled':''}>&#9664; Previous</button><button class="btn primary" id="next">${S.i<S.qs.length-1?'Next &#9654;':'Next &#9654;'}</button></div></div>
  </div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('#prev').onclick=()=>go(S.i-1);

  $('#rv').onclick=()=>{S.popup=!S.popup;render()};
  $('#nb').onclick=()=>{S.notesOpen=!S.notesOpen;render()};
  const nt=$('#nt');if(nt){nt.oninput=()=>{S.notes[S.i]=nt.value};}
  const tt=$('#tt');if(tt)tt.onclick=()=>{S.showTime=!S.showTime;$('#timer').hidden=!S.showTime};

}
function bindEnd(){const e=$('#endnow');if(e)e.onclick=()=>{S.from=S.stage;S.popup=false;S.stage='end';render();window.scrollTo(0,0)}}
function popup(){
  return`<div class="modal" role="dialog" aria-label="Review"><div class="modalbox"><div class="top"><h2>Review</h2><button class="btn" id="pc">Close</button></div>
  <div class="scroll"><table><thead><tr><th>Question</th><th>Status</th><th>Flagged</th><th>Notes</th></tr></thead><tbody>${S.qs.map((q,i)=>`<tr class="clk ${i===S.i?'cur':''}" data-g="${i}"><td><a href="#" data-g="${i}">${i+1}</a></td><td>${S.ans[i]!==null?'Answered':'<b>Incomplete</b>'}</td><td>${S.flag[i]?'&#9873;':''}</td><td>${S.notes[i]?'&#9998;':''}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

  const pc=$('#pc');if(pc)pc.onclick=()=>{S.popup=false;render()};

function reviewScreen(){

  const rows=S.qs.map((q,i)=>i).filter(i=>S.rf==='all'||(S.rf==='inc'&&S.ans[i]===null)||(S.rf==='flag'&&S.flag[i]));

  <div class="qpane stack"><h2>Review Screen</h2>

  bindEnd();$('#back').onclick=()=>go(S.i);$('#endrev').onclick=()=>{S.from='review';S.stage='end';render()};

  const un=S.ans.filter(x=>x===null).length;

  <div class="qpane stack"><h2>End Exam</h2>
   <div class="confirm"><span><b>Once you click End Exam you cannot go back and review or change your responses.</b>${un?` You have ${un} unanswered question${un>1?'s':''}, which will score zero.`:''}</span></div>

function go(i){S.i=Math.max(0,Math.min(S.qs.length-1,i));S.stage="q";S.popup=false;render();window.scrollTo(0,0)}

function result(){
  const pass=S.pct>=S.passMark,L='ABCD';
  const list=S.qs.map((q,i)=>({q,i,a:S.ans[i]})).filter(x=>S.filter==='all'||(S.filter==='wrong'&&x.a!==x.q.key)||(S.filter==='flag'&&S.flag[x.i]));
  app.innerHTML=`<div class="stack">
  <div class="panel stack"><h3>${esc(S.title)} · results</h3>
    <div class="row" style="gap:20px"><div class="score">${S.pct}%</div><div class="stack" style="gap:6px"><span class="pill ${pass?'pass':'fail'}">${pass?'Above':'Below'} the ${S.passMark}% mark</span>
    <span class="muted">${S.c} of ${S.n} correct · time used ${fmt(S.used)}</span></div></div>
    <div class="row"><label for="pm">Pass mark %</label><input id="pm" type="number" min="1" max="100" value="${S.passMark}"></div></div>
  <div class="panel stack"><h3>By domain</h3>${S.dm.map((d,i)=>d.n?`<div class="dom"><span>${DOMAINS[i]}</span><div class="track"><div class="fill ${d.c/d.n<.6?'lo':''}" style="width:${d.c/d.n*100}%"></div></div><span class="v">${d.c}/${d.n}</span></div>`:'').join('')}
    <p class="small muted">Red bars are below 60%. Spend your next study block on those domains.</p></div>
  <div class="panel stack"><div class="top"><h2>Answer review</h2><div class="seg" role="group" aria-label="Filter">
    ${[['all','All'],['wrong','Wrong or blank'],['flag','Flagged']].map(([k,t])=>`<button data-f="${k}" aria-pressed="${S.filter===k}">${t}</button>`).join('')}</div></div>
    ${list.length?list.map(({q,i,a})=>`<div class="rev"><div class="small muted">Q${i+1} · ${DOMAINS[q.d]}</div><div>${esc(q.q)}</div>
      <div class="small">Your answer: ${a===null?'<b>not answered</b>':`<b style="color:var(${a===q.key?'--good':'--bad'})">${L[a]}. ${esc(q.opts[a])}</b>`}</div>
      ${a===q.key?'':`<div class="small">Correct: <b style="color:var(--good)">${L[q.key]}. ${esc(q.opts[q.key])}</b></div>`}
      <div class="fb ${a===q.key?'':'no'} small">${esc(q.r)}</div></div>`).join(''):'<p class="muted">Nothing to show for this filter.</p>'}</div>
  <div class="row"><button class="btn primary" id="again">Take another paper</button></div></div>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;result()});
  $('#pm').onchange=e=>{S.passMark=Math.max(1,Math.min(100,+e.target.value||DEFAULT_PASS));result()};
  $('#again').onclick=()=>{S={view:'home',cfg:S.cfg};render()};
}
function render(){if(S.view==='home')home();else if(S.view==='intro')intro();else if(S.view==='exam')exam();else result()}
document.addEventListener('keydown',e=>{
  if(S.view!=='exam'||S.stage!=='q'||S.popup||['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k)&&k.length===1){const i='abcd'.indexOf(k);if(i<S.qs[S.i].opts.length)pick(i)}
  else if(e.key==='ArrowRight'){if(S.i<S.qs.length-1)go(S.i+1);else{S.stage='review';S.rf='all';render()}}else if(e.key==='ArrowLeft')go(S.i-1);
  else if(k==='f'){S.flag[S.i]=!S.flag[S.i];render()}
});
render();
</script>
</body></html>
