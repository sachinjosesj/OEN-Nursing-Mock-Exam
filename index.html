ing formula", "Use 0.9% normal saline to flush the tube to provide extra sodium"], "a": 0, "r": "To prevent chemical interactions and severe tube clogging, medications must be crushed completely, dissolved, and administered SEPARATELY. The tube must be flushed with 15-30 mL of water (sterile or purified) before, strictly BETWEEN each medication, and after the final medication."}, {"d": 0, "q": "The nurse receives a critically high lab value: a serum potassium of 7.1 mEq/L. The patient is asymptomatic. What is the nurse's VERY FIRST action?", "o": ["Obtain an immediate 12-lead ECG to assess for cardiac toxicity", "Administer a STAT dose of oral sodium polystyrene sulfonate (Kayexalate)", "Draw another blood sample to verify the result was not hemolyzed", "Start an IV infusion of normal saline to dilute the blood"], "a": 0, "r": "A potassium level > 7.0 is a profound, life-threatening emergency that can cause fatal ventricular arrhythmias at any second. While verifying a hemolyzed sample is important, the ABSOLUTE FIRST priority is obtaining an ECG to assess if the myocardium is already toxic (peaked T waves, wide QRS), which dictates immediate IV Calcium Gluconate administration."}, {"d": 0, "q": "The nurse is reviewing an order for a blood transfusion. The patient's blood type is B Negative. Which of the following blood types can this patient safely receive?", "o": ["O Negative and B Negative", "B Positive and B Negative", "AB Negative and O Negative", "A Negative and B Negative"], "a": 0, "r": "A patient with B Negative blood has anti-A antibodies and can only receive Rh-negative blood. Therefore, they can only safely receive B Negative blood or the universal donor blood, O Negative."}, {"d": 0, "q": "A patient is admitted with a massive pulmonary embolism and requires continuous IV Heparin. The physician orders a bolus of 80 units/kg followed by a continuous infusion at 18 units/kg/hr. The patient weighs 100 kg. The pharmacy supplies Heparin 25,000 units in 250 mL D5W. What is the correct infusion rate in mL/hr?", "o": ["18 mL/hr", "36 mL/hr", "20 mL/hr", "10 mL/hr"], "a": 0, "r": "Dose = 18 units * 100 kg = 1,800 units/hr. Concentration = 25,000 units / 250 mL = 100 units/mL. Rate = 1,800 units/hr / 100 units/mL = 18 mL/hr."}, {"d": 0, "q": "A patient with terminal cancer is experiencing severe, unremitting pain. The physician prescribes a continuous subcutaneous infusion of Morphine. The patient's respiratory rate drops to 10 breaths per minute. Which ethical principle supports the nurse's decision to continue administering the medication despite the respiratory depression?", "o": ["The Principle of Double Effect", "The Principle of Justice", "The Principle of Fidelity", "The Principle of Autonomy"], "a": 0, "r": "The Principle of Double Effect states that an action with both a good and a bad effect is ethically permissible if the intent is to achieve the good effect (relieving severe pain in a terminal patient), even if the bad effect (respiratory depression/hastened death) is foreseen but unintended."}, {"d": 0, "q": "The nurse is preparing to hang a unit of Packed Red Blood Cells (PRBCs). Two nurses verify the patient's identity and blood type. Before initiating the infusion, the nurse must ensure the patient has signed which specific document?", "o": ["An informed consent for blood product administration", "An advance directive or living will", "A general hospital admission consent form", "A waiver of liability for transfusion reactions"], "a": 0, "r": "Blood transfusions carry significant risks (transfusion reactions, bloodborne pathogens). Therefore, standard medical practice and hospital policy dictate that a specific, separate informed consent for blood products must be signed by the patient prior to administration, unless it is an extreme life-saving emergency."}, {"d": 0, "q": "A nurse discovers a small fire in a patient's trash can. After rescuing the patient and sounding the alarm, the nurse grabs a fire extinguisher. What does the 'P' in the PASS acronym for using a fire extinguisher stand for?", "o": ["Pull the pin", "Point the nozzle", "Press the handle", "Pump the extinguisher"], "a": 0, "r": "The PASS acronym guides fire extinguisher use: Pull the pin, Aim the nozzle at the base of the fire, Squeeze the handle, and Sweep from side to side."}, {"d": 0, "q": "A patient with suspected active Tuberculosis (TB) is admitted. The physician orders a sputum culture for acid-fast bacilli (AFB). What is the optimal protocol for the nurse to collect this specimen?", "o": ["Collect three separate sputum specimens early in the morning on three consecutive days", "Collect a single sputum specimen immediately after the patient eats breakfast", "Collect the specimen using a deep nasotracheal suction catheter only", "Collect the specimen late at night right before the patient goes to sleep"], "a": 0, "r": "To definitively diagnose pulmonary TB, the standard protocol requires collecting three consecutive early morning sputum specimens. Secretions pool in the lungs overnight, making the early morning sample the most concentrated and likely to yield the acid-fast bacilli."}, {"d": 0, "q": "The nurse is preparing to administer an IV piggyback of a powerful antibiotic. The patient's primary continuous IV fluid is 0.9% Normal Saline with 40 mEq of Potassium Chloride. The antibiotic is known to be physically incompatible with Potassium Chloride. What is the BEST action by the nurse?", "o": ["Start a second peripheral IV line specifically to infuse the incompatible antibiotic", "Stop the primary infusion, flush the line with normal saline, run the antibiotic, flush again, and restart the primary", "Mix the antibiotic into the primary bag to dilute the incompatibility", "Administer the antibiotic via a rapid IV push instead of a piggyback"], "a": 0, "r": "While stopping and flushing a line (method 2) is technically allowed if only one line exists, stopping a continuous high-alert electrolyte infusion (like KCl) is dangerous. The BEST and safest practice for infusing incompatible continuous medications is to establish a dedicated, separate second IV access."}, {"d": 0, "q": "A patient with a peripherally inserted central catheter (PICC) is receiving a continuous TPN infusion. The nurse notes the pump is alarming 'occlusion.' The nurse assesses the line and finds it is completely blocked. What intervention should the nurse anticipate?", "o": ["Obtain an order to instill a thrombolytic agent (e.g., Alteplase) into the catheter to dissolve the clot", "Use a 3 mL syringe to forcefully push normal saline through the blockage", "Insert a long, sterile guidewire into the PICC to physically push the clot out", "Immediately pull the PICC line out and insert a new peripheral IV"], "a": 0, "r": "If a central line is completely occluded by a suspected blood clot or fibrin sheath, standard protocol involves instilling a specialized thrombolytic dwell (like Alteplase/Cathflo) to chemically dissolve the clot. Using small syringes (3 mL) to force it creates massive pressure that will rupture the catheter."}, {"d": 0, "q": "A patient with severe dysphagia requires medication via a percutaneous endoscopic gastrostomy (PEG) tube. The physician has ordered an enteric-coated Aspirin. What is the nurse's mandatory action?", "o": ["Contact the physician to request an order for a different formulation, such as a chewable or liquid aspirin", "Crush the enteric-coated pill thoroughly and dissolve it in warm water before administration", "Administer the pill whole down the PEG tube and flush with 50 mL of water", "Skip the dose and document that the patient could not swallow it"], "a": 0, "r": "Enteric-coated (EC) pills are designed to bypass the stomach and dissolve in the intestines to prevent severe gastric mucosal damage. Crushing them destroys this coating, causing massive gastric irritation. The nurse MUST contact the provider to change the order to a non-EC, crushable, or liquid formulation."}, {"d": 0, "q": "A registered nurse (RN) is supervising an unlicensed assistive personnel (UAP) on a busy medical unit. Which task is considered unsafe and inappropriate to delegate to the UAP?", "o": ["Assessing the skin integrity of a patient who was just admitted with severe bedsores", "Emptying and recording the volume of a urinary drainage bag", "Assisting a stable patient with a stroke to eat their lunch", "Performing a bed bath for a patient on strict bed rest"], "a": 0, "r": "Assessment, evaluation, and clinical judgment are the exclusive legal domain of the Registered Nurse. A UAP cannot legally assess a patient's skin or wound status. They can only perform routine, predictable tasks (vital signs, I&O, feeding, bathing)."}, {"d": 0, "q": "The nurse is preparing to transfer a patient from the bed to a wheelchair. The patient has right-sided weakness following a stroke. Which transfer technique ensures maximum safety?", "o": ["Position the wheelchair on the patient's left side (strong side) at a 45-degree angle to the bed", "Position the wheelchair on the patient's right side (weak side) so they can lean into it", "Place the wheelchair directly parallel to the bed and lift the patient under the axillae", "Have the patient wrap their arms around the nurse's neck and pivot together"], "a": 0, "r": "When transferring a patient with unilateral weakness, the wheelchair must ALWAYS be placed on the patient's unaffected (strong) side. This allows the patient to pivot and reach for the chair using their strong arm and leg for stability."}, {"d": 0, "q": "A patient with a peripherally inserted central catheter (PICC) requires a blood draw. The nurse flushes the line, draws 5 mL of blood, discards it, and then draws the required sample. What is the physiological reason for discarding the first 5 mL of blood?", "o": ["To prevent the blood sample from being diluted or contaminated by the fluids and medications dwelling in the catheter", "To ensure the laboratory does not test old, clotted blood", "To clear the line of microscopic air bubbles", "To test the patency of the line under negative pressure"], "a": 0, "r": "Central lines are routinely flushed with saline or heparin and contain a 'dead space' filled with these fluids. If the first bit of blood is not discarded (the 'waste'), the lab sample will be massively diluted or contaminated by these dwelling fluids, resulting in dangerously inaccurate lab values."}, {"d": 0, "q": "A nurse is ordered to administer an intramuscular (IM) injection to an adult patient who is emaciated and weighs 85 lbs (38 kg). Which needle size and angle of insertion should the nurse select?", "o": ["A 5/8-inch needle inserted at a 45-degree to 90-degree angle", "A 1.5-inch needle inserted at a 90-degree angle", "A 2-inch needle inserted at a 15-degree angle", "A 1/2-inch needle inserted at a 5-degree angle"], "a": 0, "r": "In a severely emaciated adult, the muscle mass is heavily depleted. Using a standard 1.5-inch IM needle at a 90-degree angle will likely strike bone. The nurse must select a much shorter needle (5/8 to 1 inch) and pinch the muscle, injecting at a 45 to 90-degree angle to safely hit the muscle belly."}, {"d": 0, "q": "A patient is receiving an IV infusion of Potassium Chloride (KCl). The patient complains of a severe, burning pain at the IV insertion site. The nurse assesses the site and notes it is red, warm, and swollen. What is the nurse's IMMEDIATE first action?", "o": ["Stop the IV infusion immediately and disconnect the tubing", "Slow the infusion rate by half to reduce the burning", "Elevate the arm and apply a warm compress while the infusion continues", "Administer a PRN dose of IV pain medication"], "a": 0, "r": "Redness, warmth, swelling, and burning pain indicate severe phlebitis or extravasation. Potassium is a massive tissue irritant and vesicant. The absolute first action is to STOP the infusion immediately to prevent further tissue necrosis and secure a new IV site in a different vein."}, {"d": 0, "q": "A patient has a signed, valid advance directive stating they refuse mechanical ventilation under any circumstances. The patient develops acute respiratory failure, becomes lethargic, and the physician prepares to intubate. The patient's spouse begs the physician to intubate to save their life. What is the nurse's ethical obligation?", "o": ["Advocate strongly for the patient by reminding the healthcare team of the valid advance directive refusing intubation", "Support the spouse's decision, as they are the legal next of kin and can override the directive in an emergency", "Assist the physician with the intubation to preserve life, as beneficence outweighs autonomy", "Ask the lethargic patient to nod if they want to be intubated, invalidating the written document"], "a": 0, "r": "An advance directive is a legally binding document that speaks for the patient when they lose capacity. The ethical principle of Autonomy dictates that a competent patient's prior written wishes absolutely override the desires of the family or the medical team's desire to preserve life."}, {"d": 0, "q": "The nurse is preparing to insert a peripheral IV catheter. Which vein is the most appropriate primary choice for a routine, short-term IV placement in an adult?", "o": ["A vein in the non-dominant hand or forearm, starting as distally as possible", "The antecubital vein, as it is the largest and easiest to find", "A vein in the dominant wrist, to encourage arm movement", "A vein in the lower extremities, to prevent arm complications"], "a": 0, "r": "When starting a peripheral IV, the best practice is to select a vein in the non-dominant arm and start as distally (low) as possible, such as the hand or forearm. This allows the nurse to move progressively 'up' the arm if the initial insertion fails, preserving proximal veins."}, {"d": 0, "q": "A patient with a peripherally inserted central catheter (PICC) is to receive a routine blood draw. The nurse attempts to flush the line, but it is completely occluded. What is the absolute CONTRAINDICATED action?", "o": ["Forcefully flush the line with a 3 mL syringe of normal saline", "Notify the physician to request an order for an Alteplase dwell", "Assess the external portion of the catheter for kinks", "Ask the patient to turn their head and cough"], "a": 0, "r": "A completely occluded central line is usually caused by a clot. Forcefully pushing against resistance, especially with a small syringe (like a 3 mL or 5 mL) creates massive pressure (PSI) that will either violently rupture the catheter internally or blow a fatal clot/embolus directly into the patient's heart."}, {"d": 0, "q": "The nurse is providing post-mortem care for a patient who died from a highly contagious infectious disease and is scheduled for an autopsy. Which action is appropriate regarding the patient's IV lines and Foley catheter?", "o": ["Leave all IV lines, tubes, and the Foley catheter intact and in place", "Remove all lines and tubes to prepare the body for the family to view", "Cut all lines 1 inch from the skin and tape them down securely", "Remove the Foley catheter but leave the IV lines intact"], "a": 0, "r": "When an autopsy is scheduled (or in coroners' cases/unexplained deaths), it is a strict legal protocol that ALL lines, tubes, catheters, and drains must be left completely intact exactly as they were at the time of death to allow the pathologist to determine the exact cause of death and rule out medical error."}, {"d": 0, "q": "The nurse is preparing to administer packed red blood cells (PRBCs) to a patient. The nurse primes the IV tubing with which specific intravenous solution to prevent hemolysis of the blood cells?", "o": ["0.9% Normal Saline", "5% Dextrose in Water (D5W)", "Lactated Ringer's", "0.45% Half-Normal Saline"], "a": 0, "r": "Blood products must ONLY be hung and primed with 0.9% Normal Saline. Dextrose solutions cause red blood cells to clump and lyse (hemolysis), and Lactated Ringer's contains calcium, which binds to the citrate preservative in the blood bag, causing the blood to clot inside the IV tubing."}, {"d": 0, "q": "A patient with a newly inserted chest tube is being transported to the radiology department. The Unlicensed Assistive Personnel (UAP) asks the nurse where to place the chest tube drainage system during transport. What is the correct instruction?", "o": ["'Keep the drainage system upright and completely below the level of the patient's chest at all times.'", "'Place the drainage system flat on the patient's lap so it doesn't get caught on the wheels.'", "'Clamp the chest tube securely and place the system on the bed next to the patient.'", "'Raise the drainage system above the patient's chest so gravity forces the air out.'"], "a": 0, "r": "A chest tube drainage system must always remain upright and below the level of the patient's chest. Raising it above the chest causes the drained fluid (blood/pus) to flow backward into the pleural space, causing a massive infection or tension pneumothorax. It should never be clamped during transport."}, {"d": 0, "q": "A nurse is administering a purified protein derivative (PPD) tuberculin skin test (Mantoux test). Which injection technique is required for this specific test?", "o": ["Intradermal injection using a 27-gauge needle at a 10 to 15-degree angle to create a visible wheal", "Subcutaneous injection using a 25-gauge needle at a 45-degree angle into the upper arm", "Intramuscular injection using a 22-gauge needle at a 90-degree angle into the deltoid", "Topical application using a transdermal patch left on for 48 hours"], "a": 0, "r": "The Mantoux test requires an intradermal injection. The nurse uses a small needle (26-27 gauge) inserted almost parallel to the skin (10-15 degrees) with the bevel up. A small, pale bleb or 'wheal' (resembling a mosquito bite) must form immediately under the epidermis for the test to be valid."}, {"d": 0, "q": "A patient on a medical unit requires contact precautions for a multidrug-resistant organism (MDRO). The nurse must enter the room to empty the urinary catheter bag. In what order must the nurse don (put on) their personal protective equipment (PPE)?", "o": ["Gown, then gloves", "Gloves, then gown", "Mask, then gown, then gloves", "Gown, then mask, then gloves"], "a": 0, "r": "According to standard CDC guidelines for donning PPE, the gown is put on first, followed by the mask/respirator, then goggles/face shield, and finally the gloves (which must be pulled over the cuffs of the gown)."}, {"d": 0, "q": "A patient with a documented severe latex allergy is scheduled for surgery. The nurse is preparing the operating room. Which item is completely safe to use for this patient?", "o": ["Silicone or vinyl urinary catheters", "Standard brown elastic bandages (Ace wraps)", "Red rubber Robinson catheters", "Standard adhesive tape"], "a": 0, "r": "For a patient with a latex allergy, all natural rubber products must be strictly avoided (red rubber catheters, many elastic bandages, standard adhesive tapes, and latex gloves). Silicone, vinyl, and polyurethane products are completely safe alternatives."}, {"d": 0, "q": "A patient with terminal bone cancer is receiving high-dose oral opioid therapy for pain management. The patient has not had a bowel movement in 4 days and complains of severe abdominal bloating and pain. What is the most common and persistent side effect of opioid therapy that the nurse MUST proactively manage?", "o": ["Constipation", "Respiratory depression", "Nausea and vomiting", "Pruritus (itching)"], "a": 0, "r": "While respiratory depression is the most dangerous side effect, patients quickly build a tolerance to it. However, patients NEVER build a tolerance to opioid-induced constipation. Proactive, aggressive bowel regimens (stimulant laxatives, stool softeners) must be initiated simultaneously with opioid therapy."}, {"d": 0, "q": "The nurse receives a laboratory report showing a patient's serum Lithium level is 2.5 mEq/L. The patient is exhibiting coarse tremors and slurred speech. What is the nurse's first action?", "o": ["Hold the next dose of Lithium, notify the provider immediately, and prepare to administer IV fluids", "Administer the next dose as scheduled because this is a therapeutic level", "Administer a STAT dose of IV Calcium Gluconate", "Encourage the patient to eat a large meal high in sodium"], "a": 0, "r": "The therapeutic range for Lithium is 0.6-1.2 mEq/L. A level of 2.5 mEq/L is highly toxic and can lead to seizures, coma, and death. The medication must be held immediately, the provider notified, and aggressive hydration (IV Normal Saline) is often required to flush the drug out."}, {"d": 0, "q": "The nurse is preparing to flush a newly inserted central venous catheter (CVC). The nurse draws up 10 mL of normal saline. Before injecting the saline, what is the nurse's mandatory FIRST action to ensure the line is safe to use and perfectly placed within the vein?", "o": ["Aspirate the syringe slightly to check for a brisk, dark red blood return", "Push 2 mL of saline forcefully to clear any clots", "Have the patient take a deep breath and bear down (Valsalva maneuver)", "Ask the patient if they feel any pain in their chest"], "a": 0, "r": "Before flushing ANY central line, the nurse must ALWAYS aspirate first to verify brisk blood return. This absolutely confirms that the catheter tip is still located within the vascular space and is patent. Flushing blindly without blood return can push a clot into the heart or push fluid into the extravascular tissue if the line has migrated."}, {"d": 0, "q": "A patient with active tuberculosis is prescribed Rifampin, Isoniazid, Pyrazinamide, and Ethambutol. The nurse is conducting discharge teaching. Which patient statement regarding Ethambutol indicates the patient understands a critical adverse effect of this specific medication?", "o": ["'I need to report any blurred vision, changes in my ability to see colors, or decreased visual acuity immediately.'", "'I should expect my urine and tears to turn a bright orange color.'", "'I must stop taking the medication if I feel numbness in my toes.'", "'I need to drink plenty of milk to prevent joint pain.'"], "a": 0, "r": "Ethambutol can cause severe optic neuritis, leading to blurred vision, decreased visual acuity, and red-green color blindness. Patients must be taught to report visual changes immediately, as they can become irreversible. (Orange urine is Rifampin; numbness/neuropathy is Isoniazid; joint pain/hyperuricemia is Pyrazinamide)."}, {"d": 0, "q": "A patient with suspected carbon monoxide poisoning is placed on a pulse oximeter, which reads 99% SpO2. The patient is confused and lethargic. What is the most appropriate action by the nurse?", "o": ["Ignore the pulse oximeter reading, as it cannot distinguish between carbon monoxide and oxygen, and administer 100% oxygen via a non-rebreather mask immediately", "Document the SpO2 as normal and assess the patient's pupils for opioid overdose", "Administer a rapid fluid bolus of normal saline to clear the toxins from the blood", "Elevate the head of the bed to 90 degrees to improve respiratory mechanics"], "a": 0, "r": "Standard pulse oximeters measure the percentage of hemoglobin binding sites that are occupied. Because carbon monoxide (CO) binds to hemoglobin with an affinity 200 times greater than oxygen, the oximeter reads the CO-bound hemoglobin as oxygen-bound, giving a falsely high, 'normal' reading (often 99-100%). The patient is actually severely hypoxic and requires 100% oxygen immediately."}, {"d": 0, "q": "The nurse is preparing to insert a nasogastric (NG) tube. Before the procedure, the nurse asks the patient to blow their nose, and then the nurse uses a penlight to inspect the nares. What is the primary purpose of this assessment?", "o": ["To check for a deviated septum or polyps that could obstruct the insertion of the tube", "To determine if the patient has a sinus infection requiring antibiotics first", "To measure the exact diameter of the nostril to select the correct French size", "To check the patient's gag reflex before inserting the tube"], "a": 0, "r": "Before inserting an NG tube, the nurse must assess the nares for patency. By having the patient breathe through each nostril and inspecting with a penlight, the nurse can identify a deviated septum, polyps, or trauma, allowing them to choose the most patent (open) nostril for safest insertion."}, {"d": 0, "q": "A patient with active Hepatitis B requires a blood draw. After drawing the blood, the nurse accidentally sticks their own finger with the contaminated needle. The nurse's employee health records show they received the full Hepatitis B vaccination series 5 years ago, but their anti-HBs titer was never checked. What is the occupational health nurse's PRIORITY action?", "o": ["Test the nurse's blood for anti-HBs (Hepatitis B surface antibodies) immediately to determine if they have adequate immunity", "Administer a STAT dose of Hepatitis B Immune Globulin (HBIG)", "Restart the entire 3-dose Hepatitis B vaccine series immediately", "Send the nurse to the emergency room for an immediate liver biopsy"], "a": 0, "r": "Following a needle stick from a Hep B positive source, if the exposed healthcare worker's immune status is unknown, the immediate priority is to test their anti-HBs titer. If the titer is adequate (>10 mIU/mL), no treatment is needed. If inadequate, HBIG and a vaccine booster are given."}, {"d": 0, "q": "The nurse is inserting a peripheral IV and observes a flash of blood in the chamber. The nurse advances the catheter into the vein, but when attempting to flush the line with normal saline, encounters firm resistance. What is the most appropriate action?", "o": ["Remove the catheter entirely and apply pressure to the site", "Push the flush syringe forcefully to blow past the resistance/valve", "Pull the catheter back 1 cm and attempt to flush again", "Attach the IV tubing and hang the fluids at a wide-open rate"], "a": 0, "r": "If severe resistance is met when flushing a newly inserted peripheral IV, the catheter is likely lodged against a valve or the vein wall, or has infiltrated. Forcing the flush will blow the vein or cause severe infiltration. The catheter must be completely removed and a new site selected."}, {"d": 0, "q": "The nurse is preparing to remove a patient's personal protective equipment (PPE) after leaving a contact and droplet isolation room. What is the correct order for doffing (removing) the PPE?", "o": ["Gloves, goggles/face shield, gown, mask/respirator", "Gown, gloves, mask/respirator, goggles/face shield", "Mask/respirator, goggles/face shield, gown, gloves", "Gloves, gown, mask/respirator, goggles/face shield"], "a": 0, "r": "When doffing PPE, the most heavily contaminated items are removed first. The standard alphabetical CDC order is Gloves, Goggles (or face shield), Gown, and Mask (or respirator), followed immediately by hand hygiene."}, {"d": 0, "q": "A nurse is instructing a group of unlicensed assistive personnel (UAP) on proper body mechanics for lifting heavy objects. Which instruction is correct to prevent back injuries?", "o": ["Keep a wide base of support, bend at the knees, and lift using the strong muscles of the legs", "Keep the feet close together to maintain a center of gravity and bend at the waist", "Twist at the waist when moving the object to the side to avoid moving the feet", "Hold the object far away from the body to protect the chest and abdomen"], "a": 0, "r": "Proper body mechanics dictate maintaining a wide base of support (feet shoulder-width apart), bringing the object close to the body's center of gravity, bending at the knees (not the waist), and lifting with the large, powerful muscles of the thighs and legs to prevent lumbar spine injury."}, {"d": 0, "q": "A registered nurse (RN) is planning care for the shift. Which task is appropriate to delegate to a Licensed Practical Nurse (LPN)?", "o": ["Performing a sterile dressing change on a central venous catheter", "Creating the initial nursing care plan for a newly admitted patient", "Administering IV push chemotherapy drugs", "Assessing a patient's breath sounds 15 minutes after a severe asthma attack"], "a": 0, "r": "LPNs are trained to perform sterile procedures (like dressing changes and Foley insertions) and administer routine medications (excluding high-alert IV pushes) on stable patients. Initial assessments, care planning, and evaluating unstable patients are exclusively RN responsibilities."}, {"d": 0, "q": "During a mass casualty incident, a patient is brought to the triage area. The patient has a simple closed fracture of the radius, is fully conscious, and has a respiratory rate of 18 breaths per minute. Capillary refill is 1 second. Which disaster triage tag color should this patient receive?", "o": ["Green (Minor/Walking Wounded)", "Yellow (Delayed)", "Red (Immediate)", "Black (Expectant)"], "a": 0, "r": "Under START mass casualty triage, a patient with a minor injury (like a simple closed fracture) who is stable, walking, and has normal vital signs is tagged Green ('walking wounded') and their care can be safely delayed."}, {"d": 0, "q": "A nurse is caring for a patient who only speaks Mandarin. A family member is not present. How should the nurse obtain a translator for a complex medical discussion?", "o": ["Use the hospital's official dual-handset medical interpreter telephone service", "Use a free internet translation app on a smartphone", "Ask the patient's roommate to translate", "Use hand gestures and simple drawings to explain the procedure"], "a": 0, "r": "To ensure accurate, unbiased medical translation and comply with legal and ethical standards, the nurse must use an official, certified medical interpreter, typically provided via a hospital interpreter phone line or video service."}, {"d": 0, "q": "A patient arrives at the emergency department with a deep, actively bleeding laceration on the forearm. What is the nurse's ABSOLUTE FIRST physical action to control the hemorrhage?", "o": ["Apply firm, direct pressure directly over the wound with a sterile or clean dressing", "Apply a medical tourniquet 2 inches above the wound", "Elevate the arm above the level of the heart", "Locate the brachial artery and apply indirect pressure"], "a": 0, "r": "In any external hemorrhage, the absolute first and most effective step is applying firm, direct pressure over the bleeding site. If direct pressure fails to stop the bleeding, then elevation, pressure points, or a tourniquet (as a last resort for life-threatening limb bleeding) can be applied."}, {"d": 0, "q": "The nurse is reviewing the chart of a patient scheduled for an MRI of the abdomen. The patient has a history of claustrophobia, a titanium hip replacement, a penicillin allergy, and an implanted vagus nerve stimulator for epilepsy. Which finding is an absolute contraindication for the MRI?", "o": ["The implanted vagus nerve stimulator", "The titanium hip replacement", "The history of claustrophobia", "The penicillin allergy"], "a": 0, "r": "An MRI uses an immensely powerful magnetic field. Any implanted electronic device (vagus nerve stimulators, pacemakers, internal defibrillators, cochlear implants) is strictly contraindicated because the magnet will rip it out, heat it, or destroy its circuitry. Titanium is non-ferromagnetic and is generally MRI-safe."}, {"d": 0, "q": "A nurse is preparing to administer an intermittent enteral tube feeding via a gravity drip. The nurse checks the gastric residual volume (GRV) and obtains 150 mL. The patient is completely asymptomatic. What is the most appropriate action based on current best practice?", "o": ["Return the 150 mL of aspirate to the stomach and proceed with the scheduled feeding", "Discard the 150 mL of aspirate to prevent vomiting and hold the feeding for 1 hour", "Return the 150 mL of aspirate to the stomach but hold the feeding for 4 hours", "Discard the aspirate and administer the feeding at half the normal speed"], "a": 0, "r": "Current evidence-based guidelines suggest that GRVs less than 250-500 mL (depending on facility policy) in an asymptomatic patient are normal. The nurse MUST return the aspirate to the stomach to prevent massive electrolyte imbalances and metabolic alkalosis, and then proceed with the feeding."}, {"d": 0, "q": "A patient requires a continuous infusion of a vesicant chemotherapy drug. The physician orders a central venous access device (CVAD). The nurse knows that before the very first dose of chemotherapy can be administered through the newly inserted CVAD, what MUST occur?", "o": ["A chest X-ray must be performed and reviewed by a provider to confirm the catheter tip is in the lower Superior Vena Cava (SVC) or cavoatrial junction", "The nurse must aspirate 10 mL of blood and discard it to prove patency", "The patient must sign a specific consent form for the central line", "The nurse must flush the line with 10 mL of Heparin 100 units/mL"], "a": 0, "r": "Regardless of whether a CVC or PICC flushes easily or yields blood return, it is a strict legal and safety standard that a chest X-ray must be taken to radiographically confirm the tip is resting in the lower SVC/cavoatrial junction BEFORE any vesicant or TPN is infused."}, {"d": 0, "q": "A nurse commits a medication error that causes no harm to the patient. According to the principles of a 'Just Culture' within healthcare organizations, how should this event be handled?", "o": ["The error should be investigated to identify systemic flaws, without punishing the nurse for an honest mistake, to encourage open reporting", "The nurse should be immediately suspended to set an example for the rest of the staff", "The error should be ignored completely since the patient was not harmed", "The nurse should be required to publicly apologize to the entire nursing unit"], "a": 0, "r": "A 'Just Culture' differentiates between human error, at-risk behavior, and reckless behavior. It encourages the open reporting of errors and 'near misses' by fostering an environment where honest mistakes are investigated to fix systemic flaws rather than punishing the individual clinician."}, {"d": 0, "q": "A patient with a peripherally inserted central catheter (PICC) is ordered to receive a stat dose of IV Vancomycin. The nurse attempts to flush the line, but encounters massive resistance. The nurse pulls back on the syringe and gets no blood return. What is the nurse's ABSOLUTE FIRST action?", "o": ["Stop immediately and notify the physician; do not attempt to force the flush", "Push forcefully on the syringe plunger to clear the obstruction", "Have another nurse try to flush the line with a smaller 3 mL syringe", "Administer the Vancomycin rapidly to dissolve the clot"], "a": 0, "r": "If severe resistance is met and there is no blood return, the central line is occluded (likely by a clot). The nurse must NEVER force a flush. Forcing fluid against a clot will cause the catheter to physically rupture inside the patient or will blow a fatal embolus into the heart."}, {"d": 0, "q": "The nurse is preparing to administer an intramuscular (IM) injection using the Z-track method. What is the primary physiological purpose of this specific technique?", "o": ["To prevent highly irritating or staining medications from leaking back out of the muscle into the subcutaneous tissue", "To ensure the medication enters the bloodstream as rapidly as an IV push", "To numb the skin prior to the needle puncturing it", "To allow the nurse to use a much shorter needle"], "a": 0, "r": "The Z-track method involves pulling the skin and subcutaneous tissue laterally before inserting the needle. Once the medication is injected into the muscle and the needle is withdrawn, the skin is released, creating a 'zigzag' path. This traps the medication deep in the muscle, preventing highly irritating drugs (like Iron Dextran) from seeping back up and burning or staining the sub-Q tissue."}, {"d": 0, "q": "A patient on a medical-surgical unit is receiving a continuous enteral feeding via a nasogastric (NG) tube. The patient complains of sudden, severe nausea. The nurse assesses the patient and finds their abdomen is distended and firm. What is the nurse's priority action?", "o": ["Stop the enteral feeding pump immediately", "Administer a PRN dose of IV Ondansetron (Zofran)", "Elevate the head of the bed to 90 degrees", "Draw a gastric residual volume to see how much is left"], "a": 0, "r": "Sudden severe nausea combined with a distended, firm abdomen in a patient on continuous tube feeding strongly indicates delayed gastric emptying or a bowel obstruction. The stomach is dangerously full. The absolute first action is to STOP the feeding pump immediately to prevent massive vomiting and fatal aspiration. Checking the GRV comes second."}, {"d": 0, "q": "A patient with a documented history of severe Anaphylaxis to Peanuts is admitted. The nurse is reviewing the patient's lunch tray. Which hidden source of peanut protein MUST the nurse fiercely inspect the food for?", "o": ["Cross-contaminated baked goods and certain ethnic sauces (e.g., Thai peanut sauce, mole)", "Dairy products like aged cheeses and yogurt", "Shellfish and deep-sea fish", "Citrus fruits and fruit juices"], "a": 0, "r": "Peanut allergies are incredibly severe. Peanuts are frequently hidden in baked goods, chocolates, and many ethnic dishes/sauces (Thai, African, Mexican mole). Even trace amounts from cross-contamination on shared factory equipment can trigger fatal anaphylaxis."}, {"d": 0, "q": "A nurse is caring for a patient who is Brain Dead and is an organ donor. The family is saying their final goodbyes. The nurse notes the patient's heart rate increases to 110 bpm and blood pressure drops to 85/40 mmHg. What is the nurse's physiological priority?", "o": ["Aggressively treat the hypotension and tachycardia with IV fluids and vasopressors to maintain organ perfusion for transplant", "Do nothing; the patient is legally dead and interventions are unethical", "Immediately disconnect the mechanical ventilator", "Administer a heavy dose of IV Morphine to ease the dying process"], "a": 0, "r": "Once brain death is declared, the patient is legally dead. However, if they are an organ donor, the body becomes an 'organ incubator.' The absolute physiological priority shifts entirely to aggressively maintaining hemodynamic stability (BP, HR, oxygenation) using fluids and vasopressors to keep the organs perfectly perfused and viable until harvest."}, {"d": 0, "q": "The nurse is preparing to administer an intravenous push (IVP) medication through a peripheral IV line that is currently infusing a compatible continuous IV fluid. What is the correct sequence of actions for administering the IVP medication?", "o": ["Pinch the IV tubing above the injection port, aspirate for blood return, inject the medication, release the tubing, and flush with normal saline", "Inject the medication directly into the IV bag so it infuses slowly with the continuous fluid", "Stop the IV pump, disconnect the continuous tubing, inject the medication directly into the catheter hub, and reconnect the tubing", "Pinch the tubing, inject the medication as fast as possible, and immediately increase the IV pump rate to flush it"], "a": 0, "r": "When giving an IV push into an actively infusing compatible line, the nurse must pinch the tubing upstream (above the port) so the medication is forced down into the patient, not up into the IV bag. The line is aspirated to confirm patency, the med is injected at the proper rate, and then the line is released and flushed."}, {"d": 0, "q": "A patient with a newly created colostomy is receiving discharge instructions. The nurse teaches the patient how to cut the skin barrier (wafer) to fit around the stoma. How much larger than the actual stoma should the opening in the wafer be cut?", "o": ["1/8 inch (0.3 cm) larger than the stoma", "Exactly the exact same size as the stoma", "1 inch (2.5 cm) larger than the stoma", "1/2 inch (1.3 cm) smaller than the stoma to ensure a tight seal"], "a": 0, "r": "The opening in the skin barrier (wafer) should be cut approximately 1/8 inch (0.3 cm) larger than the stoma. If it is cut too small, it will lacerate or strangulate the stoma. If it is cut too large, highly caustic stool/effluent will leak onto the exposed peristomal skin, causing severe excoriation and skin breakdown."}, {"d": 0, "q": "A nurse is caring for a patient who is Muslim and observes the fast of Ramadan. The patient is prescribed oral antibiotics twice a day (Q12H). How should the nurse best accommodate the patient's religious practices while ensuring effective medical treatment?", "o": ["Consult with the physician to schedule the medication doses before dawn (Suhoor) and after sunset (Iftar)", "Tell the patient they are medically exempt from fasting and must take the medication at 0900 and 2100", "Administer the medications intravenously during the day so the patient doesn't swallow anything", "Skip the daytime dose and give a double dose after sunset"], "a": 0, "r": "Cultural competence requires accommodating religious practices whenever safely possible. For twice-daily medications during Ramadan, the doses can easily be adjusted to be taken before dawn (Suhoor) and after sunset (Iftar), ensuring both medical compliance and religious adherence."}, {"d": 0, "q": "A patient on the medical-surgical unit experiences a grand mal seizure. The nurse arrives as the patient is actively convulsing in bed. What is the nurse's ABSOLUTE FIRST priority action?", "o": ["Turn the patient onto their side to prevent aspiration and protect the head from injury", "Insert a padded tongue blade into the patient's mouth to prevent them from biting their tongue", "Restrain the patient's arms and legs to prevent fractures", "Leave the room immediately to retrieve IV Diazepam"], "a": 0, "r": "During an active seizure, the absolute first priority is safety and airway protection. The nurse must turn the patient on their side (lateral position) to allow saliva/emesis to drain out (preventing fatal aspiration), loosen restrictive clothing, and protect the head. NEVER insert anything into the mouth, and NEVER physically restrain convulsing limbs."}, {"d": 0, "q": "The nurse is preparing to insert a sterile Foley catheter. After opening the sterile kit and donning sterile gloves, the nurse realizes they forgot to bring a securement device (StatLock) to the bedside. What is the correct action?", "o": ["Ask a passing colleague to bring the securement device while the nurse remains sterile", "Take the sterile gloves off, grab the device from the supply room, and put the same sterile gloves back on", "Leave the sterile field unattended for 30 seconds to grab the device from the cart in the hallway", "Insert the catheter without a securement device and tape it to the leg later"], "a": 0, "r": "Once sterile gloves are on and the sterile field is established, the nurse cannot touch any non-sterile item, leave the room, or turn their back on the sterile field. The only correct action is to ask another staff member to retrieve the missing item and drop it onto the sterile field or hand it to the nurse."}, {"d": 0, "q": "A patient asks the nurse to explain the purpose of their newly prescribed 'enteric-coated' daily aspirin. What is the most accurate physiological explanation?", "o": ["'The coating prevents the pill from dissolving in the stomach, protecting your stomach lining from severe irritation and ulcers; it dissolves later in the intestines.'", "'The coating makes the pill taste better so it is easier to swallow without water.'", "'The coating ensures the medication releases slowly over a full 24 hours.'", "'The coating helps the stomach acid break down the medication faster.'"], "a": 0, "r": "Enteric-coated (EC) pills are specifically designed to resist the highly acidic environment of the stomach. They pass intact through the stomach and dissolve only in the more alkaline environment of the small intestine. This prevents medications like Aspirin from causing severe gastric mucosal damage and bleeding."}, {"d": 0, "q": "The nurse is inserting a peripheral IV catheter into a patient's arm. Once the nurse observes a 'flash' of blood in the flashback chamber, what is the exact NEXT step before advancing the catheter?", "o": ["Lower the angle of the needle so it is almost flush with the skin, then advance both the needle and catheter about 1 to 2 millimeters further into the vein", "Immediately push the plastic catheter off the needle as far as it will go", "Pull the needle completely out and then try to push the plastic catheter in", "Increase the angle to 90 degrees and push firmly to ensure it is in the vein"], "a": 0, "r": "When a 'flash' is seen, the tip of the *needle* is in the vein, but the tip of the *plastic catheter* (which sits slightly back from the needle bevel) may not be. The nurse must drop the angle flush with the skin and advance the ENTIRE unit 1-2 mm further to ensure the plastic catheter is fully inside the lumen before sliding the catheter off the needle."}, {"d": 0, "q": "The nurse is preparing to change the dressing on a patient's central venous catheter (CVC). The patient is on a ventilator and cannot follow commands. To prevent an air embolism during the dressing and cap change, what is the best nursing action?", "o": ["Place the patient in the Trendelenburg position (head down) if not contraindicated", "Place the patient in a high-Fowler's position", "Perform the dressing change while the ventilator is delivering a breath (inspiration)", "Disconnect the ventilator temporarily to prevent chest movement"], "a": 0, "r": "When changing a CVC cap/dressing, the goal is to increase intrathoracic pressure to prevent air from being sucked into the central vein. If the patient cannot perform the Valsalva maneuver, placing them flat or in the Trendelenburg position (head down) increases venous pressure in the upper body, drastically reducing the risk of an air embolism."}, {"d": 0, "q": "A patient with a nasogastric (NG) tube is receiving a continuous enteral feeding. The nurse needs to administer a crushed oral medication. What is the correct sequence of actions?", "o": ["Stop the feeding, flush with 15-30 mL of water, administer the medication, flush with 15-30 mL of water, and restart the feeding", "Mix the crushed medication directly into the enteral feeding bag", "Administer the medication through the blue 'pigtail' air vent of the Salem Sump tube", "Push the medication through the tube forcefully without stopping the feeding pump"], "a": 0, "r": "To prevent fatal tube occlusions and drug-nutrient interactions, the continuous feeding MUST be stopped. The tube is flushed with 15-30 mL of water (sterile/purified) to clear the formula, the dissolved medication is given, the tube is flushed again with 15-30 mL of water, and then the feeding is restarted."}, {"d": 0, "q": "A nurse is teaching a patient how to use a three-point crutch gait. The patient is non-weight-bearing on their left leg. Which sequence is correct?", "o": ["Advance both crutches and the weak left leg simultaneously, then swing the strong right leg through", "Advance the right crutch and left leg, then the left crutch and right leg", "Advance both crutches, then drag both legs forward together", "Advance the strong right leg first, then both crutches and the weak left leg"], "a": 0, "r": "In a three-point gait (used when one leg is completely non-weight-bearing), the patient supports all their weight on the strong leg. They advance both crutches and the affected (weak) leg forward at the same time, and then swing the unaffected (strong) leg completely through the crutches."}, {"d": 0, "q": "A patient is prescribed a subcutaneous injection of regular insulin. The nurse selects a 5/8-inch, 25-gauge needle. The patient is of average weight and BMI. At what angle should the nurse insert the needle?", "o": ["45 degrees or 90 degrees, pinching the skin", "15 degrees, pulling the skin taut", "90 degrees using the Z-track method", "Directly parallel to the skin surface"], "a": 0, "r": "For subcutaneous injections in adults of normal or average weight, a 5/8-inch needle is typically inserted at a 45-degree angle (if 1 inch of tissue can be pinched) or a 90-degree angle (if 2 inches of tissue can be pinched) to ensure the medication deposits in the sub-Q fat, not the muscle."}, {"d": 0, "q": "The nurse is preparing to insert a peripheral IV catheter. After applying the tourniquet, the nurse palpates a firm, cord-like, tortuous structure that pulsates slightly. What should the nurse do?", "o": ["Remove the tourniquet and select a completely different site, as this is an artery", "Proceed with the insertion exactly at this site, as it is a strong, healthy vein", "Apply a warm compress to stop the pulsation, then insert the IV", "Slap the structure vigorously to cause it to dilate before insertion"], "a": 0, "r": "A firm, cord-like structure that is tortuous (bumpy/winding) or pulsates is an artery, not a vein. Attempting to insert an IV into an artery can cause massive bleeding, arterial spasm, or ischemia to the limb. The nurse must select a different site."}, {"d": 0, "q": "The nurse is preparing to administer an intramuscular (IM) injection of Haloperidol decanoate to an adult patient. The patient has a large amount of adipose tissue. Which needle length and injection site is most appropriate to ensure the medication reaches the muscle?", "o": ["A 1.5-inch needle into the ventrogluteal site", "A 5/8-inch needle into the deltoid site", "A 1-inch needle into the vastus lateralis site", "A 1/2-inch needle into the abdomen"], "a": 0, "r": "For deep IM injections in an adult, especially one with significant adipose tissue, a 1.5-inch needle is required to bypass the sub-Q fat and deposit the drug deep into the muscle belly. The ventrogluteal site is the safest and preferred site for adults due to its thick muscle mass and lack of major nerves/vessels."}, {"d": 0, "q": "A patient with a central venous catheter (CVC) is receiving total parenteral nutrition (TPN). The nurse discovers the TPN bag is empty and the new bag has not arrived from the pharmacy. What is the nurse's priority action?", "o": ["Hang a bag of 10% Dextrose in Water (D10W) at the same infusion rate", "Hang a bag of 0.9% Normal Saline at a keep-vein-open (KVO) rate", "Stop the pump and flush the line with Heparin", "Hang a bag of 5% Dextrose in Water (D5W) at double the rate"], "a": 0, "r": "TPN contains a massive concentration of glucose. The patient's pancreas has upregulated insulin production to handle it. If the TPN is abruptly stopped, the high insulin levels will cause rapid, profound, and potentially fatal hypoglycemia. The nurse must hang D10W at the same rate to maintain blood glucose levels until the new TPN bag arrives."}, {"d": 0, "q": "A nurse is caring for a patient on airborne precautions for suspected tuberculosis. The patient is coughing frequently. The nurse needs to enter the room to administer oral medications. Which personal protective equipment (PPE) is MANDATORY for the nurse to wear?", "o": ["An N95 respirator mask or Powered Air-Purifying Respirator (PAPR)", "A standard surgical mask and a face shield", "A sterile gown, sterile gloves, and a hair net", "Only a pair of clean gloves"], "a": 0, "r": "Airborne precautions require the healthcare worker to be protected from microscopic droplet nuclei that remain suspended in the air. A standard surgical mask cannot filter these. An N95 respirator mask (fit-tested) or a PAPR is the absolute mandatory requirement for entering an airborne isolation room."}, {"d": 0, "q": "The nurse is reviewing an order for a blood transfusion. The patient has type O positive blood. In an emergency, if O positive blood is completely unavailable, which blood type could this patient safely receive?", "o": ["O negative", "A positive", "B positive", "AB positive"], "a": 0, "r": "Type O individuals have both anti-A and anti-B antibodies in their plasma. Therefore, they can ONLY receive Type O blood. However, a positive Rh factor patient can safely receive Rh-negative blood. Thus, O-negative (the universal donor) is the only safe alternative."}, {"d": 0, "q": "A nurse is discharging a patient with a new prescription for a fentanyl transdermal patch for chronic pain. What specific instruction regarding the disposal of the used patch must the nurse emphasize?", "o": ["Fold the sticky sides of the used patch together and flush it immediately down the toilet", "Throw the used patch directly into the regular trash can", "Place the used patch in a biohazard bag and return it to the pharmacy", "Burn the used patch in an incinerator"], "a": 0, "r": "Fentanyl is a profoundly potent opioid. Even 'used' patches contain a massive, lethal dose of fentanyl that can easily kill a child or pet if they find it in the trash and touch/chew it. The FDA specifically recommends folding the patch in half (sticky sides together) and immediately flushing it down the toilet to prevent accidental, fatal exposure."}, {"d": 0, "q": "The nurse is assigned to a patient who requires airborne precautions for active tuberculosis. The nurse must transport the patient to the radiology department for a chest X-ray. What is the correct procedure for this transport?", "o": ["Place a standard surgical mask on the patient to trap droplets before they enter the air", "Place an N95 respirator mask on the patient", "Transport the patient in a sealed, negative-pressure wheelchair", "Place an N95 mask on the transporting nurse, but the patient does not need one"], "a": 0, "r": "When a patient on airborne precautions must be transported, the goal is source control. The PATIENT must wear a standard surgical mask (not an N95) to trap the respiratory droplets and prevent them from becoming aerosolized into the hallway."}, {"d": 0, "q": "The nurse is preparing to insert an indwelling urinary (Foley) catheter in a female patient. The nurse has opened the sterile kit and donned sterile gloves. When cleansing the patient's meatus, what is the most critical principle the nurse must follow to maintain sterility?", "o": ["Use a new sterile cotton ball or swab for each downward stroke (front to back) and never retrace a path", "Cleanse from the back (anus) to the front (clitoris) to prevent pushing bacteria into the vagina", "Cleanse in a circular motion starting at the meatus and moving outward", "Use one sterile swab and vigorously scrub back and forth over the meatus for 30 seconds"], "a": 0, "r": "When cleansing the female perineum for catheterization, the nurse must always wipe from front to back (clitoris toward anus) to prevent bringing rectal bacteria to the urethra. A new, sterile swab/cotton ball MUST be used for every single downward stroke to prevent cross-contamination. Retracing a path drags bacteria back over the clean area."}, {"d": 0, "q": "A patient with a documented severe allergy to natural rubber latex is admitted to the surgical unit. The nurse is reviewing the patient's lunch tray. Which food item poses the highest risk for a cross-reactive allergic response and must be removed?", "o": ["A fresh avocado", "A bowl of plain oatmeal", "A glass of pasteurized milk", "A piece of grilled chicken"], "a": 0, "r": "Latex-fruit syndrome is a well-documented cross-reactivity. Proteins in natural rubber latex are structurally very similar to proteins found in certain fruits and nuts, most notably avocados, bananas, kiwis, and chestnuts. Consuming these can trigger anaphylaxis in a latex-allergic patient."}, {"d": 0, "q": "A patient with cervical cancer is receiving internal radiation therapy (brachytherapy) with a sealed vaginal implant. The nurse walks into the room and discovers the radioactive implant has fallen out and is lying on the bed. What is the absolute FIRST action the nurse must take?", "o": ["Use long-handled forceps to pick up the implant and place it in a lead-lined container", "Pick up the implant with gloved hands and throw it in the biohazard bin", "Evacuate the entire unit and call the hazmat team", "Push the implant back into the patient's vagina immediately"], "a": 0, "r": "A dislodged radioactive implant is a severe radiation emergency. The nurse must NEVER touch it directly, even with gloves. Standard protocol requires keeping long-handled forceps and a lead-lined pig (container) in the room at all times. The nurse must use the forceps to place the source into the lead container immediately to shield the radiation."}, {"d": 0, "q": "The nurse is teaching a patient who recently fractured their right tibia how to ascend stairs using crutches. The patient is non-weight-bearing on the right leg. What is the correct sequence for going UP the stairs?", "o": ["Advance the strong left leg up to the next step first, then bring the crutches and the injured right leg up together", "Advance the crutches up to the next step first, then hop up with the strong left leg", "Advance the injured right leg and the crutches up first, then drag the left leg up", "Lean forward, place both crutches on the next step, and swing both legs up simultaneously"], "a": 0, "r": "When navigating stairs with crutches, the mnemonic 'Up with the Good, Down with the Bad' applies. Going UP stairs: the patient shifts their weight onto the crutches, steps up with the UNAFFECTED (good/strong) leg first, and then brings the crutches and the affected (bad) leg up to meet it."}, {"d": 0, "q": "A patient is prescribed to receive a unit of Packed Red Blood Cells (PRBCs). During the mandatory two-RN bedside check, the nurses note that the patient's blood type is A-Positive, but the blood bag is labeled O-Negative. What is the correct action?", "o": ["Proceed with the transfusion, as O-Negative is the universal donor and safe for this patient", "Discard the blood bag immediately in the biohazard bin", "Return the blood to the blood bank because the types do not match exactly", "Administer a prophylactic dose of diphenhydramine before starting the transfusion"], "a": 0, "r": "Type O-Negative blood has no A, B, or Rh antigens on the red blood cell surface, meaning it will not trigger an immune reaction in any recipient. It is the universal donor. A patient with A-Positive blood can safely receive A+, A-, O+, or O- blood. The transfusion may proceed."}, {"d": 0, "q": "An RN asks a Licensed Practical Nurse (LPN) to assist with a group of patients. Which specific patient care task is entirely within the legal scope of practice for the LPN to perform independently?", "o": ["Performing a sterile dressing change on a 4-day-old abdominal surgical incision", "Conducting the initial admission assessment and creating the care plan for a new patient", "Administering a continuous IV push of Morphine for severe pain", "Evaluating the effectiveness of a newly implemented blood pressure protocol"], "a": 0, "r": "LPNs (Licensed Practical Nurses) are trained and licensed to perform predictable, routine clinical procedures on stable patients, including sterile dressing changes, administering oral/SC/IM medications, and inserting Foley catheters. Initial assessments, IV push high-alert meds, and evaluation of care plans are strictly RN scopes of practice."}, {"d": 0, "q": "A nurse manager is reviewing charting records and notices a nurse documented a procedure 2 hours before it was actually performed to 'save time.' This falsification of medical records is a violation of which core ethical principle?", "o": ["Veracity", "Beneficence", "Autonomy", "Justice"], "a": 0, "r": "Veracity is the ethical principle of truth-telling and honesty. Falsifying a medical record, documenting ahead of time, or lying to a patient directly violates the principle of veracity."}, {"d": 0, "q": "A patient arrives in the emergency department with a severe laceration and requires emergency surgery. The patient is legally intoxicated with a blood alcohol concentration (BAC) of 0.20%. Who is legally authorized to sign the informed consent for the surgery?", "o": ["The patient's legally appointed healthcare proxy or next of kin", "The patient, because it is a life-threatening emergency", "The primary emergency department nurse", "The patient's best friend who drove them to the hospital"], "a": 0, "r": "A patient who is heavily intoxicated (under the influence of drugs or alcohol) is legally deemed incompetent to provide informed consent. The healthcare team must obtain consent from the designated medical power of attorney, healthcare proxy, or legal next of kin. If no one can be reached and the surgery is life-saving, implied consent applies (but a proxy is the first choice)."}, {"d": 0, "q": "A patient with severe Alzheimer's dementia is attempting to pull out their IV line and nasogastric tube. The physician orders bilateral soft wrist restraints. According to standard safety protocols, how frequently must the nurse release the restraints, assess the skin, and perform range of motion (ROM) exercises?", "o": ["At least every 2 hours", "Every 15 minutes", "Once every 4 hours", "Once a shift (every 8 to 12 hours)"], "a": 0, "r": "For non-violent (medical/surgical) restraints, standard protocol dictates that the nurse must release the restraints, assess skin integrity, check circulation, and perform range of motion exercises at least every 2 hours. (Violent/behavioral restraints require continuous monitoring or 15-minute checks)."}, {"d": 0, "q": "A patient with Type 1 Diabetes is prescribed 10 units of Regular insulin and 20 units of NPH insulin subcutaneously every morning. The nurse is preparing to mix these in a single syringe. What is the correct sequence for drawing up these medications?", "o": ["Inject air into NPH, inject air into Regular, draw up Regular, draw up NPH", "Inject air into Regular, inject air into NPH, draw up NPH, draw up Regular", "Draw up the NPH first, then draw up the Regular", "Draw up the Regular first, then inject air into the NPH"], "a": 0, "r": "To prevent contaminating the fast-acting Regular insulin with the long-acting NPH insulin, the standard 'Clear before Cloudy' method is used: Inject air into the cloudy (NPH), inject air into the clear (Regular), draw up the clear (Regular), then draw up the cloudy (NPH). Mnemonic: RN (Regular then NPH)."}, {"d": 0, "q": "A patient is receiving a unit of packed red blood cells (PRBCs). Forty minutes into the infusion, the patient suddenly develops severe dyspnea, hypoxemia, bilateral pulmonary infiltrates on a chest X-ray, and profound hypotension. The patient does NOT have an elevated Central Venous Pressure (CVP) or jugular vein distension (JVD). What specific transfusion reaction is occurring?", "o": ["Transfusion-Related Acute Lung Injury (TRALI)", "Transfusion-Associated Circulatory Overload (TACO)", "Acute Hemolytic Reaction", "Febrile Non-Hemolytic Reaction"], "a": 0, "r": "TRALI is a severe, life-threatening immune reaction where donor antibodies attack the patient's white blood cells in the pulmonary capillaries, causing massive non-cardiogenic pulmonary edema. It presents with severe respiratory distress, hypoxemia, and hypotension, but crucially lacks signs of volume overload (like high CVP or JVD, which are seen in TACO)."}, {"d": 0, "q": "The nurse is setting up a sterile field for a bedside procedure. Which area of the sterile drape is universally considered UNSTERILE?", "o": ["Both the outer 1-inch border and any part hanging over the table edge", "The outer 1-inch (2.5 cm) border of the drape", "The exact center of the drape", "Any part of the drape that hangs over the edge of the table"], "a": 0, "r": "In sterile technique, the outer 1-inch (2.5 cm) margin of any sterile drape is always considered contaminated/unsterile because it is handled by the nurse. Additionally, any portion of a sterile drape that falls below the level of the table edge is completely unsterile."}, {"d": 0, "q": "A patient in the intensive care unit is receiving Total Parenteral Nutrition (TPN) and intravenous lipids. According to strict infection control standards, how frequently MUST the TPN tubing and the TPN bag be completely changed?", "o": ["Every 24 hours", "Every 72 hours", "Every 96 hours", "Only when the bag is completely empty"], "a": 0, "r": "Because TPN is an incredibly rich, hypertonic glucose solution and the lipids provide an ideal medium for rapid, massive bacterial and fungal growth, standard infection control protocols mandate that the TPN bag and all its associated tubing be completely changed every 24 hours."}, {"d": 0, "q": "The nurse is inserting a peripheral IV catheter. After advancing the catheter into the vein, the nurse completely removes the needle (stylet) and drops it directly into the sharps container. While doing this, the nurse accidentally lets go of the catheter hub, and it slips out of the vein. What must the nurse do?", "o": ["Obtain a brand new IV start kit and a new catheter to attempt the insertion at a different site", "Retrieve the needle from the sharps container, reinsert it into the catheter, and try again", "Push the plastic catheter back into the skin blindly", "Tape the catheter where it is and start a fluid bolus to see if it works"], "a": 0, "r": "Once an IV catheter has been removed from the skin or the needle has been removed from the catheter, the equipment is considered contaminated and compromised. A needle MUST NEVER be reinserted into a plastic catheter (it will shear the plastic off, causing a fatal catheter embolus). The nurse must start over entirely with new equipment."}, {"d": 0, "q": "A patient with active Clostridioides difficile (C. diff) infection is being discharged. The nurse is instructing the environmental services (housekeeping) team on how to clean the room. Which specific cleaning agent is absolutely MANDATORY to kill this pathogen?", "o": ["A bleach-based (sodium hypochlorite) sporicidal disinfectant", "Standard 70% isopropyl alcohol wipes", "Quaternary ammonium compounds", "Chlorhexidine gluconate solution"], "a": 0, "r": "C. diff produces incredibly resilient spores that can survive on hard surfaces for months. Standard alcohol or quaternary ammonia cleaners CANNOT penetrate the spore wall. Only a bleach-based (sodium hypochlorite) sporicidal cleaner is effective at destroying C. diff spores in the environment."}, {"d": 0, "q": "The nurse is providing discharge teaching to a patient with a new prescription for an oral bisphosphonate (Alendronate) for severe osteoporosis. Which instruction is absolutely critical to prevent a severe, life-threatening esophageal complication?", "o": ["'You must take this medication with a full glass of plain water and remain completely upright (sitting or standing) for at least 30 minutes afterward.'", "'You must take this medication immediately before lying down to go to sleep.'", "'You must chew this medication thoroughly before swallowing it to activate the drug.'", "'Take this medication with a large glass of milk to increase the calcium absorption.'"], "a": 0, "r": "Oral bisphosphonates are incredibly caustic to the esophagus and can cause severe esophageal erosion, ulceration, or perforation if they lodge there. Patients MUST take them on an empty stomach with a full glass of water and remain upright for at least 30 minutes to ensure the pill rapidly passes completely into the stomach."}, {"d": 0, "q": "A patient with active Herpes Zoster (Shingles) localized to one side of the torso requires a dressing change. The nurse taking the assignment has never had chickenpox and has never received the Varicella vaccine. What is the occupational health nurse's directive?", "o": ["The nurse must be immediately reassigned, as they have no immunity and are at massive risk for contracting primary Varicella (chickenpox) from the active shingles lesions.", "The nurse can care for the patient if they wear a standard surgical mask and double gloves.", "The nurse can care for the patient, but must receive the Varicella vaccine immediately after the shift.", "The nurse is safe because Shingles is entirely non-contagious to adults."], "a": 0, "r": "Herpes Zoster (Shingles) is the reactivation of the Varicella-Zoster virus. The fluid inside the active blisters contains live, infectious virus. A person who has NEVER had chickenpox and is unvaccinated has zero immunity. If they come into contact with the fluid (or even airborne particles in disseminated cases), they will develop primary Chickenpox. Pregnant or non-immune staff must NEVER be assigned."}, {"d": 0, "q": "The nurse is preparing to perform a sterile dressing change on a central venous catheter. The nurse opens the sterile drape and accidentally spills a small amount of sterile saline onto the center of the drape, which is resting on the patient's non-sterile overbed table. What is the status of the sterile drape?", "o": ["The drape is now completely unsterile due to capillary action (strikethrough) pulling microbes up from the unsterile table", "The drape is perfectly sterile because the spilled fluid was sterile saline", "Only the exact wet spot is unsterile; the rest of the drape can be used safely", "The drape is sterile as long as it dries within 5 minutes"], "a": 0, "r": "In sterile technique, if a sterile field becomes wet while resting on a non-sterile surface, capillary action immediately draws bacteria and microbes up from the unsterile surface (the table) through the fabric and onto the sterile field. This is called 'strikethrough.' The entire drape is contaminated and must be discarded."}, {"d": 0, "q": "A patient with a history of severe chronic kidney disease (CKD) is prescribed a new medication. The nurse notes the medication is primarily excreted via the kidneys. What critical pharmacological adjustment must the nurse anticipate the physician will make?", "o": ["A significant reduction in the dosage or an increase in the time interval between doses to prevent fatal drug toxicity", "A massive increase in the dosage to force the failing kidneys to excrete it", "Changing the route from oral to intravenous to bypass the kidneys", "Administering the medication exclusively during hemodialysis sessions"], "a": 0, "r": "When a drug is primarily excreted by the kidneys, a patient with CKD cannot clear it from their blood. Giving a standard dose will lead to massive drug accumulation and severe, fatal toxicity. The dose must be drastically reduced, or the interval heavily prolonged, based on the patient's Glomerular Filtration Rate (GFR)."}, {"d": 0, "q": "The nurse is preparing to insert a nasogastric (NG) tube into a patient who is awake and alert. As the nurse passes the tube through the nasopharynx and into the oropharynx, the patient begins to gag. What is the most appropriate action by the nurse?", "o": ["Instruct the patient to tuck their chin to their chest and swallow small sips of water while advancing the tube", "Withdraw the tube completely and wait 30 minutes before trying again", "Extend the patient's neck backward and push the tube quickly", "Spray the back of the patient's throat with a topical anesthetic and continue pushing"], "a": 0, "r": "Gagging is a normal reflex when the NG tube hits the oropharynx. The nurse should pause briefly, have the patient flex their head forward (chin to chest) to close the trachea/epiglottis, and instruct the patient to swallow repeatedly (or sip water). The nurse advances the tube ONLY when the patient swallows."}, {"d": 0, "q": "A patient with a documented severe allergy to iodine and shellfish is scheduled for an urgent cardiac catheterization. The procedure requires the use of iodinated contrast dye. What is the nurse's priority action?", "o": ["Notify the physician and anticipate an order to pre-medicate the patient with high-dose corticosteroids and antihistamines", "Cancel the procedure completely, as it cannot be done under any circumstances", "Proceed with the procedure normally, as shellfish allergy does not correlate with contrast dye", "Administer a test dose of the contrast dye intravenously to see if a reaction occurs"], "a": 0, "r": "While a true iodine/shellfish allergy is a major risk factor for a contrast dye reaction, life-saving procedures can still be performed. The strict standard of care is to notify the provider and pre-medicate the patient aggressively with corticosteroids (e.g., prednisone) and antihistamines (e.g., diphenhydramine) to suppress the immune response before the dye is injected."}, {"d": 0, "q": "A patient with a peripherally inserted central catheter (PICC) is being discharged home with a continuous IV antibiotic infusion. The nurse is teaching the patient about catheter care. Which statement by the patient indicates a critical safety hazard?", "o": ["'I will use scissors to carefully cut the old dressing off so I don't pull the catheter out.'", "'I will wrap my arm in plastic wrap before taking a shower.'", "'I will flush the line with saline and heparin as prescribed.'", "'I will call the doctor immediately if my arm becomes swollen or red.'"], "a": 0, "r": "Scissors must NEVER be used near a central line or PICC to remove a dressing. It is incredibly easy to accidentally snip the catheter, causing an immediate, fatal air embolism or rendering the line completely useless. The dressing must be gently peeled off."}, {"d": 0, "q": "The nurse is preparing to insert a peripheral IV. The patient is extremely anxious and states, 'I always faint when I see blood.' Which position is the absolute safest for this patient during the IV insertion?", "o": ["Supine (flat on their back) or in a low semi-Fowler's position", "Sitting upright on the edge of the bed with feet dangling", "Standing up and leaning over the bedside table", "High-Fowler's position (90 degrees upright)"], "a": 0, "r": "Patients with a history of vasovagal syncope (fainting from triggers like needles or blood) should be placed in a supine or low semi-Fowler's position. This prevents a sudden drop in cerebral blood pressure and completely eliminates the risk of them falling and suffering a severe head injury if they do faint."}, {"d": 0, "q": "The nurse is preparing to access an implanted port (e.g., Port-a-Cath) for a chemotherapy infusion. Which specific type of needle MUST the nurse use to access the port?", "o": ["A non-coring Huber needle", "A standard 18-gauge hypodermic needle", "A 22-gauge butterfly needle", "A blunt-tip drawing needle"], "a": 0, "r": "Implanted ports have a dense silicone septum. If a standard, beveled hypodermic needle is used, it will 'core' or cut a piece of the silicone out, instantly destroying the port and causing it to leak fatally into the subcutaneous tissue. A non-coring Huber needle must ALWAYS be used because it cleanly slices the septum, which reseals when removed."}, {"d": 0, "q": "A patient is prescribed a subcutaneous injection of Heparin. To prevent severe bruising and hematoma formation at the injection site, what technique MUST the nurse avoid?", "o": ["Massaging the injection site vigorously after administering the medication", "Rotating the injection sites across the abdomen", "Injecting the medication at a 90-degree angle", "Using a 5/8-inch, 25-gauge needle"], "a": 0, "r": "Heparin is a powerful anticoagulant. Massaging the site after a sub-Q injection physically damages the local capillary beds. Because the blood is thinned, this mechanical trauma will cause massive bleeding into the tissue, resulting in severe, painful hematomas."}, {"d": 0, "q": "The nurse is setting up a sterile field and accidentally drops a sterile 4x4 gauze pad. It lands on the outer 1-inch border of the sterile drape. What is the status of the gauze pad?", "o": ["It is considered unsterile and must be discarded because the outer 1-inch border of any sterile drape is considered contaminated", "It is perfectly sterile because it landed on the sterile drape", "It is sterile as long as the nurse picks it up with sterile forceps", "It is unsterile only if the fluid soaked through the drape"], "a": 0, "r": "The outer 1-inch margin of a sterile field/drape is universally considered unsterile because it is the boundary where the nurse handles the drape. Any sterile item that touches this 1-inch border is immediately considered contaminated and cannot be used."}, {"d": 0, "q": "The nurse is verifying a trough level for a patient receiving IV Gentamicin. The trough level is reported as 3.5 mcg/mL (Normal trough < 2.0 mcg/mL). The next dose is due in 15 minutes. What is the nurse's priority action?", "o": ["Hold the dose and notify the physician because the level indicates impending toxicity", "Administer the dose as scheduled because trough levels are drawn to ensure the drug stays in the therapeutic range", "Administer half the prescribed dose to bring the level down gradually", "Flush the patient's IV line with 20 mL of normal saline to dilute the medication"], "a": 0, "r": "A trough level measures the lowest concentration of the drug in the blood right before the next dose. A high trough level (>2.0 mcg/mL for Gentamicin) indicates the kidneys are not clearing the drug effectively, placing the patient at severe risk for nephrotoxicity and ototoxicity. The dose must be held."}, {"d": 0, "q": "The nurse is inserting an indwelling Foley catheter in a female patient. The nurse accidentally inserts the catheter into the vagina. What is the CORRECT sequence of actions to take next?", "o": ["Leave the catheter in the vagina as a landmark, obtain a brand new sterile kit, and insert a new catheter into the urethra", "Pull the catheter out, clean it with an alcohol swab, and reinsert it higher into the urethra", "Leave the catheter in the vagina, wait 10 minutes, and then try again with the same catheter", "Remove the catheter, wipe the meatus with iodine, and immediately push the same catheter into the urethra"], "a": 0, "r": "Once a catheter enters the vagina, it is completely contaminated with vaginal and gastrointestinal flora. It must NEVER be reinserted into the sterile urethra. Leaving it temporarily in the vagina serves as an excellent visual landmark so the nurse does not make the same mistake twice. A completely new, sterile kit must be used for the correct insertion."}, {"d": 0, "q": "A patient with active Clostridioides difficile (C. diff) is placed on Contact Precautions. The nurse is discharging the patient. What specific instruction must the nurse give the environmental services (housekeeping) team regarding the final room cleaning?", "o": ["'The room must be cleaned exclusively with a bleach-based (sodium hypochlorite) sporicidal disinfectant.'", "'Standard alcohol-based wipes are sufficient as long as you wipe every surface twice.'", "'Use quaternary ammonium compounds to ensure the walls are sterilized.'", "'The room must be sealed and fumigated with ozone gas for 48 hours.'"], "a": 0, "r": "C. diff produces incredibly hardy, resilient spores that can survive on environmental surfaces for weeks to months. Standard hospital disinfectants (like alcohol or quaternary ammonia) CANNOT penetrate the thick spore wall. Only a bleach-based (sodium hypochlorite) sporicidal cleaner is effective at destroying C. diff spores."}, {"d": 0, "q": "A patient with active tuberculosis is prescribed a multi-drug regimen including Rifampin, Isoniazid (INH), and Pyrazinamide. After a few weeks, the patient comes to the clinic and the nurse notices the patient's sclerae and skin are noticeably yellow. What is the most critical nursing action?", "o": ["Hold all the TB medications immediately and draw liver function tests (AST, ALT, Bilirubin)", "Tell the patie
