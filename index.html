olalia is repeating others' words. Word salad is a jumble of real words. Clang associations involve rhyming."}, {"d": 5, "q": "A patient with severe, treatment-resistant depression is scheduled for Electroconvulsive Therapy (ECT) in the morning. Which nursing intervention is a MANDATORY part of the pre-operative preparation for this procedure?", "o": ["Ensure the patient has been strictly NPO (nothing by mouth) for 6-8 hours, remove any dentures, and ensure an informed consent is signed", "Administer a massive dose of an anticonvulsant (e.g., Phenytoin) to protect the brain", "Restrain the patient tightly to the bed to prevent bone fractures during the seizure", "Encourage the patient to eat a large, heavy breakfast to prevent hypoglycemia during the seizure"], "a": 0, "r": "ECT involves putting the patient under general anesthesia and administering a muscle relaxant to induce a controlled seizure safely. Because of the anesthesia, the patient MUST be strictly NPO to prevent fatal aspiration. Dentures/glasses must be removed, and a legal informed consent must be signed prior to the procedure. (Anticonvulsants are held because the *goal* is to cause a seizure)."}, {"d": 5, "q": "A patient on the psychiatric unit constantly brags about their immense wealth, demands that only the 'Chief Medical Officer' treat them, lacks any empathy for the other patients, and throws a massive tantrum when they are not praised by the staff. The nurse recognizes these behaviors as classic signs of which personality disorder?", "o": ["Narcissistic Personality Disorder", "Antisocial Personality Disorder", "Borderline Personality Disorder", "Histrionic Personality Disorder"], "a": 0, "r": "Narcissistic Personality Disorder is defined by a pervasive, massive pattern of grandiosity, a desperate need for admiration, and a total lack of empathy. These patients possess an inflated sense of self-importance, believe they are 'special,' and often display arrogant, entitled behaviors, becoming enraged if they are criticized or ignored."}, {"d": 5, "q": "A patient with severe Major Depressive Disorder is prescribed a Monoamine Oxidase Inhibitor (MAOI), Phenelzine. The patient develops a severe sinus infection and purchases over-the-counter (OTC) pseudoephedrine (Sudafed). What catastrophic event will occur if the patient combines these medications?", "o": ["A massive, fatal Hypertensive Crisis leading to a hemorrhagic stroke", "Profound, irreversible respiratory depression", "Severe, sudden hypoglycemia and coma", "Complete, irreversible bone marrow suppression"], "a": 0, "r": "MAOIs block the enzyme that breaks down neurotransmitters (like norepinephrine). Pseudoephedrine is a powerful sympathomimetic (it stimulates the massive release of norepinephrine). Combining an MAOI with OTC cold medications (pseudoephedrine/ephedrine) causes an uncontrolled, massive surge of norepinephrine, triggering a fatal hypertensive crisis and hemorrhagic stroke. OTC cold meds are strictly contraindicated."}, {"d": 5, "q": "A patient with severe schizophrenia is prescribed Haloperidol. During the shift, the nurse observes the patient suddenly freeze. The patient's neck twists painfully to the side, and their eyes roll completely upward into their head, locking in place. What is the immediate, life-saving pharmacological antidote the nurse must prepare?", "o": ["Intramuscular or Intravenous Benztropine (Cogentin) or Diphenhydramine (Benadryl)", "Intravenous Flumazenil (Romazicon)", "Oral Lithium Carbonate", "Intravenous Naloxone (Narcan)"], "a": 0, "r": "The patient is experiencing an Acute Dystonic Reaction (torticollis and an oculogyric crisis). This is a terrifying and intensely painful extrapyramidal side effect (EPS) caused by massive dopamine blockade. Because it can compromise the airway, the immediate antidote is a rapid-acting anticholinergic (Benztropine) or antihistamine (Diphenhydramine) given IM or IV."}, {"d": 5, "q": "A patient with Bipolar I Disorder has been taking Lithium for 3 years. The patient presents to the emergency department with severe, uncontrollable vomiting and diarrhea from a stomach virus. The patient is confused, slurring their words, and has a severe, coarse hand tremor. What has likely occurred?", "o": ["The massive loss of fluid and sodium from vomiting/diarrhea caused the kidneys to reabsorb Lithium instead, leading to severe Lithium Toxicity", "The patient is experiencing an acute manic episode triggered by the stress of the virus", "The virus has crossed the blood-brain barrier, causing acute viral meningitis", "The patient's Lithium dose was too low to manage their bipolar symptoms during illness"], "a": 0, "r": "Lithium is a salt. The kidneys cannot easily distinguish between lithium and sodium. If a patient becomes dehydrated or loses massive amounts of sodium (via vomiting, diarrhea, or heavy sweating), the kidneys will desperately hold onto lithium instead, leading to rapid, fatal Lithium toxicity (coarse tremors, ataxia, confusion, seizures)."}, {"d": 5, "q": "A patient with Bipolar I Disorder is admitted in a state of acute mania. The patient is constantly moving, pacing the unit, highly intrusive, and refuses to sit down in the dining room for meals. Which dietary intervention is the absolute most appropriate for this patient?", "o": ["Provide high-calorie, high-protein finger foods (e.g., chicken nuggets, protein bars, sandwiches) that the patient can eat while walking", "Force the patient to sit quietly at the table until they finish a full, hot, plated meal", "Provide only clear liquids until the manic episode completely passes", "Withhold all food and snacks until the patient agrees to sit calmly"], "a": 0, "r": "Patients in acute mania are hyperactive, highly distractible, and burn massive amounts of calories. They physically cannot sit still long enough to eat a traditional meal, placing them at severe risk for profound malnutrition and physical exhaustion. High-calorie, nutrient-dense 'finger foods' allow them to eat 'on the go' and maintain their weight during the episode."}, {"d": 5, "q": "A patient taking Fluoxetine (SSRI) and Tramadol presents with agitation, tremors, hyperreflexia, clonus, and diaphoresis. What condition is occurring?", "o": ["Serotonin Syndrome", "Neuroleptic Malignant Syndrome", "Lithium Toxicity", "Tardive Dyskinesia"], "a": 0, "r": "Serotonin Syndrome results from excessive serotonergic activity (e.g., combining SSRIs with other serotonergic agents like Tramadol, MAOIs, or St. John's Wort). Classic signs: hyperreflexia, clonus, tremors, agitation, fever."}, {"d": 5, "q": "A patient with Bipolar I Disorder has a serum Lithium level of 2.2 mEq/L. The patient exhibits coarse hand tremors, severe diarrhea, vomiting, and ataxia. What is the nurse's immediate action?", "o": ["Hold the Lithium dose, notify the physician immediately, and prepare for IV fluid hydration", "Administer the next dose as scheduled", "Administer Calcium Gluconate", "Increase sodium restriction in the diet"], "a": 0, "r": "Lithium therapeutic range is 0.6-1.2 mEq/L. Levels > 2.0 mEq/L represent severe toxicity (coarse tremors, GI distress, ataxia, confusion). The drug must be held immediately and fluids given to promote excretion."}, {"d": 5, "q": "A patient starting Clozapine must undergo mandatory weekly complete blood counts (CBC). What specific fatal blood dyscrasia is being monitored?", "o": ["Agranulocytosis (severe neutropenia)", "Aplastic anemia", "Thrombocytopenia", "Hemolytic anemia"], "a": 0, "r": "Clozapine carries a black-box warning for Agranulocytosis (severe drop in absolute neutrophil count), making mandatory ANC monitoring essential to prevent fatal infections."}, {"d": 5, "q": "A 17-year-old female is admitted to the eating disorder unit with a diagnosis of Anorexia Nervosa. During the physical exam, the nurse notes fine, soft, downy hair covering the patient's face, back, and arms. How should the nurse document this physical finding, and what is its physiological cause?", "o": ["Lanugo; a compensatory physiological mechanism to trap heat due to severe loss of subcutaneous fat and hypothermia", "Russell's sign; caused by chronic self-induced vomiting", "Hirsutism; caused by excessive androgen production from polycystic ovaries", "Chloasma; caused by hormonal fluctuations in malnutrition"], "a": 0, "r": "Lanugo is fine, soft, downy hair that grows on emaciated patients with severe Anorexia Nervosa. Because the body has lost all its subcutaneous fat insulation and cannot regulate temperature, the body grows lanugo as a primitive compensatory attempt to trap body heat."}, {"d": 5, "q": "A patient with severe anxiety is admitted. Which nurse response demonstrates the most effective therapeutic communication technique?", "o": ["'Tell me more about what you are feeling right now.'", "'Don't worry, everything is going to be completely fine.'", "'Why are you making such a big deal out of this?'", "'You shouldn't feel anxious because the doctor is very qualified.'"], "a": 0, "r": "Open-ended prompts ('Tell me more about...') encourage the patient to express feelings and elaborate without judgment or false reassurance."}, {"d": 5, "q": "A patient with Major Depressive Disorder is started on a new SSRI. Why must the nurse closely monitor the patient for increased suicide risk during the first 1 to 2 weeks of therapy?", "o": ["The patient's physical energy improves before their depressed mood lifts, giving them the physical energy to carry out a suicide plan", "The SSRI directly causes suicidal hallucinations in all patients", "The drug causes immediate severe physical pain", "Antidepressants cause severe short-term memory loss"], "a": 0, "r": "Antidepressants often improve energy, motivation, and psychomotor retardation before relieving depressed mood. This lag creates a dangerous window where the patient has the physical energy to carry out suicide."}, {"d": 5, "q": "A patient with Generalized Anxiety Disorder is being prepared for discharge. Which non-pharmacological evidence-based therapy is considered first-line for long-term anxiety management?", "o": ["Cognitive Behavioral Therapy (CBT)", "Electroconvulsive Therapy (ECT)", "Psychoanalysis for 5 years", "Complete bed rest"], "a": 0, "r": "Cognitive Behavioral Therapy (CBT) is the gold-standard, first-line non-pharmacological treatment for Generalized Anxiety Disorder, helping patients reframe distorted thoughts and learn coping strategies."}, {"d": 5, "q": "A patient taking Lithium for Bipolar Disorder attends a routine outpatient visit. In addition to monitoring serum Lithium levels, which two organ function panels must be routinely evaluated long-term?", "o": ["Renal Function (BUN/Creatinine) and Thyroid Function (TSH)", "Liver Function (AST/ALT) and Cardiac Enzymes", "Pancreatic Enzymes and Pulmonary Function", "Bone Density and Hearing Tests"], "a": 0, "r": "Long-term Lithium therapy carries high risks for nephrotoxicity (chronic kidney disease/DI) and thyroid suppression (hypothyroidism). Renal function (BUN/Cr) and Thyroid function (TSH) must be monitored regularly."}, {"d": 5, "q": "A patient admitted with alcohol use disorder stops drinking. How many hours after the last drink is the patient at highest risk for developing Delirium Tremens (DTs)?", "o": ["48 to 96 hours after the last drink", "2 to 4 hours after the last drink", "12 to 24 hours after the last drink", "7 to 10 days after the last drink"], "a": 0, "r": "Delirium Tremens (DTs)—the most severe, life-threatening form of alcohol withdrawal—typically onset 48 to 96 hours (2-4 days) after the last alcohol intake."}, {"d": 5, "q": "A patient with schizophrenia who has been taking Haloperidol for 10 years displays involuntary, repetitive movements of the tongue (tongue protrusion), lip smacking, and rapid blinking. What irreversible movement disorder has occurred?", "o": ["Tardive Dyskinesia", "Akathisia", "Acute Dystonia", "Pseudoparkinsonism"], "a": 0, "r": "Tardive dyskinesia is a late-onset, frequently irreversible extrapyramidal side effect caused by long-term dopamine receptor blockade from typical antipsychotics. It is characterized by involuntary choreoathetoid movements of the face, mouth, tongue, and extremities."}, {"d": 5, "q": "A patient with Schizophrenia reports hearing voices telling them to 'hurt the night nurse.' What is the nurse's priority assessment question?", "o": ["'What specific command or message are the voices giving you right now?'", "'Why do you think the voices want to hurt the nurse?'", "'Voices aren't real, so please try to ignore them.'", "'Do you hear voices in both ears or just one?'"], "a": 0, "r": "Command hallucinations present an immediate safety hazard. The nurse's absolute priority is to directly assess the specific content of the command to determine harm risk and establish safety interventions."}, {"d": 5, "q": "A patient undergoing Electroconvulsive Therapy (ECT) for severe treatment-resistant depression returns to the recovery room. What post-procedure nursing assessment is expected?", "o": ["Temporary confusion, short-term memory loss, and mild headache", "Profound permanent retrograde amnesia and hemiparesis", "Severe hypertension and hyperthermia", "Intractable nausea and visual hallucinations"], "a": 0, "r": "Common, expected post-ECT side effects include brief anterograde/retrograde amnesia, temporary disorientation, fatigue, and mild headache. Vital signs and orientation must be monitored."}, {"d": 5, "q": "A patient taking Lithium for Bipolar Disorder presents with fine hand tremors, mild nausea, and polyuria. The serum Lithium level is 0.9 mEq/L. What is the nurse's interpretation?", "o": ["These are expected, mild side effects at a therapeutic Lithium level (0.6 - 1.2 mEq/L)", "The patient is experiencing severe, life-threatening Lithium toxicity", "The Lithium level is critically low and requires a dosage increase", "The patient is developing acute kidney failure requiring immediate hemodialysis"], "a": 0, "r": "A serum Lithium level of 0.9 mEq/L is within the therapeutic window (0.6 - 1.2 mEq/L). Fine hand tremors, mild thirst, and increased urination are normal, expected early side effects (unlike coarse tremors, which signal toxicity)."}, {"d": 5, "q": "A patient experiencing a severe Panic Attack is hyperventilating, shaking, and states, 'I feel like I'm dying!' What is the most effective nursing intervention during the peak panic state?", "o": ["Remain with the patient in a quiet room and deliver short, simple, calm instructions to slow their breathing", "Leave the patient alone so they can rest without distraction", "Engage the patient in a detailed 30-minute discussion about their stress triggers", "Administer a rapid IV bolus of a stimulant"], "a": 0, "r": "During acute panic, severe cognitive narrowing prevents processing complex sentences. The nurse must stay with the patient, project a calm demeanor, and provide brief, direct instructions (e.g., 'Breathe in slowly with me')."}, {"d": 5, "q": "A patient diagnosed with severe Obsessive-Compulsive Disorder (OCD) spends 2 hours every morning washing their hands before breakfast, causing skin breakdown. What is the initial therapeutic approach to this compulsive ritual?", "o": ["Allow the patient time for the ritual initially while setting structured, gradual time limits to reduce the compulsion over time", "Physically lock the bathroom door so the patient cannot wash their hands at all", "Tell the patient firmly that handwashing is foolish and illogical", "Administer high-dose antipsychotics immediately"], "a": 0, "r": "Abruptly stopping a compulsive ritual causes overwhelming, dangerous anxiety. The nurse initially allows time for the ritual while building trust and gradually introducing structured limits and alternative coping mechanisms."}, {"d": 5, "q": "A combat veteran with Post-Traumatic Stress Disorder (PTSD) experiences severe intrusive flashbacks and hyperarousal when hearing loud fireworks. What clinical technique helps ground the patient during a flashback?", "o": ["Orienting the patient to the present physical environment using sensory grounding techniques (e.g., 'Feel the chair under you, look at me')", "Shaking the patient forcefully to wake them up", "Asking the patient to close their eyes and relive the trauma in detail", "Leaving the room until the flashback passes"], "a": 0, "r": "Grounding techniques help re-orient patients experiencing flashbacks to the safety of the 'here and now' by re-engaging their physical senses (touching objects, calling their name, re-establishing eye contact)."}, {"d": 5, "q": "A patient with severe Anorexia Nervosa is started on a high-calorie refeeding plan. The nurse closely monitors the patient's serum electrolytes. Which rapid electrolyte drop characterizes Refeeding Syndrome?", "o": ["Severe Hypophosphatemia", "Hyperkalemia", "Hypernatremia", "Hypercalcemia"], "a": 0, "r": "Refeeding Syndrome occurs when carbohydrates are reintroduced to severely malnourished patients. Insulin surge drives phosphate, potassium, and magnesium rapidly into cells, resulting in severe, fatal Hypophosphatemia."}, {"d": 5, "q": "A patient with Bulimia Nervosa is admitted to the eating disorders clinic. What physical assessment finding is pathognomonic for chronic self-induced vomiting?", "o": ["Calluses on the dorsal surface of the knuckles (Russell's sign) and severe dental erosion", "Lanugo hair growth over the back and arms", "Profound peripheral pitting edema in lower legs", "Severe bronze skin pigmentation"], "a": 0, "r": "Russell's sign (calluses or scars on the knuckles from repeated contact with teeth during self-induced vomiting) alongside acid erosion of dental enamel are hallmark physical signs of Bulimia Nervosa."}, {"d": 5, "q": "A patient with Borderline Personality Disorder brings a self-inflicted superficial cut on their wrist to the nurse. How should the nurse manage the wound and interaction?", "o": ["Clean and dress the wound in a calm, neutral, matter-of-fact manner without providing excessive emotional attention", "Provide intense emotional comforting and spend 2 hours discussing why they cut themselves", "Ignore the cut completely as it is attention-seeking behavior", "Reprimand the patient for violating unit safety rules"], "a": 0, "r": "Self-harm in Borderline Personality Disorder is often driven by emotional dysregulation or secondary gain. Wound care must be provided competently, but in a strictly neutral, matter-of-fact manner to avoid reinforcing the self-harm behavior."}, {"d": 5, "q": "A patient diagnosed with Antisocial Personality Disorder repeatedly breaks unit rules and attempts to manipulate staff. What is the cornerstone of nursing management for patients with this disorder?", "o": ["Setting firm, clear, consistent boundaries and enforcing unit rules uniformly across all staff", "Allowing the patient to negotiate rules whenever they feel upset", "Isolating the patient in their room for 24 hours", "Assigning a different nurse every 2 hours"], "a": 0, "r": "Patients with Antisocial Personality Disorder disregard rights/rules and manipulate staff. Establishing firm, clear, consistent boundaries and maintaining staff consensus is essential to prevent manipulation."}, {"d": 5, "q": "A patient admitted with chronic Alcohol Use Disorder exhibits coarse hand tremors, diaphoresis, tachycardia, and anxiety 12 hours after their last drink. What assessment tool is standardized to titrate benzodiazepines during alcohol withdrawal?", "o": ["CIWA-Ar (Clinical Institute Withdrawal Assessment for Alcohol)", "Brace Scale", "Glasgow Coma Scale", "Braden Scale"], "a": 0, "r": "The CIWA-Ar protocol is the gold-standard validated tool used to score alcohol withdrawal severity (tremor, nausea, sweating, anxiety, hallucinations) and guide symptom-triggered Benzodiazepine dosing."}, {"d": 5, "q": "A patient is brought to the ED with a suspected Heroin (opioid) overdose. What classic triad of physical signs indicates acute, life-threatening opioid toxicity?", "o": ["Coma/unresponsiveness, pinpoint pupils (miosis), and severe respiratory depression", "High fever, dilated pupils (mydriasis), and severe hypertension", "Extreme agitation, hyperreflexia, and diarrhea", "Jaundice, abdominal distension, and coarse tremors"], "a": 0, "r": "The classic Opioid Overdose Triad consists of: 1) Respiratory depression, 2) Pinpoint pupils (miosis), and 3) Central nervous system depression/coma. Immediate Naloxone administration is indicated."}, {"d": 5, "q": "A nurse compares clinical features of Delirium vs Dementia in an elderly hospitalized patient. Which feature is unique to Delirium?", "o": ["Sudden, acute onset with fluctuating level of consciousness and impaired attention", "Slow, insidious, irreversible decline in memory over years", "Preserved alertness and normal attention span", "Permanent progressive cerebral atrophy"], "a": 0, "r": "Delirium is an acute, short-term, fluctuating cognitive impairment characterized by altered level of consciousness and inattention, usually secondary to an underlying medical cause (e.g., infection)."}, {"d": 5, "q": "A patient presents with multiple somatic complaints (headaches, chest tightness, abdominal pain) across several years that cause extreme distress, but exhaustive medical testing reveals no organic pathology. What disorder is this?", "o": ["Somatic Symptom Disorder", "Conversion Disorder", "Illness Anxiety Disorder", "Factitious Disorder"], "a": 0, "r": "Somatic Symptom Disorder involves one or more distressing physical symptoms accompanied by disproportionate, persistent anxiety and thoughts regarding their seriousness, despite lack of organic medical cause."}, {"d": 5, "q": "A patient experiences sudden functional blindness immediately after learning that their spouse wants a divorce. Extensive ophthalmological examination demonstrates intact visual pathways. The patient appears unusually unconcerned ('la belle indifférence'). What is the diagnosis?", "o": ["Conversion Disorder (Functional Neurological Symptom Disorder)", "Malingering", "Hypochondriasis", "Schizophrenia"], "a": 0, "r": "Conversion Disorder involves sudden, involuntary loss of sensory or motor function (e.g., blindness, paralysis) triggered by severe psychological stress, often accompanied by 'la belle indifférence' (lack of concern)."}, {"d": 5, "q": "A patient diagnosed with Dissociative Identity Disorder (DID) is cared for by the mental health team. What is the primary long-term goal of psychotherapy for DID?", "o": ["Integrating the distinct alternate personalities (alters) into a single cohesive identity", "Suppressing all alternate personalities using high-dose sedatives", "Isolating each alternate personality permanently", "Encouraging the development of new alters"], "a": 0, "r": "The ultimate goal of treatment for Dissociative Identity Disorder is the integration of the separate alternate personalities (alters) into one unified, cohesive personality structure."}, {"d": 5, "q": "A patient taking Haloperidol develops agonizing motor restlessness, constant pacing, and an inability to sit still. What Extrapyramidal Side Effect (EPS) is occurring, and how is it treated?", "o": ["Akathisia; treated with Beta-blockers (e.g., Propranolol) or Benzodiazepines", "Tardive Dyskinesia; treated with higher Haloperidol doses", "Acute Dystonia; treated with IV Insulin", "Pseudoparkinsonism; treated with Haloperidol"], "a": 0, "r": "Akathisia is an EPS characterized by intense subjective restlessness and physical inability to sit still. First-line treatments include Beta-blockers (Propranolol) or anticholinergics/benzodiazepines."}, {"d": 5, "q": "How does Neuroleptic Malignant Syndrome (NMS) differ from Serotonin Syndrome regarding physical neuromuscular findings?", "o": ["NMS features severe 'lead-pipe' muscle rigidity, whereas Serotonin Syndrome features hyperreflexia and clonus", "NMS features hyperreflexia, whereas Serotonin Syndrome features severe muscle rigidity", "Both syndromes present with complete muscle flaccidity", "Neither syndrome affects muscle tone"], "a": 0, "r": "NMS is characterized by severe 'lead-pipe' muscle rigidity and hyporeflexia. Serotonin Syndrome is characterized by neuromuscular hyperactivity: tremors, hyperreflexia, and prominent clonus (muscle spasms)."}, {"d": 5, "q": "A patient is admitted to a psychiatric facility under an Involuntary Commitment (civil commitment) order because they pose an immediate danger to self. What legal right does the patient retain?", "o": ["The right to informed consent and the right to refuse non-emergency treatment/medications", "The right to leave the hospital grounds at any time", "The right to discard all hospital rules", "No legal rights are retained under involuntary status"], "a": 0, "r": "Involuntarily committed patients retain all constitutional civil rights, including the right to informed consent, confidential communication, and the right to refuse psychotropic medications (unless an immediate life-threatening emergency occurs)."}, {"d": 5, "q": "When performing a Suicide Risk Assessment on an adolescent exhibiting severe depressive symptoms, what is the most appropriate way for the nurse to ask about suicidal intent?", "o": ["'Are you having thoughts of killing yourself or ending your life?'", "'You're not thinking about doing anything silly, are you?'", "'Why would you want to hurt your family by dying?'", "'I assume you don't have a plan to hurt yourself, right?'"], "a": 0, "r": "Suicide risk assessment requires direct, unambiguous, clear questioning ('Are you thinking about killing yourself?'). Indirect, judgmental, or leading questions hinder honest disclosure."}, {"d": 5, "q": "In the therapeutic nurse-patient relationship, during which phase do the nurse and patient outline the specific goals of therapy, establish boundaries, and address confidentiality?", "o": ["Orientation Phase", "Working Phase", "Termination Phase", "Pre-orientation Phase"], "a": 0, "r": "The Orientation phase involves building trust, defining roles, establishing the therapeutic contract/boundaries, setting goals, and discussing the parameters of confidentiality and eventual termination."}, {"d": 6, "q": "A public health nurse is organizing a community health fair providing influenza vaccinations and educational sessions on smoking cessation. How should these activities be classified?", "o": ["Primary Prevention", "Secondary Prevention", "Tertiary Prevention", "Quaternary Prevention"], "a": 0, "r": "Primary prevention aims to prevent disease or injury before it occurs (e.g. immunizations, health education on lifestyle choices, seatbelt promotion)."}, {"d": 6, "q": "A community clinic conducts routine Mammography screening for early breast cancer detection and Pap smears for cervical dysplasia. What level of prevention is represented?", "o": ["Secondary Prevention", "Primary Prevention", "Tertiary Prevention", "Health Promotion"], "a": 0, "r": "Secondary prevention focuses on early disease detection and screening in asymptomatic populations to enable prompt treatment and prevent progression."}, {"d": 6, "q": "A nurse coordinators a stroke rehabilitation program helping post-stroke patients regain speech and motor function. Which level of prevention does this represent?", "o": ["Tertiary Prevention", "Primary Prevention", "Secondary Prevention", "Disease Surveillance"], "a": 0, "r": "Tertiary prevention aims to manage established chronic disease, minimize disability, and restore maximum function through rehabilitation."}, {"d": 6, "q": "During a Dengue fever outbreak in a municipality, what community vector control measure should the public health nurse advocate FIRST?", "o": ["Eliminating open standing water containers where Aedes mosquitoes breed", "Distributing oral prophylactic antibiotics to all residents", "Closing all public schools and markets", "Spraying indoor air with disinfectant foam"], "a": 0, "r": "Dengue is transmitted by Aedes mosquitoes. The primary environmental control strategy is eliminating standing water in containers, tires, and pots where larvae develop."}, {"d": 6, "q": "An 82-year-old resident in a long-term care facility develops sudden new onset confusion, agitation, and disorientation over 4 hours. She has no fever or cough. What condition should the nurse suspect FIRST?", "o": ["Acute Urinary Tract Infection (UTI) or systemic infection manifesting as Delirium", "Normal age-related cognitive decline", "Alzheimer's Dementia progression", "Major Depressive Disorder"], "a": 0, "r": "In older adults, acute confusion/delirium is frequently the primary or ONLY presenting symptom of an underlying infection (such as a UTI or pneumonia) or drug toxicity."}, {"d": 6, "q": "To reduce fall risk at home for an 80-year-old client with osteoarthritic knees, which home modification should the nurse recommend?", "o": ["Removing all loose throw/scatter rugs, installing bathroom grab bars, and ensuring adequate lighting", "Polishing wooden floors to a smooth shine", "Keeping room lighting dim at all times to conserve energy", "Placing small low furniture obstacles in walkways"], "a": 0, "r": "Environmental risk reduction (removing loose rugs, installing grab bars in tub/toilet, providing non-skid footwear, and maintaining good lighting) significantly reduces elderly fall injuries."}, {"d": 6, "q": "An elderly patient on 7 different daily medications reports dizziness upon standing up from bed. Vital signs show BP 138/80 mmHg lying and 112/66 mmHg standing. What is the nurse's BEST guidance?", "o": ["Dangle legs on the edge of the bed for 1-2 minutes before standing up slowly", "Remain in bed continuously to avoid standing", "Increase daily salt intake significantly", "Stop taking all blood pressure medications immediately"], "a": 0, "r": "Orthostatic hypotension (SBP drop ≥20 mmHg) causes postural dizziness. Teaching patients to sit on the bed edge ('dangle') prior to standing allows vascular autoregulation."}, {"d": 6, "q": "A patient with advanced vascular dementia becomes increasingly agitated, restless, and confused every day around 5:00 PM as darkness falls. What phenomenon is occurring?", "o": ["Sundowning Syndrome", "Acute Delirium", "Wernicke Encephalopathy", "Catatonia"], "a": 0, "r": "Sundowning Syndrome refers to increased confusion and agitation occurring in late afternoon/evening in patients with dementia. Managed with predictable routines and adequate ambient lighting."}, {"d": 6, "q": "A terminal cancer patient receiving hospice care reports severe breakthrough pain rated 9/10. What is the appropriate palliative pain management approach?", "o": ["Administer scheduled around-the-clock opioids with additional short-acting breakthrough doses as ordered", "Withhold opioids until the patient is completely unable to tolerate pain", "Administer analgesics only when the patient explicitly begs for medication", "Replace opioids with mild oral antacids"], "a": 0, "r": "Palliative pain management emphasizes scheduled around-the-clock analgesia to maintain therapeutic blood levels, supplemented by short-acting breakthrough PRN doses. Addiction concerns do not apply in end-of-life care."}, {"d": 6, "q": "A nurse in Oman is providing end-of-life care for a Muslim patient. Which culturally sensitive practice should the nurse support?", "o": ["Allowing family presence for Quranic recitation and positioning the bed toward Qibla if requested", "Mandating embalming immediately after death", "Prohibiting family members from touching the deceased", "Requiring a male doctor to bathe female patients post-mortem"], "a": 0, "r": "Cultural competence in Gulf/Omani healthcare involves respecting Islamic end-of-life traditions: facilitating family presence for prayer/Quran, respecting modesty, providing same-gender post-mortem care, and supporting prompt burial."}, {"d": 6, "q": "A community health nurse is conducting a home visit for a 78-year-old client with a history of falls and poor vision. Which intervention is the HIGHEST priority?", "o": ["Removing loose rugs and ensuring pathways are clear of electrical cords", "Scheduling a follow-up appointment with an ophthalmologist", "Reviewing the client's dietary intake of calcium", "Encouraging the client to join a local senior exercise class"], "a": 0, "r": "Safety and injury prevention is the highest priority. Removing tripping hazards like loose rugs and cords immediately reduces the immediate risk of a fall."}, {"d": 6, "q": "During a community assessment, the nurse notes a high incidence of childhood obesity. What is the MOST appropriate primary prevention strategy?", "o": ["Implementing a school-based nutrition and physical activity program", "Screening all school-aged children for Type 2 diabetes", "Referring obese children to a pediatric endocrinologist", "Establishing a specialized weight loss clinic in the neighborhood"], "a": 0, "r": "Primary prevention focuses on preventing the problem before it occurs. A school-based nutrition and activity program promotes healthy habits for all children to prevent obesity."}, {"d": 6, "q": "An 85-year-old client with mild Alzheimer's disease lives with her daughter. The daughter expresses feeling exhausted and overwhelmed. What is the BEST nursing action?", "o": ["Provide information about local adult day care and respite care services", "Advise the daughter to place the client in a nursing home immediately", "Prescribe a mild sedative for the daughter to help her sleep", "Suggest the daughter hire full-time private nursing staff"], "a": 0, "r": "Caregiver burden is a significant risk. Providing information on respite care and adult day care offers the caregiver a necessary break while keeping the client in the community."}, {"d": 6, "q": "A public health nurse is investigating an outbreak of foodborne illness in a local neighborhood. Which epidemiological principle should the nurse apply FIRST?", "o": ["Identify the index case and trace all contacts", "Administer broad-spectrum antibiotics to the affected population", "Close all restaurants in the municipality", "Distribute educational flyers on hand hygiene"], "a": 0, "r": "In an outbreak investigation, identifying the source (index case/vehicle) and tracing contacts is essential to stop the chain of transmission and understand the spread."}, {"d": 6, "q": "Which physiological change of aging significantly alters the pharmacokinetics of medications in elderly patients?", "o": ["Decreased glomerular filtration rate (GFR) and reduced hepatic blood flow", "Increased gastric acid secretion", "Increased proportion of total body water", "Enhanced intestinal motility"], "a": 0, "r": "Aging causes decreased renal clearance (lower GFR) and reduced hepatic metabolism, which leads to a prolonged half-life of many drugs and an increased risk of toxicity."}, {"d": 6, "q": "A community health nurse is reviewing the demographic data of a town. The nurse notes that out of a population of 10,000 people, there were 50 NEW cases of tuberculosis diagnosed during the year 2025. Which epidemiological rate does this specific figure represent?", "o": ["Incidence rate", "Prevalence rate", "Mortality rate", "Attack rate"], "a": 0, "r": "Incidence refers to the number of NEW cases of a specific disease occurring in a defined population over a specific period of time. Prevalence refers to the TOTAL number of cases (old and new) at a specific point in time."}, {"d": 6, "q": "A home health nurse is assessing an 85-year-old client who takes 12 different prescription medications daily. The client complains of severe dizziness and dry mouth. What geriatric syndrome is the nurse primarily addressing?", "o": ["Polypharmacy and adverse drug events", "Normal age-related cognitive decline", "Early-onset Alzheimer's disease", "Hypochondriasis"], "a": 0, "r": "Polypharmacy (taking multiple medications, usually >5) is a major issue in geriatrics. Because older adults have decreased renal clearance and hepatic metabolism, they are at an exponentially higher risk for adverse drug events, drug interactions, and toxicity (causing dizziness, falls, confusion, dry mouth)."}, {"d": 6, "q": "A community nurse is educating a local neighborhood association about disaster preparedness. Which activity falls under the 'Mitigation' phase of the disaster management cycle?", "o": ["Updating local building codes to require earthquake-resistant structural designs", "Conducting a town-wide mock evacuation drill", "Setting up emergency triage tents immediately after a hurricane", "Rebuilding destroyed homes and infrastructure a year after a flood"], "a": 0, "r": "The Disaster Management Cycle has 4 phases: Mitigation (prevention/risk reduction, e.g., building codes, levees), Preparedness (planning/drills), Response (immediate action/triage during the event), and Recovery (rebuilding)."}, {"d": 6, "q": "A palliative care nurse is caring for an end-stage COPD patient who is experiencing severe dyspnea (air hunger) and terminal restlessness. The physician prescribes a continuous subcutaneous infusion of Morphine. The family expresses fear that the Morphine will suppress his breathing and cause his death. What is the nurse's best response?", "o": ["'The primary goal of the morphine is to relieve his severe air hunger and suffering. While it may slightly slow breathing, ensuring his comfort at this stage is our ethical priority.'", "'Do not worry, Morphine has absolutely no effect on the respiratory system.'", "'We must stop the Morphine immediately if his breathing rate drops below 12 breaths per minute.'", "'The morphine will actually cure his underlying lung disease and help him breathe normally again.'"], "a": 0, "r": "This scenario demonstrates the ethical 'Principle of Double Effect'. The primary, intended effect of the opioid in terminal care is to relieve agonizing pain/dyspnea. Even if a secondary, unintended consequence (respiratory depression) occurs and potentially hastens death, the action is ethically justified because the intent was purely palliative."}, {"d": 6, "q": "During a home visit, the nurse notices an elderly client has multiple unexplained bruises in various stages of healing, appears extremely withdrawn, and the client's caregiver answers all questions for them aggressively. What is the nurse's mandatory obligation?", "o": ["Report the suspected elder abuse to the appropriate adult protective services or local authorities", "Confront the caregiver immediately and demand they leave the home", "Document the findings and schedule another visit in one month to monitor", "Ask the client in front of the caregiver if they are being hit"], "a": 0, "r": "Nurses are mandatory reporters for suspected elder abuse (physical, emotional, financial, or neglect). If abuse is suspected based on objective findings and behavioral cues, it must be reported to protective authorities immediately. Confronting the abuser can put the victim in greater danger."}, {"d": 6, "q": "A public health nurse is reviewing the 'Epidemiological Triad' to understand the spread of a recent cholera outbreak. Which three components make up this model?", "o": ["Agent, Host, and Environment", "Incidence, Prevalence, and Mortality", "Pathogen, Vector, and Reservoir", "Primary, Secondary, and Tertiary Prevention"], "a": 0, "r": "The Epidemiological Triad (or Triangle) is the traditional model for infectious disease causation, consisting of an external Agent (the pathogen/toxin), a susceptible Host (the human), and an Environment that brings the host and agent together."}, {"d": 6, "q": "A community health nurse is conducting a workshop on vector-borne diseases. Which disease is primarily transmitted to humans by the bite of an infected Ixodes tick?", "o": ["Lyme Disease", "Malaria", "Dengue Fever", "West Nile Virus"], "a": 0, "r": "Lyme disease is a systemic infection caused by the spirochete Borrelia burgdorferi, which is transmitted exclusively by the bite of an infected black-legged tick (Ixodes tick)."}, {"d": 6, "q": "The public health department announces that a sufficiently high proportion of the community has been vaccinated against measles, making it highly unlikely that the disease will spread, even protecting those who cannot be vaccinated. What is this concept called?", "o": ["Herd Immunity (Community Immunity)", "Active Natural Immunity", "Passive Artificial Immunity", "Endemic Equilibrium"], "a": 0, "r": "Herd immunity occurs when a large portion of a community becomes immune to a disease (mostly through vaccination). This breaks the chains of transmission, indirectly protecting vulnerable individuals who cannot be vaccinated (e.g., newborns, immunocompromised)."}, {"d": 6, "q": "A nurse is performing a geriatric assessment on a 78-year-old male. The patient reports having to get up 4 to 5 times a night to urinate, a weak urinary stream, and a feeling that his bladder is never empty. What common age-related pathology should the nurse suspect?", "o": ["Benign Prostatic Hyperplasia (BPH)", "Renal Cell Carcinoma", "Type 2 Diabetes Mellitus", "Acute Glomerulonephritis"], "a": 0, "r": "BPH is an extremely common, non-cancerous enlargement of the prostate gland in older men. The enlarged prostate physically constricts the urethra, causing classic lower urinary tract symptoms: nocturia, weak stream, hesitancy, and incomplete emptying."}, {"d": 6, "q": "A public health nurse is analyzing the health statistics of a developing country. Which metric is considered the most universally sensitive indicator of a nation's overall health status, social well-being, and healthcare infrastructure?", "o": ["Infant Mortality Rate (IMR)", "Total Birth Rate", "Average Life Expectancy for males over 65", "Prevalence of Type 2 Diabetes"], "a": 0, "r": "The Infant Mortality Rate (the number of infant deaths per 1,000 live births before age 1) is recognized globally as the most sensitive, comprehensive indicator of a population's overall health, sanitation, nutrition, and access to maternal/pediatric healthcare."}, {"d": 6, "q": "An 80-year-old client is admitted to the hospital with acute confusion and a high fever. The client is profoundly deaf and uses hearing aids. When assessing this client, what is the best communication strategy for the nurse to employ?", "o": ["Ensure the hearing aids are in, face the client directly in a well-lit room, and speak clearly in a slightly lower pitch", "Shout loudly directly into the client's ear", "Speak very rapidly to keep the client's attention focused", "Avoid speaking entirely and use only complex written notes"], "a": 0, "r": "Presbycusis (age-related hearing loss) typically involves the loss of high-frequency tones. Shouting raises the pitch of the voice, making it harder to hear. The best strategy is to face the patient (allowing lip reading), use a normal/slightly lowered pitch, speak clearly, and eliminate background noise."}, {"d": 6, "q": "A community health nurse conducts a home evaluation for an elderly client who recently suffered a minor stroke resulting in left-sided weakness. Which finding in the home poses the GREATEST risk for injury?", "o": ["Small, unsecured throw rugs placed over smooth hardwood floors in the hallway", "A grab bar installed securely inside the bathtub", "A nightlight plugged into the hallway outlet", "A corded landline telephone placed securely on the nightstand next to the bed"], "a": 0, "r": "Falls are the leading cause of fatal and non-fatal injuries in older adults. Unsecured throw rugs, especially on slick surfaces like hardwood, are massive tripping/slipping hazards, particularly for a client with new hemiparesis/weakness."}, {"d": 6, "q": "A public health nurse is analyzing disease trends and notices that a specific, relatively rare respiratory virus has suddenly spread across three different continents, affecting thousands of people simultaneously. How should the nurse classify this event?", "o": ["Pandemic", "Epidemic", "Endemic", "Sporadic outbreak"], "a": 0, "r": "An 'epidemic' is an unexpected increase in the number of disease cases in a specific geographic area. When an epidemic spreads over multiple countries or continents, affecting a massive proportion of the global population, it is classified as a 'pandemic'."}, {"d": 6, "q": "A community health nurse is designing a program to reduce the incidence of Type 2 Diabetes in a high-risk neighborhood. The program involves building safe walking trails, subsidizing fresh vegetables at local markets, and offering free cooking classes. What level of prevention does this represent?", "o": ["Primary Prevention", "Secondary Prevention", "Tertiary Prevention", "Quaternary Prevention"], "a": 0, "r": "Primary prevention focuses on entirely avoiding the disease before it ever occurs. By promoting exercise (walking trails) and healthy eating (vegetables, cooking classes), the nurse is altering risk factors to prevent the onset of diabetes."}, {"d": 6, "q": "A 79-year-old patient who lives alone is brought to the clinic by a neighbor. The patient is wearing soiled clothes, smells strongly of urine, is severely malnourished, and has heavily overgrown toenails. The patient states, 'I just can't take care of myself anymore.' What is the nurse's priority concern?", "o": ["Self-neglect", "Active physical abuse by the neighbor", "Financial exploitation", "Normal age-related changes"], "a": 0, "r": "Self-neglect is the most common form of elder mistreatment. It occurs when an older adult cannot or will not provide for their own basic, essential needs (food, hygiene, medical care, safety), resulting in a severe threat to their health and life. This requires social services intervention."}, {"d": 6, "q": "A hospice nurse is visiting a patient with terminal bone cancer. The patient's respiratory rate is 8 breaths per minute, the skin is mottled and cool to the touch, and there is a loud 'rattling' sound when the patient breathes. The family is terrified the patient is choking. What is the nurse's most appropriate action?", "o": ["Reassure the family that the 'death rattle' is a normal part of the dying process, caused by relaxed throat muscles, and administer an anticholinergic medication like scopolamine", "Immediately perform deep nasotracheal suctioning to clear the airway", "Initiate emergency CPR and call 911", "Elevate the patient's legs to improve blood flow to the heart"], "a": 0, "r": "The 'death rattle' is caused by the accumulation of secretions in the throat as the patient loses the ability to swallow or cough. It is usually not painful for the patient. Deep suctioning is invasive, painful, and contraindicated in hospice. The best approach is family education, repositioning, and administering anticholinergics (like scopolamine or glycopyrrolate) to dry secretions."}, {"d": 6, "q": "A community health nurse is conducting a windshield survey of a new neighborhood. What is the primary purpose of this type of assessment?", "o": ["To make structured, initial, objective observations of the community's physical environment, housing, resources, and people by driving or walking through it", "To conduct in-depth, door-to-door medical interviews with every resident", "To collect blood and urine samples from the local population to test for lead poisoning", "To review the historical medical records stored at the local clinic"], "a": 0, "r": "A 'windshield survey' is a literal or figurative drive-through/walk-through of a community. It is a foundational epidemiological tool used to gather subjective and objective primary data about the physical environment (grocery stores, sidewalks, housing conditions, pollution) and the general demographic makeup of the people visible in the area."}, {"d": 6, "q": "An 88-year-old patient is admitted to a long-term care facility. The nurse understands that due to the normal physiological changes of aging in the integumentary system, the patient is at immense risk for skin breakdown. Which specific change makes the elderly skin so fragile?", "o": ["Loss of subcutaneous fat, thinning of the dermis, and decreased cellular turnover", "Increased production of collagen and elastin", "Hyperactivity of the sebaceous (oil) glands causing chronic maceration", "A massive increase in the vascularity and blood supply to the epidermis"], "a": 0, "r": "Normal aging causes the epidermis to thin and cellular turnover to slow. Crucially, the dermis loses its collagen and elastin, and the subcutaneous fat layer (which acts as a cushion over bony prominences) heavily atrophies. This combination results in paper-thin, dry, fragile skin that tears easily and breaks down rapidly under pressure."}, {"d": 6, "q": "A community health nurse is investigating a sudden cluster of Hepatitis A cases in a local neighborhood. The nurse determines that all the infected individuals ate at the same raw oyster bar. What is the mode of transmission for Hepatitis A in this scenario?", "o": ["Fecal-oral route via contaminated food", "Bloodborne transmission via shared utensils", "Airborne transmission via respiratory droplets", "Vector-borne transmission via a mosquito bite"], "a": 0, "r": "Hepatitis A is highly contagious and is transmitted almost exclusively through the fecal-oral route, most commonly via contaminated food (especially raw shellfish from contaminated water) or contaminated drinking water."}, {"d": 6, "q": "A public health nurse is investigating a foodborne illness outbreak at a local community picnic. Which classic epidemiological step involves determining the specific food item that caused the outbreak by comparing what the sick people ate versus what the healthy people ate?", "o": ["Conducting a retrospective case-control or cohort analytical study", "Implementing primary prevention strategies", "Declaring a global pandemic", "Conducting a windshield survey"], "a": 0, "r": "In an outbreak investigation, after identifying the cases, epidemiologists use analytical studies (like a retrospective case-control study) to compare the exposures (foods eaten) of those who got sick (cases) against those who did not (controls) to pinpoint the exact vehicle of transmission."}, {"d": 6, "q": "A community health nurse is designing an intervention to increase the use of bicycle helmets among school-aged children in a local municipality. According to public health frameworks, what level of prevention is this intervention?", "o": ["Primary Prevention", "Secondary Prevention", "Tertiary Prevention", "Quaternary Prevention"], "a": 0, "r": "Primary prevention focuses on entirely avoiding injury or disease BEFORE it occurs. Interventions like vaccinations, seatbelt laws, and helmet use are pure primary prevention."}, {"d": 6, "q": "A public health nurse is investigating an outbreak of cholera. The nurse notes that the disease is spreading rapidly through the population via a contaminated municipal water supply. What type of disease transmission does this represent?", "o": ["Common vehicle transmission", "Direct contact transmission", "Airborne transmission", "Vector-borne transmission"], "a": 0, "r": "When a disease is spread to multiple hosts from a single, shared, inanimate source (like contaminated water, food, or medication), it is classified as 'common vehicle' transmission."}, {"d": 6, "q": "A community health nurse is reviewing disease statistics. A new strain of influenza has caused an incredibly high number of cases across the entire globe, affecting nearly every country within a 3-month period. How should this spread be classified?", "o": ["A Pandemic", "An Epidemic", "An Endemic", "An Outbreak"], "a": 0, "r": "An epidemic becomes a pandemic when it spreads over several countries or continents, usually affecting a massive proportion of the global population. Endemic means a disease is constantly present at a baseline level in a specific geographic area."}, {"d": 6, "q": "A public health nurse is designing a tertiary prevention program for a community with a high rate of stroke. Which intervention perfectly exemplifies tertiary prevention?", "o": ["Establishing a comprehensive physical and speech rehabilitation center for stroke survivors to maximize their independent functioning", "Providing free blood pressure screenings at the local mall", "Hosting a massive community education campaign on the dangers of high sodium diets", "Administering the influenza vaccine to all elderly residents"], "a": 0, "r": "Tertiary prevention occurs AFTER a disease or injury has already happened and caused damage. Its entire goal is to halt further deterioration, prevent complications, and restore the patient to their highest possible level of functioning. Rehabilitation programs are the textbook definition of tertiary prevention."}, {"d": 6, "q": "A community health nurse is designing an educational program for elderly residents to prevent the leading cause of fatal and non-fatal injuries in this age group. What topic MUST the nurse focus on?", "o": ["Fall prevention strategies, including removing throw rugs and installing grab bars", "The dangers of mixing over-the-counter vitamins with prescription medications", "How to properly check blood sugar levels", "The importance of receiving the annual influenza vaccine"], "a": 0, "r": "According to the CDC and global health statistics, falls are unequivocally the leading cause of both fatal injuries and non-fatal trauma (like devastating hip fractures and traumatic brain injuries) among older adults (aged 65+)."}, {"d": 6, "q": "A public health nurse is reviewing the outbreak of a new, highly contagious disease. The 'Incidence Rate' of the disease suddenly quadruples in one month. What does this massive increase in 'Incidence' specifically tell the nurse?", "o": ["There is a massive surge in NEW cases of the disease occurring within that specific month", "The total number of people who have ever had the disease has quadrupled", "The disease is now killing four times as many people as before", "The disease has spread to four new countries"], "a": 0, "r": "Incidence strictly measures the number of NEWly diagnosed cases of a disease in a specific population over a specific period. A massive spike in incidence means the disease is actively and rapidly spreading, creating new infections. (Prevalence measures total existing cases)."}, {"d": 6, "q": "A public health nurse is reviewing an epidemiological report. The report details the total number of people in a specific city who are currently living with HIV during the year 2025. Which epidemiological term does this metric represent?", "o": ["Prevalence", "Incidence", "Mortality rate", "Attack rate"], "a": 0, "r": "Prevalence measures the TOTAL number of cases (both newly diagnosed and long-standing existing cases) of a disease present in a population at a specific point in time. It shows the total burden of the disease. Incidence only measures NEW cases over a specific time period."}, {"d": 6, "q": "A community health nurse is conducting an environmental assessment of an older home built in 1965, where a family with young toddlers resides. What specific environmental toxin is the nurse most concerned about in a home built during this era?", "o": ["Lead-based paint, which can cause severe neurological damage and developmental delays if ingested by the toddlers", "Asbestos insulation, which causes immediate childhood asthma", "Radon gas leaking from the roof, causing immediate skin burns", "Carbon monoxide emitted continuously by the drywall"], "a": 0, "r": "Lead was banned from residential paint in the US in 1978. Homes built before this heavily utilized lead-based paint. Toddlers naturally engage in hand-to-mouth behavior, ingesting paint chips or lead dust. Lead is highly neurotoxic to the developing brain, causing irreversible cognitive impairment, behavioral issues, and anemia."}, {"d": 6, "q": "A community health nurse is conducting an educational session on Lyme disease prevention. Which instruction should the nurse emphasize as the most effective primary prevention strategy?", "o": ["Wear long pants tucked into socks and use DEET insect repellent when walking in wooded or grassy areas", "Get the Lyme disease vaccine every 5 years", "Take prophylactic antibiotics immediately after any walk in the woods", "Avoid drinking unfiltered water from streams or lakes"], "a": 0, "r": "Lyme disease is transmitted by the bite of an infected Ixodes tick. Primary prevention focuses entirely on avoiding the bite. Since there is currently no human vaccine available on the market for Lyme disease, physical barriers (long clothes tucked in) and chemical barriers (DEET) are the absolute most effective preventative measures."}, {"d": 6, "q": "A community health clinic is hosting a massive health fair offering free mammograms and blood pressure checks to the public. According to public health frameworks, what level of prevention are these screenings?", "o": ["Secondary Prevention", "Primary Prevention", "Tertiary Prevention", "Quaternary Prevention"], "a": 0, "r": "Secondary prevention focuses on early detection, screening, and prompt treatment of a disease that already exists but is asymptomatic. Screenings (mammograms, Pap smears, BP checks, colonoscopies) do not prevent the disease from occurring; they simply catch it early."}, {"d": 6, "q": "A home health nurse is visiting an 85-year-old client who has a history of falls and uses a walker. Which environmental modification in the home provides the MOST significant reduction in fall risk?", "o": ["Removing all scattered throw rugs and ensuring the home is well-lit", "Installing soft, thick, high-pile carpeting throughout the house", "Suggesting the client wear smooth-soled slippers indoors", "Keeping all medications on the top shelf of the kitchen cabinet"], "a": 0, "r": "Throw rugs are the single largest environmental tripping hazard for the elderly, especially those using walkers or canes, as the devices catch on the edges. Removing them, along with ensuring excellent lighting, drastically reduces the physical risk of a fatal or debilitating fall. (Thick carpets make walkers difficult to push; smooth slippers cause slipping)."}, {"d": 6, "q": "A community health nurse is investigating a cluster of illnesses. Several residents developed severe diarrhea after swimming in a local public pool that was later found to be contaminated with Cryptosporidium. What is the mode of transmission for this pathogen?", "o": ["Fecal-oral transmission via contaminated recreational water", "Airborne transmission via evaporated pool chemicals", "Vector-borne transmission via mosquitos near the pool", "Direct contact transmission via shared pool towels"], "a": 0, "r": "Cryptosporidium is a highly resilient parasite (resistant to standard chlorine levels) that causes severe gastrointestinal illness. It is transmitted strictly through the fecal-oral route. Outbreaks frequently occur in public pools or water parks when an infected individual has fecal matter on their body, which then contaminates the water swallowed by others."}, {"d": 6, "q": "A public health nurse is investigating a cluster of illnesses. Several residents developed severe, profuse diarrhea after swimming in a local public pool that was later found to be contaminated with Cryptosporidium. What is the mode of transmission for this pathogen?", "o": ["Fecal-oral transmission via contaminated recreational water", "Airborne transmission via evaporated pool chemicals", "Vector-borne transmission via mosquitos near the pool", "Direct contact transmission via shared pool towels"], "a": 0, "r": "Cryptosporidium is a highly resilient parasite (resistant to standard chlorine levels) that causes severe gastrointestinal illness. It is transmitted strictly through the fecal-oral route. Outbreaks frequently occur in public pools or water parks when an infected individual has fecal matter on their body, which then contaminates the water swallowed by others."}, {"d": 6, "q": "A community health nurse is investigating an outbreak of a novel virus. To understand the dynamics of the outbreak, the nurse utilizes the Epidemiological Triangle. Which three elements comprise this foundational epidemiological model?", "o": ["Agent, Host, and Environment", "Incidence, Prevalence, and Mortality", "Person, Place, and Time", "Primary, Secondary, and Tertiary Prevention"], "a": 0, "r": "The Epidemiological Triangle (or Triad) is the standard model used to understand infectious disease transmission. It states that disease results from the complex interaction between an external Agent (the pathogen/toxin), a susceptible Host (the human), and an Environment that brings the host and agent together."}, {"d": 6, "q": "A community health nurse is setting up a free blood pressure and cholesterol screening booth at a local shopping mall. According to the foundational levels of public health prevention, what level of prevention does this activity represent?", "o": ["Secondary Prevention", "Primary Prevention", "Tertiary Prevention", "Quaternary Prevention"], "a": 0, "r": "Secondary prevention focuses on early detection, screening, and rapid intervention for a disease that is already present but asymptomatic. Blood pressure screenings, mammograms, Pap smears, and cholesterol checks do not *prevent* the disease (Primary); they merely *catch* it early."}, {"d": 6, "q": "A home health nurse is assessing an 82-year-old patient who recently developed a severe urinary tract infection. The patient's family states, 'He was perfectly fine yesterday, but today he doesn't know where he is, he's seeing spiders on the wall, and his confusion comes and goes every hour.' What geriatric syndrome does this rapid change describe?", "o": ["Delirium", "Dementia (Alzheimer's Disease)", "Major Depressive Disorder", "A severe ischemic stroke"], "a": 0, "r": "Delirium is an acute, sudden, and heavily fluctuating state of profound confusion, often accompanied by hallucinations. It is almost always a secondary, reversible symptom caused by a massive underlying medical issue in the elderly (classically, a UTI, infection, medication toxicity, or hypoxia). Dementia is a chronic, slow, irreversible decline."}, {"d": 6, "q": "During a massive earthquake, a nurse is performing triage outside a collapsed building using the START method. The nurse assesses a victim who is completely unresponsive and not breathing. The nurse repositions the patient's airway (head-tilt/chin-lift), but the patient remains apneic (no breathing). What triage tag color must the nurse assign?", "o": ["Black (Expectant/Deceased)", "Red (Immediate)", "Yellow (Delayed)", "Green (Minor)"], "a": 0, "r": "In mass casualty disaster triage, resources are severely limited. The rule for respirations is simple: if a patient is apneic, reposition the airway. If they start breathing, tag them Red. If they remain apneic after opening the airway, they are dead or unsalvageable with the current resources. They MUST be tagged Black (Expectant), and the nurse must immediately move on to save others."}, {"d": 6, "q": "A public health epidemiologist notes that Malaria is constantly present at a steady, baseline, predictable level within a specific geographic region in Sub-Saharan Africa, without massive unexpected spikes. How is this disease presence classified?", "o": ["Endemic", "Epidemic", "Pandemic", "Sporadic"], "a": 0, "r": "An 'Endemic' disease is one that is constantly present at a baseline or expected level within a specific geographic area or population (e.g., Malaria in parts of Africa, or the common cold worldwide). An 'Epidemic' is an unexpected, massive spike above that baseline."}, {"d": 6, "q": "A public health nurse is analyzing the outbreak of a new, highly virulent respiratory virus in a densely populated city. The nurse is tracking the 'Case Fatality Rate' (CFR). What exactly does this specific epidemiological metric measure?", "o": ["The proportion of people diagnosed with the disease who end up dying from it, indicating the severity or lethality of the disease", "The total number of new cases of the disease divided by the total population", "The total number of people who have the disease at any given time", "The rate at which the disease spreads from one person to another"], "a": 0, "r": "The Case Fatality Rate (CFR) is a measure of disease lethality. It represents the percentage of individuals diagnosed with a specific disease who die from that disease. (e.g., If 100 people catch the virus, and 10 die, the CFR is 10%). It does not measure how fast it spreads, only how deadly it is once contracted."}, {"d": 6, "q": "A community health nurse is designing an intervention to reduce the incidence of fatal drownings among toddlers in a coastal town. The nurse implements a program providing free, locked pool fences to all families with young children. According to public health frameworks, what level of prevention is this?", "o": ["Primary Prevention", "Secondary Prevention", "Tertiary Prevention", "Quaternary Prevention"], "a": 0, "r": "Primary prevention focuses on entirely avoiding injury or disease BEFORE it ever occurs. Installing physical safety barriers (like pool fences or seatbelts) physically blocks the hazard from reaching the child, completely preventing the injury from happening."}, {"d": 6, "q": "A public health nurse organizes a community vaccination drive for the seasonal influenza vaccine. What level of prevention does this represent?", "o": ["Primary Prevention", "Secondary Prevention", "Tertiary Prevention", "Quaternary Prevention"], "a": 0, "r": "Primary prevention aims to prevent disease before it occurs. Immunizations, health education, and sanitation are classic primary prevention measures."}, {"d": 6, "q": "An 82-year-old patient with presbycusis is being interviewed by the nurse. What communication technique is most effective?", "o": ["Face the patient directly, ensure good lighting, and speak clearly in a normal or slightly lower pitch", "Shout loudly directly into the patient's ear", "Speak very quickly in a high-pitched voice", "Communicate exclusively through written notes"], "a": 0, "r": "Presbycusis is age-related high-frequency hearing loss. Shouting raises the voice pitch, making it harder to understand. Facing the patient directly, using good lighting (for lip reading), and lowering pitch is most effective."}, {"d": 6, "q": "A nurse suspects physical elder abuse in a home health client due to unexplained bruises in various stages of healing. What is the nurse's mandatory obligation?", "o": ["Report the suspected abuse immediately to Adult Protective Services or local authorities", "Confront the family caregiver directly before reporting", "Wait for definitive proof before taking any action", "Document the bruises and re-evaluate in 30 days"], "a": 0, "r": "Nurses are legally mandated reporters for suspected elder abuse or neglect. Suspicions must be reported immediately to protective services without waiting for proof or confronting potential abusers."}, {"d": 6, "q": "A public health nurse is conducting an educational campaign encouraging all motorcyclists and bicyclists to wear protective helmets at all times. What level of public health prevention does this campaign represent?", "o": ["Primary Prevention", "Secondary Prevention", "Tertiary Prevention", "Quaternary Prevention"], "a": 0, "r": "Primary prevention aims to prevent an injury or illness before it ever occurs. Safety legislation, helmet mandates, seatbelt use, and vaccinations are classic primary prevention measures."}, {"d": 6, "q": "A community health nurse is reviewing the Chain of Infection. Which nursing action breaks the chain of infection at the 'Mode of Transmission' portal?", "o": ["Performing meticulous hand hygiene between every patient contact", "Administering a flu vaccine to a susceptible host", "Coughing into a tissue", "Sterilizing surgical instruments in an autoclave"], "a": 0, "r": "Hand hygiene is the single most effective way to break the chain of infection at the Mode of Transmission step by preventing pathogens from traveling via hands from one person to another."}, {"d": 6, "q": "A home health nurse is assessing an 80-year-old client's home for fall safety. Which modification is essential in the bathroom?", "o": ["Installing securely anchored grab bars inside the shower and next to the toilet", "Placing thick plush bath mats over smooth tiles", "Using low-wattage dim lighting in the bathroom at night", "Setting the water heater temperature to 140°F (60°C)"], "a": 0, "r": "Installing grab bars in the shower and beside the toilet provides stable physical support on slippery surfaces, significantly reducing bathroom fall risks in older adults."}, {"d": 6, "q": "An 75-year-old patient complains that they can no longer read fine print or thread a needle without holding the material at arm's length. What normal age-related visual change is this?", "o": ["Presbyopia", "Cataracts", "Glaucoma", "Macular Degeneration"], "a": 0, "r": "Presbyopia is the loss of lens elasticity in older adults, making it difficult to focus on near objects ('farsightedness of aging'). Reading glasses correct this."}, {"d": 6, "q": "The nurse is reviewing drug metabolism in geriatric patients. Which age-related physiological change in the kidneys increases the risk of medication toxicity in older adults?", "o": ["Decreased Glomerular Filtration Rate (GFR) and renal blood flow", "Increased renal blood flow and hyperfiltration", "Increased total body water percentage", "Increased serum albumin levels"], "a": 0, "r": "Aging reduces renal blood flow and GFR, slowing drug clearance and leading to accumulation and toxicity of renally cleared medications in older adults."}, {"d": 6, "q": "A disaster management nurse is involved in community planning to build flood barriers and update building codes before a hurricane hits. Which phase of the disaster management cycle is this?", "o": ["Mitigation Phase", "Response Phase", "Recovery Phase", "Evaluation Phase"], "a": 0, "r": "Mitigation involves taking preventative measures before a disaster occurs (e.g., building codes, levees, flood barriers) to reduce or eliminate long-term risk to human life and property."}, {"d": 6, "q": "A public health official states that 85% of the population has been vaccinated against measles, preventing the virus from spreading and protecting unimmunized infants. What is this concept?", "o": ["Herd Immunity (Community Immunity)", "Active Natural Immunity", "Passive Artificial Immunity", "Innate Immunity"], "a": 0, "r": "Herd immunity occurs when a sufficiently high percentage of a population is immune to an infectious disease, indirectly protecting individuals who cannot be vaccinated."}, {"d": 6, "q": "During a mass casualty incident, a nurse triages an adult disaster victim who is conscious, breathing at 36 breaths per minute, has a radial pulse of 110 bpm, and follows simple commands. What triage tag color should be assigned?", "o": ["Red (Immediate)", "Yellow (Delayed)", "Green (Minor)", "Black (Expectant)"], "a": 0, "r": "In the START triage system, any victim with a respiratory rate OVER 30 breaths per minute is immediately assigned a Red Tag (Immediate priority) regardless of consciousness or pulse."}, {"d": 6, "q": "A public health nurse is calculating the 'Case Fatality Rate' during an outbreak of a novel viral hemorrhagic fever. What does the Case Fatality Rate specifically measure?", "o": ["The proportion of persons diagnosed with a specific disease who die from that disease", "The total number of deaths from any cause in a population per year", "The number of new cases of a disease per 100,000 population", "The speed at which a disease spreads through a community"], "a": 0, "r": "The Case Fatality Rate (CFR) measures the severity or lethality of a disease. It is calculated as the number of deaths from a specific disease divided by the total number of confirmed cases of that disease, expressed as a percentage."}, {"d": 6, "q": "A community health nurse evaluates an outbreak of foodborne illness following a company picnic. Out of 100 people who ate the potato salad, 40 developed acute gastroenteritis. What is the Attack Rate for this specific exposure?", "o": ["40%", "25%", "60%", "10%"], "a": 0, "r": "The Attack Rate is a specialized incidence rate used during acute outbreaks. It is calculated as (Number of new cases among exposed persons / Total number of exposed persons) x 100. Here: (40 / 100) x 100 = 40%."}, {"d": 6, "q": "During an outbreak investigation, public health nurses map cases by geographical location, time of onset, and demographic characteristics (age, sex). Which branch of epidemiology does this represent?", "o": ["Descriptive Epidemiology", "Analytic Epidemiology", "Experimental Epidemiology", "Molecular Epidemiology"], "a": 0, "r": "Descriptive Epidemiology focuses on describing disease occurrence by Person, Place, and Time. It generates hypotheses about causes and transmission routes, whereas Analytic Epidemiology tests those hypotheses."}, {"d": 6, "q": "A community health nurse conducts tuberculosis (TB) contact tracing after a local resident is diagnosed with active pulmonary TB. What level of public health prevention does contact tracing represent?", "o": ["Secondary Prevention", "Primary Prevention", "Tertiary Prevention", "Quaternary Prevention"], "a": 0, "r": "Contact tracing aims to identify, screen, and diagnose secondary cases early (or identify latent infection) to provide prompt treatment before widespread transmission occurs. Screening and early identification constitute Secondary Prevention."}, {"d": 6, "q": "A nurse is teaching a community education class about reducing the risk of Lyme disease. Which primary prevention instruction should the nurse emphasize?", "o": ["Wear light-colored long pants tucked into socks, use DEET insect repellent, and inspect skin thoroughly after walking in wooded areas", "Take prophylactic oral Doxycycline every morning before hiking", "Obtain the mandatory annual Lyme disease vaccine", "Avoid drinking untreated well water in rural areas"], "a": 0, "r": "Primary prevention of Lyme disease focuses on avoiding tick bites (wearing protective clothing, DEET repellent, avoiding tall brush/woods). There is currently no human Lyme vaccine available."}, {"d": 6, "q": "A public health epidemiologist identifies that the prevalence of Type 2 Diabetes in a city has increased significantly over a 5-year period, even though the incidence rate remained constant. What factors can explain this increase in prevalence?", "o": ["Improved medical treatments allowing diabetic patients to live longer lives with the disease", "A rapid increase in mortality among diabetic patients", "A complete cure developed for diabetes", "Emigration of diabetic patients out of the city"], "a": 0, "r": "Prevalence = Incidence x Duration of disease. If incidence (new cases) remains stable, prevalence (total existing cases) increases if patients live longer with the chronic disease due to improved medical management."}, {"d": 6, "q": "A community health nurse evaluates a water supply contaminated with Vibrio cholerae following a natural disaster. Cholera is transmitted via which mode of pathogen transmission?", "o": ["Vehicle-borne transmission (contaminated water/food)", "Vector-borne transmission (mosquitoes/ticks)", "Airborne transmission (droplet nuclei)", "Direct contact transmission"], "a": 0, "r": "Vehicle-borne transmission occurs when an inanimate intermediate (vehicle)—such as contaminated water, food, blood, or fomites—transmits an infectious agent to a susceptible host. Cholera is a classic water-borne vehicle infection."}, {"d": 6, "q": "A nurse is reviewing the Epidemiological Triad model. In the context of Malaria, what represents the Vector, the Agent, and the Host?", "o": ["Vector = Anopheles mosquito; Agent = Plasmodium parasite; Host = Human", "Vector = Human; Agent = Anopheles mosquito; Host = Plasmodium parasite", "Vector = Stagnant water; Agent = Bacteria; Host = Mosquito", "Vector = Virus; Agent = Mosquito; Host = Human"], "a": 0, "r": "In vector-borne diseases like Malaria: the Agent is the pathogen (Plasmodium parasite); the Vector is the biological transmitter (female Anopheles mosquito); and the Host is the susceptible organism (Human)."}, {"d": 6, "q": "A public health nurse plans an intervention to reduce infant mortality in a low-income community. Which metric is considered the single most sensitive international indicator of a community's overall health status and quality of care?", "o": ["Infant Mortality Rate (IMR)", "Maternal Mortality Ratio (MMR)", "Gross Domestic Product (GDP)", "Crude Death Rate"], "a": 0, "r": "The Infant Mortality Rate (deaths under 1 year of age per 1,000 live births) is globally recognized as the single most sensitive indicator of a community's overall health status, sanitation, nutrition, and healthcare access."}, {"d": 6, "q": "A community health nurse assesses a rural agricultural community for organophosphate pesticide exposure among farmworkers. What clinical signs indicate acute anticholinesterase/organophosphate toxicity?", "o": ["SLUDGE mnemonic: Salivation, Lacrimation, Urination, Diarrhea, GI distress, and Emesis (plus miosis and bradycardia)", "Mydriasis, tachycardia, dry skin, and urinary retention", "Severe hypertension, hyperthermia, and hyperreflexia", "Hyperglycemia, polyuria, and polydipsia"], "a": 0, "r": "Organophosphates inhibit acetylcholinesterase, leading to massive cholinergic crisis. Symptoms are remembered by SLUDGE (Salivation, Lacrimation, Urination, Defecation, GI cramping, Emesis) plus bradycardia and pinpoint pupils (miosis). Atropine is the antidote."}, {"d": 6, "q": "A nurse is planning a primary prevention program for Cardiovascular Disease in an urban clinic. Which activity is a primary prevention measure?", "o": ["Teaching healthy dietary habits and regular aerobic exercise to high school students", "Screening adults for elevated serum cholesterol levels", "Providing cardiac rehabilitation exercises to patients post-myocardial infarction", "Administering daily Aspirin to a patient with known coronary artery disease"], "a": 0, "r": "Primary prevention seeks to prevent disease initiation. Educating youth on nutrition and physical activity stops atherosclerosis before it begins. Lipid screening is Secondary, and cardiac rehab/Aspirin therapy is Tertiary."}, {"d": 6, "q": "A public health nurse receives a notification that a local restaurant worker has been diagnosed with Hepatitis A. What intervention should be provided to non-immunized customers who ate at the restaurant 5 days ago?", "o": ["Administer the Hepatitis A vaccine (or Immune Globulin) as post-exposure prophylaxis within 14 days", "Isolate all customers in a quarantine facility for 30 days", "Administer broad-spectrum oral antibiotics", "Reassure customers that Hepatitis A is not transmitted via food"], "a": 0, "r": "Hepatitis A is transmitted via the fecal-oral route. Unvaccinated individuals exposed to Hepatitis A should receive post-exposure prophylaxis with the Hepatitis A vaccine (or IG) as soon as possible within 14 days of exposure."}, {"d": 6, "q": "A nurse manager in a public health clinic conducts a Community Health Needs Assessment (CHNA). What is the primary first step in conducting a CHNA?", "o": ["Gathering quantitative and qualitative data regarding the community's health status, demographics, and existing resources", "Implementing a new free vaccination clinic immediately", "Writing a grant proposal for hospital expansion", "Evaluating the success of past health education programs"], "a": 0, "r": "The first step of the nursing process/assessment in
