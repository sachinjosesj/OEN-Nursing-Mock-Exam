 breathing intact, but as spinal cord edema inevitably ascends in the hours following the trauma, it crushes the phrenic nerve roots, causing rapid, fatal diaphragmatic paralysis requiring immediate intubation."}, {"d": 2, "q": "A patient with a history of cirrhosis presents with massive ascites and complains of severe, sudden abdominal pain and a fever of 102°F. The nurse lightly taps the patient's abdomen and the patient screams in agony. What life-threatening complication of ascites should the nurse suspect?", "o": ["Spontaneous Bacterial Peritonitis (SBP)", "Ruptured esophageal varices", "Acute cholecystitis", "Hepatic encephalopathy"], "a": 0, "r": "Ascitic fluid is an excellent medium for bacterial growth. Spontaneous Bacterial Peritonitis (SBP) occurs when bacteria from the gut translocate into the sterile ascitic fluid. It presents with fever, severe abdominal pain, and extreme tenderness/rebound tenderness. It is a fatal emergency requiring immediate diagnostic paracentesis and IV antibiotics."}, {"d": 2, "q": "A patient is recovering from a radical mastectomy with axillary lymph node dissection on the right side. The patient asks the nurse why there is a bright pink band placed on their right wrist. What is the nurse's best explanation?", "o": ["'It is a strict warning to all staff that no blood pressures, IV lines, or blood draws can ever be done on this arm to prevent irreversible lymphedema.'", "'It indicates that you are a high fall risk due to the surgery.'", "'It warns staff that you have a severe allergy to the surgical anesthesia.'", "'It means you are allowed to have physical therapy on that arm today.'"], "a": 0, "r": "Removing axillary lymph nodes completely destroys the lymphatic drainage of that arm. Any trauma, constriction (BP cuffs), or skin puncture (IVs/blood draws) can cause massive fluid buildup that the arm cannot drain, leading to severe, permanent, and debilitating lymphedema."}, {"d": 2, "q": "A patient with a massive acute myocardial infarction is admitted to the cardiac ICU. The patient's blood pressure drops to 75/40 mmHg, their skin is cold and clammy, and they are producing 10 mL of urine per hour. The pulmonary artery catheter shows an elevated Pulmonary Artery Wedge Pressure (PAWP). Which type of shock is this?", "o": ["Cardiogenic Shock", "Hypovolemic Shock", "Neurogenic Shock", "Anaphylactic Shock"], "a": 0, "r": "Cardiogenic shock occurs when the heart's pumping ability is severely impaired, most commonly due to massive muscle necrosis from a myocardial infarction. The hallmark is 'pump failure,' leading to drastically low cardiac output, hypotension, and poor tissue perfusion (oliguria, cool skin) despite adequate or high fluid volume (high PAWP)."}, {"d": 2, "q": "A patient with severe heart failure is receiving a continuous IV infusion of Milrinone. What specific hemodynamic effect makes Milrinone (a phosphodiesterase inhibitor) highly effective, but also requires the nurse to continuously monitor the patient's blood pressure?", "o": ["It acts as an 'inodilator'—it increases myocardial contractility while causing massive systemic vasodilation, dropping the blood pressure", "It acts as a pure vasoconstrictor, drastically raising the blood pressure to force blood into the kidneys", "It slows the heart rate down to 40 bpm to allow the ventricles to fill completely", "It acts as a massive osmotic diuretic, pulling fluid out of the blood and causing dehydration"], "a": 0, "r": "Milrinone is unique; it is an 'inodilator.' It inhibits phosphodiesterase, which massively increases cardiac contractility (inotropy) while simultaneously relaxing vascular smooth muscle (vasodilation). This lowers afterload so the failing heart can pump easier, but it places the patient at high risk for profound hypotension."}, {"d": 2, "q": "A patient with a mechanical mitral valve replacement is admitted to the hospital with a massive pulmonary embolism. The patient is placed on a continuous IV Heparin infusion. The physician orders the aPTT to be kept between 60-80 seconds. What is the physiological rationale for this specific target range?", "o": ["To completely paralyze the coagulation cascade and prevent any further clot formation or extension on the artificial valve and in the lungs", "To dissolve the existing pulmonary embolism completely within 24 hours", "To slightly thicken the blood to prevent the mechanical valve from clicking too loudly", "To increase the production of platelets by the bone marrow"], "a": 0, "r": "The therapeutic aPTT for Heparin is strictly targeted (usually 1.5-2.5x baseline) to achieve profound anticoagulation. This does NOT dissolve the clot, but it completely paralyzes the coagulation cascade, preventing the existing PE from growing and stopping new clots from forming on the highly thrombogenic mechanical valve."}, {"d": 2, "q": "A patient is admitted with Acute Pancreatitis. The physician orders Lactated Ringer's IV at 250 mL/hr. The patient's urine output has been 15 mL/hr for the last two hours. What massive third-spacing complication of acute pancreatitis does this oliguria indicate?", "o": ["Severe hypovolemic shock caused by massive fluid shifting into the retroperitoneal space and abdominal cavity", "A direct toxic effect of pancreatic enzymes completely destroying the kidneys", "A sudden, massive internal hemorrhage from a ruptured spleen", "Normal physiological conservation of water by the kidneys during digestion"], "a": 0, "r": "In acute pancreatitis, massive inflammation and auto-digestion completely destroy capillary permeability in the abdomen. Liters of plasma leak out of the blood vessels and 'third space' into the retroperitoneal space and peritoneal cavity. This causes profound hypovolemic shock, drastically dropping renal perfusion and causing oliguria."}, {"d": 2, "q": "A patient with Chronic Kidney Disease (CKD) Stage 5 is prescribed Sevelamer (Renvela) and Calcium Acetate (PhosLo). The nurse must teach the patient to take these medications at what specific time to achieve their pharmacological purpose?", "o": ["Immediately prior to or with every meal and snack", "First thing in the morning, at least 1 hour before eating", "Right before going to bed at night", "Only when experiencing severe bone pain"], "a": 0, "r": "Sevelamer and Calcium Acetate are phosphate binders. In ESRD, the kidneys cannot excrete phosphorus. These drugs MUST be taken directly with food. They act as a chemical 'sponge' inside the stomach, binding to the phosphorus in the meal and carrying it out in the feces before it can be absorbed into the blood."}, {"d": 2, "q": "A patient is scheduled for a percutaneous liver biopsy. Immediately after the procedure, how must the nurse position the patient?", "o": ["On their right side with a small pillow or towel roll placed under the puncture site", "Flat on their back (supine) with the legs elevated", "On their left side to take pressure off the liver", "In a high-Fowler's position to prevent aspiration"], "a": 0, "r": "The liver is highly vascular, and a biopsy carries a massive risk of severe internal hemorrhage. Immediately post-biopsy, the patient MUST be positioned on their right side with a towel roll underneath to apply direct physical pressure (tamponade) to the liver puncture site to stop bleeding."}, {"d": 2, "q": "A patient with peptic ulcer disease asks the nurse why their stomach pain always wakes them up in the middle of the night and occurs 2 to 3 hours after eating. This specific pain pattern is most characteristic of which type of ulcer?", "o": ["Duodenal ulcer", "Gastric ulcer", "Esophageal ulcer", "Stress ulcer"], "a": 0, "r": "Duodenal ulcer pain typically occurs when the stomach is empty (2-3 hours postprandial) or in the middle of the night when acid is secreted without food to buffer it. Eating food usually RELIEVES the pain of a duodenal ulcer. (Gastric ulcer pain often worsens with eating)."}, {"d": 2, "q": "A patient returns to the unit following a cardiac catheterization via the right femoral artery. What is the priority nursing assessment and intervention during the first few hours post-procedure?", "o": ["Keep the right leg completely straight and frequently assess the right pedal pulses and insertion site for bleeding", "Encourage the patient to get out of bed and walk immediately to prevent DVT", "Perform vigorous range-of-motion exercises on the right leg", "Place the patient in a High-Fowler's position to improve breathing"], "a": 0, "r": "Following a femoral artery puncture, the patient is at extreme risk for massive arterial bleeding (hematoma/retroperitoneal bleed) and loss of blood flow to the limb. The affected leg MUST be kept completely straight (flat) for several hours, and pedal pulses/site checks must be done frequently."}, {"d": 2, "q": "The physician is preparing to remove a patient's chest tube. To prevent air from being sucked back into the pleural space during removal, what specific breathing instruction must the nurse give the patient?", "o": ["'Take a deep breath, hold it, and bear down (Valsalva maneuver) while the tube is pulled.'", "'Pant like a dog while the tube is being pulled.'", "'Exhale completely and hold your breath empty.'", "'Breathe normally and deeply during the removal.'"], "a": 0, "r": "To increase intrathoracic pressure and prevent atmospheric air from rushing back into the pleural space (causing a new pneumothorax) during chest tube removal, the patient must perform the Valsalva maneuver (take a deep breath, hold it, and bear down) at the exact moment the tube is pulled."}, {"d": 2, "q": "A patient receiving continuous ambulatory peritoneal dialysis (CAPD) is infusing the dialysate. When it is time to drain, the fluid is draining extremely slowly, and less fluid comes out than went in. What is the nurse's first, non-invasive action?", "o": ["Assist the patient to turn from side to side", "Advance the catheter deeper into the abdomen", "Push the fluid back in and leave it for another 4 hours", "Call the physician for an emergency laparotomy"], "a": 0, "r": "Insufficient outflow in peritoneal dialysis is most commonly caused by the catheter tip migrating into the omentum or a kink. The very first, simplest intervention is to have the patient change positions (turn side-to-side) to physically shift the fluid and unblock the catheter."}, {"d": 2, "q": "A patient has just returned to the medical unit after a diagnostic lumbar puncture. How should the nurse position the patient to prevent the most common post-procedure complication?", "o": ["Strictly flat (supine) in bed for 4 to 8 hours to prevent a severe spinal headache", "High-Fowler's position to promote drainage of cerebrospinal fluid", "On the left side with knees drawn to the chest", "Prone with the head turned to the side"], "a": 0, "r": "The most common and debilitating complication of a lumbar puncture is a 'spinal headache' caused by the leakage of CSF from the dural puncture site. Keeping the patient completely flat (supine) for 4-8 hours significantly reduces the hydrostatic pressure on the puncture site, preventing leakage and the headache."}, {"d": 2, "q": "A patient with a massive pulmonary embolism is in severe cardiogenic shock and right ventricular failure. Which treatment is indicated as the ultimate definitive, life-saving therapy if thrombolytics (tPA) are absolutely contraindicated?", "o": ["Emergency surgical Pulmonary Embolectomy", "Administration of high-dose oral Warfarin", "Placement of an Inferior Vena Cava (IVC) filter", "Increasing the continuous IV Heparin rate"], "a": 0, "r": "In a massive, hemodynamically unstable PE causing shock, if 'clot busters' (tPA) fail or cannot be used due to bleeding risks, the only definitive life-saving option is physically removing the massive clot via a surgical pulmonary embolectomy or advanced catheter-based extraction."}, {"d": 2, "q": "A patient with newly diagnosed Open-Angle Glaucoma is prescribed Timolol ophthalmic drops. The nurse teaches the patient to apply digital pressure to the inner canthus of the eye (punctal occlusion) for 1 minute after instilling the drops. What is the purpose of this technique?", "o": ["It prevents the medication from draining into the tear duct and being absorbed systemically, which could cause a dangerous drop in heart rate and bronchospasm", "It forcefully pushes the medication deeper into the eyeball to lower intraocular pressure faster", "It prevents the patient from blinking the medication out of the eye", "It stops the eye from producing excessive tears"], "a": 0, "r": "Timolol is a non-selective beta-blocker. If it drains through the nasolacrimal duct into the systemic circulation, it can cause severe systemic beta-blockade (bradycardia, hypotension, and fatal bronchospasm in asthmatics). Punctal occlusion physically blocks this drainage."}, {"d": 2, "q": "A patient with severe acute pancreatitis is admitted. The physician orders the patient to be placed on 'NPO' status. The patient's spouse asks the nurse why the patient cannot even have a sip of water. What is the most accurate physiological explanation?", "o": ["'Any food or fluid entering the stomach triggers the pancreas to release powerful enzymes, which will worsen the severe damage already happening inside the pancreas.'", "'The stomach is paralyzed from the pain medication and any water will cause him to vomit immediately.'", "'The water will dilute his blood too much while we are giving him IV fluids.'", "'He is going to need emergency surgery in the next hour, so his stomach must be completely empty.'"], "a": 0, "r": "The entry of any food or fluid into the stomach and duodenum stimulates the release of secretin and cholecystokinin. These hormones command the pancreas to secrete massive amounts of digestive enzymes. In pancreatitis, these enzymes are destroying the organ itself. NPO status 'turns off' the pancreas to let it heal."}, {"d": 2, "q": "A patient arrives in the ER after sustaining a deep laceration to the leg with a rusty nail. The patient has never received a tetanus vaccination in their lifetime. What is the standard prophylactic treatment for this patient?", "o": ["Administer both the Tetanus Toxoid (active vaccine) and Tetanus Immune Globulin (TIG) simultaneously in different arms", "Administer only the Tetanus Toxoid (active vaccine) and schedule a booster in 4 weeks", "Administer only the Tetanus Immune Globulin (TIG) to provide lifelong immunity", "Clean the wound thoroughly; no vaccinations are needed if it bleeds freely"], "a": 0, "r": "If a patient sustains a dirty, tetanus-prone wound and has an unknown or incomplete (zero) vaccination history, they must receive BOTH active immunity (the Tetanus Toxoid/Tdap vaccine) to start building their own antibodies, AND passive immunity (Tetanus Immune Globulin - TIG) to provide immediate, temporary antibodies to fight any current toxin. They are given in different sites."}, {"d": 2, "q": "A patient with a history of COPD is admitted with an acute exacerbation. The ABG reveals: pH 7.25, PaCO2 70 mmHg, PaO2 50 mmHg, HCO3 30 mEq/L. The patient is extremely lethargic and difficult to arouse. What is the nurse's absolute priority action?", "o": ["Prepare for immediate endotracheal intubation and mechanical ventilation", "Administer 100% oxygen via a non-rebreather mask to fix the hypoxia", "Administer a rapid IV bolus of Sodium Bicarbonate to correct the pH", "Administer a STAT dose of IV Flumazenil to reverse the lethargy"], "a": 0, "r": "The ABG shows severe, partially compensated Respiratory Acidosis with profound hypoxemia. A PaCO2 of 70 combined with lethargy indicates CO2 narcosis and impending respiratory arrest. The patient can no longer maintain their airway or ventilate. The absolute priority is securing the airway via intubation and mechanically removing the trapped CO2."}, {"d": 2, "q": "The nurse is monitoring a patient with a traumatic brain injury (TBI) who has an intracranial pressure (ICP) monitor. The current ICP is 22 mmHg (normal 5-15) and the Mean Arterial Pressure (MAP) is 80 mmHg. What is the patient's Cerebral Perfusion Pressure (CPP), and is it adequate?", "o": ["CPP is 58 mmHg; it is inadequate (ischemia is occurring)", "CPP is 58 mmHg; it is perfectly normal", "CPP is 102 mmHg; it is dangerously high", "CPP is 3.6 mmHg; brain death has occurred"], "a": 0, "r": "Cerebral Perfusion Pressure (CPP) = MAP - ICP. In this case, 80 - 22 = 58 mmHg. The normal, healthy target for CPP is 60 to 80 mmHg (some guidelines say 70-90 for TBI). A CPP below 60 means the blood pressure is not high enough to overcome the swelling in the brain, leading to severe cerebral ischemia and brain damage."}, {"d": 2, "q": "A patient with advanced heart failure has been taking Furosemide and Digoxin. The patient presents to the clinic complaining of extreme fatigue, muscle weakness, and leg cramps. The ECG shows flattened T-waves and prominent U-waves. Which electrolyte imbalance is the nurse assessing?", "o": ["Hypokalemia", "Hyperkalemia", "Hyponatremia", "Hypercalcemia"], "a": 0, "r": "Hypokalemia (potassium < 3.5 mEq/L) is a very common side effect of loop diuretics like Furosemide. Classic signs include severe muscle weakness, leg cramps, fatigue, and distinct ECG changes: flattened or inverted T-waves, ST depression, and the appearance of prominent U-waves. This also massively increases the risk of Digoxin toxicity."}, {"d": 2, "q": "A patient is admitted with suspected infective endocarditis. The physician orders three sets of blood cultures to be drawn. What is the correct protocol for drawing these cultures to ensure accurate results?", "o": ["Draw the three sets from three different venipuncture sites spaced at least 30-60 minutes apart BEFORE starting any antibiotics", "Draw all three sets at the exact same time from the same peripheral IV line", "Draw one set a day for three consecutive days while the patient is on broad-spectrum antibiotics", "Draw the cultures directly from the patient's existing central venous catheter"], "a": 0, "r": "To accurately diagnose endocarditis and rule out skin contamination (false positives), multiple sets of blood cultures must be drawn from different, distinct venipuncture sites. They are typically spaced 30-60 minutes apart, and they MUST absolutely be drawn BEFORE the first dose of antibiotics is administered."}, {"d": 2, "q": "A patient with chronic kidney disease (CKD) is prescribed Sevelamer (Renvela). The nurse is evaluating the effectiveness of this medication. Which laboratory finding indicates the medication is achieving its therapeutic goal?", "o": ["A decrease in serum phosphorus levels to within normal limits (2.5 - 4.5 mg/dL)", "An increase in serum hemoglobin levels to above 10 g/dL", "A decrease in serum potassium levels to below 5.0 mEq/L", "An increase in serum albumin levels"], "a": 0, "r": "Sevelamer is a non-calcium based phosphate binder. In CKD, the kidneys cannot excrete phosphorus, leading to dangerous hyperphosphatemia. Sevelamer is taken with meals to bind dietary phosphorus in the gut, preventing its absorption. Its sole therapeutic goal is to lower serum phosphorus levels."}, {"d": 2, "q": "A patient presents to the emergency room with severe right-sided flank pain that radiates down to the groin. The patient is restless, constantly pacing the room, and sweating profusely. The physician suspects nephrolithiasis (kidney stones). What is the nurse's priority intervention?", "o": ["Administer prescribed IV opioid analgesics and antiemetics immediately", "Strain all of the patient's urine through a fine mesh filter", "Encourage the patient to drink 3 liters of water rapidly", "Prepare the patient for an immediate emergency nephrectomy"], "a": 0, "r": "While straining urine to catch the stone for analysis is a critical nursing action, renal colic causes some of the most agonizing, severe pain imaginable (often accompanied by intense nausea/vomiting). The absolute highest priority according to Maslow's hierarchy and humane care is to control the excruciating pain with IV opioids and antiemetics."}, {"d": 2, "q": "A patient is admitted with a massive subarachnoid hemorrhage (SAH). The physician orders the head of the bed to be kept at 30 degrees, the room dark and quiet, and strict administration of Docusate Sodium (Colace). What is the specific physiological purpose of the Docusate Sodium?", "o": ["To prevent the patient from straining during a bowel movement (Valsalva maneuver), which would massively spike intracranial pressure and cause the aneurysm to re-rupture", "To treat the severe constipation caused by the blood irritating the brainstem", "To pull excess fluid from the brain into the gut, acting as an osmotic diuretic", "To prevent the development of a paralytic ileus during strict bed rest"], "a": 0, "r": "Docusate Sodium is a stool softener. In patients with an SAH, any straining (the Valsalva maneuver) heavily spikes thoracic pressure, which severely spikes intracranial pressure (ICP). This sudden spike in ICP can easily blow the fragile clot off the aneurysm, causing a catastrophic, fatal re-bleed."}, {"d": 2, "q": "A patient with a severe exacerbation of Heart Failure is admitted to the ICU. The physician orders a continuous IV infusion of Nitroprusside (Nipride). The nurse knows this medication must be protected from light. What toxic byproduct is produced if Nitroprusside is exposed to light or infused for too long?", "o": ["Cyanide (Cyanide Toxicity)", "Carbon Monoxide", "Ammonia", "Lactic Acid"], "a": 0, "r": "Sodium Nitroprusside is a massive, rapid-acting vasodilator. The molecule contains five cyanide groups. If exposed to light, or if infused at high doses for prolonged periods (especially in patients with renal/hepatic impairment), it breaks down and causes fatal Cyanide Toxicity (lactic acidosis, confusion, cherry-red skin). The IV bag MUST be wrapped in an opaque covering."}, {"d": 2, "q": "A patient is admitted to the emergency department experiencing an Acute Myocardial Infarction (AMI). The patient is clutching their chest and sweating profusely. The physician orders the 'MONA' protocol. What is the absolute FIRST medication in this protocol that the nurse should administer?", "o": ["Oxygen (if SpO2 is < 90%)", "Aspirin (chewed)", "Nitroglycerin (Sublingual)", "Morphine (IV push)"], "a": 0, "r": "While 'MONA' is the acronym, it is not the order of administration. The absolute first priority is Oxygen (if the patient is hypoxic) to immediately supply the dying heart muscle. If oxygen is fine, Aspirin is given immediately (chewed for rapid absorption) to physically stop the clot from growing larger. Nitroglycerin follows, and Morphine is the LAST resort if pain persists."}, {"d": 2, "q": "The nurse is evaluating the ABG of a patient admitted with severe Diabetic Ketoacidosis (DKA). The results are: pH 7.21, PaCO2 25 mmHg, HCO3 12 mEq/L. The patient is breathing at 36 breaths per minute. How should the nurse interpret this ABG?", "o": ["Partially Compensated Metabolic Acidosis", "Uncompensated Metabolic Acidosis", "Fully Compensated Respiratory Alkalosis", "Partially Compensated Respiratory Acidosis"], "a": 0, "r": "The pH is very low (acidosis). The HCO3 is very low (metabolic). The PaCO2 is also low (25), indicating the lungs are hyperventilating (Kussmaul respirations) to 'blow off' acid and try to fix the pH. Because the pH is still abnormal (7.21), the compensation is only PARTIAL."}, {"d": 2, "q": "A patient with advanced cirrhosis and massive ascites is prescribed Spironolactone. The patient's latest lab results show a serum potassium of 6.2 mEq/L. What is the nurse's priority action?", "o": ["Hold the Spironolactone, notify the physician, and request an ECG", "Administer the Spironolactone as ordered, because it lowers potassium", "Administer a STAT IV bolus of Potassium Chloride", "Encourage the patient to eat a large banana"], "a": 0, "r": "Spironolactone is a Potassium-SPARING diuretic. It holds onto potassium while excreting sodium and water. A potassium level of 6.2 is critically high and life-threatening. Giving Spironolactone will drive the potassium even higher, causing fatal cardiac arrhythmias. It must be held immediately."}, {"d": 2, "q": "A patient with a history of deep vein thrombosis is prescribed oral Warfarin. The physician orders a target INR of 2.0 to 3.0. The patient's morning lab results show an INR of 1.2. What does this result indicate to the nurse?", "o": ["The patient's blood is dangerously thick and prone to clotting; the Warfarin dose needs to be increased", "The patient's blood is dangerously thin; the Warfarin dose needs to be decreased", "The patient is perfectly within the therapeutic range", "The patient is experiencing a massive internal hemorrhage"], "a": 0, "r": "A normal, unmedicated INR is approximately 1.0. For a patient on Warfarin therapy for a DVT, the target is 2.0 to 3.0. An INR of 1.2 is sub-therapeutic. The patient's blood is not 'thin' enough, placing them at an extreme risk for developing another clot or a massive pulmonary embolism. The dose must be increased."}, {"d": 2, "q": "A patient arrives in the ER with a suspected stroke. A stat non-contrast head CT reveals a massive Hemorrhagic Stroke. The patient's blood pressure is 240/130 mmHg. The physician orders a continuous IV infusion of Nicardipine. What is the primary goal of this therapy?", "o": ["To rapidly and aggressively lower the blood pressure to stop the active bleeding in the brain", "To deliberately keep the blood pressure high to force blood into the ischemic penumbra", "To dissolve the blood clot causing the hemorrhage", "To paralyze the patient to prevent a seizure"], "a": 0, "r": "In an ischemic stroke, BP is allowed to run high. However, in a Hemorrhagic Stroke (a ruptured, bleeding vessel), extreme hypertension acts like a high-pressure fire hose, constantly pumping more blood into the brain tissue, increasing ICP, and causing herniation. The absolute priority is to aggressively lower the BP to stop the bleeding."}, {"d": 2, "q": "A patient with severe Asthma is prescribed a combination inhaler containing Fluticasone (a corticosteroid) and Salmeterol (a long-acting beta-agonist). What crucial teaching must the nurse provide to prevent a common, localized side effect?", "o": ["'You must rinse your mouth out with water and spit it out after every single use.'", "'You must swallow the water after rinsing your mouth to ensure you get the full dose.'", "'You should only use this inhaler when you are having a sudden, severe asthma attack.'", "'You must hold your breath for 30 seconds after using the inhaler.'"], "a": 0, "r": "Fluticasone is an inhaled corticosteroid. It suppresses the local immune system in the mouth and throat. If the residue is not washed away, the patient is at extremely high risk for developing oral candidiasis (Thrush). The patient MUST rinse their mouth and spit the water out after every use."}, {"d": 2, "q": "A patient with End-Stage Renal Disease (ESRD) is scheduled for their regular hemodialysis treatment at 10:00 AM. It is 08:00 AM, and the nurse is preparing to administer the patient's morning medications, including Lisinopril (an antihypertensive) and a daily multivitamin. What is the standard nursing action?", "o": ["Hold the Lisinopril and the multivitamin until after the dialysis treatment is complete", "Administer both medications with a large glass of water immediately", "Administer the Lisinopril, but hold the multivitamin", "Double the dose of both medications to ensure they aren't lost during dialysis"], "a": 0, "r": "Hemodialysis violently pulls fluid out of the vascular space, frequently causing severe hypotension. Administering an antihypertensive (Lisinopril) right before dialysis will cause a catastrophic drop in blood pressure during the treatment. Furthermore, many drugs and water-soluble vitamins are physically dialyzed (pulled out) by the machine, making them useless. They must be held until after treatment."}, {"d": 2, "q": "A patient with suspected Acute Meningitis has a lumbar puncture. The cerebrospinal fluid (CSF) results show clear fluid, normal glucose levels, slightly elevated protein, and a high WBC count with a lymphocytic predominance. What type of meningitis do these specific findings indicate?", "o": ["Viral (Aseptic) Meningitis", "Bacterial (Septic) Meningitis", "Fungal Meningitis", "A massive subarachnoid hemorrhage"], "a": 0, "r": "Viral (aseptic) meningitis is characterized by clear CSF, a normal glucose level (viruses don't eat glucose like bacteria do), slightly elevated protein, and a WBC count that is predominantly lymphocytes. Bacterial meningitis has cloudy fluid, incredibly low glucose, massive protein, and neutrophils."}, {"d": 2, "q": "A patient with a history of seizures is prescribed Phenytoin (Dilantin). The nurse is providing discharge teaching. Which severe, systemic side effect of this medication requires immediate medical attention?", "o": ["A severe, blistering skin rash accompanied by fever and mucosal peeling (Stevens-Johnson Syndrome)", "Mild overgrowth and bleeding of the gums (Gingival Hyperplasia)", "A slight reddish-brown discoloration of the urine", "Mild drowsiness and lethargy for the first few days"], "a": 0, "r": "While gingival hyperplasia (gum overgrowth) is a very common, expected, and non-emergent side effect of Phenytoin requiring good oral hygiene, Stevens-Johnson Syndrome (SJS) is a rare, fatal, massive immune reaction that causes the skin and mucous membranes to blister and literally slough off. A new rash requires immediate cessation of the drug."}, {"d": 2, "q": "A patient with acute decompensated heart failure is prescribed an intravenous infusion of Nesiritide (Natrecor). What is the specific physiological mechanism of this medication?", "o": ["It is a recombinant form of human B-type natriuretic peptide (BNP) that causes massive vasodilation and profound diuresis", "It is a potent beta-blocker that drastically slows the heart rate", "It is a strong inotrope that forces the heart to beat three times as hard", "It is a pure Alpha-1 agonist that causes massive peripheral vasoconstriction"], "a": 0, "r": "Nesiritide is synthetic Human B-type Natriuretic Peptide (BNP). It acts exactly like the body's natural BNP: it causes profound smooth muscle relaxation (vasodilation of veins and arteries, slashing preload and afterload) and forces the kidneys to aggressively excrete sodium and water (diuresis). It is used for severe, acute HF."}, {"d": 2, "q": "A patient is admitted to the ICU with severe Guillain-Barré Syndrome (GBS). The paralysis has ascended to the patient's mid-chest. Which specific diagnostic test is the absolute GOLD STANDARD to monitor whether this patient requires immediate emergency intubation?", "o": ["Serial measurements of Forced Vital Capacity (FVC) or Negative Inspiratory Force (NIF) using a spirometer", "Continuous monitoring of oxygen saturation via pulse oximetry", "A STAT chest X-ray to check for diaphragm paralysis", "Hourly Arterial Blood Gas (ABG) draws"], "a": 0, "r": "In GBS, the ascending paralysis eventually paralyzes the diaphragm and intercostal muscles. The most sensitive and predictive indicator of impending respiratory failure is a dropping Forced Vital Capacity (FVC) or Negative Inspiratory Force (NIF). Pulse oximetry is a late indicator; by the time SpO2 drops, the patient has already stopped breathing."}, {"d": 2, "q": "A patient is diagnosed with an acute deep vein thrombosis (DVT) in the left femoral vein. The physician orders a continuous IV infusion of Heparin. The patient's baseline platelet count is 220,000/mm³. On day 4 of the infusion, the platelet count drops to 90,000/mm³. What life-threatening complication has occurred?", "o": ["Heparin-Induced Thrombocytopenia (HIT)", "Disseminated Intravascular Coagulation (DIC)", "A massive pulmonary embolism", "Normal bone marrow suppression from the Heparin"], "a": 0, "r": "A drop in platelets of >50% from baseline, or a drop below 150,000, 4 to 14 days after starting Heparin strongly indicates Heparin-Induced Thrombocytopenia (HIT). This is a paradoxical immune reaction where the body destroys platelets while simultaneously creating massive, widespread micro-clots. The Heparin must be stopped immediately."}, {"d": 2, "q": "The nurse is caring for a patient who is 12 hours post-operative following a subtotal thyroidectomy. The patient complains of tingling around the mouth and fingers. The nurse assesses the patient and notes a positive Chvostek's sign. What medication must the nurse prepare to administer IMMEDIATELY?", "o": ["Intravenous Calcium Gluconate", "Intravenous Potassium Chloride", "Intramuscular Epinephrine", "Subcutaneous Insulin"], "a": 0, "r": "The parathyroid glands (which regulate calcium) are often accidentally damaged or removed during thyroid surgery. Tingling around the mouth (circumoral paresthesia) and a positive Chvostek's sign (facial twitching) are hallmark signs of severe, acute hypocalcemia. This can rapidly progress to fatal tetany or laryngeal spasm. IV Calcium Gluconate is the immediate antidote."}, {"d": 2, "q": "A patient with suspected meningitis has a lumbar puncture. The cerebrospinal fluid (CSF) analysis reveals cloudy fluid, massively elevated WBCs (mostly neutrophils), heavily elevated protein, and a drastically decreased glucose level. What type of meningitis does this indicate?", "o": ["Bacterial Meningitis", "Viral Meningitis", "Fungal Meningitis", "Aseptic Meningitis"], "a": 0, "r": "This is the classic profile of Bacterial Meningitis. The fluid is cloudy due to pus (WBCs/neutrophils). The protein is high due to inflammation and bacterial breakdown. Most critically, the glucose is drastically low because the massive bacterial load in the CSF is actively eating the glucose for energy."}, {"d": 2, "q": "A patient with a massive pulmonary embolism (PE) is in severe shock. The critical care team decides to initiate an immediate infusion of Alteplase (tPA). Because tPA will dissolve all clots in the patient's body, which of the following is an absolute, non-negotiable contraindication for this therapy?", "o": ["A history of a hemorrhagic stroke at any point in the patient's life", "A history of a minor concussion 5 years ago", "A diagnosis of Type 2 Diabetes", "Current menstruation"], "a": 0, "r": "Alteplase (tPA) is a profound thrombolytic. Any history of an intracranial hemorrhage (hemorrhagic stroke) at ANY time in the patient's life is an absolute contraindication, as the drug can dissolve the old, healed clot and cause a massive, fatal re-bleed in the brain."}, {"d": 3, "q": "A pregnant woman's Last Menstrual Period (LMP) began on April 10, 2026. Using Naegele's Rule, what is her Estimated Date of Delivery (EDD)?", "o": ["January 17, 2027", "January 10, 2027", "July 17, 2026", "December 17, 2026"], "a": 0, "r": "Naegele's Rule formula: EDD = LMP - 3 months + 7 days + 1 year. April 10 - 3 months = January 10 + 7 days = January 17, 2027."}, {"d": 3, "q": "A pregnant client at 20 weeks gestation undergoes routine antenatal assessment. Where should the nurse expect to palpate the fundal height?", "o": ["At the level of the umbilicus", "At the symphysis pubis", "Midway between symphysis pubis and umbilicus", "At the xiphoid process"], "a": 0, "r": "At 20 weeks gestation, the uterine fundus is palpated at the level of the umbilicus. From 24 to 36 weeks, fundal height in cm corresponds closely to weeks of gestation."}, {"d": 3, "q": "A pregnant woman at 32 weeks gestation is diagnosed with severe preeclampsia. She is started on an IV Magnesium Sulfate infusion. Which finding indicates Magnesium Sulfate TOXICITY?", "o": ["Absence of deep tendon reflexes (patellar reflex)", "Brisk deep tendon reflexes 3+", "Respiratory rate of 18 breaths/min", "Urine output of 50 mL/hour"], "a": 0, "r": "Loss of deep tendon reflexes (patellar reflex) is the earliest clinical sign of Magnesium Sulfate toxicity, followed by respiratory depression (<12/min) and cardiac arrest. Antidote is Calcium Gluconate."}, {"d": 3, "q": "What is the antidote for Magnesium Sulfate toxicity in an eclamptic patient?", "o": ["Calcium Gluconate 10% IV", "Protamine Sulfate", "Naloxone", "Vitamin K"], "a": 0, "r": "Calcium Gluconate 10% IV is the specific reversal agent for magnesium toxicity and must be readily available at the bedside during magnesium infusions."}, {"d": 3, "q": "A pregnant client at 34 weeks gestation presents with painless, bright red vaginal bleeding. What action is strictly CONTRAINDICATED?", "o": ["Digital vaginal examination", "External fetal heart rate monitoring", "Abdominal ultrasound examination", "Starting a large-bore IV line"], "a": 0, "r": "Painless bright red bleeding in the third trimester suggests Placenta Previa. Digital vaginal examination is strictly contraindicated because it can cause catastrophic placental separation and fatal hemorrhage."}, {"d": 3, "q": "A pregnant client at 36 weeks gestation presents with severe, continuous abdominal pain, dark vaginal bleeding, a hypertonic board-like uterus, and fetal bradycardia. What condition is present?", "o": ["Abruptio Placentae", "Placenta Previa", "Uterine Rupture", "Preterm Labor"], "a": 0, "r": "Premature separation of the placenta (Abruptio Placentae) presents with severe abdominal pain, dark vaginal bleeding, uterine tenderness/board-like rigidity, and fetal distress."}, {"d": 3, "q": "A primigravida at 38 weeks gestation has spontaneous rupture of membranes. The nurse observes the umbilical cord protruding from the vagina. What is the nurse's IMMEDIATE life-saving action?", "o": ["Insert a gloved hand into the vagina to lift the fetal presenting part off the cord", "Gently push the protruding cord back into the uterus", "Cover the cord with dry gauze and instruct the patient to walk", "Administer IV Oxytocin to speed delivery"], "a": 0, "r": "Cord prolapse cuts off fetal oxygenation. The nurse must immediately insert two gloved fingers into the vagina to exert upward pressure on the presenting part, relieving compression on the cord, and place the mother in Trendelenburg or Knee-Chest position while preparing for emergency C-section."}, {"d": 3, "q": "Following a spontaneous vaginal delivery, a patient experiences severe postpartum hemorrhage. The uterus is soft and boggy on palpation. What is the nurse's FIRST action?", "o": ["Perform firm continuous massage of the uterine fundus", "Administer IM Methylergonovine immediately", "Elevate the legs and apply cold packs to the abdomen", "Prepare the patient for emergency hysterectomy"], "a": 0, "r": "Uterine atony is the leading cause of postpartum hemorrhage. The immediate first action is firm fundal massage to stimulate uterine contraction and stop bleeding."}, {"d": 3, "q": "A postpartum nurse evaluates an Rh-negative mother who delivered a healthy Rh-positive newborn. When should Rh Immune Globulin (Rhogam) be administered?", "o": ["Within 72 hours postpartum", "At 12 weeks postpartum", "Within 1 hour of labor onset", "Only if the newborn shows jaundice"], "a": 0, "r": "Rh Immune Globulin (Rhogam) must be administered to an Rh-negative mother within 72 hours after delivering an Rh-positive infant to prevent maternal Rh sensitization."}, {"d": 3, "q": "A newborn evaluated at 1 minute after birth is pink with blue extremities, has a heart rate of 130 bpm, cries vigorously, flexes extremities actively, and sneezes when suctioned. What is the calculated APGAR score?", "o": ["9", "10", "7", "5"], "a": 0, "r": "APGAR scoring: Appearance = 1 (body pink, acrocyanosis), Pulse = 2 (>100 bpm), Grimace = 2 (cry/sneeze), Activity = 2 (active flexed tone), Respiration = 2 (vigorous cry). Total = 1 + 2 + 2 + 2 + 2 = 9."}, {"d": 3, "q": "A patient in active labor is attached to an external fetal monitor. The nurse observes uniform, bowl-shaped decelerations in the fetal heart rate that begin AFTER the peak of the uterine contraction and do not recover until after the contraction ends. What is the priority nursing action?", "o": ["Turn the patient on her left side, administer O2, and increase IV fluids", "Document the finding as a normal physiological response to head compression", "Prepare the patient for an immediate amnioinfusion", "Encourage the patient to push with the next contraction"], "a": 0, "r": "These are late decelerations, which indicate uteroplacental insufficiency and fetal hypoxia. Priority nursing actions (resuscitation bundle) include repositioning to the lateral side to improve blood flow, administering oxygen, and increasing IV fluids."}, {"d": 3, "q": "The nurse is analyzing a fetal monitor tracing and notes variable decelerations that appear as V or W shapes, independent of contractions. What is the most likely cause of this pattern?", "o": ["Umbilical cord compression", "Fetal head compression", "Uteroplacental insufficiency", "Maternal fever"], "a": 0, "r": "Using the VEAL CHOP mnemonic: Variable decelerations = Cord compression, Early decelerations = Head compression, Accelerations = Okay, Late decelerations = Placental insufficiency."}, {"d": 3, "q": "A pregnant patient at 10 weeks gestation presents to the emergency room with severe, unilateral lower abdominal pain and vaginal spotting. Her blood pressure is 85/50 mmHg, and heart rate is 122 bpm. What is the most likely diagnosis?", "o": ["Ruptured ectopic pregnancy", "Threatened abortion", "Placenta previa", "Normal early pregnancy cramping"], "a": 0, "r": "Severe unilateral lower quadrant pain, vaginal spotting, and signs of hypovolemic shock (hypotension, tachycardia) in the first trimester are classic signs of a ruptured ectopic pregnancy, a surgical emergency."}, {"d": 3, "q": "A patient is admitted to the labor and delivery unit at 39 weeks gestation. Her vaginal exam reveals she is 8 cm dilated, 100% effaced, and at +1 station. Which stage and phase of labor is this patient in?", "o": ["First stage, Transition phase", "First stage, Active phase", "Second stage, Latent phase", "Second stage, Active pushing phase"], "a": 0, "r": "The first stage of labor is cervical dilation (0-10 cm). The transition phase is the final and most intense part of the first stage (8-10 cm). The second stage begins only when fully dilated (10 cm) and ends with birth."}, {"d": 3, "q": "The nurse is caring for a patient who is 1 hour postpartum following a vaginal delivery. The fundus is boggy, displaced to the right side of the abdomen, and sits above the umbilicus. What is the nurse's next action?", "o": ["Assist the patient to empty her bladder", "Administer an IV bolus of Oxytocin", "Perform vigorous fundal massage for 15 minutes", "Prepare the patient for a manual extraction of retained placenta"], "a": 0, "r": "A fundus displaced to the side (usually the right) and above the umbilicus is a classic sign of a distended bladder. A full bladder prevents the uterus from contracting, leading to atony. The first action is to have the patient void."}, {"d": 3, "q": "A patient at 35 weeks gestation presents with a severe headache, blurred vision, and epigastric pain. Blood pressure is 175/115 mmHg. Proteinuria is 3+ on dipstick. Which lab tests should the nurse prioritize to check for HELLP syndrome?", "o": ["CBC (for platelets) and Liver Function Tests (AST/ALT)", "Serum calcium and magnesium levels", "Blood glucose and Hemoglobin A1C", "Urinalysis and urine culture"], "a": 0, "r": "HELLP syndrome stands for Hemolysis, Elevated Liver enzymes, and Low Platelets. It is a severe, life-threatening variant of preeclampsia. Checking platelets (CBC) and liver enzymes (AST/ALT, Bilirubin) is critical."}, {"d": 3, "q": "A pregnant patient with hyperemesis gravidarum is admitted to the hospital. The nurse should closely monitor the patient for which severe electrolyte imbalance?", "o": ["Hypokalemia and Metabolic Alkalosis", "Hyperkalemia and Metabolic Acidosis", "Hypernatremia and Respiratory Alkalosis", "Hypocalcemia and Respiratory Acidosis"], "a": 0, "r": "Severe, intractable vomiting causes massive loss of stomach acid (HCl) and potassium. This leads to profound hypokalemia and metabolic alkalosis, requiring IV fluid and electrolyte replacement."}, {"d": 3, "q": "Which infant is at the highest risk for developing physiological jaundice (hyperbilirubinemia) requiring phototherapy?", "o": ["A 36-week premature infant who is exclusively breastfed", "A 40-week term infant who is formula-fed", "A 39-week term infant delivered via elective C-section", "A 41-week post-term infant with a normal birth weight"], "a": 0, "r": "Prematurity (immature liver) and exclusive breastfeeding (decreased early intake delays meconium passage, increasing bilirubin reabsorption) are two major risk factors for neonatal jaundice."}, {"d": 3, "q": "A newborn is receiving phototherapy for hyperbilirubinemia. Which nursing intervention is essential to ensure the infant's safety?", "o": ["Cover the infant's eyes with opaque patches and assess them every 2-4 hours", "Apply a generous layer of lotion to the infant's skin to prevent drying", "Keep the infant wrapped in a warm blanket under the lights", "Restrict fluid intake to prevent fluid overload"], "a": 0, "r": "Phototherapy lights can cause severe retinal damage. Opaque eye patches must be worn whenever the infant is under the lights, and eyes must be assessed regularly for irritation/drainage. Lotions can cause burns under the lights, infants must be naked (except diaper) for max exposure, and fluids should be increased to promote bilirubin excretion."}, {"d": 3, "q": "A pregnant patient at 28 weeks gestation receives her 1-hour oral glucose tolerance test (OGTT) result, which is 155 mg/dL. What is the nurse's next step?", "o": ["Schedule the patient for a 3-hour oral glucose tolerance test", "Diagnose the patient with Gestational Diabetes Mellitus and prescribe insulin", "Reassure the patient that this is a normal result", "Instruct the patient to go strictly carbohydrate-free for the rest of her pregnancy"], "a": 0, "r": "A 1-hour OGTT result > 140 mg/dL is abnormal (screening). The next step is a diagnostic 3-hour oral glucose tolerance test to definitively diagnose Gestational Diabetes."}, {"d": 3, "q": "A nurse is assessing a full-term newborn's reflexes. When the nurse strokes the lateral edge of the infant's sole from the heel upward and across the ball of the foot, the toes fan out and the big toe dorsiflexes. How should the nurse interpret this?", "o": ["Normal Babinski reflex", "Abnormal Babinski reflex, indicating neurological damage", "Normal Moro reflex", "Abnormal Plantar grasp"], "a": 0, "r": "A positive Babinski reflex (toes fanning and big toe dorsiflexion) is entirely normal in infants up to 12-24 months of age due to incomplete myelination of the nervous system. In adults, it is a sign of upper motor neuron damage."}, {"d": 3, "q": "A pregnant woman who is HIV positive is in labor. Her membranes have just ruptured. Which obstetrical procedure should the nurse absolutely AVOID?", "o": ["Applying a fetal scalp electrode", "Administering IV Zidovudine (AZT)", "Performing a sterile vaginal examination", "Monitoring contractions externally"], "a": 0, "r": "Invasive procedures like fetal scalp electrodes, vacuum extraction, or forceps should be avoided in HIV-positive mothers because they break the fetal skin barrier and dramatically increase the risk of vertical transmission of HIV to the fetus."}, {"d": 3, "q": "A client receives epidural anesthesia during labor. Ten minutes later, her blood pressure drops from 120/80 to 90/50 mmHg. What is the nurse's FIRST action?", "o": ["Turn the client to the left lateral position and increase the IV fluid rate", "Administer IV Epinephrine immediately", "Stop the epidural infusion permanently", "Place the patient in an upright sitting position"], "a": 0, "r": "Maternal hypotension is the most common adverse effect of epidural anesthesia due to sympathetic blockade. The initial treatment is to turn the patient to her left side (to relieve vena cava compression) and administer an IV fluid bolus to increase intravascular volume."}, {"d": 3, "q": "During a prenatal visit at 36 weeks, the nurse performs Leopold's maneuvers. The nurse palpates a soft, irregular mass in the fundus and a round, hard, ballotable mass just above the symphysis pubis. What does this indicate?", "o": ["Cephalic presentation (vertex)", "Breech presentation", "Transverse lie", "Multiple gestation (twins)"], "a": 0, "r": "The hard, round, ballotable mass is the fetal head. If it is located at the symphysis pubis (bottom), and the soft, irregular mass (buttocks) is at the fundus (top), the fetus is in a normal cephalic (head-down) presentation."}, {"d": 3, "q": "A patient with pelvic inflammatory disease (PID) is being discharged. Which long-term complication must the nurse educate the patient about?", "o": ["Ectopic pregnancy and infertility", "Cervical cancer", "Polycystic Ovary Syndrome (PCOS)", "Endometriosis"], "a": 0, "r": "PID causes severe inflammation and scarring of the fallopian tubes. This scarring significantly increases the long-term risk of ectopic pregnancy and tubal-factor infertility."}, {"d": 3, "q": "A pregnant woman at 37 weeks gestation complains of sudden, severe, 'tearing' abdominal pain. She has a history of a previous classical Cesarean section. On assessment, the fetal heart rate has plummeted to 60 bpm, and the nurse can easily palpate fetal parts just under the abdominal skin. What catastrophic event has occurred?", "o": ["Uterine Rupture", "Placenta Previa", "Abruptio Placentae", "Normal engagement of the fetal head"], "a": 0, "r": "Uterine rupture is a catastrophic complication, most common in women with previous uterine scars (like a classical C-section). Classic signs include sudden tearing pain, cessation of contractions, profound fetal bradycardia, and the loss of fetal station or the ability to easily palpate fetal parts outside the uterus."}, {"d": 3, "q": "A postpartum patient who delivered 24 hours ago has a temperature of 38.2°C (100.8°F). She is breastfeeding and complains her breasts feel full and warm. Her lochia is rubra with no foul odor. What is the most likely cause of this temperature?", "o": ["Normal physiological engorgement", "Puerperal sepsis (Endometritis)", "Mastitis", "Deep Vein Thrombosis"], "a": 0, "r": "A mild temperature elevation (up to 38.0°C - 38.2°C) is normal in the first 24-48 hours postpartum due to dehydration from labor. Around day 2-3, a brief mild fever can also occur due to breast engorgement as milk comes in. Lack of foul lochia rules out endometritis; mastitis typically presents later with unilateral red streaks."}, {"d": 3, "q": "A neonate is born to a mother with Hepatitis B. What is the correct protocol for protecting the newborn from the virus?", "o": ["Administer the Hepatitis B vaccine AND Hepatitis B Immune Globulin (HBIG) within 12 hours of birth", "Administer only the Hepatitis B vaccine within the first 24 hours", "Isolate the infant and strictly prohibit breastfeeding", "Administer intravenous antiviral medications for 14 days"], "a": 0, "r": "To prevent vertical transmission of Hepatitis B, the newborn must receive both active immunity (Hepatitis B vaccine) and passive immunity (HBIG) within 12 hours of birth. Breastfeeding is safe after the infant has been cleansed and vaccinated."}, {"d": 3, "q": "A pregnant patient at 36 weeks gestation is undergoing a Non-Stress Test (NST). Over a 20-minute period, the nurse observes three fetal heart rate accelerations that peak at 15 bpm above baseline and last for 15 seconds each. How should the nurse interpret and document this test?", "o": ["Reactive NST; indicates a healthy, well-oxygenated fetus", "Non-reactive NST; indicates severe fetal hypoxia", "Positive Contraction Stress Test; indicates the fetus cannot tolerate labor", "Equivocal NST; requires immediate delivery"], "a": 0, "r": "A reactive (normal, reassuring) Non-Stress Test at ≥ 32 weeks requires at least two fetal heart rate accelerations peaking ≥ 15 bpm above baseline and lasting ≥ 15 seconds within a 20-minute window. This indicates an intact, well-oxygenated fetal autonomic nervous system."}, {"d": 3, "q": "A patient in active labor receives an epidural anesthetic. Fifteen minutes later, the fetal monitor shows late decelerations. The maternal blood pressure is 85/50 mmHg. After turning the patient on her left side and applying oxygen, the BP remains 85/50. What medication should the nurse anticipate administering?", "o": ["IV Ephedrine", "IV Labetalol", "IV Oxytocin", "IM Methylergonovine"], "a": 0, "r": "Severe maternal hypotension following an epidural causes uteroplacental insufficiency (evidenced by late decelerations). If repositioning and fluid boluses fail to restore blood pressure, IV Ephedrine (a vasopressor) is the drug of choice to quickly raise maternal BP and restore fetal perfusion."}, {"d": 3, "q": "A pregnant patient with Type 1 Diabetes is at 38 weeks gestation and goes into spontaneous labor. The nurse understands that due to maternal hyperglycemia during the pregnancy, the newborn is at highest risk for which complication immediately after birth?", "o": ["Profound hypoglycemia", "Severe hyperglycemia", "Congenital hypothyroidism", "Physiological jaundice requiring a blood transfusion"], "a": 0, "r": "Maternal glucose crosses the placenta, but maternal insulin does not. The fetus produces massive amounts of its own insulin to handle the high sugar. Once the cord is cut, the sugar supply stops abruptly, but the newborn's pancreas continues to pump out high insulin, leading to profound, rapid neonatal hypoglycemia."}, {"d": 3, "q": "A patient is admitted to the postpartum unit 2 hours after a prolonged vaginal delivery of a 10 lb (4.5 kg) infant. The nurse assesses the perineum and notes a massive, tense, purplish swelling on the right labia. The patient complains of excruciating, unrelenting perineal pain that is not relieved by ibuprofen. What is the most likely cause?", "o": ["A vaginal or vulvar hematoma", "Normal postpartum episiotomy swelling", "A prolapsed uterus", "A severe perineal laceration infection"], "a": 0, "r": "Excruciating, unremitting perineal/vaginal pain out of proportion to the visible injury, accompanied by a tense, bulging, purplish mass, is the hallmark sign of a postpartum hematoma (concealed bleeding into the tissues). This requires immediate surgical evaluation."}, {"d": 3, "q": "A nurse is teaching a new mother about breastfeeding. The mother asks how she can tell if her 4-day-old newborn is getting enough breast milk. What is the most reliable, objective indicator the nurse should provide?", "o": ["The infant should have 6 to 8 heavily wet diapers per day", "The infant sleeps for 6 continuous hours between feeds", "The mother feels her breasts empty completely after 5 minutes", "The infant cries loudly before every feeding"], "a": 0, "r": "The most objective, reliable indicator of adequate neonatal hydration and caloric intake in a breastfed infant is urinary output. By day 4 of life, the infant should have 6 to 8 heavily wet diapers every 24 hours."}, {"d": 3, "q": "A pregnant woman at 38 weeks gestation reports that her 'water broke.' The nurse performs a Nitrazine test on the vaginal fluid. The Nitrazine paper turns a deep, dark blue. What does this result indicate?", "o": ["Positive for amniotic fluid; the fluid is alkaline, confirming membrane rupture", "Negative for amniotic fluid; the fluid is highly acidic vaginal secretions", "Positive for severe vaginal yeast infection", "Equivocal; requires a blood test to confirm"], "a": 0, "r": "Normal vaginal secretions are acidic (pH 4.5-5.5) and leave Nitrazine paper yellow/olive. Amniotic fluid is uniquely alkaline (pH 7.0-7.5). If amniotic fluid is present (ruptured membranes), it turns the Nitrazine test strip a dark blue/blue-green."}, {"d": 3, "q": "A patient with severe preeclampsia is receiving a continuous IV infusion of Magnesium Sulfate. During the hourly assessment, the nurse notes the patient's respiratory rate is 10 breaths/min, and deep tendon reflexes (DTRs) are entirely absent (0). What is the nurse's absolute FIRST action?", "o": ["Stop the Magnesium Sulfate infusion immediately", "Administer IV Calcium Gluconate immediately", "Draw blood for a STAT serum magnesium level", "Apply oxygen via nasal cannula and chart the findings"], "a": 0, "r": "Absent DTRs and respiratory depression (< 12 bpm) are classic signs of severe, life-threatening Magnesium toxicity. The very first action must always be to STOP the infusion of the toxic agent. Then, the nurse will administer the antidote (Calcium Gluconate) and notify the physician."}, {"d": 3, "q": "A patient at 10 weeks gestation comes to the clinic with severe, unrelenting nausea and vomiting. She has lost 10% of her pre-pregnancy body weight, has severe dry mucous membranes, and her urinalysis shows 3+ ketones. What condition is this patient experiencing?", "o": ["Hyperemesis Gravidarum", "Normal 'morning sickness'", "Ectopic pregnancy", "Gestational Trophoblastic Disease (Molar pregnancy)"], "a": 0, "r": "Hyperemesis gravidarum goes far beyond normal 'morning sickness.' It is characterized by severe, intractable vomiting causing significant weight loss (>5%), severe dehydration, and starvation ketosis (ketonuria) requiring IV fluid/electrolyte hospitalization."}, {"d": 3, "q": "Following a precipitous vaginal delivery, a patient begins experiencing a massive postpartum hemorrhage. The nurse palpates the fundus and finds it to be firm, midline, and contracted. What is the most likely cause of this hemorrhage?", "o": ["Unrepaired cervical or vaginal lacerations", "Uterine atony", "A full, distended bladder", "Retained placental fragments"], "a": 0, "r": "Uterine atony is the #1 cause of PPH, but it presents with a soft, 'boggy' uterus. If the patient is bleeding heavily but the uterus is firmly contracted and midline, the nurse must strongly suspect active bleeding from deep lacerations of the cervix, vagina, or perineum."}, {"d": 3, "q": "A pregnant woman at 32 weeks gestation is brought to the ER following a high-speed motor vehicle collision. She is complaining of severe, continuous abdominal pain, her uterus feels board-like and rigid, and she is having dark red vaginal bleeding. The fetal monitor shows fetal bradycardia. What is the nurse's priority action?", "o": ["Activate the rapid response team and prepare the patient for an immediate emergency Cesarean section", "Perform a digital vaginal examination to determine cervical dilation", "Administer tocolytics (like Terbutaline) to stop the uterine contractions", "Place the patient flat on her back to stabilize her spine"], "a": 0, "r": "Blunt abdominal trauma is a major cause of Abruptio Placentae (premature separation of the placenta). A rigid, board-like abdomen, severe pain, dark bleeding, and fetal distress confirm a massive abruption. This is a profound surgical emergency requiring immediate C-section to save the mother and baby from exsanguination and asphyxia."}, {"d": 3, "q": "A patient in the active phase of labor complains of severe, excruciating back pain with every contraction ('back labor'). The nurse determines the fetus is in an occiput posterior (OP) position. What is the most effective non-pharmacological nursing intervention to relieve this specific type of pain?", "o": ["Apply firm counterpressure to the mother's sacral area during contractions", "Instruct the mother to bear down and push with all her strength", "Have the mother lie flat on her back with her legs elevated", "Apply ice packs to the mother's lower abdomen"], "a": 0, "r": "When a fetus is in the occiput posterior (OP) position, the hard back of the fetal skull grinds directly against the mother's sacrum during contractions, causing excruciating 'back labor'. Applying firm, steady counterpressure with a fist or heel of the hand directly to the sacrum is the most effective non-pharmacological way to alleviate this specific somatic pain."}, {"d": 3, "q": "A pregnant patient at 36 weeks gestation presents to the clinic. She reports feeling 'dizzy, faint, and lightheaded' every time she lies flat on her back on the examination table. What is the immediate physiological cause of this symptom?", "o": ["Supine Hypotensive Syndrome (Vena Cava Syndrome)", "Severe preeclampsia causing neurological changes", "Normal physiological anemia of pregnancy", "Gestational diabetes leading to sudden hypoglycemia"], "a": 0, "r": "When a woman in the late second or third trimester lies completely flat on her back (supine), the heavy, gravid uterus physically compresses the inferior vena cava against the spine. This massive compression drops venous return to the heart, slashing cardiac output and causing sudden, profound hypotension, dizziness, and fetal hypoxia. The treatment is turning the patient onto her left side."}, {"d": 3, "q": "A patient is admitted to labor and delivery at 39 weeks gestation. The nurse is monitoring her contractions. A normal, safe contraction pattern during active labor should NOT exceed which of the following frequencies and durations?", "o": ["Should not occur more than 5 times in 10 minutes, and should not last longer than 90 seconds", "Should occur every 1 minute and last for 120 seconds", "Should occur every 5 minutes and last for 30 seconds", "Should be continuous with no resting tone between them"], "a": 0, "r": "Uterine tachysystole (hyperstimulation) is defined as more than 5 contractions in a 10-minute window, or any single contraction lasting longer than 90 seconds. Contractions that are too frequent or too long do not allow the placenta time to refill with oxygenated maternal blood, causing severe fetal hypoxia and late decelerations."}, {"d": 3, "q": "A postpartum patient is receiving a continuous IV infusion of Oxytocin (Pitocin) for severe uterine atony and hemorrhage. Suddenly, the patient complains of a severe, blinding headache and begins to seize. The nurse notes the patient's urine output has dropped to 10 mL/hr. What severe complication of Oxytocin is occurring?", "o": ["Water Intoxication (Severe Hyponatremia)", "Anaphylactic Shock", "Uterine Rupture", "Pulmonary Embolism"], "a": 0, "r": "Oxytocin is structurally very similar to Antidiuretic Hormone (ADH). When given in massive, continuous doses for postpartum hemorrhage, it exerts a massive antidiuretic effect on the kidneys, causing the body to retain free water. This massive water retention violently dilutes the blood sodium (dilutional hyponatremia), leading to fatal cerebral edema, headaches, coma, and seizures (Water Intoxication)."}, {"d": 3, "q": "A newborn is delivered via emergency C-section. Upon assessment, the nurse notes the infant has a flat facial profile, a single palmar crease (simian crease), low-set ears, and a protruding tongue. These physical characteristics are hallmark signs of which genetic condition?", "o": ["Trisomy 21 (Down Syndrome)", "Turner Syndrome", "Fetal Alcohol Syndrome", "Cleft Lip and Palate"], "a": 0, "r": "Trisomy 21 (Down Syndrome) has distinct physical characteristics present at birth. The hallmark signs include a flat facial profile, up-slanting palpebral fissures, epicanthal folds, a single transverse palmar crease across the hand, low-set ears, hypotonia (floppiness), and a protruding tongue."}, {"d": 3, "q": "A patient at 39 weeks gestation is in active labor. The fetal monitor shows a baseline heart rate of 140 bpm with moderate variability. Suddenly, the nurse notes a deep, V-shaped deceleration down to 80 bpm that quickly returns to baseline. This deceleration has no consistent relationship to the uterine contractions. What is the nurse's FIRST action?", "o": ["Reposition the patient (e.g., to her side or knee-chest position)", "Prepare the patient for an immediate emergency Cesarean section", "Administer IV Oxytocin to speed up the labor process", "Document the finding as a normal early deceleration"], "a": 0, "r": "V-shaped or W-shaped decelerations that are abrupt and independent of contractions are Variable Decelerations, caused by umbilical cord compression. The immediate first action is to reposition the mother to shift the fetus off the cord."}, {"d": 3, "q": "A postpartum patient is diagnosed with deep vein thrombosis (DVT) in her left leg 3 days after delivering twins. The physician prescribes continuous IV Heparin. Which medication should the nurse ensure is readily available on the unit as the antidote?", "o": ["Protamine Sulfate", "Vitamin K (Phytonadione)", "Flumazenil", "Naloxone"], "a": 0, "r": "The specific reversal agent (antidote) for Heparin overdose or severe heparin-induced bleeding is Protamine Sulfate. Vitamin K is the antidote for Warfarin."}, {"d": 3, "q": "A pregnant patient at 32 weeks gestation is diagnosed with severe preeclampsia and is on a continuous Magnesium Sulfate infusion. The nurse assesses the patient and notes: BP 160/100, HR 88, RR 14, and Deep Tendon Reflexes (DTRs) are 2+. What is the nurse's interpretation of these findings?", "o": ["The patient is receiving a safe, therapeutic level of Magnesium Sulfate", "The patient is experiencing Magnesium toxicity; stop the infusion", "The Magnesium dose is too low and the patient is about to seize", "The patient requires immediate administration of Calcium Gluconate"], "a": 0, "r": "Magnesium sulfate is a CNS depressant used to prevent seizures in preeclampsia. Normal DTRs are 2+. A respiratory rate of 14 is normal (toxicity is <12). Therefore, these findings indicate the patient is stable and the magnesium level is therapeutic, not toxic."}, {"d": 3, "q": "A postpartum patient who delivered vaginally 4 hours ago complains of a constant trickle of bright red vaginal blood. The nurse palpates the fundus and finds it firmly contracted, hard, and midline at the umbilicus. What is the most likely cause of this bleeding?", "o": ["A cervical or vaginal laceration", "Uterine atony", "Retained placental fragments inside the uterus", "Normal lochia rubra flow"], "a": 0, "r": "If a postpartum patient is actively bleeding (constant trickle of bright red blood) but the uterus is firmly contracted (ruling out uterine atony), the nurse must suspect a traumatic laceration of the cervix, vagina, or perineum that was missed during delivery."}, {"d": 3, "q": "A patient at 35 weeks gestation presents to the obstetrical triage unit with severe, continuous abdominal pain. Her abdomen is rigid and board-like to palpation. She has dark red vaginal bleeding. What catastrophic complication is occurring?", "o": ["Abruptio Placentae (Placental Abruption)", "Placenta Previa", "Uterine Rupture", "Vasa Previa"], "a": 0, "r": "Premature separation of the placenta (Abruptio Placentae) causes severe internal bleeding behind the placenta. The classic triad is sudden severe abdominal pain, a hypertonic/rigid board-like uterus, and dark red vaginal bleeding. This is a massive emergency requiring immediate delivery."}, {"d": 3, "q": "A patient in active labor experiences spontaneous rupture of membranes. The nurse immediately assesses the fetal heart rate and notes profound, sustained bradycardia (60 bpm). The nurse looks at the perineum and sees the umbilical cord protruding from the vagina. What is the absolute FIRST physical action the nurse must take?", "o": ["Insert a sterile gloved hand into the vagina and push the fetal presenting part UP and OFF the umbilical cord", "Gently push the exposed umbilical cord back into the uterus to keep it moist", "Place the patient in a High-Fowler's position", "Administer a massive IV bolus of Oxytocin"], "a": 0, "r": "Cord prolapse cuts off all oxygen to the fetus. The nurse must physically insert a gloved hand to lift the fetal head off the cord to restore blood flow, and hold that position while the patient is rushed to the OR. Pushing the cord back in causes spasm and fatal hypoxia."}, {"d": 3, "q": "A postpartum patient who delivered 2 hours ago is experiencing a massive hemorrhage. The nurse palpates the fundus, expecting it to be boggy, but finds it is completely firm, midline, and contracted. What must the nurse suspect is the source of the bleeding?", "o": ["An undiagnosed laceration of the cervix, vagina, or perineum", "Uterine atony", "Retained placental fragments", "A full, distended bladder"], "a": 0, "r": "If the uterus is firmly contracted ('firm and midline') it is mechanically clamping down on the placental site vessels. Therefore, active, bright red bleeding in the presence of a firm uterus indicates a traumatic laceration that requires immediate surgical suturing."}, {"d": 3, "q": "A patient at 40 weeks gestation is admitted in active labor. The nurse performs a vaginal exam and notes the cervix is 5 cm dilated. Suddenly, the patient's membranes rupture, releasing thick, pea-soup green fluid. What is the nurse's immediate concern?", "o": ["Meconium aspiration syndrome in the newborn upon delivery", "Immediate maternal sepsis", "A ruptured ectopic pregnancy", "A normal, healthy progression of labor"], "a": 0, "r": "Green, thick amniotic fluid indicates the fetus has passed meconium (the first stool) in utero, usually due to a stress/hypoxic event. The massive danger is that when the infant takes its first breath at delivery, it will inhale this thick, sticky, irritating tar deep into its lungs, causing severe, fatal Meconium Aspiration Syndrome."}, {"d": 3, "q": "A patient with Gestational Diabetes delivers a 10 lb 2 oz (4.6 kg) macrosomic infant. One hour after birth, the infant is jittery, lethargic, and has a weak cry. What is the nurse's immediate action?", "o": ["Perform a heel stick to check the infant's blood glucose level", "Wrap the infant tightly in a warm blanket to treat hypothermia", "Administer a STAT dose of IV calcium gluconate", "Begin immediate cardiopulmonary resuscitation (CPR)"], "a": 0, "r": "Macrosomic infants of diabetic mothers are at extreme risk for profound neonatal hypoglycemia. Jitteriness, lethargy, poor feeding, and a weak cry are classic signs of hypoglycemia. The nurse must immediately check the blood sugar via heel stick and intervene (feed or IV dextrose)."}, {"d": 3, "q": "A pregnant patient at 36 weeks gestation presents to the clinic complaining of a continuous, severe headache, blurred vision, and 'spots' in her eyes. Her blood pressure is 165/110 mmHg. The nurse tests her urine and finds 3+ protein. What condition is this patient exhibiting?", "o": ["Severe Preeclampsia", "Mild Gestational Hypertension", "Normal third-trimester physiological changes", "Eclampsia"], "a": 0, "r": "A blood pressure >160/110, massive proteinuria (3+), and severe neurological symptoms (unremitting headache, visual disturbances like scotomata or blurred vision) are the absolute hallmark signs of Severe Preeclampsia. Eclampsia is only diagnosed once a SEIZURE has actually occurred."}, {"d": 3, "q": "A patient in active labor is receiving continuous epidural anesthesia. The maternal blood pressure drops from 120/80 to 80/40 mmHg. The fetal heart monitor shows late decelerations. What is the very FIRST nursing intervention?", "o": ["Turn the patient onto her left lateral side", "Administer an IV bolus of Ephedrine", "Administer a rapid bolus of IV Normal Saline", "Administer 10 L of oxygen via non-rebreather mask"], "a": 0, "r": "Epidural-induced hypotension causes massive uteroplacental insufficiency (hence the late decelerations). The absolute first mechanical step is to turn the mother onto her left side to completely remove the weight of the uterus from the inferior vena cava, maximizing venous return to the heart. IV fluids and ephedrine follow immediately after."}, {"d": 3, "q": "A pregnant woman at 38 weeks gestation is receiving a continuous IV infusion of Oxytocin to augment labor. The nurse analyzes the fetal monitor and observes 6 intense contractions in a 10-minute window. What is the nurse's immediate priority action?", "o": ["Stop the Oxytocin infusion immediately", "Turn the patient on her left side and administer oxygen", "Perform a sterile vaginal exam to check for cervical dilation", "Administer a STAT dose of IV Calcium Gluconate"], "a": 0, "r": "Six contractions in a 10-minute window is Uterine Tachysystole (hyperstimulation). The massive, relentless squeezing cuts off all blood and oxygen to the fetus, causing rapid fetal hypoxia and death. The absolute FIRST action to halt this process is to immediately STOP the medication (Oxytocin) that is causing the hyperstimulation."}, {"d": 3, "q": "A newborn is born via vaginal delivery. During the 1-minute APGAR assessment, the nurse notes the infant has a heart rate of 140 bpm, a strong, lusty cry, active spontaneous movement, a grimace and sneeze when the nares are suctioned, but the hands and feet are distinctly blue while the body is pink. What is the APGAR score?", "o": ["9", "10", "8", "7"], "a": 0, "r": "Pulse >100 = 2. Cry/Respirations strong = 2. Activity/Tone active = 2. Grimace/sneeze = 2. Appearance pink body/blue extremities (acrocyanosis) = 1. Total score = 2+2+2+2+1 = 9."}, {"d": 3, "q": "A postpartum nurse is assessing a patient who delivered a 9 lb 5 oz infant 2 hours ago. The nurse notes the patient has saturated two thick perineal pads in exactly 30 minutes. The patient is pale and tachycardic. What is the most common cause of early postpartum hemorrhage that the nurse must immediately assess for?", "o": ["Uterine Atony (failure of the uterus to contract)", "An undiagnosed vaginal laceration", "Disseminated Intravascular Coagulation (DIC)", "Uterine inversion"], "a": 0, "r": "Uterine atony is by far the most common cause of early (primary) postpartum hemorrhage. The massive uterine muscle fibers must clamp down tightly like a tourniquet to crush the bleeding blood vessels left behind by the placenta. If the muscle fails to contract (atony), massive exsanguination occurs. The nurse must immediately palpate and massage the fundus."}, {"d": 3, "q": "A patient at 32 weeks gestation presents to the clinic with painless, bright red vaginal bleeding. The physician orders a transabdominal ultrasound. Why is a standard digital vaginal examination strictly CONTRAINDICATED?", "o": ["The patient likely has Placenta Previa, and a digital exam could easily puncture the placenta, causing massive, fatal maternal and fetal hemorrhage", "The patient likely has an ectopic pregnancy, and a digital exam will rupture the fallopian tube", "A digital exam will instantly trigger premature labor contractions", "A digital exam will introduce a fatal bacterial infection into the amniotic sac"], "a": 0, "r": "Painless, bright red bleeding in the third trimester is the hallmark of Placenta Previa (where the placenta implants over the cervical opening). If a nurse or doctor inserts their fingers into the vagina and through the cervix, they will push their fingers directly THROUGH the placenta, causing catastrophic exsanguination. Diagnosis is exclusively via ultrasound."}, {"d": 3, "q": "A patient is admitted to labor and delivery. Her membranes ruptured 24 hours ago. Her temperature is 101.5°F (38.6°C), her heart rate is 120 bpm, and the fetal heart rate is 170 bpm. The amniotic fluid is yellow and foul-smelling. What massive complication does the nurse suspect?", "o": ["Chorioamnionitis (intra-amniotic infection)", "Abruptio Placentae", "Uterine Rupture", "Normal progression of prolonged labor"], "a": 0, "r": "Once the amniotic sac (water) breaks, the sterile barrier protecting the fetus is gone. If delivery does not occur promptly (usually within 18-24 hours), ascending bacteria from the vagina infect the uterus and amniotic fluid. Maternal fever, maternal/fetal tachycardia, uterine tenderness, and foul-smelling fluid are the classic signs of Chorioamnionitis."}, {"d": 3, "q": "A patient at 39 weeks gestation is in active labor. The fetal heart monitor shows a pattern of variable decelerations. The nurse performs a vaginal exam and palpates a pulsating, rope-like structure in the vaginal canal. What is the absolute FIRST action the nurse must take?", "o": ["Using a sterile gloved hand, push the fetal presenting part UP and AWAY from the prolapsed umbilical cord", "Immediately place the patient flat on her back with her legs straight", "Cover the protruding cord with a dry, sterile towel", "Push the umbilical cord back up into the uterus"], "a": 0, "r": "A prolapsed umbilical cord is a profound emergency where the fetal head crushes the cord, cutting off all oxygen. The absolute first, life-saving action is for the nurse to manually lift the fetal head off the cord to restore blood flow, and hold it there while the patient is rushed to the OR. The patient should be placed in a knee-chest or extreme Trendelenburg position."}, {"d": 3, "q": "A pregnant patient with severe preeclampsia is receiving a continuous infusion of Magnesium Sulfate. The nurse assesses the patient and finds her respiratory rate is 8 breaths per minute, deep tendon reflexes are absent, and she is unarousable. After stopping the infusion, what medication must the nurse administer immediately?", "o": ["Calcium Gluconate IV", "Naloxone (Narcan) IV", "Flumazenil IV", "Protamine Sulfate IV"], "a": 0, "r": "The patient is in severe, life-threatening Magnesium toxicity (respiratory depression, absent reflexes, coma). Calcium Gluconate is the specific, direct physiological antagonist (antidote) for magnesium toxicity and must be administered immediately via slow IV push to reverse the respiratory and cardiac depression."}, {"d": 3, "q": "A pregnant patient at 37 weeks gestation is diagnosed with Oligohydramnios. The nurse understands that this severe lack of amniotic fluid places the fetus at highest risk for which intrapartum complication?", "o": ["Severe umbilical cord compression leading to variable decelerations and hypoxia", "Massive postpartum hemorrhage due to uterine overdistension", "A prolapsed umbilical cord during membrane rupture", "Fetal macrosomia (an excessively large baby)"], "a": 0, "r": "Amniotic fluid acts as a cushion. In oligohydramnios (too little fluid), there is no cushion to protect the umbilical cord from the contracting uterus or the moving fetus. The cord gets severely crushed, cutting off oxygen and causing deep variable decelerations on the fetal monitor."}, {"d": 3, "q": "A patient in active labor experiences a sudden drop in the fetal heart rate to 70 bpm. The nurse assesses the perineum and observes the umbilical cord protruding from the vagina. What is the immediate, life-saving nursing action?", "o": ["Insert a sterile gloved hand into the vagina and apply upward pressure on the fetal presenting part", "Gently push the umbilical cord back inside the uterus to keep it warm", "Place the patient in a High-Fowler's position and administer oxygen", "Administer a rapid IV bolus of Oxytocin (Pitocin) to expedite delivery"], "a": 0, "r": "In a prolapsed umbilical cord, the fetus's head completely crushes the cord against the pelvis, cutting off all oxygen. The nurse must immediately push the presenting part UP and OFF the cord with a gloved hand and hold it there while the patient is rushed to the OR for an emergency C-section. Pushing the cord back in causes spasm and cuts off blood flow."}, {"d": 3, "q": "A pregnant woman at 34 weeks gestation presents to the triage unit complaining of a sudden gush of clear fluid from her vagina. The nurse performs an amnisure test and it is positive. The fetal heart rate is 140 with moderate variability. The mother has no contractions. What is the nurse's priority concern and assessment focus for this pa
